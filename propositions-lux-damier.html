<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le damier d'accueil — quatre robes</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 16px 18px}
.lab{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.sub{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:3px;display:block}
.ht{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.85;font-size:28px;margin-bottom:12px}
.tdo{display:inline-block;position:relative;width:.62em;height:.62em;margin:0 .02em 0 .05em;vertical-align:-.02em}
.tdo::before{content:'';position:absolute;inset:0;background:#f8763f;
  -webkit-mask:url('picto/ico-donut.svg') center/contain no-repeat;mask:url('picto/ico-donut.svg') center/contain no-repeat}
.tdo::after{content:'';position:absolute;left:50%;top:50%;width:12%;height:12%;transform:translate(-50%,-50%);border-radius:50%;background:#1b1b1b}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
.g{display:grid;grid-template-columns:1fr 1fr}
.c{padding:12px;display:flex;flex-direction:column}
.c .pi{margin:auto auto 0;align-self:flex-end}
.cs{flex-direction:row;align-items:center;gap:9px;padding:11px 12px}
.cw{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;padding:13px 12px}
</style>
</head>
<body>
<div class="wrap">
<h1>Le damier d'accueil — quatre robes</h1>
<p class="intro">Même damier (ticket, démarches, linge, poubelles, ma liste) — quatre habillages, du contraste à la couleur.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgTicket=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+c+'"><path fill-rule="evenodd" d="M3 5.4h18a1.4 1.4 0 0 1 1.4 1.4v3.1a2.5 2.5 0 0 0 0 5v3.1a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4v-3.1a2.5 2.5 0 0 0 0-5V6.8A1.4 1.4 0 0 1 3 5.4zm12.4 2.4v1.8h1.9V7.8zm0 3.3v1.8h1.9v-1.8zm0 3.3v1.8h1.9v-1.8z"/></svg>';
const svgListe=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+c+'"><circle cx="4.6" cy="6" r="2.4"/><circle cx="4.6" cy="12" r="2.4"/><circle cx="4.6" cy="18" r="2.4"/><rect x="9.4" y="4.4" width="12.2" height="3.2" rx="1.6"/><rect x="9.4" y="10.4" width="12.2" height="3.2" rx="1.6"/><rect x="9.4" y="16.4" width="12.2" height="3.2" rx="1.6"/></svg>';
function titre(){return '<div class="ht">Vous cherchez<br>qu<span class="tdo"></span>i ?</div>'}

/* mode: chaque case = [bg, texte, picto, bordures?] */
function damier(m){
  // m(key) -> {bg, ink, pic, lab}
  const T=m('ticket'), D=m('dem'), L=m('linge'), P=m('poub'), M=m('liste');
  const b='1px solid #d6d4d0';
  return '<div class="g" style="border:'+b+'">'+
   '<div class="c" style="min-height:126px;background:'+T.bg+';border-right:'+b+';border-bottom:'+b+'">'+
     '<span class="lab" style="color:'+T.ink+'"><span class="tdot" style="background:'+(T.dot||'#6cb392')+'"></span>Le ticket</span>'+
     '<span class="sub" style="color:'+T.sub+'">9 sorties aujourd\'hui</span>'+
     '<span class="pi">'+svgTicket(T.pic,40)+'</span></div>'+
   '<div class="c" style="min-height:126px;background:'+D.bg+';border-bottom:'+b+'">'+
     '<span class="lab" style="color:'+D.ink+'"><span class="tdot" style="background:'+(D.dot||'#b28b7a')+'"></span>Démarches</span>'+
     '<span class="sub" style="color:'+D.sub+'">AMU · RIS · Mutuelle…</span>'+
     '<span class="pi">'+pico('ico-demarches.svg',D.pic,40)+'</span></div>'+
   '<div class="c cs" style="background:'+L.bg+';border-right:'+b+';border-bottom:'+b+'">'+
     pico('linge.svg',L.pic,20)+'<span class="sub" style="margin:0;color:'+L.sub+'">Linge · 2e étage</span></div>'+
   '<div class="c cs" style="background:'+P.bg+';border-bottom:'+b+'">'+
     pico('notif-poubelle.svg',P.pic,20)+'<span class="sub" style="margin:0;color:'+P.sub+'">Vendredi · 3 noires</span></div>'+
   '<div class="c cw" style="background:'+M.bg+'">'+
     '<span class="lab" style="color:'+M.ink+'"><span class="tdot" style="background:'+(M.dot||'#5b8fd4')+'"></span>Ma liste du jour</span>'+
     '<span style="flex:1"></span>'+svgListe(M.pic,32)+'</div>'+
  '</div>';
}
const V=[
 ['d1','1 — Les vedettes noires','Les deux grandes cases (ticket, démarches) passent en NOIR avec le picto en couleur — le regard tombe dessus. Le reste au trait.',
  ()=>titre()+damier(k=>({
    ticket:{bg:'#1b1b1b',ink:'#f4f3f1',sub:'rgba(244,243,241,.6)',pic:'#6cb392',dot:'#6cb392'},
    dem:{bg:'#1b1b1b',ink:'#f4f3f1',sub:'rgba(244,243,241,.6)',pic:'#b28b7a',dot:'#b28b7a'},
    linge:{bg:'transparent',sub:'#5a564e',pic:'#6cb392'},
    poub:{bg:'transparent',sub:'#e63329',pic:'#1b1b1b'},
    liste:{bg:'transparent',ink:'#1b1b1b',sub:'#8b8984',pic:'#1b1b1b'}}[k]))],
 ['d2','2 — Les fonds doux','Chaque case prend le fond PALE de sa couleur : vert d\'eau, beige, bleu pâle. Pictos noirs, calme et coloré à la fois.',
  ()=>titre()+damier(k=>({
    ticket:{bg:'#e0efe6',ink:'#1b1b1b',sub:'#3c6b52',pic:'#1b1b1b'},
    dem:{bg:'#efe6dd',ink:'#1b1b1b',sub:'#7a5c48',pic:'#1b1b1b'},
    linge:{bg:'#e7f3ef',sub:'#2f7d68',pic:'#2f7d68'},
    poub:{bg:'#fdf0ec',sub:'#c13515',pic:'#c13515'},
    liste:{bg:'#e3ecf7',ink:'#1b1b1b',sub:'#44618d',pic:'#1b1b1b'}}[k]))],
 ['d3','3 — Pleines couleurs','Tes pavés du main : les cases en couleur FRANCHE, texte et pictos noirs. Le plus vivant.',
  ()=>titre()+damier(k=>({
    ticket:{bg:'#6cb392',ink:'#1b1b1b',sub:'rgba(27,27,27,.65)',pic:'#1b1b1b',dot:'#1b1b1b'},
    dem:{bg:'#b28b7a',ink:'#1b1b1b',sub:'rgba(27,27,27,.65)',pic:'#1b1b1b',dot:'#1b1b1b'},
    linge:{bg:'#f3c6da',sub:'#1b1b1b',pic:'#1b1b1b'},
    poub:{bg:'#f5c542',sub:'#1b1b1b',pic:'#1b1b1b'},
    liste:{bg:'#5b8fd4',ink:'#1b1b1b',sub:'rgba(27,27,27,.65)',pic:'#1b1b1b',dot:'#1b1b1b'}}[k]))],
 ['d4','4 — Un damier bicolore','Une case sur deux en noir, l\'autre au trait — l\'échiquier. Pictos couleur sur le noir, noirs sur le clair. Très graphique.',
  ()=>titre()+damier(k=>({
    ticket:{bg:'#1b1b1b',ink:'#f4f3f1',sub:'rgba(244,243,241,.6)',pic:'#6cb392',dot:'#6cb392'},
    dem:{bg:'transparent',ink:'#1b1b1b',sub:'#8b8984',pic:'#1b1b1b'},
    linge:{bg:'transparent',sub:'#5a564e',pic:'#6cb392'},
    poub:{bg:'#1b1b1b',sub:'#f4f3f1',pic:'#f4f3f1'},
    liste:{bg:'#1b1b1b',ink:'#f4f3f1',sub:'rgba(244,243,241,.6)',pic:'#5b8fd4',dot:'#5b8fd4'}}[k]))]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
