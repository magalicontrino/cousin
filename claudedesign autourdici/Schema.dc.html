  /* ── LA FEUILLE DE PARTAGE (07/08/2026) ── */
  .partbg{position:fixed;inset:0;z-index:9999;background:rgba(27,27,27,.5);display:none;
    align-items:flex-end;justify-content:center}
  /* ═══ LA FEUILLE MONTE, ET ELLE FREINE À L'ARRIVÉE (Mag, 20/08/2026) ═══
     « Il faut que ça monte avec un effet smooth qui freine à l'arrivée. »
     Avant : elle APPARAISSAIT, d'un coup. Rien ne disait d'où elle venait, donc rien
     ne disait comment la renvoyer — on ne pensait pas à la faire redescendre.

     La courbe `cubic-bezier(.16,1,.3,1)` part vite et ralentit longuement sur la
     fin : c'est ce freinage qui donne le poids. Un `ease-out` ordinaire arrive trop
     sec, un `linear` glisse comme un tiroir de métal.
     ⚠ 320 ms, pas plus : au-delà on ATTEND la feuille, et on la voit arriver deux
     fois par minute.
     ⚠ Le voile, lui, ne bouge pas — il se contente d'un fondu court. Deux mouvements
     en même temps, l'œil ne sait plus lequel suivre. */
  /* ═══ LE FOND NE BOUGE PLUS QUAND LA FEUILLE EST MONTÉE (Mag, 20/08/2026) ═══
     « Quand la fenêtre est montée, plus rien n'est scrollable en arrière-plan. »

     ⚠ ON BLOQUE SUR `html`, PAS SUR `body`. Deux fausses pistes essayées :
     · `overflow:hidden` sur le BODY ne bloque rien — ce n'est pas lui qui défile.
     · `position:fixed` sur le body bloque bien, mais casse tout ce qui est `sticky` :
       le bandeau noir du tiroir se recollait en haut de l'écran et passait
       PAR-DESSUS la rangée des filtres. Vu à l'écran.
     Sur `html`, la hauteur de défilement est conservée telle quelle, rien ne saute,
     et les éléments collants restent où ils sont.

     ⚠ `touch-action:none` sur le voile : sans lui, un doigt posé À CÔTÉ de la
     feuille fait quand même défiler la page derrière sur iPhone.
     ⚠ `overscroll-behavior:contain` sur la feuille : sinon, arrivé au bas de la
     liste des communes, le geste continue et emporte la page du dessous. */
  html.fond-fige{overflow:hidden}
  .partbg{touch-action:none}
  .partcard{touch-action:pan-y;overscroll-behavior:contain}
  .partbg.on{display:flex;animation:partVoile .18s ease}
  .partbg.on > .partcard{animation:partMonte .32s cubic-bezier(.16,1,.3,1)}
  @keyframes partVoile{ from{opacity:0} to{opacity:1} }
  @keyframes partMonte{ from{transform:translateY(100%)} to{transform:none} }
  /* Sur grand écran la feuille est centrée : elle ne « monte » plus de nulle part,
     elle grandit sur place. */
  @media(min-width:760px){
    @keyframes partMonte{ from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none} }
  }
  @media (prefers-reduced-motion:reduce){
    .partbg.on, .partbg.on > .partcard{animation:none}
  }
  .partcard{width:100%;max-width:460px;max-height:92vh;overflow-y:auto;background:var(--creme);
    border:1.5px solid var(--trait-fort);border-radius:20px 20px 0 0;padding:0 16px 22px}
  @media(min-width:760px){ .partbg{align-items:center} .partcard{border-radius:20px;max-height:88vh} }
  .parttete{position:sticky;top:0;background:var(--creme);display:flex;align-items:center;
    padding:16px 0 12px;border-bottom:1.5px solid var(--ligne);margin-bottom:14px;z-index:2}
  .parttete b{flex:1;font-size:19px;font-weight:700}
  .parttete button{border:1.25px solid var(--trait);background:none;border-radius:8px;padding:8px 13px;
    font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
    color:var(--noir);cursor:pointer}
  .parttitre{margin-bottom:14px}
  .parttitre b{display:block;font-size:17px;font-weight:600;line-height:1.25}
  .parttitre em{font-style:normal;display:block;font-size:14px;color:var(--enc2);margin-top:3px}
  .partdeux{display:flex;gap:9px}
  .partsw{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:3px;
    border:1.25px solid var(--trait);border-radius:12px;background:#fdfdfc;padding:12px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--noir);cursor:pointer;text-align:left}
  .partsw .ic{width:19px;height:19px;margin-bottom:3px}
  .partsw em{font-style:normal;font-size:11px;font-weight:400;color:var(--enc2)}
  .partsw.on{background:var(--noir);color:#f2eee6}
  .partsw.on em{color:rgba(242,238,230,.7)}
  /* ⚠ LE QR SE LIT SUR DU BLANC, PAS SUR LE CRÈME : les lecteurs ont besoin du
     contraste maximum, surtout à travers l'écran d'un autre téléphone. */
  .partqr{background:#fff;border:1.25px solid var(--trait);border-radius:12px;margin-top:10px;
    padding:18px;text-align:center}
  .partqr p{font-size:12.5px;line-height:1.5;color:#333;margin:12px 0 0}
  .partliste{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .partl{display:flex;align-items:center;gap:13px;border:1.5px solid var(--ligne);border-radius:12px;
    background:#fdfdfc;padding:12px;font-family:inherit;color:var(--noir);cursor:pointer;text-align:left;width:100%}
  .partl:active{transform:scale(.985)}
  .partl .pr{flex:none;width:38px;height:38px;border-radius:50%;background:var(--noir);
    display:flex;align-items:center;justify-content:center}
  .partl .pr .ic{width:17px;height:17px;color:var(--jaune)}
  .partl .tx{flex:1;min-width:0}
  .partl .tx b{display:block;font-size:15px;font-weight:600}
  .partl .tx em{font-style:normal;display:block;font-size:12.5px;color:var(--enc2);margin-top:2px}
  .partl .sg{font-size:19px;color:rgba(27,27,27,.35)}

  /* ── LA RECHERCHE (07/08/2026) ──
     Le champ fait 52 px de haut et son texte 16 px : en dessous de 16, l'iPhone
     zoome tout seul sur le champ quand on le touche, et la page part de travers. */
  .rechbarre{display:flex;align-items:center;gap:10px;border:1.25px solid var(--trait);
    border-radius:12px;background:#fdfdfc;padding:0 12px;margin:16px 0 2px;height:52px}
  .rechbarre>.ic{width:19px;height:19px;color:var(--noir);flex:none}
  .rechbarre input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;
    font-family:inherit;font-size:16px;color:var(--noir);-webkit-appearance:none}
  .rechbarre input::-webkit-search-cancel-button{display:none}
  .rechbarre input::placeholder{color:var(--enc2)}
  .rechbarre button{flex:none;border:0;background:none;padding:8px;cursor:pointer;display:flex}
  .rechbarre button .ic{width:14px;height:14px;color:var(--enc2)}
  .rechnb{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--enc2);padding:14px 0 2px}
  .rechvide{border:1.5px solid var(--ligne);border-radius:12px;padding:18px;margin-top:14px;background:#fdfdfc}
  .rechvide b{display:block;font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.3}
  .rechvide p{font-size:14px;line-height:1.55;color:var(--enc2);margin:0}
  .rechracc{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .rechracc button{border:1.25px solid var(--trait);border-radius:999px;background:var(--creme);
    padding:9px 14px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--noir);cursor:pointer}
  .rechracc button:active{transform:scale(.96)}
  /* Le numéro sur la ligne de résultat : c'est souvent tout ce qu'on venait chercher. */
  .rechtel{display:block;font-size:14.5px;font-weight:600;margin-top:4px;color:var(--noir)}
  .rechtel.vide{font-weight:400;font-size:12px;color:var(--enc2)}
  /* ══════════════════════════════════════════════════════════════════════
     LE RÉSEAU V2 — STYLES
     ══════════════════════════════════════════════════════════════════════ */
  .reseau-v2{padding:0 18px}

  .reseau-grille{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0 20px}
  @media(min-width:700px){.reseau-grille{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}}
  .reseau-section-label{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
    letter-spacing:.2em;text-transform:uppercase;color:var(--noir);
    padding-bottom:7px;border-bottom:2px solid var(--noir);margin:14px 0 2px;grid-column:1/-1}
  .reseau-section-label:first-child{margin-top:0}
  /* Le compte, au bout du titre : c'est le seul mot qui change vraiment quand on
     touche une pastille, donc il doit se voir. */
  .reseau-section-label{display:flex;align-items:baseline;gap:10px}
  .reseau-section-label em{font-style:normal;margin-left:auto;font-size:9px;
    letter-spacing:.14em;color:#8b8984;font-weight:400}
  /* La grille s'annonce quand elle change — 160 ms, juste de quoi voir que ça a
     répondu. Elle se coupe pour qui a demandé moins d'animation. */
  .reseau-grille{animation:reseauEntre .16s ease}
  @keyframes reseauEntre{ from{opacity:.25} to{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .reseau-grille{animation:none} }
    /* ═══ LES FAMILLES DU CENTRE, DÉPLIANTES (A + les pictos noirs de D) ═══
     La ligne de famille reprend exactement la forme choisie pour les parcs : rangée
     claire, rond pastel, chevron dans son propre rond gris. Les portes, dedans,
     n'ont ni fond ni cadre — juste leur dessin en noir, comme la piste D. */
  /* ⚠ DE L'AIR SOUS LE BANDEAU NOIR. Depuis que la check-list est partie (21/08),
     le premier dépliant est collé au bandeau : c'est `.cliste` qui portait cette
     marge, et elle est partie avec lui. */
  .hero + .famz{margin-top:14px}
  .famz{display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--noir);
    background:#fdfdfc;border:1.25px solid var(--trait);border-radius:16px;
    padding:12px 14px;margin-bottom:10px;min-height:70px}
  .famz .rd{width:44px;height:44px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center}
  .famz .rd .ic{width:21px;height:21px;color:var(--noir)}
  .famz .tx{flex:1;min-width:0}
  .famz .tx b{display:block;font-size:16.5px;font-weight:600;line-height:1.2}
  .famz .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--enc2);margin-top:4px}
  .famz .chv{flex:none;width:30px;height:30px;border-radius:50%;background:#f2f0ed;
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#57554f}
  /* ═══ OUVERT, LE TITRE SE FAIT PETIT — piste B (Mag, 21/08/2026) ═══
     « On ne différencie pas bien le titre principal des sous-menus. » Mesuré : 16,5 px
     pour le titre contre 15,5 pour ses portes, les deux en gras et en noir. La seule
     différence était le rond pastel — trop peu.
     Cinq pistes lui ont été montrées (le noir · le titre en petit · le décalage ·
     l'écart de taille · le tiroir creusé) ; elle a choisi LE TITRE EN PETIT. C'est le
     bon sens d'un menu : ce qu'on clique doit se lire mieux que ce qui l'annonce.
     Le titre devient donc une ÉTIQUETTE en petites capitales — le même vocabulaire
     que les intertitres de l'app — et son sous-titre, libéré, redevient une phrase
     lisible au lieu d'une ligne en capitales espacées.
     ⚠ SEULEMENT QUAND C'EST OUVERT. Fermé, ce bouton est la seule chose à cliquer :
     il garde ses 16,5 px et son rond de 44. Un bouton, deux dessins — c'est le coût
     de cette piste, et il était annoncé.
     ⚠ Le trait sous le titre passe à 2 px de NOIR : c'est lui qui sépare maintenant,
     puisque la taille ne le fait plus. */
  .famz.ouvert{margin-bottom:0;border-radius:16px 16px 0 0;
    border-bottom:2px solid var(--noir);min-height:0;padding:11px 14px 9px}
  .famz.ouvert .rd{width:27px;height:27px}
  .famz.ouvert .rd .ic{width:13px;height:13px}
  .famz.ouvert .tx b{font-family:ui-monospace,monospace;font-size:10px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;line-height:1.3}
  .famz.ouvert .tx em{font-family:inherit;font-size:12.5px;letter-spacing:0;text-transform:none;
    color:var(--enc2);margin-top:2px;line-height:1.35}
  .famz.ouvert .chv{width:26px;height:26px;font-size:13px}
  .famdedans{border:1.25px solid var(--trait);border-top:0;border-radius:0 0 16px 16px;
    background:#fdfdfc;padding:0 14px 8px;margin-bottom:10px}
  .famli{display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:var(--noir);
    padding:14px 0;border-top:1px solid var(--ligne)}
  .famli .ic{width:21px;height:21px;flex:none}
  .famli .tx{flex:1;min-width:0}
  .famli .tx b{display:block;font-size:15.5px;font-weight:600;line-height:1.2}
  .famli .tx em{font-style:normal;display:block;font-size:13px;line-height:1.4;
    color:var(--enc2);margin-top:2px}
  .famli .chv{flex:none;font-size:16px;color:var(--enc2)}

/* ═══ LE CONSTAT DE L'ÉQUIPE, EN TÊTE DE FICHE (piste B, 20/08/2026) ═══
     « B, mais plus joli le mot de l'équipe. » Le cadre doré à fond crème avec sa
     pastille avait la forme d'un avertissement — or ce n'est pas un danger, c'est
     ce que des collègues ont constaté sur place. Plus de boîte : un intertitre en
     petit, la phrase en grand, un filet doré dessous. Ça se lit comme un titre,
     pas comme une étiquette collée. */
  .constat{margin:14px 0 6px;padding-bottom:12px;border-bottom:1.5px solid #e0c274}
  .constat .cl{display:block;font-family:ui-monospace,monospace;font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;color:#a8863a;margin-bottom:7px}
  .constat b{display:block;font-size:19px;font-weight:600;line-height:1.25;
    letter-spacing:-.01em;color:var(--noir)}

  /* ═══ LE CARNET DE L'ÉQUIPE : replié, avec sa tache ═══ */
  .carnet{border:1.25px solid var(--trait);border-radius:12px;background:#fdfdfc;margin-top:22px}
  .carnet .ct{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:15px;min-height:52px;color:var(--noir)}
  .carnet .ct b{flex:1;font-family:ui-monospace,monospace;font-size:10px;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase}
  /* La tache : pleine quand il y a quelque chose dedans, un simple cerne quand le
     carnet est vide. On voit qu'il y a à lire sans l'ouvrir. */
  /* ⚠ PAS `.tache` : ce nom est déjà pris par les lignes de check-list, qui sont
     des cartes avec du padding et un contour. La pastille en héritait et devenait
     un disque de 46 px. Vu à l'écran, pas en relisant le code. */
  .carnet .ct .cpt{width:11px;height:11px;border-radius:50%;background:#c9940c;flex:none}
  .carnet .ct .cpt.vide{background:transparent;box-shadow:inset 0 0 0 1.5px #cfccc6}
  .carnet .ct .n{flex:none;font-family:ui-monospace,monospace;font-size:9.5px;color:var(--enc2)}
  .carnet .ct .chv{flex:none;font-size:17px;line-height:1}
  .carnet .cc{padding:4px 15px 15px;border-top:1px solid #eae6de}
  .carnet.ouvert{background:#fdfdfc}

  .reseau-tout{grid-column:1/-1;display:block;width:100%;text-align:center;margin:4px 0 24px;
    border:1.25px solid var(--trait);border-radius:10px;background:#fdfdfc;color:var(--noir);
    padding:14px;font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase}
  .reseau-card{border:1.25px solid var(--trait);border-radius:12px;padding:12px;
    display:flex;flex-direction:column;justify-content:flex-start;aspect-ratio:1;
    background:#fdfdfc;position:relative;cursor:pointer;text-align:left;font-family:inherit}
  .reseau-card:active{transform:scale(.97)}
  /* ⚠ AGRANDIS (Mag, 18/08/2026 : « il faut que ce soit écrit plus grand et le logo
     un peu plus grand aussi »). La carte ne porte que deux choses — un mot et un
     dessin : il n'y a aucune raison qu'ils soient petits. */
  .reseau-card-title{font-family:ui-monospace,monospace;font-size:13px;font-weight:600;
    text-transform:uppercase;letter-spacing:.04em;line-height:1.2;color:var(--noir)}
  .reseau-card-icon{position:absolute;bottom:11px;right:11px;width:42px;height:42px;
    display:flex;align-items:center;justify-content:center;flex:none}
  .reseau-icon{width:38px;height:38px;object-fit:contain}
  .reseau-vide{grid-column:1/-1;border:1.5px solid var(--ligne);border-radius:12px;
    background:#fdfdfc;padding:18px;font-size:14px;color:var(--enc2)}
  @media(max-width:480px){.reseau-v2{padding:0 12px}.reseau-grille{gap:10px}}

.tbar .mot{font-family:'Eastman Grotesque','Eastman',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.01em;flex:1}
.tbar .sq{width:34px;height:34px;border:1.25px solid var(--trait);border-radius:6px;display:flex;
  align-items:center;justify-content:center}
.pastille{position:absolute;top:-4px;right:-4px;width:9px;height:9px;border-radius:50%;background:var(--rouge)}
.hero{display:flex;align-items:center;gap:12px;background:var(--noir);color:var(--creme);padding:16px 16px}
.hero .cbtn{width:34px;height:34px;flex:none;border:1.5px solid rgba(240,239,237,.55);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--creme)}
.hero .htx{flex:1;min-width:0}
.hero h1{font-family:'Eastman Grotesque','Eastman',sans-serif;font-weight:900;font-size:28px;line-height:1;
  letter-spacing:-.015em;text-transform:uppercase;margin:0;color:var(--creme)}
.hero .hpic{flex:none;display:flex;align-items:center}
.hero .hpic .pico{width:26px;height:26px}
.cbtn .pico,.hero .cbtn .ic{display:flex}
.imprligne{display:flex;justify-content:flex-end;padding:14px 16px 0}
.bimp{display:inline-flex;align-items:center;gap:8px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:8px;padding:10px 14px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir)}
.sectl{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--enc2);padding:22px 16px 8px;border-bottom:1.5px solid var(--noir);margin:0 16px 12px;
  padding-left:0;padding-right:0}
.rlist{display:flex;flex-direction:column;gap:9px;padding:0 16px}
.frow2{display:flex;align-items:center;gap:13px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:12px;padding:12px 14px}
.frow2 .rd{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.frow2 .rd .ic,.frow2 .rd .pico{display:flex}
.frow2 .tx{flex:1;min-width:0}
.frow2 .tx b{display:block;font-family:'Eastman',sans-serif;text-transform:none;letter-spacing:0;
  font-size:16px;font-weight:600;line-height:1.22}
.frow2 .tx em{font-style:normal;display:block;font-family:'Eastman',sans-serif;text-transform:none;
  letter-spacing:0;font-size:13px;font-weight:400;color:#4a4844;margin-top:3px;line-height:1.35}
.frow2 .chv{flex:none;font-size:19px;opacity:.45}

/* ── LE PLAN ── */
.plan{position:relative;width:343px;margin:0 16px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:12px;overflow:hidden}
.plan svg{display:block}
.plan.rues{border-radius:0;margin:0;width:375px;border-left:0;border-right:0}
.pici{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--noir);color:var(--creme);
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;font-weight:700}
.pdot{position:absolute;width:30px;height:30px;border-radius:50%;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;background:#fff}
.pdot.pin{width:30px;height:30px;box-shadow:0 1px 4px rgba(0,0,0,.16)}
.pdot .pico,.pdot svg{display:block}
.pmin{position:absolute;width:44px;text-align:center;font-family:ui-monospace,monospace;font-size:9px;
  color:#4a4844;letter-spacing:.04em}
.exemple{position:absolute;left:10px;top:10px;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#6a675f;background:rgba(253,253,252,.86);
  padding:4px 7px;border-radius:4px}
.psous{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--enc2);padding:8px 16px 0;text-align:center}

/* ── la légende (piste A, quand la liste n'est pas là) ── */
.lgd{display:flex;flex-direction:column;gap:2px;padding:16px 16px 0}
.lgl{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ligne)}
.lgl b{font-family:'Eastman',sans-serif;text-transform:none;letter-spacing:0;font-size:14.5px;font-weight:600;flex:none}
.lgl em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--enc2);margin-left:auto;text-align:right}
.rd.sm{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}

/* ── A · LES DEUX ONGLETS ──
   Le choix est écrit, en toutes lettres, au même endroit à chaque visite. */
.seg{display:flex;gap:0;margin:14px 16px 0;border:1.25px solid var(--trait);border-radius:9px;overflow:hidden}
.segb{flex:1;padding:13px 0;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;text-align:center;background:#fdfdfc;color:var(--noir)}
.segb + .segb{border-left:1.25px solid var(--trait)}
.segb.on{background:var(--noir);color:var(--creme)}

/* ── B · LE PLAN EN TÊTE, LA LISTE DESSOUS ──
   Pas d'onglet du tout : les deux sont là. Le plan se replie si on ne veut que lire. */
.replier{display:flex;align-items:center;justify-content:space-between;margin:0 16px;padding:11px 0 0}
.replier .t{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--enc2);white-space:nowrap}
.replier button{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--noir);border-bottom:1.25px solid var(--noir);padding-bottom:2px}

/* ── C · LA CARTE D'ABORD, LA FEUILLE MONTE ── */
.scene{position:relative;height:560px;overflow:hidden;background:#eceae5}
.feuille{position:absolute;left:0;right:0;background:var(--creme);border-top:1.5px solid var(--trait-fort);
  border-radius:16px 16px 0 0;box-shadow:0 -3px 18px rgba(0,0,0,.13);transition:top .28s cubic-bezier(.22,1,.36,1);
  overflow:hidden;bottom:0}
.poignee{display:flex;flex-direction:column;align-items:center;gap:9px;padding:10px 0 4px}
.poignee .barre{width:44px;height:4px;border-radius:2px;background:#c9c6c0}
.poignee .t{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--enc2);white-space:nowrap}
.fondu{position:absolute;left:0;right:0;bottom:0;height:46px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(240,239,237,0),var(--creme))}

/* ── D · UNE PORTE DANS LA LISTE ── */
.porte{display:flex;align-items:center;gap:13px;margin:14px 16px 0;background:var(--noir);color:var(--creme);
  border-radius:12px;padding:14px 15px}
.porte .rd{width:40px;height:40px;border-radius:50%;flex:none;background:#b28b7a;display:flex;
  align-items:center;justify-content:center;color:var(--noir)}
.porte .tx{flex:1;min-width:0}
.porte .tx b{display:block;font-family:'Eastman',sans-serif;text-transform:none;letter-spacing:0;
  font-size:16px;font-weight:600;line-height:1.2}
.porte .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(240,239,237,.72);margin-top:4px}
.porte .chv{flex:none;font-size:19px;opacity:.6}
.fin{height:22px}

/* la fausse coupe des vignettes de comparaison */
.coupe{width:375px;overflow:hidden;border:1.25px solid var(--ligne);border-radius:10px;background:var(--creme)}
.etiq{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--enc2);margin:0 0 8px}
.etiq b{color:var(--noir);font-weight:600}
.pileq{display:flex;flex-direction:column;gap:26px;padding:20px 0 24px;width:375px}
.pileq > div{padding:0 0 0 0}


.plan.rues{width:343px;margin:0 16px;border-radius:12px}
.pnom{position:absolute;width:120px;text-align:center;font-family:'Eastman',sans-serif;font-size:11px;
  font-weight:600;color:var(--noir);text-shadow:0 0 3px #eceae5,0 0 3px #eceae5,0 0 3px #eceae5}
.ech{position:absolute;left:10px;bottom:9px;display:flex;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#5d5a54;
  background:rgba(236,234,229,.9);padding:4px 7px;border-radius:4px}
.ech .bar{height:5px;border-left:1.5px solid #5d5a54;border-right:1.5px solid #5d5a54;border-bottom:1.5px solid #5d5a54}
.nord{position:absolute;right:9px;top:8px;width:22px;height:22px;border-radius:50%;background:rgba(236,234,229,.9);
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:9px;
  font-weight:700;color:var(--noir)}
.pdot.pin{width:32px;height:32px;box-shadow:0 1px 5px rgba(0,0,0,.18)}

.mapsligne{display:flex;justify-content:flex-end;padding:12px 16px 0}
.mapsdit{flex:1;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--enc2);line-height:1.4}
.bmaps{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--noir);color:var(--creme);
  border-radius:8px;padding:11px 14px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase}
.bmaps .pico{background:var(--creme)}

.loinl{display:flex;flex-direction:column;gap:0;padding:0 16px}
.loin{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--ligne)}
.loin b{font-family:'Eastman',sans-serif;font-size:15px;font-weight:600;flex:1;min-width:0}
.loin .cap{flex:none;color:var(--noir);display:flex}
.loin em{font-style:normal;flex:none;width:124px;text-align:right;font-family:ui-monospace,monospace;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--enc2)}

/* la planche des écarts */
.cmp{padding:18px 16px}
.cmp h2{font-family:'Eastman Grotesque','Eastman',sans-serif;font-weight:900;font-size:20px;
  text-transform:uppercase;letter-spacing:-.01em;margin:0 0 4px}
.cmp table{width:100%;border-collapse:collapse;margin-top:14px}
.cmp th{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--enc2);text-align:left;padding:0 6px 7px 0;border-bottom:1.5px solid var(--noir);font-weight:400}
.cmp td{font-size:12px;padding:9px 6px 9px 0;border-bottom:1px solid var(--ligne);vertical-align:top}
.cmp td.n{font-weight:600}
.cmp td.faux{font-family:ui-monospace,monospace;font-size:10px;color:#a8332b;text-transform:uppercase;letter-spacing:.06em}
.cmp td.vrai{font-family:ui-monospace,monospace;font-size:10px;color:#1b1b1b;text-transform:uppercase;letter-spacing:.06em}
.cmp .src{font-size:11px;color:#4a4844;line-height:1.5;margin-top:14px}
</style>
