  font-family:inherit;cursor:pointer}
.actb3 i{width:38px;height:38px;display:block}
.actb3 i .pico{width:100%;height:100%;display:block;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center}
.actb3 b{font-size:12.5px;line-height:1.15;font-weight:700}
/* L'ENCART WAKA — variante B : la bande des activités. */
.actwaka{margin-top:12px;border:1.5px solid var(--trait-fort);border-radius:18px;background:#fff;overflow:hidden}
.actwt{display:flex;align-items:center;gap:12px;padding:14px 15px 6px}
.actwt i{flex:none;width:44px;height:44px}
.actwt i .pico{width:100%;height:100%;display:block;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.actwt .t b{display:block;font-family:'Eastman Grotesque','Eastman';font-weight:900;
  text-transform:uppercase;font-size:21px;line-height:1}
.actwt .t em{font-style:normal;font-size:12.5px;display:block;margin-top:2px;color:#57554f}
/* ⚠ LA BANDE PORTE UN BORD NOIR (Mag, 13/08/2026 : « du bord noir juste pour tester »).
   Sans lui, les tuiles pâles flottaient sur le blanc ; avec, elles deviennent des
   objets qu'on peut compter du regard. */
.actwb{display:flex;gap:7px;padding:8px 15px 14px;border-bottom:2px solid var(--noir)}
/* Ni fond, ni contour : les dessins sont posés là, en noir, comme une phrase. */
.actwb span{flex:1;aspect-ratio:1;max-width:104px;
  display:flex;align-items:center;justify-content:center}
/* ⚠ LE PICTO SUIT LA TAILLE DE SA TUILE (Mag, 13/08/2026 : « les pictos sont beaucoup
   trop petits, j'aimerais qu'ils soient un peu plus fat »). Il était figé à 30 px :
   sur un grand écran la tuile devenait énorme et le dessin restait minuscule au
   milieu. En pourcentage, il grossit avec elle — 62 % de la tuile, quelle que soit
   la largeur. */
.actwb span .pico{width:62%;height:62%;display:block;background:var(--noir);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.actwc{padding:12px 15px 14px}
/* Le WhatsApp unique de la liste WAKA : une ligne, en tête, et plus rien après. */
.actwa1{display:flex;align-items:center;gap:10px;margin:2px 0 6px;padding:11px 12px;
  border:1.25px solid var(--trait);border-radius:11px;color:var(--enc2);
  font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase}
.actwa1 img{width:22px;height:22px;flex:none;display:block}
/* ⚠ LE PICTO COLLAIT AU MOT, avec un grand vide à droite (Mag, 20/08/2026 :
   « non, plus joli »). `margin-left:auto` était posé sur l'IMAGE — mais l'élément
   qui compte dans la rangée, c'est le LIEN qui l'enveloppe : la marge ne poussait
   rien. La ligne se lit maintenant comme toutes les autres de l'app : le mot à
   gauche, l'action au bout à droite. */
.actalerte{display:flex;align-items:center;gap:9px;border:1.25px solid var(--trait);
  border-radius:11px;padding:11px 13px;margin-bottom:12px}
.actalerte b{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--enc2);line-height:1.3}
.actalerte a{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;
  color:var(--noir);font-family:ui-monospace,monospace;font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase}
.actalerte img{width:24px;height:24px;flex:none;display:block}
.acttout{display:block;width:100%;border:1.5px solid var(--trait-fort);border-radius:11px;background:var(--noir);
  color:#f2eee6;padding:12px;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;cursor:pointer}
/* ── LE PANNEAU ── */
.actvoile{position:fixed;inset:0;z-index:88;background:rgba(27,27,27,.34);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:actV .18s ease}
@keyframes actV{from{opacity:0}to{opacity:1}}
.actpan{position:fixed;left:0;right:0;bottom:0;top:64px;z-index:89;background:#fff;
  border-top:2px solid var(--noir);border-radius:20px 20px 0 0;box-shadow:0 -12px 34px rgba(0,0,0,.24);
  display:flex;flex-direction:column;overflow:hidden;animation:actM .32s cubic-bezier(.16,1,.3,1)}
@keyframes actM{from{transform:translateY(100%)}to{transform:none}}
/* ═══ SUR GRAND ÉCRAN, LE PANNEAU ARRIVE PAR LA DROITE (Mag, 15/08/2026) ═══
   « Sur écran ça peut venir de droite la fenêtre, et pas toute la largeur. »
   Le panneau qui monte du bas est un geste de TÉLÉPHONE — le pouce est en bas de
   l'écran. Sur un ordinateur il n'y a pas de pouce, et un panneau large comme la
   page efface tout ce qu'on regardait : on ne voit plus la liste d'où l'on vient.
   Par la droite et sur 460 px, la fiche s'ouvre À CÔTÉ de la liste, et on garde
   sous les yeux l'endroit où l'on était.
   ⚠ Sous 900 px, rien ne change : le téléphone garde son panneau qui monte. */
@media (min-width:900px){
  .actpan{left:auto;right:0;top:0;bottom:0;width:min(460px,42vw);
    border-top:0;border-left:2px solid var(--noir);border-radius:20px 0 0 20px;
    box-shadow:-14px 0 40px rgba(0,0,0,.2);
    animation:actD .24s cubic-bezier(.22,1,.36,1)}
  /* La poignée ne sert qu'au pouce : elle n'a rien à faire ici. */
  .actpan .actpoi{display:none}
  .actpan .actpt{padding-top:16px}
}
@keyframes actD{from{transform:translateX(100%)}to{transform:none}}
.actpoi{width:44px;height:4px;border-radius:99px;background:#d8d4cc;margin:9px auto 0;flex:none}
.actpt{display:flex;align-items:flex-start;gap:10px;padding:10px 15px 12px;border-bottom:2px solid var(--noir);flex:none}
.actpt .t{flex:1;min-width:0}
.actpt .t em{font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#8b8984;display:block}
.actpt .t b{font-size:20px;line-height:1.1;display:block;margin-top:2px}
.actx{flex:none;width:30px;height:30px;border:1.25px solid var(--trait);border-radius:50%;background:#fdfdfc;
  color:var(--noir);font-size:14px;cursor:pointer}
.actcorps{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 0}
.actrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #eae6de}
.actrow:last-child{border-bottom:0}
.actrow .tu{flex:none;width:52px;height:52px;border:1.25px solid var(--trait);border-radius:14px;
  display:flex;align-items:center;justify-content:center}
.actrow .tu .pico{width:28px;height:28px;display:block;background:var(--noir);
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.actrow .tx{flex:1;min-width:0}
.actrow .tx em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984;display:block}
.actrow .tx b{display:block;font-size:16px;line-height:1.18;margin:1px 0 2px}
.actrow .tx i{font-style:normal;font-size:12.5px;color:#57554f;display:block}
/* « Inscription », juste le mot en fuchsia — jamais un bouton (sa demande du 12/08). */
.actinsc{display:inline-block;margin-top:4px;font-family:ui-monospace,monospace;font-size:9px;
  font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#e8308a}
.actwa{flex:none;display:block}
.actwa img{width:30px;height:30px;display:block}
.actgo{flex:none;border:1.25px solid var(--trait);border-radius:9px;background:#fdfdfc;color:var(--noir);
  padding:8px 10px;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer}
.actpied{flex:none;padding:11px 14px 15px;border-top:1px solid #eae6de;background:#fff}
.actimpr{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1.5px solid var(--trait-fort);
  border-radius:11px;padding:13px;background:#f5c542;color:var(--noir);font-family:ui-monospace,monospace;
  font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;cursor:pointer}
.actimpr .pico{width:15px;height:15px;display:block;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* ---- LES MODÈLES DE CHECK-LISTS ---- */
.modn{flex:none;width:22px;font-family:ui-monospace,monospace;font-size:10px;color:#8b8984;text-align:right}
.modb{flex:none;display:flex;flex-direction:column;gap:2px}
.modb button,.modb span{width:26px;height:18px;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--noir);border:1px solid var(--ligne);border-radius:4px;background:#fdfdfc}
.modb span{border-color:transparent;background:transparent}
@media (hover:hover){ .modb button:hover{background:var(--noir);color:#f2eee6} }

/* ---- LES STATISTIQUES : des barres, pas des camemberts ---- */
.stl{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ligne)}
.stn{flex:0 0 38%;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stb{flex:1;height:9px;background:#e6e4df;border-radius:5px;overflow:hidden}
.stb i{display:block;height:100%;background:var(--noir);border-radius:5px}
.stc{flex:none;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;color:#8b8984;min-width:34px;text-align:right}
.stjours{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:14px}
.stj{flex:1;height:100%;display:flex;align-items:flex-end}
.stj i{display:block;width:100%;background:#5b8fd4;border-radius:2px 2px 0 0}

/* ---- LA SALLE DE JEUX : les 8 jeux en cartes ---- */
/* Le rattrapage en tête de la salle de jeux : pleine largeur, noir, pour qu'on
   voie tout de suite que ce n'est pas une carte de jeu comme les autres. */
.jrat{display:flex;align-items:center;gap:13px;width:100%;margin-top:18px;
  background:var(--noir);color:#f0efed;border-radius:8px;padding:15px 16px;text-align:left}
.jrat .ic{width:26px;height:26px;flex:none;color:#f5c542}
.jrat .tx{flex:1;min-width:0}
.jrat b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.jrat em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(240,239,237,.6);margin-top:4px}
.jrat .n{flex:none;font-size:26px;font-weight:700;letter-spacing:-.03em}
@media (hover:hover){ .jrat:hover{filter:brightness(1.35)} }
.jgrille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:18px}
.jcarte{display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:8px;
  padding:15px;text-align:left;color:var(--noir);min-height:134px}
.jcarte.sombre{color:#f2eee6}
.jcarte .ic{width:34px;height:34px;flex:none}
.jcarte b{font-size:17px;font-weight:600;line-height:1.1;margin-top:auto}
.jcarte em+*{margin-top:8px}
.jcarte em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.72;margin-top:5px}
.jcarte small{font-size:12.5px;line-height:1.35;opacity:.85;margin-top:9px}
.jrec{margin-top:auto;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;background:rgba(27,27,27,.14);border-radius:999px;padding:3px 9px;margin-top:10px}
.jcarte.sombre .jrec{background:rgba(242,238,230,.2)}
@media (min-width:900px){ .jgrille{grid-template-columns:repeat(4,1fr)} }

/* ---- LA PAGE ACTIVITÉS : deux blocs francs, le gratuit et l'Article 27 ----
   Avant, les deux se suivaient sans rien pour les séparer et on ne savait plus ce
   qu'on payait (Mag, 06/08/2026). Chaque bloc est maintenant encadré et porte son
   prix dans une pastille. */
.actbloc{border:1.25px solid var(--trait);border-radius:8px;padding:16px;margin-top:18px;background:#fdfdfc}
.actbloc.a27{background:#f6f5f3}
.actt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:12px;
  border-bottom:2px solid var(--noir)}
.actt b{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:-.025em}
.actt em{font-style:normal;width:100%;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984}
.actbloc .frow2{border-bottom:1px solid var(--ligne)}
.actbloc .frow2:last-child{border-bottom:0}
.a27c{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 2px;
  border-bottom:1px solid var(--ligne)}
.a27c .tx{flex:1;font-size:14.5px;font-weight:500}
.a27c .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984}
.a27c .pm{width:22px;text-align:center;font-size:17px;font-weight:500}
.a27c.open{background:var(--noir);color:#f2eee6;border-radius:6px;padding-left:10px;padding-right:10px}
.a27c.open .n{color:rgba(242,238,230,.7)}
.a27l{padding:10px 2px 14px;border-bottom:1px solid var(--ligne)}
.a27l p{font-size:14px;margin:9px 0}
/* CE QUE C'EST (Mag, 08/08/2026 : « c'est ça, un cinéma ou un théâtre ? »). Le genre
   dormait déjà dans les données — il n'était affiché nulle part. « Fondation Van
   Buuren » ou « La Roseraie », ça ne dit rien à qui doit choisir où emmener
   quelqu'un ; « Musée », si. Il se met SOUS le nom et non à côté : à côté, il se
   ferait pousser hors de l'écran par les noms longs, sur téléphone. */
.a27l .g{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--enc2);margin-top:2px}

/* ---- LA FICHE D'URGENCE, qui monte du bas ---- */
.urgbg{position:fixed;inset:0;z-index:9997;background:rgba(27,27,27,.5);display:none;
  align-items:flex-end;justify-content:center}
.urgbg.on{display:flex}
.urgcard{width:100%;max-width:460px;background:var(--creme);border:1.5px solid var(--trait-fort);
  border-radius:14px 14px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;animation:monte .22s cubic-bezier(.22,1,.36,1)}
@keyframes monte{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.poignee{width:42px;height:4px;border-radius:3px;background:#c9c4b8;margin:0 auto 14px}
.urgt{border-left:6px solid var(--rouge);padding:2px 0 2px 13px;margin-bottom:14px}
.urgt b{display:block;font-size:22px;font-weight:700;line-height:1.15}
.urgt p{font-size:14px;line-height:1.45;color:#4a4844;margin:7px 0 0}
.ul{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ligne)}
.ull{flex:none;width:88px;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984;padding-top:3px}
.ulv{flex:1;font-size:14.5px;line-height:1.4}
.urgnote{font-size:13.5px;line-height:1.5;color:#4a4844;background:#f6f5f3;border-radius:6px;
  padding:12px;margin-top:12px;white-space:pre-line}
.urgbas{display:flex;gap:9px;margin-top:16px}
.urgtel{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
  border-radius:8px;padding:16px;font-size:17px;font-weight:600;letter-spacing:.01em}
.urgtel .ic{width:20px;height:20px}
.urgiti{flex:none;display:flex;align-items:center;gap:8px;border:1.25px solid var(--trait);
  border-radius:8px;padding:16px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase}
.urgiti .ic{width:16px;height:16px}
.urgplus{width:100%;margin-top:12px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;text-decoration:underline;padding:8px}

/* ---- LES FENÊTRES DE COUSIN (à la place de celles du navigateur) ---- */
.popbg{position:fixed;inset:0;z-index:9999;background:rgba(27,27,27,.5);display:none;
  align-items:center;justify-content:center;padding:20px}
.popbg.on{display:flex}
.popcard{width:100%;max-width:400px;background:var(--creme);border:1.5px solid var(--trait-fort);
  border-radius:10px;padding:22px;box-shadow:0 18px 44px rgba(27,27,27,.3);
  /* ⚠ ELLE SUIT SON CONTENU, puis défile : un texte de vingt lignes ne doit pas pousser
     « Enregistrer » hors de l'écran. Même règle que la fenêtre de la passation. */
  max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
/* ⚠ LE TITRE SE MET À LA LARGEUR DE L'ÉCRAN (Mag, 22/08/2026 : « écrit plus petit,
   "supprimer cette passation" — vu que le point d'interrogation, il part à la ligne »).
   22 px en capitales, c'est trop pour une question de quatre mots sur un téléphone : le
   « ? » basculait seul sur la ligne suivante, et un point d'interrogation orphelin fait
   lire la phrase deux fois. `clamp` la laisse grande là où il y a la place. */
.popcard b{display:block;font-size:clamp(16px,5vw,20px);font-weight:700;text-transform:uppercase;
  letter-spacing:-.02em;line-height:1.12;text-wrap:balance}
.popcard p{font-size:14.5px;line-height:1.5;color:#4a4844;margin:10px 0 0;white-space:pre-line}
.popcard p:empty{display:none}
.popcard input{width:100%;font:inherit;font-size:17px;font-weight:500;color:var(--noir);
  background:#fdfdfc;border:1.25px solid var(--trait);border-radius:6px;padding:12px 13px;margin-top:14px}
.popcard input:focus,.popcard textarea:focus{outline:0;box-shadow:0 0 0 3px rgba(27,27,27,.12)}
/* ═══ LE GRAND CHAMP DE LA FENÊTRE « MODIFIER » ═══
   Même dessin que le champ d'une ligne, mais il grandit avec le texte (`passGrandir`) et
   la fenêtre défile quand il n'y a plus la place — comme la fenêtre de la passation.
   Pas de poignée de redimensionnement : la hauteur se règle toute seule, et cette
   poignée invite à un geste qui ne marche pas au doigt. */
.popcard textarea{width:100%;font:inherit;font-family:'Eastman',system-ui,sans-serif;
  font-size:16px;line-height:1.45;font-weight:400;color:var(--noir);background:#fdfdfc;
  border:1.25px solid var(--trait);border-radius:6px;padding:12px 13px;margin-top:14px;
  resize:none;overflow:hidden;display:block;min-height:84px}
/* Le troisième champ ne reçoit qu'un nombre : une case large comme un nombre.
   Une case pleine largeur pour « 2 » invite à y écrire une phrase. */
#popChamp3{width:130px;font-family:ui-monospace,monospace;letter-spacing:.06em}
/* ═══ LES CASES ABSENCE / DÉSENCODAGE DE LA FENÊTRE (Mag, 24/08/2026) ═══
   Deux cases côte à côte, cochables, sous le champ. Cochee = rouge (la couleur des
   encodés), décochée = gris. */
.popetq{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.popetb{flex:1;min-width:130px;display:inline-flex;align-items:center;gap:9px;
  border:1.25px solid var(--ligne);border-radius:6px;padding:10px 12px;background:#fdfdfc;
  color:var(--enc2);font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600;cursor:pointer}
.popetb .bx{width:14px;height:14px;border:1.5px solid var(--enc2);border-radius:3px;background:none;flex:none}
.popetb.on{border-color:#e63329;color:#e63329;background:#fdeeed}
.popetb.on .bx{border-color:#e63329;background:#e63329}
.popbas{display:flex;align-items:center;gap:10px;margin-top:18px}
.popbas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984;padding:12px 4px}
.popbas .ok{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.popbas .ok.danger{background:var(--rouge)}
/* ═══ LA FENÊTRE DE LA PASSATION (Mag, 22/08/2026) ═══
   Plus large que les autres fenêtres de COUSIN, parce qu'elle porte neuf champs et pas
   une question. Et elle défile toute seule : sur un téléphone en paysage, ou avec le
   clavier ouvert, elle dépasserait sinon l'écran par le bas et le bouton « Passer à
   l'équipe » deviendrait inatteignable. */
/* ⚠ LA FENÊTRE SUIT LE TEXTE (Mag, 22/08/2026 : « j'aimerais que la fenêtre
   s'agrandisse en même temps que le texte, sinon il faut avoir une vue d'ensemble »).
   Elle n'a pas de hauteur imposée : elle prend celle de son contenu, et ne se met à
   défiler qu'une fois arrivée à 92 % de l'écran — au-delà, il n'y a plus de place, et
   c'est le défilement qui donne la vue d'ensemble. */
.popcard.passpop{max-width:520px;padding:0;max-height:92vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.passpop-t{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
  background:var(--creme);border-bottom:1px solid var(--ligne);padding:16px 18px 13px}
.passpop-t b{flex:1;font-size:17px;font-weight:700;letter-spacing:-.02em;
  text-transform:none;display:block}
/* Une croix, pas « Laisse tomber » : elle ferme, elle ne propose rien. Même règle que
   le bloc PFO en son temps. */
.passpop-x{width:32px;height:32px;flex:none;border:1px solid var(--trait);border-radius:50%;
  background:none;font-size:14px;line-height:1;color:var(--noir);padding:0}
.passpop-x:active{background:var(--noir);color:var(--creme)}
#passBg .acform.pass.ouverte{border:0;background:none;margin:0;padding:0;max-width:none}
#passBg .acform.pass .acg{padding:16px 18px 18px}
/* Le grand champ de la passation : il grandit avec le texte, et c'est la fenêtre qui
   défile. Pas de poignée de redimensionnement — elle ne sert à rien quand la hauteur
   se règle toute seule, et elle invite à un geste qui ne marche pas au doigt. */
/* ⚠ LA POLICE DU TEXTE, PAS CELLE DES ÉTIQUETTES : le champ héritait du monospace des
   formulaires, qui va bien pour une heure ou un numéro de chambre mais fatigue sur cinq
   lignes de phrase — et c'est justement ce qu'on vient y écrire. */
#passBg .acform.pass textarea#passTxt{resize:none;overflow:hidden;line-height:1.45;
  min-height:78px;font-size:16px;font-family:'Eastman',system-ui,sans-serif;letter-spacing:0}
/* Le second bouton (« Aucun jour ») : il défait, il ne valide pas — il a donc le
   dessin de « Annuler », pas celui du bouton noir. */
.popbas .autre{border:1px solid var(--ligne);border-radius:6px;background:#fdfdfc;
  color:var(--enc2);padding:12px 11px}
@media (hover:hover){ .popbas .ok:hover{filter:brightness(1.22)} .popbas .ann:hover{color:var(--noir)} }

/* ---- LA BOÎTE À IDÉES, ouvrable de partout ---- */
.ideebg{position:fixed;inset:0;z-index:9998;background:rgba(27,27,27,.42);display:none;
  align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px)}
.ideebg.on{display:flex}
.ideecard{width:100%;max-width:420px;background:var(--creme);border:1.5px solid var(--trait-fort);
  border-radius:8px;padding:18px}
.ideecard b{display:block;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em}
.ideecard p{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8b8984;margin:7px 0 0}
.ideecard textarea{width:100%;font:inherit;font-size:15px;color:var(--noir);background:#fdfdfc;
  border:1.25px solid var(--trait);border-radius:6px;padding:12px;margin-top:12px;resize:vertical}
.ideecard textarea:focus{outline:0}
.ideebas{display:flex;align-items:center;gap:10px;margin-top:12px}
.ideebas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}
.ideebas .pub{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* ---- LA SEMAINE DES POUBELLES (fiche « Jour des poubelles ») ---- */
/* ---- VOIR L'APP COMME LES AUTRES (barre d'aperçu, administration seulement) ---- */
/* Repliée : une boule. Noire et discrète au repos, DORÉE avec la lettre de la vue
   dès qu'un aperçu tourne — le seul rappel permanent qu'on ne regarde pas sa vue. */
.bboule{position:fixed;left:12px;top:calc(74px + env(safe-area-inset-top));z-index:60;
  width:46px;height:46px;border-radius:50%;background:var(--noir);color:#f2eee6;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 16px rgba(27,27,27,.28);transition:transform .16s ease}
.bboule .ic{width:21px;height:21px}
.bboule.actif{background:#d9a20b;color:var(--noir);box-shadow:0 0 0 3px rgba(217,162,11,.28),0 5px 16px rgba(27,27,27,.28)}
.bboule .bl{font-family:ui-monospace,monospace;font-size:13px;font-weight:500;letter-spacing:.02em}
.bboule.actif .bl{font-size:12px}
@media (hover:hover){ .bboule:hover{transform:scale(1.08)} }
/* Sur grand écran, « Voir comme » vit dans le rail noir : plus de boule qui flotte. */
@media (min-width:900px){ .bboule{display:none} }
#tabbar .railsec button.on{background:#f2eee6;color:var(--noir);opacity:1;border-left-color:#f2eee6}
#tabbar .railsec button.on .ic{color:var(--noir)}
#tabbar .railsec button.vueon{background:rgba(217,162,11,.22);border-left-color:#d9a20b;opacity:1}
#tabbar .railsec button.vueon .ic{color:#d9a20b}
.bascule .bplier{position:absolute;top:6px;right:10px;font-size:20px;line-height:1;color:rgba(242,238,230,.6)}
.bascule{position:fixed;left:12px;top:calc(74px + env(safe-area-inset-top));z-index:60;background:var(--noir);
  color:#f2eee6;border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;
  max-width:calc(100vw - 24px);box-shadow:0 6px 22px rgba(27,27,27,.25)}
.bascule.actif{outline:2px solid var(--jaune)}
.bascule b{font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;opacity:.65}
.bascule .bgrp{display:flex;gap:5px;flex-wrap:wrap}
.bascule .bgrp button{font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:#f2eee6;border:1px solid rgba(242,238,230,.32);border-radius:999px;padding:5px 10px}
.bascule .bgrp button.on{background:#f2eee6;color:var(--noir);border-color:#f2eee6}
.bascule .bmet{font:inherit;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#f2eee6;background:rgba(242,238,230,.1);
  border:1px solid rgba(242,238,230,.32);border-radius:6px;padding:7px 9px;max-width:230px}
.bascule .bmet option{color:#1b1b1b;background:#f2eee6}
.bascule .bfin{align-self:flex-start;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--jaune);text-decoration:underline}
.bascule em{font-style:normal;font-size:11px;line-height:1.4;opacity:.72;max-width:240px}
/* La bascule Écran/Téléphone n'a de sens que sur un grand écran. */
@media (max-width:899px){ .bascule .becran{display:none} }
/* Sur grand écran, la barre se pose À DROITE du rail, sinon elle le recouvre. */
@media (min-width:900px){ .bascule{left:248px;bottom:16px} }
/* ═══ L'APERÇU TÉLÉPHONE PREND TOUTE LA PAGE (Mag, 08/08/2026) ═══
   « Je t'ai demandé que ce soit un 100 % full screen sur la page, avec par exemple
   même 10 px de margin, mais pas spécialement plus. »

   ⚠ POURQUOI IL FALLAIT SORTIR DU FLUX. Tant que le téléphone était une image posée
   dans la page, il héritait de tout ce qu'il y avait au-dessus et au-dessous — le
   haut du cadre, la marge du bas de `#view` — et il restait un petit téléphone au
   milieu du vide. On en fait donc un calque FIXE, collé aux quatre bords à 10 px.
   ⚠ Sauf à gauche sur grand écran : le rail noir fait 236 px et on ne le recouvre
   pas — sinon on ne pourrait plus cliquer « Revenir à ma vue ». */
.teltest{position:fixed;inset:10px 10px 10px 10px;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:6px;padding:0;background:var(--creme,#f0efed)}
@media (min-width:900px){ .teltest{left:246px} }
/* Le téléphone est TOUJOURS visible en entier : s'il ne tient pas dans la hauteur de
   l'écran, on le dessine plus petit — sans toucher à sa largeur intérieure de 414 px,
   sinon ce ne serait plus la mise en page d'un téléphone (Mag, 06/08/2026). */
.telzoom{transform-origin:top center;transition:transform .16s ease}
.telcadre{width:414px;height:812px;border:12px solid var(--noir);border-radius:38px;
  overflow:hidden;background:#f0efed;box-shadow:0 10px 34px rgba(27,27,27,.22)}
.telcadre iframe{width:100%;height:100%;border:0;display:block}
.teltest p{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}

/* La confirmation d'ajout dans l'Admin : elle reste à l'écran, elle ne passe pas. */
.admok{border:2px solid #2f8f5b;border-radius:6px;background:#eef7f1;padding:12px 13px;margin-top:12px}
.admok.rate{border-color:var(--rouge);background:#fdeeed}
.admok b{display:block;font-size:14.5px;line-height:1.35}
.admok span{display:block;font-size:13px;color:#4a4844;margin-top:5px}

.pquand,.pastuce{display:flex;align-items:flex-start;gap:11px;border:1.25px solid var(--trait);
  border-radius:6px;background:#fdfdfc;padding:13px 14px;margin-top:16px;font-size:14.5px;line-height:1.45}
.pquand .ic,.pastuce .ic{width:19px;height:19px;flex:none;margin-top:2px}
.pastuce{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
/* ═══ TROIS CARTES DEVIENNENT TROIS LIGNES (Mag, 20/08/2026 : « là aussi c'est
   surchargé ») ═══
   Chaque jour avait sa carte : cadre, fond, jour en 19 px capitales, bacs en 34 px
   ET le nom des couleurs écrit à côté. Le dessin du bac PORTE DÉJÀ sa couleur — le
   mot la répétait, trois fois sur la page.
   Même dessin que la semaine du linge : le jour à gauche, les bacs à droite, un
   filet entre les lignes. Rien n'est retiré, tout est posé plus à plat. */
.psem{display:flex;flex-direction:column;margin-top:12px}
.pj{display:flex;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid #dcdad5}
.pj:last-child{border-bottom:0}
.pj.auj{border-radius:8px;border-bottom-color:transparent;padding:14px 12px;margin:2px 0;
  border-left:4px solid var(--noir);background:#f2f0ed}
.pjt{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.pjt b{font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:-.01em}
.pauj{font-family:ui-monospace,monospace;font-size:9px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;background:var(--noir);color:#f2eee6;border-radius:999px;
  padding:5px 10px;flex:none}
.pjt em{font-style:normal;margin-left:auto;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984}
/* Les bacs passent à droite de la ligne, le nom des couleurs dessous en tout petit :
   le dessin porte la couleur, le mot n'est là que pour qui ne la distingue pas. */
/* ⚠ EN RANG, PAS EN COLONNE. Avec `flex-direction:column`, les trois bacs du
   mercredi s'empilaient les uns sur les autres et la ligne devenait trois fois plus
   haute que les autres — l'inverse de ce qu'on cherchait. Les bacs restent en rang,
   et c'est le nom des couleurs qui passe à la ligne (`flex-basis:100%`). */
.psacs{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;flex:none}
.psacs .psl{flex-basis:100%;text-align:right;margin-left:0}
/* Un sac poubelle : noué en haut, ventru en bas. */
.psacs .sac{width:22px;height:27px;flex:none;border-radius:4px 4px 9px 9px;
  clip-path:polygon(28% 0,72% 0,100% 26%,100% 100%,0 100%,0 26%)}
.psacs .psl{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-left:6px}

/* ---- LE FIL : écrire, réagir ---- */
/* Repliée, la zone d'écriture n'est qu'une ligne : le fil commence tout de suite. */
.fcpli{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:14px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir);margin-top:16px}
.fcpli .ic{width:20px;height:20px;flex:none}
.fcpli b{flex:1;font-size:15px;font-weight:500;color:#8b8984}
.fcomp{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:14px;margin-top:16px}
.fcomp textarea{width:100%;font:inherit;font-size:15px;color:var(--noir);background:transparent;border:0;
  resize:vertical;min-height:64px;margin-top:12px}
.fcomp textarea:focus{outline:0}
.fchips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;
  padding:5px 11px;font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;background:#f6f5f3}
.fchip .ic{width:13px;height:13px;color:var(--fc,#1b1b1b)}
.fchip.on{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.fchip.on .ic{color:var(--fc,#f2eee6)}
/* ═══ ANNULER / ENREGISTRER, DANS LA PAGE DE TRI (18/08/2026) ═══
   Ils n'apparaissent que si on a touché une étiquette. Les deux sont de VRAIS
   boutons cerclés : « Classer sans suite » était du texte gris, et on ne voyait pas
   que c'était cliquable — c'est ce qui a fait dire « je ne comprends rien ».
   La barre est décalée d'un trait à gauche : elle appartient à la rangée
   d'étiquettes au-dessus, pas au reste de la carte. */
.rgbar{display:flex;gap:8px;align-items:center;margin-top:10px;
  padding-left:10px;border-left:3px solid var(--noir)}
.rgok{flex:1;background:var(--noir);color:#f4f3f1;border-radius:6px;padding:11px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600}
.rgann{border:1.25px solid var(--trait);border-radius:6px;padding:10px 14px;background:#fdfdfc;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;font-weight:600}
@media (hover:hover){
  .rgok:hover{background:#333;box-shadow:0 0 0 1.5px var(--noir)}
  .rgann:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
}
.fcbas{display:flex;align-items:center;gap:10px;margin-top:12px}
.fcbas .pub{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:12px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.fcbas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}
.frx{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.frx button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;
  padding:5px 10px;background:#f6f5f3;transition:border-color .14s ease,background .14s ease}
.frx button .ic{width:15px;height:15px}
.frx button em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;font-weight:500}
.frx button.moi{background:var(--noir);border-color:var(--trait-fort);color:#f2eee6}
@media (hover:hover){.frx button:hover{border-color:var(--trait-fort);background:#fff}}
/* Épingler et Supprimer sont de VRAIS boutons, pas du texte gris qu'on ne voit pas
   (Mag, 06/08/2026). Supprimer porte le rouge : c'est ce qu'on ne défait pas. */
.fsup{margin-left:auto;font-family:ui-monospace,monospace;font-size:9px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;border:1.25px solid var(--trait);border-radius:999px;
  padding:6px 12px;background:#fdfdfc;color:var(--noir)}
.fsup.sup{border-color:var(--rouge);color:var(--rouge)}
@media (hover:hover){
  .fsup:hover{background:var(--noir);color:#f2eee6}
  .fsup.sup:hover{background:var(--rouge);color:#fff;border-color:var(--rouge)}
}

/* ---- les chambres (rapatrié de l'app principale, habillé Lux) ---- */
/* ═══ CE QUE L'ÉQUIPE SAIT D'UN LIEU (13/08/2026) ═══
   Volontairement discret : ses mots pour les étiquettes étaient « c'est un petit
   rappel ». Le bloc vient APRÈS les coordonnées et les boutons d'action — on ouvre
   une fiche pour un numéro de téléphone, pas pour lire des commentaires. */
.avisbloc{border:1px solid var(--ligne);border-radius:12px;padding:14px;background:#fdfdfc}
/* « Conseillée par l'équipe » — le bloc de proposition et d'approbation.
   ⚠ Il reprend le jaune du liseré déjà posé sur les fiches conseillées : c'est le
   même objet, il doit avoir la même couleur des deux côtés. */
.conseilbloc{margin-top:14px;padding-top:12px;border-top:1px dashed var(--ligne)}
.conseilok{display:flex;gap:9px;align-items:flex-start;background:#fffdf3;
  border-left:5px solid var(--jaune);border-radius:8px;padding:10px 12px}
.conseilok .ic{width:16px;height:16px;flex:none;margin-top:2px}
.conseilok b{display:block;font-size:14.5px}
.conseilok em{font-style:normal;display:block;font-size:14px;line-height:1.4;color:#4a4844;margin-top:2px}
.conseilok i{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.conseilatt{border-left:3px solid var(--ligne);padding:2px 0 2px 11px}
.conseilatt b{font-size:14px}
.conseilatt em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;color:#8b8984;margin-top:1px}
.conseilatt p{font-size:14.5px;line-height:1.45;margin-top:4px}
/* Depuis combien de temps ça dort : rouge après 30 jours, et seulement là. */
.conseilvieux{color:#e63329;font-weight:700}
.avisetq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* ═══ LE COMMENTAIRE ET SON ENVOI (18/08/2026) ═══
   Le champ prend toute la largeur, et le bouton est SOUS lui, également pleine
   largeur. C'est le cœur de la correction : tant que le bouton était collé à droite
   du champ, il avait l'air de n'appartenir qu'à lui — alors qu'il envoie aussi les
   étiquettes. Sous les deux, il les couvre tous les deux.
   ⚠ `.off` le masque au lieu de le retirer : `avisTape()` n'a qu'une classe à
   basculer, et on ne redessine pas le bloc pendant qu'on écrit — sinon le curseur
   saute au milieu du mot. */
.avistxt{width:100%;border:0;background:#f2f1ef;padding:13px 14px;font-size:15px;
  font-family:inherit;color:var(--noir);outline:0;margin-top:10px}
.avistxt::placeholder{color:#8b8984}
.avisenv{display:block;width:100%;margin-top:8px;background:var(--noir);color:#f4f3f1;
  border-radius:6px;padding:13px;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  transition:background .14s ease,box-shadow .14s ease}
.avisenv.off{display:none}
@media (hover:hover){ .avisenv:hover{background:#333;box-shadow:0 0 0 1.5px var(--noir)} }
/* La phrase que disent les étiquettes cochées. */
.etqdit{font-size:14.5px;line-height:1.4;margin-top:8px}
/* « Relu par … » : discret, c'est une nouvelle rassurante, pas une alerte. */
.avisrelu{display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:#3f7d5c;margin-top:5px}
.avisl{border-left:3px solid var(--ligne);padding:2px 0 2px 11px;margin-bottom:11px}
.avisl b{font-size:14px}
.avisl em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;color:#8b8984;margin-left:7px}
.avisl p{font-size:14.5px;line-height:1.45;margin-top:2px}
.avisl.mien{border-left-color:var(--noir);margin-top:12px}
/* La pastille d'étiquette : petite, en capitales, lisible sans lire. */
.etqp{display:inline-block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:#fff;
  padding:3px 8px;border-radius:4px;vertical-align:1px}
.chadd{display:flex;gap:8px;margin:10px 0 10px}
.chadd input,.chadd textarea{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--noir);
  background:#f4f3f0;border:1px solid var(--ligne);border-radius:0;padding:11px 12px}
/* Le champ de note grandit avec le texte : on doit voir ce qu'on écrit. */
.chadd textarea{resize:none;overflow:hidden;line-height:1.4;min-height:44px;display:block}
.chadd input:focus,.chadd textarea:focus{outline:0;border-color:var(--trait-fort)}
.chaddbtn{flex:none;background:var(--noir);color:#f2eee6;border-radius:0;padding:11px 16px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.chrgpd{display:flex;gap:10px;border:1px solid var(--ligne);border-left:7px solid #f5c542;background:#f4f3f0;
  padding:11px 12px;font-size:12.5px;color:var(--enc2);line-height:1.45;margin-bottom:14px}
.chrgpd .ic{width:18px;height:18px;flex:none;color:var(--noir);margin-top:1px}
.chrgpd b{color:var(--noir)}
.chc{border:1px solid var(--ligne);background:#f4f3f0;margin-bottom:8px}
.chc.finie{opacity:.62}
.chh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;background:transparent;border:0;border-radius:0}
.chnum{font-size:19px;font-weight:700}
.chini{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--noir);background:rgba(27,27,27,.09);padding:3px 7px}
.chg{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--noir);flex:none}
.chprog{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:var(--enc2)}
.chfin{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:500;color:#1b1b1b;background:#6cb392;padding:3px 8px}
.chchev{width:13px;height:13px;flex:none;color:var(--enc2)}
.chcorps{border-top:1px solid var(--ligne);padding:4px 12px 10px}
.chet{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid #e2e0db;border-radius:0;padding:10px 0}
.chet:last-of-type{border-bottom:0}
.chet i{font-style:normal;width:22px;height:22px;flex:none;border:1.25px solid var(--trait);background:transparent;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--noir)}
.chet b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.chet em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:2px}
.chet.ok b{text-decoration:line-through;color:var(--enc2)}
/* SANS OBJET : barré comme une étape faite, mais sans couleur et sans coche — on ne
   décore pas d'un ✓ vert un geste que personne n'a fait. */
.chet.so b{text-decoration:line-through;color:var(--enc2)}
.chet.so i{border-color:#c2c0bb;color:#c2c0bb}
.chet.so .chq{color:#a8a5a0;font-style:italic}

/* ── LE CHOIX À L'AJOUT : à vider, ou déjà vide ── */
/* ⚠ `.chdep*` ET `.chres*` ONT ÉTÉ SUPPRIMÉS le 22/08/2026 — les deux boutons
   « À vider / Déjà vide » n'existent plus, et le récapitulatif à pastilles est devenu
   un tableau. Ce qui suit les remplace.
   ⚠ `.chdep-t` VIVAIT ENCORE ailleurs : le Tour des chambres s'en sert pour son
   « On a ». Il est donc conservé, seul, juste en dessous. */
/* ⚠ CASSÉ PUIS RÉPARÉ LE 22/08/2026, ET LA LEÇON VAUT PLUS QUE LA RÉPARATION.
   En retirant les deux boutons des Chambres, j'ai supprimé `.chdep` et `.chdep-b` en
   croyant qu'ils ne servaient plus qu'à eux. Ils habillaient aussi LES QUATRE BOUTONS
   DE LA PASSATION (« Un réveil · Médical à jeun · Sortie de centre · Une info »), qui
   se sont retrouvés en texte brut empilé — « complètement anarchique », et elle avait
   raison. Une classe partagée ne s'efface pas sur la foi de l'écran qu'on regarde :
   on cherche QUI L'UTILISE ENCORE avant de la retirer. */
.chdep{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chdep-t{flex:none;align-self:center;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--enc2)}
.chdep-b{flex:1;min-width:130px;text-align:left;background:#f4f3f0;border:1.5px solid var(--ligne);
  border-radius:0;padding:9px 11px;color:var(--noir)}
.chdep-b b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.chdep-b em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:3px}
.chdep-b.on{border-color:var(--trait-fort);background:#fdfdfc}
.chdep-b.on em{color:var(--noir)}

/* ═══ LE TITRE D'ÉTAGE (Mag, 22/08/2026 : « 1ER ÉTAGE · HOMMES · 1 ») ═══
   Il porte les trois choses qu'on se demande avant de monter : où, qui y dort,
   combien de chambres. Trait plein dessous, comme les autres titres de section de
   l'app — c'est un intertitre, pas une carte. */
.chetg{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.17em;
  text-transform:uppercase;color:var(--enc2);margin:22px 0 9px;padding-bottom:5px;
  border-bottom:1.5px solid var(--noir)}

/* ═══ LE PETIT TABLEAU DE CE QUI RESTE ═══
   « Faudrait que ce soit juste un petit tableau. » Donc : pas de bordure autour, pas
   de fond, pas de pastilles. Trois colonnes, des filets fins, et les numéros en
   chiffres à chasse fixe pour qu'ils s'alignent. */
.chtabw{margin:4px 0 18px}
.chtab{width:100%;border-collapse:collapse;font-size:14px}
.chtab td{padding:7px 0;border-bottom:1px solid var(--ligne);vertical-align:baseline}
.chtab tr:last-child td{border-bottom:0}
.chtab .che{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);width:1%;white-space:nowrap;padding-right:14px}
.chtab .chq{font-weight:600;width:1%;white-space:nowrap;padding-right:14px}
.chtab .chn{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.05em;
  color:var(--enc2);text-align:right;font-variant-numeric:tabular-nums}

/* ---- LE TOUR DES CHAMBRES : les bacs en trop ----
   Volontairement proche des Chambres (même numéro en gros, mêmes initiales en
   étiquette), parce que c'est le même geste au même endroit — mais les cartes
   restent OUVERTES, sans accordéon : on ouvre cette page pour lire d'un coup ce
   que l'équipe d'avant a laissé, pas pour dérouler dix volets. */
.tbadd{display:grid;gap:8px;margin:10px 0 10px}
.tbduo{display:flex;gap:8px}
.tbduo input{flex:1;min-width:0}
.tbadd input{font:inherit;font-size:14px;color:var(--noir);background:#f4f3f0;
  border:1px solid var(--ligne);border-radius:0;padding:11px 12px;width:100%}
.tbadd input:focus{outline:0;border-color:var(--trait-fort)}
/* LE COMPTEUR DE BACS : des gros boutons − et +, pas un champ à taper. On le
   remplit debout dans un couloir, souvent d'une seule main. */
.tbcpt{display:flex;align-items:center;gap:8px;background:#f4f3f0;border:1px solid var(--ligne);padding:7px 10px}
.tbcpt-t{flex:1;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);line-height:1.4}
.tbcpt button{flex:none;width:36px;height:36px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:0;color:var(--noir);font-size:19px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center}
.tbcpt button:disabled{border-color:#d6d4d0;color:#c2c0bb}
.tbcpt-n{flex:none;min-width:34px;text-align:center;font-size:23px;font-weight:700;letter-spacing:-.02em}
.tbc{border:1px solid var(--ligne);border-left:7px solid var(--ligne);background:#f4f3f0;
  padding:11px 12px 10px;margin-bottom:8px}
.tbc.close{opacity:.6}
.tbh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tbn{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--enc2)}
.tbn b{font-family:'Eastman',system-ui,sans-serif;font-size:19px;font-weight:700;letter-spacing:-.02em;
  color:var(--noir);margin-right:5px}
.tbetat{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:500;color:#1b1b1b;padding:3px 8px}
/* L'HISTOIRE DE LA LIGNE, en toutes lettres : qui a noté, qui a prévenu, quand le
   délai tombe. C'est ça, la passation — pas le badge de couleur. */
.tbmeta{font-size:12.5px;line-height:1.5;color:var(--enc2);margin-top:7px}
.tbmeta b{color:var(--noir);font-weight:600}
.tbnote{font-size:13px;line-height:1.45;color:var(--noir);margin-top:6px;font-style:italic}
/* LE JOURNAL : une ligne par geste, dans l'ordre où c'est arrivé. Le filet
   vertical à gauche en fait une suite, pas une pile de messages détachés. */
.tbjrn{margin-top:9px;padding-left:11px;border-left:2px solid #e2e0db}
/* Chaque ligne est un bouton : on la touche pour la corriger. Elle n'en a pas l'air
   — c'est du texte qu'on lit d'abord, pas une commande. */
.tbjl{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:baseline;padding:4px 0;
  width:100%;text-align:left;background:transparent;border:0;border-radius:0;color:inherit;font:inherit}
.tbjl:active{background:rgba(27,27,27,.05)}
.tbjq{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--enc2);white-space:nowrap}
.tbjt{font-size:13px;line-height:1.45;color:var(--noir)}
.tbjl.av .tbjt{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#b8342c}
/* La question du jour de reprise : encadrée, mais pas rouge. Le rouge est réservé
   aux tâches elles-mêmes, une fois qu'on a répondu oui. */
.cyc{border:1.25px solid var(--trait);background:#fdfdfc;padding:13px 14px;margin-top:16px}
/* ═══ QUAND LE MÉTIER N'A PAS DE LISTE (Mag, 11/08/2026) ═══
   « Si la check-list est vide, tu la mets juste discrète, fermée. Je veux que tu
   mettes en évidence sur cette page qu'ils peuvent faire eux-mêmes leur check-list.
   Il y a plein de métiers qui n'auront pas de check-list. »

   ⚠ CE QU'ELLE CORRIGE. Avant, l'absence de liste s'annonçait dans un gros pavé
   noir — la première chose qu'on lisait en ouvrant sa page, c'était ce qu'on
   n'avait pas. Pour un travailleur social, qui travaille à l'urgence et ne PEUT
   pas suivre un déroulé, ce n'est pas un manque : c'est normal. Donc l'absence
   devient une ligne fermée qu'on ouvre si on se pose la question, et la place est
   rendue à ce qu'on vient vraiment faire ici : sa propre liste.

   `<details>` : replié tout seul par le navigateur, sans une ligne de code, et il
   s'ouvre au doigt comme au clavier. */
.mlvide{margin-top:16px;border:1px solid var(--ligne);border-radius:8px;background:#faf9f7}
.mlvide summary{display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer;
  list-style:none;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#8b8984}
.mlvide summary::-webkit-details-marker{display:none}
.mlvide summary .ch{margin-left:auto;font-size:13px;transition:transform .15s ease}
.mlvide[open] summary .ch{transform:rotate(90deg)}
.mlvide p{margin:0;padding:0 13px 13px;font-size:13.5px;line-height:1.55;color:#6b6963}
/* LA CARTE EN ÉVIDENCE : c'est elle qu'on doit voir en arrivant, et TOUT se passe
   dedans — le titre, la phrase, les lignes, et le champ où on écrit.
   ⚠ LA COULEUR EST DANS LE BANDEAU, pas dans le fond (Mag : « plus colorée et plus
   évidente »). Un fond teinté sur toute la carte aurait fait pâlir les lignes de
   tâches qu'elle contient ; un bandeau de tête la désigne sans gêner la lecture.
   Le bleu #5b8fd4 est déjà celui de l'anneau de cette liste — on ne présente pas
   une couleur de plus. */
/* ═══ LA MÊME CARTE QUE LA PASSATION (22/08/2026) ═══
   Le bandeau était en #5b8fd4 — le bleu que Mag a écarté de la palette le 12/08. Ça
   passait inaperçu tant que la carte était seule au milieu de la page ; côte à côte
   avec la passation dans les trois colonnes, on voyait deux objets qui ne sont pas de
   la même app. Blanche, bord noir, titre en noir : les deux cartes se répondent. */
.mlfais{border:1.5px solid var(--noir);border-radius:12px;background:#fdfdfc;
  margin-top:16px;overflow:hidden}
.mlfais-t{display:flex;align-items:baseline;gap:10px;padding:13px 15px 4px;
  background:none;color:var(--noir)}
.mlfais-t b{font-size:16.5px;line-height:1.25}
.mlfais-t em{margin-left:auto;font-style:normal;font-family:ui-monospace,monospace;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--enc2);white-space:nowrap}
.mlfais-c{padding:14px 15px 16px}
.mlfais-c p{margin:0 0 4px;font-size:13.5px;line-height:1.55;color:#57554f}
/* Le champ d'écriture ne colle pas au bord de la carte. */
.mlfais-c .chadd{margin-top:14px}
/* ═══ LE TEXTE AU-DESSUS, LES BOUTONS DESSOUS (Mag, 22/08/2026) ═══
   Trois éléments côte à côte dans une colonne de téléphone laissaient au champ la
   largeur de quatre mots. Le champ prend toute la ligne, les deux boutons la
   suivante — et ils se partagent la largeur, donc ils sont gros et faciles à viser. */
.chadd.empile{flex-direction:column;gap:8px}
.chadd.empile input{width:100%}
/* ⚠⚠ `flex:1` AGIT SUR LA HAUTEUR DANS UNE COLONNE (trouvé le 22/08/2026 : « j'aimerais
   que la fenêtre s'agrandisse en même temps que le texte »).
   Le champ hérite de `.chadd textarea{flex:1}`, écrit pour partager la LARGEUR quand les
   éléments sont côte à côte. Dès que `.chadd` passe en colonne, le même `flex:1` se met
   à régler la HAUTEUR — et il écrasait la hauteur calculée par `passGrandir` : le texte
   grandissait, la boîte non, et on écrivait dans une fenêtre d'une ligne.
   `flex:none` lui rend sa propre hauteur. */
.chadd.empile textarea{width:100%;flex:none}
/* ═══ UNE CARTE DANS LA CARTE (Mag, 22/08/2026) ═══
   « Tu pourrais mettre ça sur un fond noir, ça pourrait être une carte dans la carte,
   pour qu'on différencie plus que c'est à part — sinon c'est trop brouillon. »
   Elle a raison : cette zone n'est pas une ligne de la liste, c'est l'ENDROIT OÙ L'ON
   ÉCRIT. Posée sur le même fond que les rangées, elle se lisait comme une rangée de
   plus, coincée entre les autres. Sur du noir, elle devient un objet à part — on sait
   sans réfléchir que c'est là qu'on tape.
   ⚠ LE BOUTON « OK » S'INVERSE : il était noir sur blanc, il disparaissait sur le noir.
   Il devient crème sur noir — il reste le bouton plein, celui qui valide, et
   « Passation » reste celui qui est seulement cerné. Le rapport entre les deux ne
   change pas, ce sont les couleurs qui se retournent. */
.chadd.ecrire{background:var(--noir);border-radius:10px;padding:12px;margin-top:14px}
.chadd.ecrire textarea,.chadd.ecrire input{background:#fdfdfc;border-color:transparent;
  border-radius:6px;color:var(--noir)}
.chadd.ecrire textarea:focus,.chadd.ecrire input:focus{border-color:#f5c542}
/* Le picto « absences » du champ d'écriture : un carré clair aligné aux boutons, comme
   les pictos des lignes. Sur fond noir il doit rester lisible. */
.chadd.ecrire .ib{width:44px;height:44px;flex:none;border:1px solid rgba(242,238,230,.35);
  border-radius:6px;background:rgba(242,238,230,.08);color:#f2eee6;display:inline-flex;
  align-items:center;justify-content:center}
.chadd.ecrire .ib svg{width:16px;height:16px}
/* ═══ LA BARRE GRAS / SOULIGNÉ, AU-DESSUS DU CHAMP (Mag, 24/08/2026 : « si je sélectionne
   je veux pouvoir mettre en gras et souligner ») ═══
   `passBarreHTML` rend G et S. Le style était absent : sur le champ noir de Ma liste
   perso, les deux boutons et l'aide étaient invisibles. On les habille ici. */
.txbar{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.chadd.ecrire .txbar .txb,.txbar .txb{width:36px;height:32px;flex:none;border:1px solid
  rgba(242,238,230,.35);border-radius:6px;background:rgba(242,238,230,.08);color:#f2eee6;
  font-family:ui-monospace,monospace;font-size:13px;font-weight:700;line-height:1;cursor:pointer}
.txbar .txb u{text-decoration:underline}
.chadd.ecrire .txbar .txb-h{color:rgba(242,238,230,.45)}
/* ═══ LES CASES « ABSENCE » / « DÉSENCODAGE » SOUS LE CHAMP (Mag, 24/08/2026) ═══
   Une ligne de bouton, avec une vraie case à cocher et le mot écrit — pas un picto
   muet qu'on coche sans savoir. Cochee, elle passe en rouge (la couleur des encodés). */
.chadd.ecrire .absas{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chadd.ecrire .absa{display:flex;align-items:center;gap:10px;flex:1;min-width:0;
  border:1px solid rgba(242,238,230,.3);border-radius:6px;padding:11px 12px;
  color:#e8e5df;background:none;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;font-weight:600;cursor:pointer}
.chadd.ecrire .absa .bx{width:15px;height:15px;border:1.5px solid rgba(242,238,230,.6);border-radius:3px;flex:none}
.chadd.ecrire .absa.on{border-color:#e63329;color:#ffd9d4;background:rgba(230,51,41,.12)}
.chadd.ecrire .absa.on .bx{border-color:#ff8d86;background:#e63329}
/* ═══ DEUX COULEURS SUR LE NOIR (Mag, 22/08/2026 : « le bouton OK, les passations, tu
   peux mettre des couleurs, genre rose et jaune — pas trop foncé pour qu'on voie bien
   ce qui est écrit ») ═══
   · OK est JAUNE : ça reste chez moi. C'est le jaune de l'accueil, celui de la maison.
   · PASSATION est ROSE : ça part à l'équipe de nuit. C'est le rose des réveils, celui
     qu'on retrouve sur le trait de chaque ligne passée — le bouton annonce la couleur
     de ce qu'il fabrique.
   ⚠ DES TEINTES CLAIRES, ET DE L'ENCRE NOIRE DESSUS. Le rose plein de l'app (#E8308A)
   est fait pour un trait de 4 px, pas pour porter du texte : en aplat, les lettres
   noires s'y noient et les blanches vibrent. Ces deux-là gardent un contraste franc,
   même sur un écran de téléphone en plein soleil.
   ⚠ LES DEUX SONT PLEINS, ET C'EST VOULU : ce ne sont pas deux poids différents, ce
   sont DEUX DESTINATIONS. Le choix n'est pas « valider ou pas », c'est « pour moi ou
   pour eux » — deux boutons de même force, deux couleurs qui les distinguent. */
.chadd.ecrire .chaddbtn{background:#f5c542;color:var(--noir);border-radius:6px;
  border:0;font-weight:600}
.chadd.ecrire .rapPass{background:#f5a8cd;color:var(--noir);border:0;border-radius:6px;
  font-weight:600}
.chadd.ecrire .chadd-ch{background:#fdfdfc}
.chadd-b{display:flex;gap:8px}
/* Le numéro de chambre : étroit et à gauche, sur la ligne des boutons. Un champ de
   trois caractères qui prendrait toute la largeur ferait croire qu'on attend une
   phrase. */
.chadd-ch{flex:0 1 92px;min-width:64px;font:inherit;font-size:14px;color:var(--noir);
  background:#f4f3f0;border:1px solid var(--ligne);border-radius:0;padding:11px 10px}
.chadd-ch:focus{outline:0;border-color:var(--trait-fort)}
.chadd.empile .chadd-ch{flex:0 1 92px}
.chadd.empile .chaddbtn,.chadd.empile .rapPass{flex:1;min-height:44px;
  display:inline-flex;align-items:center;justify-content:center}
.cyc b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.cyc p{font-size:13px;line-height:1.45;color:var(--enc2);margin-top:6px}
.cyc .acok{width:auto;padding:9px 15px;margin-top:11px}

/* ── LE CHOIX DE LA LISTE : un déroulant (Mag, 08/08/2026) ──
   Les pastilles débordaient de l'écran ; ce qui dépasse ne se voit pas. Le
   déroulant tient sur une ligne quel que soit le nombre de listes, et les montre
   toutes d'un coup quand on l'ouvre. Le point ● devant les siennes. */
/* ═══ LA BARRE DU HAUT DE « MA LISTE » (Mag, 22/08/2026) ═══
   Une seule ligne, très discrète : pas de fond, un filet fin, du texte gris. Ce qui
   compte sur cette page, ce sont les tâches — pas les outils qui les entourent.
   ⚠ ELLE SE REPLIE SUR PLUSIEURS LIGNES quand il n'y a pas la place (`flex-wrap`),
   au lieu de pousser l'imprimante hors de l'écran. */
.mlbarre{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;
  max-width:620px}
.mlbarre .mlb-sep{flex:1;min-width:0}
.mlb{display:inline-flex;align-items:center;gap:7px;min-height:34px;
  border:1px solid var(--ligne);border-radius:5px;background:#fdfdfc;padding:0 11px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--enc2)}
.mlb .ic{width:13px;height:13px;flex:none;color:var(--enc2)}
.mlb:active{color:var(--noir);border-color:var(--trait)}
/* Le déroulant se fond dans la barre : même hauteur, même filet, même petit texte.
   Il ne doit pas peser plus que les boutons à côté — c'est un réglage, pas un titre. */
.mlsel{display:inline-flex;min-width:0}
.mlsel select{font:inherit;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--noir);min-height:34px;
  background:#fdfdfc;border:1px solid var(--ligne);border-radius:5px;padding:0 30px 0 11px;
  -webkit-appearance:none;appearance:none;max-width:220px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--noir) 50%),linear-gradient(135deg,var(--noir) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.mlsel select:focus{outline:0;box-shadow:0 0 0 3px rgba(27,27,27,.12)}
/* Le picto seul : carré, pas de mot dedans. */
.imprbtn.nu{padding:0;width:34px;min-height:34px;justify-content:center;gap:0}
.visuallyhidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.lsel{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.lsel label{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);flex:none}
.lsel select{flex:1;min-width:0;font:inherit;font-size:14.5px;font-weight:500;color:var(--noir);
  background:#fdfdfc;border:1.25px solid var(--trait);border-radius:6px;padding:11px 12px;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--noir) 50%),linear-gradient(135deg,var(--noir) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.lsel select:focus{outline:0;box-shadow:0 0 0 3px rgba(27,27,27,.12)}

/* ── LES TROIS RYTHMES D'UNE LISTE ──
   Un intertitre discret par bloc. Le rouge n'est PAS permanent : il ne sort que le
   jour où la personne reprend son cycle. Un rouge de tous les jours n'alerte plus. */
.rythme{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--enc2);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--ligne)}
.rythme:empty{display:none}
.rythme.sem{color:#5b8fd4;border-bottom-color:#5b8fd4}
.rythme.rouge{color:#fff;background:var(--rouge);border-bottom:0;padding:6px 9px;margin-top:6px}
/* La tâche de reprise, le jour de la reprise : filet rouge, on ne peut pas la rater. */
.tache.repr{border-color:var(--rouge)}
.tache.repr .tx em{color:var(--rouge)}
.tache .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:3px}

/* ── LES AUTRES LISTES, REPLIÉES ──
   Un volet fermé, en gris : il est là, il ne réclame rien. Une ligne au lieu de
   trente. Ouvert, son contenu recule d'un cran pour qu'on voie bien qu'on est
   « chez les autres ». */
.autrl{margin-top:30px;border:1px solid var(--ligne);background:#f4f3f0}
.autrl>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;
  align-items:baseline;gap:10px;flex-wrap:wrap}
.autrl>summary::-webkit-details-marker{display:none}
.autrl>summary::after{content:'+';margin-left:auto;font-size:17px;font-weight:500;color:var(--enc2)}
.autrl[open]>summary::after{content:'−'}
.autrl>summary b{font-size:13.5px;font-weight:600;color:var(--enc2)}
.autrl>summary span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#a8a5a0}
.autrl>summary em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:#a8a5a0}
.autrl[open]>summary b{color:var(--noir)}
.autrl-c{padding:0 12px 14px;opacity:.82}

/* ── LES PROPOSITIONS D'ACTIVITÉS AU CENTRE ──
   Le filet de gauche dit la SOURCE : rose pour un hébergé, bleu pour un éduc, vert
   pour l'équipe. C'est la seule chose qu'on doit voir avant de lire le texte. */
.prop{border:1px solid var(--ligne);border-left:7px solid var(--ligne);background:#f4f3f0;
  padding:11px 12px 10px;margin-bottom:8px}
.prop.faite{opacity:.6}
.prop-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.prop-s{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:500;color:#1b1b1b;padding:3px 8px}
/* Le compte des demandes : gros, parce que c'est lui qui décide quoi lancer. */
.prop-n{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--noir);border:1.25px solid var(--trait);padding:2px 7px;font-weight:600}
.prop-e{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--enc2)}
.prop>b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.prop>p{font-size:13px;line-height:1.45;color:#4a4844;margin-top:5px}
.prop>em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:6px}
.prop-b{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.prop-b button{flex:none;background:#fdfdfc;border:1.25px solid var(--trait);border-radius:0;padding:8px 12px;
  color:var(--noir);font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:500}
.prop-b button.doux{border-color:var(--ligne);color:var(--enc2)}
.propc{margin:2px 0 0}

/* ── LA PASSATION ──
   Un réveil se lit à l'heure, pas au texte : l'heure vient donc DEVANT, en chiffres
   d'imprimerie, et la chambre juste après. */
/* ═══ LES RANGÉES DE LA PASSATION (sa maquette, 22/08/2026 : « c'est ça que je veux,
   c'est ce design ») ═══
   Un filet entre les lignes, pas un cadre autour de chacune : dix cadres, ce sont dix
   boîtes à lire au lieu d'une liste. Le genre est dit par le TRAIT DE COULEUR à
   gauche — il n'est plus réécrit sur chaque ligne, il est déjà en titre du bloc. */
.pcarte .pl{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--ligne)}
.pcarte .pl:last-child{border-bottom:0}
/* Le trait prend toute la hauteur de la rangée : sur un texte à deux lignes, un petit
   tiret flottant ne se rattache plus à rien. */
/* ⚠ LA CLASSE S'APPELLE `pgc` ET PAS `pt` : `.pt` est DÉJÀ PRISE dans l'app (c'est la
   page « Partager », qui lui donne `min-height:56vh`). Le trait de couleur héritait de
   ses `padding` et de son `display:flex`, et une rangée pouvait se retrouver haute de
   455 px. Trouvé à l'écran le 22/08/2026, pas en relisant. */
.pcarte .pl .pgc{width:4px;border-radius:2px;flex:none;align-self:stretch;min-height:24px;
  padding:0;margin:0;max-width:none}
/* L'heure en colonne, largeur fixe : 05:45 et — doivent tomber au même endroit, sinon
   les textes ne s'alignent pas et la liste ne se lit plus en diagonale. */
.pcarte .pl .h{font-family:ui-monospace,monospace;font-size:13px;font-weight:500;
  letter-spacing:.02em;color:var(--noir);flex:none;min-width:44px}
.pcarte .pl .tx{flex:1;min-width:0;cursor:pointer}
/* ⚠ `pre-wrap` : les retours à la ligne écrits dans la passation doivent se voir à
   l'écran. Sans lui, cinq lignes s'affichaient en un seul paragraphe. */
/* ⚠ TROIS RÈGLES, ET IL FAUT LES TROIS (Mag, 22/08/2026 : « ça dépasse ») :
   · `pre-wrap` garde les retours à la ligne ET les espaces qu'elle a tapés — c'est sa
     mise en page à elle, elle ne doit pas être écrasée à l'affichage ;
   · `overflow-wrap:anywhere` coupe un mot trop long. Sans lui, un texte sans espace
     (un matricule, une adresse collée) sortait par la droite de la carte ;
   · `word-break:break-word` fait la même chose sur les navigateurs qui ignorent encore
     `anywhere` — dont le Safari de certains téléphones de l'équipe.
   ⚠ ET `min-width:0` SUR LE PARENT FLEX, plus bas : sans lui, une boîte flex refuse de
   descendre sous la largeur de son contenu, et aucune des trois règles ne s'applique. */
.pcarte .pl .tx b{display:block;font-size:15px;font-weight:400;line-height:1.35;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.pcarte .pl.faite .pgc{opacity:.35}
.pcarte .pl.faite .h,.pcarte .pl.faite .tx b{color:#8b8984;text-decoration:line-through}
/* La seconde ligne — chambre, jour, qui — en petit et en gris, et seulement quand elle
   a quelque chose à dire. */
.pcarte .pl .plbas{display:block;font-style:normal;font-family:ui-monospace,monospace;
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:3px}
.pcarte .pl .passcom{display:block;font-family:'Eastman',system-ui,sans-serif;font-size:13px;
  letter-spacing:0;text-transform:none;font-style:normal;color:var(--enc2);line-height:1.4;margin-top:4px}
/* L'aplat vert : « c'est très important, ils doivent le savoir ». Un liseré fin sur une
   ligne parmi dix, à 5 h du matin, ça se rate. */
/* Ce qu'on vient faire à ce moment-là : vert comme l'étiquette « à jeun », mais en
   phrase — c'est une consigne, pas une catégorie. */
.pcarte .pl .pjeun-r{display:block;font-style:normal;font-family:'Eastman',system-ui,sans-serif;
  font-size:12.5px;line-height:1.35;color:#2f6b52;margin-top:3px}
.pcarte .pl .ajeun{font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;background:#6cb392;color:#0f2b1f;
  border-radius:3px;padding:4px 8px;flex:none}
.pcarte .pl .ib{width:30px;height:30px;flex:none;border:1px solid var(--ligne);border-radius:5px;
  background:#fdfdfc;color:var(--enc2);display:inline-flex;align-items:center;justify-content:center}
.pcarte .pl .ib svg{width:13px;height:13px}
.pcarte .pl .cas{width:26px;height:26px;flex:none;border:1.25px solid var(--trait);border-radius:4px;
  background:transparent;display:flex;align-items:center;justify-content:center}
.pcarte .pl.faite .cas{background:var(--noir);border-color:var(--noir)}
.pcarte .pl .cas .ic{width:14px;height:14px;color:#3ec98b}
.pcarte .pvide{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#8b8984;padding:14px 0 4px}
/* ── La rangée de la check-list du travail : c'est un BOUTON (on coche en tapant
   n'importe où), mais il doit se dessiner comme une rangée, pas comme un bouton. ── */
.pcarte button.pl{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--ligne);
  border-radius:0;color:var(--noir)}
.pcarte button.pl:last-child{border-bottom:0}
.pcarte .pl.repr .tx b{font-weight:600}
/* Le sous-titre rouge du jour de reprise : c'est le seul moment où ces tâches
   existent, elles doivent sauter aux yeux avant le reste. */
.pcarte .pgt.rouge{color:var(--rouge);border-bottom-color:var(--rouge)}
.pcarte .pgt.sem{color:#5b8fd4;border-bottom-color:#5b8fd4}

/* ═══ LA RANGÉE DE MA LISTE PERSO (Mag, 22/08/2026) ═══
   « Tout ça sur une ligne et le texte en dessous. Bien délimité par une ligne pour
   qu'on voie bien les choses différentes sur les listes. »
   Les commandes tiennent une ligne à elles ; le texte a toute la largeur en dessous et
   peut prendre autant de lignes qu'il veut. C'est ce qui permet d'écrire long — et
   d'écrire long, elle en a besoin tous les jours. */
/* ═══ CE QUI RESTE À FAIRE SE VOIT (Mag, 22/08/2026) ═══
   « Ce qu'il reste à faire, ça doit être un peu mis en avant — peut-être une petite
   barre de couleur devant, un détail qui fait qu'on voit ce qu'il reste à faire, que ce
   soit un peu plus différencié de ceux qui sont déjà cochés. »
   Une ligne cochée et une ligne à faire se ressemblaient trop : le texte barré, c'est
   tout, et il faut LIRE pour s'en apercevoir. Maintenant ça se voit sans lire — un trait
   bleu à gauche sur ce qui attend, rien sur ce qui est fait.
   ⚠ LE BLEU EST LA COULEUR ORDINAIRE : le jaune (à dire en réunion) et le rouge (en
   retard) restent des exceptions et l'emportent, plus bas dans cette feuille de style.
   Trois traits, trois degrés d'urgence, et le plus calme est celui qu'on voit le plus
   souvent. */
.pcarte .pl2{padding:12px 0 12px 11px;border-bottom:1px solid var(--ligne);
  box-shadow:inset 3px 0 0 #a9c8e8}
.pcarte .pl2:last-child{border-bottom:0}
.pcarte .pl2-h{display:flex;align-items:center;gap:8px}
.pcarte .pl2-h .pl2-sep{flex:1;min-width:0}
.pcarte .pl2-t{margin-top:9px;cursor:pointer}
/* Même règle qu'au-dessus : depuis que le champ est multi-ligne, ce qu'on écrit ici
   porte des retours à la ligne, et ils doivent se voir. */
.pcarte .pl2-t b{display:block;font-size:15.5px;font-weight:400;line-height:1.35;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.pcarte .pl2-t em{display:block;font-style:normal;font-family:ui-monospace,monospace;
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.pcarte .pl2 .cas{width:26px;height:26px;flex:none;border:1.25px solid var(--trait);border-radius:4px;
  background:transparent;display:flex;align-items:center;justify-content:center}
.pcarte .pl2.faite .cas{background:var(--noir);border-color:var(--noir)}
/* ⚠ CE QUI EST FAIT PERD SON TRAIT ET S'EFFACE UN PEU : c'est fini, ça n'a plus à
   réclamer l'œil. Ça reste lisible — on doit pouvoir vérifier ce qu'on a coché — mais
   ça passe derrière. */
.pcarte .pl2.faite{box-shadow:none;padding-left:0;opacity:.6}
.pcarte .pl2 .cas .ic{width:14px;height:14px;color:#3ec98b}
.pcarte .pl2.faite .pl2-t b{color:#8b8984;text-decoration:line-through}
.pcarte .pl2 .ib{width:32px;height:32px;flex:none;border:1px solid var(--ligne);border-radius:5px;
  background:#fdfdfc;color:var(--enc2);display:inline-flex;align-items:center;justify-content:center}
.pcarte .pl2 .ib svg{width:14px;height:14px}
/* Le calendrier s'allume quand la ligne porte un jour : on voit d'un coup d'œil
   lesquelles sont datées, sans lire. */
.pcarte .pl2 .ib.on{border-color:var(--noir);color:var(--noir)}
.pcarte .pl2 .rapPass.mini{min-height:32px;padding:0 11px;font-size:8.5px;border-width:1px;
  border-radius:5px;flex:none}
/* ═══ LES COMMANDES D'UNE LIGNE DE PASSATION ═══
   Elles occupent toute une ligne sous le texte plutôt que de se serrer à sa droite :
   à trois boutons, dont un qui porte quatre mots, il n'y a pas la place sur 375 px — et
   c'est le TEXTE qu'on écraserait, alors que c'est lui qu'on vient lire.
   ⚠ Alignées à droite : elles se lisent après le texte, jamais avant. */
.pcarte .pl{flex-wrap:wrap}
.pcarte .pl .plact{flex:1 0 100%;display:flex;justify-content:flex-end;align-items:center;
  gap:8px;margin-top:8px}
.pcarte .pl .plact .ib{width:32px;height:32px;flex:none;border:1px solid var(--ligne);
  border-radius:5px;background:#fdfdfc;color:var(--enc2);display:inline-flex;
  align-items:center;justify-content:center}
.pcarte .pl .plact .ib svg{width:14px;height:14px}
.pcarte .pl .plact .ib.sup{color:var(--rouge);border-color:var(--rouge)}
.pcarte .pl .plact .rapPass.mini{min-height:32px;padding:0 11px;font-size:8.5px;
  border-width:1px;border-radius:5px;flex:none}
/* La corbeille est rouge, mais seulement au trait : un aplat rouge sur chaque ligne
   ferait de « supprimer » la chose la plus voyante de la carte. */
.pcarte .pl2 .ib.sup{color:var(--rouge);border-color:var(--rouge)}
/* En retard : la ligne porte un trait rouge à gauche. Le rendez-vous est peut-être en
   train de se rater — c'est le seul cas qui a le droit de crier ici. */
/* ⚠ LE TRAIT ROUGE RESTE DANS LA CARTE : posé en `box-shadow` plutôt qu'en bordure
   avec marge négative, il ne dépasse pas du bord arrondi de la carte. */
.pcarte .pl2.retard{box-shadow:inset 3px 0 0 var(--rouge);padding-left:11px}
/* ═══ CE QUI DOIT ÊTRE DIT EN RÉUNION (Mag, 22/08/2026) ═══
   « Peut-être une couleur jaune devant, un truc qui les met un peu en avant. »
   Le jaune de l'app, en trait à gauche — le même repère que le rouge du retard, une
   couleur plus haut dans la liste. L'étoile du bouton s'allume de la même couleur : le
   geste et son effet portent la même marque. */
/* ⚠ LE TRAIT SEUL, PAS LE FOND (Mag, 22/08/2026 : « tu peux laisser juste la ligne en
   jaune devant, mais retire-lui le fond jaune »). Un fond teinté sur plusieurs lignes
   d'affilée devient un bloc de couleur, et c'est le bloc qu'on voit au lieu des lignes.
   Le trait, lui, marque sans peser. */
/* ⚠ ÉCRIT APRÈS `.faite`, ET C'EST VOLONTAIRE : une ligne faite perd son trait, mais une
   ligne de réunion le garde même cochée — c'est la règle du 22/08 (« je peux avoir fait
   un truc dont je dois quand même parler en réunion »). L'ordre des deux règles dans
   cette feuille EST la règle : ne pas les inverser. */
.pcarte .pl2.reunion{box-shadow:inset 3px 0 0 #f5c542;padding-left:11px}
.pcarte .pl2 .ib.reunion{border-color:#e0ad10;color:#a97c05;background:#fdf6e3}
.pcarte .pgt.reunion{color:#a97c05;border-bottom-color:#f5c542}
/* Les absences : le bleu des jours (même famille que le calendrier et l'info dans les
   autres feuilles). Le repère à gauche est un filet bleu, comme la réunion est jaune. */
.pcarte .pl2.absence{box-shadow:inset 3px 0 0 #e63329;padding-left:11px}
.pcarte .pgt.absence{color:#e63329;border-bottom-color:#e63329}
/* ═══ LE BLOC « DÉSENCODAGES » (Mag, 24/08/2026) ═══
   Fond rouge pâle + bordure et titre rouges : le bloc doit S'ARRÊTER À L'ŒIL sans
   rendre le texte illisible. Un rouge plein forçait tout en blanc et avalait les
   mots ; ici on garde les couleurs normales (texte noir, boutons lisibles), et c'est
   le fond + le trait qui signalent « ne pas oublier ». */
.pcarte .encgrp{background:#fdeeed;border:1.5px solid #e63329;border-radius:10px;
  padding:8px 11px 4px;margin-top:16px}
.pcarte .encgrp .pgt{color:#e63329;border-bottom-color:#e63329}
.pcarte .encgrp .pl2{background:transparent}
/* La mention « Absence » posée sous le texte d'une note : case + mot, en rouge. */
.pcarte .pl2 .absnote{display:inline-flex;align-items:center;gap:8px;margin-top:6px;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:#b4b2a9;font-weight:600;cursor:pointer}
.pcarte .pl2 .absnote .bx{width:13px;height:13px;border:1.5px solid #b4b2a9;border-radius:3px;background:none;flex:none}
.pcarte .pl2 .absnote.on{color:#e63329}
.pcarte .pl2 .absnote.on .bx{border-color:#e63329;background:#e63329}
/* ═══ CE QUI EST PARTI EN PASSATION, EN FIN DE LISTE (Mag, 22/08/2026) ═══
   « Ça part en fin de liste dans une autre couleur. » La teinte dit « ce n'est plus
   pour moi, c'est chez l'équipe qui arrive » — sans le répéter en toutes lettres sur
   chaque ligne. Le petit trait à gauche garde la couleur du GENRE, comme dans la carte
   du bas : les deux endroits parlent de la même ligne, ils doivent se ressembler. */
/* ═══ « PARTIES EN PASSATION » EST UN VRAI TITRE (Mag, 22/08/2026) ═══
   « Il faut mettre un plus gros titre, le même que Ma liste perso, juste pour qu'on voie
   mieux, en noir — qu'on passe à autre chose. »
   C'était un sous-titre en petites capitales grises, comme « Aujourd'hui » ou « En
   retard » : le même rang typographique que des groupes de MA liste, alors que ces
   lignes-là ne m'appartiennent plus — elles sont chez l'équipe de nuit. Il prend donc le
   dessin d'un titre de carte : gros, noir, gras, avec de l'air au-dessus. On voit qu'on
   change de monde avant même d'avoir lu le mot. */
.pcarte .pgt.pass{font-family:'Eastman',system-ui,sans-serif;font-size:16px;font-weight:700;
  letter-spacing:-.01em;text-transform:none;color:var(--noir);
  border-bottom:2px solid var(--noir);padding-bottom:7px;margin:30px 0 2px}
/* ⚠ PLUS DE FOND BLEU NON PLUS (22/08/2026). Même raison : la teinte transformait ces
   lignes en pavé. C'est le TITRE qui dit qu'on change de monde, pas la couleur du fond —
   voir `.pgt.pass` juste en dessous. */
.pcarte .pl2.pass{padding-left:11px}
.pcarte .pl2.pass .pgc{width:4px;height:22px;border-radius:2px;flex:none;padding:0;margin:0;
  max-width:none;display:block}
.pcarte .pl2.pass[data-faite="1"] .pl2-t b{color:#8b8984;text-decoration:line-through}
/* Le commentaire de la passation, relu depuis la liste : en clair, pas en capitales —
   c'est une phrase, pas une étiquette. */
