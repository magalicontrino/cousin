.pcarte .pl2 .plcom{display:block;font-style:normal;font-size:13px;line-height:1.4;
  color:var(--enc2);margin-top:4px}

/* ═══ LA CARTE DE LA PASSATION (Mag, 22/08/2026) ═══
   Blanche, bord noir : elle se détache de la page crème, et ce qui est dedans se lit
   comme « ça part chez quelqu'un d'autre ». */
/* ═══ LES TROIS COLONNES SONT RETIRÉES (Mag, 22/08/2026) ═══
   « Sur écran, on remet l'un à la suite de l'autre. C'est pas beau comme ça. »
   Elles avaient été posées le matin même, à sa demande — « ce qu'il y a sur téléphone
   en trois fois, tu le remets sur écran en trois colonnes ». Vu en vrai, ça ne tenait
   pas : les trois blocs n'ont ni la même longueur ni le même rythme, et chacun devait
   se resserrer pour entrer dans 355 px — les listes de tâches perdaient leur seconde
   colonne, les rangées repliaient leurs boutons sous le texte, et « La passation »
   flottait seule dans une colonne vide.
   ⚠ `.ml3` NE FAIT DONC PLUS RIEN, et c'est volontaire : l'enveloppe reste dans le
   HTML pour qu'on puisse ressayer une autre disposition sans retoucher le rendu.
   Une largeur maximale suffit — au-delà, une ligne de tâche s'étire sur toute la
   largeur d'un écran et on perd le début en lisant la fin. */
#view .ml3{max-width:720px}
#view .ml3 .pcarte{max-width:none}

.pcarte{background:#fdfdfc;border:1.5px solid var(--noir);border-radius:12px;
  padding:14px;margin-top:24px;max-width:620px}
/* ⚠ LE TITRE NE SE COUPE PAS EN DEUX : depuis que le bouton d'impression est là, « Ma
   liste perso » se cassait en « Ma liste / perso » sur un téléphone. Le titre reste
   entier, et ce sont les boutons qui passent à la ligne s'il manque de la place. */
.pcarte .ptitre{display:flex;align-items:center;justify-content:flex-start;gap:10px;
  flex-wrap:wrap}
.pcarte .ptitre b{white-space:nowrap}
.pcarte .ptitre b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.pcarte .ptitre span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2)}
/* Le titre qui plie : c'est un bouton, mais il doit se lire comme un titre. Seul le
   chevron dit qu'on peut appuyer — et il tourne quand c'est ouvert. Le sous-titre se
   colle au titre (flex-start), le chevron, lui, part au bout à droite. */
.pcarte .ptitre-pli{width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
/* ⚠ LE CHEVRON TOUT À DROITE (Mag, 24/08/2026) : sur un titre nu (la check-list), le
   `justify-content:space-between` poussait aussi le SOUS-TITRE à droite. On repasse en
   flex-start, et seul le chevron s'écarte via `margin-left:auto`. */
.pcarte .ptitre-pli{display:flex;align-items:center;gap:10px}
.pcarte .ptitre-pli .ch{margin-left:auto}
/* La même carte, mais avec un bouton en plus à droite du titre (l'impression). Le
   bouton-pli devient extensible (`flex:1`) au lieu de `width:100%`, pour laisser la
   place au bouton d'impression sur la même ligne. Le chevron garde sa rotation. */
.pcarte .ptitre-lire{flex-wrap:nowrap}
.pcarte .ptitre-lire .ptitre-pli{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.pcarte .ptitre-lire .ptitre-pli span{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Le chevron du repli se pousse au bout à droite de la ligne, sous le bouton
   d'impression — le même geste qu'au titre de la check-list (Mag, 24/08/2026). */
.pcarte .ptitre-lire .ptitre-pli .ch{margin-left:auto}
.pcarte .ptitre-lire .ptitre-i{margin-left:6px}
.pcarte .ptitre-pli .ch{font-style:normal;font-size:15px;color:var(--enc2);flex:none;
  transition:transform .15s ease;transform:rotate(90deg)}
.pcarte.plie .ptitre-pli .ch{transform:rotate(0deg)}
/* ⚠ LE CHEVRON SORTI DU BOUTON (passation, Ma liste perso) : il est posé en dernier,
   hors du bouton-pli, donc la règle ci-dessus ne l'atteint pas. Il doit tourner de la
   même façon — sinon il reste penché à côté du titre qui, lui, est droit. */
.pcarte .ptitre-lire .ch{font-style:normal;font-size:15px;color:var(--enc2);flex:none;
  transition:transform .15s ease;transform:rotate(90deg);margin-left:6px}
.pcarte.plie .ptitre-lire .ch{transform:rotate(0deg)}
.pcarte.plie{padding-bottom:14px}
/* Le bouton du coin droit du titre : il doit se voir comme un bouton — sinon on le lit
   comme l'étiquette qu'il remplace — mais rester plus discret que le titre. */
/* ⚠ MÊME HAUTEUR QUE LE BOUTON D'IMPRESSION (Mag, 22/08/2026 : « tu mets le bouton
   effacer la liste à la même taille que le bouton print en hauteur »). Deux boutons
   voisins de hauteurs différentes, ça se voit tout de suite et ça n'a aucune raison
   d'être : ils sont du même ordre, ils doivent avoir la même assise. */
.pcarte .ptitre-b{display:inline-flex;align-items:center;justify-content:center;
  min-height:32px;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--enc2);background:#fdfdfc;border:1px solid var(--ligne);
  border-radius:5px;padding:0 11px;flex:none;white-space:nowrap}
.pcarte .ptitre-b:active{color:var(--rouge);border-color:var(--rouge)}
.pcarte .ptitre-i{width:32px;height:32px;flex:none;border:1px solid var(--ligne);border-radius:5px;
  background:#fdfdfc;color:var(--enc2);display:inline-flex;align-items:center;justify-content:center;
  margin-left:auto}
.pcarte .ptitre-i svg,.pcarte .ptitre-i .pico{width:14px;height:14px}
/* Quand le bouton d'impression est là, c'est lui qui pousse à droite — le suivant
   ne doit plus le refaire, sinon ils se séparent aux deux bouts de la ligne. */
.pcarte .ptitre-i ~ .ptitre-b,.pcarte .ptitre-i ~ span{margin-left:8px}
/* Les trois rythmes sur une tâche du modèle : de petits boutons sous le texte, pas une
   étiquette. Il faut voir d'un coup d'œil lequel est posé ET pouvoir le corriger sans
   retaper la ligne. */
.modry{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;font-style:normal}
.modry-b{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;color:#8b8984;background:none;border:1px solid var(--ligne);
  border-radius:999px;padding:3px 8px}
.modry-b.on{background:var(--noir);border-color:var(--noir);color:var(--creme)}
.pcarte .pgt{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--enc2);border-bottom:1px solid var(--noir);
  padding-bottom:4px;margin:16px 0 4px}
/* ⚠ UN APLAT, PAS UN LISERÉ : « c'est très important, ils doivent le savoir ». */
/* Le message d'une passation : coupé à deux lignes tant qu'on ne l'ouvre pas. */
.passcom.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.passcom.ouvert{display:block;-webkit-line-clamp:unset;overflow:visible}
.passplus{display:block;margin-top:4px;padding:0;background:none;border:0;
  font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--enc2);border-bottom:1px dotted var(--enc2)}
.passjeun{display:inline-block;margin-left:8px;font-family:ui-monospace,monospace;
  font-size:8.5px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;
  background:#6cb392;color:#0f2b1f;border-radius:3px;padding:3px 7px;vertical-align:2px}
/* La case du formulaire : un vrai bouton, pas une case à cocher de navigateur. */
.passcase{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1.25px solid var(--trait);border-radius:6px;background:#fdfdfc;padding:11px 12px;
  margin-top:8px;font-size:14px;color:var(--noir)}
.passcase i{width:19px;height:19px;border:1.5px solid var(--trait-fort);border-radius:5px;
  flex:none;display:inline-block}
.passcase span{flex:1;min-width:0;line-height:1.3}
.passcase span b{font-weight:600}
.passcase.on{border-color:#6cb392}
.passcase.on i{background:#6cb392;border-color:#6cb392}
/* Le second bouton du champ : même hauteur que « OK », mais creux — c'est le chemin
   de côté, pas le geste courant. */
.rapPass{flex:none;background:#fdfdfc;color:var(--noir);border:1.25px solid var(--noir);
  border-radius:5px;padding:0 13px;min-height:42px;font-family:ui-monospace,monospace;
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.passmod{width:30px;height:30px;flex:none;border:1px solid var(--ligne);border-radius:5px;
  background:#fdfdfc;color:var(--enc2);display:inline-flex;align-items:center;
  justify-content:center;margin-left:6px}
.passmod svg{width:13px;height:13px}
.passannul{display:block;width:100%;text-align:center;margin-top:8px;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);background:none;border:0;padding:8px}
.passannul.sup{color:var(--rouge)}
.passl{margin:2px 0 0}
.passl-t{display:block;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);margin-bottom:7px}
/* Un seul destinataire possible : on l'écrit, on ne le fait pas choisir. Un choix à une
   seule option est une question à laquelle on a déjà répondu. */
.passl-1{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:600;color:var(--noir)}
/* La porte de sortie de l'administration : discrète, en pointillé — ce n'est pas une
   équipe de plus, c'est « montre-moi tout ». */
.fchip.toutes{border-style:dashed;color:var(--enc2)}

/* La carte du raccourci, sur l'accueil : elle attend, elle ne surgit pas. */
.onb-rap{border:1.25px solid var(--trait);background:#fdfdfc;padding:13px 14px;margin:0 0 18px}
.onb-rap-t{display:flex;align-items:center;gap:9px}
.onb-rap-t .ic{width:16px;height:16px;flex:none}
.onb-rap-t b{font-size:14.5px;font-weight:600;line-height:1.25}
.onb-rap p{font-size:13px;line-height:1.45;color:var(--enc2);margin-top:6px}
.onb-rap-b{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.onb-rap-b .acok{width:auto;padding:9px 15px}
.onb-rap-x{background:none;border:0;border-radius:0;padding:9px 4px;color:var(--enc2);
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
/* Un rappel daté, passé et jamais coché : filet rouge. C'est le seul de cette liste
   qui doive crier — le rendez-vous est peut-être en train de se rater. */
.tache.rapretard{border-left:7px solid var(--rouge)}
/* La ligne du jour, sous le champ d'ajout : discrète, parce qu'elle est facultative. */
.tbact{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.tbact button{flex:none;background:#fdfdfc;border:1.25px solid var(--trait);border-radius:0;padding:8px 12px;
  color:var(--noir);font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.tbact button.plein{background:var(--noir);color:#f2eee6}
.tbact button.doux{border-color:var(--ligne);color:var(--enc2)}
.chet .chq{margin-left:auto;flex:none}
.chdel{width:100%;background:transparent;border:1px solid var(--ligne);border-radius:0;margin-top:9px;
  padding:9px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;color:var(--danger)}
/* Réseau : le picto dans le coin bas-droit de la case (demande de Mag, 05/08/2026). */
.dgrid.res .tile .pi{margin:auto 0 0 auto}
/* Le grand carré de couleur qui porte le picto (pavés du Centre, choix « 3 »). */
.psq{margin:auto 0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center;color:var(--noir)}
.psq .ic{width:30px;height:30px}
.tn2{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  color:var(--enc2);font-weight:500;margin:4px 0 0 24px}
.foot{padding:22px 0 30px;text-align:center;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:#a3a19c}
.foot .sign{letter-spacing:.1em;text-transform:none;font-weight:600}

/* ---- rail des domaines : cases au trait collées, l'active s'inverse (choix « 2 » de Mag) ---- */
.rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:2px var(--pad) 14px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 13px 12px;color:var(--noir);background:#f4f3f0;
  border:1px solid var(--ligne);border-right:0;border-radius:0;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.rail button:last-child{border-right:1px solid var(--ligne)}
.rail button .ic{width:24px;height:24px}
.rail button.on{background:var(--noir);color:#f2eee6}

/* ---- barre haute des sous-vues ---- */
.subtop{position:sticky;top:calc(67px + env(safe-area-inset-top));z-index:30;background:var(--creme);
  margin:0 calc(-1 * var(--pad));padding:10px var(--pad);
  display:flex;align-items:center;gap:12px}
.cbtn{width:38px;height:38px;flex:none;border-radius:0;background:transparent;
  border:1.25px solid var(--trait);display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
.cbtn:active{transform:scale(.92)}
.cbtn .ic{width:14px;height:14px}
.subtop h1{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtop .count{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:var(--enc2);flex:none}
/* Pages de domaine : bandeau noir + pastille couleur (mélange « 3 + 2 » choisi par Mag). */
.subtop.noir{background:var(--noir)}
.subtop.noir h1{color:#f2eee6;white-space:normal;overflow:visible;line-height:1.1}
.subtop.noir .cbtn{border-color:#f2eee6;color:#f2eee6}
.pastille{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;font-weight:500;
  padding:4px 9px;color:var(--noir);flex:none;white-space:nowrap}

/* ---- BANDEAU DE TITRE D'ÉCRAN (handoff Claude Design, 06/08/2026) ----
   Bloc noir pleine largeur : surtitre machine en couleur d'accent, gros titre 38px,
   picto 36px de la couleur d'accent à droite. La première carte de contenu remonte
   de 12px pour chevaucher le bandeau. */
.hero{position:sticky;top:calc(67px + env(safe-area-inset-top));z-index:30;
  background:var(--noir);color:#f2eee6;margin:0 calc(-1 * var(--pad));
  padding:18px var(--pad) 20px;display:flex;align-items:flex-end;gap:12px}
.hero .htx{flex:1;min-width:0}
/* ⚠ PAS DE SURVOL QUI BOUGE (règle du 18/08) : le trait pointillé dit que ça se
   clique, en permanence, sans rien qui glisse sous le curseur. */
.hero .hsur-l{border:0;background:none;padding:0 0 1px;cursor:pointer;text-align:left;
  border-bottom:1px dotted currentColor}
.hero .hsur{display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:500}
/* ⚠ MÊME TAILLE QUE L'ACCUEIL (Mag, 22/08/2026 : « pourquoi les titres ne sont pas de
   la même taille ? Tu peux mettre des titres normaux, un peu comme on a fait sur la
   page d'accueil »). Ils montaient à 38 px, 46 px, et jusqu'à 60 px sur écran —
   « MA LISTE » traversait la page pendant que la liste elle-même attendait dessous.
   Un seul réglage, le sien : min(8vw, 34px). Les deux agrandissements tombent. */
.hero h1{display:block;font-size:min(8vw,34px);font-weight:700;text-transform:uppercase;
  letter-spacing:-.03em;line-height:.92;margin-top:6px;color:#f2eee6}
.hero .hpic{width:36px;height:36px;flex:none}
.hero .hpic .ic{width:100%;height:100%}
.hero .cbtn{width:36px;height:36px;border-radius:50%;border-color:#f2eee6;color:#f2eee6;align-self:center}
.hero .cbtn .ic{width:13px;height:13px}

/* ---- Cartes de domaines : bande de couleur en haut (handoff) ---- */
.dgrid.res{grid-template-columns:repeat(2,1fr);gap:10px;border:0;margin-bottom:16px}
/* Les six grandes portes : des intertitres, pas des boutons. Elles annoncent, on
   ne clique pas dessus  d'où le trait plein et l'absence de cadre. */
.porte{display:flex;align-items:center;gap:9px;border-bottom:2px solid var(--noir);
  padding-bottom:5px;margin:22px 0 11px}
.porte:first-child{margin-top:10px}
/* Les six portes en boutons : la rangee qu on lit en arrivant. */
/* ═══ L'ACCORDÉON DU RÉSEAU (son choix « A », 15/08/2026) ═══
   Quinze lignes pleine largeur, une seule ouverte. La pastille de couleur est à
   gauche pour qu'on reconnaisse la porte SANS lire le mot — c'est la même couleur
   que les fiches du tiroir. Le nombre est à droite, discret : il renseigne, il
   n'attire pas. */
.dportes{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 4px}
.dporte{border:1.25px solid var(--trait);border-radius:999px;background:#f6f5f3;color:var(--noir);
  padding:9px 14px;font-family:ui-monospace,monospace;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:background .16s ease,box-shadow .16s ease}
.dporte.on{background:var(--noir);color:var(--creme)}
/* ═══ LE SURVOL DU RAIL, DONNÉ AUX PASTILLES (Mag, 18/08/2026) ═══
   Ses mots : « le même glissement sur les boutons à gauche sur écran, ils sont
   parfaits », puis « fais exactement les mêmes sur les boutons ».
   Les pastilles du Réseau n'avaient AUCUN survol : on ne savait pas laquelle on
   désignait avant de cliquer. Elles reçoivent donc la même réponse que le rail —
   le fond s'éclaircit et un trait net apparaît.
   ⚠ CE QUI N'EST PAS REPRIS DU RAIL : le glissement de 6 px. Sur le rail il ne
   gêne pas (les boutons font toute la largeur, on les aborde toujours par la
   droite). Ici les pastilles sont petites et se touchent presque : une pastille
   qui se décale sort de sous le curseur ou vient buter contre sa voisine — c'est
   exactement le clignotement qu'on vient de retirer.
   Le trait net dit la même chose sans bouger. */
@media (hover:hover){
  .dporte:not(.on):hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .dporte.on:hover{background:#333}
  /* Les tiroirs en pastilles, sous une porte ouverte : même réponse. */
  .dbtn:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  /* Les deux boutons d'avis (« Conseillé par l'équipe », « Réservé aux femmes »). */
  .favchip:not(.on):hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .favchip.deco:not(.on):hover{box-shadow:0 0 0 1.5px var(--rouge)}
}
.dbtn{transition:background .16s ease,box-shadow .16s ease}
.favchip{transition:background .16s ease,box-shadow .16s ease}
/* Le panneau d une fiche : meme mecanique que celui des Activites. */
.fpan .actpt .rd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:var(--noir)}
.fpan .actpt .rd .ic{width:19px;height:19px}
.fpcond{font-size:15px;line-height:1.45;font-weight:500;margin:10px 0 0;padding-left:11px;
  border-left:3px solid var(--noir)}
.fpdesc{font-size:14.5px;line-height:1.45;color:#4a4844;margin:10px 0 0}
.fpl{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #eae6de;font-size:14.5px}
.fpl em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#8b8984;flex:none;width:74px;padding-top:3px}
.fpl span{flex:1;min-width:0}
.fpied{display:flex;gap:8px;padding:10px 14px 14px}
.fpb{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1.25px solid var(--trait);border-radius:10px;background:#fdfdfc;color:var(--noir);
  padding:12px 8px;font-family:ui-monospace,monospace;font-size:10.5px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.fpb .ic{width:16px;height:16px}
.fpb.plein{background:var(--noir);color:var(--creme)}
/* Les details ajoutes sur la carte de liste. */
.fr2c{display:block;font-size:13px;line-height:1.35;color:var(--noir);font-weight:500;margin-top:4px}
.fr2h{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;
  color:#8b8984;margin-top:4px}
/* Les étiquettes de l'équipe sur la carte : posées sur leur propre ligne, sinon
   elles se collent au nom du lieu et on lit « Le Clos Nuit ». */
.fr2e{display:block;margin-top:5px}
.fr2e .etqp{margin-right:4px}
/* Les petits tiroirs en boutons : ils gardent leur picto et leur compte, mais ne
   prennent plus la place d'un tiroir a 44 fiches. */
.dbtns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.dbtn{display:inline-flex;align-items:center;gap:8px;border:1.25px solid var(--trait);
  border-radius:999px;background:#f6f5f3;color:var(--noir);padding:9px 14px 9px 11px;
  font-family:ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer}
.dbtn .ic{width:20px;height:20px;flex:none}
.dbtn i{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;
  color:var(--enc2);font-weight:500}
.porte b{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:600}
/* ═══ LES BOUTONS DU RÉSEAU, VERSION C (Mag, 13/08/2026) ═══
   « Les boutons réseau plus apparents, légèrement » → trois maquettes → « C, et la
   font plus visible aussi, et c'est le picto qui prend la couleur. »
   ⚠ Le trait passe au NOIR : sur le fond crème, un trait gris clair ne détache pas
   la tuile, et c'est ça qui les rendait molles. */
.dgrid.res .tile{background:#f6f5f3;border:1.25px solid var(--trait);border-radius:6px;overflow:hidden;
  padding:0;min-height:134px}
/* La bande de couleur est effacée : la couleur est passée sur le picto. Une seule
   ligne à remettre à 8px pour revenir en arrière. */
.dgrid.res .tile .bande{height:0;display:block;flex:none}
.dgrid.res .tile .tin{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1}
/* ⚠ LE NOM PLUS VISIBLE, elle l'a demandé avec C : 10 → 12 px, et l'écart entre les
   lettres resserré (.16em → .10em) parce qu'en capitales espacées, agrandir sans
   resserrer fait déborder « Droit des étrangers » sur trois lignes. */
.dgrid.res .tile b{font-family:ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.10em;
  text-transform:uppercase;line-height:1.4}
.dgrid.res .tile .tn2{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
  color:var(--enc2);font-weight:500;margin:2px 0 0}
/* ⚠ LE DESSIN LUI-MÊME EST EN COULEUR, pas posé sur un carré (Mag, 13/08/2026 :
   « le picto en couleur, pas sur un carré en couleur, et un peu plus gros du coup »).
   Le carré plein mangeait le dessin — on voyait la tache de couleur avant le picto,
   alors que c'est le picto qui dit ce qu'il y a derrière. Sans fond, le dessin peut
   grossir : 24 → 44 px, et il devient le repère à lui seul. */
.dgrid.res .tile .pi{margin:auto 0 0 auto;width:52px;height:52px;color:var(--noir);
  display:flex;align-items:center;justify-content:center}
.dgrid.res .tile .pi .ic{width:44px;height:44px}
/* Au survol comme au clic, la carte reste CLAIRE et son picto reste NOIR :
   les cartes du Réseau ne s'inversent pas (l'ancienne grille, elle, le faisait —
   d'où le picto qui pâlissait). Mag, 06/08/2026. */
@media (hover:hover){
  .dgrid.res .tile:hover{background:#fdfdfc;color:var(--noir);border-color:var(--trait-fort)}
  .dgrid.res .tile:hover b{color:var(--noir)!important}
  .dgrid.res .tile:hover .tn2,.dgrid.res .tile:hover small{color:var(--enc2)}
  .dgrid.res .tile:hover .pi,.dgrid.res .tile:hover .ic{color:var(--noir)}
}
.dgrid.res .tile:active{background:#fdfdfc;color:var(--noir);border-color:var(--trait-fort)}
.dgrid.res .tile:active b{color:var(--noir)!important}
.dgrid.res .tile:active .tn2,.dgrid.res .tile:active small{color:var(--enc2)}
.dgrid.res .tile:active .pi,.dgrid.res .tile:active .ic{color:var(--noir)}

/* ---- filtres : le mot, précédé d'un petit carré ----
   ⚠ LES CASES AU TRAIT SONT PARTIES (Mag, 18/08/2026 : « je préférais les boutons
   avant, c'est juste écrit avec un petit carré devant »). Une rangée de dix cadres
   noirs pesait autant que le contenu qu'elle filtrait. Le carré porte l'état :
   creux au repos, plein quand le filtre est choisi. Même dessin que les besoins du
   Réseau — un seul langage pour tous les tris de l'app. */
/* ═══ LES CHIPS DE FILTRE (redessinées le 18/08/2026) ═══
   Deux reproches de Mag, et ils allaient ensemble : « trouve un truc un peu plus
   joli, plus coloré » et « quand c'est un peu long, on ne voit pas tout ».
   ⚠ LE PREMIER DÉFAUT ÉTAIT INVISIBLE, ET C'EST LE PLUS GRAVE : la rangée
   défilait à l'horizontale (`overflow-x:auto`) sans rien pour le dire. Sur un
   téléphone, « Femmes » ou « Sans rendez-vous » sortaient de l'écran et personne
   ne savait qu'ils existaient — exactement ce que l'app refuse (on ne doit jamais
   devoir chercher). Elles passent donc à la ligne : deux rangées visibles valent
   mieux qu'une rangée tronquée.
   ⚠ LA COULEUR N'EST PAS DÉCORATIVE : chaque valeur garde LA SIENNE, posée par
   `--c`. On retrouve un filtre à sa teinte sans relire toute la rangée. */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:10px 0}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 11px;border-radius:8px;border:1.5px solid var(--ligne);
  color:var(--noir);background:#fdfdfc;cursor:pointer}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;flex:none;
  background:var(--c,var(--noir))}
/* ═══ LE CHIP CHOISI : SA COULEUR, MAIS ÉCLAIRCIE (Mag, 19/08/2026) ═══
   « Les couleurs qui étaient bien à la base sur le petit carré, elles étaient trop
   foncées [en aplat]. Quand c'est cliqué, ça doit être plus clair. »
   Une teinte juste sur un carré de 9 px devient lourde étalée sur tout un bouton :
   ce n'est pas la couleur qui était fausse, c'est la SURFACE. On la coupe donc de
   crème à l'état allumé — la teinte reste reconnaissable, l'encre noire respire,
   et le carré, lui, garde sa densité puisqu'il passe au noir juste en dessous.
   ⚠ La ligne `background:var(--c)` juste avant n'est PAS un doublon : c'est le
   repli pour un navigateur qui ne connaît pas `color-mix` — il retrouve alors
   l'aplat plein d'avant, jamais un bouton transparent.
   ⚠ `.neutre` s'y soustrait : le bouton « Tout » porte le gris du filet, déjà
   très clair. L'éclaircir encore l'aurait rendu indistinct du fond. */
/* ═══ L'ÉTAT CHOISI, ADOUCI À SON TOUR (Mag, 20/08/2026) ═══
   « Quand on clique aussi c'est trop dur. »
   Deux choses durcissaient d'un coup au clic : le petit carré passait au NOIR PLEIN,
   et le contour s'assombrissait. Sur un aplat pâle, ce carré devenait l'élément le
   plus dur de l'écran — trois filtres cochés, trois taches noires en rang.

   Maintenant le carré garde SA couleur, en pleine force, sur un fond de la même
   teinte à 34 % : l'écart suffit largement, sans noir. Et le contour ne bouge plus —
   c'est l'aplat qui dit « choisi », il n'a pas besoin d'un trait pour le répéter.
   ⚠ Le fond, lui, ne change pas : elle l'a réglé le 19/08 (« quand c'est cliqué, ça
   doit être plus clair ») et c'était le bon réglage. On ne touche qu'au carré et au
   trait. */
.chip.on{font-weight:600;border-color:var(--trait);
  background:var(--c,var(--noir));
  background:color-mix(in srgb, var(--c,var(--noir)) 34%, #fdfdfc)}
.chip.neutre.on{background:var(--ligne)}
.chip.on::before{background:var(--c,var(--enc2))}
/* Le bouton « Tout » n'a pas de couleur à lui — il porte le gris du filet. Son carré
   prend donc l'encre grise, sinon il disparaîtrait dans son propre fond. */
.chip.neutre.on::before{background:var(--enc2)}
.chip:active{transform:scale(.96)}
/* ═══ LA PASTILLE REMPLACÉE PAR UN PICTO (Mag, 19/08/2026) ═══
   « Ça fait beaucoup beaucoup de boutons qui se ressemblent, ça reste pas très
   clair. » Sur la ligne « Qui est reçu », le dessin de la femme et celui de l'homme
   prennent la place du carré de couleur — même gabarit, même position, mais on
   reconnaît le bouton sans le lire. Le reste de la page garde ses pastilles : c'est
   la seule ligne où un dessin dit quelque chose qu'un carré ne dira jamais. */
.chip.pic::before{display:none}
.chip .pico{width:15px;height:15px;flex:none;background:currentColor}
/* Le bouton qui n'a QUE son dessin : il se resserre en carré et le dessin grossit,
   sinon il flotte dans une boîte taillée pour du texte. */
/* La croix, et le bouton qui vide la ligne. Le pointillé le distingue d'un filtre :
   il n'ajoute rien, il retire. */
.chip .x{font-style:normal;font-size:11px;line-height:1;opacity:.6}
.chip.on .x{opacity:.75}
.chip .fl{font-style:normal;font-size:10px;line-height:1}
.ouhaut{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ouhaut span{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2)}
.ouhaut .chip.vider{margin-left:auto}
.chip.vider{border-style:dashed;color:var(--enc2)}
.chip.vider::before{display:none}
.chip.seul{gap:0;padding:7px 9px}
.chip.seul .pico{width:18px;height:18px}
/* Un picto qui accompagne un mot se cale sur le mot, pas sur le bouton. */
.chip.pic:not(.seul) .pico{width:16px;height:16px}

/* ---- listes de fiches : le registre ---- */
.cards{display:flex;flex-direction:column;gap:0;padding:12px 0 30px}
.fcard{cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--ligne);border-radius:0;
  padding:14px 2px;transition:background .1s ease}
.fcard:active{background:rgba(27,27,27,.05)}
.fpi{width:26px;height:26px;flex:none}
.fpi .ic{width:100%;height:100%}
.fcard .tx{flex:1;min-width:0}
.fcard .tx b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.fcard .tx small{display:block;font-size:12.5px;color:var(--enc2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.heart{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#b5b3ae;transition:transform .12s ease}
.heart:active{transform:scale(1.25)}
.heart .ic{width:18px;height:18px}
.heart.on{color:#d9a20b}
.empty{padding:60px 20px;text-align:center;color:var(--enc2)}
.empty .ic{width:40px;height:40px;margin:0 auto 14px;opacity:.5}
.empty b{display:block;color:var(--noir);font-size:16px;margin-bottom:6px}
.empty p{font-size:14px}
.ghead{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--noir);margin:20px 0 10px}
.dayh{font-size:14px;font-weight:600;text-transform:uppercase;margin:14px 0 4px}
.dayh.auj{color:var(--rouge)}

/* ---- formations : carte blanche cerclée de noir (choix « 2 » de Mag, 05/08/2026) ---- */
.flc{background:#fff;border:1.5px solid var(--trait-fort);border-radius:0;margin-bottom:12px;padding:13px 13px 12px;cursor:pointer}
.flc .ft{display:flex;gap:11px;align-items:flex-start;text-align:left}
.flc .frond{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--noir)}
.flc .frond .ic{width:18px;height:18px}
.flc .ftx{flex:1;min-width:0}
.flc .ftx b{font-size:14.5px;font-weight:600;line-height:1.2;display:block}
.flc .ftx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--enc2);margin-top:3px}
.flc .fet{margin-top:11px;border-top:1px solid var(--ligne)}
.flc .fe{display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--ligne);border-radius:0;padding:8px 2px;font-size:13px;background:transparent}
.flc .fe i{font-style:normal;width:20px;height:20px;flex:none;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.flc .fe.faite i{background:#6cb392;border-color:#6cb392}
.flc .fe.faite span{color:var(--enc2);text-decoration:line-through}
.flc .ftest{display:inline-flex;align-items:center;gap:8px;margin-top:11px;border:1px solid var(--trait);border-radius:0;
  padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;background:transparent}
.flc .ftest .ic{width:14px;height:14px}

/* ---- fiche : en-tête cadré, couleur du domaine ---- */
.fhead{border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne);
  padding:18px 2px;display:flex;gap:14px;align-items:flex-start}
.rowline{display:flex;align-items:flex-start;gap:15px;padding:13px 2px;border-bottom:1px solid var(--ligne)}
.rowline .ic{width:20px;height:20px;margin-top:2px;color:var(--fcol,#1b1b1b)}
.rowline .rt{flex:1;min-width:0}
.rowline .rt b{display:block;font-size:14px;font-weight:500}
.rowline .rt span{display:block;font-size:14px;color:var(--enc2);margin-top:1px;white-space:pre-line;overflow-wrap:break-word}
.rowline .go{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;text-decoration:underline;flex:none;margin-top:5px}
.bloc{background:transparent;border:1px solid var(--ligne);border-radius:0;padding:15px;margin:12px 0}
.bloc>b{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:7px}
.bloc>b .ic{width:17px;height:17px}
.bloc p{font-size:14.5px;color:#3c3c3c;white-space:pre-line;overflow-wrap:break-word}
.bloc.warn{background:var(--jaune);border-color:var(--trait-fort)}
.bloc.warn p{color:#3a3208}
.copybox{background:transparent;border:1px solid var(--ligne);border-radius:0;padding:15px;margin:12px 0}
.copybox .lab{display:flex;align-items:center;gap:10px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--enc2);margin-bottom:6px}
/* Chaque bloc a son propre bouton de copie : l'objet et le corps se copient séparément. */
/* LES CROCHETS VIVANTS : pastilles à choisir, petits champs à écrire — dans la phrase. */
.nchoix{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:baseline}
.nopt{border:1.25px solid var(--trait);border-radius:999px;padding:2px 10px;font-size:13.5px;
  font-weight:500;background:#fdfdfc;color:var(--noir);line-height:1.4}
.nopt.on{background:var(--noir);color:#f2eee6}
@media (hover:hover){ .nopt:hover{background:var(--jaune);border-color:var(--trait-fort);color:var(--noir)} }
.nfill{font:inherit;font-size:14px;font-weight:500;color:var(--noir);background:#fff7d6;
  border:0;border-bottom:1.5px solid var(--noir);padding:1px 6px;min-width:120px;max-width:100%}
.nfill:focus{outline:0;background:#fff}
.nfill::placeholder{font-weight:400;color:#8b8984}

.cbcop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;padding:4px 10px;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--noir);background:#fdfdfc}
.cbcop .ic{width:12px;height:12px}
@media (hover:hover){ .cbcop:hover{background:var(--noir);color:#f2eee6} }
.copybox p{font-size:14.5px;white-space:pre-wrap;overflow-wrap:break-word}
.rich{font-size:15px;line-height:1.5;padding-top:12px}
/* ── LE RÈGLEMENT : une règle par ligne, jamais un paragraphe ──
   On lit cette page en parlant à quelqu'un, souvent debout. Un pavé de texte oblige
   à retrouver sa ligne à chaque phrase ; ici chaque règle est un bloc à elle, avec
   son titre à gauche. Et ce qui n'est pas sûr le DIT, en rouge, sur la ligne
   elle-même — pas dans une note en bas de page qu'on ne lira pas. */
.rgl{margin-top:18px}
.rgl-s{margin-top:22px}
.rgl-s:first-child{margin-top:0}
.rgl-t{display:flex;align-items:center;gap:9px;font-family:ui-monospace,monospace;font-size:10px;
  font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  padding-bottom:7px;border-bottom:2px solid var(--noir);margin-bottom:10px}
.rgl-t .ic{width:16px;height:16px;flex:none}
.rgl-l{display:flex;gap:14px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--ligne)}
.rgl-l:last-child{border-bottom:0}
.rgl-l > b{flex:0 0 40%;max-width:210px;font-size:14px;font-weight:600;line-height:1.3}
.rgl-l > span{flex:1;font-size:15px;line-height:1.4;min-width:0}
.rgl-l > span i{display:inline-block;font-style:normal;font-family:ui-monospace,monospace;
  font-size:8.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--rouge);border:1px solid var(--rouge);border-radius:999px;
  padding:2px 8px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.rgl-v{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.rgl-v > div{border-left:3px solid var(--rouge);background:#fdeeed;border-radius:0 6px 6px 0;
  padding:10px 12px;font-size:14.5px;line-height:1.4}
@media (max-width:520px){
  .rgl-l{flex-direction:column;gap:3px}
  .rgl-l > b{flex:none;max-width:100%}
}
.rich h2,.rich h3{margin:18px 0 8px}
.rich p{margin-bottom:10px}
.rich ul,.rich ol{margin:0 0 10px 20px}
/* ⚠⚠ UNE LIGNE `.fchips{display:none}` VIVAIT ICI, ET ELLE CASSAIT NEUF ÉCRANS
   (trouvée le 22/08/2026 en cherchant pourquoi « À qui ? » n'affichait rien dans la
   passation). Elle venait du tout premier commit de cette app et n'avait aucun objet :
   posée APRÈS `.fchips{display:flex}`, elle l'emportait partout, sans exception.
   Étaient donc invisibles, en silence : le choix de l'équipe dans la passation, les
   filtres du Chantier, les périodes des statistiques, les listes de l'Admin, les
   sources des propositions. Rien ne signalait la panne — les boutons étaient bien
   dans la page, ils n'avaient simplement pas de hauteur.
   ⚠ NE PAS LA REMETTRE : si un jour il faut masquer une rangée de chips, on le fait
   sur SON écran, pas sur la classe. */

/* ---- barre d'appel de la fiche ---- */
/* ⚠ ELLE SUIT LES AUTRES : sur une fiche, c'est ELLE la barre du bas (le dock
   disparaît). Si elle restait crème, la piste B ne vaudrait que sur trois pages. */
.ctabar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--barre);border-top:1.5px solid var(--noir);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.ctabar .info{flex:1;min-width:0}
.ctabar .info b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctabar .info small{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--enc2)}
.btn-main{flex:none;display:inline-flex;align-items:center;gap:9px;color:#1b1b1b;
  font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:0;
  padding:14px 22px;transition:transform .1s ease}
.btn-main:active{transform:scale(.96)}
.btn-main .ic{width:16px;height:16px}
/* Cases d'appel « de nuit » (choix « 2 » de Mag) : case noire, nom crème,
   numéro à la couleur de la catégorie, picto rouge. */
.urg-sq{flex:0 0 auto;width:124px;min-height:106px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;background:var(--noir);border:1px solid var(--trait);border-radius:0;
  padding:13px 10px;color:#f2eee6;overflow:hidden;transition:background .16s ease;cursor:pointer}

/* ---- le paquet des CPAS ---- */
.grp{width:100%}
.grp-top{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--ligne);border-radius:0;padding:14px 2px;transition:background .12s ease}
.grp-top:active{background:rgba(27,27,27,.05)}
.grp-n{flex:none;width:38px;height:38px;border:1.25px solid var(--trait);color:var(--noir);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.grp-tx{flex:1;min-width:0}
.grp-tx b{display:block;font-size:15px;font-weight:600}
.grp-tx em{display:block;font-style:normal;font-size:12.5px;color:var(--enc2);margin-top:2px}
.grp-ch{width:15px;height:15px;flex:none}
.grp-in{display:flex;flex-direction:column;gap:0;margin-top:0}

/* ---- le dock : ronds noirs (gardés) ---- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--barre);
  border-top:1px solid var(--ligne);display:flex;justify-content:center;gap:14px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
body.no-tabs #tabbar{display:none}
/* Sur téléphone, le rail n'existe pas : le logo et les destinations secondaires
   restent cachés (ils vivent dans la barre du haut). */
#tabbar .raillogo,#tabbar .railsec{display:none}
#tabbar .railprinc{display:contents}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}
#tabbar .db{width:50px;height:50px;border-radius:50%;background:var(--noir);color:var(--c);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;position:relative}
#tabbar button.on .db{background:var(--c);color:var(--noir)}
#tabbar button:active .db{transform:scale(.92)}
#tabbar .db .ic{width:21px;height:21px}
#tabbar .db .dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--rouge);border:2px solid var(--barre)}
#tabbar .lbl{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8b8984}
#tabbar button.on .lbl{color:var(--noir);font-weight:600}

/* ---- l'étoile des favoris : case au trait, partout ---- */
/* ---- la barre de menu : toujours la même, sur toutes les pages ---- */
/* Aérée le 05/08/2026 (demande de Mag : « trop étroit ») — si la hauteur change,
   recaler le top de .subtop juste en dessous. */
#topbar{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--barre);
  display:flex;align-items:center;gap:11px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
  border-bottom:1px solid var(--ligne)}
#topbar .lgo{height:26px;margin:0;cursor:pointer}
#topbar button{position:static;width:42px;height:42px;border:1.25px solid var(--trait);background:var(--barre);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;position:relative}
#topbar button:active{transform:scale(.92)}
#topbar button .ic{width:17px;height:17px;color:var(--noir)}
#starbtn .ic{color:#c9940c!important}
#topbar button.on{background:var(--noir)}
#starbtn.on .ic{color:var(--jaune)!important}
#filbtn.on .ic,#listebtn.on .ic,#profilbtn.on .ic,#partbtn.on .ic{color:var(--creme)!important}
#filbtn .dot,#listebtn .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;
  background:var(--rouge);border:2px solid var(--barre)}

/* ---- guide + quiz ---- */
.gq{font-size:18px;font-weight:700;margin:14px 0 16px;line-height:1.3}
.gopt{display:block;width:100%;text-align:left;font-size:15px;font-weight:500;
  background:transparent;border:1px solid var(--trait);border-radius:0;padding:14px 15px;margin-bottom:9px;
  transition:background .12s ease}
.gopt:active{background:rgba(27,27,27,.06)}
.gres{background:transparent;border:1px solid var(--trait);border-radius:0;padding:17px;font-size:15px;
  line-height:1.55;white-space:pre-line;margin-bottom:16px}
.glink{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;text-decoration:underline}
.qcard{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--noir);
  color:#f4f3f1;border-radius:0;padding:16px;margin:0 0 12px;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;transition:transform .12s ease}
.qcard:active{transform:scale(.99)}
.qcard .ic{width:19px;height:19px;color:var(--jaune)}

/* ⚠ LE MESSAGE DE CONFIRMATION PASSAIT DERRIÈRE LE PANNEAU (Mag, 18/08/2026 :
   « il y a eu un message de confirmation, mais c'était en dessous, dans le flou…
   on ne le voit pas »).
   Il était à z-index:80, le panneau d'une fiche à 89 et son voile à 88 : tout ce
   qu'on confirmait DEPUIS une fiche s'affichait dessous, derrière le flou. Ça
   valait pour TOUTES les actions du panneau, pas seulement les étiquettes — on
   croyait que rien ne s'était passé.
   ⚠ `white-space:nowrap` partait aussi : une phrase un peu longue sortait de
   l'écran par les deux côtés. Elle tient maintenant sur deux lignes s'il le faut. */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 12px);transform:translate(-50%,16px);
  background:var(--noir);color:#f4f3f1;font-size:14px;font-weight:500;border-radius:0;
  padding:10px 20px;opacity:0;pointer-events:none;transition:all .22s ease;z-index:9995;
  max-width:min(92vw,420px);text-align:center;line-height:1.35}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
  .dgrid{grid-template-columns:repeat(4,1fr)}
  .tile:nth-child(2n){border-right:1px solid var(--ligne)}
  .tile:nth-child(4n){border-right:0}
  /* ⚠ PLUS D'AGRANDISSEMENT ICI (22/08/2026) : la taille est la même partout. */
  .cards{max-width:760px}
}
@media(min-width:1000px){
  .dgrid{grid-template-columns:repeat(7,1fr)}
  .tile:nth-child(4n){border-right:1px solid var(--ligne)}
  .tile:nth-child(7n){border-right:0}
}
@media(hover:hover){
  .tile:hover{background:var(--noir);color:#f4f3f1}
  .tile:hover small{color:rgba(242,238,230,.6)}
  .fcard:hover,.tcard:hover,.urg-catbtn:hover{background:rgba(27,27,27,.04)!important}
  .chip:hover{border-color:var(--trait-fort)}
}

/* ══════════════════════════════════════════════════════════════════════════
   GRANDS ÉCRANS — handoff « Bureau COUSIN » (06/08/2026)
   Le dock devient un rail noir de 236px à gauche, le bandeau de titre devient
   un grand titre de 60px sur un filet, et les listes deviennent des grilles.
   Sous 900px, tout revient à la version téléphone.
   ══════════════════════════════════════════════════════════════════════════ */
@media (min-width:900px){
  /* Le rail reste visible partout sur grand écran — y compris sur les fiches,
     qui masquent le dock sur téléphone (barre d'appel oblige). */
  body,body.no-tabs{padding-top:0;padding-bottom:0;padding-left:236px}
  body.no-tabs #tabbar{display:flex}

  /* ---- le rail de navigation ---- */
  /* ⚠ LE RAIL SE RESSERRE (Mag, 22/08/2026 : « le menu à gauche, il est toujours trop
     — je ne vois pas l'entièreté en bas, le petit œil est presque caché »).
     Douze lignes plus un logo dans 739 px de haut : le rail dépassait d'une
     soixantaine de pixels, et c'est « Voir comme » — le dernier — qui passait sous
     le bord. Un bouton qu'il faut faire défiler pour atteindre, on oublie qu'il
     existe.
     On gagne la place sur les ESPACES, pas sur les tailles : le texte, les ronds et
     les pictos ne bougent pas d'un pixel. Mesuré : ~710 px avant, ~605 après. */
  #tabbar{position:fixed;left:0;top:0;bottom:0;right:auto;width:236px;
    background:var(--noir);color:#f2eee6;border-top:0;justify-content:flex-start;
    padding:22px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:18px;overflow-y:auto}
  /* ⚠ L'ASCENSEUR DU RAIL NE PREND PLUS DE PLACE (Mag, 22/08/2026 : « le menu à
     gauche s'est mal calé parce que j'ai un ascenseur »). Le rail défile dès que la
     fenêtre est courte — et là où la barre de défilement est OPAQUE (Windows, et un
     Mac réglé sur « toujours afficher »), elle mange une quinzaine de pixels DANS
     les 236 px : les ronds et les mots se décalent, et la colonne n'est plus alignée
     avec rien. Le `body` garde son padding de 236 px, lui, d'où l'impression que
     tout est de travers.
     Même remède que `.rail` plus haut : ça défile, ça ne s'affiche pas. */
  #tabbar{scrollbar-width:none;-ms-overflow-style:none}
  #tabbar::-webkit-scrollbar{display:none}
  #tabbar .raillogo{width:56px;height:auto;display:block;align-self:flex-start;filter:invert(1)}
  #tabbar .railprinc{display:flex;flex-direction:column;gap:4px}
  #tabbar .railprinc button{display:flex;flex-direction:row;align-items:center;gap:12px;
    padding:8px 12px;border-radius:6px;background:transparent;color:#f2eee6;width:100%;
    text-align:left;min-width:0}
  #tabbar .railprinc button.on{background:#f2eee6;color:var(--noir)}
  /* Dans le rail, le rond porte TOUJOURS la couleur du domaine et le picto reste noir. */
  #tabbar .railprinc .db,#tabbar .railprinc button.on .db{width:34px;height:34px;border-radius:50%;
    flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--c);color:var(--noir)}
  #tabbar .railprinc .db .ic{width:17px;height:17px}
  #tabbar .railprinc .lbl{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:inherit}
  #tabbar .railprinc button.on .lbl{color:var(--noir)}
  #tabbar .railsec{margin-top:auto;display:flex;flex-direction:column;gap:1px;
    padding-top:14px;border-top:1px solid rgba(242,238,230,.2)}
  #tabbar .railsec button{display:flex;flex-direction:row;align-items:center;gap:11px;
    padding:7px 12px;color:#f2eee6;width:100%;text-align:left;background:transparent;min-width:0}
  #tabbar .railsec .ic{width:16px;height:16px;flex:none}
  #tabbar .railsec .lbl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase}
  /* Au survol : un trait de couleur apparaît à gauche ET la ligne glisse vers la
     droite (mélange des propositions 2 et 3 — Mag, 06/08/2026). L'actif ne bouge pas.

     ═══ ⚠ CE QUI GLISSE, C'EST LE CONTENU, PAS LE BOUTON (Mag, 21/08/2026) ═══
     Ses mots : « quand je passe sur les boutons, sur les menus à gauche, ça tremble.
     Je ne sais plus cliquer. »
     C'est le clignotement du 18/08, revenu par la porte qu'on lui avait laissée
     ouverte. Le raisonnement d'alors était FAUX : on avait écrit que le rail ne
     pouvait pas clignoter « parce que la souris arrive par la droite ». Elle
     n'arrive pas par la droite — le rail est collé au bord GAUCHE de l'écran, et on
     descend le long de ce bord. Dans les 6 px de gauche du bouton, le survol
     déplaçait le bouton hors du curseur → le survol se coupait → il revenait :
     plusieurs fois par seconde.
     Et le `:active` était pire : au moment du clic, le bouton se décalait ET
     rétrécissait de 2 % ; si le doigt ou la souris se retrouvait dehors, le
     navigateur n'envoyait PAS de clic. D'où « je ne sais plus cliquer ».

     Le remède garde exactement ce qu'elle aime : le glissement est le même à l'œil,
     mais il porte sur le rond et le mot À L'INTÉRIEUR du bouton. La boîte du bouton,
     elle, ne bouge plus d'un pixel — donc la zone qu'on vise est fixe.
     ⚠ NE PAS remettre `transform` sur le bouton lui-même. La règle est maintenant
     la même partout, sans exception : au survol, RIEN ne se déplace sous le curseur. */
  #tabbar .railprinc button,#tabbar .railsec button{
    border-left:3px solid transparent;padding-left:9px;
    transition:background .16s ease,border-color .16s ease,opacity .16s ease}
  #tabbar .railprinc button>*,#tabbar .railsec button>*{transition:transform .16s ease}
  #tabbar .railsec button{opacity:.78}
  @media (hover:hover){
    #tabbar .railprinc button:not(.on):hover{
      border-left-color:var(--c);background:rgba(242,238,230,.07)}
    #tabbar .railprinc button:not(.on):hover>*{transform:translateX(6px)}
    /* ⚠ `:not(.on)` — LE BOUTON ACTIF DEVENAIT ILLISIBLE AU SURVOL (Mag, 08/08/2026 :
       « au survol on ne sait pas lire le texte »). Le bouton actif porte un fond CRÈME
       et un texte NOIR. Le survol, lui, repeignait le fond en blanc à 7 % — donc en
       noir, sur le rail noir — sans toucher à la couleur du texte : on se retrouvait
       avec du noir sur du noir, juste sur la page où l'on se trouve. Le rail principal
       avait déjà ce garde-fou ; le rail du bas ne l'avait pas.
       ⚠ `.vueon` (l'œil allumé quand on regarde l'app comme quelqu'un d'autre) porte
       lui aussi un fond à lui : même raison, on ne le survole pas non plus. */
    /* ⚠ LE RAIL DE GAUCHE GARDE SON GLISSEMENT (Mag, 18/08/2026 : « le même
       glissement sur les boutons à gauche sur écran, ils sont parfaits »).
       Et ce n'est pas une exception de goût, il y a une raison : ces boutons
       occupent TOUTE la largeur du rail et glissent vers la DROITE, c'est-à-dire
       vers l'intérieur du rail. La souris arrive dessus par la droite, jamais par
       les 6 px de gauche qu'ils libèrent — le bouton ne peut donc pas se dérober
       sous le curseur, et ça ne clignote pas.
       C'est exactement ce qui n'allait pas avec les cartes de contenu : elles,
       on les survole de partout, bord gauche compris. */
    #tabbar .railsec button:not(.on):not(.vueon):hover{
      border-left-color:#f2eee6;background:rgba(242,238,230,.07);opacity:1}
    #tabbar .railsec button:not(.on):not(.vueon):hover>*{transform:translateX(6px)}
    /* L'actif garde son fond ; son contenu glisse quand même, pour répondre au geste. */
    #tabbar .railsec button.on:hover>*,#tabbar .railsec button.vueon:hover>*{transform:translateX(6px)}
  }
  /* ⚠ À L'APPUI NON PLUS LE BOUTON NE BOUGE, et le `scale(.98)` est parti : c'est lui
     qui faisait rater le clic. Le contenu s'enfonce, la cible reste où elle est. */
  #tabbar .railprinc button:not(.on):active>*,#tabbar .railsec button:active>*{transform:translateX(6px) scale(.97)}

  /* ---- la barre du haut disparaît : le rail porte déjà le logo et les 8 destinations ---- */
  #topbar{display:none}
  #view{max-width:1204px;margin:0 auto;padding:36px 44px 48px;width:100%}

  .home-top{padding:0}

  /* ---- le bandeau noir devient un grand titre sur un filet ---- */
  .hero{position:static;background:transparent;color:var(--noir);margin:0 0 26px;
    padding:0 0 18px;border-bottom:1.5px solid var(--noir);align-items:flex-end}
  /* ⚠ Le titre ne grandit plus sur écran (22/08) — seule la couleur change ici. */
  .hero h1{color:var(--noir)}
  .hero .hsur{font-size:10px;letter-spacing:.24em}
  /* ⚠ LA STRAPLINE EST TROP PÂLE (Mag, 24/08/2026) : sur fond clair, le bleu pastel
     passé en couleur (#A9C8E8…) se lit à peine. On l'assombrit d'un cran — le picto,
     lui, garde sa couleur pleine. */
  .hero .hsur{filter:saturate(.85) brightness(.68)}
  .hero .cbtn{border-color:var(--trait-fort);color:var(--noir)}
  .hero .hpic{width:52px;height:52px}
  .apreshero{margin-top:0}

  /* ---- les listes deviennent des grilles ---- */
  .dgrid.res{grid-template-columns:repeat(5,1fr)}
  .ogrid{grid-template-columns:repeat(3,1fr)}
    .flist,.rlist,.cards,.frows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .frows{grid-template-columns:repeat(2,1fr)}
  .cards{padding-top:12px}
  .fcarte,.fsavoir,.msg.epingle{grid-column:1/-1}
  .ucats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start;width:100%}
  .ucats>div:has(.usous){grid-column:1/-1}
  .usous{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .uvital{grid-template-columns:repeat(2,1fr);max-width:620px}
  /* Le contenu occupe toute la largeur utile même sans grille interne. */
  #view>*{max-width:100%}
  .boules{max-width:400px}
  .qrep{display:grid;grid-template-columns:repeat(2,1fr)}
  .pgn:not(.pilepts){display:none}

  /* ---- les carrousels montrent plus de cartes ---- */
  /* ⚠ PAS DE flex-wrap ICI (Mag, 08/08/2026 : « pourquoi ça se met en deux lignes ?
     pourquoi ça ne fait pas un slide ? »). On avait mis `flex-wrap:wrap` sur grand
     écran pour montrer plus de cartes d'un coup — mais un carrousel qui se replie
     n'est plus un carrousel : la cinquième sortie tombait seule sur une deuxième
     ligne, comme un reste. Ça reste un rail qui glisse, à toutes les largeurs ;
     les cartes sont seulement plus larges qu'au téléphone. */
  .rail2{margin:0;padding:14px 0 6px}
  .fmod{width:calc(25% - 9px)}
  .pile{max-width:440px}

  /* ---- détails ---- */
  .subtop{position:static;background:transparent;padding:0 0 14px;margin:0}
  .rail{margin:0 0 4px;padding:2px 0 14px}
  .chips{margin:0;padding:12px 0}
  .sect,.sectc,.sectl{margin-top:28px}
  .foot,.fsrc{padding-bottom:20px}
  /* ⚠ LES DEUX TITRES NE GRANDISSENT PLUS SUR ÉCRAN (Mag, 22/08/2026). Ils montaient
     à 64 px et 60 px — c'est de là que venait « les titres en plus petit ». La
     rangée qui se replie, elle, a été remontée dans la règle de base : elle sert
     maintenant sur téléphone aussi. */
  .home-title{margin-bottom:8px}
  .quizbar,.lienbas{max-width:620px}
  /* Les grands boutons ne s'étirent pas sur toute la largeur de l'écran. */
  #view .acc,#view .fbtn,#view .pident,#view .admok,#view .fcpli,#view .fcomp{max-width:620px}
  /* La météo tient en une ligne : elle n'a aucune raison de traverser l'écran. */
  #view .meteo{max-width:520px}
}

/* Écrans très larges : on garde les grilles lisibles */
@media (min-width:1440px){
  .rc,.fmod{width:calc(20% - 10px)}
}

/* ══════════════════════════════════════════════════════════════════════════
   LES TRÈS GRANDS ÉCRANS (Mag, 21/08/2026)
   ══════════════════════════════════════════════════════════════════════════
   Ses mots : « je travaille sur un super grand écran et la lecture est vraiment
   très très illisible. Au-dessus de 1440, ça devient extrêmement problématique.
   Je ne touche à rien, QUE aux énormes écrans. »

   LE PROBLÈME, ET IL N'EST PAS DANS LA MISE EN PAGE. Toutes les tailles de ce
   fichier sont en PIXELS. Un pixel CSS ne grandit pas avec l'écran : sur un 27 ou
   un 32 pouces, la colonne de 1204 px occupe la moitié de la largeur et les
   étiquettes en 9 px deviennent des traits gris. La mise en page est juste, c'est
   l'échelle qui ne l'est plus.

   LE REMÈDE : `zoom`, exactement ce qu'elle ferait avec Ctrl + — mais posé une
   fois pour toutes, et seulement au-dessus de 1440 px.
   ⚠ POURQUOI PAS `zoom` SUR LA RACINE : le zoom de la racine RÉDUIT la largeur vue
   par les media queries. À 1441 px réels, un zoom de 1,14 donne 1264 px vus → la
   règle cesse de s'appliquer → le zoom retombe → elle s'applique à nouveau. La page
   clignoterait à l'infini. Posé sur des CONTENEURS, le zoom ne touche pas la
   largeur vue : pas de boucle.
   ⚠ LES FEUILLES QUI MONTENT SONT DANS LA LISTE : `#ouBg` et `#partBg`
   sont des enfants de `body`, pas de `#view`. Sans elles, la page grandissait et la
   feuille restait minuscule.
   ⚠ ET LE RETRAIT DE GAUCHE SUIT LE RAIL : le rail fait 236 px, zoomé il en occupe
   269 ou 307. Sans ajuster `padding-left`, le contenu passe dessous. */
/* ⚠⚠ LE PIÈGE DU ZOOM SUR UNE LARGEUR EN POURCENTAGE (Mag, 21/08/2026 : « tout est
   trop grand, ça dépasse de mon écran »).
   `#view` porte `width:100%`. Avec `zoom`, un pourcentage se calcule d'abord contre
   le parent NON zoomé, PUIS le résultat est agrandi : la colonne occupait donc
   « toute la largeur disponible, fois 1,2 » — elle débordait de 20 % à droite, et
   c'est ce débordement qui donnait l'impression que tout était énorme.
   ⚠ Le remède tient en deux mots : `width:auto`. Une boîte de bloc en largeur
   automatique remplit l'espace déjà divisé par le zoom, donc elle tombe juste.
   ⚠ NE PAS REMETTRE `width:100%` ICI. Et si un jour on zoome autre chose, vérifier
   d'abord qu'il n'a pas de largeur en pourcentage — c'est exactement la même faute.
   Le rail, lui, est en PIXELS (236) : il se comporte bien, et son retrait de gauche
   le suit à chaque palier (236 × le zoom).
   Les paliers sont volontairement doux : on corrige l'échelle d'un grand écran, on
   ne fabrique pas une app pour malvoyants. */
@media (min-width:1441px){
  #view{zoom:1.1;width:auto}
  #tabbar,.partbg,#toast{zoom:1.1}
  body,body.no-tabs{padding-left:260px}
}
@media (min-width:1921px){
  #view{zoom:1.2;width:auto}
  #tabbar,.partbg,#toast{zoom:1.2}
  body,body.no-tabs{padding-left:284px}
}
@media (min-width:2561px){
  #view{zoom:1.32;width:auto}
  #tabbar,.partbg,#toast{zoom:1.32}
  body,body.no-tabs{padding-left:312px}
}

/* Entre 900 et 1200 : on resserre les grilles */
@media (min-width:900px) and (max-width:1200px){
  .dgrid.res{grid-template-columns:repeat(3,1fr)}
  .flist,.rlist,.cards{grid-template-columns:repeat(2,1fr)}
  .rc,.fmod{width:calc(33.333% - 8px)}
}

/* ══════════════════════════════════════════════════════════════════════════
   LES SURVOLS, PARTOUT (Mag, 06/08/2026 : « sur tous les boutons »)
   Trois familles, une seule logique : rien ne s'inverse en noir (le picto y
   deviendrait invisible), tout se désigne d'un trait net.

   ⚠ RIEN NE BOUGE PLUS AU SURVOL (Mag, 18/08/2026 : « quand tu survoles, le
   bouton clignote, ce n'est pas très agréable »).
   POURQUOI ÇA CLIGNOTAIT : les cartes glissaient de 3 px (ou montaient de 3 px)
   sous le curseur. Quand la souris était près du bord, la carte sortait de
   dessous elle — le survol se coupait, la carte revenait, le survol reprenait,
   et ainsi de suite plusieurs fois par seconde.
   POURQUOI ON NE POUVAIT PAS SIMPLEMENT « AGRANDIR LA ZONE » : les fiches
   conseillées (`.frow2.reco`) portent un liseré jaune posé en `::before` avec
   `overflow:hidden` — tout ce qui dépasserait du cadre serait coupé, donc la
   rustine classique ne tient pas ici.
   CE QU'ON GARDE : le fond qui s'éclaircit et le trait net autour. On voit
   parfaitement ce qu'on désigne, et plus rien ne saute.
   ⚠ NE PAS REMETTRE de `transform` dans les règles `:hover` ci-dessous —
   c'est exactement ce qui produisait le clignotement. L'appui au doigt
   (`:active`), lui, garde son petit enfoncement : là, le doigt ne peut pas
   « perdre » le bouton.
   ══════════════════════════════════════════════════════════════════════════ */
.rc,.fmod,.pile .pcarte,.frow2,.unum,.ucat,.tache,.role,.acc,.msg,.fbtn,.quizbar,
.lienbas,.chh,.chet,.qrep button,.boule,.qcard,.gopt,.pli,.chdel{
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,opacity .14s ease}

@media (hover:hover){
  /* 1. Les cartes et pavés : cerclés d'un trait net */
  .rc:hover,.fmod:hover,.pile .pcarte:hover{box-shadow:0 0 0 1.5px var(--noir)}
  .rc.noir:hover,.fmod.noir:hover,.pile .pcarte:hover{box-shadow:0 0 0 1.5px var(--noir),0 6px 0 -3px rgba(27,27,27,.18)}
  /* ⚠ SUR LA BANDE NOIRE, LE LISERÉ DE SURVOL DISPARAISSAIT (Mag, 11/08/2026 : « au
     survol il n'y a plus de bord sur la carte »). La règle du dessus donne à toutes
     les cartes un trait NOIR au survol — parfait sur le fond crème, invisible sur le
     fond noir des jeux, où la carte porte justement un liseré CRÈME au repos. Au
     survol, on remplaçait donc du blanc visible par du noir sur du noir : le bord
     avait l'air de s'effacer au moment précis où on le désigne.
     Ici on GARDE le liseré crème, on l'épaissit d'un demi-pixel, et on ajoute
     l'ombre portée — le soulèvement se lit sans que le contour parte. */
  .zjeux .pile .pcarte:hover{box-shadow:0 0 0 4px #f0efed,0 8px 0 -3px rgba(0,0,0,.35)}

  /* 2. Les lignes et les rangées : elles s'éclaircissent, cerclées d'un trait */
  .frow2:hover,.unum:hover,.tache:hover,.role:hover,.acc:hover,.msg:hover,
  .pli:hover,.chh:hover,.chet:hover{
    background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .acc.open:hover,.ucat:hover{background:#242424;box-shadow:0 0 0 1.5px var(--noir)}
  .msg.epingle:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}

  /* 3. Les boutons pleins : ils s'assombrissent un peu */
  .fbtn:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .fbtn.plein:hover{filter:brightness(.94)}
  .quizbar:hover,.chdel:hover{filter:brightness(1.25)}
  .qrep button:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .lienbas:hover{opacity:.6}
  .boule:hover .rond{transform:scale(1.08)}
  .boule .rond{transition:transform .14s ease}
  .gopt:hover,.qcard:hover{background:rgba(27,27,27,.05)}
  /* Les petits ronds et carrés d'en-tête */
  .cbtn:hover,.frond:hover,.sqbtn:hover,#topbar button:hover{background:rgba(27,27,27,.07)}
  .hero .cbtn:hover{background:rgba(242,238,230,.14)}
  .fet:hover,.heart:hover{transform:scale(1.15)}
  .fet,.heart{transition:transform .14s ease}
  /* Les chips de filtre : le survol ne change que le filet, la couleur reste. */
  .chip:hover{border-color:var(--trait-fort)}
  /* Le rail des domaines en haut des pages */
  .rail button:hover{background:#eceae5}
  .rail button.on:hover{background:#333}
}

/* À l'appui, tout s'enfonce légèrement — la réponse au doigt, sur téléphone */
.rc:active,.fmod:active,.pile .pcarte:active,.frow2:active,.unum:active,.ucat:active,
.tache:active,.role:active,.acc:active,.msg:active,.fbtn:active,.quizbar:active,

  transform:scale(.985)}
