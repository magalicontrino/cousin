   L'AIR AU-DESSUS DES PICTOS (« un peu de padding en haut des pictos ») : 16 px →
   24 px. Les ronds touchaient presque le trait du haut ; ils respirent, et le bloc
   ne grandit que de huit pixels. */
.boules{border:1px solid var(--ligne);border-radius:10px;padding:24px 10px 12px;margin-top:12px;
  background:#fcfbf9}
/* Le bac de Mag est noir avec le recyclage en blanc : sur le rond noir, on le retourne
   pour qu'il se voie — bac clair, recyclage sombre. Son dessin reste le sien. */
.boule .rond img.picoc{width:30px;height:30px;filter:invert(1)}
.boule b{font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--noir)}
/* ⚠ 8,5 px EN CAPITALES ESPACÉES, C'ÉTAIT ILLISIBLE (Mag : « pas assez voyant, les
   fonts je pense »). Cette ligne porte l'information qui décide de la journée —
   l'étage et les chambres du linge, la couleur des sacs. On monte à 10 px, on serre
   l'interlettrage et on fonce le gris : c'est une consigne, pas une légende. */
.boule em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;
  line-height:1.35;text-transform:uppercase;color:#5f5e59;text-align:center;
  /* ⚠ `balance` répartit les mots également entre les deux lignes au lieu de remplir
     la première et de laisser un orphelin en dessous. C'est ce qui fait la différence
     entre « 2E ÉTAGE · 201 → / 222 » et deux lignes qui se regardent. */
  text-wrap:balance}
/* Le retour à la ligne posé à la place du « · ». Un span vide qui force la coupure :
   on garde ainsi le texte intact pour la recherche et la lecture à voix haute. */
.boule em .br{display:block;height:0}

/* ═══ LA PISTE B — CE QUI RÉCLAME PASSE EN GRAND (Mag, 20/08/2026) ═══
   « L'accueil n'est pas clair. On va refaire le design dans Claude Design. »
   Quatre écrans posés côte à côte sur un canvas (« Accueil COUSIN — on reprend ») :
   l'accueil tel qu'il était, puis trois pistes. Elle a répondu « B ».

   LE TORT DES QUATRE BOULES : elles disaient toutes la même chose avec la même
   force. Le linge à faire ce matin et les produits de samedi prochain avaient le
   même rond de 64 px, la même place, le même poids. Il fallait LIRE les quatre
   sous-titres pour savoir lequel pressait — c'est-à-dire chercher, sur la page
   faite pour ne pas chercher.

   MAINTENANT : ce qui est allumé passe en GRANDE CARTE, une par ligne, qu'on lit
   sans s'arrêter. Ce qui dort descend dans une ligne grise : présent, à portée de
   doigt, mais muet. Et le bas de l'accueil devient quatre portes.

   ⚠ C'est BIEN ELLE qui a rouvert ce bloc : le 08/08 elle avait dit « ça, tu ne
   touches pas » des quatre boules. Ne pas y revenir sans elle non plus.
   ⚠ Le CSS des boules et de la bande des jeux reste juste au-dessus, intact : si
   elle demande de remettre l'un ou l'autre, il n'y a que le rendu à rebrancher. */
.grosses{padding-top:16px;max-width:620px}
.grosse{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fdfdfc;border:1.5px solid var(--trait-fort);border-radius:14px;padding:16px;
  margin-bottom:10px;color:var(--noir);transition:transform .12s ease}
.grosse:active{transform:scale(.99)}
/* La poubelle garde son fuchsia ici aussi : c'est la seule qui annonce un JOUR. */
.grosse.poub{border-color:#E8308A}
.grosse .rd{width:62px;height:62px;border-radius:50%;background:var(--noir);flex:none;
  display:flex;align-items:center;justify-content:center}
.grosse .rd .ic{width:30px;height:30px}
.grosse .tx{flex:1;min-width:0}
.grosse .tx b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.grosse .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--enc2);margin-top:5px;line-height:1.35}
.grosse .chv{flex:none;font-size:22px;color:var(--noir)}
@media (hover:hover){ .grosse:hover{box-shadow:0 0 0 1.5px var(--noir)} }
/* La version éteinte d'une grande carte : même format, mais tout est grisé — elle
   ne tient pas le rôle d'une carte du jour, elle ne fait que dire « pas ce soir ». */
.grosse.dz{background:#f6f5f3;border-color:var(--ligne);color:var(--enc2)}
.grosse.dz .rd{background:#e6e4df}
.grosse.dz .tx b{color:var(--enc2)}
.grosse.dz .tx em{color:#b4b2a9}
@media (hover:hover){ .grosse.dz:hover{box-shadow:none} }

/* Ce qui ne demande rien aujourd'hui. Les lignes gardent 40 px de haut : c'est
   silencieux, ça ne doit pas devenir impossible à viser au doigt. */
.dormeuses{display:flex;flex-direction:column;max-width:620px;
  border:1px solid var(--ligne);border-radius:8px;padding:4px 11px;background:#f6f5f3;margin-top:12px}
.dormeuses .dz{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:12px 0;min-height:40px;color:var(--enc2);
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.dormeuses .dz + .dz{border-top:1px solid #e4e2de}
.dormeuses .dz .ic{width:17px;height:17px;flex:none;color:#b4b2a9}

/* Les quatre portes du bas. Le nom d'abord, le compte dessous, le dessin en bas à
   droite — le même ordre que les tuiles du Centre, pour qu'on n'apprenne rien de neuf. */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;max-width:620px}
.tuile{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;
  border:1.25px solid var(--trait);border-radius:10px;padding:12px;background:#fdfdfc;
  color:var(--noir);text-align:left}
.tuile b{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;line-height:1.4}
.tuile b span{display:block;color:var(--enc2)}
.tuile .ic{width:34px;height:34px;margin:auto 0 0 auto}
.tuile:active{background:var(--noir);color:#f4f3f1}
.tuile:active b span{color:rgba(242,238,230,.6)}
@media (hover:hover){
  .tuile:hover{background:var(--noir);color:#f4f3f1}
  .tuile:hover b span{color:rgba(242,238,230,.6)}
}

/* Sur la boule ALLUMÉE, la ligne passe en noir et en gras : c'est celle qu'on lit. */
.boule:not(.dort) em{color:var(--noir);font-weight:600}
/* La pile de cartes du quiz */
/* Les proportions du design (carte 200 sur 358 de large) tenues en pourcentages :
   la pile garde le même équilibre sur un petit comme sur un grand téléphone.
   La carte du dessus peut grandir si la question est longue — pas les autres. */
/* LA CARTE RESTE CARRÉE (aspect-ratio 1) quelle que soit la largeur de l'écran —
   c'est une carte à jouer, pas une bannière (Mag, 06/08/2026). Les deux cartes du
   dessous suivent la même règle, décalées et tournées comme sur la planche. */
/* La pile est bornée : sans ça, les deux cartes du dessous (en %) s'étirent sur
   les écrans larges pendant que la carte noire, elle, reste bornée. */
/* De l'air au-dessus : l'éventail des cartes de derrière monte plus haut que la carte
   de devant, il ne doit pas venir buter dans le trait de la section. */
.pile{position:relative;margin:34px auto 26px;max-width:380px;touch-action:pan-y}
/* On fait défiler la pile au doigt pour changer de jeu (Mag, 06/08/2026). */
/* ═══ LE GLISSEMENT VERS LA DROITE FAISAIT DESCENDRE LE MENU DU NAVIGATEUR
   (Mag, 13/08/2026 : « quand tu fais un téléphone, il y a le menu qui descend à
   chaque fois, qui saute… quand tu glisses à gauche ça ne fait pas ça ») ═══

   Ce n'était pas un défaut de notre code : les deux flèches sont identiques. C'est
   le NAVIGATEUR qui s'emparait du geste. Nos écouteurs tactiles sont `passive:true`
   — ils ne peuvent donc pas dire « ce geste est à moi » — et sur un téléphone,
   tirer vers la DROITE veut dire « page précédente » (le retour arrière par
   glissement), pendant que la moindre dérive verticale fait ressortir la barre
   d'adresse. Vers la gauche, aucun geste système ne correspond : d'où l'asymétrie.

   `touch-action:pan-y` règle ça d'une ligne : le navigateur garde le défilement
   VERTICAL (on doit pouvoir faire défiler la page en partant de la carte), et nous
   laisse tout l'horizontal. Plus de retour arrière, plus de barre qui saute.
   ⚠ Ne pas mettre `none` : ça bloquerait aussi le défilement de la page. */
.pile .pcarte{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.pile .pcarte.glisse{transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .28s ease}
/* La copie de la carte qui s'en va : posée au même endroit, par-dessus. */
.pile .pcarte.fantome{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;z-index:3}
.pile .pcarte:active{cursor:grabbing}
/* La navigation suit la pile : tout au centre, les deux flèches serrées autour des
   points au lieu d'être poussées aux extrémités (Mag, 08/08/2026). */
.pilenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto 0;max-width:380px}
.pilenav .pgn{padding:0;flex:none;justify-content:center}
.pilenav .fl{width:34px;height:34px;border-radius:50%;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;background:transparent;flex:none}
.pilenav .fl .ic{width:13px;height:13px}
.pilenav .fl.droite .ic{transform:rotate(180deg)}
/* La carte du dessous laisse voir, dans son coin, le picto du jeu qui vient. */
/* Le picto du jeu suivant se met dans le BAS de la bande qui dépasse : c'est le seul
   endroit de la carte de derrière qu'on voit vraiment (Mag, 06/08/2026). */
.pile .p1.apercu{display:flex;align-items:flex-end;justify-content:flex-start;padding:11px;
  border:0;cursor:pointer;transition:transform .16s ease}
@media (hover:hover){.pile .p1.apercu:hover{transform:translateX(-50%) translateX(18px) rotate(4deg) scale(1.03)}}
.pile .p1.apercu .ic{width:25px;height:25px}
/* Les points de position, un par jeu. */
.pilenav .pilepts{flex:none}
.pilenav .pilepts i{width:5px;height:5px;border-radius:3px;background:#c2c0bb}
.pilenav .pilepts i.on{width:18px;background:var(--noir)}
/* L'invitation à glisser : sur TÉLÉPHONE, à la place des flèches. */
.glissez{flex:1;text-align:center;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--enc2)}
@media (min-width:900px){
  .glissez{display:none}
  .pilenav .pilepts{flex:1;justify-content:center}
}
/* Sur téléphone, rien sous la pile : on glisse, ou on touche la carte du dessous. */
@media (max-width:899px){ .pilenav{display:none} .pile{margin-bottom:34px} }
/* LA PILE : un vrai jeu de cartes, d'après l'image que Mag a envoyée (06/08/2026).
   Trois cartes de MÊME taille, en format PORTRAIT (comme une carte à jouer, plus haute
   que large) ; l'éventail pivote par le BAS : la carte de devant est presque droite,
   celles de derrière montent d'un cran et penchent un peu plus à chaque fois vers la
   gauche. Après un glissement, la pile se redessine et retrouve exactement cette pose. */
/* ═══ LA PILE REDESSINÉE LE 08/08/2026 ═══ Mag a envoyé une image : trois cartes
   EMPILÉES ET CENTRÉES, la carte de devant bien droite, les deux du dessous qui
   dépassent de part et d'autre — une à gauche, une à droite — avec de gros arrondis.
   Plus d'éventail penché vers la gauche : c'est la symétrie qui fait la pile.
   Le dé « au hasard » quitte le coin de la pile et passe sous elle. */
/* ⚠ LA PILE PREND TOUTE LA LARGEUR QU'ON LUI DONNE, ET PAS CELLE DE SON TEXTE.
   C'est LE défaut des cartes qui changent de taille sur grand écran (Mag,
   08/08/2026 : « les tailles sont différentes quand tu swapes… sur le téléphone
   c'est parfait, c'est sur l'écran »).

   Sans `width:100%`, la pile est un bloc souple sans largeur déclarée : le
   navigateur la calcule d'après son CONTENU. Et son contenu, c'est la carte — dont
   le texte change à chaque jeu. La pile faisait donc 250 px pour « Cartes à
   retourner » et 191 px pour « Chrono 60 s », et la carte, qui vaut 60 % de la pile,
   suivait : 150 px puis 114 px. Ce n'était pas la carte qui rétrécissait, c'était le
   sol sous elle.

   Sur téléphone la pile touchait déjà ses 380 px de large dans tous les cas : le
   calcul par le contenu ne changeait rien, et le défaut restait invisible. */
.pile{display:flex;flex-direction:column;align-items:center;width:100%}
.pile .p1,.pile .p2{position:absolute;width:58%;aspect-ratio:3/4;border-radius:20px;
  left:50%;top:0;box-shadow:0 0 0 1.5px rgba(27,27,27,.08)}
/* Celle de droite dépasse d'un côté, celle de gauche de l'autre. Un tout petit angle
   suffit à faire « pile » — au-delà, ça redevient un éventail. */
.pile .p2{transform:translateX(-50%) translateX(-14px) rotate(-3deg)}
.pile .p1{background:#f3cde5;transform:translateX(-50%) translateX(14px) rotate(3deg)}
.pile .pcarte{position:relative;margin:0;width:60%;aspect-ratio:3/4;border-radius:20px;
  transform:none;
  /* La carte ne se laisse pas raboter par la colonne. (Ce n'est PAS ce qui causait
     les tailles inégales — la vraie cause était la largeur de la pile, voir plus
     haut — mais c'est un garde-fou juste, et il ne coûte rien.) */
  flex:none;
  background:var(--noir);color:#f2eee6;padding:18px;display:flex;flex-direction:column;text-align:left;border:0;
  /* ⚠ TOUTES LES CARTES ONT LA MÊME TAILLE, TOUJOURS (Mag, 08/08/2026 : « les cartes
     changent de taille quand tu tournes, elles doivent rester la même taille que la
     première, sinon c'est vraiment horrible »).

     `aspect-ratio` n'est qu'un SOUHAIT : dès que le contenu réclame plus de hauteur
     que le rapport 3/4, le navigateur agrandit la boîte sans rien dire. Sur les
     écrans étroits, « L'équipe cette semaine » (titre le plus long + promesse la plus
     longue) prenait 61 px de plus que « La roue » — la pile changeait de taille à
     chaque glissement.

     `overflow:hidden` retire au contenu le droit d'agrandir la carte. Et pour qu'il
     ne soit pas coupé pour autant, le titre et la promesse sont bridés en nombre de
     lignes juste en dessous : le texte s'arrête proprement au lieu de déborder. */
  overflow:hidden}
.pile .pcarte .ic{width:48px;height:48px;color:#f5c542;flex:none}
/* Deux lignes pour le titre, trois pour la promesse : au-delà, on coupe avec des
   points de suspension. Tous les jeux actuels tiennent — c'est un garde-fou pour
   ceux qu'on ajoutera. */
.pile .pcarte b{font-size:18px;font-weight:700;line-height:1.1;margin-top:auto;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pile .pcarte em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#f5c542;margin-top:5px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.pile .tirer{position:static;display:flex;flex-direction:row;align-items:center;gap:9px;
  background:transparent;border:0;margin-top:18px}
.pile .tirer .rd{width:42px;height:42px;border-radius:50%;border:1.25px solid var(--trait);display:flex;align-items:center;justify-content:center}
.pile .tirer .rd .ic{width:23px;height:23px}
.pile .tirer span{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#73716b}
/* Barres de pagination sous les carrousels */
.pgn{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.pgn i{width:5px;height:5px;border-radius:3px;background:#c2c0bb}
.pgn i.on{width:22px;background:var(--noir)}
/* Les sacs-poubelle au trait, un par sac, dans la boule */
.sacs{display:flex;align-items:center;justify-content:center;gap:1px}
.sacs svg{width:17px;height:22px}
.lienbas{display:flex;align-items:center;gap:10px;width:100%;background:#fdfdfc;
  border:1.25px solid var(--trait);border-radius:6px;padding:13px 14px;margin-top:16px;text-align:left;
  font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.lienbas .ic{width:20px;height:20px;flex:none}
/* Les lignes de « Reprendre » sur l'accueil */
/* Les cartes de « Reprendre » (.repli) sont parties le 08/08/2026 avec le bloc. */

/* ---- FICHE redessinée (handoff Claude Design) ---- */
.fcarte{margin:16px 0 0;border-radius:6px;background:#f6f5f3;border:1px solid #dcdad5;overflow:hidden}
.fcarte .bande{height:8px;display:block}
.fcarte .fin{padding:14px}
.fcarte .ftop{display:flex;align-items:center;gap:10px}
.fcarte .frond{width:36px;height:36px;border-radius:50%;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;flex:none;background:transparent}
.fcarte .frond .ic{width:13px;height:13px}
.fdom{border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--noir)}
.fdom .ic{width:13px;height:13px}
.fcarte .fet{width:22px;height:22px;flex:none;background:transparent;border:0;padding:0;color:#b5b3ae}
.fcarte .fet.on{color:#c9940c}
.fcarte h1{display:block;font-size:24px;font-weight:700;line-height:1.1;margin-top:14px}
/* ═══ LE BANDEAU D'UNE FICHE (Centre) ═══
   ⚠ NI 38 PX NI EN CAPITALES : c'est la taille d'un titre de TIROIR (« LE LINGE »,
   trois mots). Un nom de fiche peut faire soixante signes — « Centre de prévention
   des violences conjugales et familiales » aurait rempli l'écran en majuscules. Il
   garde la graisse et le serrage du bandeau, il perd la casse et le corps. */
.hero.fiche h1{font-size:clamp(21px,7vw,29px);text-transform:none;
  letter-spacing:-.02em;line-height:1.1}
.fintro{padding-top:14px}
.fintro .fdesc{font-size:15px;line-height:1.45;color:#4a4844;margin:0}
.fintro .fcond{font-size:15px;line-height:1.45;color:var(--noir);font-weight:500;
  margin:11px 0 0;padding-left:11px;border-left:3px solid var(--noir)}
.fcarte .fdesc{font-size:15px;line-height:1.45;color:#4a4844;margin:8px 0 0}
/* LES CONDITIONS — pas de titre, donc c'est la FORME qui doit dire « lis-moi
   d'abord » : un filet à gauche, l'encre pleine, et un rien plus gras que la
   description au-dessus. Assez pour accrocher l'œil, pas assez pour crier. */
.fcarte .fcond{font-size:15px;line-height:1.45;color:var(--noir);font-weight:500;
  margin:11px 0 0;padding-left:11px;border-left:3px solid var(--noir)}
.frows{padding:6px 0 0}
.frow{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #dcdad5}
.frow .fl{width:74px;flex:none;font-family:ui-monospace,monospace;font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984;padding-top:3px}
.frow .fv{flex:1;font-size:15px;font-weight:500;line-height:1.4;min-width:0;word-break:break-word}
.frow .fv a{color:var(--noir);font-weight:600;text-decoration:underline}
.fsavoir{margin:18px 0 0;border-radius:6px;background:var(--noir);color:#f2eee6;padding:16px}
.fsavoir b{display:flex;align-items:center;gap:9px;font-family:ui-monospace,monospace;font-size:9.5px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#f5c542}
.fsavoir b .ic{width:16px;height:16px;flex:none}
.fsavoir p{font-size:14.5px;line-height:1.5;margin:8px 0 0;white-space:pre-line}
/* ═══ CE QUI SORT DU CADRE NOIR (Mag, 21/08/2026, piste A) ═══
   Le texte d'une fiche se lit maintenant sur le fond de la page. Deux gains, et le
   deuxième est le plus grand : les lignes TOUT EN CAPITALES qui traînaient au milieu
   des paragraphes (« SELON LE DÉLAI », « NOTRE RÔLE ») deviennent de vrais
   sous-titres, et les lignes en • deviennent de vraies puces. C'est la moitié de ce
   qu'on gagne, et ça ne dépend d'aucune réécriture.
   ⚠ Le filet jaune est réservé aux blocs qui commencent par ⚠ : ce sont les phrases
   qui corrigent une idée fausse. Ne pas l'étendre au reste, il perdrait son sens. */
.fnotes{margin-top:18px;display:flex;flex-direction:column;gap:18px}
.fnbloc h3{margin:0 0 6px;font-family:ui-monospace,monospace;font-size:10px;font-weight:600;
  letter-spacing:.19em;text-transform:uppercase;color:var(--enc2)}
.fnbloc p{margin:0 0 8px;font-size:14.5px;line-height:1.55;white-space:pre-line}
.fnbloc p:last-child{margin-bottom:0}
.fnbloc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.fnbloc ul+p{margin-top:8px}
.fnbloc li{position:relative;padding-left:15px;font-size:14.5px;line-height:1.5}
.fnbloc li::before{content:'';position:absolute;left:0;top:.62em;width:5px;height:5px;
  border-radius:50%;background:var(--noir);opacity:.55}
.fnbloc.attention{border-left:3px solid #c9940c;padding-left:13px}
/* Les documents officiels : la forme d'une ligne qui ouvre quelque chose (rond
   pastel, dessin noir), avec une flèche vers le BAS au lieu du chevron — ça descend
   dans le téléphone, ça ne change pas de page. */
.fdocs{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.fdt{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--enc2);margin-bottom:2px}
.fdoc{display:flex;align-items:center;gap:13px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:14px;padding:12px 14px;color:var(--noir);text-decoration:none;min-height:64px;
  /* ⚠ `text-align:left` et `width:100%` : la moitié de ces lignes sont des <button>,
     qui centrent leur texte par défaut — on avait donc deux alignements dans la même
     liste selon que la ligne ouvrait un fichier ou lançait une impression. */
  text-align:left;width:100%}
.fdoc>.ic{width:38px;height:38px;flex:none;border-radius:50%;background:#e4edf7;
  display:flex;align-items:center;justify-content:center}
.fdoc>.ic svg,.fdoc>.ic .pico{width:18px!important;height:18px!important}
.fdoc .tx{flex:1;min-width:0}
.fdoc .tx b{display:block;font-size:15.5px;font-weight:600;line-height:1.25}
.fdoc .tx em{font-style:normal;display:block;font-size:12.5px;line-height:1.4;color:var(--enc2);margin-top:3px}
.fdoc .chv{flex:none;width:30px;height:30px;border-radius:50%;background:#f2f0ed;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#57554f}
@media (hover:hover){ .fdoc:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)} }
@media print{ .fdocs{display:none} }
/* ═══ LA TRAME DU PREMIER ACCUEIL ═══
   Des champs de saisie, pas des cartes : on écrit dedans pendant qu'on parle. Les
   étiquettes restent au-dessus et lisibles — on les relit en diagonale pour savoir
   quelle question vient, sans quitter la personne des yeux trop longtemps. */
.accform{margin-top:20px;display:flex;flex-direction:column;gap:20px}
.accg{display:flex;flex-direction:column;gap:11px}
.acct{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;border-bottom:2px solid var(--noir);padding-bottom:7px}
.accf{display:flex;flex-direction:column;gap:5px}
.accf>span{font-size:13.5px;line-height:1.35;color:#3a3833}
/* Le conseil sous une question : il aide à la POSER, il ne se remplit pas. Gris,
   en italique, plus petit que la question — on doit pouvoir ne pas le lire. */
.acctip{display:block;font-style:italic;font-size:13px;line-height:1.4;color:var(--enc2);
  margin:-1px 0 2px}
.accf input,.accf textarea{font:inherit;font-size:16px;line-height:1.45;color:var(--noir);
  background:#fdfdfc;border:1.25px solid var(--trait);border-radius:10px;padding:10px 12px;
  width:100%;resize:vertical}
.accf textarea{min-height:56px}
.accf input:focus,.accf textarea:focus{outline:none;border-color:var(--noir);
  box-shadow:0 0 0 1.5px var(--noir)}
.accnotebloc{margin-top:24px;display:flex;flex-direction:column;gap:9px}
.accnote{margin:0;background:#fdfdfc;border:1.25px solid var(--trait);border-radius:12px;
  padding:14px;font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}
.accnote.vide{color:var(--enc2);font-family:inherit;font-size:14px;line-height:1.5}
.accact{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.accb{display:inline-flex;align-items:center;gap:8px;background:#fdfdfc;border:1.25px solid var(--trait);
  border-radius:999px;padding:11px 17px;font-size:14.5px;font-weight:600;color:var(--noir)}
.accb.plein{background:#f5c542;border-color:#e0b02f}
.accb .ic,.accb svg{width:16px;height:16px;flex:none}
@media (hover:hover){ .accb:hover{box-shadow:0 0 0 1.5px var(--noir)} }
@media print{ .accact{display:none} }
.fdoc-fiche{display:block;width:100%;text-align:left;background:none;border:0;padding:2px 4px 10px 65px;
  margin-top:-4px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--enc2)}
@media (hover:hover){ .fdoc-fiche:hover{color:var(--noir)} }
.fboutons{padding:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fboutons.n1{grid-template-columns:1fr}
.fboutons.n3{grid-template-columns:repeat(3,1fr)}
/* Sur téléphone, trois pictos suffisent : les mots serrés à trois colonnes se
   couperaient en deux lignes (Mag, 08/08/2026 : « on comprendra »). */
@media (max-width:520px){ .fboutons.n3 .lb{display:none} .fboutons.n3 .fbtn{gap:0} }
.ftel-non{margin-top:10px;font-size:12.5px;color:#8b8984;line-height:1.5}
.ftel-non button{text-decoration:underline;color:#73716b;font-size:12.5px}
.fbtn{border-radius:6px;background:#f6f5f3;border:1.25px solid var(--trait);padding:14px;
  display:flex;align-items:center;justify-content:center;gap:9px;color:var(--noir);
  font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.fbtn.plein{border-color:transparent}
.fbtn .ic{width:17px;height:17px;flex:none}
.fsrc{padding:20px 0 6px;text-align:center;font-size:12px;color:#a3a19c;white-space:pre-line}


/* ── LA PLANCHE DE L'ONBOARDING (réservée à l'administration) ── */
.obt-i{font-size:14.5px;line-height:1.55;margin:16px 0 4px;color:#3d3b37;max-width:620px}
.obt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:18px}
.obt-n{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;border-bottom:1.5px solid var(--noir);padding-bottom:7px;margin-bottom:11px}
.obt-tel{background:var(--creme);border:1.5px solid var(--trait-fort);border-radius:18px;padding:11px;overflow:hidden}
.obt-no{pointer-events:none}
.obt-tel .onb{padding:0;max-width:none}
.obt-tel .onb-e{min-height:460px}
.obt-tel .onb-t{font-size:30px}

/* ══ L'ONBOARDING (08/08/2026) ══ Un écran à la fois, plein cadre. Rien d'inventé :
   les titres reprennent la typographie des bandeaux, les couleurs sont celles de
   l'app. Le noir et le rouge portent les deux écrans qui doivent marquer — l'arrivée
   et la règle de confidentialité. */
.onb{max-width:620px;margin:0 auto;padding:6px 0 30px}
.onb-e{border:1.5px solid var(--trait-fort);border-radius:14px;padding:26px 22px 22px;background:#fdfdfc;
  display:flex;flex-direction:column;min-height:calc(100dvh - 210px)}
.onb-e.noir{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.onb-e.rouge{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.onb-pas{display:flex;gap:5px;margin-bottom:22px}
.onb-pas i{flex:1;height:3px;border-radius:2px;background:rgba(27,27,27,.16)}
.onb-pas i.on{background:var(--noir)}
.onb-e.noir .onb-pas i{background:rgba(242,238,230,.22)} .onb-e.noir .onb-pas i.on{background:#f2eee6}
.onb-e.rouge .onb-pas i{background:rgba(255,255,255,.3)} .onb-e.rouge .onb-pas i.on{background:#fff}
.onb-sur{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;opacity:.7;margin-bottom:8px}
.onb-t{font-size:40px;font-weight:700;line-height:.95;letter-spacing:-.035em;text-transform:uppercase;
  margin-bottom:16px}
.onb-e p{font-size:15.5px;line-height:1.55;margin-bottom:16px;opacity:.92}
.onb-e p.onb-p{font-size:13.5px;color:var(--enc2);opacity:1}
.onb-b{margin-top:auto;border:0;border-radius:10px;background:var(--noir);color:#f2eee6;
  padding:16px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.onb-b.jaune{background:var(--jaune);color:var(--noir)}
.onb-e.rouge .onb-b{background:#fff;color:var(--rouge)}
.onb-s{margin-top:10px;border:0;background:none;color:inherit;opacity:.6;cursor:pointer;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:8px;width:100%}
/* ── LE PIED DE PAGE DE LA VISITE : RETOUR À GAUCHE, PASSER À DROITE (Mag, 08/08/2026)
   « On devrait pouvoir faire passer, et on peut faire retour aussi pour relire. »
   Il est sur LES SIX écrans, toujours au même endroit et toujours de la même taille :
   on ne cherche pas où est la sortie, on la connaît dès le premier écran. Discret —
   c'est le grand bouton du milieu qui reste le chemin normal. */
.onb-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding-top:12px;border-top:1px solid currentColor;
  border-top-color:rgba(128,128,128,.22)}
.onb-nav button{border:0;background:none;color:inherit;opacity:.6;cursor:pointer;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:8px 2px}
@media (hover:hover){ .onb-nav button:hover{opacity:1} }
/* Sur le premier écran il n'y a rien à relire : la place du « Retour » reste vide
   pour que « Passer » ne se déplace pas d'un écran à l'autre. */
.onb-nav .vide{opacity:0;pointer-events:none}
/* les quatre boutons */
.onb-l{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.onb-li{display:flex;align-items:center;gap:13px;border:1.25px solid var(--trait);border-radius:10px;padding:12px}
.onb-r{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.onb-r .ic{width:19px;height:19px;color:var(--noir)}
.onb-lt b{display:block;font-size:15px;font-weight:600}
.onb-lt em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:3px}
/* la règle */
.onb-ex{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.14);
  border-radius:9px;padding:12px 13px;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.onb-ex i{font-style:normal;flex:none;width:21px;height:21px;border-radius:50%;background:#fff;
  color:var(--rouge);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.onb-ex.non{background:rgba(0,0,0,.22)}
/* les cases à cocher */
.onb-ch{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.onb-c{display:flex;align-items:center;gap:12px;border:1.25px solid var(--trait);border-radius:10px;
  padding:14px 13px;background:#fdfdfc;font-family:inherit;font-size:15px;font-weight:500;
  cursor:pointer;text-align:left;width:100%}
.onb-c i{flex:none;width:21px;height:21px;border:1.25px solid var(--trait);border-radius:5px;display:block}
.onb-c.on{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.onb-c.on i{background:#6cb392;border-color:#6cb392;position:relative}
.onb-c.on i::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--noir);font-size:13px;font-weight:700}
/* les deux encadrés et le jeu */
/* ═══ LA RÈGLE, SUR L'ÉCRAN DU CENTRE (21/08/2026) ═══
   Elle avait un écran entier ; elle a maintenant un encadré, sur l'écran où l'on
   écrit. ⚠ IL EST NOIR, et c'est la seule chose noire de la visite : `.onb-ex` est
   dessiné pour un fond sombre (coche blanche, fond translucide), et surtout le noir
   ne sert QU'À CE QUI ALERTE. Une règle qu'on peut enfreindre en fait partie. */
.onb-regle{background:var(--noir);color:#f2eee6;border-radius:10px;padding:15px;margin-bottom:14px}
.onb-regle b{display:block;font-size:15.5px;line-height:1.35;margin-bottom:7px}
.onb-regle span{display:block;font-size:14px;line-height:1.5;opacity:.86;margin-bottom:11px}
.onb-p2{font-size:14px;line-height:1.5;opacity:.75;margin-top:-2px}
.onb-cadre{border:1.25px solid var(--trait);border-radius:10px;padding:14px;margin-bottom:14px}
.onb-ct{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;padding-bottom:9px;margin-bottom:12px;border-bottom:1.5px solid var(--noir)}
.onb-bj{border:0;border-radius:9px;background:var(--jaune);color:var(--noir);padding:14px;width:100%;
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
/* les trois pas du raccourci */
.onb-pas3{margin-bottom:18px}
.onb-pas3 div{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid rgba(242,238,230,.2)}
.onb-pas3 div:last-child{border-bottom:0}
/* ⚠ LE SÉLECTEUR VISAIT TOUS LES <b>, Y COMPRIS CEUX DU TEXTE (Mag, 08/08/2026 :
   « c'est illisible »). Le numéro de l'étape est un <b> dans une pastille ronde — et
   les mots mis en gras DANS la phrase (« Partager », « Sur l'écran d'accueil »,
   « Ajouter ») recevaient le même habillage : chacun devenait une pastille de 26 px
   qui écrasait son propre texte. Le `>` limite la règle au <b> qui est ENFANT DIRECT
   de la ligne, c'est-à-dire au numéro. */
.onb-pas3 > div > b{flex:none;width:26px;height:26px;border-radius:50%;background:#f2eee6;color:var(--noir);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.onb-pas3 span{font-size:14.5px;line-height:1.45}
/* ═══ LE RACCOURCI EN TROIS DESSINS (Mag, 08/08/2026) ═══
   « Ça, perso, c'est compliqué. Fais plutôt un schéma. Pour moi, ça a été : tu fais
   ça, deux, fais ça, trois, fais ça — de manière très claire. »

   Trois phrases de deux lignes qui décrivent un bouton, c'est demander à quelqu'un de
   reconstruire une image dans sa tête pendant qu'il cherche ce bouton du pouce. On
   MONTRE le bouton à la place : à gauche le numéro, au milieu le dessin de ce qu'on
   va toucher, à droite trois mots. Elle reconnaît la forme, elle la cherche sur son
   écran, elle appuie.
   ⚠ Les dessins ne sont pas des captures d'iPhone : ils sont redessinés au trait,
   dans les couleurs de COUSIN. Une capture vieillit à chaque version d'iOS. */
.onb-sch{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.onb-sch > div{display:flex;align-items:center;gap:13px;
  border:1.5px solid rgba(242,238,230,.26);border-radius:12px;padding:11px 13px}
.onb-sch > div > b{flex:none;width:27px;height:27px;border-radius:50%;background:#f2eee6;
  color:var(--noir);display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:700}
/* La vignette : fond clair, comme un morceau d'écran de téléphone découpé et posé là. */
.onb-sch .vg{flex:none;width:58px;height:44px;border-radius:7px;background:#f2eee6;
  color:var(--noir);display:flex;align-items:center;justify-content:center;overflow:hidden}
.onb-sch .vg svg{display:block}
.onb-sch .tx{font-size:14.5px;line-height:1.35;min-width:0}
.onb-sch .tx b{font-weight:700}
.onb-sch .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:3px}
@media (max-width:400px){ .onb-t{font-size:33px} }

/* ── LA FEUILLE DES SORTIES (08/08/2026) ── Elle s'affiche au mur du centre : elle
   doit se lire debout et de loin. Date en gros à gauche, prix à droite, filets
   fins — pas d'aplat, l'encre coûte. */
/* Mag, 08/08/2026 : « ce n'est pas très aéré, il faut que ce soit plus visible et
   lisible ». On respire : plus d'air entre les lignes, entre le titre de section et
   la première sortie, et un peu plus de corps sur les noms. */
.ag-h{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;margin:26px 0 4px;padding-bottom:7px;border-bottom:1.5px solid #1b1b1b}
.ag-l{display:flex;gap:16px;align-items:flex-start;padding:14px 0;
  border-bottom:1px solid #d6d4d0;break-inside:avoid}
.ag-d{flex:none;width:56px;text-align:center;line-height:1.05}
.ag-d b{display:block;font-size:24px;font-weight:700}
.ag-d span{display:block;font-size:10.5px;margin-top:1px}
.ag-d em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:7.5px;
  letter-spacing:.08em;text-transform:uppercase;color:#73716b;margin-top:4px}
.ag-t{flex:1;min-width:0}
.ag-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.ag-t span{display:block;font-size:11.5px;color:#4a4844;line-height:1.45}
.ag-t .ag-a{font-size:10.5px;color:#73716b}
.ag-t .ag-tel{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;color:#1b1b1b;margin-top:4px}
.ag-t em{margin-top:4px}
.ag-t em{display:block;font-style:normal;font-size:10.5px;color:#73716b;margin-top:1px}
.ag-p{flex:none;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid #1b1b1b;border-radius:999px;padding:3px 8px;white-space:nowrap}
.ag-p.g{border-style:dashed}
.ag-fin{margin-top:14px;padding-top:8px;border-top:1px solid #d6d4d0;font-size:11px;color:#73716b}

/* ── CONSEILLÉE PAR L'ÉQUIPE (08/08/2026) ──────────────────────────────────
   Une fiche que l'équipe recommande se voit de loin : filet noir plus épais, et
   la RAISON écrite en toutes lettres. Pas de couleur d'accent en plus — le
   domaine a déjà la sienne, et deux couleurs sur la même carte se disputent. */
/* La carte conseillée se distingue par TROIS choses discrètes qui s'additionnent
   (Mag, 08/08/2026 : « une pastille un peu colorée, pour que ça passe vraiment en
   priorité ») : un filet plus épais, un fond crème légèrement plus chaud, et un
   trait doré sur tout le bord gauche. Le doré est celui des étoiles, déjà dans
   l'app — on n'introduit pas une couleur de plus. */
/* ⚠ PAS DE DORÉ ICI. Premier essai en #c9940c, la couleur des étoiles : sur un
   fond crème et avec le texte assombri pour rester lisible, ça virait au brun
   olive. Mag : « il est un peu plus coloré là, ses bruns, caca. » On prend le
   JAUNE FRANC de l'app, celui de l'accueil, avec du texte noir dessus. */
.frow2.reco{border-width:2px;background:#fffdf3;position:relative;overflow:hidden}
.frow2.reco::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--jaune)}
.recolg{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  background:var(--jaune);border-radius:999px;padding:4px 11px 4px 9px;
  font-family:ui-monospace,monospace;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir)}
.recolg .ic,.recolg svg{width:12px;height:12px;flex:none;color:var(--noir)}
.recopq{display:block;margin-top:5px;font-size:12.5px;line-height:1.4;color:#4a4844;font-style:normal}
/* LA FICHE DÉCONSEILLÉE : même construction que la conseillée, en rouge. Elle n'est
   ni cachée ni reléguée au fond — une adresse qu'on déconseille reste parfois la
   seule ouverte un dimanche. On la signale, on ne l'efface pas. */
.frow2.deco{border-width:2px;background:#fdf8f7;position:relative;overflow:hidden}
.frow2.deco::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rouge)}
.decolg{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  background:#fbe3e1;border-radius:999px;padding:4px 11px 4px 9px;
  font-family:ui-monospace,monospace;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:#8c1a13}
.decolg .ic,.decolg svg{width:12px;height:12px;flex:none;color:var(--rouge)}
/* Les deux boutons d'avis, sur leur propre ligne : ils ne trient pas la même chose
   que les étiquettes, ils ne doivent pas se mélanger à elles. */
.favrow{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0 2px}
.favchip{display:inline-flex;align-items:center;gap:8px;border:1.25px solid var(--trait);
  border-radius:999px;padding:8px 14px;background:#fdfdfc;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:600;color:var(--noir)}
.favchip .ic{width:14px;height:14px;flex:none;color:#c9940c}
.favchip i{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;
  background:var(--jaune);border-radius:999px;padding:2px 7px}
.favchip.on{background:var(--jaune)}
.favchip.on i{background:var(--noir);color:var(--jaune)}
.favchip.deco{border-color:var(--rouge);color:#8c1a13}
.favchip.deco .ic{color:var(--rouge)}
.favchip.deco i{background:#fbe3e1;color:#8c1a13}
.favchip.deco.on{background:var(--rouge);color:#fff}
.favchip.deco.on .ic{color:#fff}
.favchip.deco.on i{background:#fff;color:var(--rouge)}
/* La ligne « Qui est reçu », et son intitulé. Ses deux boutons sont des pastilles
   ordinaires (dessin ① du 19/08/2026) : c'est l'intitulé de la ligne, pas la forme
   du bouton, qui dit que la question n'est pas celle de la rangée du dessous.
   ⚠ On avait essayé un dessin à part — picto noir, pas de compteur. Écarté : deux
   langues sur la même page se lisent plus mal qu'une seule. */
/* ⚠ LA FEUILLE « OÙ ? » MONTE PLUS HAUT (Mag, 19/08/2026 : « la fenêtre peut monter
   plus haut »). Sans plancher, elle s'arrêtait à la hauteur de son contenu — dix
   communes, donc une bande basse qui n'avait pas l'air d'une feuille. */
#ouBg .partcard{min-height:62vh}
@media(min-width:760px){ #ouBg .partcard{min-height:0} }

/* ── LES PAGES DE FORMATION (08/08/2026) ──────────────────────────────────
   ⚠ CE BLOC N'EXISTAIT PAS. Les quatorze formations écrivent depuis toujours
   des `f-page`, `f-lead`, `f-h`, `f-card`, `f-steps`, `f-note` — et AUCUNE de
   ces classes n'avait la moindre règle CSS. Résultat : titres, cartes et
   étapes s'affichaient en texte brut, le titre d'une étape collé à son
   explication (« ProforalLe français tourné vers le travail »). Trouvé en
   relisant la formation sur les cours de français.
   Rien d'inventé ici : on reprend le vocabulaire déjà en place ailleurs dans
   l'app — le monospace espacé des `sect`, le bloc noir des `fsavoir`, le
   filet crème des cartes. */
.f-page{padding-top:4px}
.f-lead{font-size:15.5px;line-height:1.55;margin:0 0 20px;color:var(--noir)}
.f-lead b{font-weight:700}
.f-h{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;color:var(--noir);margin:28px 0 12px;padding-bottom:8px;
  border-bottom:1.5px solid var(--noir)}
.f-card{background:#fdfdfc;border:1px solid var(--ligne);border-radius:8px;padding:14px;margin:0 0 10px}
.f-card .fn{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.f-card .fn .ic{width:15px;height:15px;flex:none}
.f-card .fw{font-size:14.5px;line-height:1.5}
/* Une étape : le numéro dans sa pastille, le texte à côté — titre AU-DESSUS de
   son explication, c'est tout l'objet du `display:block`. */
.f-steps{margin:0 0 6px}
.f-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--ligne)}
.f-step:last-child{border-bottom:0}
.f-step .sn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--noir);color:var(--creme);
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:11px;font-weight:500;margin-top:1px}
.f-step .st{min-width:0}
/* `> b` et non ` b` : les explications contiennent elles-mêmes des mots en gras,
   et un display:block les faisait passer à la ligne au milieu d'une phrase. */
.f-step .st > b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.f-step .st > span{display:block;font-size:13.5px;line-height:1.5;color:var(--enc2)}
.f-step .st > span b{font-weight:700;color:var(--noir)}
.f-note{margin:16px 0 0;border-radius:6px;background:var(--noir);color:#f2eee6;padding:15px;
  font-size:14px;line-height:1.5}
.f-note b{font-weight:700}
.f-note .ic{width:15px;height:15px;vertical-align:-2px;margin-right:6px}
/* Le violentomètre garde ses trois zones colorées. */
.vm-z{border-radius:8px;padding:13px 15px;margin:0 0 10px}
.vm-z b{display:block;font-size:14px;margin-bottom:7px}
.vm-z ul{margin:0;padding-left:19px}
.vm-z li{font-size:13.5px;line-height:1.5;margin-bottom:3px}
.vm-z.green{background:#e8f2ec;border:1px solid #6cb392}
.vm-z.orange{background:#fdf3e3;border:1px solid #f5c542}
.vm-z.red{background:#fbeae9;border:1px solid var(--rouge)}
.vm-src{font-size:12px;color:#a3a19c;text-align:center;padding-top:6px}

/* ---- URGENCES redessinées (handoff Claude Design) ---- */
.uvital{padding:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uvital a{border-radius:6px;background:var(--danger);color:#f2eee6;padding:14px;
  display:flex;align-items:baseline;gap:10px;min-height:76px}
.uvital b{font-size:34px;font-weight:700;line-height:.9;letter-spacing:-.03em}
.uvital span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.ucats{padding:20px 0 0;display:flex;flex-direction:column;gap:10px}
.ucat{border-radius:6px;background:var(--noir);color:#f2eee6;padding:14px;
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:0}
.ucat .rd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ucat .rd .ic{width:18px;height:18px;color:var(--noir)}
.ucat b{flex:1;font-size:15.5px;font-weight:500}
.ucat .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em}
.ucat .sg{font-size:19px;line-height:1}
.usous{display:flex;flex-direction:column;gap:8px;padding-left:14px;margin-top:8px}
/* Le titre d'un réseau prend TOUTE la largeur : en grille, il s'intercalait entre
   deux numéros et cassait la lecture (Mag, 08/08/2026, capture à l'appui). */
.usous .ures{grid-column:1 / -1;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:10px 0 2px;padding-bottom:6px;border-bottom:1px solid rgba(240,239,237,.25)}
.usous .ures:first-child{margin-top:0}
.usous .ures b{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:#f0efed}
.usous .ures em{font-style:normal;font-size:11.5px;color:rgba(240,239,237,.6)}
/* L'étiquette sur la ligne elle-même. */
.ures-p{display:inline-block;margin-left:8px;vertical-align:1px;
  font-family:ui-monospace,monospace;font-size:8px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--ligne);border-radius:999px;padding:2px 7px;color:var(--enc2)}
/* LES PAQUETS SE VOIENT AU TRAIT (Mag, 08/08/2026) : CHIREC épais, IRIS fin, HUB
   entre les deux. Trois épaisseurs plutôt que trois couleurs — la couleur est déjà
   prise par la catégorie, et deux codes couleur sur la même carte se disputent.
   Comme ils sont rangés les uns à la suite des autres, les paquets sautent aux yeux. */
.unum.ures-chirec{border-width:3px}
/* ═══ ET UN PETIT COIN DE COULEUR (Mag, 13/08/2026) ═══
   « Pour différencier les groupes, on pourrait mettre un petit coin de couleur
   identique par groupe. En haut à droite. »
   L'épaisseur du trait marchait quand les hôpitaux se suivaient — mais dès qu'on
   déplie une seule catégorie, il n'y a plus de voisin à qui se comparer, et un trait
   « un peu plus épais » ne dit plus rien tout seul. Le coin, lui, se lit sur une carte
   isolée.
   ⚠ Un TRIANGLE dans l'angle, pas une pastille : il n'occupe aucune place dans la
   ligne, donc il ne pousse ni le nom ni le numéro — et sur un téléphone, la place à
   droite est prise par le numéro, qui est ce qu'on vient chercher. */
.unum{position:relative;overflow:hidden}
.unum.ures-chirec::after,.unum.ures-iris::after,.unum.ures-hub::after{
  content:'';position:absolute;top:0;right:0;width:18px;height:18px;
  clip-path:polygon(100% 0, 0 0, 100% 100%)}
.unum.ures-chirec::after{background:#6fc7d9}
.unum.ures-iris::after{background:#6cb392}
.unum.ures-hub::after{background:#b28b7a}
.unum{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:12px 13px;
  display:flex;align-items:center;gap:12px;color:var(--noir)}
.unum>.ic{width:20px;height:20px;flex:none}
.unum .tx{flex:1;min-width:0}
.unum .tx b{display:block;font-size:15px;font-weight:500;line-height:1.2}
.unum .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:2px}
.unum .no{font-size:16px;font-weight:600;flex:none;white-space:nowrap}

/* ---- LE CENTRE redessiné (handoff Claude Design) ---- */
/* ⚠ LA CARTE NE SE GLISSE PLUS SOUS LE BANDEAU (Mag, 20/08/2026 : « la mise en page
   et le reste… trop compliqué », capture du Linge à l'appui).
   Elle avait `margin-top:-12px` pour se caler sous le bandeau noir — un joli
   chevauchement quand la carte est colorée et ombrée. Mais le bandeau est
   `position:sticky` avec un `z-index` supérieur : il RECOUVRAIT les 12 px du haut,
   donc le trait de la carte et une partie de « AUJOURD'HUI ». Ça ne se lisait pas
   comme un empilement, ça se lisait comme un bug — d'autant plus dès qu'on faisait
   défiler d'un pouce.
   La carte descend sous le bandeau, avec de l'air. */
/* ═══ LA FORME DES LIGNES DU CENTRE ═══
   La page du Centre n'a plus qu'une sorte de bouton : `.famz`, la ligne qui se
   déplie (rangée claire, rond pastel, dessin noir, chevron dans son rond gris — la
   forme choisie le 20/08/2026, voir la mémoire « la ligne de l'app »). Ses règles
   sont plus bas, avec `.famdedans` et `.famli`.
   ⚠ `.cliste` A DISPARU le 21/08 avec le bouton de la check-list : elle ne servait
   qu'à lui. Ne pas la réinventer — si une ligne doit ouvrir quelque chose sur cette
   page, elle prend `.famz`. Une page, une forme. */
.sectc{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--noir);
  padding-bottom:8px;margin:26px 0 12px}
.sectc b{display:flex;align-items:center;gap:9px;font-family:ui-monospace,monospace;font-size:10px;
  font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.sectc b i{width:12px;height:12px;flex:none}
.sectc em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984}
/* Les carrés des sacs : la seule information de la page qui ne s'écrit pas en
   toutes lettres. Ils se posent juste avant le chevron, et ils s'arrondissent un peu
   pour ne pas faire un troisième vocabulaire de formes. */
.famli .sacsq{display:flex;gap:4px;flex:none}
.famli .sacsq i{width:10px;height:10px;border-radius:2px}
/* Survol du Centre : la tuile se soulève d'un trait noir, la carte s'éclaircit.
   Jamais d'inversion en noir — le picto resterait invisible (Mag, 06/08/2026). */
.famz{transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
@media (hover:hover){
  /* Plus de glissement au survol (18/08/2026) — voir le grand bloc « LES SURVOLS,
     PARTOUT » plus bas : le trait net suffit à désigner, et rien ne saute.
     ⚠ La famille répond comme les autres rangées : trois formes de ligne, ça allait
     déjà ; trois façons de répondre au doigt, non. */
  .famz:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
}
.famz:active{background:#fff}

/* ⚠ `.otile` / `.ogrid` / `.onb-jeu` / `.onb-bl` ONT ÉTÉ SUPPRIMÉES le 21/08/2026 :
   plus aucune balise ne les portait. Les tuiles colorées du Centre sont devenues des
   dépliants, et l'encadré du jeu est parti avec la visite en quatre étapes. Du style
   qui ne s'applique à rien se lit comme s'il servait encore. */

/* ---- FORMATIONS redessinées (handoff) ---- */
.fmod{flex:0 0 auto;width:158px;border-radius:6px;padding:15px;display:flex;flex-direction:column;
  min-height:172px;text-align:left;color:var(--noir);border:0;background:#fdfdfc;border:1.25px solid var(--trait)}
.fmod.noir{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.fmod.plein{border-color:transparent}
.fmod>.ic{width:40px;height:40px;flex:none}
.fmod b{font-size:16px;font-weight:600;line-height:1.15;margin-top:14px}
.fmod em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:auto;opacity:.75}
.fmod.noir em{opacity:1}
.sectl{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;padding-bottom:9px;border-bottom:2px solid var(--noir);margin-top:20px}
.flist{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.frow2{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:12px 13px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir)}
.frow2 .rd{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.frow2 .rd .ic{width:18px;height:18px;color:var(--noir)}
.frow2 .tx{flex:1;min-width:0}
.frow2 .tx b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.frow2 .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:2px}
/* ── LA CARTE PISTE C : le nom d'abord, puis une vraie ligne de lecture ── */
.frow2.c3{display:block;border-radius:12px;padding:16px;align-items:stretch}
.frow2.c3 .nomh{display:flex;align-items:flex-start;gap:10px}
.frow2.c3 .nomh b{flex:1;font-size:17px;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.frow2.c3 .nomh .heart{width:26px;height:26px;flex:none;margin:-2px -4px 0 0}
.frow2.c3 .nomh .heart .ic{width:19px;height:19px}
/* La ligne qui dit POUR QUI : police de lecture, minuscules, de l'air entre les
   lignes. C'est la ligne qu'on lit vraiment — elle cesse d'être la plus dure. */
.frow2.c3 .qui{display:block;font-size:14px;line-height:1.55;color:#57554f;margin-top:8px}
.frow2.c3 .fr2pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.frow2.c3 .fr2p{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;
  font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--noir)}
.frow2.c3 .ouc{display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.16em;text-transform:uppercase;color:#8b8984;margin-top:10px}
/* Les conditions et les horaires restent — c'est elle qui les a demandés sur la
   carte le 13/08 — mais en lecture, pas en capitales. */
.frow2.c3 .fr2c,.frow2.c3 .fr2h{display:block;font-family:inherit;font-size:13px;
  line-height:1.45;letter-spacing:0;text-transform:none;color:#8b8984;margin-top:8px}
.frow2.c3 .fr2e{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

/* ---- QUIZ redessiné (handoff) ---- */
.qtop{padding:16px 0 0;display:flex;align-items:center;gap:12px}
.qtop .frond{width:36px;height:36px;border-radius:50%;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;flex:none;background:transparent}
.qtop .frond .ic{width:13px;height:13px}
.qboules{display:flex;gap:7px;flex:1;justify-content:center;align-items:center}
.qboules i{width:13px;height:13px;border-radius:50%;background:rgba(27,27,27,.18)}
.qboules i.ok{background:#3ec98b}
.qboules i.ko{background:var(--danger)}
.qboules i.now{width:16px;height:16px;background:var(--noir)}
.qtop .cpt{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;flex:none}
.qpile{margin:16px 0 0;position:relative;min-height:214px}
.qpile .c1,.qpile .c2{position:absolute;border-radius:6px}
.qpile .c1{left:22px;top:14px;right:34px;height:184px;background:#f3cde5;transform:rotate(-8deg)}
.qpile .c2{left:34px;top:6px;right:22px;height:190px;background:#fdfdfc;border:1.25px solid var(--trait);transform:rotate(5deg)}
.qpile .cq{position:absolute;left:0;right:0;top:0;border-radius:6px;background:var(--noir);color:#f2eee6;
  padding:18px;display:flex;flex-direction:column;min-height:196px}
.qpile .cq .ic{width:40px;height:40px;flex:none;color:#f5c542}
.qpile .cq b{font-size:22px;font-weight:700;line-height:1.15;margin-top:auto}
.qpile .cq em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-top:6px;color:#f5c542}
.qrep{padding:18px 0 0;display:flex;flex-direction:column;gap:10px}
.qrep button{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:15px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir)}
.qrep button .rd{width:26px;height:26px;border-radius:50%;background:transparent;border:1.25px solid var(--trait);
  flex:none;display:flex;align-items:center;justify-content:center}
.qrep button .rd .ic{width:14px;height:14px}
.qrep button b{flex:1;font-size:17px;font-weight:600}
.qrep button.bon{background:#3ec98b}
.qrep button.bon .rd{background:var(--noir)}
.qrep button.bon .rd .ic{color:#3ec98b}
.qrep button.mauvais{background:#f7c1c1}
.qrep button.mauvais .rd{background:var(--noir)}
.qrep button.mauvais .rd .ic{color:#f7c1c1}

/* ---- MA LISTE, LE LINGE, LE FIL, PROFIL, ADMIN (handoff) ---- */
.tache{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--trait-fort);padding:13px 14px;
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:var(--noir)}
.tache.faite{background:#f6f5f3;border-color:#dcdad5}
.tache .cas{width:26px;height:26px;border-radius:4px;background:transparent;border:1.25px solid var(--trait);
  flex:none;display:flex;align-items:center;justify-content:center}
.tache.faite .cas{background:var(--noir)}
.tache .cas .ic{width:14px;height:14px;color:#3ec98b}
.tache .tx{flex:1;min-width:0}
.tache .tx b{display:block;font-size:15.5px;font-weight:500;line-height:1.2}
.tache.faite .tx b{color:#8b8984;text-decoration:line-through}
.tache .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:2px}
.rlist{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.role{border-radius:6px;background:#f6f5f3;border:1px solid #dcdad5;padding:12px 13px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir)}
.role i.pt{width:13px;height:13px;flex:none}
.role b{flex:1;font-size:15px;font-weight:500}
.role .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:#8b8984}
.role .sg{font-size:19px;color:rgba(27,27,27,.35)}
/* Une case de constat qui s'ouvre VRAIMENT prend la robe des boutons : blanche,
   cerclée de noir. Le filet gris fin contre le filet noir ne se distinguait pas
   sur un téléphone — on appuyait dans le vide (Mag, 07/08/2026). */
.role.ouvre{background:#fdfdfc;border:1.25px solid var(--trait)}
@media (hover:hover){
  .role.ouvre:hover{background:var(--noir);color:#f2eee6}
  .role.ouvre:hover .n,.role.ouvre:hover .sg{color:rgba(242,238,230,.65)}
}
/* La phrase que les hébergés viennent demander, posée sous la carte du jour. En
   écriture de lecture, pas en capitales : c'est une réponse, pas un avertissement. */
.lingedem{margin:14px 2px 0;font-size:15px;line-height:1.5;color:#57554f}
.tour{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid #dcdad5}
/* ═══ LA LIGNE D'AUJOURD'HUI SE VOIT D'UN COUP D'ŒIL (Mag, 20/08/2026) ═══
   « Si tu le mets un peu plus en avant, ce sera beaucoup plus facile, en un clin
   d'œil, de voir ce qu'il faut faire aujourd'hui. »
   Elle portait juste un fond gris pâle : à un mètre, elle ressemblait aux six
   autres. Trois choses la détachent maintenant, et aucune n'ajoute de couleur
   nouvelle — elles reprennent celle de l'étage du jour :
   · un filet épais à gauche, dans la couleur de l'étage ;
   · un fond de cette même couleur, très dilué (18 %) ;
   · le mot « AUJOURD'HUI » en pastille noire, au lieu d'un gris parmi les gris.
   ⚠ `--j` vient du HTML : la couleur change tous les jours.
   ⚠ La ligne `background:#f6f5f3` avant le `color-mix` n'est pas un doublon : c'est
   le repli pour un navigateur qui ne connaît pas `color-mix`. */
/* ⚠ DE L'AIR AU-DESSUS (Mag, 20/08/2026 : « il y a un problème d'espaces
   au-dessus »). La ligne se collait au filet noir du titre de section — deux traits
   épais à 2 px l'un de l'autre, ça se cogne. */
.tour.cejour{border-radius:8px;border-bottom-color:transparent;padding:15px 12px;margin:12px 0 2px;
  border-left:4px solid var(--j,#1b1b1b);
  background:#f6f5f3;
  background:color-mix(in srgb, var(--j,#1b1b1b) 18%, #fdfdfc)}
/* ⚠ 600 ET NON 700 (« un problème de graisse de police »). Les autres lignes sont
   en 500 : sauter à 700 ET grossir en même temps faisait deux changements d'un
   coup, et le nom paraissait d'une autre police. Un cran, pas deux. */
.tour.cejour b{font-weight:600;font-size:16.5px}
/* Le carré de couleur ne sert plus à rien sur cette ligne : le filet de gauche le
   dit déjà, en plus gros. Deux fois la même couleur à 10 px d'écart, c'est du bruit. */
.tour.cejour i{display:none}
.tour .auj{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;background:var(--noir);color:#f2eee6;
  border-radius:999px;padding:5px 10px;flex:none}
.tour .ch{font-style:normal;flex:none;margin-left:10px}
.tour i{width:14px;height:14px;flex:none}
.tour b{flex:1;font-size:15.5px;font-weight:500}
/* LE JOUR ET LES CHAMBRES, PLUS VISIBLES (Mag, 08/08/2026 : « plus visible stp,
   1 tout petit peu plus gras »). C'est l'information qu'on vient chercher sur cette
   page — quel jour, quelles chambres — et elle était écrite en gris pâle, en 9 px,
   plus discrète que le nom de l'étage. Un point de taille, un cran de graisse, et le
   gris passe à l'encre : juste ce qu'il faut pour qu'on le lise en passant. */
.tour em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:#4a4844;font-weight:500}
.msg{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:15px;color:var(--noir)}
/* ÉPINGLÉ : crème à gros filet doré, pas une dalle noire — la carte noire faisait
   sévère et assombrissait tout le haut du fil (Mag, 06/08/2026). */
.msg.epingle{background:#fdfdfc;color:var(--noir);border-color:var(--trait-fort);
  border-left:7px solid #d9a20b;padding-left:14px}
.msg.epingle .lab{color:#b7862c}
.msg .top{display:flex;align-items:center;gap:10px}
.msg .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none;font-size:14px;font-weight:600;color:var(--noir)}
.msg .top .tx{flex:1;min-width:0}
.msg .top b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.msg .top em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:1px}
.msg .lab{display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:9px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#f5c542;margin-bottom:10px}
.msg .lab .ic{width:14px;height:14px;flex:none}
.msg p{font-size:15px;line-height:1.45;margin:11px 0 0}
.avgrand{width:64px;height:64px;border-radius:50%;background:var(--noir);color:#f2eee6;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none}
.pident{display:flex;align-items:center;gap:14px;padding:16px 0 0}
.pident .tx b{display:block;font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.pident .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.acc{border-radius:6px;background:#fdfdfc;border:1.25px solid var(--trait);padding:13px 14px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir)}
.acc.open{background:var(--noir);color:#f2eee6}
/* Les Paramètres, en tête du profil et en couleur (Mag, 08/08/2026 : « en évidence,
   genre en couleur »). Le doré est celui de la roue de l'ancienne app — la couleur
   qu'elle associe déjà à « gérer ». Le texte reste noir : sur du doré, du crème ne
   se lirait pas, et cette page se consulte parfois d'un coup d'œil rapide. */
.acc.param{background:#f5c542;border-color:var(--trait-fort)}
.acc.param b{font-weight:600}
/* ═══ UNE FILE QUI N'EST PAS VIDE SE VOIT (Mag, 18/08/2026) ═══
   « Mets ça en premier en haut mais en couleur quand il y a des messages. C'est
   important, et fais pareil pour les autres notif de cette page. »
   L'orange de l'Admin, et SEULEMENT quand quelque chose attend — une pastille
   allumée en permanence ne veut plus rien dire au bout de trois jours. Texte noir :
   sur cet orange, du crème ne se lit pas.
   ⚠ Le compte passe en gras et perd sa transparence : c'est le chiffre qu'on vient
   chercher, il ne doit pas être le plus pâle de la ligne. */
.acc.duboulot{background:#f8763f;border-color:var(--trait-fort)}
.acc.duboulot b{font-weight:700}
.acc.duboulot .n{opacity:1;font-weight:700}
.acc.duboulot.open{background:var(--noir);color:#f2eee6}
.acc.param .n{opacity:.85}
.acc b{flex:0 0 auto;font-size:15.5px;font-weight:500;min-width:0}
.acc .n{flex:1;text-align:right}
.acc .n{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sg{font-size:19px}
.accin{padding-left:14px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
/* La ligne « X masquée(s) » sous les boules de l'accueil. Discrète — c'est une
   explication, pas une alerte : rien n'est cassé, c'est un réglage. Mais elle est
   CLIQUABLE et mène droit au profil, là où ça se remet. */
/* ⚠ CE N'EST PLUS UN PANNEAU GRIS, C'EST UN BOUTON QUI RÉPARE. En pointillés pâles
   il se lisait comme une note de bas de page — or c'est la seule chose à toucher
   quand l'app a l'air cassée. Trait plein, texte noir, et le verbe (« les
   remettre ») en gras devant l'explication. */
/* (le style .rappel-insc est parti avec sa fonction, le 11/08/2026) */
.boules-masq{display:block;width:100%;text-align:left;margin-top:10px;padding:11px 13px;
  border:1.25px solid var(--trait);border-radius:6px;background:#fdfdfc;cursor:pointer;color:var(--noir)}
.boules-masq b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.boules-masq em{display:block;font-style:normal;font-family:ui-monospace,monospace;
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:4px}
@media (hover:hover){ .boules-masq:hover{background:var(--noir);color:#f2eee6}
                      .boules-masq:hover em{color:rgba(242,238,230,.7)} }
/* La petite étoile devant « Tes favoris », dans le profil. Le doré est celui de
   l'étoile pleine des fiches : c'est le même objet, il porte la même couleur. */
.role b .ic.etp{width:15px;height:15px;color:#c9940c;margin-right:7px;vertical-align:-2px}
/* ═══ LES TROIS GROUPES DE L'ADMIN (Mag, 08/08/2026) ═══
   « Demande d'accès et ajouter quelqu'un, ça va ensemble, donc il faut que ce soit
   plus dans un groupe. Couleur s'il faut. Le chantier, les modèles de check-lists,
   c'est aussi dans un groupe. On peut même rajouter les statistiques au deuxième. »
   Et, une minute après : « Qui est venu, c'est en fait tous les gens qui sont
   inscrits ? Dans ce cas-là, ça avec l'équipe. » — elle avait raison, c'est la même
   liste de 31 personnes, rangée par dernière visite.

   Sept boutons identiques à la file, on les relit tous pour retrouver le bon. Ils
   répondent en fait à trois questions différentes : qui entre, qui est là, et mon
   travail à moi. Chaque groupe porte donc un titre et une barre de couleur À GAUCHE
   — jamais un fond de couleur : les boutons noircissent quand on les ouvre, un fond
   coloré se battrait avec ça.
   ⚠ La barre est le seul repère de couleur : elle doit rester du même côté et de la
   même épaisseur dans les trois groupes, sinon elle ne se lit plus comme un groupe
   mais comme trois décorations. */
.admg{margin-top:22px;border-left:3px solid var(--gc,#f8763f);padding-left:13px}
.admg > .admgt{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.admg > .admgt b{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--gc,#f8763f)}
.admg > .admgt em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984}
/* Dans un groupe, les boutons se suivent de près : c'est l'écart entre les GROUPES
   qui doit se voir, pas celui entre deux boutons du même groupe. */
.admg .acc{margin-top:8px}
.admg .acc:first-of-type{margin-top:0}
/* ── « Qui est venu » : une personne par ligne, empilée ──
   L'adresse en haut sur toute la largeur, le délai en dessous. Sur grand écran la
   liste passe en colonnes, mais chaque case garde ses deux étages : c'est ça qui
   rend la lecture possible, pas la largeur. */
.vlist{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
@media (min-width:900px){ .vlist{grid-template-columns:repeat(2,1fr)} }
.venu{border:1px solid var(--ligne);border-radius:6px;padding:9px 11px;background:#fdfdfc;min-width:0}
.venu b{display:block;font-size:14px;font-weight:500;line-height:1.25;
  overflow-wrap:anywhere}                       /* une adresse longue coupe où il faut */
.venu em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:4px}
/* Jamais entré : la case s'efface, mais le nom reste NOIR — c'est justement celui
   qu'on cherche dans cette liste. Griser le nom l'aurait rendu illisible. */
.venu.pas{background:transparent;border-style:dashed}
.venu.pas em{color:#b4b2a9}
.badge{display:inline-flex;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;background:#f6e7a8;color:var(--noir);padding:3px 8px;border-radius:999px}

/* ══════ LES JEUX — armature commune (refonte du 06/08/2026) ══════
   Tout se joue dans une colonne de 560 px maximum, centrée : sur un écran
   d'ordinateur, une question qui traverse 1200 px ne se lit pas, et les boutons
   deviennent des barres sans fin (Mag : « beaucoup trop large »). */
#view .jxwrap,#view .pf-wrap,.jxwrap,.pf-wrap{max-width:560px;margin:0 auto;width:100%}
/* ═══ LA PARTIE SE CENTRE DANS LA HAUTEUR, SUR GRAND ÉCRAN (Mag, 11/08/2026) ═══
   « Le centre en hauteur se place sur l'écran. »
   Une carte de jeu de 560 px collée en haut d'un écran de 1000 px laisse les deux
   tiers de la page vides sous elle : on regarde une question posée dans un coin.
   Le jeu prend TOUTE la hauteur utile et la question se pose au milieu, là où les
   yeux sont déjà.
   ⚠ SEULEMENT SUR GRAND ÉCRAN. Sur téléphone, la page se fait plus haute que
   l'écran (les quatre réponses, la correction, les boutons) : centrer là-bas
   couperait le haut de la question. Le centrage suppose qu'il reste de la place —
   d'où `min-height` et non `height`, et `justify-content:center` qui ne déborde
   jamais vers le haut. */
@media (min-width:900px){
  #view .jxwrap,#view .pf-wrap{
    min-height:calc(100vh - 120px);
    display:flex;flex-direction:column;justify-content:center}
}
.jxtete{display:flex;align-items:center;gap:12px;padding:0 0 14px;border-bottom:2px solid var(--noir);margin-bottom:18px}
.jxback{width:38px;height:38px;border-radius:50%;border:1.25px solid var(--trait);flex:none;
  display:flex;align-items:center;justify-content:center}
.jxback .ic{width:14px;height:14px}
.jxpic{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.jxpic .ic{width:24px;height:24px}
.jxtx{flex:1;min-width:0}
.jxtx b{display:block;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.jxtx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.jxpied{display:flex;gap:9px;margin-top:18px}
.jxrejouer{flex:1;background:var(--noir);color:#f2eee6;border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.jxautre{flex:1;border:1.25px solid var(--trait);border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
@media (hover:hover){ .jxrejouer:hover{filter:brightness(1.25)} .jxautre:hover{background:var(--noir);color:#f2eee6} }

/* L'ÉCRAN DE FIN, le même pour les huit jeux. Les erreurs portent un gros filet
   rouge à gauche : c'est un ÉTAT, pas une identité — le rouge des urgences reste
   réservé aux urgences, qui sont des cases pleines, pas des filets. */
.jxf{padding-top:2px}
.jxf-tete{background:var(--noir);border-radius:8px 8px 0 0;padding:16px 16px 18px;color:#f0efed}
.jxf-sur{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em}
.jxf-tete b{display:block;font-size:34px;font-weight:700;line-height:1;margin-top:6px;letter-spacing:-.03em}
.jxf-chif{display:flex;border:1px solid var(--ligne);border-top:0;border-radius:0 0 8px 8px;background:#f6f5f3}
.jxf-chif>div{flex:1;padding:14px 16px}
.jxf-chif>div+div{border-left:1px solid var(--ligne)}
.jxf-chif .g{display:block;font-size:32px;font-weight:700;line-height:1;letter-spacing:-.03em}
.jxf-chif em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.jxf-sect{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  border-bottom:2px solid var(--noir);padding-bottom:6px;margin:24px 0 12px}
.jxf-c{border:1px solid var(--ligne);border-left:5px solid var(--rouge);background:#f6f5f3;
  padding:12px;margin-bottom:10px}
.jxf-c.ok{border-left-color:#6cb392}
.jxf-q{font-size:14.5px;font-weight:500;line-height:1.35}
.jxf-tien{margin-top:10px;font-size:13px;color:#8b8984;text-decoration:line-through}
.jxf-bonne{margin-top:6px;font-size:13.5px;line-height:1.4;display:flex;gap:6px}
.jxf-bonne i{font-style:normal;color:#6cb392;flex:none}
.jxf-pq{margin-top:10px;border-top:1px solid var(--ligne);padding-top:9px;font-size:12.5px;
  color:#73716b;line-height:1.5}
.jxf-pq b{color:var(--noir);font-weight:600}
.jxf-fiche{margin-top:10px;width:100%;border:1px solid var(--trait);border-radius:4px;padding:8px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.jxf-plier{width:100%;border:1px solid var(--ligne);border-radius:4px;padding:11px;font-size:13px;color:#73716b}
.jxf-rat{width:100%;margin-top:22px;background:var(--noir);color:#f0efed;border-radius:8px;padding:15px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.jxf-rien,.jxf-vide{font-size:13.5px;color:#73716b;line-height:1.5;padding:4px 2px 0}
.jxf-vide{margin-top:20px;border:1px solid var(--ligne);background:#f6f5f3;padding:13px;border-radius:6px}
@media (hover:hover){ .jxf-fiche:hover{background:var(--noir);color:#f0efed} .jxf-rat:hover{filter:brightness(1.3)} }

/* La correction : verte quand c'est juste, rouge quand ça ne l'est pas. */
.qc{border-radius:8px;padding:15px;margin-top:14px;border:1.25px solid var(--trait);background:#fdfdfc}
.qc.ok{border-color:#2f8f5b;background:#eef7f1}
.qc.ko{border-color:var(--rouge);background:#fdeeed}
.qc-h{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:11px}
.qc.ok .qc-h{color:#2f8f5b} .qc.ko .qc-h{color:var(--rouge)}
.qc-rep{background:#fff;border:1px solid var(--ligne);border-radius:6px;padding:11px 12px}
.qc-lab{display:block;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984;margin-bottom:4px}
.qc-rep b{font-size:15.5px;font-weight:600;line-height:1.3}
.qc-txt{font-size:14px;line-height:1.5;color:#4a4844;margin:10px 0 0}
.qc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qc-chip{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(27,27,27,.07);border-radius:999px;padding:4px 9px;color:#4a4844}
.qc-btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:1.25px solid var(--trait);
  border-radius:6px;padding:10px 13px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:500;background:#fff}
.qc-btn .ic{width:15px;height:15px}
@media (hover:hover){ .qc-btn:hover{background:var(--noir);color:#f2eee6} }

/* LA CARTE QUI SE RETOURNE POUR DE VRAI : une vraie rotation dans l'espace,
   comme une carte qu'on tourne entre les doigts (Mag : « il faut un effet »). */
/* Format d'une VRAIE carte à jouer : 5/7, comme un jeu de 54 (Mag, 08/08/2026).
   La largeur est bridée, sinon la carte s'étire avec l'écran et redevient un
   bandeau — c'est ce qui se passait sur ordinateur, où elle faisait 560 px de
   large pour 210 de haut. */
.jx-flip{perspective:1200px;margin:0 auto;cursor:pointer;max-width:330px;width:100%}
.jx-flip-in{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,1.1,.4,1)}
.jx-flip.on .jx-flip-in{transform:rotateY(180deg)}
.jx-flip .jx-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;padding:22px 22px 62px;display:flex;flex-direction:column;justify-content:flex-end;
  color:#f2eee6;box-shadow:0 6px 20px rgba(27,27,27,.16);overflow:hidden}
/* LE BANDEAU QUI DIT DE RETOURNER (choix « 4 » de Mag, 08/08/2026 : « on ne voit
   pas qu'on doit la retourner »). Une barre qui ressemble à un bouton et qui dit
   le mot — aucune ambiguïté, même pour quelqu'un qui n'a jamais joué.
   ⚠ Le fond est TRANSLUCIDE et non noir : sur le dos, qui est déjà noir, un
   bandeau noir aurait disparu. C'est le filet crème du haut qui le détache dans
   les deux cas. */
.jx-flip .jx-bandeau{position:absolute;left:0;right:0;bottom:0;height:46px;
  background:rgba(27,27,27,.28);border-top:1.5px solid rgba(242,238,230,.45);
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#f2eee6}
.jx-flip .jx-bandeau svg{width:15px;height:15px;flex:none}
.jx-flip .jx-face.dos{transform:rotateY(180deg);background:var(--noir)}
.jx-flip .jx-face small{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.7}
.jx-flip .jx-face b{font-size:21px;font-weight:700;line-height:1.2;margin-top:10px}
.jx-flip .jx-face em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:14px}

/* ═══ LA PAGE ACTIVITÉS — trois boutons, l'encart WAKA, le panneau qui monte ═══
   (Mag, 12-13/08/2026. Couleurs : sa palette validée uniquement. Pictos : les siens,
   en grand — « les icônes plus grands, on ne voit rien ».) */
/* ⚠ LA PAGE NE S'ÉTALE PLUS (Mag, 13/08/2026 : « tu peux réduire plus petit, ce n'est
   pas très joli… au moins qu'il s'aligne sur l'encart WAKA, c'est un peu trop long en
   largeur »). Sur un grand écran, les blocs prenaient toute la largeur de la fenêtre :
   des boutons de 60 cm de large pour trois mots. Ils sont bornés et centrés — la page
   garde la même colonne du haut en bas, comme sur un téléphone. */
.acttrois,.actwaka{max-width:560px;margin-left:auto;margin-right:auto}
.acttrois{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media (min-width:640px){ .acttrois{grid-template-columns:repeat(4,1fr)} }
.actb3{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--trait-fort);
  border-radius:14px;background:#fff;color:var(--noir);padding:13px 6px 11px;text-align:center;
