<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COUSIN — Outil d'équipe · Bruxelles</title>
<!-- C'EST L'APP EN LIGNE depuis le 06/08/2026 (c'était lux.html).
     L'ancienne, branchée à Supabase, est intacte dans app-classique.html. -->
<meta name="theme-color" content="#f0efed">
<!-- L'app est en clair : sans ça, Android/Chrome force son mode sombre et
     retourne toutes les couleurs (fond crème → gris foncé). -->
<meta name="color-scheme" content="light only">
<link rel="icon" href="favicon.svg">
<!-- La connexion de l'équipe (Google via Supabase), reprise de app-classique.html. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="qrcode.js"></script>
<style>
/* ============================================================
   COUSIN · Lux — langage « GRILLE » (validé le 06/08/2026) :
   crème, grille encadrée à traits fins avec marges, libellés
   machine à pastille de couleur, gros pictos noirs centrés,
   la case touchée s'inverse en noir. Bandeau Urgences noir à
   sirène rouge. Couleur là où elle guide : urgences, quotidien,
   fiche. Titre original intact, dock à ronds noirs.
   ============================================================ */
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-medium.woff2') format('woff2');font-weight:500;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-demibold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman Grotesque';src:url('font/eastman-grotesque-heavy.woff2') format('woff2');font-weight:900;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}

:root{
  color-scheme:light only;
  --creme:#f0efed; --noir:#1b1b1b; --enc2:#73716b; --ligne:#d6d4d0;
  --rouge:#e63329; --danger:#e63329; --jaune:#f5c542;
  --pad:16px;
  --tab-h:calc(88px + env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* LA MAIN SUR TOUT CE QUI SE CLIQUE (Mag, 08/08/2026 : « je veux qu'il y ait la
   main sur tous les boutons de ce site, j'aime pas quand il y a que le pointeur »).
   Les boutons du navigateur n'ont PAS la main par défaut — chaque bloc de l'app
   devait la redemander, et un oubli suffisait à la perdre. Posée une fois pour
   toutes ici, y compris sur les fausses cartes cliquables (role="button") et les
   cases à cocher. Sauf ce qui est désactivé : là, la flèche est la bonne réponse. */
button,summary,label,select,[role="button"],[onclick],a[href],input[type=checkbox],input[type=radio]{cursor:pointer}
button:disabled,[aria-disabled="true"],.dort,.disabled{cursor:default}
body{font-family:'Eastman',-apple-system,'Segoe UI',sans-serif;background:var(--creme);color:var(--noir);
  font-size:16px;line-height:1.45;padding-bottom:var(--tab-h);
  padding-top:calc(68px + env(safe-area-inset-top))}
body.no-tabs{padding-bottom:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- L'ÉCRAN DE CONNEXION (réservé à l'équipe) ----------
   Repris tel quel de l'app actuelle — son arc-en-ciel, son « BIENVENUE SUR », son
   logo — recalé sur le langage « grille » (crème, noir, angles de 6px). */
.auth-gate{position:fixed;inset:0;z-index:9999;background:var(--creme);color:var(--noir);
  display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.auth-gate.off{display:none}
.auth-box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.auth-arc{width:67%;height:auto;display:block;margin:0 auto}
/* « BIENVENUE » débordait largement de l'arc-en-ciel (Mag, 08/08/2026). Il est calé
   sur sa largeur : l'arc fait 67 % de la boîte, le mot doit tenir dans le même geste. */
.auth-bienvenue{font-family:'Eastman',sans-serif;font-size:min(11.2vw,45px);font-weight:700;
  line-height:.86;letter-spacing:-.035em;text-transform:uppercase;margin:14px 0 0;white-space:nowrap}
.auth-logo-img{width:27%;max-width:100px;height:auto;margin-top:16px}
.auth-loading{color:var(--enc2);font-size:14px;margin-top:40px}
.auth-google{margin-top:46px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  background:var(--noir);color:var(--creme);border:0;border-radius:6px;padding:17px 22px;font-size:15.5px;
  font-weight:500;transition:transform .16s cubic-bezier(.22,1,.36,1)}
.auth-google:active{transform:scale(.97)}
.auth-msg{margin-top:26px;color:#4a4844;font-size:14px;line-height:1.55;max-width:320px;white-space:pre-line}
.auth-mot{width:100%;margin-top:16px;border:1.5px solid var(--noir);border-radius:6px;padding:12px 14px;
  font:inherit;font-size:14px;background:#fdfdfc;color:var(--noir);resize:none}
.auth-mot:focus{outline:none}
.auth-switch{margin-top:18px;background:none;border:0;font-size:14px;font-weight:500;text-decoration:underline}
h1,h2,h3{font-weight:700;line-height:1.2}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:#6b6965}
.monoS{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8b8984}
::selection{background:#f3c6da}

/* ═══════════════════════════════════════════════════════════════════════
   LA FEUILLE IMPRIMÉE (08/08/2026). Une page de COUSIN doit pouvoir sortir sur
   papier : une liste de fiches qu'on emporte en visite, la liste du jour qu'on
   coche au stylo, le programme du mois qu'on affiche au mur.

   Le principe : tout ce qui sert à NAVIGUER disparaît (la barre, le dock, l'étoile,
   les flèches, les boutons), tout ce qui sert à LIRE reste. Et la feuille porte son
   titre et sa date — sans quoi, trois semaines plus tard, on ne sait plus si elle
   est à jour.
   ═══════════════════════════════════════════════════════════════════════ */
#printHead{display:none}
@media print{
  @page{ margin:14mm; }
  /* Les aplats de couleur sont gardés : ils PORTENT l'information (le bloc rouge d'un
     cours, la couleur d'un domaine). Sans ça le navigateur les efface tous. */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  html,body{ background:#fff !important; padding:0 !important; margin:0 !important; height:auto !important }
  /* Ce qui sert à naviguer s'en va. */
  #topbar,#tabbar,#starbtn,#neufbtn,.bascule,.imprbtn,.jxpied,.jxback,.cbtn,.hero .cbtn,
  .quiz-next,.acform,.cal-fl,.cal-sup,.fboutons,.fbtn,.chv,.sg,#popBg,#toast,
  .jrat,.jgrille,.pgn,.rail2{ display:none !important }
  #printHead{ display:flex !important; align-items:baseline; gap:14px;
    border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:16px }
  #printHead .ph-t{ font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:-.01em }
  #printHead .ph-d{ margin-left:auto; font-family:ui-monospace,monospace; font-size:10px; color:#444 }
  #view{ width:100% !important; max-width:100% !important; padding:0 !important }
  /* Rien ne se coupe au milieu d'une fiche, d'une tâche ou d'un cas. */
  .frow2,.fmod,.tache,.cal-e,.cc-cas,.cc-err,.rc,.fcarte{ break-inside:avoid; page-break-inside:avoid }
  /* Les listes de fiches : on serre, on garde le trait de gauche. */
  .frow2{ border:0 !important; border-bottom:1px solid #ccc !important; border-radius:0 !important;
    padding:6px 0 !important; background:none !important }
  .flist{ padding:0 !important }
  /* Une case à cocher imprimée est une case VIDE : c'est au stylo qu'on la remplit. */
  .tache .box,.pf-box,.ch-box{ border:1.5px solid #000 !important; background:none !important; border-radius:2px !important }
  .tache .box svg,.tache .box .pico,.pf-box svg,.pf-box .pico{ display:none !important }
  /* Le détail d'un cours s'imprime en entier, même replié à l'écran. */
  .cdet[open],.cdet{ border-top:1px solid #000 !important }
  .cdet .rich{ display:block !important }
  details>div{ display:block !important }
  /* Le calendrier tient sur la page. */
  #view .cal{ max-width:100% !important }
  .cal-c{ border-color:#bbb !important }
}
/* Le bouton, à l'écran seulement. */
.imprbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ligne);border-radius:5px;
  padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:#73716b;background:#fdfdfc}
.imprbtn svg,.imprbtn .pico{width:13px;height:13px}
@media (hover:hover){ .imprbtn:hover{border-color:var(--noir);color:var(--noir)} }
.imprligne{display:flex;justify-content:flex-end;margin:14px 0 2px;max-width:620px}

/* ── EXPORT / IMPORT DU CATALOGUE (08/08/2026) ── */
.expg{display:flex;flex-direction:column;gap:8px;max-width:620px}
.expb{border:1.5px solid var(--noir);border-radius:8px;padding:13px;background:#fdfdfc;text-align:center;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.expb.danger{border-color:var(--rouge);color:var(--rouge)}
@media (hover:hover){ .expb:hover{background:var(--noir);color:#f0efed}
  .expb.danger:hover{background:var(--rouge);color:#fff;border-color:var(--rouge)} }

/* ── PARTAGER COUSIN (08/08/2026) ── */
#view .pt{max-width:620px;padding-top:18px}
.pt-qr{background:#fdfdfc;border:1.5px solid var(--noir);border-radius:12px;padding:20px;
  display:flex;justify-content:center}
.pt-url{font-family:ui-monospace,monospace;font-size:13px;letter-spacing:.04em;text-align:center;
  margin-top:12px;word-break:break-all}
.pt-b{display:flex;gap:8px;margin-top:14px}
.pt-c{flex:1;background:var(--noir);color:#f0efed;border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.pt-c.clair{background:none;border:1.5px solid var(--noir);color:var(--noir)}
@media (hover:hover){ .pt-c:hover{filter:brightness(1.3)} .pt-c.clair:hover{background:var(--noir);color:#f0efed} }

/* ── LE DICTIONNAIRE (08/08/2026) ── */
#view .lex{max-width:620px;padding-top:14px}
.lx{border-bottom:1px solid var(--ligne);padding:12px 0}
.lx summary{cursor:pointer;list-style:none;display:block}
.lx summary::-webkit-details-marker{display:none}
.lx summary b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.lx summary span{display:block;font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:3px}
.lx summary::after{content:'▾';float:right;margin-top:-38px;color:#8b8984;font-size:13px}
.lx[open] summary::after{content:'▴'}
.lx p{font-size:13px;color:#73716b;line-height:1.55;margin-top:9px;padding-left:11px;
  border-left:2px solid var(--ligne)}

/* ── ÉDUC (08/08/2026) ── */
#view .ed-g{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:14px;max-width:620px}
.ed-c{background:#fdfdfc;border:1.5px solid var(--noir);border-radius:9px;padding:13px;text-align:left;
  display:flex;flex-direction:column;min-height:96px}
.ed-c .ic{width:26px;height:26px}
.ed-c b{display:block;font-size:15px;font-weight:600;margin-top:auto;line-height:1.2}
.ed-c em{font-style:normal;display:block;font-size:12px;color:#73716b;line-height:1.35;margin-top:3px}
.ed-p{border:1px solid var(--ligne);border-left:5px solid var(--ligne);background:#fdfdfc;
  border-radius:0 8px 8px 0;padding:14px;margin-bottom:11px;max-width:620px}
.ed-p>b{display:block;font-size:16.5px;font-weight:700;line-height:1.2;margin-bottom:10px}
.ed-l{font-size:13.5px;color:#3c3a36;line-height:1.5;margin-top:9px}
.ed-l i{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-bottom:2px}
.ed-l.ev{background:#f6f5f3;border-radius:6px;padding:9px 11px}
@media (hover:hover){ .ed-c:hover{background:var(--noir);color:#f0efed} .ed-c:hover em{color:rgba(240,239,237,.7)} }

/* ── LES SCHÉMAS À DONNER (08/08/2026) ── */
#view .sch{max-width:620px}
.sch-q{margin-top:20px}
.sch-q.fait{opacity:.65}
.sch-qt{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}
.sch-qt i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--noir);
  color:#f0efed;display:flex;align-items:center;justify-content:center;font-size:12px}
.sch-o{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-left:34px}
.sch-b{border:1.5px solid var(--noir);border-radius:20px;padding:8px 14px;font-size:13.5px;background:#fdfdfc}
.sch-b.on{background:var(--noir);color:#f0efed}
.sch-lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.sch-lg button{border:1px solid var(--ligne);border-radius:18px;padding:7px 13px;font-size:12.5px;background:#fdfdfc}
.sch-lg button.on{background:var(--noir);color:#f0efed;border-color:var(--noir)}
/* LA FEUILLE — identique à l'écran et sur le papier, pour qu'il n'y ait pas de surprise. */
.sch-f{border:1px solid var(--ligne);background:#fdfdfc;border-radius:8px;padding:16px;margin-top:14px}
.sch-f.rtl{direction:rtl;text-align:right}
.sch-ft{border-bottom:3px solid;padding-bottom:9px;margin-bottom:14px}
.sch-ft b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sch-ft em{font-style:normal;display:block;font-size:13px;color:#73716b;margin-top:3px}
.sch-e{display:flex;gap:11px;margin-bottom:12px}
.sch-f.rtl .sch-e{flex-direction:row-reverse}
.sch-e i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;color:#1b1b1b;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.sch-e b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.sch-e em{font-style:normal;display:block;font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:3px}
.sch-mt{border:1px solid var(--ligne);background:#f6f5f3;border-radius:6px;padding:11px 13px;margin-top:14px}
.sch-mt b{display:block;font-size:14.5px;font-weight:700}
.sch-mt em{font-style:normal;display:block;font-size:13px;color:#3c3a36;line-height:1.45;margin-top:4px}
.sch-a{border-left:4px solid var(--rouge);background:#fdf4f3;padding:10px 12px;margin-top:12px;
  font-size:13px;color:#3c3a36;line-height:1.45}
.sch-f.rtl .sch-a{border-left:0;border-right:4px solid var(--rouge)}
.sch-tr{font-size:11.5px;color:#8b8984;line-height:1.45;margin-top:11px;padding-top:9px;border-top:1px solid var(--ligne)}
.sch-act{display:flex;gap:8px;margin-top:16px}
.sch-impr{flex:2;background:var(--noir);color:#f0efed;border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sch-rel{flex:1;border:1.5px solid var(--noir);border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.sch-rec{flex:1;border:1.5px solid var(--ligne);border-radius:8px;padding:14px;color:#73716b;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
/* Sur le papier : pas de cadre ni de fond, la feuille EST la page. */
.sch-f.papier{border:0;background:none;border-radius:0;padding:0;margin:0}
.sch-f.papier .sch-ft b{font-size:25px}
.sch-f.papier .sch-e{margin-bottom:15px}

/* ── LA CARTE DE QUESTION (08/08/2026) ── */
/* La carte s'ajuste au contenu. Avant elle s'étirait sur toute la hauteur de l'écran
   et laissait un trou entre la question et les réponses. Elle garde un minimum pour
   ne pas sauter d'une question à l'autre, mais elle ne se force plus. */
.qz{background:#1b1b1b;border-radius:12px;padding:20px 18px 18px;color:#f0efed;
  min-height:340px;max-width:620px;display:flex;flex-direction:column}
.qz-tete{display:flex;align-items:center}
.qz-dots{display:flex;gap:6px;align-items:center}
.qz-dots i{width:9px;height:9px;border-radius:50%;background:#3d3d3d;flex:none}
.qz-dots i.ok{background:#6FC7D9}
.qz-dots i.ko{background:#E8308A}
.qz-dots i.ici{width:11px;height:11px;background:#f0efed}
/* La barre de progression : ce qui est juste en bleu, ce qui est raté en fuchsia,
   le reste en creux. On lit sa partie d'un coup d'œil sans compter des ronds. */
.qz-barre{flex:1;height:5px;border-radius:3px;background:#3d3d3d;overflow:hidden;display:flex;max-width:180px}
.qz-barre i{display:block;height:100%}
.qz-barre i.ok{background:#6FC7D9}
.qz-barre i.ko{background:#E8308A}
.qz-sc{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:#9a9894;margin-left:10px}
.qz-n{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:#F5D34F}
.qz-sur{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#9a9894;margin-top:14px}
.qz-q{font-size:25px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin-top:12px}
.qz-q.petite{font-size:20px}
/* Les réponses sont ANCRÉES EN BAS : la question grandit vers le haut, le pouce les
   retrouve toujours au même endroit. */
.qz-opts{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:9px}
.qz-opt{display:flex;align-items:center;gap:12px;background:none;border:1.5px solid #4a4a4a;
  border-radius:10px;padding:13px 14px;color:#f0efed;text-align:left;width:100%}
.qz-l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #6a6a6a;
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px}
.qz-t{font-size:15px;font-weight:500;line-height:1.3}
.qz-opt.bon{background:#6FC7D9;border-color:#6FC7D9;color:#1b1b1b}
.qz-opt.bon .qz-l{background:#1b1b1b;color:#6FC7D9;border-color:#1b1b1b}
.qz-opt.rate{border-color:#E8308A;color:#E8308A}
.qz-opt.rate .qz-l{border-color:#E8308A}
.qz-pq{border-left:4px solid #F5D34F;background:#262626;border-radius:0 8px 8px 0;
  padding:12px 13px;margin-top:16px}
.qz-pql{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#F5D34F}
.qz-pqt{font-size:13.5px;color:#d8d6d2;line-height:1.5;margin-top:5px}
.qz-fiche{margin-top:11px;width:100%;border:1px solid #4a4a4a;border-radius:7px;padding:9px;
  color:#f0efed;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.qz-suite{width:100%;background:#F5D34F;color:#1b1b1b;border:0;border-radius:10px;padding:14px;
  margin-top:12px;font-size:15px;font-weight:500}
@media (hover:hover){ .qz-opt:hover{border-color:#f0efed} .qz-fiche:hover{background:#333} }

/* ── L'ACCUEIL DU 08/08/2026 : météo réduite, rail du réseau, bande noire des jeux ── */
.meteoL{display:inline-flex;align-items:center;gap:5px;margin-left:auto;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;color:#73716b}
/* Le picto météo porte un width:100% en style en ligne : sans !important il gonfle
   et fait 170 px de haut dans la ligne de date. */
.meteoL svg,.meteoL .pico{width:14px!important;height:14px!important;flex:none}
.meteoL b{font-weight:600;color:var(--noir)}
.meteoL em{font-style:normal}
.meteoL.alerte b,.meteoL.alerte em{color:var(--rouge)}
.hdate{display:flex;align-items:center;gap:10px}

/* Les raccourcis vers ses domaines : un rail qui glisse, jamais plus d'une ligne. */
/* Le bloc du réseau, dans son cadre lui aussi : titre souligné, pastilles dessous. */
.rres-boite{border:1.5px solid var(--noir);border-radius:12px;padding:14px 15px 15px;margin-top:24px;background:#fdfdfc}
.rres-t{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir);font-weight:400;
  padding-bottom:8px;border-bottom:1.5px solid var(--noir);margin-bottom:12px}
.rres{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.rres::-webkit-scrollbar{display:none}
.rpast{flex:none;display:inline-flex;align-items:center;gap:7px;background:#fdfdfc;
  border:1.5px solid var(--noir);border-radius:20px;padding:7px 13px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;font-weight:400;color:var(--noir)}
.rpast i{width:11px;height:11px;flex:none}
@media (hover:hover){ .rpast:hover{background:var(--noir);color:#f0efed} }

/* LES JEUX DANS LEUR CARTE. On avait d'abord fait une bande pleine largeur pour bien
   séparer — Mag préfère un cadre avec de l'air autour, plus aéré. La séparation tient
   alors au fond noir et à la marge, pas au débord. */
.zjeux{background:#161616;color:#f0efed;margin:26px 0 0;padding:17px 16px 20px;border-radius:12px;max-width:620px}
/* Les blocs de l'accueil gardent une largeur de lecture sur grand écran : étirés sur
   1200 px, ils étaient à moitié vides et illisibles (Mag, 08/08/2026). */
/* ⚠ LE HAUT DE L'ACCUEIL RESTE EN LARGE (Mag, 08/08/2026 : « ça sur l'écran, tu
   peux le laisser en large »). Le bonjour, la date, la météo et le filet
   « À faire aujourd'hui » prennent toute la largeur — c'est un titre de page, il
   n'a pas besoin d'une largeur de lecture. Seuls les BLOCS de contenu sont bridés,
   parce qu'eux deviennent illisibles étirés sur 1200 px. */
#view .boules,#view .rres-boite{max-width:620px}
/* ── ET ILS SE CENTRENT (Mag, 08/08/2026 : « sur écran refais le responsive, recentre »).
   On leur avait donné une largeur de lecture sans jamais leur dire où se mettre : ils
   restaient donc collés à GAUCHE d'une vue de 1200 px, avec un demi-écran de vide à
   droite. Les grilles du Réseau et du Centre, elles, se servent vraiment de toute la
   largeur — on ne touche donc qu'à ce qui est bridé à 620 px. */
/* ══ L'ACCUEIL EN DEUX COLONNES SUR GRAND ÉCRAN (Mag, 08/08/2026 : « la mise en
   page de l'accueil, ça pète tout le responsive, t'as affaire de colonnes ») ══
   Le tort était de garder une seule colonne de 620 px collée à gauche : sur 1500 px,
   ça laissait la moitié de l'écran vide. Le bandeau reste en large, comme elle l'a
   demandé, et le contenu se répartit en dessous — le travail du jour et les listes à
   gauche, la bande noire des jeux à droite, qui tient toute la hauteur.
   `align-items:start` : sans lui, chaque bloc s'étirerait pour remplir sa rangée. */
@media (min-width:1000px){
  #view .home-top{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    column-gap:34px;align-items:start}
  #view .home-top > .hdate,
  #view .home-top > .hbonj{grid-column:1 / -1}
  /* La pile est plus compacte dans sa colonne : à l'arrivée sur l'accueil, la bande
     des jeux dépassait de 90 px sous le bas de l'écran et se retrouvait coupée
     (Mag, 08/08/2026). Elle tient maintenant en entier. */
  #view .home-top > .zjeux .pile{max-width:250px;margin:20px auto 0}
  #view .home-top > .zjeux .pilenav{margin-top:8px}
  /* La bande des jeux va à droite et y reste, quelle que soit sa hauteur.
     ⚠ Il faut annuler ici le max-width et les marges automatiques posés plus bas
     pour le centrage : sans ça, elle se retrouvait à 248 px, perdue au milieu de
     sa colonne. Dans une grille, un bloc doit remplir sa colonne. */
  #view .home-top > .zjeux{grid-column:2;grid-row:3 / span 40;position:sticky;top:16px;
    width:100%;max-width:none;margin:0}
  /* Tout le reste s'empile dans la colonne de gauche, dans l'ordre du HTML. */
  #view .home-top > .sect,
  #view .home-top > .boules,
  #view .home-top > .rres-boite,
  #view .home-top > .rail2,
  #view .home-top > .lienbas,
  #view .home-top > .qneuf{grid-column:1;max-width:none}
  #view .boules{max-width:none}
}
@media (min-width:900px){
  #view .zjeux, #view .rres-boite,
  #view .lienbas, #view .pt, #view .lex, #view .ed-g, #view .sch, #view .qneuf,
  #view .cal, #view .acform, #view .cc, #view .cdet, #view .rich,
  #view .imprligne, #view .expg, #view .f-page, #view .quiz-card
  { margin-left:auto; margin-right:auto; }
}
.zj-t{font-size:22px;font-weight:500;letter-spacing:-.02em}
.zj-chif{display:flex;gap:8px;margin-top:14px}
.zj-chif span{flex:1;background:#262626;border-radius:8px;padding:10px 11px}
.zj-chif b{display:block;font-size:21px;font-weight:500;line-height:1;color:#F5D34F}
.zj-chif span:nth-child(2) b{color:#6FC7D9}
.zj-chif span:nth-child(3) b{color:#E8308A}
.zj-chif em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;color:#9a9894;margin-top:4px}
/* Une carte de jeu NOIRE sur la bande NOIRE disparaît. Dans la bande, les cartes
   sombres reçoivent donc un filet clair — la couleur reste la leur, on les voit. */
/* Les cartes penchées mordent vers le haut : il leur faut plus d'air que d'habitude,
   sinon la première recouvre les chiffres. */
.zjeux .pile{margin:34px auto 0}
/* Filet plus épais et plus franc : sur la bande noire, un liseré de 1,5 px se
   perdait (Mag : « il faut mettre un plus gros bord blanc »). */
.zjeux .pcarte{box-shadow:0 0 0 3.5px #f0efed}
.zjeux .p1,.zjeux .p2{box-shadow:0 0 0 2px rgba(240,239,237,.6)}
/* Le dé « au hasard » sur fond noir : cercle et picto bien clairs, sinon il disparaît. */
.zjeux .pile .tirer .rd{border-color:rgba(240,239,237,.75)}
.zjeux .pile .tirer .rd .ic{color:#f0efed}
.zjeux .pile .tirer span{color:rgba(240,239,237,.75)}
.zj-pied{display:flex;gap:8px;margin-top:16px}
.zj-b{flex:1;border:1px solid #4a4a4a;border-radius:8px;padding:11px;color:#f0efed;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.zj-b.plein{background:#E8308A;border-color:#E8308A;color:#fff;font-weight:600}
@media (hover:hover){ .zj-b:hover{border-color:#f0efed} }

/* LE CALENDRIER DU MOIS. Une grille se lit d'un coup d'œil : c'est sa raison d'être,
   donc les cases restent carrées et les points de couleur disent ce qui tombe ce jour-là. */
/* La carte qui presse : filet jaune à gauche, rien de plus — c'est un rappel, pas
   une alerte. Le rouge reste aux urgences. */
.qcarte.urgent{border-left:5px solid #f5c542}
#view .qneuf{max-width:620px;padding-top:16px}
#view .qneuf .sectl{margin-top:22px}
#view .qneuf .msg{margin-bottom:9px;font-size:14.5px;line-height:1.5}
#view .cal{max-width:620px;margin:16px 0 6px}
.cal-tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-tete span{flex:1;text-align:center;font-size:16px;font-weight:600;text-transform:capitalize}
.cal-fl{width:36px;height:36px;flex:none;border:1.5px solid var(--noir);border-radius:6px;
  display:flex;align-items:center;justify-content:center}
.cal-fl .ic,.cal-fl svg,.cal-fl .pico{width:13px;height:13px}
.cal-fl.droite{transform:rotate(180deg)}
.cal-j{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-j span{text-align:center;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:#8b8984}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-c{aspect-ratio:1;border:1px solid var(--ligne);border-radius:5px;background:#fdfdfc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal-c.hors{border-color:transparent;background:transparent}
.cal-n{font-size:13.5px;font-weight:500;line-height:1}
.cal-c.hors .cal-n{opacity:0}
.cal-c.auj{border:2px solid var(--noir)}
.cal-c.choisi{background:var(--noir);color:#f0efed;border-color:var(--noir)}
.cal-pts{display:flex;gap:2px;height:5px}
.cal-pts i{width:5px;height:5px;border-radius:50%}
.cal-jour{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  margin:16px 0 9px;padding-bottom:7px;border-bottom:2px solid var(--noir)}
.cal-e{border:1px solid var(--ligne);border-left:5px solid var(--ligne);background:#fdfdfc;
  border-radius:0 6px 6px 0;padding:11px 13px;margin-bottom:8px}
.cal-e b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.cal-e em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.cal-e p{font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:5px}
.cal-e p.insc{color:#73716b;font-size:12.5px}
.cal-sup{margin-top:9px;border:1px solid var(--ligne);border-radius:4px;padding:6px 10px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#73716b}
.cal-vide{font-size:13.5px;color:#73716b;padding:2px 2px 6px}
/* Le formulaire : replié, parce qu'on lit le programme cent fois pour l'écrire une. */
#view .acform{max-width:620px;margin-top:16px;border:1px solid var(--ligne);border-radius:6px;background:#f6f5f3;padding:12px 13px}
.acform summary{cursor:pointer;list-style:none;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center}
.acform summary::-webkit-details-marker{display:none}
.acform summary::after{content:'+';margin-left:auto;font-size:17px;line-height:1}
.acform[open] summary::after{content:'–'}
.acg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acg input{border:1px solid var(--ligne);border-radius:5px;padding:11px 12px;font-size:14.5px;
  background:#fdfdfc;color:var(--noir);font-family:inherit;width:100%}
.acduo{display:flex;gap:8px}
.acok{background:var(--noir);color:#f0efed;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.achint{font-size:12.5px;color:#73716b;line-height:1.5}
@media (hover:hover){ .cal-c:not(.hors):hover{border-color:var(--noir)} .cal-sup:hover{border-color:var(--rouge);color:var(--rouge)} }

/* LE SCHÉMA EN TÊTE DE COURS. Bridé en largeur : Mag a trouvé la pleine largeur
   « beaucoup trop large » sur écran — un texte qui court sur 1200 px ne se lit pas. */
#view .cc{max-width:620px;margin:0 0 4px}
.cc-sur{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:#8b8984}
.cc-t{font-size:23px;font-weight:700;letter-spacing:-.028em;line-height:1.08;margin:6px 0 4px}
.cc-s{font-size:14px;color:#73716b;line-height:1.5;margin-bottom:15px}
.cc-q{background:var(--noir);color:#f0efed;border-radius:6px;padding:12px 14px;
  font-size:15px;font-weight:500;margin-bottom:11px}
.cc-cas{display:flex;gap:10px;margin-bottom:9px}
.cc-bar{flex:none;width:9px;border-radius:5px;display:flex;align-items:flex-start;justify-content:center}
.cc-bar i{font-style:normal;position:absolute;margin-left:-1px}
.cc-tx{flex:1;background:#fdfdfc;border:1px solid var(--ligne);border-radius:6px;padding:11px 13px;min-width:0}
/* > : seul le TITRE du cas passe en bloc. Sans ça, chaque gras du texte
   partait à la ligne tout seul. */
.cc-tx>b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.cc-tx>span{display:block;font-size:13.5px;color:#3c3a36;line-height:1.5;margin-top:3px}
/* LE SEUL BLOC ROUGE DU COURS. Il est rare, c'est ce qui lui donne sa force. */
.cc-err{background:var(--rouge);color:#fff;border-radius:6px;padding:13px 14px;margin-top:15px;
  font-size:14px;line-height:1.5}
.cc-err .l{display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.85;margin-bottom:5px}
.cc-err b{font-weight:600}
.cc-n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8b8984;margin-top:14px}
/* Le détail : présent, mais replié — il ne disparaît pas. */
#view .cdet{max-width:620px;margin-top:16px;border-top:2px solid var(--noir);padding-top:12px}
.cdet summary{cursor:pointer;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:8px}
.cdet summary::-webkit-details-marker{display:none}
.cdet summary::after{content:'▾';margin-left:auto;font-size:13px;color:#8b8984}
.cdet[open] summary::after{content:'▴'}
.cdet .rich{margin-top:14px}
@media (min-width:900px){ .rich{max-width:620px} }

/* DANS LE CORPS D'UNE FORMATION (.rich), le texte est écrit à la main : un picto y
   arrive parfois sans sa boîte `.ic`, et un <svg> sans dimension prend alors TOUTE la
   largeur disponible — d'où les pictos géants (Mag, 07/08/2026). On leur impose la
   taille d'un mot, quel que soit l'endroit où ils sont posés. */
.rich svg,.rich .pico,.rich img.picoc{width:22px!important;height:22px!important;flex:none;vertical-align:-4px}
.rich .ic{width:22px;height:22px}
.pico{display:inline-block;width:24px;height:24px;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;vertical-align:middle}
img.picoc{width:24px;height:24px;object-fit:contain;background:none}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px}
.ic svg,.ic .pico,.ic img{width:100%!important;height:100%!important}

#view{max-width:1080px;margin:0 auto;padding:0 var(--pad);animation:vin .22s ease}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- accueil : logo + titre original ---- */
.home-top{padding-top:14px}
.lgo{height:26px;display:block;margin-bottom:14px}
.home-title{font-family:'Eastman',sans-serif;font-size:min(11.8vw,47px);font-weight:700;text-transform:uppercase;
  text-align:left;color:var(--noir);letter-spacing:-.04em;line-height:.803em;margin:0 2px 18px;
  display:flex;flex-direction:column;gap:1px}
.home-title .tl{display:block}
.home-title .pico,.home-title .deco,.home-title .tdo{display:inline-block;vertical-align:baseline}
.tdo{position:relative;width:.66em;height:.66em;margin:0 .02em .025em .07em}
.tdo::before{content:'';position:absolute;inset:0;background:#f8763f;
  -webkit-mask:url('picto/ico-donut.svg') center/contain no-repeat;mask:url('picto/ico-donut.svg') center/contain no-repeat}
.tdo::after{content:'';position:absolute;left:50%;top:50%;width:12%;height:12%;
  transform:translate(-50%,-50%);border-radius:50%;background:#1b1b1b}
.deco-disq{width:.55em;height:.55em;margin-left:.09em;margin-bottom:.10em;color:#6cb392}
.deco-arc{width:1.06em;height:.55em;margin-left:.11em;margin-bottom:.08em}
.deco-fleur{width:.82em;height:.82em;margin-left:.09em;margin-bottom:-.12em;color:#fd8fd0}
.home-title .tl.last{display:flex;align-items:center}
.home-title .tl-txt{flex:0 0 auto}
.sqbtn{display:inline-flex;align-items:center;justify-content:center;width:.88em;height:.88em;
  border:1.5px solid var(--noir);margin-left:.16em;flex:0 0 auto;transition:transform .15s ease}
.sqbtn:active{transform:scale(1.12)}
.sqbtn .ic{width:.44em;height:.44em}
.sqdot{position:absolute;top:-.09em;right:-.09em;width:.18em;height:.18em;border-radius:50%;
  background:var(--rouge);border:2px solid var(--creme)}

/* ---- bandeau Urgences : noir, sirène rouge ---- */
.urg-banner{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--noir);padding:15px 16px;color:#f4f3f1;margin-bottom:14px;transition:transform .1s ease}
.urg-banner:active{transform:scale(.99)}
.urg-banner .rond{width:30px;height:30px;background:transparent;border-radius:0;flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--rouge)}
.urg-banner .rond .ic{width:26px;height:26px}
.urg-banner b{display:block;font-size:16px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.urg-banner small{font-size:12.5px;color:rgba(242,238,230,.85)}
.urg-banner .chev{margin-left:auto;font-size:20px;opacity:.8;line-height:1}
.hint{font-size:13.5px;color:var(--enc2)}

/* ---- le grand damier de l'accueil (choix 4) ---- */
.hgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ligne);margin-bottom:0}
.hc{border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne);background:transparent;
  text-align:left;padding:12px;display:flex;flex-direction:column;transition:background .12s ease}
.hc:nth-child(2n){border-right:0}
/* L'accueil : on garde l'inversion (fond noir + texte crème), elle est cohérente
   ici puisque les pictos y sont déjà en couleur vive. */
.hc:active{background:var(--noir)}
.hc:active *{color:#f4f3f1!important}
.hc:active .pico{background:#f4f3f1!important}
@media (hover:hover){.hc:hover{background:rgba(27,27,27,.04)}.hc.noir:hover{background:#2a2a2a}}
.hc.t2{min-height:132px}
.hc.w{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:0;padding:13px 12px;border-right:0}
.hc.s{flex-direction:row;align-items:center;gap:9px;min-height:0;padding:11px 12px}
.hc .lab{font-family:ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.hc .sub{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:3px}
.hc .hpi{margin:auto auto 0;align-self:flex-end}
.hc.noir{background:var(--noir)}
.hc.noir .lab{color:#f4f3f1}
.hc.noir .sub{color:rgba(244,243,241,.6)}
.hc.noir:active{background:#333}

/* ---- le quotidien : deux demi-cases encadrées ---- */
.tstrip{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ligne);border-bottom:0;overflow:visible;margin:0}
.tpill{display:flex;align-items:center;gap:10px;background:#f4f3f0;color:var(--noir);
  border-bottom:1px solid var(--ligne);border-right:1px solid var(--ligne);
  padding:12px 13px;text-align:left;max-width:none;transition:background .1s ease}
.tpill:last-child{border-right:0}
.tpill:active{background:rgba(27,27,27,.05)}
.tpill .ic{width:22px;height:22px}
.tpill b{display:block;font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--noir);line-height:1.35}
.tpill em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;color:var(--enc2);white-space:normal}
.tpill.hot{background:transparent}
.tpill.hot b,.tpill.hot em{color:var(--rouge)}
.sacs{display:inline-flex;gap:4px;margin-left:4px}
.sacs i{font-style:normal;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center}

/* ---- les grandes cases pleine largeur (Démarches…) ---- */
.dcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#f4f3f0;
  border:1px solid var(--ligne);border-top:0;color:var(--noir);padding:16px;margin:0;transition:background .1s ease}
.dcard:active{background:var(--noir)}
.dcard:active *{color:#f4f3f1!important}
.dcard .tx{flex:1;min-width:0}
.dcard b{display:block;font-family:ui-monospace,monospace;font-size:12px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase}
.dcard small{display:block;font-size:12px;color:var(--enc2);margin-top:3px}
.dcard .pi{width:34px;height:34px;flex:none;color:var(--noir)}
.dcard .pi .ic{width:100%;height:100%}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

/* ---- la grille des domaines ---- */
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;
  border:1px solid var(--ligne);border-top:0;margin-bottom:16px}
.tile{background:#f4f3f0;color:var(--noir);border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne);
  border-radius:0;padding:13px 12px 15px;min-height:132px;display:flex;flex-direction:column;text-align:left;
  transition:background .12s ease}
.tile:nth-child(2n){border-right:0}
.tile:active{background:var(--noir);color:#f4f3f1}
.tile:active small{color:rgba(242,238,230,.6)}
/* Au survol (souris) : la case s'inverse en noir — « sinon, on ne voit rien » (Mag). */
@media (hover:hover){
  .tile:hover{background:var(--noir);color:#f4f3f1}
  .tile:hover b{color:#f4f3f1!important}
  .tile:hover .tn,.tile:hover .tn2{color:rgba(242,238,230,.6)}
}
.tile:active b{color:#f4f3f1!important}
.tile:active .tn,.tile:active .tn2{color:rgba(242,238,230,.6)}
.tile b{font-family:ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;line-height:1.4}
.tile .tn{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--enc2);margin-left:7px;font-weight:500}
.tile .pi{margin:auto auto 0;width:42px;height:42px}
.tile .pi .ic{width:100%;height:100%}
/* Réseau : la grille fine au trait (l'autocollant essayé puis écarté par Mag le 05/08/2026),
   avec un CARRÉ de couleur devant le nom — plus gros que la police — et le compte dessous. */
.tsq{display:inline-block;width:15px;height:15px;margin-right:9px;vertical-align:-3px;flex:none}

/* ---- accueil personnalisé : blocs à gros filet de couleur (choix « 2 » de Mag, 05/08/2026) ---- */
/* « BONJOUR MAG » : la fonte EXACTE du grand titre du Réseau (.home-title), en NOIR. */
.hello{font-family:'Eastman',sans-serif;font-size:min(11.8vw,47px);font-weight:700;text-transform:uppercase;
  line-height:.92;letter-spacing:-.015em;color:var(--noir);flex:1;min-width:0}
.hello span{display:block}
.pbloc{border:1px solid var(--ligne);border-left:7px solid;background:#f4f3f0;padding:11px 12px 8px;margin-bottom:10px}
.pbloc .ptop{display:flex;align-items:center;font-family:ui-monospace,monospace;font-size:10.5px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px}
.pbloc .ptop .n{color:var(--enc2);margin-left:7px}
.pbloc .pli{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;
  border:0;border-top:1px solid #e2e0db;border-radius:0;padding:9px 0;font-size:14px;font-weight:600;color:var(--noir)}
.pbloc .pli:first-of-type{border-top:0}
.pbloc .pli .ic{width:16px;height:16px;flex:none}
.pbloc .pli em{font-style:normal;margin-left:auto;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);font-weight:500;flex:none}
.quizbar{display:flex;align-items:center;gap:10px;justify-content:center;width:100%;
  background:var(--noir);color:#f2eee6;border-radius:0;padding:13px 12px;font-weight:600;font-size:14.5px;margin-bottom:12px}
.quizbar .ic{width:19px;height:19px}

/* ---- ACCUEIL redessiné (handoff Claude Design, 06/08/2026) ---- */
.hdate{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8b8984}
/* La météo d'Anderlecht, sous le bonjour. */
.meteo{display:flex;align-items:center;gap:14px;border:1px solid var(--ligne);background:#f6f5f3;
  border-radius:6px;padding:13px 14px;margin-top:14px}
.meteo.alerte{border-color:var(--noir);border-width:1.5px;background:#fdfdfc}
.meteo .mic{width:38px;height:38px;flex:none;color:var(--noir)}
.meteo .mtx{flex:1;min-width:0}
.meteo .mtx b{display:flex;align-items:baseline;gap:9px;font-size:24px;font-weight:700;line-height:1}
.meteo .mmot{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir)}
.meteo .mtx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.meteo .malerte{display:block;font-size:13px;font-weight:500;color:var(--noir);margin-top:7px}
.hbonj{font-size:42px;font-weight:700;text-transform:uppercase;letter-spacing:-.035em;line-height:.84;
  margin-top:8px;display:flex;flex-direction:column;gap:1px;color:var(--noir)}
.hbonj span{display:block}
.hbonj i{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
/* La demi-lune verte était deux fois plus petite que la fleur rose, alors qu'elles
   se répondent : elle passe à la même taille (Mag, 08/08/2026 : « il est tout petit »). */
.hbonj .dd{width:.72em;height:.72em;margin-left:.1em;margin-bottom:.06em;color:#6fb08e;
  -webkit-mask-image:url(picto/ico-demidisques.svg);mask-image:url(picto/ico-demidisques.svg)}
.hbonj .fl{width:.7em;height:.7em;margin-left:.12em;margin-bottom:-.1em;color:#f3cde5;
  -webkit-mask-image:url(picto/ico-fleur.svg);mask-image:url(picto/ico-fleur.svg)}
/* En-tête de section : libellé machine souligné d'un trait noir de 2px */
.sect{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;
  border-bottom:2px solid var(--noir);margin-top:34px}
.sect b{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.sect em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984}
/* Variante « côte à côte » : le sous-texte suit le titre au lieu d'aller au bout. */
.sect.cote{justify-content:flex-start;gap:9px;margin-bottom:16px}
.sect.cote em{font-size:10.5px;letter-spacing:.2em;font-weight:500}
/* Carrousels : cartes 158px, la dernière volontairement coupée pour annoncer la suite */
.rail2{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:14px var(--pad) 6px}
.rail2::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;width:158px;border-radius:6px;padding:15px;display:flex;flex-direction:column;
  min-height:150px;text-align:left;color:var(--noir);background:#fdfdfc;border:1.5px solid var(--noir)}
.rc.plein{border-color:transparent}
.rc.noir{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.rc b{font-size:16px;font-weight:600;line-height:1.15}
.rc em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;margin-top:4px}
.rc .ic{width:38px;height:38px;margin-top:auto}
/* Les boules « à faire aujourd'hui » */
/* Serrées, pas éparpillées d'un bout à l'autre de l'écran (Mag, 06/08/2026). */
.boules{display:flex;gap:6px;padding:16px 0 4px;justify-content:flex-start}
.boule{flex:1 1 0;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;padding:0}
.boule .rond{width:64px;height:64px;border-radius:50%;background:var(--noir);display:flex;align-items:center;justify-content:center}
.boule .rond .ic{width:30px;height:30px}
/* Ce qui n'a rien à faire aujourd'hui : plus de rond noir, un trait fin et un picto
   gris. Ça reste cliquable et lisible, mais ça ne réclame plus le regard
   (idée de Mag, 08/08/2026 : « griser un peu ceux qui sont inactifs »). */
.boule.dort .rond{background:transparent;border:1.5px solid var(--ligne)}
.boule.dort .rond .ic,.boule.dort .rond svg{color:#b4b2a9!important}
.boule.dort b{color:#8b8984;font-weight:600}
.boule.dort em{color:#b4b2a9}
/* L'anneau a besoin d'air pour ne pas toucher la boule voisine. */
.boules{gap:12px}
/* Le bac de Mag est noir avec le recyclage en blanc : sur le rond noir, on le retourne
   pour qu'il se voie — bac clair, recyclage sombre. Son dessin reste le sien. */
.boule .rond img.picoc{width:30px;height:30px;filter:invert(1)}
.boule b{font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--noir)}
.boule em{font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#8b8984;text-align:center}
/* La pile de cartes du quiz */
/* Les proportions du design (carte 200 sur 358 de large) tenues en pourcentages :
   la pile garde le même équilibre sur un petit comme sur un grand téléphone.
   La carte du dessus peut grandir si la question est longue — pas les autres. */
/* LA CARTE RESTE CARRÉE (aspect-ratio 1) quelle que soit la largeur de l'écran —
   c'est une carte à jouer, pas une bannière (Mag, 06/08/2026). Les deux cartes du
   dessous suivent la même règle, décalées et tournées comme sur la planche. */
/* La pile est bornée : sans ça, les deux cartes du dessous (en %) s'étirent sur
   les écrans larges pendant que la carte noire, elle, reste bornée. */
/* De l'air au-dessus : l'éventail des cartes de derrière monte plus haut que la carte
   de devant, il ne doit pas venir buter dans le trait de la section. */
.pile{position:relative;margin:34px auto 26px;max-width:380px;touch-action:pan-y}
/* On fait défiler la pile au doigt pour changer de jeu (Mag, 06/08/2026). */
.pile .pcarte{cursor:grab;user-select:none;-webkit-user-select:none}
.pile .pcarte.glisse{transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .28s ease}
/* La copie de la carte qui s'en va : posée au même endroit, par-dessus. */
.pile .pcarte.fantome{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;z-index:3}
.pile .pcarte:active{cursor:grabbing}
/* La navigation suit la pile : tout au centre, les deux flèches serrées autour des
   points au lieu d'être poussées aux extrémités (Mag, 08/08/2026). */
.pilenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto 0;max-width:380px}
.pilenav .pgn{padding:0;flex:none;justify-content:center}
.pilenav .fl{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--noir);
  display:flex;align-items:center;justify-content:center;background:transparent;flex:none}
.pilenav .fl .ic{width:13px;height:13px}
.pilenav .fl.droite .ic{transform:rotate(180deg)}
/* La carte du dessous laisse voir, dans son coin, le picto du jeu qui vient. */
/* Le picto du jeu suivant se met dans le BAS de la bande qui dépasse : c'est le seul
   endroit de la carte de derrière qu'on voit vraiment (Mag, 06/08/2026). */
.pile .p1.apercu{display:flex;align-items:flex-end;justify-content:flex-start;padding:11px;
  border:0;cursor:pointer;transition:transform .16s ease}
@media (hover:hover){.pile .p1.apercu:hover{transform:translateX(-50%) translateX(18px) rotate(4deg) scale(1.03)}}
.pile .p1.apercu .ic{width:25px;height:25px}
/* Les points de position, un par jeu. */
.pilenav .pilepts{flex:none}
.pilenav .pilepts i{width:5px;height:5px;border-radius:3px;background:#c2c0bb}
.pilenav .pilepts i.on{width:18px;background:var(--noir)}
/* L'invitation à glisser : sur TÉLÉPHONE, à la place des flèches. */
.glissez{flex:1;text-align:center;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--enc2)}
@media (min-width:900px){
  .glissez{display:none}
  .pilenav .pilepts{flex:1;justify-content:center}
}
/* Sur téléphone, rien sous la pile : on glisse, ou on touche la carte du dessous. */
@media (max-width:899px){ .pilenav{display:none} .pile{margin-bottom:34px} }
/* LA PILE : un vrai jeu de cartes, d'après l'image que Mag a envoyée (06/08/2026).
   Trois cartes de MÊME taille, en format PORTRAIT (comme une carte à jouer, plus haute
   que large) ; l'éventail pivote par le BAS : la carte de devant est presque droite,
   celles de derrière montent d'un cran et penchent un peu plus à chaque fois vers la
   gauche. Après un glissement, la pile se redessine et retrouve exactement cette pose. */
/* ═══ LA PILE REDESSINÉE LE 08/08/2026 ═══ Mag a envoyé une image : trois cartes
   EMPILÉES ET CENTRÉES, la carte de devant bien droite, les deux du dessous qui
   dépassent de part et d'autre — une à gauche, une à droite — avec de gros arrondis.
   Plus d'éventail penché vers la gauche : c'est la symétrie qui fait la pile.
   Le dé « au hasard » quitte le coin de la pile et passe sous elle. */
.pile{display:flex;flex-direction:column;align-items:center}
.pile .p1,.pile .p2{position:absolute;width:58%;aspect-ratio:3/4;border-radius:20px;
  left:50%;top:0;box-shadow:0 0 0 1.5px rgba(27,27,27,.08)}
/* Celle de droite dépasse d'un côté, celle de gauche de l'autre. Un tout petit angle
   suffit à faire « pile » — au-delà, ça redevient un éventail. */
.pile .p2{transform:translateX(-50%) translateX(-14px) rotate(-3deg)}
.pile .p1{background:#f3cde5;transform:translateX(-50%) translateX(14px) rotate(3deg)}
.pile .pcarte{position:relative;margin:0;width:60%;aspect-ratio:3/4;border-radius:20px;
  transform:none;
  background:var(--noir);color:#f2eee6;padding:18px;display:flex;flex-direction:column;text-align:left;border:0}
.pile .pcarte .ic{width:48px;height:48px;color:#f5c542;flex:none}
.pile .pcarte b{font-size:18px;font-weight:700;line-height:1.1;margin-top:auto}
.pile .pcarte em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#f5c542;margin-top:5px}
.pile .tirer{position:static;display:flex;flex-direction:row;align-items:center;gap:9px;
  background:transparent;border:0;margin-top:18px}
.pile .tirer .rd{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--noir);display:flex;align-items:center;justify-content:center}
.pile .tirer .rd .ic{width:23px;height:23px}
.pile .tirer span{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#73716b}
/* Barres de pagination sous les carrousels */
.pgn{display:flex;gap:6px;justify-content:center;padding:10px 0 0}
.pgn i{width:5px;height:5px;border-radius:3px;background:#c2c0bb}
.pgn i.on{width:22px;background:var(--noir)}
/* Les sacs-poubelle au trait, un par sac, dans la boule */
.sacs{display:flex;align-items:center;justify-content:center;gap:1px}
.sacs svg{width:17px;height:22px}
.lienbas{display:flex;align-items:center;gap:10px;width:100%;background:#fdfdfc;
  border:1.5px solid var(--noir);border-radius:6px;padding:13px 14px;margin-top:16px;text-align:left;
  font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.lienbas .ic{width:20px;height:20px;flex:none}
/* Les lignes de « Reprendre » sur l'accueil */
/* « Reprendre » : de vraies cartes, comme les listes de fiches — les petites
   lignes se perdaient dans la page (Mag, 06/08/2026). */
.repli{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fdfdfc;border:1.5px solid var(--noir);border-radius:6px;padding:13px 14px;
  margin-bottom:10px;font-size:15px;font-weight:600;color:var(--noir)}
.repli .ic{width:22px;height:22px;flex:none}
.repli em{font-style:normal;margin-left:auto;flex:none;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;font-weight:500}

/* ---- FICHE redessinée (handoff Claude Design) ---- */
.fcarte{margin:16px 0 0;border-radius:6px;background:#f6f5f3;border:1px solid #dcdad5;overflow:hidden}
.fcarte .bande{height:8px;display:block}
.fcarte .fin{padding:14px}
.fcarte .ftop{display:flex;align-items:center;gap:10px}
.fcarte .frond{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--noir);
  display:flex;align-items:center;justify-content:center;flex:none;background:transparent}
.fcarte .frond .ic{width:13px;height:13px}
.fdom{border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:7px;
  font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--noir)}
.fdom .ic{width:13px;height:13px}
.fcarte .fet{width:22px;height:22px;flex:none;background:transparent;border:0;padding:0;color:#b5b3ae}
.fcarte .fet.on{color:#c9940c}
.fcarte h1{display:block;font-size:24px;font-weight:700;line-height:1.1;margin-top:14px}
.fcarte .fdesc{font-size:15px;line-height:1.45;color:#4a4844;margin:8px 0 0}
.frows{padding:6px 0 0}
.frow{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid #dcdad5}
.frow .fl{width:74px;flex:none;font-family:ui-monospace,monospace;font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984;padding-top:3px}
.frow .fv{flex:1;font-size:15px;font-weight:500;line-height:1.4;min-width:0;word-break:break-word}
.frow .fv a{color:var(--noir);font-weight:600;text-decoration:underline}
.fsavoir{margin:18px 0 0;border-radius:6px;background:var(--noir);color:#f2eee6;padding:16px}
.fsavoir b{display:flex;align-items:center;gap:9px;font-family:ui-monospace,monospace;font-size:9.5px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#f5c542}
.fsavoir b .ic{width:16px;height:16px;flex:none}
.fsavoir p{font-size:14.5px;line-height:1.5;margin:8px 0 0;white-space:pre-line}
.fboutons{padding:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fboutons.n1{grid-template-columns:1fr}
.fboutons.n3{grid-template-columns:repeat(3,1fr)}
/* Sur téléphone, trois pictos suffisent : les mots serrés à trois colonnes se
   couperaient en deux lignes (Mag, 08/08/2026 : « on comprendra »). */
@media (max-width:520px){ .fboutons.n3 .lb{display:none} .fboutons.n3 .fbtn{gap:0} }
.ftel-non{margin-top:10px;font-size:12.5px;color:#8b8984;line-height:1.5}
.ftel-non button{text-decoration:underline;color:#73716b;font-size:12.5px}
.fbtn{border-radius:6px;background:#f6f5f3;border:1.5px solid var(--noir);padding:14px;
  display:flex;align-items:center;justify-content:center;gap:9px;color:var(--noir);
  font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.fbtn.plein{border-color:transparent}
.fbtn .ic{width:17px;height:17px;flex:none}
.fsrc{padding:20px 0 6px;text-align:center;font-size:12px;color:#a3a19c;white-space:pre-line}

/* ── LA NOTE POUR LE DOSSIER (08/08/2026) ── Volontairement en machine à écrire :
   c'est un texte à copier ailleurs, pas une page à lire. On doit voir que c'est
   du brut. */
.sch-note{max-width:620px;margin:18px auto 0;border:1.5px solid var(--noir);border-radius:8px;
  background:#fdfdfc;overflow:hidden}
.sch-nt{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--ligne)}
.sch-nt b{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase}
.sch-ncp{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--noir);
  border-radius:999px;background:var(--noir);color:var(--creme);padding:6px 13px;cursor:pointer;
  font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.sch-ncp .ic,.sch-ncp svg{width:12px;height:12px;flex:none}
.sch-note pre{margin:0;padding:14px;font-family:ui-monospace,monospace;font-size:11.5px;
  line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#3d3b37;max-height:340px;overflow:auto}
.sch-note em{display:block;font-style:normal;padding:0 14px 13px;font-size:12px;line-height:1.45;color:var(--enc2)}
@media print{ .sch-note{display:none} }

/* ── LA PLANCHE DE L'ONBOARDING (réservée à l'administration) ── */
.obt-i{font-size:14.5px;line-height:1.55;margin:16px 0 4px;color:#3d3b37;max-width:620px}
.obt-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:18px}
.obt-n{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;border-bottom:1.5px solid var(--noir);padding-bottom:7px;margin-bottom:11px}
.obt-tel{background:var(--creme);border:2px solid var(--noir);border-radius:18px;padding:11px;overflow:hidden}
.obt-no{pointer-events:none}
.obt-tel .onb{padding:0;max-width:none}
.obt-tel .onb-e{min-height:460px}
.obt-tel .onb-t{font-size:30px}

/* ══ L'ONBOARDING (08/08/2026) ══ Un écran à la fois, plein cadre. Rien d'inventé :
   les titres reprennent la typographie des bandeaux, les couleurs sont celles de
   l'app. Le noir et le rouge portent les deux écrans qui doivent marquer — l'arrivée
   et la règle de confidentialité. */
.onb{max-width:620px;margin:0 auto;padding:6px 0 30px}
.onb-e{border:2px solid var(--noir);border-radius:14px;padding:26px 22px 22px;background:#fdfdfc;
  display:flex;flex-direction:column;min-height:calc(100dvh - 210px)}
.onb-e.noir{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.onb-e.rouge{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.onb-pas{display:flex;gap:5px;margin-bottom:22px}
.onb-pas i{flex:1;height:3px;border-radius:2px;background:rgba(27,27,27,.16)}
.onb-pas i.on{background:var(--noir)}
.onb-e.noir .onb-pas i{background:rgba(242,238,230,.22)} .onb-e.noir .onb-pas i.on{background:#f2eee6}
.onb-e.rouge .onb-pas i{background:rgba(255,255,255,.3)} .onb-e.rouge .onb-pas i.on{background:#fff}
.onb-sur{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;opacity:.7;margin-bottom:8px}
.onb-t{font-size:40px;font-weight:700;line-height:.95;letter-spacing:-.035em;text-transform:uppercase;
  margin-bottom:16px}
.onb-e p{font-size:15.5px;line-height:1.55;margin-bottom:16px;opacity:.92}
.onb-e p.onb-p{font-size:13.5px;color:var(--enc2);opacity:1}
.onb-b{margin-top:auto;border:0;border-radius:10px;background:var(--noir);color:#f2eee6;
  padding:16px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.onb-b.jaune{background:var(--jaune);color:var(--noir)}
.onb-e.rouge .onb-b{background:#fff;color:var(--rouge)}
.onb-s{margin-top:10px;border:0;background:none;color:inherit;opacity:.6;cursor:pointer;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:8px;width:100%}
/* les quatre boutons */
.onb-l{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.onb-li{display:flex;align-items:center;gap:13px;border:1.5px solid var(--noir);border-radius:10px;padding:12px}
.onb-r{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.onb-r .ic{width:19px;height:19px;color:var(--noir)}
.onb-lt b{display:block;font-size:15px;font-weight:600}
.onb-lt em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--enc2);margin-top:3px}
/* la règle */
.onb-ex{display:flex;align-items:flex-start;gap:10px;background:rgba(255,255,255,.14);
  border-radius:9px;padding:12px 13px;margin-bottom:9px;font-size:14.5px;line-height:1.4}
.onb-ex i{font-style:normal;flex:none;width:21px;height:21px;border-radius:50%;background:#fff;
  color:var(--rouge);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.onb-ex.non{background:rgba(0,0,0,.22)}
/* les cases à cocher */
.onb-ch{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.onb-c{display:flex;align-items:center;gap:12px;border:1.5px solid var(--noir);border-radius:10px;
  padding:14px 13px;background:#fdfdfc;font-family:inherit;font-size:15px;font-weight:500;
  cursor:pointer;text-align:left;width:100%}
.onb-c i{flex:none;width:21px;height:21px;border:1.5px solid var(--noir);border-radius:5px;display:block}
.onb-c.on{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.onb-c.on i{background:#6cb392;border-color:#6cb392;position:relative}
.onb-c.on i::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;color:var(--noir);font-size:13px;font-weight:700}
/* les deux encadrés et le jeu */
.onb-cadre{border:1.5px solid var(--noir);border-radius:10px;padding:14px;margin-bottom:14px}
.onb-ct{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;padding-bottom:9px;margin-bottom:12px;border-bottom:1.5px solid var(--noir)}
.onb-bl{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.onb-bo{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px}
.onb-bo .ic{width:44px;height:44px;border-radius:50%;background:var(--noir);color:var(--jaune);
  display:flex;align-items:center;justify-content:center;padding:11px}
.onb-bo em{font-style:normal;font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.1em;
  text-transform:uppercase;text-align:center;line-height:1.3}
.onb-dm{display:flex;flex-wrap:wrap;gap:8px}
.onb-d{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--noir);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:500}
.onb-d i{width:11px;height:11px;border-radius:50%;flex:none}
.onb-vide{font-size:13.5px;line-height:1.5;color:var(--enc2);margin:0}
.onb-jeu{background:var(--noir);color:#f2eee6;border-radius:12px;padding:18px;margin-bottom:14px}
.onb-jeu b{display:block;font-size:20px;font-weight:700;margin-bottom:7px}
.onb-jeu span{display:block;font-size:14px;line-height:1.5;opacity:.85;margin-bottom:14px}
.onb-bj{border:0;border-radius:9px;background:var(--jaune);color:var(--noir);padding:14px;width:100%;
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
/* les trois pas du raccourci */
.onb-pas3{margin-bottom:18px}
.onb-pas3 div{display:flex;gap:13px;padding:11px 0;border-bottom:1px solid rgba(242,238,230,.2)}
.onb-pas3 div:last-child{border-bottom:0}
.onb-pas3 b{flex:none;width:26px;height:26px;border-radius:50%;background:#f2eee6;color:var(--noir);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.onb-pas3 span{font-size:14.5px;line-height:1.45}
@media (max-width:400px){ .onb-t{font-size:33px} }

/* ── LA FEUILLE DES SORTIES (08/08/2026) ── Elle s'affiche au mur du centre : elle
   doit se lire debout et de loin. Date en gros à gauche, prix à droite, filets
   fins — pas d'aplat, l'encre coûte. */
/* Mag, 08/08/2026 : « ce n'est pas très aéré, il faut que ce soit plus visible et
   lisible ». On respire : plus d'air entre les lignes, entre le titre de section et
   la première sortie, et un peu plus de corps sur les noms. */
.ag-h{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;margin:26px 0 4px;padding-bottom:7px;border-bottom:1.5px solid #1b1b1b}
.ag-l{display:flex;gap:16px;align-items:flex-start;padding:14px 0;
  border-bottom:1px solid #d6d4d0;break-inside:avoid}
.ag-d{flex:none;width:56px;text-align:center;line-height:1.05}
.ag-d b{display:block;font-size:24px;font-weight:700}
.ag-d span{display:block;font-size:10.5px;margin-top:1px}
.ag-d em{display:block;font-style:normal;font-family:ui-monospace,monospace;font-size:7.5px;
  letter-spacing:.08em;text-transform:uppercase;color:#73716b;margin-top:4px}
.ag-t{flex:1;min-width:0}
.ag-t b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;margin-bottom:3px}
.ag-t span{display:block;font-size:11.5px;color:#4a4844;line-height:1.45}
.ag-t .ag-a{font-size:10.5px;color:#73716b}
.ag-t .ag-tel{font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;color:#1b1b1b;margin-top:4px}
.ag-t em{margin-top:4px}
.ag-t em{display:block;font-style:normal;font-size:10.5px;color:#73716b;margin-top:1px}
.ag-p{flex:none;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid #1b1b1b;border-radius:999px;padding:3px 8px;white-space:nowrap}
.ag-p.g{border-style:dashed}
.ag-fin{margin-top:14px;padding-top:8px;border-top:1px solid #d6d4d0;font-size:11px;color:#73716b}

/* ── CONSEILLÉE PAR L'ÉQUIPE (08/08/2026) ──────────────────────────────────
   Une fiche que l'équipe recommande se voit de loin : filet noir plus épais, et
   la RAISON écrite en toutes lettres. Pas de couleur d'accent en plus — le
   domaine a déjà la sienne, et deux couleurs sur la même carte se disputent. */
/* La carte conseillée se distingue par TROIS choses discrètes qui s'additionnent
   (Mag, 08/08/2026 : « une pastille un peu colorée, pour que ça passe vraiment en
   priorité ») : un filet plus épais, un fond crème légèrement plus chaud, et un
   trait doré sur tout le bord gauche. Le doré est celui des étoiles, déjà dans
   l'app — on n'introduit pas une couleur de plus. */
/* ⚠ PAS DE DORÉ ICI. Premier essai en #c9940c, la couleur des étoiles : sur un
   fond crème et avec le texte assombri pour rester lisible, ça virait au brun
   olive. Mag : « il est un peu plus coloré là, ses bruns, caca. » On prend le
   JAUNE FRANC de l'app, celui de l'accueil, avec du texte noir dessus. */
.frow2.reco{border-width:2px;background:#fffdf3;position:relative;overflow:hidden}
.frow2.reco::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--jaune)}
.recolg{display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  background:var(--jaune);border-radius:999px;padding:4px 11px 4px 9px;
  font-family:ui-monospace,monospace;font-size:8.5px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir)}
.recolg .ic,.recolg svg{width:12px;height:12px;flex:none;color:var(--noir)}
.recopq{display:block;margin-top:5px;font-size:12.5px;line-height:1.4;color:#4a4844;font-style:normal}

/* ── LES PAGES DE FORMATION (08/08/2026) ──────────────────────────────────
   ⚠ CE BLOC N'EXISTAIT PAS. Les quatorze formations écrivent depuis toujours
   des `f-page`, `f-lead`, `f-h`, `f-card`, `f-steps`, `f-note` — et AUCUNE de
   ces classes n'avait la moindre règle CSS. Résultat : titres, cartes et
   étapes s'affichaient en texte brut, le titre d'une étape collé à son
   explication (« ProforalLe français tourné vers le travail »). Trouvé en
   relisant la formation sur les cours de français.
   Rien d'inventé ici : on reprend le vocabulaire déjà en place ailleurs dans
   l'app — le monospace espacé des `sect`, le bloc noir des `fsavoir`, le
   filet crème des cartes. */
.f-page{padding-top:4px}
.f-lead{font-size:15.5px;line-height:1.55;margin:0 0 20px;color:var(--noir)}
.f-lead b{font-weight:700}
.f-h{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;color:var(--noir);margin:28px 0 12px;padding-bottom:8px;
  border-bottom:1.5px solid var(--noir)}
.f-card{background:#fdfdfc;border:1px solid var(--ligne);border-radius:8px;padding:14px;margin:0 0 10px}
.f-card .fn{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);display:flex;align-items:center;gap:7px;margin-bottom:7px}
.f-card .fn .ic{width:15px;height:15px;flex:none}
.f-card .fw{font-size:14.5px;line-height:1.5}
/* Une étape : le numéro dans sa pastille, le texte à côté — titre AU-DESSUS de
   son explication, c'est tout l'objet du `display:block`. */
.f-steps{margin:0 0 6px}
.f-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--ligne)}
.f-step:last-child{border-bottom:0}
.f-step .sn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--noir);color:var(--creme);
  display:flex;align-items:center;justify-content:center;
  font-family:ui-monospace,monospace;font-size:11px;font-weight:500;margin-top:1px}
.f-step .st{min-width:0}
/* `> b` et non ` b` : les explications contiennent elles-mêmes des mots en gras,
   et un display:block les faisait passer à la ligne au milieu d'une phrase. */
.f-step .st > b{display:block;font-size:14.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.f-step .st > span{display:block;font-size:13.5px;line-height:1.5;color:var(--enc2)}
.f-step .st > span b{font-weight:700;color:var(--noir)}
.f-note{margin:16px 0 0;border-radius:6px;background:var(--noir);color:#f2eee6;padding:15px;
  font-size:14px;line-height:1.5}
.f-note b{font-weight:700}
.f-note .ic{width:15px;height:15px;vertical-align:-2px;margin-right:6px}
/* Le violentomètre garde ses trois zones colorées. */
.vm-z{border-radius:8px;padding:13px 15px;margin:0 0 10px}
.vm-z b{display:block;font-size:14px;margin-bottom:7px}
.vm-z ul{margin:0;padding-left:19px}
.vm-z li{font-size:13.5px;line-height:1.5;margin-bottom:3px}
.vm-z.green{background:#e8f2ec;border:1px solid #6cb392}
.vm-z.orange{background:#fdf3e3;border:1px solid #f5c542}
.vm-z.red{background:#fbeae9;border:1px solid var(--rouge)}
.vm-src{font-size:12px;color:#a3a19c;text-align:center;padding-top:6px}

/* ---- URGENCES redessinées (handoff Claude Design) ---- */
.uvital{padding:16px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.uvital a{border-radius:6px;background:var(--danger);color:#f2eee6;padding:14px;
  display:flex;align-items:baseline;gap:10px;min-height:76px}
.uvital b{font-size:34px;font-weight:700;line-height:.9;letter-spacing:-.03em}
.uvital span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.ucats{padding:20px 0 0;display:flex;flex-direction:column;gap:10px}
.ucat{border-radius:6px;background:var(--noir);color:#f2eee6;padding:14px;
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:0}
.ucat .rd{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ucat .rd .ic{width:18px;height:18px;color:var(--noir)}
.ucat b{flex:1;font-size:15.5px;font-weight:500}
.ucat .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em}
.ucat .sg{font-size:19px;line-height:1}
.usous{display:flex;flex-direction:column;gap:8px;padding-left:14px;margin-top:8px}
/* Le titre d'un réseau prend TOUTE la largeur : en grille, il s'intercalait entre
   deux numéros et cassait la lecture (Mag, 08/08/2026, capture à l'appui). */
.usous .ures{grid-column:1 / -1;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  margin:10px 0 2px;padding-bottom:6px;border-bottom:1px solid rgba(240,239,237,.25)}
.usous .ures:first-child{margin-top:0}
.usous .ures b{font-family:ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:#f0efed}
.usous .ures em{font-style:normal;font-size:11.5px;color:rgba(240,239,237,.6)}
/* L'étiquette sur la ligne elle-même. */
.ures-p{display:inline-block;margin-left:8px;vertical-align:1px;
  font-family:ui-monospace,monospace;font-size:8px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;border:1px solid var(--ligne);border-radius:999px;padding:2px 7px;color:var(--enc2)}
.unum{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:12px 13px;
  display:flex;align-items:center;gap:12px;color:var(--noir)}
.unum>.ic{width:20px;height:20px;flex:none}
.unum .tx{flex:1;min-width:0}
.unum .tx b{display:block;font-size:15px;font-weight:500;line-height:1.2}
.unum .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:2px}
.unum .no{font-size:16px;font-weight:600;flex:none;white-space:nowrap}

/* ---- LE CENTRE redessiné (handoff Claude Design) ---- */
.cliste{margin:-12px 0 0;position:relative;z-index:1;border-radius:6px;background:#fdfdfc;
  border:1.5px solid var(--noir);padding:15px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--noir)}
.cliste .tx{flex:1;min-width:0}
.cliste .sur{display:block;font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;color:#73716b}
.cliste b{display:block;font-size:24px;font-weight:700;line-height:1.05;margin-top:4px}
.cliste em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;margin-top:4px;color:#8b8984}
.cliste .ic{width:40px;height:40px;flex:none}
.sectc{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--noir);
  padding-bottom:8px;margin:26px 0 12px}
.sectc b{display:flex;align-items:center;gap:9px;font-family:ui-monospace,monospace;font-size:10px;
  font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.sectc b i{width:12px;height:12px;flex:none}
.sectc em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984}
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.otile{border-radius:6px;padding:14px;display:flex;flex-direction:column;min-height:122px;
  text-align:left;color:var(--noir);border:0}
.otile.large{grid-column:span 2;min-height:110px}
.otile.noir{background:var(--noir);color:#f2eee6}
.otile.blanc{background:#fdfdfc;border:1.5px solid var(--noir)}
.otile b{font-size:15.5px;font-weight:600;line-height:1.1}
.otile em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;margin-top:4px;opacity:.72}
.otile.noir em{opacity:1}
.otile .ic{width:32px;height:32px;flex:none;margin:auto 0 0 auto}
.qgrid{display:flex;flex-direction:column;gap:10px}
.qcarte{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:14px;
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--noir)}
.qcarte>.ic{width:30px;height:30px;flex:none}
.qcarte .tx{flex:1;min-width:0}
.qcarte .tx b{display:block;font-size:16px;font-weight:600;line-height:1.15}
.qcarte .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;margin-top:3px;color:#8b8984}
.qcarte .sacsq{display:flex;gap:4px;flex:none;margin-right:4px}
.qcarte .sacsq i{width:12px;height:12px}
.qcarte .chv{font-size:19px;opacity:.45;flex:none}
/* Survol du Centre : la tuile se soulève d'un trait noir, la carte s'éclaircit.
   Jamais d'inversion en noir — le picto resterait invisible (Mag, 06/08/2026). */
.otile,.qcarte{transition:transform .14s ease,box-shadow .14s ease,background .14s ease}
@media (hover:hover){
  .otile:hover{transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--noir)}
  .qcarte:hover{background:#fff;transform:translateX(3px)}
}
.otile:active{transform:translateY(0) scale(.99)}
.qcarte:active{background:#fff}

/* ---- FORMATIONS redessinées (handoff) ---- */
.fmod{flex:0 0 auto;width:158px;border-radius:6px;padding:15px;display:flex;flex-direction:column;
  min-height:172px;text-align:left;color:var(--noir);border:0;background:#fdfdfc;border:1.5px solid var(--noir)}
.fmod.noir{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.fmod.plein{border-color:transparent}

.fmod em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;

.sectl{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.18em;

.flist{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.frow2{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:12px 13px;

.frow2 .rd .ic{width:18px;height:18px;color:var(--noir)}

.frow2 .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:2px}

/* ---- QUIZ redessiné (handoff) ---- */
.qtop{padding:16px 0 0;display:flex;align-items:center;gap:12px}
.qtop .frond{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--noir);

.qpile .c1{left:22px;top:14px;right:34px;height:184px;background:#f3cde5;transform:rotate(-8deg)}

.qpile .cq em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;

.qrep{padding:18px 0 0;display:flex;flex-direction:column;gap:10px}
.qrep button{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:15px;

/* ---- MA LISTE, LE LINGE, LE FIL, PROFIL, ADMIN (handoff) ---- */

  flex:none;display:flex;align-items:center;justify-content:center}
.tache.faite .cas{background:var(--noir)}
.tache .cas .ic{width:14px;height:14px;color:#3ec98b}
.tache .tx{flex:1;min-width:0}

.tache .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;

.rlist{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.role{border-radius:6px;background:#f6f5f3;border:1px solid #dcdad5;padding:12px 13px;
