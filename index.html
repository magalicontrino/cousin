/* ---------- LE FIL : le porte-voix de l'équipe ----------
   Les messages vivent dans `feed`, les réactions dans `feed_reactions`. Chacun écrit
   sous son nom Google. Les épinglés remontent en haut. */
const FEED_TYPES=[
  {k:'info',      l:'Info',      c:'#5b8fd4', e:'chat'},
  {k:'important', l:'Important', c:'#e63329', e:'alert'},
  {k:'bravo',     l:'Bravo',     c:'#6cb392', e:'fete'},
  {k:'question',  l:'Question',  c:'#f5c542', e:'question'}
];
const FTYPE=Object.fromEntries(FEED_TYPES.map(t=>[t.k,t]));
/* La valeur enregistrée dans la base ne change PAS (sinon les réactions déjà posées
   seraient perdues) — on remplace seulement le dessin affiché par les siens. */
const FEED_EMOJIS=['👍','❤️','👏','💡'];
const FEED_RX_PICTO={'👍':'pouce','❤️':'coeur','👏':'applaudir','💡':'bulb'};
let FEED=[], REACTIONS={}, feedLoaded=false, FEED_OUVERT=false, FEED_TYPE='info';

async function loadFeed(){
  feedLoaded=false; FEED=[]; REACTIONS={};
  if(!sb){ feedLoaded=true; return; }
  try{
    let data=null;
    try{
      const r=await sb.from('feed').select('id,auteur_id,auteur_nom,auteur_email,texte,cree_le,type,epingle').order('cree_le',{ascending:false}).limit(60);
      if(r.error) throw r.error; data=r.data;
    }catch(e){
      const r=await sb.from('feed').select('id,auteur_id,auteur_nom,auteur_email,texte,cree_le').order('cree_le',{ascending:false}).limit(60);
      data=r.data;
    }
    FEED=data||[];
    FEED.sort((a,b)=>(b.epingle?1:0)-(a.epingle?1:0));   // les épinglés en tête, le reste du plus récent au plus vieux
    if(FEED.length){
      try{
        const ids=FEED.map(m=>m.id);
        const {data:rx}=await sb.from('feed_reactions').select('feed_id,emoji,auteur_id').in('feed_id',ids);
        (rx||[]).forEach(r=>{
          const b=REACTIONS[r.feed_id]||(REACTIONS[r.feed_id]={});
          const e=b[r.emoji]||(b[r.emoji]={n:0,moi:false});
          e.n++; if(PROFILE&&r.auteur_id===PROFILE.uid) e.moi=true;
        });
      }catch(e){}
    }
  }catch(e){}
  feedLoaded=true;
}
/* Même précaution que pour les chambres : on va voir si quelqu'un a écrit, mais
   pas plus d'une fois toutes les 20 secondes, et on ne redessine que si ça a bougé. */
let _filVu=0, _filSignature='';
function rafraichirFil(){
  if(!sb) return;
  if(Date.now()-_filVu < 20000) return;
  _filVu=Date.now();
  loadFeed().then(function(){
    const sig=JSON.stringify(FEED)+JSON.stringify(REACTIONS);
    if(sig!==_filSignature){ _filSignature=sig; if(current.view==='fil') render(); }
  });
}
function ouvrirCompose(type){ if(type) FEED_TYPE=type; FEED_OUVERT=true; render();
  const t=document.getElementById('feedText'); if(t) t.focus(); }
function fermerCompose(){ FEED_OUVERT=false; render(); }
function setFeedType(k){ FEED_TYPE=k; render(); }
async function publishFeed(){
  const ta=document.getElementById('feedText'); if(!ta) return;
  const txt=(ta.value||'').trim(); if(!txt){ ta.focus(); return; }
  if(!sb) return;
  const ligne={texte:txt, auteur_nom:(PROFILE&&PROFILE.nom)||'', auteur_email:(PROFILE&&PROFILE.email)||''};
  try{
    const r=await sb.from('feed').insert(Object.assign({type:FEED_TYPE},ligne));
    if(r&&r.error) throw r.error;
  }catch(e){
    try{ await sb.from('feed').insert(ligne); }   // base pas encore à jour : on publie quand même
    catch(e2){ toast('Publication impossible'); return; }
  }
  ta.value=''; FEED_OUVERT=false;
  await loadFeed(); render();
}
async function supprimerMsg(id){
  if(!sb||!confirm('Supprimer ce message ?')) return;
  try{ await sb.from('feed').delete().eq('id',id); await loadFeed(); render(); }
  catch(e){ toast('Suppression refusée'); }
}
async function epinglerMsg(id,on){
  if(!sb) return;
  try{ await sb.from('feed').update({epingle:on}).eq('id',id); await loadFeed(); render(); }
  catch(e){ toast('Épinglage indisponible'); }
}
/* Une réaction par personne et par picto : on l'ajoute ou on la retire. */
async function toggleReaction(id,emoji){
  if(!sb||!PROFILE) return;
  const b=REACTIONS[id]||{}, r=b[emoji]||{n:0,moi:false};
  const nb=REACTIONS[id]||(REACTIONS[id]={});
  nb[emoji]={n:Math.max(0,r.n+(r.moi?-1:1)), moi:!r.moi};
  render();                                      // l'écran répond tout de suite, la base suit
  try{
    if(r.moi) await sb.from('feed_reactions').delete().eq('feed_id',id).eq('emoji',emoji).eq('auteur_id',PROFILE.uid);
    else      await sb.from('feed_reactions').insert({feed_id:id, emoji:emoji, auteur_nom:(PROFILE&&PROFILE.nom)||''});
  }catch(e){ await loadFeed(); render(); }
}
function feedQuand(iso){
  try{
    const d=new Date(iso), diff=(Date.now()-d.getTime())/1000;
    if(diff<60) return "à l'instant";
    if(diff<3600) return Math.floor(diff/60)+' min';
    if(diff<86400) return Math.floor(diff/3600)+' h';
    const j=Math.floor(diff/86400); if(j<7) return j+' j';
    return d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit'});
  }catch(e){ return ''; }
}

  h+='<div class="rlist" style="padding-top:18px">';
  FEED.forEach(function(m){

    h+='<div class="msg'+(m.epingle?' epingle':'')+'">'+

      '<div class="top"><span class="av" style="background:'+t.c+'">'+esc(ini)+'</span>'+

      (PROFILE&&PROFILE.admin?'<button class="fsup" onclick="epinglerMsg('+m.id+','+(m.epingle?'false':'true')+')">'+

  return h+'</div><div style="height:26px"></div>';

/* « le 29 juillet à 9 h 12 » — pour savoir quand la demande est arrivée. */
function quandFr(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const h=String(d.getHours()), mn=String(d.getMinutes()).padStart(2,'0');
  const memeJour=d.toDateString()===new Date().toDateString();
  return (memeJour?'aujourd’hui':'le '+d.getDate()+' '+M[d.getMonth()])+' à '+h+' h '+mn;
}

        return '<div class="fcard" role="button" tabindex="0" onclick="setFilt(\'dem\',\''+esc(t).replace(/'/g,"\\'")+'\')">'+
          '<span class="fpi" style="color:'+dc('demarches')+'"><span class="ic">'+icon('demarche')+'</span></span>'+
          '<span class="tx"><b>'+esc(t)+'</b><small>'+n+' organisme'+(n>1?'s':'')+'</small></span>'+
          '<span style="font-size:20px;font-weight:700;color:rgba(27,27,27,.4)">›</span></div>';
      }).join('')+
      (pp?'<div class="fcard" role="button" tabindex="0" onclick="go(\'#/f/'+pp.sid+'\')" style="background:#f5c542">'+
        '<span class="fpi" style="color:#1b1b1b"><span class="ic">'+icon('book')+'</span></span>'+
        '<span class="tx"><b>Nouveau ici ? Premiers pas</b><small>La formation qui explique comment tout se tient</small></span></div>':'')+
      '</div>';
  }
  if(d.isDem){
    const dems=DEMARCHES.filter(t=>DATA.some(p=>p.domaine===key&&p.demarche===t));
    chips+=chipRow('dem',dems,filt.dem,'Toutes');
    items=items.filter(p=>p.demarche===filt.dem);
  }
  if(d.isMail){
    chips+=chipRow('genre',['Mail','Note'],filt.genre,'Tous');
    if(filt.genre!=='Tous') items=items.filter(p=>p.genre===filt.genre);
    chips+=chipRow('famille',['Médical','Social'],filt.famille,'Toutes');
    if(filt.famille!=='Toutes') items=items.filter(p=>p.famille===filt.famille);
  }
  /* Règle d'or reprise de l'app principale : aucun bouton de tri ne mène à une page vide.
     Chaque rangée ne propose que ce qui existe compte tenu de l'autre. */
  const base=DATA.filter(p=>p.domaine===key && (!d.isDem||p.demarche===filt.dem));
  const parCommune=(filt.commune==='Toutes')?base:base.filter(p=>p.commune===filt.commune);
  const ordre=(TAGS_REGLES[key]||[]).map(r=>r[1]);
  let alltags=[...new Set(parCommune.flatMap(p=>p.tags))];
  alltags.sort((a,b)=>{const ia=ordre.indexOf(a),ib=ordre.indexOf(b);return ((ia<0?99:ia)-(ib<0?99:ib))||a.localeCompare(b,'fr')});
  if(alltags.length>1){
    chips+=chipRow('tag',alltags,filt.tag,'Tout');
    if(filt.tag!=='Tout') items=items.filter(p=>p.tags.includes(filt.tag));
  }
  if(d.byCommune){
    const parTag=(filt.tag==='Tout')?base:base.filter(p=>p.tags.includes(filt.tag));
    const coms=COMMUNES.filter(c=>parTag.some(p=>p.commune===c));
    if(coms.length>1) chips+=chipRow('commune',coms,filt.commune,'Toutes');
    if(filt.commune!=='Toutes') items=items.filter(p=>p.commune===filt.commune);
  }
  items=triProximite(items);
  /* Social : les 19 CPAS se replient derrière un seul bouton. */
  let grpHtml='';
  if(key==='social'){
    const cpas=items.filter(estCpas);
    if(cpas.length>3){ items=items.filter(p=>!estCpas(p)); grpHtml=grpCpas(cpas); }
  }
  if(d.isFormation && filt.tag==='Tout' && filt.commune==='Toutes') return vFormations();
  return heroBandeau(d.label, (items.length+(grpHtml?'+':''))+' fiche'+(items.length>1?'s':''), dc(key), d.ic)+
    rail(key)+chips+
    '<div class="cards"'+(d.isFormation?' style="border-top:0;padding-top:6px"':'')+'>'+
    (items.length||grpHtml?items.map(d.isFormation?flCard:fcard).join('')+grpHtml:
      '<div class="empty"><span class="ic">'+icon('compass')+'</span><b>Rien avec ces filtres</b><p>Essaie d\'élargir la sélection.</p></div>')+
    '</div>';
}

const URG_CATS=[

const URG_CATK={"Écoute & aide":"coeur","Drogue & alcool":"addictions","Médical":"medical","Urgences hôpitaux":"medical","Hébergement d'urgence":"building","Autres":"phone"};
/* Le symbole femme (repris de l'app principale) pour Violences · femmes. */
const URG_FEMME='<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.4a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0 2.7a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/><rect x="10.7" y="13.2" width="2.6" height="8.4" rx="1.3"/><rect x="8" y="16.5" width="8" height="2.6" rx="1.3"/></svg>';

function urgName(p){const n=p.nom.replace(/^\s*\d[\d\s]*[–—-]\s*/,'').replace(/\s*[–—-]\s*\d[\d\s]*$/,'').trim();return n||p.nom;}
function urgShort(p){let n=urgName(p).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s*[–—-]\s.*$/,'');return n.trim()||urgName(p);}
function urgSub(p){const par=p.nom.match(/\(([^)]+)\)/);const t=par?par[1].trim():'';return t?t.charAt(0).toUpperCase()+t.slice(1):'';}
/* Une ligne de numéro dans une catégorie (handoff Claude Design). */
function urgSq(p,cc){
  const tel=(p.tel||'').replace(/\s/g,'');
  const sub=urgSub(p);
  const dedans='<span class="ic">'+icon(tel?'phone':(p.site?'lien':'note'))+'</span>'+
    '<span class="tx"><b>'+esc(urgShort(p))+'</b>'+(sub?'<em>'+esc(sub)+'</em>':'')+'</span>'+

function urgencesListHTML(){
  const items=DATA.filter(p=>p.domaine==='urgences' || p.urgent);
  const buckets=URG_CATS.map(c=>({label:c.label,list:[]}));
  const used=new Set();
  items.forEach(p=>{
    const hay=p.nom+' '+(p.desc||'');
    for(let i=0;i<URG_CATS.length;i++){ if(URG_CATS[i].re.test(hay)){ buckets[i].list.push(p); used.add(p); break; } }
  });
  const autres=items.filter(p=>!used.has(p));
  if(autres.length) buckets.push({label:"Autres",list:autres});
  const nonEmpty=buckets.filter(b=>b.list.length);
  let vitalHtml='', rows='';
  nonEmpty.forEach((b,idx)=>{
    if(b.label==="Secours vital"){
      const halves=b.list.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(p=>{
        const tel=(p.tel||'').replace(/\s/g,'');
        return '<a href="tel:'+esc(tel)+'"><b>'+esc(p.tel)+'</b><span>'+esc(urgShort(p))+'</span></a>';
      }).join('');
      vitalHtml='<div class="uvital">'+halves+'</div>'; return;
    }
    const open=urgCat===idx;
    const cc=URG_CATC[b.label]||'#f5c542';
    rows+='<div><button class="ucat" onclick="toggleUrgCat(this,'+idx+')">'+
      '<span class="rd" style="background:'+cc+'"><span class="ic">'+(b.label==='Violences · femmes'?URG_FEMME:icon(URG_CATK[b.label]||'phone'))+'</span></span>'+
      '<b>'+esc(b.list.length>1&&URG_PLURIEL[b.label]?URG_PLURIEL[b.label]:b.label)+'</b>'+
      '<span class="n" style="color:'+cc+'">'+b.list.length+'</span>'+
      '<span class="sg" style="color:'+cc+'">'+(open?'−':'+')+'</span></button>'+
      (open?'<div class="usous">'+b.list.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(p=>urgSq(p,cc)).join('')+'</div>':'')+
    '</div>';
  });
  return vitalHtml+'<div class="ucats">'+rows+'</div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   LES 8 JEUX — rapatriés de l'app principale le 06/08/2026.
   Le moteur est repris tel quel (il fonctionne depuis des semaines) ; seul ce

   ═══════════════════════════════════════════════════════════════════════ */
const JEUX = [
  {k:'roue',   ic:'jroue', nom:'La roue',            c:'#f5c542', p:'Elle choisit à ta place',        regle:"Tu la fais tourner, elle s'arrête sur un domaine, et tu réponds à ses questions."},

  {k:'qui',    ic:'jenquete', nom:'Qui suis-je ?',       c:'#fd8fd0', p:'Trois indices, à toi de trouver', regle:"Les indices tombent un par un. Plus tu trouves tôt, plus tu marques."},
  {k:'vf',     ic:'jcible', nom:'Vrai ou faux',        c:'#f3c6da', p:"Deux boutons, c'est tout",        regle:"Une affirmation, deux boutons. La correction arrive avec la fiche."},
  {k:'jour',   ic:'jjour', nom:'La question du jour', c:'#b28b7a', p:"Une par jour, pour tout le monde", regle:"Une seule question, la même pour toute l'équipe, qui change à minuit."},
  {k:'equipe', ic:'social', nom:'L\'équipe cette semaine', c:'#1b1b1b', p:'Un score commun, personne contre personne', sombre:true,
   regle:"Chaque bonne réponse de chacun s'ajoute au compteur de l'équipe. Il n'y a pas d'adversaire et pas de classement : on regarde ensemble ce que l'équipe a appris cette semaine."}
];

/* Ce qu'on garde d'une partie à l'autre : les records et ce qu'on maîtrise par domaine. */
var JXS = (function(){
  try{ return Object.assign({rec:{}, dom:{}, jour:{}}, JSON.parse(localStorage.getItem('lux_jeux')||'{}')); }
  catch(e){ return {rec:{}, dom:{}, jour:{}}; }
})();
function jxSave(){
  try{ localStorage.setItem('lux_jeux', JSON.stringify(JXS)); }catch(e){}
  /* et dans la base : les records et l'avancement suivent la personne */
  if(typeof reglagePousser==='function') reglagePousser('jeux',JXS);
}
function jxNote(src, juste){
  jxNoteSemaine(juste);            // le compteur de l'équipe, toutes parties confondues
  const p = src ? DATA.find(x=>x.id===src) : null;
  if(!p) return;
  const d = JXS.dom[p.domaine] || (JXS.dom[p.domaine]={v:0,j:0});
  d.v++; if(juste) d.j++; jxSave();
}
/* Le lundi de la semaine en cours : c'est la borne du compteur d'équipe. */
function semaineLundi(){
  const d=new Date(); const j=(d.getDay()+6)%7; d.setDate(d.getDate()-j);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* Chaque réponse nourrit le compteur de la semaine : le mien sur le téléphone, et
   celui de l'équipe dans la base partagée (si la table existe — sinon on n'affiche
   que le mien, sans rien casser). */
function jxNoteSemaine(juste){
  const l=semaineLundi();
  if(!JXS.sem || JXS.sem.lundi!==l) JXS.sem={lundi:l, justes:0, total:0};
  JXS.sem.total++; if(juste) JXS.sem.justes++;
  jxSave(); jxPousserScore();
}
let _pousseEnCours=false;
async function jxPousserScore(){
  return; /* le compteur d'équipe attend la connexion */
  _pousseEnCours=true;
  try{
    await sb.from('jeux_semaine').upsert(
      { user_id:PROFILE.uid, lundi:JXS.sem.lundi, justes:JXS.sem.justes, total:JXS.sem.total },
      { onConflict:'user_id,lundi' });
  }catch(e){ /* table pas encore créée : on reste en local */ }
  _pousseEnCours=false;
}
async function jxLireEquipe(){
  if(!JEU || JEU.type!=='equipe') return;
  { JEU.equipe='hors-ligne'; render(); return; }
  try{
    const { DATA, error } = await sb.from('jeux_semaine').select('justes,total,user_id').eq('lundi',semaineLundi());
    if(error) throw error;
    JEU.equipe = { justes:data.reduce((n,r)=>n+(r.justes||0),0), total:data.reduce((n,r)=>n+(r.total||0),0), gens:data.length };
  }catch(e){ JEU.equipe='absente'; }
  render();
}
function jxRecord(cle, valeur){
  if((JXS.rec[cle]||0) < valeur){ JXS.rec[cle]=valeur; jxSave(); return true; }
  return false;
}

var JEU = null;                 // la partie en cours (var : render() peut passer ici avant)
var JXCHOIX = {jeu:null, terrain:{t:'tout'}};   // ce qu'on est en train de choisir
var JXTIMER = null;

function openJeux(){  JEU=null; JXCHOIX={jeu:null,terrain:{t:'tout'}}; jxStop(); render(); }
function jxStop(){ if(JXTIMER){ clearInterval(JXTIMER); JXTIMER=null; } }
function jxChoisirJeu(k){ JXCHOIX.jeu = k || null; JXCHOIX.terrain={t:'tout'}; render(); }
function jxTerrain(t,k){ JXCHOIX.terrain={t,k}; render(); }

/* Le terrain devient une liste de domaines (ou rien = tout le réseau). */
function jxDoms(ter){
  const tous = DOMAINES.filter(d=>d.reseau).map(d=>d.key);
  if(!ter || ter.t==='tout') return null;
  if(ter.t==='dom') return [ter.k];
  if(ter.t==='met'){ const m=METIERS_JEU.find(x=>x.k===ter.k); return m ? m.doms.filter(d=>tous.includes(d)) : null; }
  if(ter.t==='hasard') return [tous[Math.floor(Math.random()*tous.length)]];
  return null;
}
function jxNomTerrain(ter){
  if(!ter || ter.t==='tout') return 'Tout mélangé';
  if(ter.t==='dom') return (DOM[ter.k]&&DOM[ter.k].label)||ter.k;
  if(ter.t==='met') return 'Métier : '+ter.k;
  return 'Au hasard';
}
function jxQuestions(ter, n){
  const doms=jxDoms(ter);
  const g = doms ? quizGen(null, doms) : quizGen('all');
  return g.qs.slice(0, n||40);
}

/* ── Lancer une partie ─────────────────────────────────────────────── */
function jxJouer(k, ter){
  const type = k || JXCHOIX.jeu, terrain = ter || JXCHOIX.terrain;
  jxStop();
  if(type==='equipe'){ JEU={type:'equipe',terrain:terrain||{t:'tout'},equipe:null}; go('#/quiz'); jxLireEquipe(); return; }
  if(type==='roue'){ JEU={type,terrain,phase:'roue',angle:0,tourne:false}; go('#/quiz'); return; }
  if(type==='qui'){ JEU={type,terrain,items:jxQuiItems(terrain,12),i:0,niveau:1,score:0,answered:false,picked:-1}; go('#/quiz'); return; }
  if(type==='vf'){ JEU={type,terrain,items:jxVfItems(terrain,14),i:0,score:0,answered:false,picked:null}; go('#/quiz'); return; }
  if(type==='jour'){ JEU={type,terrain:{t:'tout'},q:jxQuestionDuJour(),answered:!!jxJourFait(),picked:-1}; go('#/quiz'); return; }
  if(type==='flip'){ JEU={type,terrain,qs:jxQuestions(terrain,20),i:0,retourne:false}; go('#/quiz'); return; }
  if(type==='serie'){ JEU={type,terrain,qs:jxQuestions(terrain,40),i:0,serie:0,answered:false,picked:-1,fini:false}; go('#/quiz'); return; }
  if(type==='chrono'){
    JEU={type,terrain,qs:jxQuestions(terrain,60),i:0,score:0,answered:false,picked:-1,reste:60,fini:false};
    go('#/quiz');
    JXTIMER=setInterval(()=>{ if(!JEU||JEU.type!=='chrono'){ jxStop(); return; }
      JEU.reste--; if(JEU.reste<=0){ JEU.reste=0; JEU.fini=true; jxRecord('chrono',JEU.score); jxStop(); }
      render(); },1000);
    return;
  }
  // par défaut : les questions classiques
  JEU={type:'quiz',terrain,qs:jxQuestions(terrain,60),i:0,score:0,answered:false,picked:-1};
  go('#/quiz');
}
function jxDe(){
  const j=JEUX.filter(x=>x.k!=='equipe'), tous=DOMAINES.filter(d=>d.reseau);
  const jeu=j[Math.floor(Math.random()*j.length)];
  const d=tous[Math.floor(Math.random()*tous.length)];
  cousinToast(jeu.nom+' · '+d.label);
  setTimeout(()=>jxJouer(jeu.k,{t:'dom',k:d.key}),450);
}

/* ── « Qui suis-je ? » : trois indices qui tombent un par un ────────── */
function jxQuiItems(ter,n){
  const doms=jxDoms(ter);
  let pool=DATA.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15);
  if(doms) pool=pool.filter(p=>doms.includes(p.domaine));
  const noms=pool.map(p=>p.nom);
  return qShuffle(pool).slice(0,n).map(p=>{
    const faux=qShuffle(noms.filter(x=>x!==p.nom)).slice(0,3);
    const opts=qShuffle([p.nom].concat(faux));
    /* Trois indices sur ce que FAIT le service, jamais sur son adresse : une maison
       déménage, et connaître une rue n'a jamais fait connaître un réseau. */
    const ind=[];
    ind.push({i:icon('palette'), t:'Je suis dans « '+DOM[p.domaine].label+' »'});
    ind.push({i:icon('chat'), t:(p.public && p.public.length>4) ? "Je m'adresse à : "+qTrim(p.public,90) : 'Je reçois sans condition particulière'});
    ind.push({i:icon('bulb'), t:'On vient chez moi pour : '+qTrim(p.desc,110)});
    return {p:p.id, nom:p.nom, opts, correct:opts.indexOf(p.nom), ind};
  }).filter(x=>x.opts.length===4);
}
/* ── Vrai ou faux : une affirmation, deux boutons ───────────────────── */
function jxVfItems(ter,n){
  const doms=jxDoms(ter);
  let pool=DATA.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15);
  if(doms) pool=pool.filter(p=>doms.includes(p.domaine));
  const autres=DATA.filter(p=>p.desc && p.desc.length>15);
  return qShuffle(pool).slice(0,n).map((p,idx)=>{
    const vrai = idx%2===0;
    let phrase;
    if(vrai){ phrase='« '+p.nom+' » : '+qTrim(p.desc,120); }
    else{
      const x=qShuffle(autres.filter(a=>a.nom!==p.nom && a.desc!==p.desc))[0];
      phrase='« '+p.nom+' » : '+qTrim(x?x.desc:'',120);
    }
    return {src:p.id, phrase, vrai, vraie:qTrim(p.desc,140), nom:p.nom};
  });
}
/* ── La question du jour : la même pour tout le monde, elle change à minuit ── */
/* La question du jour doit être LA MÊME pour tout le monde et NE PAS BOUGER d'un
   affichage à l'autre. Le générateur mélange tout au hasard : on remet donc les questions
   ET les réponses dans un ordre stable (alphabétique) avant de tirer avec la date.
   Sans ça, la réponse enregistrée pointait vers une autre option — et l'app affichait
   une correction avant même qu'on ait répondu. */
function jxQuestionDuJour(){
  /* Entièrement déterminée par la DATE : même fiche, mêmes leurres, même ordre pour tout
     le monde et à chaque affichage. Le générateur du quiz tire au hasard (les leurres
     changeaient à chaque rendu), on ne peut donc pas s'en servir ici. */
  const pool = DATA.filter(function(p){ return p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15; })
                   .sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); });
  if(pool.length<4) return null;
  const j=todayStr(); let h=0; for(let i=0;i<j.length;i++) h=(h*31+j.charCodeAt(i))>>>0;
  const p = pool[h % pool.length];
  const bonne = qTrim(p.desc,110);
  const leurres=[];
  for(let k=1; leurres.length<3 && k<pool.length; k++){
    const x = pool[(h + k*7) % pool.length];
    const t = qTrim(x.desc,110);
    if(x.nom!==p.nom && t!==bonne && leurres.indexOf(t)<0) leurres.push(t);
  }
  if(leurres.length<3) return null;
  const opts = [bonne].concat(leurres).sort(function(a,b){ return a.localeCompare(b,'fr'); });
  return { q:"Que propose « "+p.nom+" » ?", opts:opts, correct:opts.indexOf(bonne), src:p.id };
}
function jxJourFait(){ return JXS.jour && JXS.jour.date===todayStr() ? JXS.jour : null; }

/* ── Répondre, selon le jeu ────────────────────────────────────────── */
function jxRep(i){
  if(!JEU || JEU.answered) return;
  const Q=JEU.qs?JEU.qs[JEU.i]:null;
  JEU.answered=true; JEU.picked=i;
  const juste = Q && i===Q.correct;
  if(Q) jxNote(Q.src, juste);
  if(JEU.type==='serie'){
    if(juste){ JEU.serie++; jxRecord('serie',JEU.serie); }
    else { JEU.fini=true; }
  } else if(JEU.type==='chrono'){
    if(juste) JEU.score++;
    setTimeout(()=>{ if(JEU&&JEU.type==='chrono'&&!JEU.fini){ jxSuivante(); } },420);
  } else if(juste && JEU.score!==undefined){ JEU.score++; }
  render();
}
function jxSuivante(){
  if(!JEU) return;
  JEU.i++; JEU.answered=false; JEU.picked=-1; JEU.retourne=false; JEU.niveau=1;
  if(JEU.qs && JEU.i>=JEU.qs.length && JEU.type==='chrono'){ JEU.qs=JEU.qs.concat(jxQuestions(JEU.terrain,30)); }
  if(JEU.qs && JEU.i>=JEU.qs.length && JEU.type==='serie'){ JEU.qs=JEU.qs.concat(jxQuestions(JEU.terrain,30)); }
  render();
}
function jxFlip(){ if(JEU){ JEU.retourne=!JEU.retourne; render(); } }
function jxIndice(){ if(JEU && JEU.niveau<3){ JEU.niveau++; render(); } }
function jxRepQui(i){
  if(!JEU || JEU.answered) return;
  const it=JEU.items[JEU.i]; JEU.answered=true; JEU.picked=i;
  const juste=i===it.correct;
  if(juste) JEU.score += (4-JEU.niveau);      // trouvé au 1er indice = 3 points
  jxNote(it.p, juste); render();
}
function jxRepVf(rep){
  if(!JEU || JEU.answered) return;
  const it=JEU.items[JEU.i]; JEU.answered=true; JEU.picked=rep;
  const juste = (rep===it.vrai);
  if(juste) JEU.score++;
  jxNote(it.src, juste); render();
}
function jxSuivanteItem(){ if(!JEU) return; JEU.i++; JEU.answered=false; JEU.picked=null; JEU.niveau=1; render(); }
function jxRepJour(i){
  if(!JEU || JEU.answered || !JEU.q) return;
  const juste = i===JEU.q.correct;
  JEU.answered=true; JEU.picked=i;
  JXS.jour={date:todayStr(), juste:juste, choisi:JEU.q.opts[i]}; jxSave();
  jxNote(JEU.q.src, juste); render();
}
/* ── La roue ───────────────────────────────────────────────────────── */
function jxTournerRoue(){
  if(!JEU || JEU.tourne) return;
  const tous=DOMAINES.filter(d=>d.reseau);
  const n=Math.min(8,tous.length), pas=360/n;
  const gagnant=Math.floor(Math.random()*n);
  JEU.tourne=true;
  const cible=360*5 + (360 - (gagnant*pas + pas/2));
  JEU.angle = JEU.angle + (cible - (JEU.angle%360));
  const el=document.getElementById('jxRoue'); if(el) el.style.transform='rotate('+JEU.angle+'deg)';
  setTimeout(()=>{
    if(!JEU) return;
    const dom=JEU.secteurs[gagnant];
    jxJouer('quiz',{t:'dom',k:dom.key});
  },4400);
}
function openQuiz(theme){
   JEU=null;
  QUIZ = theme ? quizGen(theme) : { qs:[], i:0, score:0, answered:false, picked:-1, theme:null };
  render();
}
/* Le quiz porte sur le MÉTIER du réseau : qui fait quoi, pour quel public, dans quel domaine.
   Volontairement AUCUNE question sur les numéros de téléphone ni les adresses — ça, on le cherche
   dans l'app au moment où on en a besoin ; ce qu'il faut connaître par cœur, c'est à qui s'adresser. */
/* ═══ LES QUESTIONS ÉCRITES À LA MAIN ═══
   Le reste du quiz se fabrique tout seul à partir des fiches. Ces questions-là, non : elles
   portent sur des règles de droit, où une formulation approximative ferait plus de mal que
   de bien. Écrites le 31/07/2026 avec la formation « Adresse de référence, CPAS compétent
   et agrément », d'après les textes cités en bas de cette formation. Chaque question porte
   son POURQUOI : on ne retient pas une bonne réponse, on retient une raison. */
/* Elles rejoignent aussi « Tout mélangé » : la règle de droit croise les fiches du réseau,
   c'est comme ça qu'on la retient pour de bon. */

let QZ=null;
/* Le design prévoit une manche de 5 questions (« 5 questions · 3 min »). */
function quizStart(t){QZ=quizGen(t); if(QZ&&QZ.qs&&QZ.qs.length>5) QZ.qs=QZ.qs.slice(0,5); render();window.scrollTo(0,0);}
function quizAnswer(i){if(!QZ||QZ.answered)return;QZ.answered=true;QZ.picked=i;
  QZ.res=QZ.res||[];QZ.res[QZ.i]=(i===QZ.qs[QZ.i].correct);
  if(i===QZ.qs[QZ.i].correct)QZ.score++;render();}
function quizNext(){QZ.i++;QZ.answered=false;QZ.picked=-1;render();window.scrollTo(0,0);}
function quizTheme(){QZ=null;render();window.scrollTo(0,0);}
function quizFiche(id){const p=DATA.find(x=>x.id===id);if(p)go('#/f/'+p.sid);}
/* Les aides du renderer (en-tête, options, retour au choix). */
function jxHubHTML(){

    </div>`;

  if(JXCHOIX.jeu) return jxPresentationHTML();

/* Ce qu'on maîtrise, domaine par domaine — nourri par toutes les parties. */
function jxProgHTML(){
  /* Chaque ligne est jouable : on appuie, on rejoue ce domaine. À 100 %, on remet le
     compteur à zéro avant de rejouer — sinon on ne saurait jamais si c'était de la chance. */
  const lignes=DOMAINES.filter(d=>d.reseau).map(d=>{
    const s=JXS.dom[d.key]; if(!s||!s.v) return '';
    const pc=Math.round(s.j/s.v*100);
    const parfait = pc>=100;
    return `<button class="jx-l${parfait?' parfait':''}" onclick="rejouerDomaine('${d.key}',${parfait})">
      <span>${esc(d.short||d.label)}</span>
      <div class="b"><i style="width:${pc}%;background:${tileColor(d.key)}"></i></div>
      <div class="n">${pc}%</div>
      <em>${parfait?'Refaire à zéro':'Rejouer'}</em></button>`;
  }).filter(Boolean).join('');
  const rec = [];
  if(JXS.rec.serie) rec.push(icon('jserie')+' série record : <b>'+JXS.rec.serie+'</b>');
  if(JXS.rec.chrono) rec.push(icon('jchrono')+' chrono record : <b>'+JXS.rec.chrono+'</b>');
  return `<div class="jx-prog"><h4>Ce que je maîtrise</h4>
    ${lignes || '<div class="jx-vide">Rien encore : joue une partie et la barre se remplit, domaine par domaine.</div>'}
    ${rec.length?`<div class="jx-vide" style="margin-top:10px">${rec.join(' · ')}</div>`:''}</div>`;
}
/* Rejouer un domaine depuis « Ce que je maîtrise ». Si on y était à 100 %, on efface son
   compteur d'abord : le nouveau pourcentage mesure alors vraiment la connaissance, pas la chance. */
function rejouerDomaine(k, remiseAZero){
  if(remiseAZero){ delete JXS.dom[k]; jxSave(); }
  jxJouer('quiz', {t:'dom', k});
}
function jxRetourHub(){ return `<button class="quiz-next" style="margin-top:10px;background:transparent;color:var(--muted);border:1.5px solid var(--line)" onclick="openJeux()">← Retour aux jeux</button>`; }
function jxEnTete(nom, ic){

/* L'affichage des 8 jeux, rapatrié tel quel. */
function jxJeuHTML(){
  const T=JEU.type;

  if(T==='equipe'){

    const e=JEU.equipe;

    else if(e==='absente') bloc = `<div class="jx-vide">Le compteur partagé n'est pas encore branché : il attend une table dans la base. En attendant, voilà le tien.</div>`;
    else bloc = `<div class="eq-gros">${e.justes}</div>
      <div class="eq-sous">bonne${e.justes>1?'s':''} réponse${e.justes>1?'s':''} cette semaine, à ${e.gens>1?e.gens+' ':''}${e.gens>1?'':'une personne'}${e.gens>1?'personnes':''}</div>`;
    return `<div class="pf-wrap">
      <div class="quiz-top"><span>L'équipe cette semaine</span><span>depuis lundi</span></div>
      <div class="eq-carte">${bloc}</div>
      <div class="jx-bar"><span class="gros">${icon('check')}</span><span><b>Toi : ${moi.justes} bonne${moi.justes>1?'s':''}</b><em>sur ${moi.total} question${moi.total>1?'s':''} jouées cette semaine</em></span></div>
      <div class="pourq">Pas de classement, pas de comparaison entre collègues : un seul chiffre, celui de l'équipe. Il repart à zéro chaque lundi.</div>
      <button class="quiz-next" onclick="jxJouer('quiz',{t:'tout'})">Ajouter des points — jouer maintenant</button>
      ${jxRetourHub()}</div>`;
  }

  if(T==='roue'){
    const tous=DOMAINES.filter(d=>d.reseau).slice(0,8);
    JEU.secteurs=tous;
    const pas=360/tous.length;
    const parts=tous.map((d,i)=>`${tileColor(d.key)} ${i*pas}deg ${(i+1)*pas}deg`).join(',');
    const labs=tous.map((d,i)=>{
      const a=(i*pas+pas/2-90+360)%360, g=a>90&&a<270;
      const mot=(d.short||d.label); const court = mot.length>10 ? mot.slice(0,9)+'.' : mot;
      return `<div class="lab" style="transform:rotate(${g?a+180:a}deg) translate(${g?'-104px':'32px'},-6px);text-align:${g?'right':'left'}">${esc(court)}</div>`;
    }).join('');
    return `<div class="pf-wrap"><div class="jx-roue-box">
      <div class="quiz-q" style="font-size:16px;margin-bottom:14px">Elle choisit ton domaine — tu n'as rien à décider.</div>
      <div class="jx-rh"><div class="jx-fl"></div>
        <div class="jx-roue" id="jxRoue" style="background:conic-gradient(${parts})">${labs}</div>
        <div class="jx-moy">COUSIN</div></div>
      <button class="quiz-next" onclick="jxTournerRoue()">${icon('jroue')} Faire tourner</button>
      ${jxRetourHub()}</div></div>`;
  }

  if(T==='flip'){
    const Q=JEU.qs[JEU.i];
    if(!Q) return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-msg">Paquet terminé</div>${jxRetourHub()}</div></div>`;
    return `<div class="pf-wrap">${jxEnTete('Cartes à retourner',icon('jcartes'))}
      <div class="jx-flip${JEU.retourne?' on':''}" onclick="jxFlip()">
        <div class="jx-flip-in">
          <div class="jx-face" style="background:#5b8fd4"><small>Carte ${JEU.i+1}</small><b>${esc(Q.q)}</b><em>Appuie pour retourner</em></div>
          <div class="jx-face dos"><small>La réponse</small><b>${esc(Q.opts[Q.correct])}</b><em>Appuie pour revenir</em></div>
        </div>
      </div>
      <button class="quiz-next" onclick="jxSuivante()">Carte suivante</button>${jxRetourHub()}</div>`;
  }

  if(T==='serie'){
    if(JEU.fini){
      const r=JXS.rec.serie||0;
      // La question ratée reste à l'écran, avec sa correction : c'est là qu'on apprend.
      const ratee = JEU.qs[JEU.i];
      const corr = ratee ? `<div class="jx-titre" style="margin-top:18px">La question qui t'a arrêtée</div>
        <div class="quiz-q" style="font-size:16px">${esc(ratee.q)}</div>${quizCorrection(ratee)}` : '';
      return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-score">${JEU.serie}</div>
        <div class="quiz-msg">${JEU.serie>=r&&JEU.serie>0?'Nouveau record !':'Série terminée'}</div>
        <div class="jx-vide" style="margin-bottom:14px">Ton record : ${r}</div>
        <button class="pf-golist" onclick="jxJouer('serie',JEU.terrain)">${icon('jserie')} <span>Rejouer</span></button>${jxRetourHub()}</div>${corr}</div>`;
    }
    const Q=JEU.qs[JEU.i];
    const flamme = icon('jserie');
    return `<div class="pf-wrap">
      <div class="jx-bar"><span class="gros">${flamme}</span><span><b>Série de ${JEU.serie}</b><em>Record : ${JXS.rec.serie||0} · ${esc(jxNomTerrain(JEU.terrain))}</em></span><span class="chiffre">${JEU.serie}</span></div>
      <div class="quiz-q">${esc(Q.q)}</div><div class="quiz-opts">${jxOptsHTML(Q,'jxRep')}</div>
      ${JEU.answered?quizCorrection(Q):''}
      ${JEU.answered?(JEU.picked===Q.correct?`<button class="quiz-next" onclick="jxSuivante()">Continuer la série</button>`:''):''}
      ${JEU.answered?jxRetourHub():''}</div>`;
  }

  if(T==='chrono'){
    if(JEU.fini){
      return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-score">${JEU.score}</div>
        <div class="quiz-msg">bonnes réponses en 60 secondes</div>
        <div class="jx-vide" style="margin-bottom:14px">Ton record : ${JXS.rec.chrono||0}</div>
        <button class="pf-golist" onclick="jxJouer('chrono',JEU.terrain)">${icon('jchrono')} <span>Rejouer</span></button>${jxRetourHub()}</div></div>`;
    }
    const Q=JEU.qs[JEU.i];
    return `<div class="pf-wrap">
      <div class="jx-bar${JEU.reste<=10?' presse':''}"><span class="gros">${icon('jchrono')}</span><span><b>${JEU.score} bonne${JEU.score>1?'s':''}</b><em>${esc(jxNomTerrain(JEU.terrain))}</em></span><span class="chiffre">${JEU.reste}</span></div>
      <div class="quiz-q">${esc(Q.q)}</div><div class="quiz-opts">${jxOptsHTML(Q,'jxRep')}</div></div>`;
  }

  if(T==='qui'){
    const it=JEU.items[JEU.i];
    if(!it) return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-score">${JEU.score}</div><div class="quiz-msg">points</div>${jxRetourHub()}</div></div>`;
    // Après la réponse, tous les indices se découvrent — sinon on ne retient rien.
    const cache = idx => !JEU.answered && idx+1>JEU.niveau;
    const inds=it.ind.map((x,idx)=>`<div class="jx-ind${cache(idx)?' floue':''}"><i>${x.i}</i><span>${cache(idx)?'Indice caché — appuie sur « Un indice de plus »':esc(x.t)}</span></div>`).join('');
    const LETTRES=['A','B','C','D','E'];
    const opts=it.opts.map((o,idx)=>{
      let cls='quiz-opt lettre';
      if(JEU.answered){ if(idx===it.correct) cls+=' good'; else if(idx===JEU.picked) cls+=' bad'; }
      return `<button class="${cls}" ${JEU.answered?'disabled':''} onclick="jxRepQui(${idx})"><i>${LETTRES[idx]||'?'}</i><span>${esc(o)}</span></button>`;
    }).join('');
    return `<div class="pf-wrap">
      <div class="quiz-top"><span>Qui suis-je ? ${JEU.i+1}/${JEU.items.length}</span><span>Score : ${JEU.score}</span></div>
      <div class="jx-titre">Les indices</div>
      ${inds}
      ${(!JEU.answered && JEU.niveau<3)?`<button class="quiz-next" style="margin:4px 0 16px" onclick="jxIndice()">Un indice de plus (−1 point)</button>`:''}
      <div class="jx-titre" style="margin-top:18px">Alors, qui suis-je ?</div>
      <div class="quiz-opts">${opts}</div>
      ${JEU.answered?`<div class="quiz-corr">${JEU.picked===it.correct?'Bien vu — c\u2019était ':'C\u2019était '}<b>${esc(it.nom)}</b>. Les trois indices sont dépliés au-dessus.</div>
      ${quizCorrection({src:it.p, opts:it.opts, correct:it.correct})}
      <button class="quiz-next" onclick="jxSuivanteItem()">Suivant</button>${jxRetourHub()}`:''}</div>`;
  }

  if(T==='vf'){
    const it=JEU.items[JEU.i];
    if(!it) return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-score">${JEU.score}/${JEU.items.length}</div><div class="quiz-msg">Vrai ou faux terminé</div>${jxRetourHub()}</div></div>`;
    const juste=(JEU.picked===it.vrai);
    return `<div class="pf-wrap">
      <div class="quiz-top"><span>Vrai ou faux ${JEU.i+1}/${JEU.items.length}</span><span>Score : ${JEU.score}</span></div>
      <div class="quiz-q">${esc(it.phrase)}</div>
      ${JEU.answered
        ? `<div class="quiz-corr" style="border-left:4px solid ${juste?'#6cb392':'#e63329'}"><b>${juste?'Bien vu !':'Raté'}</b><br>${it.vrai?'C’était vrai.':'C’était faux — en réalité : '+esc(it.vraie)}</div>
           ${quizCorrection({src:it.src, opts:[it.vraie], correct:0})}
           <button class="quiz-next" onclick="jxSuivanteItem()">Suivant</button>${jxRetourHub()}`
        : `<div class="jx-vf"><button class="jx-vrai" onclick="jxRepVf(true)">✓ Vrai</button><button class="jx-faux" onclick="jxRepVf(false)">✕ Faux</button></div>`}
    </div>`;
  }

  if(T==='jour'){
    const Q=JEU.q, fait=jxJourFait();
    if(!Q) return `<div class="pf-wrap"><div class="pf-empty"><p>Pas de question aujourd'hui.</p></div>${jxRetourHub()}</div>`;
    if(fait && !JEU.answered) JEU.picked=Q.opts.indexOf(fait.choisi);
    const choisi = JEU.answered ? JEU.picked : (fait ? Q.opts.indexOf(fait.choisi) : -1);
    const opts=Q.opts.map((o,idx)=>{
      let cls='quiz-opt';
      if(JEU.answered||fait){ if(idx===Q.correct) cls+=' good'; else if(idx===choisi) cls+=' bad'; }
      return `<button class="${cls}" ${(JEU.answered||fait)?'disabled':''} onclick="jxRepJour(${idx})">${esc(o)}</button>`;
    }).join('');
    return `<div class="pf-wrap">
      <div class="quiz-top"><span>La question du jour</span><span>${esc(todayStr())}</span></div>
      <div class="quiz-q">${esc(Q.q)}</div><div class="quiz-opts">${opts}</div>
      ${(JEU.answered||fait)?quizCorrection(Q):''}
      ${(JEU.answered||fait)?`<div class="quiz-corr">${(fait&&fait.juste)||(JEU.answered&&JEU.picked===Q.correct)?'Bravo — c’est la bonne.':'C’était : <b>'+esc(Q.opts[Q.correct])+'</b>'}<br><span style="color:var(--muted)">Une nouvelle question demain, la même pour toute l’équipe.</span></div>${jxRetourHub()}`:''}
    </div>`;
  }

  // quiz classique (la roue nous amène ici, et « Tout mélangé » aussi)
  const Q=JEU.qs[JEU.i];
  if(!Q || JEU.i>=JEU.qs.length){
    const n=JEU.qs.length, s=JEU.score, r=n?s/n:0;
    const msg = r===1?"Sans faute !" : r>=.7?"Bien joué !" : r>=.4?"Pas mal, continue !" : "À revoir";
    return `<div class="pf-wrap"><div class="quiz-res"><div class="quiz-score">${s}/${n}</div><div class="quiz-msg">${msg}</div>
      <button class="pf-golist" onclick="jxJouer('quiz',JEU.terrain)">${icon('bulb')}<span>Rejouer</span></button>${jxRetourHub()}</div></div>`;
  }
  const corr = JEU.answered ? quizCorrection(Q) : '';
  return `<div class="pf-wrap">
    <div class="quiz-top"><span>Question ${JEU.i+1}/${JEU.qs.length}</span><span>${esc(jxNomTerrain(JEU.terrain))} · ${JEU.score}</span></div>
    <div class="quiz-q">${esc(Q.q)}</div><div class="quiz-opts">${jxOptsHTML(Q,'jxRep')}</div>${corr}
    ${JEU.answered?`<button class="quiz-next" onclick="jxSuivante()">${JEU.i+1<JEU.qs.length?'Question suivante':'Voir mon score'}</button>`:''}</div>`;
}


function vQuiz(){
  /* Si un des 8 jeux est en cours, c'est lui qu'on affiche (rapatrié de l'app
     principale) ; sinon, le quiz redessiné au design Lux. */
  if(typeof JEU!=='undefined' && JEU){
    /* Le jeu apporte son propre en-tête : on n'en remet pas un par-dessus. */
    return '<div class="jxwrap">'+jxJeuHTML()+'</div><div style="height:26px"></div>';
  }
  if(!QZ){
    const themes=[['all','Tout mélangé'],['droits','Adresse de référence, CPAS et agrément']]
      .concat(DOMAINES.filter(x=>x.reseau).map(x=>[x.key,x.label]));
    return heroBandeau('Quiz','Teste tes connaissances','#f5c542','bulb')+
      '<div class="flist" style="padding-top:14px">'+themes.map(function(t){
        const c=(t[0]==='all'||t[0]==='droits')?'#f5c542':dc(t[0]);
        return '<button class="frow2" onclick="quizStart(\''+t[0]+'\')">'+
          '<span class="rd" style="background:'+c+'"><span class="ic">'+icon('bulb')+'</span></span>'+
          '<span class="tx"><b>'+esc(t[1])+'</b></span>'+
          '<span class="chv" style="font-size:19px;opacity:.45">›</span></button>';
      }).join('')+'</div><div style="height:26px"></div>';
  }
  const Q=QZ.qs[QZ.i];
  /* Les boules d'état : ce qui est joué (juste/faux), la question du moment, ce qui vient. */
  function boules(){
    let h='<div class="qboules">';
    for(let i=0;i<QZ.qs.length;i++){
      let cl='';
      if(i<QZ.i) cl=(QZ.res&&QZ.res[i]?'ok':'ko');
      else if(i===QZ.i) cl='now';
      h+='<i class="'+cl+'"></i>';
    }
    return h+'</div>';
  }
  const top='<div class="qtop">'+
    '<button class="frond" onclick="quizTheme()" aria-label="Changer de thème"><span class="ic">'+icon('chevron')+'</span></button>'+
    boules()+
    '<span class="cpt">'+Math.min(QZ.i+1,QZ.qs.length)+' / '+QZ.qs.length+'</span></div>';

  if(!Q){
    const bravo=(QZ.score>=QZ.qs.length*0.8);
    return top+'<div class="qpile"><i class="c1"></i><i class="c2"></i>'+
      '<div class="cq"><span class="ic">'+icon('bulb')+'</span>'+
      '<b>'+QZ.score+' / '+QZ.qs.length+'</b>'+
      '<em>'+(bravo?'Le réseau n’a plus de secrets':'Chaque question corrigée, c’est une fiche de mieux')+'</em></div></div>'+
      '<div class="qrep"><button onclick="quizStart(\''+QZ.theme+'\')"><span class="rd"><span class="ic">'+icon('bulb')+'</span></span><b>Rejouer ce thème</b></button>'+
      '<button onclick="quizTheme()"><span class="rd"><span class="ic">'+icon('chevron')+'</span></span><b>Changer de thème</b></button></div>'+
      '<div style="height:26px"></div>';
  }

  let h=top+'<div class="qpile"><i class="c1"></i><i class="c2"></i>'+
    '<div class="cq"><span class="ic">'+icon('bulb')+'</span>'+
    '<b>'+esc(Q.q)+'</b>'+
    (QZ.theme&&QZ.theme!=='all'?'<em>'+esc((DOM[QZ.theme]||{}).label||QZ.theme)+'</em>':'')+
    '</div></div>';

  h+='<div class="qrep">'+Q.opts.map(function(o,i){
    let cl='';
    if(QZ.answered){ if(i===Q.correct) cl=' bon'; else if(i===QZ.picked) cl=' mauvais'; }
    const coche=(QZ.answered&&(i===Q.correct))?icon('check'):((QZ.answered&&i===QZ.picked)?icon('x'):'');
    return '<button class="'+cl.trim()+'" onclick="quizAnswer('+i+')">'+
      '<span class="rd">'+(coche?'<span class="ic">'+coche+'</span>':'')+'</span>'+
      '<b>'+esc(o)+'</b></button>';
  }).join('')+'</div>';

  if(QZ.answered){
    const p=Q.src?DATA.find(x=>x.id===Q.src):null;
    h+='<div class="fsavoir"><b><span class="ic">'+icon('bulb')+'</span>'+(QZ.picked===Q.correct?'Bien vu !':'La bonne réponse')+'</b>'+
      '<p>'+esc(Q.opts[Q.correct])+(Q.exp?'\n\n'+esc(Q.exp):'')+'</p></div>'+
      (p?'<div class="fboutons"><button class="fbtn" onclick="quizFiche(\''+Q.src+'\')"><span class="ic">'+icon('compass')+'</span>Voir la fiche</button>'+
      '<button class="fbtn plein" style="background:#f5c542" onclick="quizNext()"><span class="ic">'+icon('chevron')+'</span>Suivante</button></div>'
      :'<div class="fboutons"><span></span><button class="fbtn plein" style="background:#f5c542" onclick="quizNext()"><span class="ic">'+icon('chevron')+'</span>Suivante</button></div>');
  }
  return h+'<div style="height:30px"></div>';
}

/* ---------- CE QUI NE DOIT PLUS SE PERDRE ----------
   Règle posée par Mag le 30/07/2026 : « tout ce qui se perd et qui est intéressant de
   garder, tu le mets en base ». Les chapitres de formation lus et l'avancement des jeux
   ne vivaient que dans le téléphone. Table `reglages_perso` (chacun ne voit que la sienne).
   Le téléphone reste la copie de travail : on ne l'écrase que si la lecture a VRAIMENT
   réussi. */
const REG_MIGRE='lux_reglages_en_base';
let _regEnAttente={}, _regMinuteur=null;
function reglagePousser(cle,valeur){
  if(!sb||!PROFILE||!PROFILE.uid) return;
  _regEnAttente[cle]=valeur;
  /* On attend une seconde : cocher cinq chapitres à la suite ne doit pas déclencher
     cinq allers-retours vers la base. */
  clearTimeout(_regMinuteur);
  _regMinuteur=setTimeout(function(){
    const lot=_regEnAttente; _regEnAttente={};
    Object.keys(lot).forEach(function(k){
      envoiMuet(sb.from('reglages_perso').upsert(
        {user_id:PROFILE.uid, cle:k, valeur:lot[k], maj_le:new Date().toISOString()},
        {onConflict:'user_id,cle'}));
    });
  },1000);
}
/* Un record ne redescend jamais : si un appareil en connaît un meilleur, il gagne. */
function fusionnerRecords(a,b){
  const out=Object.assign({},b||{});
  Object.keys(a||{}).forEach(function(k){
    if(typeof a[k]==='number'&&(typeof out[k]!=='number'||a[k]>out[k])) out[k]=a[k];
  });
  return out;
}
async function chargerReglages(){
  if(!sb||!PROFILE||!PROFILE.uid) return false;
  let lignes;
  try{
    const {data:rows,error}=await sb.from('reglages_perso').select('cle,valeur');
    if(error) return false;
    lignes={}; (rows||[]).forEach(r=>{lignes[r.cle]=r.valeur});
  }catch(e){ return false; }
  let premiere=false;
  try{ premiere=!localStorage.getItem(REG_MIGRE); }catch(e){}
  /* FORMATIONS — la première fois on fait l'UNION : un chapitre lu ici ou là reste lu,
     on ne redemande à personne de relire ce qu'il a déjà lu. Ensuite la base fait foi,
     sinon décocher sur un téléphone ne servirait à rien. */
  const fBase=lignes.formations;
  if(fBase&&typeof fBase==='object'){
    if(premiere){
      Object.keys(fBase).forEach(function(sid){
        const ici=FLU[sid]||[], la=Array.isArray(fBase[sid])?fBase[sid]:[];
        const u=ici.slice(); la.forEach(i=>{ if(u.indexOf(i)<0) u.push(i); });
        FLU[sid]=u;
      });
    } else {
      Object.keys(FLU).forEach(k=>{delete FLU[k]});
      Object.keys(fBase).forEach(sid=>{FLU[sid]=fBase[sid]});
    }
    try{ localStorage.setItem('lux_formations',JSON.stringify(FLU)); }catch(e){}
  }
  // JEUX — la base fait foi, sauf les records : on garde toujours le meilleur des deux.
  const jBase=lignes.jeux;
  if(jBase&&typeof jBase==='object'){
    const recs=fusionnerRecords(JXS.rec,jBase.rec);
    JXS.dom=jBase.dom||JXS.dom||{};
    JXS.jour=jBase.jour||JXS.jour||{};
    if(jBase.sem) JXS.sem=jBase.sem;
    JXS.rec=recs;
    try{ localStorage.setItem('lux_jeux',JSON.stringify(JXS)); }catch(e){}
  }
  // Premier passage sur cet appareil : ce qui n'existait QUE là monte en base.
  if(premiere){
    try{ localStorage.setItem(REG_MIGRE,'1'); }catch(e){}
    reglagePousser('formations',FLU);
    reglagePousser('jeux',JXS);
  }
  return true;
}

/* ---------- MA LISTE DU JOUR ----------
   Les modèles de listes sont dans `checklists` (une ligne par tâche, réglés par Mag) ;
   ce qui est coché AUJOURD'HUI est dans `checklist_faites` (une ligne par personne, par
   tâche et par jour). Demain, tout est décoché tout seul : c'est la date qui fait ça,
   personne n'a à remettre la liste à zéro le matin. */
let listesLoaded=false;
async function loadListes(){
  listesLoaded=false; CHECKLISTS=[]; DONE={};
  if(!sb) { listesLoaded=true; return; }
  let cl=[];
  try{ const {data}=await sb.from('checklists').select('id,liste,tache,ordre').order('ordre'); cl=data||[]; }catch(e){}
  const groups={},order=[];
  cl.forEach(t=>{ if(!groups[t.liste]){groups[t.liste]=[];order.push(t.liste);} groups[t.liste].push(t); });
  // On voit toutes les listes auxquelles la base donne accès, mais les siennes d'abord.
  CHECKLISTS=order.map(k=>({liste:k,taches:groups[k],mienne:MES_LISTES.indexOf(k)>=0}))
                  .sort((a,b)=>(b.mienne-a.mienne)||(listeRank(a.liste)-listeRank(b.liste)));
  try{
    const {data:done}=await sb.from('checklist_faites').select('tache_id').eq('jour',todayStr());
    (done||[]).forEach(d=>DONE[d.tache_id]=true);
  }catch(e){}
  listesLoaded=true;
}
async function toggleTache(id){
  const on=!DONE[id];
  if(on) DONE[id]=true; else delete DONE[id];
  render();                                    // la coche répond tout de suite
  if(!sb||!PROFILE||!PROFILE.uid) return;
  try{
    if(on) await sb.from('checklist_faites').upsert({user_id:PROFILE.uid,tache_id:id,jour:todayStr()},{onConflict:'user_id,tache_id,jour'});
    else   await sb.from('checklist_faites').delete().match({user_id:PROFILE.uid,tache_id:id,jour:todayStr()});
  }catch(e){ toast('Pas enregistré'); }
}
async function resetListe(nom){
  const g=CHECKLISTS.find(x=>x.liste===nom); if(!g) return;
  const ids=g.taches.filter(t=>DONE[t.id]).map(t=>t.id);
  if(!ids.length){ toast('Rien à décocher'); return; }
  if(!confirm('Tout décocher dans « '+(LISTE_LABELS[nom]||nom)+' » ?')) return;
  try{
    await sb.from('checklist_faites').delete().eq('user_id',PROFILE.uid).eq('jour',todayStr()).in('tache_id',ids);
    ids.forEach(i=>delete DONE[i]);
    render(); toast('Liste remise à zéro');
  }catch(e){ toast('Impossible de remettre à zéro'); }
}
/* Ce qui reste à cocher dans SES listes — c'est ce chiffre qui compte sur l'accueil. */
function resteAListe(){
  let n=0;
  CHECKLISTS.filter(g=>g.mienne).forEach(g=>g.taches.forEach(t=>{ if(!DONE[t.id]) n++; }));
  return n;
}

/* ---------- LES ÉTOILES SUIVENT LA PERSONNE, PAS LE TÉLÉPHONE ----------
   Le téléphone garde sa copie : c'est elle qui s'affiche hors ligne et pendant la
   seconde où la base répond. La base n'écrase le téléphone que si la lecture a
   VRAIMENT réussi — sinon on ne touche à rien : plutôt une étoile en trop qu'une
   étoile perdue. */
const FAV_MIGRE='lux_fav_en_base';
function favEcrire(sid,actif){
  if(!sb||!sid||!PROFILE||!PROFILE.uid) return;   // pas connecté : le téléphone suffit
  try{
    if(actif) envoiMuet(sb.from('favoris').insert({user_id:PROFILE.uid,sid:sid}));
    else      envoiMuet(sb.from('favoris').delete().eq('user_id',PROFILE.uid).eq('sid',sid));

async function loadFavoris(){
  if(!sb||!PROFILE||!PROFILE.uid) return false;
  let enBase;
  try{
    const {data:rows,error}=await sb.from('favoris').select('sid');
    if(error) return false;                       // table absente ou hors ligne : on garde le téléphone
    enBase=new Set((rows||[]).map(r=>r.sid));
  }catch(e){ return false; }
  /* Première fois sur cet appareil : on REMONTE les étoiles déjà posées ici au lieu
     de les effacer. Une seule fois — ensuite c'est la base qui fait foi, sinon une
     étoile retirée sur le téléphone A reviendrait depuis le téléphone B. */
  let premiere=false;
  try{ premiere=!localStorage.getItem(FAV_MIGRE); }catch(e){}
  if(premiere){
    const aRemonter=[...FAVS].filter(s=>s&&!enBase.has(s));
    if(aRemonter.length){
      try{
        await sb.from('favoris').insert(aRemonter.map(s=>({user_id:PROFILE.uid,sid:s})));
        aRemonter.forEach(s=>enBase.add(s));
      }catch(e){}
    }
    try{ localStorage.setItem(FAV_MIGRE,'1'); }catch(e){}
  }
  const avant=[...FAVS].sort().join('|');
  FAVS=enBase; favSave();
  const change=avant!==[...FAVS].sort().join('|');
  if(change) render();
  return change;
}

async function initAuth(){
  if(!sb){
    // Hors ligne : un compte déjà connecté ici garde la porte ouverte.
    let dejaLa=false; try{ dejaLa=!!localStorage.getItem('cousin_auth_ok'); }catch(e){}
    if(dejaLa){ hideGate(); return; }
    showMessage("Connecte-toi à internet pour ouvrir COUSIN.");
    return;
  }
  // Retour de Google : on échange le code d'autorisation contre une session.
  try{
    const code=new URL(location.href).searchParams.get('code');
    const errDesc=new URL(location.href).searchParams.get('error_description');
    if(errDesc){ showMessage("Google a refusé : "+errDesc+"\n\n(capture d'écran à envoyer)"); return; }
    if(code){
      const {error}=await sb.auth.exchangeCodeForSession(code);
      // On efface le code de Google de l'adresse, sans casser la navigation interne.
      history.replaceState(history.state,'',location.origin+location.pathname+(location.hash||''));
      if(error){ showMessage("Connexion échouée : "+error.message+"\n\n(fais une capture et envoie-la)"); return; }
    }
  }catch(e){ showMessage("Connexion échouée : "+(e&&e.message?e.message:e)+"\n\n(fais une capture et envoie-la)"); return; }

  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!session){ showLogin(); return; }
  const ok=await checkAllowed();
  if(!ok){
    // Une demande déjà envoyée ? On rassure plutôt que de reproposer le bouton.
    let dejaDemande=false;
    try{
      const {data:dq}=await sb.from('access_requests').select('statut')
        .ilike('email',session.user.email||'').eq('statut','en_attente').limit(1);
      dejaDemande=Array.isArray(dq)&&dq.length>0;
    }catch(e){}
    if(dejaDemande){
      showMessage("Ta demande est en cours.\n\nMag la validera bientôt. Reviens sur cette page dans quelques heures : dès qu'elle a validé, tu entres directement, sans rien faire de plus.");
      const rq=_g('authReq'); if(rq) rq.style.display='none';
      return;
    }
    const emailDem=(session.user.email||'');
    const pro=/@samusocial\.be$/i.test(emailDem);
    showMessage("Ton compte "+emailDem+" n'est pas encore autorisé.\n\nDemande l'accès ci-dessous : Mag reçoit ta demande et te débloque."
      +(pro?"":"\n\n⚠ C'est une adresse personnelle. Si tu as une adresse @samusocial.be, déconnecte-toi et reviens avec celle-là : c'est celle qu'on utilise dans l'équipe. Sinon, dis-nous qui tu es dans le mot ci-dessous."));
    window._reqEmail=session.user.email||'';
    try{ const mt=session.user.user_metadata||{}; window._reqNom=mt.full_name||mt.name||''; }catch(e){}
    const rq=_g('authReq'); if(rq) rq.style.display='inline-flex';
    const ch=_g('authMot'); if(ch) ch.style.display='block';
    return;
  }
  try{ localStorage.setItem('cousin_auth_ok',session.user.email||'1'); }catch(e){}
  markSeen(session.user);
  hideGate();
  // On connaît son nom avant d'afficher l'accueil : le bonjour ne clignote pas.
  loadProfile().then(function(){ render(); });
}

/* ---------- démarrage ---------- */
current=parseRoute();
render();
initAuth();
</script>
</body>
</html>
