.role i.pt{width:13px;height:13px;flex:none}
.role b{flex:1;font-size:15px;font-weight:500}
.role .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;color:#8b8984}
.role .sg{font-size:19px;color:rgba(27,27,27,.35)}
/* Une case de constat qui s'ouvre VRAIMENT prend la robe des boutons : blanche,
   cerclée de noir. Le filet gris fin contre le filet noir ne se distinguait pas
   sur un téléphone — on appuyait dans le vide (Mag, 07/08/2026). */
.role.ouvre{background:#fdfdfc;border:1.5px solid var(--noir)}
@media (hover:hover){
  .role.ouvre:hover{background:var(--noir);color:#f2eee6}
  .role.ouvre:hover .n,.role.ouvre:hover .sg{color:rgba(242,238,230,.65)}
}
.tour{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid #dcdad5}
.tour i{width:14px;height:14px;flex:none}
.tour b{flex:1;font-size:15.5px;font-weight:500}
.tour em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:#8b8984}
.msg{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:15px;color:var(--noir)}
/* ÉPINGLÉ : crème à gros filet doré, pas une dalle noire — la carte noire faisait
   sévère et assombrissait tout le haut du fil (Mag, 06/08/2026). */
.msg.epingle{background:#fdfdfc;color:var(--noir);border-color:var(--noir);
  border-left:7px solid #d9a20b;padding-left:14px}
.msg.epingle .lab{color:#b7862c}
.msg .top{display:flex;align-items:center;gap:10px}
.msg .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex:none;font-size:14px;font-weight:600;color:var(--noir)}
.msg .top .tx{flex:1;min-width:0}
.msg .top b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.msg .top em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:1px}
.msg .lab{display:flex;align-items:center;gap:8px;font-family:ui-monospace,monospace;font-size:9px;
  font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:#f5c542;margin-bottom:10px}
.msg .lab .ic{width:14px;height:14px;flex:none}
.msg p{font-size:15px;line-height:1.45;margin:11px 0 0}
.avgrand{width:64px;height:64px;border-radius:50%;background:var(--noir);color:#f2eee6;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none}
.pident{display:flex;align-items:center;gap:14px;padding:16px 0 0}
.pident .tx b{display:block;font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.pident .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.16em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.acc{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:13px 14px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir)}
.acc.open{background:var(--noir);color:#f2eee6}
.acc b{flex:0 0 auto;font-size:15.5px;font-weight:500;min-width:0}
.acc .n{flex:1;text-align:right}
.acc .n{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .sg{font-size:19px}
.accin{padding-left:14px;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.badge{display:inline-flex;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;background:#f6e7a8;color:var(--noir);padding:3px 8px;border-radius:999px}

/* ══════ LES JEUX — armature commune (refonte du 06/08/2026) ══════
   Tout se joue dans une colonne de 560 px maximum, centrée : sur un écran
   d'ordinateur, une question qui traverse 1200 px ne se lit pas, et les boutons
   deviennent des barres sans fin (Mag : « beaucoup trop large »). */
#view .jxwrap,#view .pf-wrap,.jxwrap,.pf-wrap{max-width:560px;margin:0 auto;width:100%}
.jxtete{display:flex;align-items:center;gap:12px;padding:0 0 14px;border-bottom:2px solid var(--noir);margin-bottom:18px}
.jxback{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--noir);flex:none;
  display:flex;align-items:center;justify-content:center}
.jxback .ic{width:14px;height:14px}
.jxpic{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.jxpic .ic{width:24px;height:24px}
.jxtx{flex:1;min-width:0}
.jxtx b{display:block;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.025em;line-height:1}
.jxtx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.jxpied{display:flex;gap:9px;margin-top:18px}
.jxrejouer{flex:1;background:var(--noir);color:#f2eee6;border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.jxautre{flex:1;border:1.5px solid var(--noir);border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
@media (hover:hover){ .jxrejouer:hover{filter:brightness(1.25)} .jxautre:hover{background:var(--noir);color:#f2eee6} }

/* L'ÉCRAN DE FIN, le même pour les huit jeux. Les erreurs portent un gros filet
   rouge à gauche : c'est un ÉTAT, pas une identité — le rouge des urgences reste
   réservé aux urgences, qui sont des cases pleines, pas des filets. */
.jxf{padding-top:2px}
.jxf-tete{background:var(--noir);border-radius:8px 8px 0 0;padding:16px 16px 18px;color:#f0efed}
.jxf-sur{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em}
.jxf-tete b{display:block;font-size:34px;font-weight:700;line-height:1;margin-top:6px;letter-spacing:-.03em}
.jxf-chif{display:flex;border:1px solid var(--ligne);border-top:0;border-radius:0 0 8px 8px;background:#f6f5f3}
.jxf-chif>div{flex:1;padding:14px 16px}
.jxf-chif>div+div{border-left:1px solid var(--ligne)}
.jxf-chif .g{display:block;font-size:32px;font-weight:700;line-height:1;letter-spacing:-.03em}
.jxf-chif em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.jxf-sect{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  border-bottom:2px solid var(--noir);padding-bottom:6px;margin:24px 0 12px}
.jxf-c{border:1px solid var(--ligne);border-left:5px solid var(--rouge);background:#f6f5f3;
  padding:12px;margin-bottom:10px}
.jxf-c.ok{border-left-color:#6cb392}
.jxf-q{font-size:14.5px;font-weight:500;line-height:1.35}
.jxf-tien{margin-top:10px;font-size:13px;color:#8b8984;text-decoration:line-through}
.jxf-bonne{margin-top:6px;font-size:13.5px;line-height:1.4;display:flex;gap:6px}
.jxf-bonne i{font-style:normal;color:#6cb392;flex:none}
.jxf-pq{margin-top:10px;border-top:1px solid var(--ligne);padding-top:9px;font-size:12.5px;
  color:#73716b;line-height:1.5}
.jxf-pq b{color:var(--noir);font-weight:600}
.jxf-fiche{margin-top:10px;width:100%;border:1px solid var(--noir);border-radius:4px;padding:8px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}
.jxf-plier{width:100%;border:1px solid var(--ligne);border-radius:4px;padding:11px;font-size:13px;color:#73716b}
.jxf-rat{width:100%;margin-top:22px;background:var(--noir);color:#f0efed;border-radius:8px;padding:15px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.jxf-rien,.jxf-vide{font-size:13.5px;color:#73716b;line-height:1.5;padding:4px 2px 0}
.jxf-vide{margin-top:20px;border:1px solid var(--ligne);background:#f6f5f3;padding:13px;border-radius:6px}
@media (hover:hover){ .jxf-fiche:hover{background:var(--noir);color:#f0efed} .jxf-rat:hover{filter:brightness(1.3)} }

/* La correction : verte quand c'est juste, rouge quand ça ne l'est pas. */
.qc{border-radius:8px;padding:15px;margin-top:14px;border:1.5px solid var(--noir);background:#fdfdfc}
.qc.ok{border-color:#2f8f5b;background:#eef7f1}
.qc.ko{border-color:var(--rouge);background:#fdeeed}
.qc-h{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;margin-bottom:11px}
.qc.ok .qc-h{color:#2f8f5b} .qc.ko .qc-h{color:var(--rouge)}
.qc-rep{background:#fff;border:1px solid var(--ligne);border-radius:6px;padding:11px 12px}
.qc-lab{display:block;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984;margin-bottom:4px}
.qc-rep b{font-size:15.5px;font-weight:600;line-height:1.3}
.qc-txt{font-size:14px;line-height:1.5;color:#4a4844;margin:10px 0 0}
.qc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qc-chip{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(27,27,27,.07);border-radius:999px;padding:4px 9px;color:#4a4844}
.qc-btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;border:1.5px solid var(--noir);
  border-radius:6px;padding:10px 13px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;font-weight:500;background:#fff}
.qc-btn .ic{width:15px;height:15px}
@media (hover:hover){ .qc-btn:hover{background:var(--noir);color:#f2eee6} }

/* LA CARTE QUI SE RETOURNE POUR DE VRAI : une vraie rotation dans l'espace,
   comme une carte qu'on tourne entre les doigts (Mag : « il faut un effet »). */
/* Format d'une VRAIE carte à jouer : 5/7, comme un jeu de 54 (Mag, 08/08/2026).
   La largeur est bridée, sinon la carte s'étire avec l'écran et redevient un
   bandeau — c'est ce qui se passait sur ordinateur, où elle faisait 560 px de
   large pour 210 de haut. */
.jx-flip{perspective:1200px;margin:0 auto;cursor:pointer;max-width:330px;width:100%}
.jx-flip-in{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,1.1,.4,1)}
.jx-flip.on .jx-flip-in{transform:rotateY(180deg)}
.jx-flip .jx-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:12px;padding:22px 22px 62px;display:flex;flex-direction:column;justify-content:flex-end;
  color:#f2eee6;box-shadow:0 6px 20px rgba(27,27,27,.16);overflow:hidden}
/* LE BANDEAU QUI DIT DE RETOURNER (choix « 4 » de Mag, 08/08/2026 : « on ne voit
   pas qu'on doit la retourner »). Une barre qui ressemble à un bouton et qui dit
   le mot — aucune ambiguïté, même pour quelqu'un qui n'a jamais joué.
   ⚠ Le fond est TRANSLUCIDE et non noir : sur le dos, qui est déjà noir, un
   bandeau noir aurait disparu. C'est le filet crème du haut qui le détache dans
   les deux cas. */
.jx-flip .jx-bandeau{position:absolute;left:0;right:0;bottom:0;height:46px;
  background:rgba(27,27,27,.28);border-top:1.5px solid rgba(242,238,230,.45);
  display:flex;align-items:center;justify-content:center;gap:9px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#f2eee6}
.jx-flip .jx-bandeau svg{width:15px;height:15px;flex:none}
.jx-flip .jx-face.dos{transform:rotateY(180deg);background:var(--noir)}
.jx-flip .jx-face small{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.7}
.jx-flip .jx-face b{font-size:21px;font-weight:700;line-height:1.2;margin-top:10px}
.jx-flip .jx-face em{font-style:normal;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-top:14px}

/* ---- LES MODÈLES DE CHECK-LISTS ---- */
.modn{flex:none;width:22px;font-family:ui-monospace,monospace;font-size:10px;color:#8b8984;text-align:right}

@media (hover:hover){ .modb button:hover{background:var(--noir);color:#f2eee6} }

/* ---- LES STATISTIQUES : des barres, pas des camemberts ---- */
.stl{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--ligne)}
.stn{flex:0 0 38%;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stb{flex:1;height:9px;background:#e6e4df;border-radius:5px;overflow:hidden}
.stb i{display:block;height:100%;background:var(--noir);border-radius:5px}
.stc{flex:none;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.08em;color:#8b8984;min-width:34px;text-align:right}
.stjours{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:14px}
.stj{flex:1;height:100%;display:flex;align-items:flex-end}
.stj i{display:block;width:100%;background:#5b8fd4;border-radius:2px 2px 0 0}

/* ---- LA SALLE DE JEUX : les 8 jeux en cartes ---- */
/* Le rattrapage en tête de la salle de jeux : pleine largeur, noir, pour qu'on
   voie tout de suite que ce n'est pas une carte de jeu comme les autres. */
.jrat{display:flex;align-items:center;gap:13px;width:100%;margin-top:18px;
  background:var(--noir);color:#f0efed;border-radius:8px;padding:15px 16px;text-align:left}
.jrat .ic{width:26px;height:26px;flex:none;color:#f5c542}
.jrat .tx{flex:1;min-width:0}
.jrat b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.jrat em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(240,239,237,.6);margin-top:4px}
.jrat .n{flex:none;font-size:26px;font-weight:700;letter-spacing:-.03em}
@media (hover:hover){ .jrat:hover{filter:brightness(1.35)} }
.jgrille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-top:18px}
.jcarte{display:flex;flex-direction:column;align-items:flex-start;gap:0;border-radius:8px;
  padding:15px;text-align:left;color:var(--noir);min-height:134px}
.jcarte.sombre{color:#f2eee6}
.jcarte .ic{width:34px;height:34px;flex:none}
.jcarte b{font-size:17px;font-weight:600;line-height:1.1;margin-top:auto}
.jcarte em+*{margin-top:8px}

.jrec{margin-top:auto;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;

/* ---- LA PAGE ACTIVITÉS : deux blocs francs, le gratuit et l'Article 27 ----
   Avant, les deux se suivaient sans rien pour les séparer et on ne savait plus ce
   qu'on payait (Mag, 06/08/2026). Chaque bloc est maintenant encadré et porte son
   prix dans une pastille. */
.actbloc{border:1.5px solid var(--noir);border-radius:8px;padding:16px;margin-top:18px;background:#fdfdfc}
.actbloc.a27{background:#f6f5f3}

.actt em{font-style:normal;width:100%;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984}
.actbloc .frow2{border-bottom:1px solid var(--ligne)}
.actbloc .frow2:last-child{border-bottom:0}
.a27c{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 2px;
  border-bottom:1px solid var(--ligne)}
.a27c .tx{flex:1;font-size:14.5px;font-weight:500}
.a27c .n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;

.a27c.open{background:var(--noir);color:#f2eee6;border-radius:6px;padding-left:10px;padding-right:10px}
.a27c.open .n{color:rgba(242,238,230,.7)}
.a27l{padding:10px 2px 14px;border-bottom:1px solid var(--ligne)}
.a27l p{font-size:14px;margin:6px 0}

/* ---- LA FICHE D'URGENCE, qui monte du bas ---- */
.urgbg{position:fixed;inset:0;z-index:9997;background:rgba(27,27,27,.5);display:none;
  align-items:flex-end;justify-content:center}
.urgbg.on{display:flex}
.urgcard{width:100%;max-width:460px;background:var(--creme);border:2px solid var(--noir);
  border-radius:14px 14px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:86vh;overflow-y:auto;animation:monte .22s cubic-bezier(.22,1,.36,1)}
@keyframes monte{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.poignee{width:42px;height:4px;border-radius:3px;background:#c9c4b8;margin:0 auto 14px}
.urgt{border-left:6px solid var(--rouge);padding:2px 0 2px 13px;margin-bottom:14px}
.urgt b{display:block;font-size:22px;font-weight:700;line-height:1.15}
.urgt p{font-size:14px;line-height:1.45;color:#4a4844;margin:7px 0 0}
.ul{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--ligne)}
.ull{flex:none;width:88px;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984;padding-top:3px}
.ulv{flex:1;font-size:14.5px;line-height:1.4}
.urgnote{font-size:13.5px;line-height:1.5;color:#4a4844;background:#f6f5f3;border-radius:6px;
  padding:12px;margin-top:12px;white-space:pre-line}
.urgbas{display:flex;gap:9px;margin-top:16px}
.urgtel{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
  border-radius:8px;padding:16px;font-size:17px;font-weight:600;letter-spacing:.01em}
.urgtel .ic{width:20px;height:20px}
.urgiti{flex:none;display:flex;align-items:center;gap:8px;border:1.5px solid var(--noir);
  border-radius:8px;padding:16px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase}
.urgiti .ic{width:16px;height:16px}
.urgplus{width:100%;margin-top:12px;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;text-decoration:underline;padding:8px}

/* ---- LES FENÊTRES DE COUSIN (à la place de celles du navigateur) ---- */
.popbg{position:fixed;inset:0;z-index:9999;background:rgba(27,27,27,.5);display:none;
  align-items:center;justify-content:center;padding:20px}
.popbg.on{display:flex}
.popcard{width:100%;max-width:400px;background:var(--creme);border:2px solid var(--noir);
  border-radius:10px;padding:22px;box-shadow:0 18px 44px rgba(27,27,27,.3)}
.popcard b{display:block;font-size:22px;font-weight:700;text-transform:uppercase;
  letter-spacing:-.025em;line-height:1.05}
.popcard p{font-size:14.5px;line-height:1.5;color:#4a4844;margin:10px 0 0;white-space:pre-line}
.popcard p:empty{display:none}
.popcard input{width:100%;font:inherit;font-size:17px;font-weight:500;color:var(--noir);
  background:#fdfdfc;border:1.5px solid var(--noir);border-radius:6px;padding:12px 13px;margin-top:14px}
.popcard input:focus{outline:0;box-shadow:0 0 0 3px rgba(27,27,27,.12)}
.popbas{display:flex;align-items:center;gap:10px;margin-top:18px}
.popbas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#8b8984;padding:12px 4px}
.popbas .ok{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.popbas .ok.danger{background:var(--rouge)}
@media (hover:hover){ .popbas .ok:hover{filter:brightness(1.22)} .popbas .ann:hover{color:var(--noir)} }

/* ---- LA BOÎTE À IDÉES, ouvrable de partout ---- */
.ideebg{position:fixed;inset:0;z-index:9998;background:rgba(27,27,27,.42);display:none;
  align-items:flex-end;justify-content:center;padding:16px}
.ideebg.on{display:flex}
.ideecard{width:100%;max-width:420px;background:var(--creme);border:2px solid var(--noir);
  border-radius:8px;padding:18px;margin-bottom:calc(12px + env(safe-area-inset-bottom))}
.ideecard b{display:block;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em}
.ideecard p{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8b8984;margin:7px 0 0}
.ideecard textarea{width:100%;font:inherit;font-size:15px;color:var(--noir);background:#fdfdfc;
  border:1.5px solid var(--noir);border-radius:6px;padding:12px;margin-top:12px;resize:vertical}
.ideecard textarea:focus{outline:0}
.ideebas{display:flex;align-items:center;gap:10px;margin-top:12px}
.ideebas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}
.ideebas .pub{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

/* ---- LA SEMAINE DES POUBELLES (fiche « Jour des poubelles ») ---- */
/* ---- VOIR L'APP COMME LES AUTRES (barre d'aperçu, administration seulement) ---- */
/* Repliée : une boule. Noire et discrète au repos, DORÉE avec la lettre de la vue
   dès qu'un aperçu tourne — le seul rappel permanent qu'on ne regarde pas sa vue. */
.bboule{position:fixed;left:12px;bottom:calc(var(--tab-h) + 10px);z-index:60;
  width:46px;height:46px;border-radius:50%;background:var(--noir);color:#f2eee6;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 16px rgba(27,27,27,.28);transition:transform .16s ease}
.bboule .ic{width:21px;height:21px}
.bboule.actif{background:#d9a20b;color:var(--noir);box-shadow:0 0 0 3px rgba(217,162,11,.28),0 5px 16px rgba(27,27,27,.28)}
.bboule .bl{font-family:ui-monospace,monospace;font-size:13px;font-weight:500;letter-spacing:.02em}
.bboule.actif .bl{font-size:12px}
@media (hover:hover){ .bboule:hover{transform:scale(1.08)} }
/* Sur grand écran, « Voir comme » vit dans le rail noir : plus de boule qui flotte. */
@media (min-width:900px){ .bboule{display:none} }
#tabbar .railsec button.on{background:#f2eee6;color:var(--noir);opacity:1;border-left-color:#f2eee6}
#tabbar .railsec button.on .ic{color:var(--noir)}
#tabbar .railsec button.vueon{background:rgba(217,162,11,.22);border-left-color:#d9a20b;opacity:1}
#tabbar .railsec button.vueon .ic{color:#d9a20b}
.bascule .bplier{position:absolute;top:6px;right:10px;font-size:20px;line-height:1;color:rgba(242,238,230,.6)}
.bascule{position:fixed;left:12px;bottom:calc(var(--tab-h) + 10px);z-index:60;background:var(--noir);
  color:#f2eee6;border-radius:8px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;
  max-width:calc(100vw - 24px);box-shadow:0 6px 22px rgba(27,27,27,.25)}
.bascule.actif{outline:2px solid var(--jaune)}
.bascule b{font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;opacity:.65}
.bascule .bgrp{display:flex;gap:5px;flex-wrap:wrap}
.bascule .bgrp button{font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;color:#f2eee6;border:1px solid rgba(242,238,230,.32);border-radius:999px;padding:5px 10px}
.bascule .bgrp button.on{background:#f2eee6;color:var(--noir);border-color:#f2eee6}
.bascule .bmet{font:inherit;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:#f2eee6;background:rgba(242,238,230,.1);
  border:1px solid rgba(242,238,230,.32);border-radius:6px;padding:7px 9px;max-width:230px}
.bascule .bmet option{color:#1b1b1b;background:#f2eee6}
.bascule .bfin{align-self:flex-start;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--jaune);text-decoration:underline}
.bascule em{font-style:normal;font-size:11px;line-height:1.4;opacity:.72;max-width:240px}
/* La bascule Écran/Téléphone n'a de sens que sur un grand écran. */
@media (max-width:899px){ .bascule .becran{display:none} }
/* Sur grand écran, la barre se pose À DROITE du rail, sinon elle le recouvre. */
@media (min-width:900px){ .bascule{left:248px;bottom:16px} }
.teltest{display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 0 8px}
/* Le téléphone est TOUJOURS visible en entier : s'il ne tient pas dans la hauteur de
   l'écran, on le dessine plus petit — sans toucher à sa largeur intérieure de 414 px,
   sinon ce ne serait plus la mise en page d'un téléphone (Mag, 06/08/2026). */
.telzoom{transform-origin:top center;transition:transform .16s ease}
.telcadre{width:414px;height:812px;border:12px solid var(--noir);border-radius:38px;
  overflow:hidden;background:#f0efed;box-shadow:0 10px 34px rgba(27,27,27,.22)}
.telcadre iframe{width:100%;height:100%;border:0;display:block}
.teltest p{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}

/* La confirmation d'ajout dans l'Admin : elle reste à l'écran, elle ne passe pas. */
.admok{border:2px solid #2f8f5b;border-radius:6px;background:#eef7f1;padding:12px 13px;margin-top:12px}
.admok.rate{border-color:var(--rouge);background:#fdeeed}
.admok b{display:block;font-size:14.5px;line-height:1.35}
.admok span{display:block;font-size:13px;color:#4a4844;margin-top:5px}

.pquand,.pastuce{display:flex;align-items:flex-start;gap:11px;border:1.5px solid var(--noir);
  border-radius:6px;background:#fdfdfc;padding:13px 14px;margin-top:16px;font-size:14.5px;line-height:1.45}
.pquand .ic,.pastuce .ic{width:19px;height:19px;flex:none;margin-top:2px}
.pastuce{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.psem{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pj{border:1px solid var(--ligne);border-radius:6px;background:#f6f5f3;padding:13px 14px}
.pj.auj{border:2px solid var(--noir);background:#fdfdfc}
.pjt{display:flex;align-items:baseline;gap:10px}
.pjt b{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:-.02em}
.pjt em{font-style:normal;margin-left:auto;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:#8b8984}
.psacs{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:11px}
/* Un sac poubelle : noué en haut, ventru en bas. */
.psacs .sac{width:22px;height:27px;flex:none;border-radius:4px 4px 9px 9px;
  clip-path:polygon(28% 0,72% 0,100% 26%,100% 100%,0 100%,0 26%)}
.psacs .psl{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-left:6px}

/* ---- LE FIL : écrire, réagir ---- */
/* Repliée, la zone d'écriture n'est qu'une ligne : le fil commence tout de suite. */
.fcpli{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:14px;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--noir);margin-top:16px}
.fcpli .ic{width:20px;height:20px;flex:none}
.fcpli b{flex:1;font-size:15px;font-weight:500;color:#8b8984}
.fcomp{border-radius:6px;background:#fdfdfc;border:1.5px solid var(--noir);padding:14px;margin-top:16px}
.fcomp textarea{width:100%;font:inherit;font-size:15px;color:var(--noir);background:transparent;border:0;
  resize:vertical;min-height:64px;margin-top:12px}
.fcomp textarea:focus{outline:0}
.fchips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;
  padding:5px 11px;font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;background:#f6f5f3}
.fchip .ic{width:13px;height:13px;color:var(--fc,#1b1b1b)}
.fchip.on{background:var(--noir);color:#f2eee6;border-color:var(--noir)}
.fchip.on .ic{color:var(--fc,#f2eee6)}
.fcbas{display:flex;align-items:center;gap:10px;margin-top:12px}
.fcbas .pub{flex:1;background:var(--noir);color:#f2eee6;border-radius:6px;padding:12px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.fcbas .ann{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984}
.frx{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.frx button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;
  padding:5px 10px;background:#f6f5f3;transition:transform .14s ease}
.frx button .ic{width:15px;height:15px}
.frx button em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;font-weight:500}
.frx button.moi{background:var(--noir);border-color:var(--noir);color:#f2eee6}
@media (hover:hover){.frx button:hover{transform:translateY(-1px)}}
/* Épingler et Supprimer sont de VRAIS boutons, pas du texte gris qu'on ne voit pas
   (Mag, 06/08/2026). Supprimer porte le rouge : c'est ce qu'on ne défait pas. */
.fsup{margin-left:auto;font-family:ui-monospace,monospace;font-size:9px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--noir);border-radius:999px;
  padding:6px 12px;background:#fdfdfc;color:var(--noir)}
.fsup.sup{border-color:var(--rouge);color:var(--rouge)}
@media (hover:hover){
  .fsup:hover{background:var(--noir);color:#f2eee6}
  .fsup.sup:hover{background:var(--rouge);color:#fff;border-color:var(--rouge)}
}

/* ---- les chambres (rapatrié de l'app principale, habillé Lux) ---- */
.chadd{display:flex;gap:8px;margin:10px 0 10px}
.chadd input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--noir);background:#f4f3f0;
  border:1px solid var(--ligne);border-radius:0;padding:11px 12px}
.chadd input:focus{outline:0;border-color:var(--noir)}
.chaddbtn{flex:none;background:var(--noir);color:#f2eee6;border-radius:0;padding:11px 16px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.chrgpd{display:flex;gap:10px;border:1px solid var(--ligne);border-left:7px solid #f5c542;background:#f4f3f0;
  padding:11px 12px;font-size:12.5px;color:var(--enc2);line-height:1.45;margin-bottom:14px}
.chrgpd .ic{width:18px;height:18px;flex:none;color:var(--noir);margin-top:1px}
.chrgpd b{color:var(--noir)}
.chc{border:1px solid var(--ligne);background:#f4f3f0;margin-bottom:8px}

.chh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px;background:transparent;border:0;border-radius:0}
.chnum{font-size:19px;font-weight:700}
.chini{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--noir);background:rgba(27,27,27,.09);padding:3px 7px}
.chg{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--noir);flex:none}
.chprog{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:var(--enc2)}
.chfin{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;

.chchev{width:13px;height:13px;flex:none;color:var(--enc2)}
.chcorps{border-top:1px solid var(--ligne);padding:4px 12px 10px}
.chet{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:transparent;

.chet:last-of-type{border-bottom:0}
.chet i{font-style:normal;width:22px;height:22px;flex:none;border:1.5px solid var(--noir);background:transparent;

.chet b{display:block;font-size:14px;font-weight:600;line-height:1.2}
.chet em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;

/* Réseau : le picto dans le coin bas-droit de la case (demande de Mag, 05/08/2026). */

.psq .ic{width:30px;height:30px}
.tn2{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;

.foot{padding:22px 0 30px;text-align:center;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:#a3a19c}
.foot .sign{letter-spacing:.1em;text-transform:none;font-weight:600}

/* ---- rail des domaines : cases au trait collées, l'active s'inverse (choix « 2 » de Mag) ---- */
.rail{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:2px var(--pad) 14px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 13px 12px;color:var(--noir);background:#f4f3f0;
  border:1px solid var(--ligne);border-right:0;border-radius:0;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.rail button:last-child{border-right:1px solid var(--ligne)}
.rail button .ic{width:24px;height:24px}
.rail button.on{background:var(--noir);color:#f2eee6}

/* ---- barre haute des sous-vues ---- */
.subtop{position:sticky;top:calc(67px + env(safe-area-inset-top));z-index:30;background:var(--creme);
  margin:0 calc(-1 * var(--pad));padding:10px var(--pad);
  display:flex;align-items:center;gap:12px}
.cbtn{width:38px;height:38px;flex:none;border-radius:0;background:transparent;
  border:1.5px solid var(--noir);display:flex;align-items:center;justify-content:center;transition:transform .1s ease}
.cbtn:active{transform:scale(.92)}
.cbtn .ic{width:14px;height:14px}
.subtop h1{font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtop .count{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:var(--enc2);flex:none}
/* Pages de domaine : bandeau noir + pastille couleur (mélange « 3 + 2 » choisi par Mag). */
.subtop.noir{background:var(--noir)}
.subtop.noir h1{color:#f2eee6;white-space:normal;overflow:visible;line-height:1.1}
.subtop.noir .cbtn{border-color:#f2eee6;color:#f2eee6}
.pastille{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;font-weight:500;
  padding:4px 9px;color:var(--noir);flex:none;white-space:nowrap}

/* ---- BANDEAU DE TITRE D'ÉCRAN (handoff Claude Design, 06/08/2026) ----
   Bloc noir pleine largeur : surtitre machine en couleur d'accent, gros titre 38px,
   picto 36px de la couleur d'accent à droite. La première carte de contenu remonte
   de 12px pour chevaucher le bandeau. */
.hero{position:sticky;top:calc(67px + env(safe-area-inset-top));z-index:30;
  background:var(--noir);color:#f2eee6;margin:0 calc(-1 * var(--pad));
  padding:18px var(--pad) 20px;display:flex;align-items:flex-end;gap:12px}
.hero .htx{flex:1;min-width:0}
.hero .hsur{display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:500}
.hero h1{display:block;font-size:38px;font-weight:700;text-transform:uppercase;
  letter-spacing:-.035em;line-height:.9;margin-top:6px;color:#f2eee6}
.hero .hpic{width:36px;height:36px;flex:none}
.hero .hpic .ic{width:100%;height:100%}
.hero .cbtn{width:36px;height:36px;border-radius:50%;border-color:#f2eee6;color:#f2eee6;align-self:center}
.hero .cbtn .ic{width:13px;height:13px}
.apreshero{margin-top:-12px;position:relative;z-index:1}

/* ---- Cartes de domaines : bande de couleur en haut (handoff) ---- */
.dgrid.res{grid-template-columns:repeat(2,1fr);gap:10px;border:0;margin-bottom:16px}
.dgrid.res .tile{background:#f6f5f3;border:1px solid #dcdad5;border-radius:6px;overflow:hidden;
  padding:0;min-height:134px}
.dgrid.res .tile .bande{height:8px;display:block;flex:none}
.dgrid.res .tile .tin{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1}
.dgrid.res .tile b{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;line-height:1.5}
.dgrid.res .tile .tn2{display:block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;
  color:var(--enc2);font-weight:500;margin:0}
.dgrid.res .tile .pi{margin:auto 0 0 auto;width:38px;height:38px}
/* Au survol comme au clic, la carte reste CLAIRE et son picto reste NOIR :
   les cartes du Réseau ne s'inversent pas (l'ancienne grille, elle, le faisait —
   d'où le picto qui pâlissait). Mag, 06/08/2026. */
@media (hover:hover){
  .dgrid.res .tile:hover{background:#fdfdfc;color:var(--noir);border-color:var(--noir)}
  .dgrid.res .tile:hover b{color:var(--noir)!important}
  .dgrid.res .tile:hover .tn2,.dgrid.res .tile:hover small{color:var(--enc2)}
  .dgrid.res .tile:hover .pi,.dgrid.res .tile:hover .ic{color:var(--noir)}
}
.dgrid.res .tile:active{background:#fdfdfc;color:var(--noir);border-color:var(--noir)}
.dgrid.res .tile:active b{color:var(--noir)!important}
.dgrid.res .tile:active .tn2,.dgrid.res .tile:active small{color:var(--enc2)}
.dgrid.res .tile:active .pi,.dgrid.res .tile:active .ic{color:var(--noir)}

/* ---- filtres : cases au trait ---- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:12px var(--pad) 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 13px;border-radius:0;border:1px solid var(--noir);color:var(--noir);background:transparent}
.chip.on{background:var(--noir);color:#f4f3f1}

/* ---- listes de fiches : le registre ---- */
.cards{display:flex;flex-direction:column;gap:0;padding:12px 0 30px}
.fcard{cursor:pointer;display:flex;align-items:center;gap:14px;text-align:left;width:100%;
  background:transparent;border:0;border-bottom:1px solid var(--ligne);border-radius:0;
  padding:14px 2px;transition:background .1s ease}
.fcard:active{background:rgba(27,27,27,.05)}
.fpi{width:26px;height:26px;flex:none}
.fpi .ic{width:100%;height:100%}
.fcard .tx{flex:1;min-width:0}
.fcard .tx b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.fcard .tx small{display:block;font-size:12.5px;color:var(--enc2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.utag{display:inline-block;font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--rouge);border:1px solid var(--rouge);padding:1px 6px;margin-bottom:3px}
.heart{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;
  color:#b5b3ae;transition:transform .12s ease}
.heart:active{transform:scale(1.25)}
.heart .ic{width:18px;height:18px}
.heart.on{color:#d9a20b}
.empty{padding:60px 20px;text-align:center;color:var(--enc2)}
.empty .ic{width:40px;height:40px;margin:0 auto 14px;opacity:.5}
.empty b{display:block;color:var(--noir);font-size:16px;margin-bottom:6px}
.empty p{font-size:14px}
.ghead{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--noir);margin:20px 0 10px}
.dayh{font-size:14px;font-weight:600;text-transform:uppercase;margin:14px 0 4px}
.dayh.auj{color:var(--rouge)}

/* ---- formations : carte blanche cerclée de noir (choix « 2 » de Mag, 05/08/2026) ---- */
.flc{background:#fff;border:2px solid var(--noir);border-radius:0;margin-bottom:12px;padding:13px 13px 12px;cursor:pointer}
.flc .ft{display:flex;gap:11px;align-items:flex-start;text-align:left}
.flc .frond{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--noir)}
.flc .frond .ic{width:18px;height:18px}
.flc .ftx{flex:1;min-width:0}
.flc .ftx b{font-size:14.5px;font-weight:600;line-height:1.2;display:block}
.flc .ftx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--enc2);margin-top:3px}
.flc .fet{margin-top:11px;border-top:1px solid var(--ligne)}
.flc .fe{display:flex;gap:10px;align-items:center;width:100%;text-align:left;
  border:0;border-bottom:1px solid var(--ligne);border-radius:0;padding:8px 2px;font-size:13px;background:transparent}
.flc .fe i{font-style:normal;width:20px;height:20px;flex:none;border:1.5px solid var(--noir);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.flc .fe.faite i{background:#6cb392;border-color:#6cb392}
.flc .fe.faite span{color:var(--enc2);text-decoration:line-through}
.flc .ftest{display:inline-flex;align-items:center;gap:8px;margin-top:11px;border:1px solid var(--noir);border-radius:0;
  padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;background:transparent}
.flc .ftest .ic{width:14px;height:14px}

/* ---- fiche : en-tête cadré, couleur du domaine ---- */
.fhead{border-top:1px solid var(--ligne);border-bottom:1px solid var(--ligne);
  padding:18px 2px;display:flex;gap:14px;align-items:flex-start}
.fhead .ftx{flex:1;min-width:0}
.fhead h1{font-size:22px;font-weight:700;line-height:1.15;margin-bottom:8px}
.fhead .meta{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--enc2);line-height:1.8}
.fhead .fpi2{width:54px;height:54px;flex:none}
.fhead .fpi2 .ic{width:100%;height:100%}
.fbody{padding:0 0 40px;max-width:720px}
.fbody .desc{font-size:15.5px;line-height:1.55;padding:14px 2px;border-bottom:1px solid var(--ligne);white-space:pre-line;margin:0}
.hr{display:none}
.rowline{display:flex;align-items:flex-start;gap:15px;padding:13px 2px;border-bottom:1px solid var(--ligne)}
.rowline .ic{width:20px;height:20px;margin-top:2px;color:var(--fcol,#1b1b1b)}
.rowline .rt{flex:1;min-width:0}
.rowline .rt b{display:block;font-size:14px;font-weight:500}
.rowline .rt span{display:block;font-size:14px;color:var(--enc2);margin-top:1px;white-space:pre-line;overflow-wrap:break-word}
.rowline .go{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;text-decoration:underline;flex:none;margin-top:5px}
.srcnote{font-size:12.5px;color:var(--enc2);border:1px solid var(--ligne);padding:12px 14px;margin-top:16px;white-space:pre-line}
.bloc{background:transparent;border:1px solid var(--ligne);border-radius:0;padding:15px;margin:12px 0}
.bloc>b{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;text-transform:uppercase;
  letter-spacing:.03em;margin-bottom:7px}
.bloc>b .ic{width:17px;height:17px}
.bloc p{font-size:14.5px;color:#3c3c3c;white-space:pre-line;overflow-wrap:break-word}
.bloc.warn{background:var(--jaune);border-color:var(--noir)}
.bloc.warn p{color:#3a3208}
.copybox{background:transparent;border:1px solid var(--ligne);border-radius:0;padding:15px;margin:12px 0}
.copybox .lab{display:flex;align-items:center;gap:10px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--enc2);margin-bottom:6px}
/* Chaque bloc a son propre bouton de copie : l'objet et le corps se copient séparément. */
/* LES CROCHETS VIVANTS : pastilles à choisir, petits champs à écrire — dans la phrase. */
.nchoix{display:inline-flex;flex-wrap:wrap;gap:4px;vertical-align:baseline}
.nopt{border:1.5px solid var(--noir);border-radius:999px;padding:2px 10px;font-size:13.5px;
  font-weight:500;background:#fdfdfc;color:var(--noir);line-height:1.4}
.nopt.on{background:var(--noir);color:#f2eee6}
@media (hover:hover){ .nopt:hover{background:var(--jaune);border-color:var(--noir);color:var(--noir)} }
.nfill{font:inherit;font-size:14px;font-weight:500;color:var(--noir);background:#fff7d6;
  border:0;border-bottom:1.5px solid var(--noir);padding:1px 6px;min-width:120px;max-width:100%}
.nfill:focus{outline:0;background:#fff}
.nfill::placeholder{font-weight:400;color:#8b8984}

.cbcop{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ligne);border-radius:999px;padding:4px 10px;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--noir);background:#fdfdfc}
.cbcop .ic{width:12px;height:12px}
@media (hover:hover){ .cbcop:hover{background:var(--noir);color:#f2eee6} }
.copybox p{font-size:14.5px;white-space:pre-wrap;overflow-wrap:break-word}
.rich{font-size:15px;line-height:1.5;padding-top:12px}
.rich h2,.rich h3{margin:18px 0 8px}
.rich p{margin-bottom:10px}
.rich ul,.rich ol{margin:0 0 10px 20px}
.fchips{display:none}

/* ---- barre d'appel de la fiche ---- */
.ctabar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--creme);border-top:1.5px solid var(--noir);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.ctabar .info{flex:1;min-width:0}
.ctabar .info b{display:block;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctabar .info small{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--enc2)}
.btn-main{flex:none;display:inline-flex;align-items:center;gap:9px;color:#1b1b1b;
  font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;border-radius:0;
  padding:14px 22px;transition:transform .1s ease}
.btn-main:active{transform:scale(.96)}
.btn-main .ic{width:16px;height:16px}

/* ---- urgences ---- */
.urg-vital{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rouge);margin-bottom:12px}
.urg-vhalf{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:16px 8px;color:#f4f3f1;text-align:center;background:var(--rouge);transition:transform .16s ease}
.urg-vhalf:first-child{border-right:1px solid rgba(242,238,230,.4)}
.urg-vhalf:active{transform:scale(.98)}
.urg-vhalf .ic{width:20px;height:20px;color:#f4f3f1}
.urg-vhalf b{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.urg-vhalf em{font-style:normal;font-size:22px;font-weight:700;letter-spacing:.5px}
.urgwrap{border:1px solid var(--ligne);border-bottom:0}
.urg-catbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-radius:0;border-bottom:1px solid var(--ligne);border-left:7px solid transparent;
  padding:13px 13px;margin:0;color:var(--noir);background:transparent;
  text-align:left;transition:background .12s ease}
.urg-catbtn:active{background:rgba(27,27,27,.05)}
.urg-cbleft{display:flex;align-items:center;gap:12px;min-width:0}
.urg-cbic{flex:none;width:24px;height:24px;border-radius:0;background:transparent;color:var(--noir);
  display:flex;align-items:center;justify-content:center}
.urg-cbic .ic{width:22px;height:22px}
.urg-cblab{font-weight:600;font-size:15px;letter-spacing:-.01em;text-transform:uppercase;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urg-cbright{flex:none;display:flex;align-items:center;gap:11px}
.urg-cbn{font-family:ui-monospace,monospace;font-size:11.5px;letter-spacing:.1em;color:#6b6965}
.urg-cbsign{flex:none;font-weight:600;font-size:17px;color:var(--noir)}
.urg-acc{border-bottom:0}
.urg-acc.open{border-bottom:1px solid var(--ligne)}
.urg-acc .urg-slider{padding:10px 12px 12px}
.urg-cbsign::after{content:'+'}
.urg-catbtn.open .urg-cbsign::after{content:'−'}
.urg-acc{height:0;overflow:hidden;transition:height .36s cubic-bezier(.22,1,.36,1)}
.urg-acc-inner{opacity:.3;transition:opacity .34s ease}
.urg-acc.open .urg-acc-inner{opacity:1}
.urg-slider{display:flex;gap:9px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.urg-slider::-webkit-scrollbar{display:none}
/* Cases d'appel « de nuit » (choix « 2 » de Mag) : case noire, nom crème,
   numéro à la couleur de la catégorie, picto rouge. */
.urg-sq{flex:0 0 auto;width:124px;min-height:106px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:7px;text-align:center;background:var(--noir);border:1px solid var(--noir);border-radius:0;
  padding:13px 10px;color:#f2eee6;overflow:hidden;transition:background .16s ease;cursor:pointer}
.urg-sq:active{background:#333}
.urg-sq .ic{width:24px;height:24px;color:var(--rouge)}
.urg-sq-tx{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
.urg-sq b{font-size:13px;font-weight:600;line-height:1.12;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.urg-sq em{font-style:normal;font-size:12.5px;font-weight:600;color:var(--rouge);line-height:1.12;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---- le paquet des CPAS ---- */
.grp{width:100%}
.grp-top{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--ligne);border-radius:0;padding:14px 2px;transition:background .12s ease}
.grp-top:active{background:rgba(27,27,27,.05)}
.grp-n{flex:none;width:38px;height:38px;border:1.5px solid var(--noir);color:var(--noir);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.grp-tx{flex:1;min-width:0}
.grp-tx b{display:block;font-size:15px;font-weight:600}
.grp-tx em{display:block;font-style:normal;font-size:12.5px;color:var(--enc2);margin-top:2px}
.grp-ch{width:15px;height:15px;flex:none}
.grp-in{display:flex;flex-direction:column;gap:0;margin-top:0}

/* ---- cartes du Centre / quotidien ---- */
.tcard{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:transparent;
  border:0;border-bottom:1px solid var(--ligne);border-radius:0;padding:14px 2px;margin:0;transition:background .1s ease}
.tcard:active{background:rgba(27,27,27,.05)}
.tcard .tic{width:28px;height:28px;flex:none}
.tcard .tic .ic{width:100%;height:100%}
.tcard .ttx{flex:1;min-width:0}
.tcard .ttx b{display:block;font-size:15px;font-weight:500;text-transform:none;letter-spacing:0}
.tcard .ttx em{display:block;font-style:normal;font-size:13.5px;color:var(--enc2);margin-top:1px}
.tcard .ttx small{display:block;font-size:12px;color:#8b8984;margin-top:2px}
.tcard .chev{font-size:20px;font-weight:600;color:rgba(27,27,27,.35);flex:none}
.abadge{flex:none;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:500;letter-spacing:.12em;
  text-transform:uppercase;background:var(--jaune);color:#1b1b1b;padding:3px 8px;margin-top:2px}

/* ---- le dock : ronds noirs (gardés) ---- */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--creme);
  border-top:1px solid var(--ligne);display:flex;justify-content:center;gap:14px;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
body.no-tabs #tabbar{display:none}
/* Sur téléphone, le rail n'existe pas : le logo et les destinations secondaires
   restent cachés (ils vivent dans la barre du haut). */
#tabbar .raillogo,#tabbar .railsec{display:none}
#tabbar .railprinc{display:contents}
#tabbar button{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:64px}
#tabbar .db{width:50px;height:50px;border-radius:50%;background:var(--noir);color:var(--c);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;position:relative}
#tabbar button.on .db{background:var(--c);color:var(--noir)}
#tabbar button:active .db{transform:scale(.92)}
#tabbar .db .ic{width:21px;height:21px}
#tabbar .db .dot{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;
  background:var(--rouge);border:2px solid var(--creme)}
#tabbar .lbl{font-family:ui-monospace,monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8b8984}
#tabbar button.on .lbl{color:var(--noir);font-weight:600}

/* ---- l'étoile des favoris : case au trait, partout ---- */
/* ---- la barre de menu : toujours la même, sur toutes les pages ---- */
/* Aérée le 05/08/2026 (demande de Mag : « trop étroit ») — si la hauteur change,
   recaler le top de .subtop juste en dessous. */
#topbar{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--creme);
  display:flex;align-items:center;gap:11px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
  border-bottom:1px solid var(--ligne)}
#topbar .lgo{height:26px;margin:0;cursor:pointer}
#topbar button{position:static;width:42px;height:42px;border:1.5px solid var(--noir);background:var(--creme);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease;position:relative}
#topbar button:active{transform:scale(.92)}
#topbar button .ic{width:17px;height:17px;color:var(--noir)}
#starbtn .ic{color:#c9940c!important}
#topbar button.on{background:var(--noir)}
#starbtn.on .ic{color:var(--jaune)!important}
#neufbtn.on .ic,#profilbtn.on .ic,#admbtn.on .ic{color:var(--creme)!important}
#neufbtn .dot{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;
  background:var(--rouge);border:2px solid var(--creme)}

/* ---- guide + quiz ---- */
.gq{font-size:18px;font-weight:700;margin:14px 0 16px;line-height:1.3}
.gopt{display:block;width:100%;text-align:left;font-size:15px;font-weight:500;
  background:transparent;border:1px solid var(--noir);border-radius:0;padding:14px 15px;margin-bottom:9px;
  transition:background .12s ease}
.gopt:active{background:rgba(27,27,27,.06)}
.gopt.qok{background:#6cb392;border-color:var(--noir);font-weight:600}
.gopt.qko{background:var(--rouge);color:#fff;border-color:var(--noir)}
.gres{background:transparent;border:1px solid var(--noir);border-radius:0;padding:17px;font-size:15px;
  line-height:1.55;white-space:pre-line;margin-bottom:16px}
.glink{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;text-decoration:underline}
.qcard{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--noir);
  color:#f4f3f1;border-radius:0;padding:16px;margin:0 0 12px;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.06em;transition:transform .12s ease}
.qcard:active{transform:scale(.99)}
.qcard .ic{width:19px;height:19px;color:var(--jaune)}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 12px);transform:translate(-50%,16px);
  background:var(--noir);color:#f4f3f1;font-size:14px;font-weight:500;border-radius:0;
  padding:10px 20px;opacity:0;pointer-events:none;transition:all .22s ease;z-index:80;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(min-width:760px){
  .dgrid{grid-template-columns:repeat(4,1fr)}
  .tile:nth-child(2n){border-right:1px solid var(--ligne)}
  .tile:nth-child(4n){border-right:0}
  .home-title{font-size:56px}
  .cards{max-width:760px}
}
@media(min-width:1000px){
  .dgrid{grid-template-columns:repeat(7,1fr)}
  .tile:nth-child(4n){border-right:1px solid var(--ligne)}
  .tile:nth-child(7n){border-right:0}
}
@media(hover:hover){
  .tile:hover{background:var(--noir);color:#f4f3f1}
  .tile:hover small{color:rgba(242,238,230,.6)}
  .fcard:hover,.tcard:hover,.urg-catbtn:hover{background:rgba(27,27,27,.04)!important}
  .chip:hover{background:rgba(27,27,27,.06)}
  .chip.on:hover{background:var(--noir)}
}

/* ══════════════════════════════════════════════════════════════════════════
   GRANDS ÉCRANS — handoff « Bureau COUSIN » (06/08/2026)
   Le dock devient un rail noir de 236px à gauche, le bandeau de titre devient
   un grand titre de 60px sur un filet, et les listes deviennent des grilles.
   Sous 900px, tout revient à la version téléphone.
   ══════════════════════════════════════════════════════════════════════════ */
@media (min-width:900px){
  /* Le rail reste visible partout sur grand écran — y compris sur les fiches,
     qui masquent le dock sur téléphone (barre d'appel oblige). */
  body,body.no-tabs{padding-top:0;padding-bottom:0;padding-left:236px}
  body.no-tabs #tabbar{display:flex}

  /* ---- le rail de navigation ---- */
  #tabbar{position:fixed;left:0;top:0;bottom:0;right:auto;width:236px;
    background:var(--noir);color:#f2eee6;border-top:0;justify-content:flex-start;
    padding:26px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:26px;overflow-y:auto}
  #tabbar .raillogo{width:56px;height:auto;display:block;align-self:flex-start;filter:invert(1)}
  #tabbar .railprinc{display:flex;flex-direction:column;gap:8px}
  #tabbar .railprinc button{display:flex;flex-direction:row;align-items:center;gap:12px;
    padding:11px 12px;border-radius:6px;background:transparent;color:#f2eee6;width:100%;
    text-align:left;min-width:0}
  #tabbar .railprinc button.on{background:#f2eee6;color:var(--noir)}
  /* Dans le rail, le rond porte TOUJOURS la couleur du domaine et le picto reste noir. */
  #tabbar .railprinc .db,#tabbar .railprinc button.on .db{width:34px;height:34px;border-radius:50%;
    flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--c);color:var(--noir)}
  #tabbar .railprinc .db .ic{width:17px;height:17px}
  #tabbar .railprinc .lbl{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:inherit}
  #tabbar .railprinc button.on .lbl{color:var(--noir)}
  #tabbar .railsec{margin-top:auto;display:flex;flex-direction:column;gap:6px;
    padding-top:20px;border-top:1px solid rgba(242,238,230,.2)}
  #tabbar .railsec button{display:flex;flex-direction:row;align-items:center;gap:11px;
    padding:9px 12px;color:#f2eee6;width:100%;text-align:left;background:transparent;min-width:0}
  #tabbar .railsec .ic{width:16px;height:16px;flex:none}
  #tabbar .railsec .lbl{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
    text-transform:uppercase}
  /* Au survol : un trait de couleur apparaît à gauche ET la ligne glisse vers la
     droite (mélange des propositions 2 et 3 — Mag, 06/08/2026). L'actif ne bouge pas. */
  #tabbar .railprinc button,#tabbar .railsec button{
    border-left:3px solid transparent;padding-left:9px;
    transition:transform .16s ease,background .16s ease,border-color .16s ease,opacity .16s ease}
  #tabbar .railsec button{opacity:.78}
  @media (hover:hover){
    #tabbar .railprinc button:not(.on):hover{
      border-left-color:var(--c);background:rgba(242,238,230,.07);transform:translateX(6px)}
    #tabbar .railsec button:hover{
      border-left-color:#f2eee6;background:rgba(242,238,230,.07);transform:translateX(6px);opacity:1}
  }
  #tabbar .railprinc button:not(.on):active,#tabbar .railsec button:active{transform:translateX(6px) scale(.98)}

  /* ---- la barre du haut disparaît : le rail porte déjà le logo et les 8 destinations ---- */
  #topbar{display:none}
  #view{max-width:1204px;margin:0 auto;padding:36px 44px 48px;width:100%}

  .home-top{padding:0}

  /* ---- le bandeau noir devient un grand titre sur un filet ---- */
  .hero{position:static;background:transparent;color:var(--noir);margin:0 0 26px;
    padding:0 0 18px;border-bottom:1.5px solid var(--noir);align-items:flex-end}
  .hero h1{font-size:60px;letter-spacing:-.04em;line-height:.9;margin-top:10px;color:var(--noir)}
  .hero .hsur{font-size:10px;letter-spacing:.24em}
  .hero .cbtn{border-color:var(--noir);color:var(--noir)}
  .hero .hpic{width:52px;height:52px}
  .apreshero,.cliste{margin-top:0}

  /* ---- les listes deviennent des grilles ---- */
  .dgrid.res{grid-template-columns:repeat(5,1fr)}
  .ogrid{grid-template-columns:repeat(3,1fr)}
  .otile.large{grid-column:span 1}
  .qgrid,.flist,.rlist,.cards,.frows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
  .frows{grid-template-columns:repeat(2,1fr)}
  .cards{padding-top:12px}
  .fcarte,.fsavoir,.cliste,.msg.epingle{grid-column:1/-1}
  .ucats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-items:start;width:100%}
  .ucats>div:has(.usous){grid-column:1/-1}
  .usous{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .uvital{grid-template-columns:repeat(2,1fr);max-width:620px}
  /* Le contenu occupe toute la largeur utile même sans grille interne. */
  #view>*{max-width:100%}
  .boules{max-width:400px}
  .qrep{display:grid;grid-template-columns:repeat(2,1fr)}
  .pgn:not(.pilepts){display:none}

  /* ---- les carrousels montrent plus de cartes ---- */
  .rail2{margin:0;padding:14px 0 6px;flex-wrap:wrap}
  .rc,.fmod{width:calc(25% - 9px)}
  .pile{max-width:440px}

  /* ---- les grandes pages en deux colonnes ---- */
  .duo{display:grid;grid-template-columns:1.35fr .65fr;gap:26px;align-items:start}

  /* ---- détails ---- */
  .subtop{position:static;background:transparent;padding:0 0 14px;margin:0}
  .rail{margin:0 0 4px;padding:2px 0 14px}
  .chips{margin:0;padding:12px 0}
  .sect,.sectc,.sectl{margin-top:28px}
  .foot,.fsrc{padding-bottom:20px}
  .hbonj{font-size:64px}
  /* Le grand titre du Réseau : 60px, sur une seule ligne, avec ses décors. */
  .home-title{font-size:60px;letter-spacing:-.04em;line-height:.9;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .28em;margin-bottom:8px}
  .home-title .tl{display:inline-flex;align-items:baseline}
  .home-title .tl.last{display:inline-flex}
  .quizbar,.lienbas{max-width:620px}
  /* Les grands boutons ne s'étirent pas sur toute la largeur de l'écran. */
  #view .acc,#view .fbtn,#view .pident,#view .admok,#view .fcpli,#view .fcomp{max-width:620px}
  /* La météo tient en une ligne : elle n'a aucune raison de traverser l'écran. */
  #view .meteo{max-width:520px}
}

/* Écrans très larges : on garde les grilles lisibles */
@media (min-width:1440px){
  .rc,.fmod{width:calc(20% - 10px)}
}

/* Entre 900 et 1200 : on resserre les grilles */
@media (min-width:900px) and (max-width:1200px){
  .dgrid.res{grid-template-columns:repeat(3,1fr)}
  .qgrid,.flist,.rlist,.cards{grid-template-columns:repeat(2,1fr)}
  .rc,.fmod{width:calc(33.333% - 8px)}
  .duo{grid-template-columns:1fr}
  .hero h1{font-size:46px}
}

/* ══════════════════════════════════════════════════════════════════════════
   LES SURVOLS, PARTOUT (Mag, 06/08/2026 : « sur tous les boutons »)
   Trois familles, une seule logique : rien ne s'inverse en noir (le picto y
   deviendrait invisible), tout se soulève ou glisse légèrement.
   ══════════════════════════════════════════════════════════════════════════ */
.rc,.fmod,.pile .pcarte,.frow2,.unum,.ucat,.tache,.role,.acc,.msg,.fbtn,.quizbar,
.lienbas,.repli,.chh,.chet,.qrep button,.cliste,.boule,.qcard,.gopt,.pli,.chdel{
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease,opacity .14s ease}

@media (hover:hover){
  /* 1. Les cartes et pavés : ils se soulèvent, cerclés d'un trait net */
  .rc:hover,.fmod:hover,.pile .pcarte:hover{transform:translateY(-3px);box-shadow:0 0 0 1.5px var(--noir)}
  .rc.noir:hover,.fmod.noir:hover,.pile .pcarte:hover{box-shadow:0 0 0 1.5px var(--noir),0 6px 0 -3px rgba(27,27,27,.18)}

  /* 2. Les lignes et les rangées : elles glissent vers la droite */
  .frow2:hover,.unum:hover,.tache:hover,.role:hover,.acc:hover,.msg:hover,
  .repli:hover,.pli:hover,.chh:hover,.chet:hover,.cliste:hover{
    transform:translateX(3px);background:#fff}
  .acc.open:hover,.ucat:hover{background:#242424;transform:translateX(3px)}
  .msg.epingle:hover{background:#fff;transform:translateX(3px)}

  /* 3. Les boutons pleins : ils s'assombrissent un peu */
  .fbtn:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .fbtn.plein:hover{filter:brightness(.94)}
  .quizbar:hover,.chdel:hover{filter:brightness(1.25)}
  .qrep button:hover{background:#fff;box-shadow:0 0 0 1.5px var(--noir)}
  .lienbas:hover{opacity:.6}
  .boule:hover .rond{transform:scale(1.08)}
  .boule .rond{transition:transform .14s ease}
  .gopt:hover,.qcard:hover{background:rgba(27,27,27,.05)}
  /* Les petits ronds et carrés d'en-tête */
  .cbtn:hover,.frond:hover,.sqbtn:hover,#topbar button:hover{background:rgba(27,27,27,.07)}
  .hero .cbtn:hover{background:rgba(242,238,230,.14)}
  .fet:hover,.heart:hover{transform:scale(1.15)}
  .fet,.heart{transition:transform .14s ease}
  /* Les cases d'appel des urgences (fond noir) */
  .urg-sq:hover{background:#2a2a2a;transform:translateY(-2px)}
  /* Les chips de filtre */
  .chip:hover{background:rgba(27,27,27,.07)}
  .chip.on:hover{background:#333}
  /* Le rail des domaines en haut des pages */
  .rail button:hover{background:#eceae5}
  .rail button.on:hover{background:#333}
}

/* À l'appui, tout s'enfonce légèrement — la réponse au doigt, sur téléphone */
.rc:active,.fmod:active,.pile .pcarte:active,.frow2:active,.unum:active,.ucat:active,
.tache:active,.role:active,.acc:active,.msg:active,.fbtn:active,.quizbar:active,
.repli:active,.pli:active,.chh:active,.chet:active,.qrep button:active,.cliste:active{
  transform:scale(.985)}

/* ---- LES JEUX : styles rapatriés de l'app principale (06/08/2026), avec les
   couleurs de Lux. Se corrigent dans app-classique.html puis se recopient. ---- */
/* De l'air en haut : la page de jeu démarrait collée à la barre (Mag, 06/08/2026). */
.jxwrap{padding-top:22px}
.jxwrap .jx-rh{margin-top:6px}
.quiz-launch svg, .quiz-launch .pico{width:20px; height:20px}
  .quiz-launch:active{transform:scale(.98)}
  .quiz-top{display:flex; justify-content:space-between; font-size:12px; font-weight:500; color:var(--enc2); margin-bottom:14px; text-transform:uppercase; letter-spacing:.04em}
  .quiz-q{font-size:19px; font-weight:700; color:var(--noir); line-height:1.3; margin-bottom:18px}
  .quiz-opts{display:flex; flex-direction:column; gap:10px}
  .quiz-opt{text-align:left; padding:15px 16px; border-radius:14px; background:#fdfdfc; border:1.5px solid var(--ligne); font-size:15px; font-weight:500; color:var(--noir); cursor:pointer; font-family:inherit}
  .quiz-opt:active{transform:scale(.99)}
  /* Une réponse à choisir porte sa lettre : impossible de la confondre avec un indice. */
  .quiz-opt.lettre{display:flex; align-items:center; gap:11px}
  .quiz-opt.lettre i{font-style:normal; flex:0 0 auto; width:26px; height:26px; border-radius:8px; background:#1b1b1b;
    color:#f5c542; font-size:12.5px; font-weight:600; display:flex; align-items:center; justify-content:center}
  .quiz-opt.lettre.good i{background:#1f7a44; color:#fff}
  .quiz-opt.lettre.bad i{background:#b8442f; color:#fff}
  .quiz-opt.good{background:#c9e7d5; border-color:#6cb392; color:#155}
  .quiz-opt.bad{background:#f3b4ad; border-color:#e63329; color:#611}
  .quiz-opt[disabled]{cursor:default}
  /* Un bouton d'action ne traverse pas un écran d'ordinateur (Mag, 06/08/2026). */
  .quiz-next{margin-top:16px; width:100%; max-width:420px; margin-left:auto; margin-right:auto; display:block;
    padding:15px; border-radius:14px; background:#1b1b1b; color:#f2eee6; border:0; font-size:15px; font-weight:600; cursor:pointer}
  .quiz-next:active{transform:scale(.98)}
  .quiz-res{text-align:center; padding:30px 20px; background:#fdfdfc; border:1px solid var(--ligne); border-radius:16px}
  .quiz-score{font-size:46px; font-weight:900; color:#c9940c}
  .quiz-msg{font-size:16px; font-weight:500; margin:6px 0 18px; color:var(--noir)}
  .quiz-intro{font-size:14px; font-weight:500; color:var(--enc2); margin-bottom:14px; line-height:1.5}
  /* ═══ LA SALLE DE JEUX ═══
     Deux questions séparées : à quoi on joue (l'étagère), puis sur quoi (le terrain). */
  .jx-de{width:100%; border:0; border-radius:18px; background:#1b1b1b; color:#f2eee6; font-family:inherit;
    padding:15px 16px; display:flex; align-items:center; gap:13px; text-align:left; cursor:pointer; margin-bottom:12px}
  .jx-de .d{font-size:31px; line-height:1; transition:transform .6s cubic-bezier(.2,.9,.3,1.4)}
  .jx-de.roule .d{transform:rotate(720deg) scale(1.15)}
  .jx-de b{display:block; font-size:15.5px; font-weight:500}
  .jx-de em{font-style:normal; font-size:12px; color:#c3bcae; font-weight:400}
  /* Téléphone : trois par rangée, les cartes restent lisibles au pouce.
     Tablette couchée et ordinateur : DEUX par rangée — la colonne de l'app ne s'élargit
     pas, donc trois cartes y deviendraient minuscules alors que la place ne manque pas. */
  .jx-shelf{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px}
  /* Neuf pavés = TROIS colonnes sur trois rangées : ça tombe juste, partout, et la salle
     tient sur un écran de téléphone sans défiler. Sur grand écran, juste un peu plus d'air. */
  @media (min-width:820px){
    .jx-shelf{gap:12px}
    .jx-t b{font-size:14.5px}
  }
  /* Mêmes règles que les pavés de l'accueil : le nom en haut, le dessin en grand en bas à
     droite, le pavé carré. C'est le même geste, ça doit se ressembler. */
  .jx-t{border:0; border-radius:10px; padding:12px 12px 10px; font-family:inherit; text-align:left; cursor:pointer;
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start;
    color:#1b1b1b; position:relative; overflow:hidden; transition:transform .16s cubic-bezier(.22,1,.36,1)}
  .jx-t:active{transform:scale(.96)}
  /* Le dessin prend toute la place laissée par le nom, centré. */
  .jx-t .ic{position:absolute; left:0; right:0; bottom:6px; top:34px; display:flex; align-items:center; justify-content:center; line-height:0}
  .jx-t .ic svg, .jx-t .ic .pico{width:auto; height:min(58px,64%); aspect-ratio:1; display:block; color:inherit}
  .jx-de .d svg, .jx-de .d .pico{width:28px; height:28px; display:block}
  .jx-o i svg, .jx-o i .pico{width:19px; height:19px; display:block}
  .jx-bar .gros svg, .jx-bar .gros .pico{width:27px; height:27px; display:block}
  .jx-ind i svg, .jx-ind i .pico{width:17px; height:17px; display:block}
  .quiz-next svg, .quiz-next .pico, .pf-golist svg, .pf-golist .pico{width:18px; height:18px; vertical-align:-3px}
  .jx-prog svg, .jx-prog .pico{width:15px; height:15px; vertical-align:-2px}
  /* Le point « formation commencée », à la place de la pastille orange en emoji. */
  .fc-pt{display:inline-block; width:11px; height:11px; border-radius:50%; background:#f5c542}
  .fc-coche svg, .fc-coche .pico{width:19px; height:19px; color:#1f7a44}
  .jx-t b{display:block; font-size:12.5px; font-weight:600; line-height:1.15; letter-spacing:-.01em; position:relative; z-index:2}
  .jx-t em{display:block; font-style:normal; font-size:11px; font-weight:400; opacity:.72; margin-top:3px; line-height:1.3; max-width:86%}
  .jx-t.sombre{color:#f2eee6}
  .jx-t:active{transform:scale(.985)}
  .jx-t.on{outline:3px solid #1b1b1b; outline-offset:2px}
  /* Le terrain, déplié sous l'étagère */
  /* Ce qui arrive */
  .ag-intro{font-size:12.5px; color:var(--enc2); font-weight:400; line-height:1.5; margin:0 2px 16px}
  .ag-jour{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; color:var(--enc2); margin:16px 2px 8px}
  .ag-jour.proche{color:#1b1b1b}
  .ag-e{background:#fdfdfc; border:1px solid var(--ligne); border-left:4px solid #ccc; border-radius:12px; padding:11px 13px; margin-bottom:8px}
  .ag-h{display:flex; align-items:baseline; gap:8px}
  .ag-e b{font-size:14px; font-weight:600; line-height:1.2}
  /* « GRATUIT » NE SE COUPE PLUS EN « GR » : le titre long comprimait l'étiquette. Elle ne
     rétrécit plus (flex-shrink 0) et ne coupe plus son texte. */
  .ag-prix{margin-left:auto; flex:0 0 auto; flex-shrink:0; white-space:nowrap; overflow:visible;
    font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;
    background:#e9f3ec; color:#1f7a44; border-radius:7px; padding:3px 7px}
  .ag-h b{min-width:0}
  .ag-e em{display:block; font-style:normal; font-size:11.5px; font-weight:500; color:var(--enc2); margin-top:3px}
  .ag-e p{font-size:12.5px; color:#54514b; font-weight:400; margin:5px 0 0; line-height:1.45}
  /* La pastille culturelle : même forme que les autres boutons du bas, au ticket de Culture. */
  .dock-agenda{position:relative; flex:0 0 auto; width:58px; height:58px; border-radius:50%; display:none;
    border:4px solid var(--creme); background:#6cb392; color:#1b1b1b; padding:0; cursor:pointer;
    align-items:center; justify-content:center}
  .dock-agenda svg, .dock-agenda .pico{width:26px; height:26px}
  /* Lien discret : la plupart des personnes hébergées sont seules. Ce qui touche aux
     enfants ne doit pas s'afficher en grand — juste rester trouvable pour qui en a besoin. */
  /* Le tri et l'impression RESTENT SOUS LA MAIN : la liste fait 24 musées et 141 lieux,

  .ag-fixe{position:sticky; top:0; z-index:12; background:var(--creme); padding-top:6px;

  .pf-wrap{padding-bottom:96px}

     se coller dessous. Ils occupent 84 px avec leur marge — on réserve 140. */
  body:not(.is-home) #view{padding-bottom:140px}

/* Pictos MULTICOLORES : le masque CSS ne sait porter qu'une seule couleur, donc ceux-là
   sont posés en image et gardent leurs vraies teintes (l'arc-en-ciel a 7 couleurs). */
/* La POUBELLE est dans le même cas : le symbole de recyclage est dessiné EN BLANC à
   l'intérieur du bac. En masque, le blanc compte comme du plein — le recyclage
   disparaissait et il ne restait qu'une tache (Mag, 06/08/2026 : « ce n'est pas le
   logo qu'on avait prévu »). En image, son dessin est intact. */
const PICTOS_COUL={rainbow:'lgbtqi.svg', poubelle:'notif-poubelle.svg'};
function icon(name,extra){
  const t=/width="(\d+)"/.exec(extra||''), h=/height="(\d+)"/.exec(extra||'');
  const taille = t ? `width:${t[1]}px;height:${(h?h[1]:t[1])}px;` : '';
  // On garde la classe demandée (ex. .pf-out-lien) : c'est elle qui règle la taille au cas par cas.
  const cl=/class="([^"]*)"/.exec(extra||'');
  const c=PICTOS_COUL[name];
  if(c) return `<img class="pico picoc${cl?' '+cl[1]:''}" src="picto/${c}" alt="" style="${taille}">`;
  const f=PICTOS[name];
  if(f){
    return `<span class="pico${cl?' '+cl[1]:''}" style="${taille}-webkit-mask-image:url('picto/${f}');mask-image:url('picto/${f}')"></span>`;
  }
  return `<svg viewBox="0 0 24 24" fill="currentColor"${extra?' '+extra:''}>${ICONS[name]||''}</svg>`;
}

    "TARIFS relevés en ligne : douche 1 € · lessive 1 € les 3 kg (3 kg max par personne) · casier 1 €, 1,50 € ou 2 € la semaine selon la taille.\n⚠️ DEUX VERSIONS DES HORAIRES. Celle de l'équipe est dans le champ Horaires ci-dessus. Le site annonçait au relevé : douches mar/jeu/ven 8h30–16h, mer 8h30–12h et 13h–17h femmes, sam et dim 10h30–16h. On appelle avant d'envoyer quelqu'un — surtout pour le mercredi.\nDoucheFLUX porte aussi un projet de logement (Housing First, lancé en 2023) : leur position est que le sans-chez-soirisme est un problème de LOGEMENT, pas un problème social ou sanitaire.\nC'est là que se réunit le Syndicat des immenses, tous les lundis de 11h à 13h30.\nSources : doucheflux.be · anderlecht.be · ama.be · brusshelp.org · RTBF (25/08/2022) ; horaires équipe repris de « Autour d'ici ». Relevé le 01/08/2026."),

  d("lgbt","UTSOPI","Schaerbeek","Union des travailleur·euses du sexe : soutien médical, juridique et en cas de violence, écoute confidentielle et anonyme.","Travailleur·euses du sexe","","info@utsopi.be","utsopi.be","Rue d'Aerschot 208, 1030 Schaerbeek","Lun–Ven 10h–18h","PAS DE TÉLÉPHONE PUBLIÉ, et ce n'est pas un oubli de notre part : leur site n'en donne aucun. Un numéro circule sur des annuaires ; il n'est confirmé nulle part, donc on ne le colle pas. On écrit à info@utsopi.be, ou on passe.\n\nON PEUT LES CONTACTER ANONYMEMENT — c'est écrit sur leur site, et toute l'équipe est tenue au secret professionnel. À dire à la personne : elle n'a pas à se nommer pour poser une question.\n\nPERMANENCE OUVERTE le mardi après-midi, avec des rencontres entre pairs. Attention, ça s'interrompt l'été.\n\nIls couvrent Bruxelles, Liège, Gand et Anvers.\n\nSource : utsopi.be, relevé le 08/08/2026."),

  d("lgbt","Rainbow Refugee Committee","Bruxelles-Ville","Soutien aux personnes LGBTQIA+ en demande d'asile : accompagnement individuel, réorientation psycho-médico-sociale, soutien socio-juridique et mentorat.","Personnes LGBTQIA+ demandeuses d'asile","","info@rainbowrefugee.be","refugee-committee.org","Rue du Marché au Charbon 42, 1000 Bruxelles (à la RainbowHouse)","","ON NE LES APPELLE PAS, on leur écrit : info@rainbowrefugee.be, ou WhatsApp au +32 491 76 99 26 — MESSAGES UNIQUEMENT, ça ne sonne pas. Prévenir la personne, sinon elle croit que le numéro est mort.\n\n⚠ Un annuaire affiche « 0 » comme numéro pour eux. Ce n'est pas un téléphone, c'est un champ vide mal rempli.\n\nILS TRAVAILLENT DEPUIS LA RAINBOWHOUSE, rue du Marché au Charbon 42. Si on a besoin de joindre quelqu'un de vive voix, c'est l'accueil de la maison qu'on appelle : 02 503 59 90, le bureau répond l'après-midi de 14 h à 18 h. Ce n'est pas leur ligne à eux, c'est la maison qui les héberge — le dire quand on transmet.\n\nÀ LA MÊME ADRESSE, et qui peut servir le jour même : le service social de la RainbowHouse, lundi après-midi 14 h → 17 h. Et une ligne pour les agressions, 0492 40 84 84.\n\nPublic : toute personne LGBTQIA+ qui a vécu un parcours de migration forcée.\n\nSources : rainbowhouse.be et annuaire.guidesocial.be, relevés le 08/08/2026."),
