        '</div>':'')+
        '<div class="fsrc" style="text-align:left;padding:4px 0 0">La personne doit AUSSI être testeuse côté Google '+
        'tant que l’app n’est pas publiée — sinon Google la refuse avant même d’arriver ici.</div>'+
      '</div>';
    }
  }

  /* --- Ce qui n'a pas encore été rapatrié : on le dit, on ne le cache pas. --- */
  /* LE CHANTIER et LES STATISTIQUES, rapatriés le 06/08/2026 (« il manque le chantier »,
     « les statistiques surtout, j'aimerais bien les récupérer »). */
  if(PROFILE.admin){
    const aFaire=CHANTIER.filter(function(l){ return !l.fait; }).length;
    const enBoite=BOITE.length;
    h+='<button class="acc" style="margin-top:12px" onclick="go(\'#/chantier\')">'+
       '<b>Le chantier</b><span class="n">'+
       (chantierLoaded ? (aFaire+' à faire'+(enBoite?' · '+enBoite+' dans la boîte':'')) : 'ta liste de travail')+
       '</span><span class="sg">›</span></button>';
    h+='<button class="acc" style="margin-top:12px" onclick="go(\'#/modeles\')">'+
       '<b>Les modèles de check-lists</b><span class="n">ce que chaque rôle doit faire</span>'+
       '<span class="sg">›</span></button>';
    h+='<button class="acc" style="margin-top:12px" onclick="go(\'#/stats\')">'+
       '<b>Statistiques</b><span class="n">où l’équipe passe son temps</span>'+
       '<span class="sg">›</span></button>';
  }

  /* L'EXPORT ET L'IMPORT, réservés à l'administration : c'est tout le catalogue. */
  if(vueAdmin()){
    h+='<div class="sectl" style="margin-top:26px">Le catalogue</div>'+
      '<div class="fsrc" style="text-align:left;padding:0 0 12px">'+DATA.length+' fiches. '+
      'Garde une copie avant toute grosse modification.</div>'+
      '<div class="expg">'+
        '<button class="expb" onclick="exporterCatalogue()">Exporter (fichier COUSIN)</button>'+
        '<button class="expb" onclick="exporterTableur()">Exporter pour un tableur</button>'+
        '<label class="expb danger">Comparer un fichier'+
          '<input type="file" accept="application/json,.json" onchange="importerCatalogue(event)" hidden>'+
        '</label>'+
      '</div>'+
      '<div class="fsrc" style="text-align:left;padding:10px 0 0">'+
      'Le fichier COUSIN, c’est la copie de sauvegarde. Le tableur, c’est pour relire à '+
      'plusieurs. « Comparer » te dit ce qui diffère entre un fichier et l’app — et te le '+
      'montre à l’écran — mais ne publie rien : le catalogue vit dans le code, envoie-moi '+
      'le fichier pour que ça devienne l’app de l’équipe.</div>';
  }

  h+='<div class="fsavoir" style="margin-top:22px"><b><span class="ic">'+icon('bulb')+'</span>Ce qui reste à décider</b>'+
     '<p>« Voir comme » vit dans l’œil du rail, pas ici. Il n’applique pour l’instant qu’UNE '+
     'règle, la seule qu’on ait tranchée : le groupe D ne voit ni les outils de l’équipe ni cette page. '+
     'Il garde en revanche les formations, les jeux et le quiz — se former est ouvert à tout le monde.\n\n'+
     'Les autres restrictions restent à décider ensemble.</p></div>';
  return h+'<div style="height:26px"></div>';
}

/* ═════════════════════════════════════════════════════════════════════════

   Elle a tranché après avoir vu la version en trente questions : « j'aime pas du
   tout la structure, c'est pas schématisé, y a trop de questions ».

   Maintenant, tout cours commence par CE QU'IL FAUT RETENIR, dessiné :
   · une seule question (ou l'essentiel), pas trente ;
   · trois à quatre cas, chacun sa couleur et sa phrase de réponse ;
   · UN SEUL bloc rouge, « l'erreur qu'on fait tous » — rare, donc il frappe ;
   · le détail complet replié dessous, il ne disparaît pas.

   Trois formes, parce que les neuf cours n'ont pas tous une décision à trancher —
   imposer un arbre à un cours qui n'en a pas serait inventer une structure :
   · 'arbre'  → il y a un choix à faire selon la situation
   · 'etapes' → c'est une procédure, dans l'ordre
   · 'reperes'→ il n'y a rien à décider, il y a des choses à savoir

    '</div>'+pagination(areprendre.length);

  h+='<div class="sectl">Tous les modules</div><div class="flist">'+
    mods.map(function(p){
      const ch=formationChapitres(p.page), lus=fluLus(p.sid).length, c=themeCoul(p.theme);

function vDomaine(key){
  const d=DOM[key];
  let items=DATA.filter(p=>p.domaine===key);
  let chips='';
  if(d.isDem && filt.dem==='Toutes'){
    /* Liste condensée : une ligne par démarche, puis le choix de l'organisme. */
    const dems=DEMARCHES.filter(t=>items.some(p=>p.demarche===t));
    const pp=DATA.find(p=>p.domaine==='formations' && /Premiers pas/i.test(p.nom));
    return heroBandeau(d.label, dems.length+' démarches', dc(key), d.ic)+
      rail(key)+
      '<div class="cards" style="display:flex;flex-direction:column">'+dems.map(t=>{
        const n=items.filter(p=>p.demarche===t).length;
        return '<div class="fcard" role="button" tabindex="0" onclick="setFilt(\'dem\',\''+esc(t).replace(/'/g,"\\'")+'\')">'+
          '<span class="fpi" style="color:'+dc('demarches')+'"><span class="ic">'+icon('demarche')+'</span></span>'+
          '<span class="tx"><b>'+esc(t)+'</b><small>'+n+' organisme'+(n>1?'s':'')+'</small></span>'+
          '<span style="font-size:20px;font-weight:600;color:rgba(27,27,27,.4)">›</span></div>';
      }).join('')+
      (pp?'<div class="fcard" role="button" tabindex="0" onclick="go(\'#/f/'+pp.sid+'\')" style="background:#f5c542">'+
        '<span class="fpi" style="color:#1b1b1b"><span class="ic">'+icon('book')+'</span></span>'+
        '<span class="tx"><b>Nouveau ici ? Premiers pas</b><small>La formation qui explique comment tout se tient</small></span></div>':'')+
      '</div>';
  }
  if(d.isDem){
    const dems=DEMARCHES.filter(t=>DATA.some(p=>p.domaine===key&&p.demarche===t));
    chips+=chipRow('dem',dems,filt.dem,'Toutes');
    items=items.filter(p=>p.demarche===filt.dem);
  }
  if(d.isMail){
    chips+=chipRow('genre',['Mail','Note'],filt.genre,'Tous');
    if(filt.genre!=='Tous') items=items.filter(p=>p.genre===filt.genre);
    chips+=chipRow('famille',['Médical','Social'],filt.famille,'Toutes');
    if(filt.famille!=='Toutes') items=items.filter(p=>p.famille===filt.famille);
  }
  /* Règle d'or reprise de l'app principale : aucun bouton de tri ne mène à une page vide.
     Chaque rangée ne propose que ce qui existe compte tenu de l'autre. */
  const base=DATA.filter(p=>p.domaine===key && (!d.isDem||p.demarche===filt.dem));
  const parCommune=(filt.commune==='Toutes')?base:base.filter(p=>p.commune===filt.commune);
  const ordre=(TAGS_REGLES[key]||[]).map(r=>r[1]);
  let alltags=[...new Set(parCommune.flatMap(p=>p.tags))];
  alltags.sort((a,b)=>{const ia=ordre.indexOf(a),ib=ordre.indexOf(b);return ((ia<0?99:ia)-(ib<0?99:ib))||a.localeCompare(b,'fr')});
  if(alltags.length>1){
    chips+=chipRow('tag',alltags,filt.tag,'Tout');
    if(filt.tag!=='Tout') items=items.filter(p=>p.tags.includes(filt.tag));
  }
  if(d.byCommune){
    const parTag=(filt.tag==='Tout')?base:base.filter(p=>p.tags.includes(filt.tag));
    const coms=COMMUNES.filter(c=>parTag.some(p=>p.commune===c));
    if(coms.length>1) chips+=chipRow('commune',coms,filt.commune,'Toutes');
    if(filt.commune!=='Toutes') items=items.filter(p=>p.commune===filt.commune);
  }
  items=triProximite(items);
  /* Social : les 19 CPAS se replient derrière un seul bouton. */
  let grpHtml='';
  if(key==='social'){
    const cpas=items.filter(estCpas);
    if(cpas.length>3){ items=items.filter(p=>!estCpas(p)); grpHtml=grpCpas(cpas); }
  }
  if(d.isFormation && filt.tag==='Tout' && filt.commune==='Toutes') return vFormations();
  /* Le bouton d'impression d'une LISTE DE FICHES : c'est la feuille qu'on emporte
     en visite ou qu'on donne à quelqu'un qui n'a pas l'app. */
  return heroBandeau(d.label, (items.length+(grpHtml?'+':''))+' fiche'+(items.length>1?'s':''), dc(key), d.ic)+
    '<div class="imprligne">'+boutonImprimer()+'</div>'+
    rail(key)+chips+
    '<div class="cards"'+(d.isFormation?' style="border-top:0;padding-top:6px"':'')+'>'+
    (items.length||grpHtml?items.map(d.isFormation?flCard:fcard).join('')+grpHtml:
      '<div class="empty"><span class="ic">'+icon('compass')+'</span><b>Rien avec ces filtres</b><p>Essaie d\'élargir la sélection.</p></div>')+
    '</div>';
}

/* ---------- LA SEMAINE DES POUBELLES, EN IMAGE ----------
   Trois jours, et pour chacun les sacs DESSINÉS un par un à leur vraie couleur : on
   compte d'un coup d'œil au lieu de lire une phrase (Mag, 06/08/2026 : « plus ludique
   et plus facile à retenir »). Les sacs viennent de POUBELLES — la fiche et le rappel
   du bas de l'app disent donc toujours la même chose, ils ne peuvent pas se contredire. */
function poubellesTableau(){
  const auj=new Date().getDay();
  let h='<div class="pquand">'+pictoPoubelle('#1D1C1D','#ffffff',24)+
    '<span><b>Le matin même</b>, pas la veille au soir — <b>devant la porte</b>.</span></div>'+
    '<div class="psem">';
  [1,3,5].forEach(function(j){
    const sacs=POUBELLES[j]||[];
    const cejour=(j===auj);
    h+='<div class="pj'+(cejour?' auj':'')+'">'+
      '<div class="pjt"><b>'+esc(JOURS[j])+'</b>'+
        (cejour?'<span class="badge">Aujourd’hui</span>':'')+'</div>'+
      /* UN bac par COULEUR à sortir — SON picto poubelle, à la couleur du jour
         (Mag, 06/08/2026 : « mets tes icônes de poubelle au lieu de tes gros paquets »). */
      '<div class="psacs">'+sacs.map(function(s){
        /* Le bac à la couleur du jour, le recyclage en réserve claire — son dessin entier. */
        return pictoPoubelle(POUB_COUL[s.c], s.c==='noire'?'#f0efed':'#ffffff', 34);
      }).join('')+'<em class="psl">'+esc(sacsTexte(sacs))+'</em></div>'+
    '</div>';
  });
  h+='</div>'+
    '<div class="pastuce"><span class="ic">'+icon('bulb')+'</span>'+
    '<span>À retenir : <b>lundi et vendredi, que du noir</b>. <b>Le mercredi, les trois couleurs</b> — '+
    'c\'est le seul jour avec le jaune et le bleu.</span></div>';
  return h;
}
function vFiche(p){
  /* LA FICHE redessinée d'après le handoff Claude Design (06/08/2026) :
     carte d'en-tête à bande de couleur (retour + pastille du domaine + étoile),
     infos en lignes libellé/valeur, bloc noir « À savoir », deux boutons d'action. */
  const d=DOM[p.domaine]||{}, c=dc(p.domaine);
  document.title='COUSIN · '+p.nom;
  noterVue(p.sid);
  let body='';
  if(p.domaine==='demarches'){
    body+=(p.ou?'<div class="bloc"><b><span class="ic">'+icon('pin')+'</span>Où s’adresser</b><p>'+esc(p.ou)+'</p></div>':'')+
      (p.comment?'<div class="bloc"><b><span class="ic">'+icon('list')+'</span>Comment ça se passe</b><p>'+esc(p.comment)+'</p></div>':'')+
      (p.attention?'<div class="bloc warn"><b><span class="ic">'+icon('alert')+'</span>Attention ici</b><p>'+esc(p.attention)+'</p></div>':'')+
      (p.delai?'<div class="bloc"><b><span class="ic">'+icon('clock')+'</span>Délai</b><p>'+esc(p.delai)+'</p></div>':'');
  } else if(p.isGuide && GUIDES[p.guideKey]){
    gPath=[];
    body+='<div id="gzone">'+guideNode(p.guideKey)+'</div>';
  } else if(p.domaine==='mails'){
    /* TROIS GESTES, pas un seul (Mag, 06/08/2026) : copier l'objet, copier le corps,
       ou ouvrir directement un brouillon Gmail — l'équipe est sur Gmail au travail. */
    const cbx=function(lab,champ){
      return '<div class="copybox"><div class="lab">'+lab+
        '<button class="cbcop" onclick="copyTxt(texteNote(BYSID[\''+p.sid+'\'],\''+champ+'\'),\''+lab+' copié\')">'+
          '<span class="ic">'+icon('copy')+'</span>Copier</button></div>'+
        '<p id="mod-'+champ+'-'+p.sid+'">'+corpsInteractif(p,champ)+'</p></div>';
    };
    body+=(p.objet?cbx('Objet','objet'):'')+
      (p.corps?cbx(p.genre==='Note'?'Canevas de note':'Corps du mail','corps'):'')+
      '<div class="fsrc" style="text-align:left;padding:8px 2px 0">Touche les mots entre crochets : '+
      'choisis, ou écris dedans. Le modèle se monte ici, tu ne copies que le texte fini.</div>';
  } else if(/poubelle/i.test(p.nom||'')){
    body+=poubellesTableau();
  } else if(p.memo){
    body+='<div class="rich" style="white-space:pre-line">'+esc(p.memo)+'</div>';
  } else if(p.page){
    /* Le schéma D'ABORD, le détail replié ensuite : c'est l'inversion validée par
       Mag le 07/08/2026. Un cours sans schéma écrit garde son ancien affichage. */
    const sch=carteCours(p);
    body+= sch
      ? sch+'<details class="cdet"><summary>Le détail, chapitre par chapitre</summary>'+
        '<div class="rich">'+p.page+'</div></details>'
      : '<div class="rich">'+p.page+'</div>';
  }
  /* Les lignes d'information */
  function frow(lab,val,lien){
    if(!val) return '';
    return '<div class="frow"><span class="fl">'+lab+'</span><span class="fv">'+
      (lien?'<a href="'+lien+'"'+(/^https?:/.test(lien)?' target="_blank" rel="noopener"':'')+'>'+esc(val)+'</a>':esc(val))+
      '</span></div>';
  }
  let infos='';
  infos+=frow('Commune',p.commune);
  infos+=frow('Public',p.public);
  infos+=frow('Téléphone',p.tel, telHref(p.tel)||'');
  infos+=frow('Mail',p.mail, p.mail?'mailto:'+p.mail:'');
  infos+=frow('Adresse',p.adr);
  infos+=frow('Horaires',p.horaires);
  infos+=frow('Site',p.site, p.site?urlHref(p.site):'');
  infos+=frow('Référent·e',p.referent);
  /* Les deux boutons du bas : itinéraire et appel (ou mail, ou site, ou copie) */
  const th=telHref(p.tel);
  let b1='', b2='';
  if(p.adr) b1='<a class="fbtn" href="'+itiHref(p.adr)+'" target="_blank" rel="noopener"><span class="ic">'+icon('pin')+'</span>Itinéraire</a>';
  if(p.domaine==='mails'&&p.corps){
    if(p.genre==='Note'){
      b2='<button class="fbtn plein" style="background:'+c+'" onclick="copyTxt(texteNote(BYSID[\''+p.sid+'\'],\'corps\'),\'Note copiée\')">'+
         '<span class="ic">'+icon('copy')+'</span>Copier la note</button>';
    } else {
      /* Gmail ouvre un vrai brouillon, objet et texte déjà dedans : il ne reste qu'à
         mettre le destinataire et à compléter les [crochets]. */
      b1='<a class="fbtn" href="'+esc(gmailHref(p))+'" target="_blank" rel="noopener">'+
         '<span class="ic">'+icon('copy')+'</span>Copier le mail</a>';
      b1='<button class="fbtn" onclick="copyTxt(texteNote(BYSID[\''+p.sid+'\'],\'corps\'),\'Mail copié\')">'+
         '<span class="ic">'+icon('copy')+'</span>Copier le mail</button>';
      /* On recalcule l'adresse AU CLIC : sinon elle emporterait le modèle tel qu'il
         était au dessin de la page, sans les choix faits depuis. */
      b2='<button class="fbtn plein" style="background:'+c+'" onclick="window.open(gmailHref(BYSID[\''+p.sid+'\']),\'_blank\')">'+
         '<span class="ic">'+icon('send')+'</span>Ouvrir dans Gmail</button>';
    }
  }
  /* Le téléphone a QUITTÉ cette chaîne : il est devenu b0, son propre bouton. Avant,
     un numéro chassait le site — on ne pouvait pas appeler ET ouvrir le site. Depuis le
     08/08/2026 les trois cohabitent : appeler · itinéraire · ouvrir. */
  else if(p.mail) b2='<a class="fbtn plein" style="background:'+c+'" href="mailto:'+esc(p.mail)+'"><span class="ic">'+icon('send')+'</span>Écrire</a>';
  else if(p.site) b2='<a class="fbtn plein" style="background:'+c+'" href="'+urlHref(p.site)+'" target="_blank" rel="noopener"><span class="ic">'+icon('lien')+'</span>Ouvrir</a>';
  /* LE BOUTON TÉLÉPHONE, demandé par Mag le 08/08/2026 : « comment font les gens ? ».
     Il passe EN PREMIER quand le numéro existe — appeler est le geste le plus fréquent,
     bien avant l'itinéraire. Sur téléphone les libellés disparaissent : trois pictos
     côte à côte se comprennent sans qu'on les nomme (sa remarque). */
  let b0='';
  if(p.tel) b0='<a class="fbtn plein" style="background:'+c+'" href="tel:'+esc(String(p.tel).replace(/[^0-9+]/g,''))+'" aria-label="Appeler '+esc(p.nom)+'">'+
    '<span class="ic">'+icon('phone')+'</span><span class="lb">Appeler</span></a>';
  /* Pas de numéro dans la fiche : on le DIT, au lieu de laisser un trou que personne
     ne remarque. C'est ce qui manquait sur Aquarelle et Médecins du Monde. */
  const sansTel = !p.tel && DOM[p.domaine] && DOM[p.domaine].reseau
    ? '<div class="ftel-non">Pas de numéro dans cette fiche'+(p.site?' — le site est au-dessus.':'.')+
      ' <button onclick="ouvrirIdee()">Le signaler</button></div>'
    : '';
  const n=[b0,b1,b2].filter(Boolean).length;
  const boutons=n?'<div class="fboutons n'+n+'">'+[b0,b1,b2].filter(Boolean).join('')+'</div>'+sansTel:sansTel;

  /* Le bouton d'impression d'UNE fiche : c'est la feuille qu'on donne à quelqu'un
     pour qu'il puisse s'y rendre sans téléphone (Mag, 08/08/2026). */
  return '<div class="imprligne">'+boutonImprimer()+'</div>'+
    '<div class="fcarte">'+
      '<i class="bande" style="background:'+c+'"></i>'+
      '<div class="fin">'+
        '<div class="ftop">'+
          '<button class="frond" onclick="history.back()" aria-label="Retour"><span class="ic">'+icon('chevron')+'</span></button>'+
          '<span class="fdom" style="background:'+c+'"><span class="ic">'+icon(fichePicto(p)||d.ic||'compass')+'</span>'+esc(d.short||d.label||'')+'</span>'+
          '<span style="flex:1"></span>'+
          '<button class="fet'+(FAVS.has(p.sid)?' on':'')+'" onclick="toggleFav(event,\''+p.sid+'\')" aria-label="Favori"><span class="ic">'+icon('star')+'</span></button>'+
        '</div>'+
        '<b><h1>'+esc(p.nom)+'</h1></b>'+
        (p.desc?'<p class="fdesc">'+esc(p.desc)+'</p>':'')+
      '</div></div>'+
    (infos?'<div class="frows">'+infos+'</div>':'')+
    (body?body:'')+
    (p.notes?'<div class="fsavoir"><b><span class="ic">'+icon('bulb')+'</span>À savoir</b><p>'+esc(p.notes)+'</p></div>':'')+
    /* LE CHEMIN INVERSE : d'une fiche VERS sa formation (08/08/2026). Les formations
       renvoyaient vers le réseau, mais rien ne ramenait du réseau vers ce qu'on peut
       apprendre. Une fiche porte `formation:"<nom>"` et le bouton apparaît. */
    (p.formation?'<div class="f-h" style="margin-top:22px">Se former là-dessus</div>'+
      '<div class="fboutons n1">'+ficheBtn(p.formation,p.formationTxt||'La formation')+'</div>':'')+
    boutons+
    '<div style="height:26px"></div>';
}

let gPath=[];

  let h='';
  if(n.q){

/* ═══ LES RÉSEAUX HOSPITALIERS (Mag, 08/08/2026) ═══

   reste. Quand je saurai qui fait partie d'un autre groupe, je te le dirai. »
   Les trois réseaux sont déjà documentés dans la fiche « Chercher quelqu'un aux
   urgences » : on les reprend ici, à un seul endroit. Ajouter un hôpital à un
   réseau = ajouter un mot dans la liste ci-dessous, rien d'autre. */
const URG_RESEAUX=[
  {nom:'CHIREC',  d:'Delta a le SMUR · Braine-l’Alleud', qui:[/anne\s*&\s*st\s*remi|sainte-anne|chirec|delta/i]},
  {nom:'IRIS',    d:'Les hôpitaux publics — un même réseau',
   qui:[/saint-pierre|brugmann|bracops|moli[eè]re|etterbeek|ixelles|paul brien|iris/i]},
  {nom:'HUB',     d:'L’universitaire de l’ULB — avec Bordet', qui:[/erasme|bordet|huderf|hub/i]}
];
function urgReseauDe(p){
  const n=p.nom||'';
  for(const r of URG_RESEAUX){ if(r.qui.some(function(x){ return x.test(n); })) return r; }
  return null;
}
let urgCat=null;
const URG_CATS=[
  /* « police » tout court attrapait la cellule EVA, qui parle de violences : on ne
     garde que les vrais numéros de secours. La règle des violences peut alors faire
     son travail (Mag, 08/08/2026). */
  {label:"Secours vital",     re:/112|^101|^police|secours|pompier/i},

   fait titre, et ce qui n'appartient à aucun est mis à part au lieu d'être noyé. */
function urgParReseau(list,cc){
  const par={}, hors=[];
  list.forEach(function(p){
    const r=urgReseauDe(p);
    if(r){ (par[r.nom]=par[r.nom]||[]).push(p); } else hors.push(p);
  });
  /* ⚠ PAS DE TITRES DE SECTION. Premier essai avec un intertitre par réseau : dans
     la grille à deux colonnes, il s'intercalait entre deux numéros et cassait la
     lecture (Mag, capture à l'appui). L'étiquette posée sur CHAQUE ligne dit la même
     chose, suit le numéro partout, et ne casse rien. Le regroupement, lui, reste :
     les CHIREC se suivent, puis les IRIS, puis le HUB. */
  let h='';
  URG_RESEAUX.forEach(function(r){
    const l=par[r.nom]; if(!l||!l.length) return;
    h+=l.sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); }).map(function(p){ return urgSq(p,cc); }).join('');
  });
  h+=hors.sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); }).map(function(p){ return urgSq(p,cc); }).join('');
  return h;
}

/* ═════════════════════════════════════════════════════════════════════════
   LE CARNET DE BORD ET LE PANIER DE RATTRAPAGE (07/08/2026)

   Avant, une partie ne gardait rien : on comptait les points et on passait à la
   suivante. Le chrono enchaînait au bout de quatre dixièmes de seconde, sans
   jamais montrer la correction — on ne pouvait donc rien apprendre (Mag :
   « tu joues très vite, mais à la fin j'aimerais les explications, sinon ça n'a
   aucun sens »).

   Deux choses maintenant :
   · le CARNET DE BORD (JEU.journal) garde ce qui s'est passé pendant la partie,
     pour que l'écran de fin puisse tout reposer à plat ;
   · le PANIER (JXS.rat) garde ce qu'on a raté, d'une partie à l'autre et d'un
     appareil à l'autre — il voyage dans le même paquet que les records, qui se
     synchronise déjà avec la base.

   Une entrée du panier est une question NORMALISÉE, quel que soit le jeu d'où
   elle vient : { q, opts, correct, src, pourquoi, n, d }. La clé, c'est le TEXTE
   de la question. Conséquence assumée et dite à Mag : si une fiche change ou
   qu'une question est reformulée, l'entrée disparaît d'elle-même — le compte peut
   donc baisser sans qu'on ait joué.
   ═════════════════════════════════════════════════════════════════════════ */
const RAT_SORTIE = 2;    // bonnes réponses pour sortir du panier. Deux, pas une :
                         // à quatre choix, tomber juste une fois peut être un coup
                         // de chance, et on croirait savoir ce qu'on ne sait pas.
const RAT_MAX    = 60;   // au-delà, les plus vieilles s'effacent
const RAT_PAQUET = 10;   // ce qu'une séance de rattrapage repose à la fois

function ratListe(){ if(!Array.isArray(JXS.rat)) JXS.rat=[]; return JXS.rat; }
function ratCompte(){ return ratListe().length; }
function ratOu(q){ return ratListe().findIndex(function(x){ return x.q===q; }); }

/* Raté : la question entre au panier, ou son compteur repart de zéro. */
function ratRate(Q){
  if(!Q || !Q.q || !Array.isArray(Q.opts) || Q.correct===undefined) return;
  const l=ratListe(), i=ratOu(Q.q);
  if(i>=0){ l[i].n=0; l[i].d=todayStr(); }
  else{
    l.push({ q:Q.q, opts:Q.opts.slice(), correct:Q.correct, src:Q.src||null,
             pourquoi:Q.pourquoi||null, n:0, d:todayStr() });
    if(l.length>RAT_MAX) l.splice(0, l.length-RAT_MAX);
  }
  jxSave();
}
/* Juste : une bonne réponse compte, quel que soit le jeu où elle tombe — pas
   seulement dans le rattrapage. À la deuxième, la question quitte le panier. */
function ratJuste(Q){
  const l=ratListe(), i=Q&&Q.q?ratOu(Q.q):-1;
  if(i<0) return;
  l[i].n=(l[i].n||0)+1;
  if(l[i].n>=RAT_SORTIE) l.splice(i,1);
  jxSave();
}
/* Le paquet à reposer : les plus anciennes d'abord. Les réponses sont REMÉLANGÉES
   à chaque fois — sinon on retiendrait « c'était la troisième » au lieu du sens. */
function ratPaquet(){
  return ratListe().slice(0, RAT_PAQUET).map(function(e){
    const bonne=e.opts[e.correct];
    const opts=qShuffle(e.opts.slice());
    return { q:e.q, opts:opts, correct:opts.indexOf(bonne), src:e.src, pourquoi:e.pourquoi };
  });
}

}

  if(type==='qui'){ JEU={type,terrain,items:jxQuiItems(terrain,12),i:0,niveau:1,score:0,answered:false,picked:-1}; go('#/quiz'); return; }
  if(type==='vf'){ JEU={type,terrain,items:jxVfItems(terrain,14),i:0,score:0,answered:false,picked:null}; go('#/quiz'); return; }
  if(type==='jour'){ JEU={type,terrain:{t:'tout'},q:jxQuestionDuJour(),answered:!!jxJourFait(),picked:-1}; go('#/quiz'); return; }
  if(type==='flip'){ JEU={type,terrain,qs:jxQuestions(terrain,20),i:0,retourne:false}; go('#/quiz'); return; }
  /* `recAvant` = le record AVANT cette partie. On le met de côté au départ parce
     que jxRecord() l'écrase dès qu'on fait mieux : sans ça, l'écran de fin
     annoncerait toujours un record égal au score du jour. */
  if(type==='serie'){ JEU={type,terrain,qs:jxQuestions(terrain,40),i:0,serie:0,answered:false,picked:-1,fini:false,recAvant:(JXS.rec&&JXS.rec.serie)||0}; go('#/quiz'); return; }
  if(type==='chrono'){
    JEU={type,terrain,qs:jxQuestions(terrain,60),i:0,score:0,answered:false,picked:-1,reste:60,fini:false,recAvant:(JXS.rec&&JXS.rec.chrono)||0};
    go('#/quiz');
    JXTIMER=setInterval(()=>{ if(!JEU||JEU.type!=='chrono'){ jxStop(); return; }
      JEU.reste--; if(JEU.reste<=0){ JEU.reste=0; JEU.fini=true; jxRecord('chrono',JEU.score); jxStop(); }
      render(); },1000);
    return;
  }
  // par défaut : les questions classiques
  /* DIX QUESTIONS PAR PARTIE (choix de Mag, 08/08/2026). Personne n'allait au bout
     de soixante ; et le rattrapage marche mieux sur des parties courtes et refaites. */
  JEU={type:'quiz',terrain,qs:jxQuestions(terrain,10),i:0,score:0,answered:false,picked:-1};
  go('#/quiz');
}
function jxDe(){

  const jeu=j[Math.floor(Math.random()*j.length)];

/* ── « Qui suis-je ? » : trois indices qui tombent un par un ────────── */
function jxQuiItems(ter,n){
  const doms=jxDoms(ter);
  let pool=DATA.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15);
  if(doms) pool=pool.filter(p=>doms.includes(p.domaine));
  const noms=pool.map(p=>p.nom);
  return qShuffle(pool).slice(0,n).map(p=>{
    const faux=qShuffle(noms.filter(x=>x!==p.nom)).slice(0,3);
    const opts=qShuffle([p.nom].concat(faux));
    /* Trois indices sur ce que FAIT le service, jamais sur son adresse : une maison
       déménage, et connaître une rue n'a jamais fait connaître un réseau. */
    const ind=[];
    ind.push({i:icon('palette'), t:'Je suis dans « '+DOM[p.domaine].label+' »'});
    ind.push({i:icon('chat'), t:(p.public && p.public.length>4) ? "Je m'adresse à : "+qTrim(p.public,90) : 'Je reçois sans condition particulière'});
    ind.push({i:icon('bulb'), t:'On vient chez moi pour : '+qTrim(p.desc,110)});
    return {p:p.id, nom:p.nom, opts, correct:opts.indexOf(p.nom), ind};
  }).filter(x=>x.opts.length===4);
}
/* ── Vrai ou faux : une affirmation, deux boutons ───────────────────── */
function jxVfItems(ter,n){
  const doms=jxDoms(ter);
  let pool=DATA.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15);
  if(doms) pool=pool.filter(p=>doms.includes(p.domaine));
  const autres=DATA.filter(p=>p.desc && p.desc.length>15);
  return qShuffle(pool).slice(0,n).map((p,idx)=>{
    const vrai = idx%2===0;
    let phrase;
    if(vrai){ phrase='« '+p.nom+' » : '+qTrim(p.desc,120); }
    else{
      const x=qShuffle(autres.filter(a=>a.nom!==p.nom && a.desc!==p.desc))[0];
      phrase='« '+p.nom+' » : '+qTrim(x?x.desc:'',120);
    }
    return {src:p.id, phrase, vrai, vraie:qTrim(p.desc,140), nom:p.nom};
  });
}
/* ── La question du jour : la même pour tout le monde, elle change à minuit ── */
/* La question du jour doit être LA MÊME pour tout le monde et NE PAS BOUGER d'un
   affichage à l'autre. Le générateur mélange tout au hasard : on remet donc les questions
   ET les réponses dans un ordre stable (alphabétique) avant de tirer avec la date.
   Sans ça, la réponse enregistrée pointait vers une autre option — et l'app affichait
   une correction avant même qu'on ait répondu. */
function jxQuestionDuJour(){
  /* Entièrement déterminée par la DATE : même fiche, mêmes leurres, même ordre pour tout
     le monde et à chaque affichage. Le générateur du quiz tire au hasard (les leurres
     changeaient à chaque rendu), on ne peut donc pas s'en servir ici. */
  const pool = DATA.filter(function(p){ return p.nom && DOM[p.domaine] && DOM[p.domaine].reseau && p.desc && p.desc.length>15; })
                   .sort(function(a,b){ return a.nom.localeCompare(b.nom,'fr'); });
  if(pool.length<4) return null;
  const j=todayStr(); let h=0; for(let i=0;i<j.length;i++) h=(h*31+j.charCodeAt(i))>>>0;
  const p = pool[h % pool.length];
  const bonne = qTrim(p.desc,110);
  const leurres=[];
  for(let k=1; leurres.length<3 && k<pool.length; k++){
    const x = pool[(h + k*7) % pool.length];
    const t = qTrim(x.desc,110);
    if(x.nom!==p.nom && t!==bonne && leurres.indexOf(t)<0) leurres.push(t);
  }
  if(leurres.length<3) return null;
  const opts = [bonne].concat(leurres).sort(function(a,b){ return a.localeCompare(b,'fr'); });
  return { q:"Que propose « "+p.nom+" » ?", opts:opts, correct:opts.indexOf(bonne), src:p.id };
}
function jxJourFait(){ return JXS.jour && JXS.jour.date===todayStr() ? JXS.jour : null; }

/* ── Répondre, selon le jeu ────────────────────────────────────────── */
function jxRep(i){
  if(!JEU || JEU.answered) return;
  const Q=JEU.qs?JEU.qs[JEU.i]:null;
  JEU.answered=true; JEU.picked=i;
  const juste = Q && i===Q.correct;
  if(Q){ jxNote(Q.src, juste); jxVu(Q, i, juste); }
  if(JEU.type==='serie'){
    if(juste){ JEU.serie++; jxRecord('serie',JEU.serie); }
    else { JEU.fini=true; }
  } else if(JEU.type==='chrono'){
    if(juste) JEU.score++;
    setTimeout(()=>{ if(JEU&&JEU.type==='chrono'&&!JEU.fini){ jxSuivante(); } },420);
  } else if(juste && JEU.score!==undefined){ JEU.score++; }
  render();
}
function jxSuivante(){
  if(!JEU) return;
  JEU.i++; JEU.answered=false; JEU.picked=-1; JEU.retourne=false; JEU.niveau=1;
  if(JEU.qs && JEU.i>=JEU.qs.length && JEU.type==='chrono'){ JEU.qs=JEU.qs.concat(jxQuestions(JEU.terrain,30)); }
  if(JEU.qs && JEU.i>=JEU.qs.length && JEU.type==='serie'){ JEU.qs=JEU.qs.concat(jxQuestions(JEU.terrain,30)); }
  render();
}
/* Les deux flèches en rond du bandeau. Dessinées ici plutôt que prises dans les
   pictos : aucun n'exprimait « retourner », et celui-ci doit se lire à 15 px. */
function icoRetourner(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" '+
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M3 12a9 9 0 0 1 15.5-6.2M21 12a9 9 0 0 1-15.5 6.2"/>'+
    '<path d="M18 3v3.5h-3.5M6 21v-3.5h3.5"/></svg>';
}
/* LA CARTE SE RETOURNE POUR DE VRAI (Mag, 08/08/2026 : « mets un effet de
   retournement »). Le CSS de la bascule existait depuis toujours — perspective,
   preserve-3d, rotateY(180deg), une transition de .55 s. Il ne servait à rien :
   `render()` réécrivait tout le HTML de la page à chaque clic, donc le navigateur
   découvrait une carte NEUVE déjà retournée. Une transition ne s'anime qu'entre
   deux états du MÊME élément — on se contente donc de poser la classe. */
function jxFlip(){
  if(!JEU) return;
  JEU.retourne=!JEU.retourne;
  const el=document.querySelector('.jx-flip');
  if(el) el.classList.toggle('on', JEU.retourne);
  else render();   /* filet : si la carte n'est pas à l'écran, on redessine */
}
function jxIndice(){ if(JEU && JEU.niveau<3){ JEU.niveau++; render(); } }
/* « Qui suis-je ? » et « Vrai ou faux » ne posent pas des questions de la même
   forme que les autres. Pour que le carnet et le panier n'aient qu'UNE forme à
   connaître, chacun traduit la sienne ici — les indices entrent dans le texte de
   la question, sinon on la relirait sans comprendre de quoi elle parle. */
function quiNormalise(it){
  const ind=(it.ind||[]).map(function(x){ return x.t; }).join(' · ');
  return { q:'Qui suis-je ?'+(ind?' '+ind:''), opts:it.opts, correct:it.correct, src:it.p };
}
function vfNormalise(it){
  return { q:it.phrase+' — vrai ou faux ?', opts:['Vrai','Faux'],
           correct:it.vrai?0:1, src:it.src,
           pourquoi: it.vrai ? null : ('En réalité : '+it.vraie) };
}
function jxRepQui(i){
  if(!JEU || JEU.answered) return;
  const it=JEU.items[JEU.i]; JEU.answered=true; JEU.picked=i;
  const juste=i===it.correct;
  if(juste) JEU.score += (4-JEU.niveau);      // trouvé au 1er indice = 3 points
  jxNote(it.p, juste); jxVu(quiNormalise(it), i, juste); render();
}
function jxRepVf(rep){
  if(!JEU || JEU.answered) return;
  const it=JEU.items[JEU.i]; JEU.answered=true; JEU.picked=rep;
  const juste = (rep===it.vrai);
  if(juste) JEU.score++;
  jxNote(it.src, juste); jxVu(vfNormalise(it), rep?0:1, juste); render();
}
function jxSuivanteItem(){ if(!JEU) return; JEU.i++; JEU.answered=false; JEU.picked=null; JEU.niveau=1; render(); }
function jxRepJour(i){
  if(!JEU || JEU.answered || !JEU.q) return;
  const juste = i===JEU.q.correct;
  JEU.answered=true; JEU.picked=i;
  JXS.jour={date:todayStr(), juste:juste, choisi:JEU.q.opts[i]}; jxSave();
  jxNote(JEU.q.src, juste); jxVu(JEU.q, i, juste); render();
}
/* ── La roue ───────────────────────────────────────────────────────── */
/* Un domaine ne peut fabriquer une question qu'avec assez de fiches : il faut une
   bonne réponse ET trois leurres distincts. En dessous de 5 fiches, le générateur
   rend une liste vide — et le jeu se terminait avant de commencer. C'est ce qui est
   arrivé en créant « Recherche famille » (2 fiches) : la roue pouvait tomber dessus
   et « il ne se passait rien » (Mag, 08/08/2026). */
function domaineJouable(k){
  try{ return DATA.filter(function(p){ return p.nom && p.domaine===k && p.desc && p.desc.length>15; }).length>=5; }
  catch(e){ return false; }
}
function jxTournerRoue(){
  if(!JEU || JEU.tourne) return;
  const tous=DOMAINES.filter(d=>d.reseau && domaineJouable(d.key));
  const n=Math.min(8,tous.length), pas=360/n;
  const gagnant=Math.floor(Math.random()*n);
  JEU.tourne=true;
  const cible=360*5 + (360 - (gagnant*pas + pas/2));
  JEU.angle = JEU.angle + (cible - (JEU.angle%360));
  const el=document.getElementById('jxRoue'); if(el) el.style.transform='rotate('+JEU.angle+'deg)';
  setTimeout(()=>{
    if(!JEU) return;
    const dom=JEU.secteurs[gagnant];
    jxJouer('quiz',{t:'dom',k:dom.key});
    /* ⚠ ON REDESSINE À LA MAIN. La roue vit DÉJÀ sur #/quiz : jxJouer() y renvoie,
       l'adresse ne change pas, aucun événement ne part, et l'écran reste sur la roue
       qui a fini de tourner. C'est ça, « je tourne la roue et il ne se passe rien »
       (Mag, 08/08/2026). */
    render();
  },4400);
}

/* Le quiz porte sur le MÉTIER du réseau : qui fait quoi, pour quel public, dans quel domaine.
   Volontairement AUCUNE question sur les numéros de téléphone ni les adresses — ça, on le cherche
   dans l'app au moment où on en a besoin ; ce qu'il faut connaître par cœur, c'est à qui s'adresser. */
/* ═══ LES QUESTIONS ÉCRITES À LA MAIN ═══
   Le reste du quiz se fabrique tout seul à partir des fiches. Ces questions-là, non : elles
   portent sur des règles de droit, où une formulation approximative ferait plus de mal que
   de bien. Écrites le 31/07/2026 avec la formation « Adresse de référence, CPAS compétent
   et agrément », d'après les textes cités en bas de cette formation. Chaque question porte
   son POURQUOI : on ne retient pas une bonne réponse, on retient une raison. */
/* Elles rejoignent aussi « Tout mélangé » : la règle de droit croise les fiches du réseau,
   c'est comme ça qu'on la retient pour de bon. */

let QZ=null;
/* Le design prévoit une manche de 5 questions (« 5 questions · 3 min »). */
function quizStart(t){QZ=quizGen(t); if(QZ&&QZ.qs&&QZ.qs.length>5) QZ.qs=QZ.qs.slice(0,5); render();window.scrollTo(0,0);}
function quizAnswer(i){if(!QZ||QZ.answered)return;QZ.answered=true;QZ.picked=i;
  QZ.res=QZ.res||[];QZ.res[QZ.i]=(i===QZ.qs[QZ.i].correct);
  if(i===QZ.qs[QZ.i].correct)QZ.score++;render();}
function quizNext(){QZ.i++;QZ.answered=false;QZ.picked=-1;render();window.scrollTo(0,0);}
function quizTheme(){QZ=null;render();window.scrollTo(0,0);}
function quizFiche(id){const p=DATA.find(x=>x.id===id);if(p)go('#/f/'+p.sid);}
/* Les aides du renderer (en-tête, options, retour au choix). */

/* Ce qu'on maîtrise, domaine par domaine — nourri par toutes les parties. */
function jxProgHTML(){
  /* Chaque ligne est jouable : on appuie, on rejoue ce domaine. À 100 %, on remet le
     compteur à zéro avant de rejouer — sinon on ne saurait jamais si c'était de la chance. */
  const lignes=DOMAINES.filter(d=>d.reseau).map(d=>{
    const s=JXS.dom[d.key]; if(!s||!s.v) return '';
    const pc=Math.round(s.j/s.v*100);
    const parfait = pc>=100;
    return `<button class="jx-l${parfait?' parfait':''}" onclick="rejouerDomaine('${d.key}',${parfait})">
      <span>${esc(d.short||d.label)}</span>
      <div class="b"><i style="width:${pc}%;background:${tileColor(d.key)}"></i></div>
      <div class="n">${pc}%</div>
      <em>${parfait?'Refaire à zéro':'Rejouer'}</em></button>`;
  }).filter(Boolean).join('');
  const rec = [];
  if(JXS.rec.serie) rec.push(icon('jserie')+' série record : <b>'+JXS.rec.serie+'</b>');
  if(JXS.rec.chrono) rec.push(icon('jchrono')+' chrono record : <b>'+JXS.rec.chrono+'</b>');
  return `<div class="jx-prog"><h4>Ce que je maîtrise</h4>
    ${lignes || '<div class="jx-vide">Rien encore : joue une partie et la barre se remplit, domaine par domaine.</div>'}
    ${rec.length?`<div class="jx-vide" style="margin-top:10px">${rec.join(' · ')}</div>`:''}</div>`;
}
/* Rejouer un domaine depuis « Ce que je maîtrise ». Si on y était à 100 %, on efface son
   compteur d'abord : le nouveau pourcentage mesure alors vraiment la connaissance, pas la chance. */
function rejouerDomaine(k, remiseAZero){
  if(remiseAZero){ delete JXS.dom[k]; jxSave(); }
  jxJouer('quiz', {t:'dom', k});
}
/* ══════════════════════════════════════════════════════════════════════════
   LA CORRECTION D'UNE QUESTION — la pièce qui manquait.
   Elle était restée dans l'ancienne app quand les jeux ont été rapatriés : quatre
   jeux sur huit mouraient au premier clic, sans rien dire (Mag, 06/08/2026).
   C'est elle qui fait la FINALITÉ d'un jeu : on ne se contente pas de dire juste
   ou faux, on montre la bonne réponse, pourquoi, et la fiche à relire.
   ══════════════════════════════════════════════════════════════════════════ */
function quizCorrection(Q){
  if(!Q) return '';
  const p = Q.src ? DATA.find(function(x){ return x.id===Q.src; }) : null;
  const bonne = Q.opts[Q.correct];
  const choisie = (typeof JEU!=='undefined' && JEU && JEU.picked!==undefined && JEU.picked!==null)
                  ? JEU.picked : (typeof QZ!=='undefined' && QZ ? QZ.picked : -1);
  const juste = choisie===Q.correct;
  let dedans = '<div class="qc-rep"><span class="qc-lab">La bonne réponse</span><b>'+esc(bonne)+'</b></div>';
  if(Q.pourquoi) dedans += '<p class="qc-txt">'+esc(Q.pourquoi)+'</p>';
  if(p){
    if(p.desc) dedans += '<p class="qc-txt">'+esc(p.desc)+'</p>';
    const infos=[];
    if(p.public) infos.push('<span class="qc-chip">Pour : '+esc(p.public)+'</span>');
    if(p.commune && p.commune!=='Régional / Toutes communes') infos.push('<span class="qc-chip">'+esc(p.commune)+'</span>');
    if(p.tel) infos.push('<span class="qc-chip">'+esc(p.tel)+'</span>');
    if(infos.length) dedans += '<div class="qc-chips">'+infos.join('')+'</div>';
    dedans += '<button class="qc-btn" onclick="go(\'#/f/'+p.sid+'\')">'+
      '<span class="ic">'+icon('compass')+'</span><span>Ouvrir la fiche</span></button>';
  }
  return '<div class="qc '+(juste?'ok':'ko')+'">'+
    '<div class="qc-h">'+(juste?'✓ Bonne réponse':'✕ Ce n\'était pas ça')+'</div>'+dedans+'</div>';
}

/* ══════════════════════════════════════════════════════════════════════════
   L'ARMATURE COMMUNE DES HUIT JEUX (refonte du 06/08/2026)
   Avant, chaque jeu avait son en-tête, son retour, sa largeur : on ne savait plus
   où on était (« je clique sur Retour aux jeux et j'arrive au quiz »). Désormais
   TOUS passent par jxTete() : le nom DU JEU en grand, son domaine, une flèche qui
   ramène toujours à la salle de jeux, et la couleur du jeu portée jusqu'au bout.
   ══════════════════════════════════════════════════════════════════════════ */
/* Le rattrapage n'a pas de carte dans la salle de jeux : ce n'est pas un 9e jeu,
   c'est TA liste. Il porte quand même un nom et une couleur pour son en-tête.
   NOIR, et pas rouge : dans COUSIN le rouge appartient aux urgences. */
/* Picto « escalade » et pas la cible : la cible est déjà celle de « Vrai ou faux »,
   et rattraper c'est remonter, pas viser. */
const JEU_RAT={ k:'rat', ic:'escalade', nom:'Rattrapage', c:'#1b1b1b', sombre:true,
                p:'Ce que tu as raté revient' };
/* Le quiz classique (celui où la roue nous dépose) n'est pas une carte de la
   salle de jeux non plus, mais il lui faut un nom pour l'écran de fin. */
const JEU_QUIZ={ k:'quiz', ic:'bulb', nom:'Quiz', c:'#f5c542', p:'Les questions du réseau' };
function jxDef(k){
  if(k==='rat')  return JEU_RAT;
  if(k==='quiz') return JEU_QUIZ;
  return JEUX.find(function(x){ return x.k===k; })||JEUX[0];
}
function jxTete(k, sousTitre){
  const j=jxDef(k);
  return '<div class="jxtete" style="--jc:'+j.c+'">'+
    '<button class="jxback" onclick="go(\'#/jeux\')" aria-label="Retour aux jeux">'+
      '<span class="ic">'+icon('chevron')+'</span></button>'+
    '<span class="jxpic" style="background:'+j.c+';color:'+couleurPictoJeu(j)+'">'+
      '<span class="ic">'+icon(j.ic)+'</span></span>'+
    '<span class="jxtx"><b>'+esc(j.nom)+'</b>'+
      '<em>'+esc(sousTitre||jxNomTerrain(JEU&&JEU.terrain||{t:'tout'}))+'</em></span>'+
  '</div>';
}
/* ═════════════════════════════════════════════════════════════════════════
   L'ÉCRAN DE FIN — le même pour les huit jeux (07/08/2026)

   Sa raison d'être, dans les mots de Mag : « le chrono, tu joues très très vite,
   mais après j'aimerais avoir toutes les explications pour apprendre, sinon ça
   n'a aucun sens ». Donc : le résultat, puis TES ERREURS D'ABORD, chacune avec la
   bonne réponse et son pourquoi. Les bonnes réponses sont repliées — tu les as
   déjà, elles ne sont là que si tu veux les revoir.

   HONNÊTETÉ SUR LES EXPLICATIONS : seules les ~30 questions écrites à la main
   (adresse de référence, CPAS compétent, agrément) portent un « pourquoi » rédigé,
   avec son article de loi. Les autres sont fabriquées à partir des fiches : leur
   explication, c'est la bonne réponse et la fiche elle-même, ouvrable d'un doigt.
   On n'invente pas de pourquoi pour combler — ce serait du faux contenu.
   ═════════════════════════════════════════════════════════════════════════ */
/* La couleur d'un jeu ne convient pas aux deux fonds de l'écran de fin : posée sur
   le bandeau NOIR il faut qu'elle soit claire, posée sur la CRÈME il faut qu'elle
   soit foncée. Le rose pâle de « Vrai ou faux » était invisible aux deux endroits.
   On garde donc la couleur du jeu quand elle est lisible, et on retombe sinon sur
   le jaune (sur noir) ou sur l'encre (sur crème). */
function jxSurNoir(c){ return (!c || c==='#1b1b1b') ? '#f5c542' : c; }
function jxSurCreme(c){
  const m=/^#([0-9a-f]{6})$/i.exec(c||''); if(!m) return '#1b1b1b';
  const n=parseInt(m[1],16);
  const lum=(0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255))/255;
  return lum>0.62 ? '#1b1b1b' : c;
}
function jxFinLigne(x){
  const p = x.src ? DATA.find(function(y){ return y.id===x.src; }) : null;
  const donnee = (x.donnee!==undefined && x.donnee!==null && x.opts) ? x.opts[x.donnee] : null;
  let h='<div class="jxf-c'+(x.juste?' ok':'')+'">'+
        '<div class="jxf-q">'+esc(x.q)+'</div>';
  if(!x.juste && donnee) h+='<div class="jxf-tien">'+esc(donnee)+'</div>';
  h+='<div class="jxf-bonne"><i>→</i><span>'+esc(x.opts?x.opts[x.correct]:'')+'</span></div>';
  if(x.pourquoi) h+='<div class="jxf-pq"><b>Pourquoi :</b> '+esc(x.pourquoi)+'</div>';
  if(p) h+='<button class="jxf-fiche" onclick="go(\'#/f/'+p.sid+'\')">Ouvrir la fiche</button>';
  return h+'</div>';
}
/* `gros` et `libelle` = le chiffre de CE jeu (un score, une série, des points) ;
   `secondUn`/`secondDeux` = la case de droite quand il y a un record à montrer. */
function jxFin(k, gros, libelle, secondUn, secondDeux){
  const j=jxDef(k);
  const jour=(typeof JEU!=='undefined' && JEU && Array.isArray(JEU.journal))?JEU.journal:[];
  const faux=jour.filter(function(x){ return !x.juste; });
  const bons=jour.filter(function(x){ return  x.juste; });
  const reste=ratCompte();

  let h='<div class="jxf">'+
    '<div class="jxf-tete" style="--jc:'+j.c+'">'+
      '<span class="jxf-sur" style="color:'+jxSurNoir(j.c)+'">'+
        esc(j.nom.toUpperCase())+' · '+esc(jxNomTerrain((JEU&&JEU.terrain)||{t:'tout'}).toUpperCase())+'</span>'+
      '<b>Fini</b></div>'+
    '<div class="jxf-chif">'+
      '<div><span class="g" style="color:'+jxSurCreme(j.c)+'">'+gros+'</span><em>'+esc(libelle)+'</em></div>'+
      (secondUn!==undefined?'<div><span class="g">'+secondUn+'</span><em>'+esc(secondDeux||'')+'</em></div>':'')+
    '</div>';

  if(!jour.length){
    h+='<div class="jxf-rien">Cette partie n’a gardé aucune question à revoir.</div>';
  }
  if(faux.length){
    h+='<div class="jxf-sect">'+(faux.length>1?'Tes '+faux.length+' erreurs':'Ton erreur')+'</div>'+
       faux.map(jxFinLigne).join('');
  } else if(jour.length){
    h+='<div class="jxf-sect">Aucune erreur</div>'+
       '<div class="jxf-rien">Rien à revoir sur cette partie.</div>';
  }
  if(bons.length){
    h+='<div class="jxf-sect">'+bons.length+' bonne'+(bons.length>1?'s':'')+' réponse'+(bons.length>1?'s':'')+'</div>'+
       '<button class="jxf-plier" onclick="jxFinPlier(this)">Les revoir aussi</button>'+
       '<div class="jxf-bons" hidden>'+bons.map(jxFinLigne).join('')+'</div>';
  }
  /* Le panier : on ne le propose que s'il y a vraiment quelque chose dedans, et
     jamais depuis le rattrapage lui-même (on y est déjà). */
  if(reste && k!=='rat'){
    h+='<button class="jxf-rat" onclick="jxJouer(\'rat\')">'+
       'Rattraper — '+reste+' question'+(reste>1?'s':'')+' en attente</button>';
  }
  if(k==='rat' && !reste){
    h+='<div class="jxf-vide">Ton panier est vide. Tout ce que tu avais raté, tu le sais.</div>';
  }
  return h+jxPied(k)+'</div>';
}
function jxFinPlier(b){
  const d=b.nextElementSibling; if(!d) return;
  d.hidden=!d.hidden;
  b.textContent = d.hidden ? 'Les revoir aussi' : 'Les replier';
}

/* Le pied de partie : rejouer le même jeu, ou en changer. Une partie se termine
   toujours quelque part — c'est ça, la finalité. */
function jxPied(k){
  return '<div class="jxpied">'+
    '<button class="jxrejouer" onclick="jxJouer(\''+k+'\',JEU&&JEU.terrain||{t:\'tout\'})">Rejouer</button>'+
    '<button class="jxautre" onclick="go(\'#/jeux\')">Un autre jeu</button>'+
  '</div>';
}
function jxRetourHub(){ return `<button class="jxautre" style="width:100%;margin-top:10px" onclick="go('#/jeux')">← Retour aux jeux</button>`; }

/* ═════════════════════════════════════════════════════════════════════════
   LA CARTE DE QUESTION (08/08/2026) — design validé par Mag à partir d'une carte
   qu'elle a envoyée. Fond noir, pastilles de progression en haut à gauche, compteur
   à droite, la question en grand, et les réponses lettrées ANCRÉES EN BAS.

   Pourquoi ancrées en bas et non centrées comme sur son image : certaines questions
   du quiz font trois lignes de plus, et des boutons centrés partiraient hors de
   l'écran. La question grandit vers le haut, les réponses ne bougent pas — le pouce
   les retrouve toujours au même endroit.

   Les pastilles disent le RÉSULTAT, pas seulement la position : bleu = juste,
   fuchsia = raté, crème = où on en est, gris = à venir. Le fuchsia remplace le rouge :
   dans COUSIN le rouge appartient aux urgences.
   ═════════════════════════════════════════════════════════════════════════ */
const QZ_LETTRES=['A','B','C','D','E','F'];

/* Les pastilles, lues dans le carnet de bord de la partie. */
/* Les pastilles ne valent que sur une partie COURTE : à 28 questions, douze ronds gris
   ne disent rien et font du bruit (Mag, 08/08/2026 : « pas très beau »). Au-delà de dix,
   on passe à une barre qui avance, et qui garde les couleurs juste/raté. */
function jxDots(total, i){
  const j=(JEU&&Array.isArray(JEU.journal))?JEU.journal:[];
  const n=total||0;
  if(n>10){
    const justes=j.filter(function(x){return x.juste;}).length, rates=j.length-justes;
    const pc=function(v){ return (v/n*100).toFixed(1)+'%'; };
    return '<div class="qz-barre">'+
      '<i class="ok" style="width:'+pc(justes)+'"></i>'+
      '<i class="ko" style="width:'+pc(rates)+'"></i>'+
      '</div>'+(j.length?'<span class="qz-sc">'+justes+' bonne'+(justes>1?'s':'')+'</span>':'');
  }
  let h='<div class="qz-dots">';
  for(let k=0;k<n;k++){
    let cl='av';
    if(k<j.length) cl = j[k].juste ? 'ok' : 'ko';
    else if(k===i) cl='ici';
    h+='<i class="'+cl+'"></i>';
  }
  return h+'</div>';
}
/* Le bloc « pourquoi » + la fiche, sous la correction. */
function jxPourquoi(Q){
  const p = Q && Q.src ? DATA.find(function(x){ return x.id===Q.src; }) : null;
  const txt = (Q&&Q.pourquoi) ? Q.pourquoi : (p&&p.desc ? p.desc : '');
  if(!txt && !p) return '';
  return '<div class="qz-pq">'+
    '<div class="qz-pql">Pourquoi</div>'+
    (txt?'<div class="qz-pqt">'+esc(txt)+'</div>':'')+
    (p?'<button class="qz-fiche" onclick="go(\'#/f/'+p.sid+'\')">Ouvrir la fiche</button>':'')+
  '</div>';
}
/* LA CARTE. `fn` = la fonction qui reçoit la réponse (jxRep…), `suite` = le bouton du bas. */
function jxCarteQuestion(Q, fn, o){
  o=o||{};
  const rep = JEU.answered;
  const choisi = (JEU.picked===undefined||JEU.picked===null) ? -1 : JEU.picked;
  let lignes='';
  if(!rep){
    lignes = Q.opts.map(function(t,i){
      return '<button class="qz-opt" onclick="'+fn+'('+i+')">'+
        '<span class="qz-l">'+(QZ_LETTRES[i]||'?')+'</span>'+
        '<span class="qz-t">'+esc(t)+'</span></button>';
    }).join('');
  } else {
    /* APRÈS LA RÉPONSE, LES MAUVAISES DISPARAISSENT : il ne reste que la bonne et,
       si on s'est trompé, celle qu'on avait choisie. Deux lignes au lieu de quatre —
       l'œil va droit à ce qu'il faut retenir. */
    lignes = '<div class="qz-opt bon"><span class="qz-l">✓</span><span class="qz-t">'+esc(Q.opts[Q.correct])+'</span></div>';
    if(choisi>=0 && choisi!==Q.correct)
      lignes += '<div class="qz-opt rate"><span class="qz-l">✕</span><span class="qz-t">'+esc(Q.opts[choisi])+'</span></div>';
  }
  return '<div class="qz">'+
    '<div class="qz-tete">'+jxDots(o.total, o.i)+
      '<span class="qz-n">'+((o.i||0)+1)+(o.total?' / '+o.total:'')+'</span></div>'+
    (o.sur?'<div class="qz-sur">'+esc(o.sur)+'</div>':'')+
    '<div class="qz-q'+(rep?' petite':'')+'">'+esc(Q.q)+'</div>'+
    '<div class="qz-opts">'+lignes+'</div>'+
    (rep?jxPourquoi(Q):'')+
    (rep&&o.suite?'<button class="qz-suite" onclick="'+o.suite+'">'+esc(o.libelle||'Question suivante →')+'</button>':'')+
  '</div>';
}

function jxOptsHTML(Q, fn){
  return Q.opts.map((o,idx)=>{
    let cls='quiz-opt';
    if(JEU.answered){ if(idx===Q.correct) cls+=' good'; else if(idx===JEU.picked) cls+=' bad'; }
    return `<button class="${cls}" ${JEU.answered?'disabled':''} onclick="${fn}(${idx})">${esc(o)}</button>`;
  }).join('');
}

/* L'affichage des 8 jeux, rapatrié tel quel. */
function jxJeuHTML(){
  const T=JEU.type;

  if(T==='equipe'){
    const moi=(JXS.sem && JXS.sem.lundi===semaineLundi()) ? JXS.sem : {justes:0,total:0};
    const e=JEU.equipe;
    let bloc;
    if(e===null) bloc = `<div class="jx-vide">Je compte…</div>`;
    else if(e==='hors-ligne') bloc = `<div class="jx-vide">Hors ligne — je ne peux pas lire le compteur de l'équipe. Le tien est juste en dessous.</div>`;
    else if(e==='absente') bloc = `<div class="jx-vide">Le compteur partagé n'est pas encore branché : il attend une table dans la base. En attendant, voilà le tien.</div>`;
    else bloc = `<div class="eq-gros">${e.justes}</div>
      <div class="eq-sous">bonne${e.justes>1?'s':''} réponse${e.justes>1?'s':''} cette semaine, à ${e.gens>1?e.gens+' ':''}${e.gens>1?'':'une personne'}${e.gens>1?'personnes':''}</div>`;
    return `<div class="pf-wrap">
      ${jxTete('equipe','depuis lundi')}
      <div class="eq-carte">${bloc}</div>
      <div class="jx-bar"><span class="gros">${icon('check')}</span><span><b>Toi : ${moi.justes} bonne${moi.justes>1?'s':''}</b><em>sur ${moi.total} question${moi.total>1?'s':''} jouées cette semaine</em></span></div>
      <div class="pourq">Pas de classement, pas de comparaison entre collègues : un seul chiffre, celui de l'équipe. Il repart à zéro chaque lundi.</div>
      <button class="quiz-next" onclick="jxJouer('quiz',{t:'tout'})">Ajouter des points — jouer maintenant</button>
      ${jxPied('equipe')}</div>`;
  }

  if(T==='roue'){
    const tous=DOMAINES.filter(d=>d.reseau && domaineJouable(d.key)).slice(0,8);
    JEU.secteurs=tous;
    const pas=360/tous.length;
    const parts=tous.map((d,i)=>`${tileColor(d.key)} ${i*pas}deg ${(i+1)*pas}deg`).join(',');
    const labs=tous.map((d,i)=>{
      const a=(i*pas+pas/2-90+360)%360, g=a>90&&a<270;
      const mot=(d.short||d.label); const court = mot.length>10 ? mot.slice(0,9)+'.' : mot;
      return `<div class="lab" style="transform:rotate(${g?a+180:a}deg) translate(${g?'-104px':'32px'},-6px);text-align:${g?'right':'left'}">${esc(court)}</div>`;
    }).join('');
    return `<div class="pf-wrap">${jxTete('roue', JEU.tourne?'elle tourne…':'elle choisit pour toi')}<div class="jx-roue-box">
      <div class="jx-rh"><div class="jx-fl"></div>
        <div class="jx-roue" id="jxRoue" style="background:conic-gradient(${parts})">${labs}</div>
        <div class="jx-moy">COUSIN</div></div>
      <button class="quiz-next" ${JEU.tourne?'disabled':''} onclick="jxTournerRoue()">${icon('jroue')} ${JEU.tourne?'…':'Faire tourner'}</button>
      </div>${jxPied('roue')}</div>`;
  }

  if(T==='flip'){
    const Q=JEU.qs[JEU.i];
    if(!Q) return `<div class="pf-wrap">${jxFin('flip', JEU.qs.length, 'cartes vues')}</div>`;
    return `<div class="pf-wrap">${jxTete('flip','Carte '+(JEU.i+1)+' sur '+JEU.qs.length)}
      <div class="jx-flip${JEU.retourne?' on':''}" onclick="jxFlip()">
        <div class="jx-flip-in">
          <div class="jx-face" style="background:#5b8fd4"><small>Carte ${JEU.i+1}</small><b>${esc(Q.q)}</b>
            <div class="jx-bandeau">${icoRetourner()}Retourner la carte</div></div>
          <div class="jx-face dos"><small>La réponse</small><b>${esc(Q.opts[Q.correct])}</b>
            <div class="jx-bandeau">${icoRetourner()}Revenir à la question</div></div>
        </div>
      </div>
      <button class="quiz-next" onclick="jxSuivante()">Carte suivante</button>${jxPied('flip')}</div>`;
  }

  if(T==='serie'){
    if(JEU.fini){
      /* La question qui t'a arrêtée n'a plus besoin d'être répétée ici : elle est
         dans le carnet, en tête des erreurs de l'écran de fin. */
      /* Au tout premier essai il n'y a pas de record à comparer : afficher
         « 0 · ton record · battu » ne veut rien dire. On ne montre la case que
         quand il y a vraiment quelque chose devant quoi se situer. */
      const av=JEU.recAvant||0;
      return `<div class="pf-wrap">${av
        ? jxFin('serie', JEU.serie, "d'affilée", av, JEU.serie>av ? 'ton record · battu' : 'ton record')
        : jxFin('serie', JEU.serie, "d'affilée")}</div>`;
    }
    const Q=JEU.qs[JEU.i];
    return `<div class="pf-wrap">${jxCarteQuestion(Q,'jxRep',{
      total:Math.max(JEU.serie+1,5), i:JEU.i,
      sur:'La série · '+JEU.serie+' d\'affilée',
      suite:(JEU.answered&&JEU.picked===Q.correct)?'jxSuivante()':'',
      libelle:'Continuer la série →'})}
      ${JEU.answered&&JEU.picked!==Q.correct?jxPied('serie'):''}</div>`;
  }

  if(T==='chrono'){
    if(JEU.fini){
      const av=JEU.recAvant||0, n=(JEU.journal||[]).length;
      return `<div class="pf-wrap">${av
        ? jxFin('chrono', JEU.score, 'bonnes sur '+n, av, JEU.score>av ? 'ton record · battu' : 'ton record')
        : jxFin('chrono', JEU.score, 'bonnes sur '+n)}</div>`;
    }
    const Q=JEU.qs[JEU.i];
    /* Le chrono garde son compte à rebours à la place du compteur de questions :
       c'est le temps qui presse, pas le nombre. */
    return `<div class="pf-wrap">${jxCarteQuestion(Q,'jxRep',{
      total:JEU.journal?JEU.journal.length+1:1, i:JEU.i,
      sur:'Chrono · '+JEU.reste+' s · '+JEU.score+' bonne'+(JEU.score>1?'s':'')})}</div>`;
  }

  if(T==='qui'){
    const it=JEU.items[JEU.i];
    if(!it) return `<div class="pf-wrap">${jxFin('qui', JEU.score, 'points sur '+(JEU.items.length*3))}</div>`;
    // Après la réponse, tous les indices se découvrent — sinon on ne retient rien.
    const cache = idx => !JEU.answered && idx+1>JEU.niveau;
    const inds=it.ind.map((x,idx)=>`<div class="jx-ind${cache(idx)?' floue':''}"><i>${x.i}</i><span>${cache(idx)?'Indice caché — appuie sur « Un indice de plus »':esc(x.t)}</span></div>`).join('');
    const LETTRES=['A','B','C','D','E'];
    const opts=it.opts.map((o,idx)=>{
      let cls='quiz-opt lettre';
      if(JEU.answered){ if(idx===it.correct) cls+=' good'; else if(idx===JEU.picked) cls+=' bad'; }
      return `<button class="${cls}" ${JEU.answered?'disabled':''} onclick="jxRepQui(${idx})"><i>${LETTRES[idx]||'?'}</i><span>${esc(o)}</span></button>`;
    }).join('');
    return `<div class="pf-wrap">${jxTete('qui','Question '+(JEU.i+1)+' sur '+JEU.items.length+' · '+JEU.score+' point'+(JEU.score>1?'s':''))}
      <div class="jx-titre">Les indices</div>
      ${inds}
      ${(!JEU.answered && JEU.niveau<3)?`<button class="quiz-next" style="margin:4px 0 16px" onclick="jxIndice()">Un indice de plus (−1 point)</button>`:''}
      <div class="jx-titre" style="margin-top:18px">Alors, qui suis-je ?</div>
      <div class="quiz-opts">${opts}</div>
      ${JEU.answered?`<div class="quiz-corr">${JEU.picked===it.correct?'Bien vu — c\u2019était ':'C\u2019était '}<b>${esc(it.nom)}</b>. Les trois indices sont dépliés au-dessus.</div>
      ${quizCorrection({src:it.p, opts:it.opts, correct:it.correct})}
      <button class="quiz-next" onclick="jxSuivanteItem()">Suivant</button>${jxPied('qui')}`:''}</div>`;
  }

  if(T==='vf'){
    const it=JEU.items[JEU.i];
    if(!it) return `<div class="pf-wrap">${jxFin('vf', JEU.score, 'justes sur '+JEU.items.length)}</div>`;
    const juste=(JEU.picked===it.vrai);
    return `<div class="pf-wrap">${jxTete('vf','Question '+(JEU.i+1)+' sur '+JEU.items.length+' · '+JEU.score+' point'+(JEU.score>1?'s':''))}
      <div class="quiz-q">${esc(it.phrase)}</div>
      ${JEU.answered
        ? `<div class="quiz-corr" style="border-left:4px solid ${juste?'#6cb392':'#e63329'}"><b>${juste?'Bien vu !':'Raté'}</b><br>${it.vrai?'C’était vrai.':'C’était faux — en réalité : '+esc(it.vraie)}</div>
           ${quizCorrection({src:it.src, opts:[it.vraie], correct:0})}
           <button class="quiz-next" onclick="jxSuivanteItem()">Suivant</button>${jxRetourHub()}`
        : `<div class="jx-vf"><button class="jx-vrai" onclick="jxRepVf(true)">✓ Vrai</button><button class="jx-faux" onclick="jxRepVf(false)">✕ Faux</button></div>`}
    </div>`;
  }

  if(T==='jour'){
    const Q=JEU.q, fait=jxJourFait();
    if(!Q) return `<div class="pf-wrap"><div class="pf-empty"><p>Pas de question aujourd'hui.</p></div>${jxRetourHub()}</div>`;
    if(fait && !JEU.answered) JEU.picked=Q.opts.indexOf(fait.choisi);
    const choisi = JEU.answered ? JEU.picked : (fait ? Q.opts.indexOf(fait.choisi) : -1);
    const opts=Q.opts.map((o,idx)=>{
      let cls='quiz-opt';
      if(JEU.answered||fait){ if(idx===Q.correct) cls+=' good'; else if(idx===choisi) cls+=' bad'; }
      return `<button class="${cls}" ${(JEU.answered||fait)?'disabled':''} onclick="jxRepJour(${idx})">${esc(o)}</button>`;
    }).join('');
    return `<div class="pf-wrap">${jxTete('jour', new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}))}
      <div class="quiz-q">${esc(Q.q)}</div><div class="quiz-opts">${opts}</div>
      ${(JEU.answered||fait)?quizCorrection(Q):''}

/* ═════════════════════════════════════════════════════════════════════════
   LE PROGRAMME DES ASSOS ET LE CALENDRIER DU MOIS (rapatrié le 08/08/2026)

   « Ce qui arrive » ne savait afficher que des RÈGLES qui se répètent (tous les
   mercredis). Or des asbl comme WAKA UP sortent un calendrier neuf chaque mois :
   des dates uniques, un lieu qui change, une inscription à prendre. Elles vivent
   donc dans la table `activites`, que Mag remplit DEPUIS L'APP — sinon le mois
   passe avant que quelqu'un ait eu le temps de me le demander.

   ⚠ LA PANNE SE DIT. Le 03/08, le programme est resté invisible deux jours : la base
   refusait la lecture et le catch avalait l'erreur sans un mot. Une liste vide et une
   liste cassée se ressemblaient à l'écran. On garde donc l'erreur de côté pour
   pouvoir la DIRE.
   ═════════════════════════════════════════════════════════════════════════ */
var ACTIVITES=[], ACT_PANNE='', ACT_CHARGE=false;
var AG_MOIS=null;      // le mois affiché dans la grille (ISO du 1er)
var AG_JOUR=null;      // le jour choisi dans la grille (ISO)
const ROSE_ASBL='#fd8fd0';

async function loadActivites(){
  if(!sb){ ACT_CHARGE=true; return; }
  try{
    const hier=new Date(); hier.setDate(hier.getDate()-1);
    const { data, error } = await sb.from('activites').select('*')
      .gte('jour', hier.toISOString().slice(0,10)).order('jour');
    if(error) throw error;
    ACTIVITES=data||[]; ACT_PANNE='';
  }catch(e){ ACTIVITES=[]; ACT_PANNE=(e&&e.message)||String(e); }
  ACT_CHARGE=true;
  if(current && (current.view==='ticket')) render();
}
/* Qui peut écrire le programme : l'administration. */
function peutEcrireActivites(){ return !!(PROFILE && PROFILE.admin) && !APERCU_GRP; }

async function ajouterActivite(){
  const v=function(id){ const e=document.getElementById(id); return e?e.value.trim():''; };
  const asso=v('acAsso'), titre=v('acTitre'), jour=v('acJour');
  if(!asso || !titre || !jour){ toast("Il faut au moins l'association, l'activité et la date"); return; }
  try{
    const { error } = await sb.from('activites').insert({
      asso:asso, titre:titre, jour:jour, debut:v('acDebut')||null, fin:v('acFin')||null,
      lieu:v('acLieu')||null, adresse:v('acAdr')||null, inscription:v('acInsc')||null,
      ajoute_par:(PROFILE&&(PROFILE.nom||PROFILE.email))||'' });

    ['acTitre','acJour','acDebut','acFin','acLieu','acAdr','acInsc'].forEach(function(id){
      const e=document.getElementById(id); if(e) e.value=''; });
    await loadActivites(); render(); toast('Ajoutée ✓');
  }catch(e){ toast('Impossible : '+((e&&e.message)||e)); }

function retirerActivite(id, titre){

      try{ const { error } = await sb.from('activites').delete().eq('id',id);
        if(error) throw error;

      }catch(e){ toast('Suppression refusée'); }

/* La date en toutes lettres : « lundi 3 août ». */
function acJourFr(iso){
  try{ return new Date(iso+'T12:00:00').toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'}); }
  catch(e){ return iso; }
}
function agIso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function agMois(pas){
  const b=AG_MOIS?new Date(AG_MOIS+'T12:00:00'):new Date();
  b.setDate(1); b.setMonth(b.getMonth()+pas);
  AG_MOIS=agIso(b); AG_JOUR=null; render();
}
function agChoisirJour(iso){ AG_JOUR=(AG_JOUR===iso)?null:iso; render(); }

/* Ce qui tombe un jour donné : les règles qui se répètent ET les activités encodées. */
function agDuJour(d){
  const out=[];
  try{
    (AGENDA_REGLES||[]).forEach(function(r){
      /* Les activités marquées `enfants` ne sortent pas : le centre accueille des adultes. */
      if(r.enfants) return;
      if(r.quand && r.quand(d)) out.push({c:r.c||'#6cb392', t:r.titre, s:r.lieu, regle:r});
    });
  }catch(e){}
  try{
    const iso=agIso(d);
    (ACTIVITES||[]).forEach(function(a){
      if(a.jour===iso) out.push({c:ROSE_ASBL, t:a.asso+' · '+a.titre,
        s:[a.debut,a.fin].filter(Boolean).join(' → '), act:a});
    });
  }catch(e){}
  return out;
}
function agCalendrierHTML(){
  const base=AG_MOIS?new Date(AG_MOIS+'T12:00:00'):new Date();

  const auj=new Date(); auj.setHours(12,0,0,0);
  const decal=(base.getDay()+6)%7;                       // la semaine commence lundi
  const debut=new Date(base); debut.setDate(1-decal);
  let h='<div class="cal">'
    + '<div class="cal-tete"><button class="cal-fl" onclick="agMois(-1)" aria-label="Mois précédent">'+icon('chevron')+'</button>'
    +   '<span>'+esc(MOIS_L[base.getMonth()]+' '+base.getFullYear())+'</span>'
    +   '<button class="cal-fl droite" onclick="agMois(1)" aria-label="Mois suivant">'+icon('chevron')+'</button></div>'
    + '<div class="cal-j">'+['L','M','M','J','V','S','D'].map(function(j){ return '<span>'+j+'</span>'; }).join('')+'</div>'
    + '<div class="cal-g">';
  for(let i=0;i<42;i++){
    const d=new Date(debut); d.setDate(debut.getDate()+i);
    if(i>=35 && d.getMonth()!==base.getMonth()) break;
    const iso=agIso(d), dedans=(d.getMonth()===base.getMonth());
    const ev=dedans?agDuJour(d):[];
    h+='<button class="cal-c'+(dedans?'':' hors')+(ev.length?' plein':'')
      + ((agIso(auj)===iso)?' auj':'')+((AG_JOUR===iso)?' choisi':'')+'"'
      + (dedans?' onclick="agChoisirJour(\''+iso+'\')"':' disabled')+'>'
      + '<span class="cal-n">'+d.getDate()+'</span>'
      + '<span class="cal-pts">'+ev.slice(0,3).map(function(e){ return '<i style="background:'+e.c+'"></i>'; }).join('')+'</span>'
      + '</button>';
  }
  h+='</div>';
  /* Ce que contient le jour choisi — ou, par défaut, ce qui arrive aujourd'hui. */
  const cible=AG_JOUR?new Date(AG_JOUR+'T12:00:00'):auj;
  const liste=agDuJour(cible);
  h+='<div class="cal-jour">'+esc(JOURS_L[cible.getDay()]+' '+cible.getDate()+' '+MOIS_L[cible.getMonth()])+'</div>';
  h+= liste.length
    ? liste.map(function(e){
        return '<div class="cal-e" style="border-left-color:'+e.c+'">'
          +'<b>'+esc(e.t)+'</b>'
          +(e.s?'<em>'+esc(e.s)+'</em>':'')
          +(e.regle&&e.regle.lieu&&!e.s?'<em>'+esc(e.regle.lieu)+'</em>':'')
          +(e.act&&e.act.lieu?'<p>'+esc(e.act.lieu)+(e.act.adresse?' — '+esc(e.act.adresse):'')+'</p>':'')
          +(e.act&&e.act.inscription?'<p class="insc">'+esc(e.act.inscription)+'</p>':'')
          +(e.act&&peutEcrireActivites()
            ? '<button class="cal-sup" onclick="retirerActivite('+e.act.id+',\''+esc(String(e.act.titre)).replace(/'/g,"\\'")+'\')">Retirer</button>'
            : '')
          +'</div>'; }).join('')
    : '<div class="cal-vide">Rien de prévu ce jour-là.</div>';
  return h+'</div>';
}

/* ═══ PARTAGER L'APP (08/08/2026) ═══
   Une adresse à dicter, ça se rate. Un QR, on le montre et c'est fini — c'est le
   geste le plus rapide pour donner COUSIN à un·e collègue devant soi.
   Le QR est dessiné en points, comme celui des itinéraires : moins d'encre s'il
   est imprimé et affiché quelque part. */
const COUSIN_URL='https://cousin.magalicontrino.com';
/* ═══ EXPORTER ET IMPORTER LE CATALOGUE (08/08/2026) ═══
   L'export sert à trois choses : garder une copie hors de l'app, relire le catalogue
   dans un tableur, et le passer à quelqu'un.

   ⚠ L'IMPORT NE REMPLACE PLUS RIEN POUR DE BON, ET C'EST VOULU. Dans l'ancienne app le
   catalogue vivait dans le localStorage : `importData` appelait `persist()` et écrasait
   tout, définitivement, après un simple `confirm()` du navigateur. Ici le catalogue est
   DANS LE CODE (`SAMPLE`) et se publie par le dépôt. Un import qui persisterait dans le
   téléphone de Mag fabriquerait un catalogue fantôme qu'elle seule verrait, et qui
   masquerait les vraies mises à jour publiées. Le bouton est donc un COMPARATEUR : il
   compte les écarts, les montre, applique à l'écran pour qu'elle regarde — et le vrai
   catalogue revient au chargement suivant. Pour publier, elle me donne le fichier. */
function exporterCatalogue(){
  try{
    const j=JSON.stringify(DATA,null,2);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));
    a.download='cousin-catalogue-'+new Date().toISOString().slice(0,10)+'.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    toast(DATA.length+' fiches exportées ✓');
  }catch(e){ toast('Export impossible'); }
}
/* Le même catalogue, mais en tableau : c'est le format qu'on ouvre dans un tableur
   pour relire à plusieurs, ou qu'on envoie à quelqu'un qui n'a pas l'app. */
function exporterTableur(){
  try{
    const cols=['domaine','nom','commune','desc','public','tel','mail','site','adr','horaires','notes'];
    const ech=function(v){ return '"'+String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"'; };
    const lignes=[cols.join(';')].concat(DATA.map(function(p){ return cols.map(function(c){ return ech(p[c]); }).join(';'); }));
    /* Le BOM en tête : sans lui, Excel ouvre les accents de travers. */
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['\ufeff'+lignes.join('\r\n')],{type:'text/csv;charset=utf-8'}));
    a.download='cousin-catalogue-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    toast('Tableur exporté ✓');
  }catch(e){ toast('Export impossible'); }
}
function importerCatalogue(ev){
  const f=ev.target.files&&ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=function(){
    let x=null;
    try{ x=JSON.parse(r.result); }catch(e){}
    if(!Array.isArray(x) || !x.length || !x[0] || !x[0].nom){
      cousinConfirme('Fichier illisible',
        'Ce fichier n’a pas la forme d’un catalogue COUSIN. Rien n’a été touché.', null, {ok:'Fermer'});
      ev.target.value=''; return;
    }
    /* On COMPTE avant de demander : « 312 fiches » ne dit rien, « 4 nouvelles et
       2 modifiées » dit tout.
       ⚠ ON COMPARE PAR `sid`, PAS PAR NOM. Quatre structures sont rangées dans DEUX
       domaines et portent donc le même nom deux fois (Free Clinic, Modus Vivendi,
       Ariane, Croix-Rouge RLF). Comparés par nom, ces homonymes s'écrasaient l'un
       l'autre et un fichier IDENTIQUE s'annonçait « 4 modifiées ». Un comptage qui
       ment ne sert à rien : c'est lui qui décide si on écrase des semaines de travail. */
    const cle=function(p){ return p.sid || (p.domaine+'|'+p.nom); };
    const avant={}; DATA.forEach(function(p){ avant[cle(p)]=p; });
    const apres={}; x.forEach(function(p){ apres[cle(p)]=p; });
    let nouvelles=0, modifiees=0;
    x.forEach(function(p){
      const a=avant[cle(p)];
      if(!a) nouvelles++;
      else if(JSON.stringify([a.tel,a.adr,a.desc,a.notes])!==JSON.stringify([p.tel,p.adr,p.desc,p.notes])) modifiees++;
    });
    const dispar=DATA.filter(function(p){ return !apres[cle(p)]; });
    const perdues=dispar.length;
    cousinConfirme(perdues||nouvelles||modifiees ? 'Voir ce fichier dans l’app ?' : 'Ce fichier est identique',
      'Le fichier contient '+x.length+' fiches.\n\n'+
      '• '+nouvelles+' que tu n’as pas\n'+
      '• '+modifiees+' modifiée'+(modifiees>1?'s':'')+'\n'+
      '• '+perdues+' qui disparaîtrai'+(perdues>1?'ent':'t')+
      (perdues ? ' : '+dispar.slice(0,6).map(function(p){ return p.nom; }).join(', ')+(perdues>6?'…':'') : '')+
      '\n\nÇa ne change que TON écran, le temps de regarder : au prochain chargement de '+
      'COUSIN le vrai catalogue revient. Pour que ce fichier devienne l’app de tout le '+
      'monde, envoie-le moi et je le publie.',
      function(){
        try{
          /* DATA et BYSID sont des `const` : on ne les réaffecte pas, on les vide et on
             les remplit — sinon `data`, que le quiz utilise, pointerait dans le vide. */
          const neuf=x.map(norm);
          DATA.length=0; neuf.forEach(function(p){ DATA.push(p); });
          Object.keys(BYSID).forEach(function(k){ delete BYSID[k]; });
          DATA.forEach(function(p){ if(p.sid) BYSID[p.sid]=p; });
          render(); toast('Aperçu : '+DATA.length+' fiches — recharge pour revenir');
        }catch(e){ toast('Import impossible'); }
      }, {ok:'Regarder', danger:true});
    ev.target.value='';
  };
  r.readAsText(f);
}

async function partagerCousin(){
  const d={title:'COUSIN', text:'COUSIN — l’outil de l’équipe', url:COUSIN_URL};
  try{
    if(navigator.share){ await navigator.share(d); return; }
  }catch(e){ return; }        // annulé par la personne : on ne dit rien
  copierLien();
}
function copierLien(){
  try{
    navigator.clipboard.writeText(COUSIN_URL);
    toast('Adresse copiée ✓');
  }catch(e){ toast('Copie impossible — l’adresse est écrite à l’écran'); }
}

   ⚠ AUCUNE FAUSSE DONNÉE. La maquette annonçait « 412 fiches » ; on compte le

   domaines réellement ouverts (VUES), pas par une liste décorative — tant qu'on
   n'a rien ouvert, l'encadré dit qu'il se remplira tout seul.
   ══════════════════════════════════════════════════════════════════════════ */

let ONB_ETAPE=0;

/* Les tâches du quotidien qu'on peut garder ou écarter. Les clés sont celles des
   boules de l'accueil : ce qui est décoché n'y apparaît plus. */

/* LA RELANCE DU RACCOURCI (demande de Mag : « à plusieurs reprises, tant que ce
   n'est pas fait »). Pas à chaque ouverture — une fois tous les DIX JOURS, et
   trois fois au maximum. Au-delà, c'est du harcèlement, pas un rappel. */
function onbRelance(){
  if(!ONB.vu || ONB.raccourci) return false;
  if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){
    ONB.raccourci=true; onbSave(); return false;   /* déjà installée : on se tait */
  }
  if((ONB.relances||0)>=3) return false;
  const d=ONB.derniere||ONB.le||0;
  if(Date.now()-d < 10*24*3600*1000) return false;
  ONB.relances=(ONB.relances||0)+1; ONB.derniere=Date.now(); onbSave();
  return true;
}

/* ═══ LA NOTE POUR LE DOSSIER (08/08/2026) ═══
   L'entonnoir produisait une feuille POUR LA PERSONNE, dans sa langue. Il manquait
   son pendant : ce qu'on écrit, nous, dans le dossier, après l'entretien. C'est
   les mêmes trois réponses, retournées du côté du professionnel — la situation
   constatée, ce qui a été dit, et ce qui reste à faire.

   ⚠ AUCUN NOM, JAMAIS. La note ne contient ni le nom de la personne ni le nôtre :
   c'est la règle de COUSIN, et elle vaut ici plus qu'ailleurs puisque ce texte est
   fait pour partir dans un autre logiciel. On copie, on colle, on complète là-bas. */
function noteDossier(s){
  const R=SCHEMA_REP;
  const dit=function(k){ const q=SCHEMA_Q.find(function(x){return x.k===k;});
    if(!q||!R[k]) return null;
    const o=q.o.find(function(x){return x.v===R[k];}); return o?o.t:null; };
  const d=new Date().toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const L=s.fr;
  const l=[];
  l.push('SITUATION — accès aux soins · '+d);
  l.push('');
  l.push('CE QUI A ÉTÉ ÉTABLI');
  if(dit('sejour')) l.push('· Séjour : '+dit('sejour'));
  if(dit('mut'))    l.push('· Mutuelle : '+dit('mut'));
  if(dit('cpas'))   l.push('· CPAS : '+dit('cpas'));
  l.push('');
  l.push('ORIENTATION DONNÉE : '+L.t);
  l.push('('+L.s+')');
  l.push('');
  l.push('CE QUI A ÉTÉ EXPLIQUÉ, dans l’ordre');
  L.e.forEach(function(e,i){ l.push((i+1)+'. '+e.t+' — '+e.d); });
  if(L.a){ l.push(''); l.push('POINT DE VIGILANCE : '+L.a); }
  l.push('');
  l.push('REMIS À LA PERSONNE : la feuille « '+L.t+' »'+
    (SCHEMA_L!=='fr' ? ' en '+((SCHEMA_LANGUES.find(function(x){return x.k===SCHEMA_L;})||{}).nom||SCHEMA_L) : ' en français')+'.');
  l.push('');
  l.push('À FAIRE / À VÉRIFIER');
  l.push('· ');
  l.push('');
  l.push('(Note produite par COUSIN. Elle ne contient aucun nom : compléter dans le dossier.)');
  return l.join('\n');
}
function noteDossierHTML(s){
  const t=noteDossier(s);
  return '<div class="sch-note">'+

      '<button class="sch-ncp" onclick="copierNoteDossier()">'+icon('clipboard')+'Copier</button></div>'+
    '<pre>'+esc(t)+'</pre>'+
    '<em>Elle ne contient aucun nom — ni celui de la personne, ni le tien. On la colle dans le dossier et on complète là-bas.</em>'+

/* ═══ LA FEUILLE DE RELECTURE (08/08/2026) ═══

   met en évidence les trois endroits où une inversion coûte un droit : « avant / après
   le soin », « ne payez rien avant », « gratuit ». La personne compare, entoure ce qui

      '<td class="fr">'+esc(fr).replace(/\n/g,'<br>')+'</td>'+
      '<td class="tr"'+rtl+'>'+esc(tr).replace(/\n/g,'<br>')+'</td></tr>';
  };

    lignes += ligne('Étape '+(i+1)+' — titre', e.t, T.e[i]?T.e[i].t:'(MANQUE)');
    lignes += ligne('Étape '+(i+1)+' — texte', e.d, T.e[i]?T.e[i].d:'(MANQUE)');
  });
  lignes += ligne('Médecin traitant — titre', mtF.t, mtT.t);

  lignes += ligne('Avertissement', F.a, T.a);

  const w=window.open('','_blank');

  w.document.write('<!doctype html><html lang="fr"><head><meta charset="utf-8">'+

    '.bar{position:sticky;top:0;background:#1b1b1b;color:#f0efed;padding:11px 16px;display:flex;gap:10px;align-items:center}'+
    '.bar b{flex:1;font-size:14px}'+

      'padding:8px 13px;font-size:11px;cursor:pointer}'+
    '.bar button.ok{background:#f0efed;color:#1b1b1b}'+
    '.pg{width:210mm;box-sizing:border-box;margin:22px auto;padding:14mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18)}'+
    '@media(max-width:230mm){.pg{width:auto;margin:10px;padding:10mm}}'+
    'h1{font-size:19px;margin:0 0 4px}'+
    '.cons{background:#f6f5f3;border-left:4px solid #e63329;padding:10px 12px;font-size:12.5px;line-height:1.5;margin:12px 0 16px}'+
    'table{width:100%;border-collapse:collapse}'+
    'td{border-top:1px solid #ddd;padding:8px 6px;vertical-align:top;font-size:12px;line-height:1.45}'+
    'td.lab{width:20%;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.06em;'+
      'text-transform:uppercase;color:#777}'+
    'td.fr{width:40%}td.tr{width:40%;background:#fbfaf8}'+
    'tr{break-inside:avoid;page-break-inside:avoid}'+
    '@media print{.bar{display:none}.pg{width:100%;margin:0;padding:0;box-shadow:none}@page{margin:12mm}}'+
    '</style></head><body>'+
    '<div class="bar"><b>Relecture — français / '+esc(lg.nom)+'</b>'+
      '<button onclick="window.close()">Fermer</button>'+
      '<button class="ok" onclick="window.print()">Imprimer</button></div>'+
    '<div class="pg"><h1>Relecture — '+esc(F.t)+'</h1>'+
      '<div style="font-size:12px;color:#666">Français à gauche, '+esc(lg.nom)+' à droite.</div>'+
      '<div class="cons"><b>Merci de vérifier surtout trois choses :</b><br>'+
      '1. « <b>AVANT</b> le soin » n’est pas devenu « après ».<br>'+
      '2. « Ne payez rien <b>avant</b> d’être passé au CPAS » garde bien ce sens.<br>'+
      '3. « <b>gratuit</b> » veut bien dire sans rien payer.<br><br>'+
