/* Elles rejoignent aussi « Tout mélangé » : la règle de droit croise les fiches du réseau,
   c'est comme ça qu'on la retient pour de bon. */
function quizEcrites(){
  return QUIZ_ECRIT.map(function(x){
    const opts=qShuffle(x.opts.slice());
    return { q:x.q, opts:opts, correct:opts.indexOf(x.opts[x.correct]), pourquoi:x.pourquoi };
  });
}
function quizGen(theme, doms, tout){
  if(theme==='droits'){ const q=qShuffle(quizEcrites()); return { qs:q, i:0, score:0, answered:false, picked:-1, theme:theme }; }
  const allReseau=data.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau);
  // `doms` = une liste de domaines (un terrain « métier », par exemple) ; sinon un seul thème.
  const pool = doms ? allReseau.filter(p=>doms.includes(p.domaine))
                    : (theme==='all') ? allReseau : allReseau.filter(p=>p.domaine===theme);
  const descAll=allReseau.filter(p=>p.desc && p.desc.length>15);
  const pubAll =allReseau.filter(p=>p.public && p.public.length>4);
  // Un même texte peut décrire plusieurs services (« Habitants de la commune » vaut pour
  // tous les CPAS) : dans ce cas la question « quel service ? » n'a pas UNE bonne réponse,
  // on ne la pose donc pas.
  const compte=(liste,champ)=>{
    const c={}; liste.forEach(x=>{ const k=String(x[champ]||'').trim().toLowerCase(); c[k]=(c[k]||0)+1; }); return c;
  };
  const nbDesc=compte(descAll,'desc'), nbPub=compte(pubAll,'public');
  /* Les communes réellement présentes dans le réseau, pour fabriquer des leurres
     crédibles : proposer « Namur » à côté d'Anderlecht ne teste rien. */
  const communesAll=[...new Set(allReseau.map(x=>String(x.commune||'').trim())
    .filter(c=>c && !/régional|toutes communes/i.test(c)))];
  const unique=(c,v)=> c[String(v||'').trim().toLowerCase()]===1;
  const pick=(arr,n)=>qShuffle(arr).slice(0,n);
  // 3 mauvaises réponses distinctes entre elles ET différentes de la bonne
  const leurres=(arr,bonne)=>{
    const vus=new Set([bonne.toLowerCase()]), out=[];
    qShuffle(arr).forEach(v=>{ const k=v.toLowerCase(); if(out.length<3 && v && !vus.has(k)){ vus.add(k); out.push(v); } });
    return out;
  };
  const qs=[];
  pool.forEach(p=>{
    // Ce que fait le service
    if(p.desc && p.desc.length>15){
      const bonne=qTrim(p.desc,110);
      const l=leurres(descAll.filter(x=>x.nom!==p.nom).map(x=>qTrim(x.desc,110)),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"Que propose « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
      // Dans l'autre sens : reconnaître le service à partir de ce qu'il fait —
      // seulement si cette description n'appartient qu'à lui.
      if(unique(nbDesc,p.desc)){
        const ln=leurres(descAll.filter(x=>x.nom!==p.nom).map(x=>x.nom),p.nom);
        if(ln.length===3){ const opts=qShuffle([p.nom].concat(ln)); qs.push({q:"Quel service correspond à : « "+qTrim(p.desc,120)+" » ?",opts,correct:opts.indexOf(p.nom),src:p.id}); }
      }
    }
    // Le public visé
    if(p.public && p.public.length>4){
      const bonne=qTrim(p.public,90);
      const l=leurres(pubAll.filter(x=>x.nom!==p.nom).map(x=>qTrim(x.public,90)),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"À qui s'adresse « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
      if(unique(nbPub,p.public)){
        const ln=leurres(pubAll.filter(x=>x.nom!==p.nom).map(x=>x.nom),p.nom);
        if(ln.length===3){ const opts=qShuffle([p.nom].concat(ln)); qs.push({q:"Quel service s'adresse à : « "+bonne+" » ?",opts,correct:opts.indexOf(p.nom),src:p.id}); }
      }
    }
    /* ⚠ PLUS DE QUESTION « DANS QUEL DOMAINE ? » — retirée le 08/08/2026 à la
       demande de Mag : « ce jeu de trois domaines, on s'en fout, ça ne nous apprend
       rien du tout. En fait il faudrait poser des questions que par rapport aux
       associations. » Elle a raison : savoir que l'ONE est rangé dans « Jeunesse &
       familles » est une question sur NOTRE classement, pas sur le réseau. Ça ne
       sert à personne sur le terrain.
       À la place : LA COMMUNE. Savoir où se trouve un service, c'est ce qui décide
       si on y envoie quelqu'un à pied ou en métro. On ne la pose que pour les
       services réellement situés — « Régional / Toutes communes » n'apprend rien
       non plus — et seulement si la commune n'est pas déjà dans leur nom. */
    /* On compare MOT À MOT, pas en sous-chaîne : « CPAS de la Ville de Bruxelles »
       ne contient pas littéralement « Bruxelles-Ville », et la question tombait
       quand même toute cuite. */
    const motsCle=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
      .split(/[^a-z0-9]+/).filter(m=>m.length>3);
    const dansLeNom=(nom,com)=>{ const n=motsCle(nom), c=motsCle(com);
      return c.length>0 && c.every(m=>n.indexOf(m)>=0); };
    if(p.commune && !/régional|toutes communes/i.test(p.commune)
       && !dansLeNom(p.nom,p.commune)){
      const bonne=p.commune;
      const l=leurres(communesAll.filter(x=>x!==bonne),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"Dans quelle commune se trouve « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
    }
  });
  /* `tout` = on rend TOUTES les questions, sans tirage ni mélange : c'est ce qu'il faut
     pour que la question du jour soit la même pour tout le monde et ne bouge pas. */
  /* Les questions écrites rejoignent « Tout mélangé » sans toucher au tableau d'origine
     (il est en const : on en fabrique un nouveau). */
  const toutes = (theme==='all') ? qs.concat(quizEcrites()) : qs;
  if(tout) return { qs:toutes, i:0, score:0, answered:false, picked:-1, theme };
  return { qs:qShuffle(toutes).slice(0,60), i:0, score:0, answered:false, picked:-1, theme };
}

/* ═══ D'UNE FORMATION VERS UNE FICHE DU RÉSEAU (08/08/2026) ═══
   Ce qui manquait : une formation expliquait quoi faire, et laissait la personne
   retourner chercher l'adresse à la main dans le réseau. Aucune des onze n'avait
   de porte de sortie.

   ⚠ ON NE CODE PAS LE `sid` EN DUR dans les formations. D'abord parce qu'il est
   calculé (`seed-<domaine>-<nom>`) et qu'il changerait si on renomme une fiche ;
   ensuite parce que les pages de formation sont écrites DANS le tableau SAMPLE,
   donc AVANT que DATA et les sid n'existent. On écrit donc le NOM de la fiche
   dans le bouton, et on le résout AU CLIC, quand tout est chargé. */
function allerFiche(nom){
  const n=(nom||'').toLowerCase();
  const p=DATA.find(function(x){ return x.nom.toLowerCase()===n; })
        || DATA.find(function(x){ return x.nom.toLowerCase().indexOf(n)>=0; });
  if(p) go('#/f/'+p.sid);
  else toast('Fiche introuvable — dis-le moi');
}

/* « hier », « lundi », « il y a 3 semaines » — le repère de temps des reprises. */
function quand(ts){
  const j=Math.floor((Date.now()-ts)/86400000);
  if(j<=0) return 'aujourd\'hui';
  if(j===1) return 'hier';
  if(j<7) return JOURS_L[new Date(ts).getDay()];

}

async function cocherEtape(id,k){
  /* ⚠ ON COMPARE EN TEXTE DES DEUX CÔTÉS (réparé le 08/08/2026, signalé par Mag :
     « on ne sait pas cocher »). L'identifiant arrive du onclick, donc TOUJOURS en
     texte ('12'), alors que la base le renvoie en NOMBRE (12). Le === échouait,
     la fonction repartait sans rien faire, et le clic ne produisait strictement
     RIEN : pas de fenêtre, pas de message, rien à comprendre.
     Les autres boutons de l'app (chantier, boîte à idées, check-lists) passent
     leur identifiant sans apostrophes, donc en nombre — c'est pour ça qu'eux
     fonctionnaient. Ici les apostrophes étaient là, et le === ne pardonne pas. */
  const ch=CHAMBRES.find(c=>String(c.id)===String(id));
  if(!ch){ toast('Chambre introuvable — recharge la page'); return; }
  if(!sb){ toast('Pas de connexion — reconnecte-toi'); return; }
  const et=CH_ETAPES.find(x=>x.k===k); if(!et) return;
  const fait=!!ch[k+'_le'];
  cousinConfirme('Chambre '+ch.numero,
    (fait?'Annuler « ':'Confirmer « ')+et.l+' » ?'+(fait?'':'\n\nTon nom et l’heure seront notés.'),
    async function(){
      const maj={};
      maj[k+'_le'] =fait?null:new Date().toISOString();
      maj[k+'_par']=fait?null:(nomAffiche()||(PROFILE&&PROFILE.email)||'');
      try{
        await sb.from('chambres').update(maj).eq('id',id);
        await loadChambres(); render();
      }catch(e){ toast('Modification refusée'); }
    }, {ok:fait?'Annuler l’étape':'Confirmer', danger:fait});
}

/* « Marie · 14:20 » — sous chaque étape faite, qui et quand. */
function chQuand(ch,k){
  const iso=ch[k+'_le']; if(!iso) return '';
  const h=new Date(iso).toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'});
  const qui=(ch[k+'_par']||'').trim().split(/\s+/)[0]||'';
  return qui? qui+' · '+h : h;
}
function chCard(ch){
  const oblig=CH_ETAPES.filter(e=>!e.opt);
  const faites=oblig.filter(e=>ch[e.k+'_le']).length, finie=faites===oblig.length;
  const g=genreEtage(ch.numero), ouverte=!!CH_OUVERTES[ch.id];
  return '<div class="chc'+(finie?' finie':'')+'">'+
    '<button class="chh" onclick="toggleChambre(\''+ch.id+'\')">'+
      '<span class="chnum">'+esc(ch.numero)+'</span>'+
      (ch.initiales?'<span class="chini">'+esc(ch.initiales)+'</span>':'')+
      (g?'<span class="chg" style="background:'+g.c+'">'+g.l+'</span>':'')+
      '<span style="flex:1"></span>'+
      (finie?'<span class="chfin">Libérée ✓</span>':'<span class="chprog">'+faites+'/'+oblig.length+'</span>')+
      '<span class="ic chchev" style="transform:rotate('+(ouverte?'90deg':'-90deg')+')">'+icon('chevron')+'</span>'+
    '</button>'+
    (ouverte?'<div class="chcorps">'+
      CH_ETAPES.map(e=>{const ok=!!ch[e.k+'_le'];
        return '<button class="chet'+(ok?' ok':'')+'" onclick="cocherEtape(\''+ch.id+'\',\''+e.k+'\')">'+
        '<i style="'+(ok?'background:'+e.c+';border-color:'+e.c:'')+'">'+(ok?'✓':'')+'</i>'+
        '<span><b>'+e.l+'</b><em>'+esc(e.qui)+(e.opt?' · facultatif':'')+'</em></span>'+
        (ok?'<em class="chq">'+esc(chQuand(ch,e.k))+'</em>':'')+
      '</button>';}).join('')+
      '<button class="chdel" onclick="retirerChambre(\''+ch.id+'\',\''+esc(ch.numero)+'\')">Retirer cette chambre</button>'+
    '</div>':'')+
  '</div>';
}

function telHref(t){const m=/[+0-9][0-9 .\/-]{2,}/.exec(t||'');const n=m?m[0].replace(/[^+0-9]/g,''):'';return n.length>=3?('tel:'+n):''}
/* ═══ IMPRIMER (rapatrié le 08/08/2026) ═══
   window.print() avec une feuille propre : voir le bloc @media print. On renseigne
   le titre et la date AVANT d'ouvrir la fenêtre d'impression, sinon la feuille sort
   anonyme. Marche aussi pour « enregistrer en PDF », c'est le même bouton. */
function imprimer(){
  let t='COUSIN';
  try{
    const v=current&&current.view;
    /* La route range la clé du domaine sous `key` — pas `k`. La feuille sortait
       intitulée « Une liste » au lieu de « Logement ». */
    if(v==='domaine' && current.key && DOM[current.key]) t=DOM[current.key].label;
    else if(v==='fiche' && current.sid){
      const f=DATA.find(function(x){ return x.sid===current.sid; }); if(f) t=f.nom;
    }
    else if(v && ECRAN_NOMS[v]) t=ECRAN_NOMS[v];
  }catch(e){}
  const dateTxt='Imprimé le '+new Date().toLocaleDateString('fr-BE',{day:'2-digit',month:'long',year:'numeric'});
  const src=document.getElementById('view');
  if(!src) return;

  /* ═══ LA FEUILLE D'UNE LISTE DE FICHES (Mag, 08/08/2026) ═══
     « Si je clique sur médical Bruxelles et que je veux imprimer Aquarelle et
     médecin, je veux toutes les coordonnées et un résumé de la carte. »

     L'écran ne montre que le nom et une ligne : recopier le DOM donnerait une feuille
     inutile. On reconstruit donc la feuille à partir du catalogue — mais en prenant
     les fiches DANS L'ORDRE OÙ ELLES SONT À L'ÉCRAN, filtres compris. C'est le seul
     moyen que « médical + Bruxelles » imprime bien ce qu'elle a sous les yeux.

     Minimaliste, parce que l'encre coûte : pas d'aplat, un filet fin, une seule fiche
     par bloc et jamais coupée en deux. */
  let corps=null;
  /* UNE FICHE SEULE : c'est la feuille qu'on donne à quelqu'un pour qu'il y aille.
     On la fabrique exprès — l'écran a des boutons d'appel et une étoile qui n'ont
     rien à faire sur du papier. */
  try{
    if(current && current.view==='fiche' && current.sid){
      const f=DATA.find(function(x){ return x.sid===current.sid; });
      if(f){
        const l=[];
        if(f.tel) l.push('<span><i>Tél</i>'+esc(f.tel)+'</span>');
        if(f.adr) l.push('<span><i>Adresse</i>'+esc(f.adr)+'</span>');
        if(f.horaires) l.push('<span><i>Horaires</i>'+esc(f.horaires)+'</span>');
        if(f.mail) l.push('<span><i>Mail</i>'+esc(f.mail)+'</span>');
        if(f.site) l.push('<span><i>Site</i>'+esc(f.site)+'</span>');
        /* Le QR n'apparaît QUE s'il y a une adresse : un QR vers nulle part serait
           une tache d'encre. Et seulement sur la feuille d'un lieu — quinze QR sur
           une liste noieraient la page et coûteraient cher. */
        const qr = f.adr ? qrSVG(itiHref(f.adr), 104) : '';
        corps='<div class="pf-f pf-seule">'+
          (qr?'<div class="pf-qr">'+qr+'<span>Scanne pour l’itinéraire<br>depuis là où tu es</span></div>':'')+
          '<b>'+esc(f.nom)+'</b>'+

          (f.desc?'<p>'+esc(f.desc)+'</p>':'')+
          (f.public?'<p class="pu">Pour : '+esc(f.public)+'</p>':'')+
          (l.length?'<div class="pf-l">'+l.join('')+'</div>':'')+
          /* Une feuille qu'on donne à quelqu'un DOIT dire ce qu'elle n'a pas. Sans ça,
             la personne part avec un papier qui ne lui permet pas de joindre le lieu. */
          (function(){ const m=[]; if(!f.tel) m.push('téléphone'); if(!f.adr) m.push('adresse');
            return m.length?'<p class="pm">⚠ Cette fiche n’a pas encore de '+m.join(' ni d’')+
              '. À vérifier avant de la donner'+(f.site?' — le site est indiqué ci-dessus.':'.')+'</p>':''; })()+
          (f.notes?'<p class="pn">'+esc(f.notes)+'</p>':'')+
        '</div>';
      }
    }
  }catch(e){}
  try{
    if(corps) throw 0;
    const sids=[...src.querySelectorAll('[onclick*="#/f/"]')].map(function(e){
      const m=/#\/f\/([^']+)/.exec(e.getAttribute('onclick')||''); return m?m[1]:null;
    }).filter(Boolean);
    const vus=new Set(), fiches=[];
    sids.forEach(function(sid){ if(vus.has(sid)) return; vus.add(sid);

          return '<div class="pf-f">'+

  }catch(e){}

  /* ═══ LA FEUILLE DES SORTIES (08/08/2026, point 9 de la liste) ═══
     L'écran des Activités a un calendrier, des pastilles et des cartes qui se

            '<div class="ag-p'+(gratuit?' g':'')+'">'+esc(r.prix||'')+'</div>'+
          '</div>';
        };
        const grat=lst.filter(function(x){ return /gratuit/i.test((x.r||{}).prix||''); });
        const pay =lst.filter(function(x){ return !/gratuit/i.test((x.r||{}).prix||''); });
        corps='<div class="pf-n">'+lst.length+' sortie'+(lst.length>1?'s':'')+' dans les 31 prochains jours</div>'+

          '<div class="ag-fin">Vérifie toujours avant de partir : les horaires changent, '+

          '<b>Pour un musée sans numéro ci-dessus : Brussels Museums, 02 512 77 80</b>, '+

/* ══════════════════════════════════════════════════════════════════════════
   LES MODÈLES QUI SE REMPLISSENT TOUT SEULS (rapatrié de l'ancienne app le
   06/08/2026 — il avait été oublié à la bascule, retrouvé en comparant les deux).
   Dans le texte d'un mail ou d'une note, ce qui est entre crochets devient vivant :
     [soins / médicaments / autre]  →  trois pastilles ; on touche la bonne et les
                                       autres s'effacent (re-toucher les fait revenir)
     [nom, date de naissance]       →  un petit champ à écrire, dans la phrase
   Le modèle se monte donc DANS l'app, et on ne copie que le texte fini — au lieu
   d'emporter des crochets à nettoyer ensuite dans Gmail.
   Rien n'est enregistré : c'est un brouillon de travail, il repart à zéro en
   quittant la fiche. Aucune donnée d'hébergé ne doit rester dans COUSIN.
   ══════════════════════════════════════════════════════════════════════════ */
const NOTE_CHOIX={};
function noteCle(sid,champ){ return sid+'|'+champ; }
function corpsInteractif(p,champ){
  const cle=noteCle(p.sid,champ), ch=NOTE_CHOIX[cle]||{};
  let i=-1;
  return esc(p[champ]||'').replace(/\[([^\]]+)\]/g, function(m,contenu){
    i++; const idx=i, val=ch[idx];
    if(contenu.indexOf('/')>=0){
      const opts=contenu.split('/').map(function(o){ return o.trim(); });
      /* Une fois le choix fait, les autres possibilités s'effacent : le modèle se
         resserre au fur et à mesure. Un nouvel appui sur le mot choisi les ramène. */
      const montres=(val===undefined)?opts:[val];
      return '<span class="nchoix">'+montres.map(function(o){
        const sur=o.replace(/'/g,"\\'");
        return '<button class="nopt'+(val===o?' on':'')+'" onclick="choixNote(event,\''+p.sid+'\',\''+champ+'\','+idx+',\''+sur+'\')">'+esc(o)+'</button>';
      }).join('')+'</span>';
    }
    return '<input class="nfill" value="'+esc(val||'')+'" placeholder="'+esc(contenu)+'" '+
           'onclick="event.stopPropagation()" oninput="saisieNote(\''+p.sid+'\',\''+champ+'\','+idx+',this.value)">';
  });
}
function choixNote(ev,sid,champ,idx,valeur){
  ev.stopPropagation();
  const cle=noteCle(sid,champ), c=NOTE_CHOIX[cle]||(NOTE_CHOIX[cle]={});
  c[idx]=(c[idx]===valeur)?undefined:valeur;      // re-toucher = revenir en arrière
  const p=BYSID[sid]; if(!p) return;
  const zone=document.getElementById('mod-'+champ+'-'+sid);
  if(zone) zone.innerHTML=corpsInteractif(p,champ);
}
function saisieNote(sid,champ,idx,valeur){
  const cle=noteCle(sid,champ), c=NOTE_CHOIX[cle]||(NOTE_CHOIX[cle]={});
  c[idx]=valeur;
}
/* Le texte FINI : les choix faits et les mots écrits remplacent les crochets ; ce
   qu'on n'a pas rempli reste entre crochets, pour qu'on voie ce qui manque. */
function texteNote(p,champ){
  const ch=NOTE_CHOIX[noteCle(p.sid,champ)]||{}; let i=-1;
  return String(p[champ]||'').replace(/\[([^\]]+)\]/g, function(m){
    i++; const v=ch[i];

  });
}

/* ═══ LE QR CODE DE L'ITINÉRAIRE (08/08/2026) ═══
   Mag voulait un itinéraire écrit sur la feuille (« prends le 89, 25 minutes »).
   Impossible de façon fiable : ça dépend de l'heure, du jour, des travaux, et un
   itinéraire imprimé vieillit en quelques jours. Le QR, lui, ouvre le trajet EN
   DIRECT depuis l'endroit où la personne se trouve — il ne périme jamais.

   « Vraiment minimalistes avec des points, le moins d'encre possible » :
   · les modules sont des POINTS et non des carrés pleins — un point de rayon 0,40
     couvre la moitié de la surface d'un carré : deux fois moins d'encre. On était
     descendu à 0,36, mais en dessous de 0,40 le contraste par module devient trop
     faible et les lecteurs décrochent sur un QR imprimé petit. Un QR qui ne se lit
     pas coûte plus cher que l'encre qu'il économise.
   · les trois repères d'angle sont des ANNEAUX CREUX, avec un point au centre :
     c'est le minimum que les lecteurs exigent pour se caler.
   Testé : reste lisible imprimé à 22 mm de côté. */
function qrSVG(texte, taille){
  try{
    if(typeof qrcode!=='function') return '';
    const qr=qrcode(0,'M'); qr.addData(String(texte||'')); qr.make();
    const n=qr.getModuleCount();
    const repere=function(r,c){ return (r<7&&c<7) || (r<7&&c>=n-7) || (r>=n-7&&c<7); };
    let d='';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      if(!qr.isDark(r,c) || repere(r,c)) continue;
      d+='<circle cx="'+(c+0.5)+'" cy="'+(r+0.5)+'" r="0.40"/>';
    }
    [[0,0],[0,n-7],[n-7,0]].forEach(function(o){
      const y=o[0], x=o[1];
      /* anneau creux (règle du pair-impair), puis le point du centre */
      d+='<path fill-rule="evenodd" d="M'+x+' '+y+'h7v7h-7z M'+(x+1)+' '+(y+1)+'v5h5v-5z"/>';
      d+='<circle cx="'+(x+3.5)+'" cy="'+(y+3.5)+'" r="1.35"/>';
    });
    const px=taille||96;
    return '<svg viewBox="-1 -1 '+(n+2)+' '+(n+2)+'" width="'+px+'" height="'+px+'" '+
      'xmlns="http://www.w3.org/2000/svg" fill="#1b1b1b" aria-hidden="true">'+d+'</svg>';
  }catch(e){ return ''; }
}

   quoi qu'on fasse : trois points qui ne bougent jamais donnent l'impression d'être
   bloqué au premier écran (Mag, 07/08/2026). */
function railSuit(r){
  const p=r.nextElementSibling;
  if(!p || !p.classList.contains('pgn')) return;
  const pts=p.querySelectorAll('i'); if(pts.length<2) return;
  const max=r.scrollWidth-r.clientWidth;
  const actif = max>0 ? Math.round((r.scrollLeft/max)*(pts.length-1)) : 0;
  pts.forEach(function(x,i){ x.classList.toggle('on', i===actif); });
}

/* La couleur du picto d'un jeu. Elle se trompait : sur une carte sombre elle

/* EN TÊTE DE TON RÉSEAU (08/08/2026) — les domaines qu'ELLE ouvre le plus, pas une
   liste figée. La grille du réseau avait été retirée de l'accueil début août ; cinq

   Le matériau existe déjà : `VUES` garde les 12 dernières fiches ouvertes, dans le

   hors ligne. Le bloc NE S'AFFICHE PAS tant qu'il n'y a pas d'historique — on ne
   suggère pas à une nouvelle collègue des domaines qu'elle n'a jamais ouverts. */
function railReseau(){
  let doms=[];
  try{
    const compte={};
    (VUES||[]).forEach(function(v){
      const f=DATA.find(function(x){ return x.sid===v.sid; });
      if(!f || !DOM[f.domaine] || !DOM[f.domaine].reseau) return;
      compte[f.domaine]=(compte[f.domaine]||0)+1;
    });
    doms=Object.keys(compte).sort(function(a,b){ return compte[b]-compte[a]; }).slice(0,5);
  }catch(e){ return ''; }
  if(!doms.length) return '';
  return '<div class="rres-boite"><div class="rres-t">En tête de ton réseau</div>'+
    '<div class="rres">'+doms.map(function(k){
      const d=DOM[k]||{};
      return '<button class="rpast" onclick="go(\'#/d/'+k+'\')">'+
        '<i style="background:'+dc(k)+'"></i>'+esc(d.short||d.label||k)+'</button>';
    }).join('')+'</div></div>';
}
function pileJeux(){
  const j=JEUX[JEUI]||JEUX[0];
  const suiv=JEUX[(JEUI+1)%JEUX.length];
  const apres=JEUX[(JEUI+2)%JEUX.length];   /* la 3e carte de la pile */
  /* ⚠ ORDRE D'EMPILEMENT : la carte la PLUS LOINTAINE se dessine EN PREMIER, sinon
     elle passe par-dessus celle du milieu et l'éventail devient illisible. */
  return '<div class="pile" id="pile">'+
    '<i class="p2" style="background:'+(apres.c||'#fdfdfc')+'"></i>'+
    /* La carte du dessous porte la couleur ET le picto du jeu suivant : on voit
       ce qui arrive avant même de glisser (Mag, 06/08/2026). */
    /* On touche la carte du dessous : le jeu suivant vient devant (Mag, 06/08/2026). */
    '<button class="p1 apercu" onclick="jeuSuivant()" title="'+esc(suiv.nom)+'" aria-label="Passer à : '+esc(suiv.nom)+'" style="background:'+(suiv.c||'#f3cde5')+'">'+

    /* LA CARTE PREND SA COULEUR (Mag, 08/08/2026 : « la carte noire, je ne suis pas
       sûre… c'est un peu sobre, mets une autre couleur »). Chaque jeu avait déjà SA
       couleur dans le catalogue, elle ne servait qu'au petit aperçu de derrière : la
       carte de devant, elle, sortait noire pour tout le monde. Elles sont maintenant

       Seules celles dont la couleur EST le noir le restent, avec un filet crème plus
       épais pour ne pas disparaître sur la bande noire. */
    '<button class="pcarte" id="pcarte" onclick="lancerJeu()"'+
      (j.c==='#1b1b1b'?'':' style="background:'+j.c+';color:#1b1b1b"')+'>'+
      '<span class="ic" style="color:'+(j.c==='#1b1b1b'?'#f2eee6':'rgba(27,27,27,.5)')+'">'+icon(j.ic)+'</span>'+
      '<b>'+esc(j.nom)+'</b>'+
      '<em style="color:'+(j.c==='#1b1b1b'?'#f5c542':'rgba(27,27,27,.72)')+'">'+esc(j.p)+'</em></button>'+
    '<button class="tirer" onclick="jeuAleatoire()" aria-label="Un jeu au hasard">'+
      '<span class="rd"><span class="ic">'+icon('de')+'</span></span><span>Au hasard</span></button>'+
  '</div>'+
  '<div class="pilenav">'+
    '<button class="fl" onclick="jeuPrecedent()" aria-label="Jeu précédent"><span class="ic">'+icon('chevron')+'</span></button>'+
    '<span class="pgn pilepts">'+JEUX.map(function(x,i){
      return '<i class="'+(i===JEUI?'on':'')+'"></i>';
    }).join('')+'</span>'+
    '<span class="glissez">Glisse pour changer de jeu →</span>'+

  '</div>';
}
function jeuSuivant(){ JEUI=(JEUI+1)%JEUX.length; majPile(1); }
function jeuPrecedent(){ JEUI=(JEUI-1+JEUX.length)%JEUX.length; majPile(-1); }
/* Le dé : les cartes défilent de plus en plus lentement, puis s'arrêtent sur
   une carte au hasard — comme une roue qu'on lance (Mag, 06/08/2026). */
let _deTourne=false;
function jeuAleatoire(){
  if(_deTourne) return;
  _deTourne=true;
  const de=document.querySelector('.pile .tirer .rd');
  if(de) de.style.transition='transform .5s ease', de.style.transform='rotate(360deg)';
  /* entre 8 et 13 cartes, en ralentissant : la dernière est celle qui reste */
  const pas=8+Math.floor(Math.random()*6);
  let n=0;
  (function tourner(){
    JEUI=(JEUI+1)%JEUX.length;
    majPile(1);
    n++;
    if(n<pas){
      /* de 55 ms au début à ~260 ms à la fin : le ralenti se sent */
      const d=55+Math.round(205*Math.pow(n/pas,2.2));
      setTimeout(tourner,d);
    } else {
      _deTourne=false;
      if(de) de.style.transform='';
    }
  })();
}
function lancerJeu(){ const j=JEUX[JEUI]; jxJouer(j.k,{t:'tout'}); go('#/quiz'); }
/* On redessine la pile TOUT DE SUITE : la carte suivante est déjà en place,
   et l'ancienne s'envole par-dessus, comme une vraie carte qu'on écarte.
   (Avant, on attendait la fin de l'animation : il y avait un trou. Mag, 06/08/2026) */
function majPile(sens){
  const p=document.getElementById('pile');
  if(!p) return;
  const ancienne=document.getElementById('pcarte');
  /* On garde une copie de la carte qui part, posée par-dessus la pile. */
  let fantome=null;
  if(ancienne){
    fantome=ancienne.cloneNode(true);
    fantome.removeAttribute('id');
    fantome.classList.add('glisse','fantome');
    fantome.style.pointerEvents='none';
  }
  /* La nouvelle pile est dessinée immédiatement. */
  const nav=p.nextElementSibling;
  p.outerHTML=pileJeux();
  if(nav&&nav.classList.contains('pilenav')) nav.remove();
  const neuve=document.getElementById('pile');
  if(fantome&&neuve&&!_deTourne){
    neuve.appendChild(fantome);
    /* un souffle pour que le navigateur prenne la position de départ, puis on l'envoie */
    requestAnimationFrame(function(){
      fantome.style.transform='translateX('+(sens>0?-125:125)+'%) rotate('+(sens>0?-12:12)+'deg)';
      fantome.style.opacity='0';
    });
    setTimeout(function(){ fantome.remove(); },320);
  }
  brancherGeste();
}
/* Le geste : on suit le doigt, et au relâchement on décide. */
function brancherGeste(){
  const c=document.getElementById('pcarte');
  if(!c) return;
  _pStart=null; _pDx=0;
  const debut=function(x){ _pStart=x; _pDx=0; c.classList.remove('glisse'); };
  const bouge=function(x){
    if(_pStart===null) return;
    _pDx=x-_pStart;
    c.style.transform='translateX('+_pDx+'px) rotate('+(_pDx/26)+'deg)';
  };
  const fin=function(){
    if(_pStart===null) return;
    const dx=_pDx; _pStart=null;
    c.classList.add('glisse');
    if(Math.abs(dx)>60){ dx<0?jeuSuivant():jeuPrecedent(); }
    else { c.style.transform=''; }
    /* On OUBLIE le décalage juste après : sinon il bloque tous les clics
       suivants (la carte devenait morte après un premier glissement). */
    setTimeout(function(){ _pDx=0; },0);
  };
  c.addEventListener('touchstart',e=>debut(e.touches[0].clientX),{passive:true});
  c.addEventListener('touchmove', e=>bouge(e.touches[0].clientX),{passive:true});
  c.addEventListener('touchend',  fin);
  c.addEventListener('mousedown', e=>{e.preventDefault();debut(e.clientX);});
  window.addEventListener('mousemove', e=>{ if(_pStart!==null) bouge(e.clientX); });
  window.addEventListener('mouseup', fin);
  /* Un vrai clic (sans glissement) lance le jeu ; un glissement ne doit pas le lancer. */
  c.addEventListener('click', e=>{ if(Math.abs(_pDx)>8){ e.preventDefault(); e.stopPropagation(); } }, true);
}


/* ══════════ LA MÉTÉO D'ANDERLECHT (Mag, 06/08/2026) ══════════
   Elle vient d'Open-Meteo : pas de compte, pas de clé, gratuit pour un usage
   comme le nôtre. On la relit au plus une fois par heure et on la garde sur le
   téléphone — comme ça elle s'affiche tout de suite, même hors ligne.
   À quoi ça sert ici : savoir s'il pleut avant d'envoyer quelqu'un dehors, et
   voir venir le froid (les maraudes et les hébergements d'urgence en dépendent). */
const METEO_URL='https://api.open-meteo.com/v1/forecast?latitude=50.8367&longitude=4.3097'+
  '&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
  '&timezone=Europe%2FBrussels&forecast_days=1';
let METEO=null;
try{ METEO=JSON.parse(localStorage.getItem('lux_meteo')||'null'); }catch(e){}
/* Les codes de l'organisation météo mondiale, traduits en mots simples. */
function meteoMot(code){
  const t={0:['Ciel dégagé','soleil'],1:['Peu nuageux','soleil'],2:['Nuages','nuage'],3:['Couvert','nuage'],
    45:['Brouillard','nuage'],48:['Brouillard givrant','nuage'],
    51:['Bruine','pluie'],53:['Bruine','pluie'],55:['Bruine dense','pluie'],
    61:['Pluie faible','pluie'],63:['Pluie','pluie'],65:['Forte pluie','pluie'],
    66:['Pluie verglaçante','pluie'],67:['Pluie verglaçante','pluie'],
    71:['Neige','neige'],73:['Neige','neige'],75:['Fortes chutes de neige','neige'],77:['Grains de neige','neige'],
    80:['Averses','pluie'],81:['Averses','pluie'],82:['Fortes averses','pluie'],
    85:['Averses de neige','neige'],86:['Averses de neige','neige'],
    95:['Orage','pluie'],96:['Orage et grêle','pluie'],99:['Orage et grêle','pluie']};
  return t[code]||['—','nuage'];
}
async function chargerMeteo(){
  /* Pas plus d'un appel par heure : la météo ne change pas à la minute. */
  if(METEO && (Date.now()-METEO.t) < 3600000) return;
  try{
    const r=await fetch(METEO_URL);
    if(!r.ok) return;
    const d=await r.json();
    METEO={t:Date.now(), temp:Math.round(d.current.temperature_2m), code:d.current.weather_code,
      max:Math.round(d.daily.temperature_2m_max[0]), min:Math.round(d.daily.temperature_2m_min[0]),
      pluie:d.daily.precipitation_probability_max[0], codeJour:d.daily.weather_code[0]};
    try{ localStorage.setItem('lux_meteo',JSON.stringify(METEO)); }catch(e){}
    if(current && current.view==='home') render();
  }catch(e){ /* hors ligne : on garde ce qu'on a */ }
}
/* Quatre dessins simples, dans le trait de l'app (pleins, sans contour). */
function meteoPicto(genre){
  const S='<svg viewBox="0 0 24 24" fill="currentColor" style="width:100%;height:100%">';
  if(genre==='soleil') return S+'<circle cx="12" cy="12" r="4.6"/><path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>';
  if(genre==='pluie')  return S+'<path d="M7.5 15.5a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.7 3.7 3.7 0 0 1-.7 7.3z"/><path d="M8.5 18.4l-1 2.4M12.5 18.4l-1 2.4M16.5 18.4l-1 2.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>';
  if(genre==='neige')  return S+'<path d="M7.5 14.5a4.5 4.5 0 0 1 .3-9 6 6 0 0 1 11.4 1.7 3.7 3.7 0 0 1-.7 7.3z"/><circle cx="8.6" cy="19.4" r="1.5"/><circle cx="12.6" cy="20.6" r="1.5"/><circle cx="16.6" cy="19.4" r="1.5"/></svg>';
  return S+'<path d="M7.2 18a5 5 0 0 1 .4-10 6.6 6.6 0 0 1 12.5 1.9A4.1 4.1 0 0 1 19.3 18z"/></svg>';
}
/* LA MÉTÉO EN UNE LIGNE, pour l'accueil (Mag, 08/08/2026 : « tu peux minimiser la
   météo »). On garde le picto, la température et l'alerte quand il y en a une — c'est
   ce qui sert à décider d'une sortie. Le détail (min/max, pluie) reste dans la version
   complète, qui vit ailleurs. */
function meteoLigne(){
  if(!METEO) return '';
  const [mot,pic]=meteoMot(METEO.code);
  const gel=(METEO.min<=0), pluvieux=(METEO.pluie>=50), chaud=(METEO.max>=28);
  const al = gel?'Il gèle' : pluvieux?'Pluie' : chaud?'Forte chaleur' : '';
  return '<span class="meteoL'+(al?' alerte':'')+'">'+meteoPicto(pic)+
    '<b>'+METEO.temp+'°</b>'+(al?'<em>'+esc(al)+'</em>':'<em>'+esc(mot)+'</em>')+'</span>';
}
function meteoHTML(){
  if(!METEO) return '';
  const [mot,pic]=meteoMot(METEO.code);
  const pluvieux=(METEO.pluie>=50), gel=(METEO.min<=0), chaud=(METEO.max>=28);
  /* Un mot d'alerte quand ça compte pour le travail. */
  let alerte='';
  if(gel) alerte='Il gèle — pense aux maraudes et aux places d’urgence.';
  else if(pluvieux) alerte='Il va pleuvoir — prévois de quoi s’abriter.';
  else if(chaud) alerte='Forte chaleur — de l’eau et de l’ombre.';
  return '<div class="meteo'+(alerte?' alerte':'')+'">'+
    '<span class="mic">'+meteoPicto(pic)+'</span>'+
    '<span class="mtx"><b>'+METEO.temp+'°<span class="mmot">'+esc(mot)+'</span></b>'+
    '<em>Anderlecht · '+METEO.min+'° à '+METEO.max+'° · '+METEO.pluie+' % de pluie</em>'+
    (alerte?'<span class="malerte">'+esc(alerte)+'</span>':'')+'</span></div>';
}

     'et tout se décoche tout seul demain matin. Tes rappels, eux, restent.</p>';
  return h+'<div style="height:26px"></div>';
}

/* ---------- LE FIL : le porte-voix de l'équipe ----------
   Les messages vivent dans `feed`, les réactions dans `feed_reactions`. Chacun écrit
   sous son nom Google. Les épinglés remontent en haut. */
const FEED_TYPES=[
  {k:'info',      l:'Info',      c:'#5b8fd4', e:'chat'},
  {k:'important', l:'Important', c:'#e63329', e:'alert'},
  {k:'bravo',     l:'Bravo',     c:'#6cb392', e:'fete'},
  {k:'question',  l:'Question',  c:'#f5c542', e:'question'}
];
const FTYPE=Object.fromEntries(FEED_TYPES.map(t=>[t.k,t]));
/* La valeur enregistrée dans la base ne change PAS (sinon les réactions déjà posées
   seraient perdues) — on remplace seulement le dessin affiché par les siens. */
const FEED_EMOJIS=['👍','❤️','👏','💡'];
const FEED_RX_PICTO={'👍':'pouce','❤️':'coeur','👏':'applaudir','💡':'bulb'};
let FEED=[], REACTIONS={}, feedLoaded=false, FEED_OUVERT=false, FEED_TYPE='info';

async function loadFeed(){
  feedLoaded=false; FEED=[]; REACTIONS={};
  if(!sb){ feedLoaded=true; return; }
  try{
    let data=null;
    try{
      const r=await sb.from('feed').select('id,auteur_id,auteur_nom,auteur_email,texte,cree_le,type,epingle').order('cree_le',{ascending:false}).limit(60);
      if(r.error) throw r.error; data=r.data;
    }catch(e){
      const r=await sb.from('feed').select('id,auteur_id,auteur_nom,auteur_email,texte,cree_le').order('cree_le',{ascending:false}).limit(60);
      data=r.data;
    }
    FEED=data||[];
    FEED.sort((a,b)=>(b.epingle?1:0)-(a.epingle?1:0));   // les épinglés en tête, le reste du plus récent au plus vieux
    if(FEED.length){
      try{
        const ids=FEED.map(m=>m.id);
        const {data:rx}=await sb.from('feed_reactions').select('feed_id,emoji,auteur_id').in('feed_id',ids);
        (rx||[]).forEach(r=>{
          const b=REACTIONS[r.feed_id]||(REACTIONS[r.feed_id]={});
          const e=b[r.emoji]||(b[r.emoji]={n:0,moi:false});
          e.n++; if(PROFILE&&r.auteur_id===PROFILE.uid) e.moi=true;
        });
      }catch(e){}
    }
  }catch(e){}
  feedLoaded=true;
}
/* Même précaution que pour les chambres : on va voir si quelqu'un a écrit, mais
   pas plus d'une fois toutes les 20 secondes, et on ne redessine que si ça a bougé. */
let _filVu=0, _filSignature='';
function rafraichirFil(){
  if(!sb) return;
  if(Date.now()-_filVu < 20000) return;
  _filVu=Date.now();
  loadFeed().then(function(){
    const sig=JSON.stringify(FEED)+JSON.stringify(REACTIONS);
    if(sig!==_filSignature){ _filSignature=sig; if(current.view==='fil') render(); }
  });
}

/* TROIS ÉPINGLES AU MAXIMUM (Mag, 06/08/2026). Au-delà, plus rien ne ressort : tout
   est important, donc rien ne l'est, et le fil normal se retrouve poussé hors de
   l'écran. À la quatrième, la PLUS ANCIENNE se détache toute seule — Mag n'a rien
   à gérer, et le haut du fil reste lisible. */
const MAX_EPINGLES=3;
async function epinglerMsg(id,on){
  if(!sb) return;
  /* On DIT ce qui coince au lieu d'un « indisponible » qui n'apprend rien : la colonne
     existe, et depuis le 06/08/2026 la base autorise enfin l'écriture (sql/feed-epingler.sql). */
  try{
    const r=await sb.from('feed').update({epingle:on}).eq('id',id).select('id');
    if(r.error) throw r.error;
    if(!r.data||!r.data.length){ toast('La base refuse l’épinglage (autorisation manquante)'); return; }
    if(on){
      /* FEED n'est pas encore relu : le message qu'on vient d'épingler s'ajoute à la main. */
      const epingles=FEED.filter(m=>m.epingle||m.id===id);
      if(epingles.length>MAX_EPINGLES){
        const aDetacher=epingles.filter(m=>m.id!==id)
          .sort(function(a,b){ return new Date(a.cree_le)-new Date(b.cree_le); })
          .slice(0, epingles.length-MAX_EPINGLES);
        for(let i=0;i<aDetacher.length;i++){
          try{ await sb.from('feed').update({epingle:false}).eq('id',aDetacher[i].id); }catch(e){}
        }
        if(aDetacher.length) toast('3 épingles au maximum — la plus ancienne s’est détachée');
      }
    }
    await loadFeed(); render();
  }catch(e){ toast('Épinglage refusé : '+((e&&e.message)||'la base a dit non')); }
}
/* Une réaction par personne et par picto : on l'ajoute ou on la retire. */
async function toggleReaction(id,emoji){
  if(!sb||!PROFILE) return;
  const b=REACTIONS[id]||{}, r=b[emoji]||{n:0,moi:false};
  const nb=REACTIONS[id]||(REACTIONS[id]={});
  nb[emoji]={n:Math.max(0,r.n+(r.moi?-1:1)), moi:!r.moi};
  render();                                      // l'écran répond tout de suite, la base suit
  try{
    if(r.moi) await sb.from('feed_reactions').delete().eq('feed_id',id).eq('emoji',emoji).eq('auteur_id',PROFILE.uid);
    else      await sb.from('feed_reactions').insert({feed_id:id, emoji:emoji, auteur_nom:nomAffiche()});
  }catch(e){ await loadFeed(); render(); }
}
function feedQuand(iso){
  try{
    const d=new Date(iso), diff=(Date.now()-d.getTime())/1000;
    if(diff<60) return "à l'instant";
    if(diff<3600) return Math.floor(diff/60)+' min';
    if(diff<86400) return Math.floor(diff/3600)+' h';
    const j=Math.floor(diff/86400); if(j<7) return j+' j';
    return d.toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit'});
  }catch(e){ return ''; }
}

  if(!FEED.length) return h+'<div class="empty" style="margin-top:16px"><span class="ic">'+icon('feed')+'</span>'+
    '<b>Le fil est vide.</b><p>Personne n’a encore écrit. À toi de commencer.</p></div>';

  /* Le compte des épingles, pour l'administration seulement : elle sait où elle en est

  const nEp=FEED.filter(function(m){return m.epingle}).length;
  if(vueAdmin() && nEp)

  h+='<div class="rlist" style="padding-top:18px">';
  FEED.forEach(function(m){

    const nom=(m.auteur_nom||m.auteur_email||'Quelqu’un');
    const ini=nom.charAt(0).toUpperCase();
    const amoi=!!(PROFILE&&(m.auteur_id===PROFILE.uid||(m.auteur_email||'').toLowerCase()===(PROFILE.email||'').toLowerCase()));
    const jepeuxSupprimer=amoi||!!(PROFILE&&PROFILE.admin);
    h+='<div class="msg'+(m.epingle?' epingle':'')+'">'+
      (m.epingle?'<div class="lab"><span class="ic">'+icon('star')+'</span>Épinglé</div>':'')+

      (PROFILE&&PROFILE.admin?'<button class="fsup" onclick="epinglerMsg('+m.id+','+(m.epingle?'false':'true')+')">'+
        (m.epingle?'Détacher':'Épingler')+'</button>':'')+
      '</div>'+
      '<p>'+esc(m.texte||'').replace(/\n/g,'<br>')+'</p>'+
      '<div class="frx">'+FEED_EMOJIS.map(function(e){
        const r=(REACTIONS[m.id]||{})[e]||{n:0,moi:false};
        return '<button class="'+(r.moi?'moi':'')+'" onclick="toggleReaction('+m.id+',\''+e+'\')">'+
          '<span class="ic">'+icon(FEED_RX_PICTO[e]||'check')+'</span>'+(r.n?'<em>'+r.n+'</em>':'')+'</button>';
      }).join('')+
      (jepeuxSupprimer?'<button class="fsup sup" style="margin-left:auto" onclick="supprimerMsg('+m.id+')">Supprimer</button>':'')+
      '</div></div>';
  });
  return h+'</div><div style="height:26px"></div>';
}

  h+='<button class="acc" style="margin-top:18px" onclick="onbRejouer()">'+
       '<b>Revoir la visite</b><span class="n">'+(ONB.raccourci?'et le raccourci':'et l’ajouter à l’écran d’accueil')+'</span>'+

     '<div class="rlist">'+

       '<div class="role"><b>Métier</b><span class="n">'+esc(PROFILE.equipe||'—')+'</span></div>'+

       (MES_LISTES.length?'<button class="role ouvre" onclick="go(\'#/liste\')"><b>Tes listes</b><span class="n">'+

          depuis retirée du catalogue reste dans la liste sans rien ouvrir. */
       '<button class="role ouvre" onclick="go(\'#/favoris\')"><b>Tes étoiles</b><span class="n">'+nFavosVivants()+' fiche'+(nFavosVivants()>1?'s':'')+'</span><span class="sg">›</span></button>'+

     '<button class="fbtn" style="width:100%;margin-top:18px" onclick="signOutCousin()">'+
       '<span class="ic">'+icon('cle')+'</span>Se déconnecter</button>'+

/* ---------- LES FENÊTRES DE COUSIN ----------
   Elles remplacent confirm() et prompt() du navigateur : ces boîtes-là sont grises,
   affichent l'adresse du site et n'ont rien de nous (Mag, 06/08/2026).
   · cousinConfirme(titre, texte, quandOui, {ok, danger})
   · cousinDemande(titre, texte, valeurDeDépart, quandRempli)          */
let _popQuandOui=null, _popChamp=false;
function popFermer(){
  document.getElementById('popBg').classList.remove('on');
  _popQuandOui=null; _popChamp=false;
}
function popValider(){
  const c=document.getElementById('popChamp');
  const v=_popChamp ? (c.value||'') : true;
  const f=_popQuandOui;
  popFermer();
  if(f) f(v);
}
function cousinPop(o){
  const bg=document.getElementById('popBg');
  document.getElementById('popTitre').textContent=o.titre||'';
  document.getElementById('popTexte').textContent=o.texte||'';
  const c=document.getElementById('popChamp');
  _popChamp = (typeof o.champ==='string');
  c.style.display=_popChamp?'block':'none';
  if(_popChamp){ c.value=o.champ; c.setAttribute('maxlength', o.max||24); }
  const ok=document.getElementById('popOk');
  ok.textContent=o.ok||'Confirmer';
  ok.classList.toggle('danger',!!o.danger);
  _popQuandOui=o.quandOui||null;
  bg.classList.add('on');
  if(_popChamp) setTimeout(function(){ c.focus(); c.select(); },60);
}
function cousinConfirme(titre,texte,quandOui,opt){
  cousinPop({titre:titre,texte:texte,ok:(opt&&opt.ok)||'Confirmer',danger:!!(opt&&opt.danger),quandOui:quandOui});
}
function cousinDemande(titre,texte,valeur,quandRempli,max){
  cousinPop({titre:titre,texte:texte,champ:valeur||'',ok:'Enregistrer',max:max,quandOui:quandRempli});
}
/* Entrée valide, Échap referme — comme une vraie fenêtre. */
document.addEventListener('keydown',function(e){
  const bg=document.getElementById('popBg');
  if(!bg||!bg.classList.contains('on')) return;
  if(e.key==='Escape'){ e.preventDefault(); popFermer(); }
  if(e.key==='Enter' && _popChamp){ e.preventDefault(); popValider(); }
});

/* ---------- VOIR L'APP COMME LES AUTRES (réservé à l'administration) ----------
   Trois bascules, demandées par Mag le 06/08/2026 :
   · TÉLÉPHONE / ÉCRAN — l'app est affichée dans un vrai cadre de téléphone. On passe
     par une fenêtre dans la fenêtre : c'est la seule façon d'obtenir la VRAIE mise en
     page du téléphone, celle qui dépend de la largeur de l'écran. Ça n'a de sens que
     sur un grand écran, donc la bascule ne s'y montre qu'à partir de 900 px.
   · GROUPE A · B · C  et  GROUPE D — ce que ces groupes voient.
   ⚠ HONNÊTETÉ : une seule règle d'accès a été décidée à ce jour (le groupe D ne voit
   pas « Les outils de l'équipe » ni l'Admin). Le reste de « qui voit quoi » attend
   notre séance à deux. L'aperçu applique ce qui est décidé, pas plus. */
let APERCU_TEL=false, APERCU_GRP=null, APERCU_METIER='';
/* Le groupe de chaque métier, tel que Mag les a définis (A administration,
   B coordination, C auprès des personnes, D autour du centre). Choisir un métier
   revient donc à choisir son groupe : on ne demande pas à Mag de le savoir par cœur. */
const GROUPE_DE_METIER={
  'Admin':'A',
  'Coordi':'B',
  'TS':'C','Médical':'C','Éduc':'C','Psy':'C','Infi':'C','Aide-soignante':'C',
  'Travaux / Maintenance':'C','Logistique':'C',
  'Polyvalent':'D','Agent entretien':'D','Responsable punaise':'D','Article 60':'D'
};
function grpDuMetier(m){ return GROUPE_DE_METIER[m]||'C'; }
/* Repliée, la barre n'est qu'une petite boule en bas à gauche ; on la touche pour
   ouvrir la carte, et elle se replie dès qu'un choix est fait — c'est justement
   l'écran d'en dessous qu'on veut regarder (Mag, 06/08/2026). */
let APERCU_OUVERT=false;
function apercuOuvrir(){ APERCU_OUVERT=!APERCU_OUVERT; render(); }
/* Un clic à côté referme la carte : elle ne doit pas rester dans les pattes.
   ⚠ On EXCLUT les boutons qui l'ouvrent (l'œil du rail, la boule) : sinon ce
   guetteur fermait la carte juste avant que le bouton ne la rouvre, et l'œil
   semblait ne plus rien faire (Mag, 06/08/2026). */
document.addEventListener('click',function(e){
  if(!APERCU_OUVERT) return;
  if(e.target.closest && e.target.closest('.bascule,.bboule,.apercuvr')) return;
  APERCU_OUVERT=false; render();
},true);
/* La lettre portée par la boule quand un aperçu tourne : impossible d'oublier
   qu'on ne regarde pas sa propre vue. */
function apercuLettre(){
  if(APERCU_METIER) return APERCU_METIER.charAt(0).toUpperCase();
  if(APERCU_GRP==='D') return 'D';
  if(APERCU_GRP) return 'ABC';
  if(APERCU_TEL) return '';
  return '';
}
function apercuTel(on){ APERCU_TEL=on; APERCU_OUVERT=false; render(); window.scrollTo(0,0); }
function apercuGrp(g){ APERCU_GRP=(APERCU_GRP===g)?null:g; APERCU_METIER=''; APERCU_OUVERT=false; render(); }
function apercuMetier(m){
  APERCU_METIER=m||'';
  APERCU_GRP = m ? (grpDuMetier(m)==='D'?'D':'ABC') : null;
  APERCU_OUVERT=false;
  render();
}
function apercuFin(){ APERCU_TEL=false; APERCU_GRP=null; APERCU_METIER=''; APERCU_OUVERT=false; render(); }
/* Dans le cadre du téléphone, l'app se rouvre dans une fenêtre NEUVE : sans ça elle
   ne saurait pas qu'on est en aperçu et montrerait la vue de Mag (constaté le 06/08). */
try{
  const q=new URLSearchParams(location.search);
  if(q.get('apercu')==='tel'){
    if(q.get('grp')) APERCU_GRP=q.get('grp');
    if(q.get('met')) APERCU_METIER=q.get('met');
  }
}catch(e){}
function enApercu(){ return APERCU_TEL||!!APERCU_GRP; }
/* Elle reste administratrice pour de vrai ; c'est seulement l'AFFICHAGE qui change. */
/* LE RÔLE COORDINATION, remis le 08/08/2026. Dans l'ancienne app, une coordinatrice
   pouvait gérer l'équipe et les demandes d'accès SANS être administratrice ; c'était
   tombé à la bascule. Retirer une possibilité par oubli est la mauvaise décision par
   défaut — Mag garde le dernier mot pour l'enlever.
   `vueAdmin` reste réservé à l'administration (réglages, chantier, statistiques) ;
   `peutGerer` ouvre la gestion de l'équipe à la coordination. */
function estCoordi(){ try{ return /coordi/i.test(String((PROFILE&&PROFILE.equipe)||'')); }catch(e){ return false; } }
function peutGerer(){ return !!(PROFILE&&PROFILE.admin) || estCoordi(); }
function vueAdmin(){ return !!(PROFILE&&PROFILE.admin) && !APERCU_GRP; }
function vueGestion(){ return peutGerer() && !APERCU_GRP; }
function voitOutilsCentre(){ return APERCU_GRP!=='D'; }
function barreApercu(){
  if(!(PROFILE&&PROFILE.admin)) return '';
  if(location.search.indexOf('apercu=tel')>=0) return '';   // dans le cadre du téléphone : pas de barre
  const g=function(k,l){ return '<button class="'+(APERCU_GRP===k?'on':'')+'" onclick="apercuGrp(\''+k+'\')">'+l+'</button>'; };
  if(!APERCU_OUVERT){
    const L=apercuLettre();
    return '<button class="bboule'+(enApercu()?' actif':'')+'" onclick="apercuOuvrir()" '+
      'aria-label="Voir l’app comme quelqu’un d’autre" title="Voir comme">'+
      (L?'<span class="bl">'+esc(L)+'</span>':'<span class="ic">'+icon('oeil')+'</span>')+'</button>';
  }
  return '<div class="bascule'+(enApercu()?' actif':'')+'">'+
    '<button class="bplier" onclick="apercuOuvrir()" aria-label="Replier">−</button>'+
    '<b>Voir comme</b>'+
    '<div class="bgrp becran">'+
      '<button class="'+(APERCU_TEL?'':'on')+'" onclick="apercuTel(false)">Écran</button>'+
      '<button class="'+(APERCU_TEL?'on':'')+'" onclick="apercuTel(true)">Téléphone</button>'+
    '</div>'+
    '<div class="bgrp">'+g('ABC','Groupe A · B · C')+g('D','Groupe D')+'</div>'+
    '<select class="bmet" onchange="apercuMetier(this.value)">'+
      '<option value="">Ou choisis un métier…</option>'+
      EQUIPES.map(function(q){ return '<option value="'+esc(q)+'"'+(APERCU_METIER===q?' selected':'')+'>'+
        esc(q)+' — groupe '+grpDuMetier(q)+'</option>'; }).join('')+
    '</select>'+
    (enApercu()?'<button class="bfin" onclick="apercuFin()">Revenir à ma vue</button>':'')+
    (APERCU_METIER?'<em>Tu vois COUSIN comme <b>'+esc(APERCU_METIER)+'</b> — groupe '+grpDuMetier(APERCU_METIER)+'.</em>':'')+
    (APERCU_GRP?'<em>Une seule règle est décidée à ce jour : le groupe D ne voit ni les outils de l’équipe ni l’Admin — mais il garde les formations, les jeux et le quiz.</em>':'')+
  '</div>';
}
/* Le cadre du téléphone : l'app se rouvre dedans, à 390 px de large. */
function cadreTelephone(){
  const url=location.pathname+'?apercu=tel'
    +(APERCU_GRP?'&grp='+encodeURIComponent(APERCU_GRP):'')
    +(APERCU_METIER?'&met='+encodeURIComponent(APERCU_METIER):'')
    +(location.hash||'#/');
  return '<div class="teltest"><div class="telzoom" id="telzoom"><div class="telcadre">'+
    '<iframe src="'+esc(url)+'" title="Aperçu téléphone"></iframe></div></div>'+
    '<p>C’est exactement ce que voit un téléphone. Navigue dedans comme sur le tien.</p></div>';
}
/* LE TÉLÉPHONE TIENT TOUJOURS EN ENTIER DANS LA HAUTEUR DE L'ÉCRAN (Mag, 06/08/2026).
   On le dessine plus petit s'il le faut — proportionnellement, jamais écrasé. Son
   intérieur reste large de 414 px : sans ça ce ne serait plus la mise en page d'un
   téléphone qu'on regarde, et l'aperçu ne servirait à rien.
   ⚠ On mesure la place AVANT d'avoir réduit : sinon la mesure dépendrait du réglage
   précédent et la taille sautillerait à chaque passage. */
const TEL_H=836;                       /* 812 de haut + les 2 × 12 px de la coque */
function ajusterCadre(){
  const z=document.getElementById('telzoom'); if(!z) return;
  z.style.transform='none'; z.style.height='auto';        // on repart de la taille réelle
  const haut=z.getBoundingClientRect().top + window.scrollY;
  const sousLeTel=54;                                     // la phrase d'explication
  /* On retire aussi la marge du bas de la page, sinon elle fait défiler l'écran
     alors même que le téléphone tient : Mag verrait une barre de défilement pour rien. */
  const v=document.getElementById('view');
  const padBas=v?(parseFloat(getComputedStyle(v).paddingBottom)||0):0;
  const dispo=window.innerHeight-haut-sousLeTel-padBas;
  const k=Math.max(.35,Math.min(1,dispo/TEL_H));
  z.style.transform='scale('+k+')';
  z.style.height=Math.round(TEL_H*k)+'px';                /* pas de trou sous le téléphone */
}
window.addEventListener('resize',function(){ if(APERCU_TEL) ajusterCadre(); });

/* ---------- LA BOÎTE À IDÉES ----------
   Le « + » de la barre du haut, sur TOUS les écrans et pour TOUT LE MONDE (validé par
   Mag le 06/08/2026 — c'est souvent le terrain qui repère l'erreur en premier).
   Ça atterrit dans la table `suggestions`, que Mag relève. */
function ecranActuel(){
  if(current.view==='fiche'){ const p=BYSID[current.sid]; return p?'la fiche « '+p.nom+' »':'une fiche'; }
  if(current.view==='domaine'){ const d=DOM[current.key]; return d?'la liste « '+(d.nom||current.key)+' »':'une liste'; }
  const noms={home:"l'accueil",reseau:'le réseau',centre:'le centre',urgences:'les urgences',
    favoris:'tes étoiles',liste:'ma liste',chambres:'les chambres',fil:'le fil',quiz:'le quiz',
    neuf:'quoi de neuf',ticket:'les activités',linge:'le linge',profil:'le profil',admin:"l'admin"};
  return noms[current.view]||'';
}
function ouvrirIdee(){
  const ou=document.getElementById('ideeOu');
  if(ou){ const e=ecranActuel(); ou.textContent = e ? 'Depuis '+e : ''; }
  document.getElementById('ideeBg').classList.add('on');

}
function fermerIdee(){ document.getElementById('ideeBg').classList.remove('on'); }
async function envoyerIdee(){
  const ta=document.getElementById('ideeTxt'); if(!ta) return;
  const txt=(ta.value||'').trim(); if(!txt){ ta.focus(); return; }
  if(!sb){ toast('Pas de connexion'); return; }
  /* On joint l'écran d'où ça part : sans ça, « le numéro est faux » ne dit pas lequel. */
  const e=ecranActuel();
  try{
    await sb.from('suggestions').insert({texte:(e?'['+e+'] ':'')+txt, equipe:(PROFILE&&PROFILE.equipe)||null,
      auteur_nom:nomAffiche(), auteur_email:(PROFILE&&PROFILE.email)||''});
    ta.value=''; fermerIdee(); toast('Envoyé à Mag ✓');

}

/* ---------- L'ADMIN : l'équipe et les demandes d'accès ----------
   Réservée à l'administration. Rien n'est inventé ici : tout vient de la base. */
const EQUIPES=["TS","Médical","Éduc","Psy","Infi","Aide-soignante","Polyvalent","Coordi",
               "Agent entretien","Travaux / Maintenance","Logistique","Responsable punaise",
               "Article 60","Admin"];
let ADMIN={members:[],requests:[]}, adminLoaded=false, ADM_OUVERT=null, ADM_SECTION=null;
let ADM_METIER=null;   // le métier déplié dans « L'équipe »
function admGroupe(met){ ADM_METIER=(ADM_METIER===met)?null:met; ADM_OUVERT=null; render(); }
async function loadAdmin(){
  adminLoaded=false; ADMIN={members:[],requests:[]};
  if(!sb){ adminLoaded=true; return; }
  const champs='email,nom,equipe,pfo,referent,admin,actif,listes,paves';
  /* La coordination n'a pas le droit de lire la table en direct : elle passe par les
     deux fonctions prévues pour elle, qui ne renvoient que ce qu'elle peut voir. */
  if(!(PROFILE&&PROFILE.admin)){
    try{
      const a=await sb.rpc('gestion_equipe');   ADMIN.members=(a&&a.data)||[];
      const b=await sb.rpc('gestion_demandes'); ADMIN.requests=(b&&b.data)||[];
    }catch(e){}
    adminLoaded=true; return;
  }
  try{
    const {data,error}=await sb.from('allowed_emails').select(champs+',derniere_connexion,visites').order('email');
    if(error) throw error;
    ADMIN.members=data||[];
  }catch(e){
    // Colonnes de statistiques absentes : on affiche l'équipe sans elles.
    try{ const {data}=await sb.from('allowed_emails').select(champs).order('email'); ADMIN.members=data||[]; }catch(e2){}
  }
  try{
    const {data}=await sb.from('access_requests').select('id,email,mot,cree_le').eq('statut','en_attente').order('cree_le',{ascending:false});
    ADMIN.requests=data||[];
  }catch(e){}
  /* LES CONNEXIONS D'AVANT NOTRE COMPTEUR. Il n'existe que depuis le 2 août ;
     Supabase, lui, note depuis toujours la dernière ouverture de session. Sans ça,
     l'écran disait « personne ne s'est encore connecté » alors que toute l'équipe
     l'avait déjà fait. ⚠ Ce n'est PAS la même chose que nos visites : ouvrir une
     SESSION, c'est retaper son compte Google — ça n'arrive qu'une fois de temps en
     temps. C'est dit tel quel dans l'écran. */
  try{
    const {data}=await sb.rpc('connexions_equipe');
    if(data&&data.length){
      const parMail={}; data.forEach(function(x){ parMail[String(x.email).toLowerCase()]=x; });
      ADMIN.members.forEach(function(m){
        const st=parMail[String(m.email||'').toLowerCase()];
        if(st) m.dernier_login=st.dernier_login;
      });
    }
  }catch(e){}
  adminLoaded=true;
}
/* On relit l'équipe en ouvrant la page, pas plus d'une fois par minute. */
let _admVu=0;
function rafraichirAdmin(){
  if(!sb||!PROFILE) return;
  if(adminLoaded && Date.now()-_admVu<60000) return;
  _admVu=Date.now();
  loadAdmin().then(function(){ if(current.view==='admin') render(); });
}
function admOuvrir(mail){ ADM_OUVERT=(ADM_OUVERT===mail)?null:mail; render(); }
function admSection(k){ ADM_SECTION=(ADM_SECTION===k)?null:k; render(); }   /* un seul volet ouvert à la fois */
async function admRefaire(){ await loadAdmin(); render(); }
function admActif(email,on){
  /* Couper quelqu'un, c'est le mettre dehors : on demande confirmation. */
  cousinConfirme(on?'Réactiver ce compte ?':'Couper ce compte ?', email+(on?'\n\nCette personne pourra de nouveau entrer dans COUSIN.':'\n\nCette personne ne pourra plus entrer dans COUSIN.'),
    async function(){
      try{ const r=await sb.rpc('gestion_actif',{p_email:email,p_actif:on}); if(r&&r.error) throw r.error; }
      catch(e){ try{ await sb.from('allowed_emails').update({actif:on}).eq('email',email); }catch(e2){ toast('Refusé'); return; } }
      toast(on?'Compte réactivé ✓':'Compte coupé');
      admRefaire();
    }, {ok:on?'Réactiver':'Couper', danger:!on});
}
function etageInfi(m){
  const l=Array.isArray(m.listes)?m.listes:[];
  if(l.indexOf('médical-rez')>=0) return 'rez';
  if(l.indexOf('médical-2e')>=0) return '2e';
  return '';
}
async function admReferent(email,on){
  try{ await sb.from('allowed_emails').update({referent:on}).eq('email',email); admRefaire(); }catch(e){ toast('Refusé'); }
}
async function admEtageInfi(email,etage){

/* « il y a 4 jours », « il y a 3 h » — la distance, pas la date : c'est ce qu'on
   cherche à savoir quand on regarde qui est venu. */
function depuis(iso){
  if(!iso) return null;
  const t=new Date(iso); if(isNaN(t)) return null;
  const min=Math.floor((Date.now()-t.getTime())/60000);
  if(min<2) return "à l'instant";
  if(min<60) return 'il y a '+min+' min';
  const h=Math.floor(min/60); if(h<24) return 'il y a '+h+' h';
  const j=Math.floor(h/24);
  if(j===1) return 'hier';
  if(j<31) return 'il y a '+j+' jours';
  const mo=Math.floor(j/30);
  return 'il y a '+mo+' mois';
}
/* « le 29 juillet à 9 h 12 » — pour savoir quand la demande est arrivée. */
function quandFr(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d)) return '';
  const M=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const h=String(d.getHours()), mn=String(d.getMinutes()).padStart(2,'0');
  const memeJour=d.toDateString()===new Date().toDateString();
  return (memeJour?'aujourd’hui':'le '+d.getDate()+' '+M[d.getMonth()])+' à '+h+' h '+mn;
}

const STATS_PERIODES=[[7,'7 jours'],[30,'30 jours'],[90,'3 mois']];
let STATS=null, STATS_JOURS=30, _statsEnCours=false, STATS_CACHE={};
const ECRAN_NOMS={ home:'Accueil', reseau:'Le réseau', schemas:'Les schémas à donner', educ:'Éduc', lexique:'Le dictionnaire', partager:'Partager COUSIN', favoris:'Tes étoiles', liste:'Ma liste',

function statsPeriode(j){ STATS_JOURS=j; STATS=STATS_CACHE[j]||null; render(); chargerStats(j); }
async function chargerStats(j){
  if(_statsEnCours) return;
  if(STATS_CACHE[j]){ STATS=STATS_CACHE[j]; return; }
  /* Pas de connexion : on le DIT. Avant, on repartait sans rien poser dans STATS —
     et comme vStats() rappelle chargerStats() tant que STATS est vide, la page
     restait sur « Chargement… » pour toujours. */
  if(!sb){ STATS_CACHE[j]={ecrans:[],jours:[],equipes:[],erreur:'Pas de connexion à la base — reconnecte-toi.'};
           if(STATS_JOURS===j) STATS=STATS_CACHE[j];
           /* Le render est DIFFÉRÉ : cette branche-ci est synchrone et vStats() nous appelle
              depuis l'intérieur d'un render. Un render imbriqué serait aussitôt écrasé par
              le HTML que le render parent est en train de calculer. */
           if(current.view==='stats') setTimeout(render,0);
           return; }
  _statsEnCours=true;
  let res;
  try{
    const a=await sb.rpc('stats_ecrans',{jours:j});
    const b=await sb.rpc('stats_jours', {jours:j});
    const c=await sb.rpc('stats_equipes',{jours:j});
    /* ⚠ sb.rpc() NE LÈVE PAS d'exception : il répond {data, error}. Le try/catch seul
       laissait donc passer les vraies pannes (fonction absente, droits refusés) en
       silence, et la page annonçait « Rien de noté » — un mensonge indébogable. */
    const err=(a&&a.error)||(b&&b.error)||(c&&c.error);
    if(err) throw err;
    res={ecrans:(a&&a.data)||[], jours:(b&&b.data)||[], equipes:(c&&c.data)||[]};
  }catch(e){ res={ecrans:[],jours:[],equipes:[],erreur:(e&&e.message)||'lecture impossible'}; }
  STATS_CACHE[j]=res;
  if(STATS_JOURS===j) STATS=res;
  _statsEnCours=false;
  if(current.view==='stats') render();
}
function vStats(){

    }).join('')+'</div>';
  /* On lance la lecture AVANT de conclure : sans connexion, chargerStats() répond tout de
     suite, et « Chargement… » serait alors un mensonge qui ne s'effacerait jamais. */
  if(!STATS) chargerStats(STATS_JOURS);
  if(!STATS) return h+'<div class="empty" style="margin-top:16px"><b>Chargement…</b></div>';
  if(STATS.erreur)
    return h+'<div class="fsavoir" style="margin-top:16px"><b><span class="ic">'+icon('bulb')+'</span>Lecture impossible</b>'+
      '<p>'+esc(STATS.erreur)+'</p></div><div style="height:26px"></div>';

  /* ⚠ LES COLONNES S'APPELLENT `vues` ET `personnes`, PAS `n` (réparé le 08/08/2026).

     s'affichait bien, avec les bons noms d'écrans — et TOUS LES CHIFFRES À ZÉRO. */
  const ec=(STATS.ecrans||[]).slice().sort(function(a,b){ return (b.vues||0)-(a.vues||0); });
  const total=ec.reduce(function(a,x){ return a+(x.vues||0); },0);

      const pc=total?Math.round((x.vues||0)*100/total):0;
      return '<div class="stl" title="'+esc(nomEcran(x.ecran||''))+' — '+(x.vues||0)+' ouvertures par '+(x.personnes||0)+' personnes">'+
        '<span class="stn">'+esc(nomEcran(x.ecran||''))+'</span>'+

    }).join('')+'</div>';
  }
  /* Par métier, on compte les PERSONNES et non les ouvertures : la question posée ici
     est « qui se sert de COUSIN », et une seule personne très active ne doit pas faire
     croire que tout un métier a adopté l'app. La somme est exacte, chacun n'a qu'un métier. */
  const eq=(STATS.equipes||[]).slice().sort(function(a,b){ return (b.personnes||0)-(a.personnes||0); });
  if(eq.length){
    const tot2=eq.reduce(function(a,x){ return a+(x.personnes||0); },0);
    h+='<div class="sect" style="margin-top:28px"><b>Par métier</b><em>'+tot2+' personne'+(tot2>1?'s':'')+'</em></div>'+
      '<div class="rlist">'+eq.map(function(x){
        const pc=tot2?Math.round((x.personnes||0)*100/tot2):0;
        return '<div class="stl" title="'+esc(x.equipe||'sans métier')+' — '+(x.personnes||0)+
          ' personnes, '+(x.vues||0)+' ouvertures'+(x.top?', surtout '+esc(nomEcran(x.top)):'')+'">'+
          '<span class="stn">'+esc(x.equipe||'sans métier')+'</span>'+
          '<span class="stb"><i style="width:'+Math.max(2,pc)+'%;background:#5b8fd4"></i></span>'+
          '<span class="stc">'+(x.personnes||0)+'</span></div>';
      }).join('')+'</div>';
  }
  const jr=(STATS.jours||[]);
  if(jr.length){
    const maxi=Math.max.apply(null,jr.map(function(x){return x.vues||0}))||1;
    h+='<div class="sect" style="margin-top:28px"><b>Jour par jour</b><em>'+jr.length+' jour'+(jr.length>1?'s':'')+'</em></div>'+
      '<div class="stjours">'+jr.map(function(x){
        const ht=Math.max(3,Math.round((x.vues||0)*100/maxi));
        return '<span class="stj" title="'+esc(String(x.jour||''))+' — '+(x.vues||0)+'"><i style="height:'+ht+'%"></i></span>';
      }).join('')+'</div>';
  }
  h+='<div class="fsavoir" style="margin-top:24px"><b><span class="ic">'+icon('bulb')+'</span>Ce qui est noté, et ce qui ne l’est pas</b>'+
     '<p>On note le NOM de l’écran ouvert, et rien d’autre : jamais qui l’a ouvert, jamais ce qui y a été lu.\n\n'+
     'Tes propres passages ne comptent pas — tu ouvres vingt écrans par soir pour vérifier ton travail, ça fausserait tout.</p></div>';
  return h+'<div style="height:26px"></div>';
}

          (i>0?'<button onclick="modBouger('+t.id+',-1)" aria-label="Monter">↑</button>':'<span></span>')+
          (i<taches.length-1?'<button onclick="modBouger('+t.id+',1)" aria-label="Descendre">↓</button>':'<span></span>')+
        '</span>'+
        '<button class="fsup sup" onclick="modRetirer('+t.id+',\''+esc((t.tache||'').replace(/'/g,"\\'"))+'\')">Retirer</button>'+
      '</div>';
    }).join('')+'</div>';
  }
  h+='<div class="chadd" style="margin-top:12px">'+
       '<input id="modTxt" type="text" placeholder="Une tâche de plus…" autocomplete="off" '+
       'onkeydown="if(event.key===\'Enter\'){event.preventDefault();modAjouter();}">'+
       '<button class="chaddbtn" onclick="modAjouter()">Ajouter</button>'+
     '</div>';
  h+='<div class="fsavoir" style="margin-top:22px"><b><span class="ic">'+icon('bulb')+'</span>Ce que ça change, et ce que ça ne change pas</b>'+
     '<p>Ce que tu écris ici apparaît le jour même dans « Ma liste » de tous ceux qui ont ce rôle.\n\n'+
     'Retirer une tâche n’efface le travail de personne : ce que les collègues ont coché est gardé ailleurs.</p></div>';
  return h+'<div style="height:26px"></div>';
}

function vChantier(){

  if(!(PROFILE&&PROFILE.admin))
    return h+'<div class="fsavoir" style="margin-top:16px"><b><span class="ic">'+icon('bulb')+'</span>Réservé</b>'+
      '<p>Cette page n’est qu’à toi.</p></div><div style="height:26px"></div>';
  if(!chantierLoaded) return h+'<div class="empty" style="margin-top:16px"><b>Chargement…</b></div>';

  /* LA BOÎTE d'abord : ce que l'équipe vient d'envoyer ne doit pas attendre. */

    h+='<p class="hint" style="margin-top:12px">Personne n’a rien envoyé. Le « + » en haut de l’écran arrive ici.</p>';
  } else {
    h+='<div class="rlist">'+BOITE.map(function(su){
      return '<div class="msg"><div class="top"><span class="tx">'+
        '<b>'+esc(su.auteur_nom||su.auteur_email||'Quelqu’un')+'</b>'+
        '<em>'+esc(su.equipe||'')+(su.equipe?' · ':'')+esc(quandFr(su.cree_le))+'</em></span></div>'+
        '<p>'+esc(su.texte||'').replace(/\n/g,'<br>')+'</p>'+
        '<div class="fcbas">'+
          '<button class="ann" onclick="boiteClasser('+su.id+')">Classer sans suite</button>'+
          '<button class="pub" onclick="boiteRanger('+su.id+')">Ranger dans le chantier</button>'+
        '</div></div>';
    }).join('')+'</div>';
  }

  /* AJOUTER une ligne, dans le bloc choisi. */
  h+='<div class="sect" style="margin-top:30px"><b>Noter quelque chose</b></div>'+
     '<div class="fchips" style="margin-top:12px">'+CH_BLOCS.map(function(b){
       return '<button class="fchip'+(CH_BLOC===b?' on':'')+'" onclick="chBloc(\''+esc(b).replace(/'/g,"\\'")+'\')">'+esc(b)+'</button>';
     }).join('')+'</div>'+
     '<div class="chadd" style="margin-top:10px">'+
       '<input id="chtTitre" type="text" placeholder="Ce qu’il y a à faire…" autocomplete="off">'+
       '<button class="chaddbtn" onclick="chAjouter()">Noter</button>'+
     '</div>';

  /* LE CHANTIER, bloc par bloc. */
  const restants=CHANTIER.filter(l=>!l.fait).length;
  h+='<div class="sect" style="margin-top:30px"><b>Le chantier</b>'+
     '<em>'+restants+' à faire'+(CHANTIER.length-restants?' · '+(CHANTIER.length-restants)+' fait'+((CHANTIER.length-restants)>1?'s':''):'')+'</em></div>';
  CH_BLOCS.forEach(function(b){
    const lignes=CHANTIER.filter(l=>l.bloc===b && (CH_FINIS||!l.fait));
    if(!lignes.length) return;
    h+='<div class="sectl" style="margin-top:20px">'+esc(b)+'</div><div class="rlist">'+
      lignes.map(function(l){
        return '<div class="tache'+(l.fait?' faite':'')+'">'+
          '<button class="cas" onclick="chCocher('+l.id+','+(l.fait?'false':'true')+')" aria-label="Cocher">'+
            (l.fait?'<span class="ic">'+icon('check')+'</span>':'')+'</button>'+
          '<span class="tx"><b>'+esc(l.titre)+'</b>'+
            (l.detail?'<em style="text-transform:none;letter-spacing:0;font-family:inherit;font-size:13px;color:#4a4844;margin-top:4px">'+esc(l.detail)+'</em>':'')+
            (l.fait&&l.fait_le?'<em>fait '+esc(quandFr(l.fait_le))+'</em>':'')+'</span>'+
          '<button class="fsup sup" onclick="chSupprimer('+l.id+',\''+esc((l.titre||'').replace(/'/g,"\\'"))+'\')">Retirer</button>'+
        '</div>';
      }).join('')+'</div>';
  });
  if(!CHANTIER.filter(l=>CH_FINIS||!l.fait).length)
    h+='<p class="hint" style="margin-top:14px">Rien dans le chantier'+(CH_FINIS?'':' — et rien de coché non plus')+'.</p>';
  h+='<button class="fbtn" style="width:100%;margin-top:18px" onclick="chFinis()">'+
     '<span class="ic">'+icon('check')+'</span>'+(CH_FINIS?'Cacher ce qui est fait':'Montrer aussi ce qui est fait')+'</button>';
  return h+'<div style="height:26px"></div>';
}

function vAdmin(){
  let h=heroBandeau('Admin','L’équipe et les accès','#f8763f','cog');
  if(!vueGestion())
    return h+'<div class="fsavoir" style="margin-top:16px"><b><span class="ic">'+icon('bulb')+'</span>Réservé</b>'+
      '<p>Cette page est réservée à l’administration.</p></div><div style="height:26px"></div>';

  const dem=ADMIN.requests||[], mem=ADMIN.members||[];
  const actifs=mem.filter(m=>m.actif!==false).length;

  /* --- Les demandes d'accès --- */
  h+='<button class="acc'+(ADM_SECTION==='dem'?' open':'')+'" style="margin-top:16px" onclick="admSection(\'dem\')">'+

     '<span class="sg">'+(ADM_SECTION==='dem'?'⌄':'›')+'</span></button>';

    h+='<div class="rlist">';
    if(!dem.length) h+='<div class="role"><b style="font-weight:500;color:#8b8984">Personne n’attend.</b></div>';
    dem.forEach(function(d){
      const perso=!/@samusocial\.be$/i.test(d.email||'');
      h+='<div class="msg"><div class="top"><span class="tx"><b>'+esc(d.email||'')+'</b>'+
        '<em>'+esc(quandFr(d.cree_le))+(perso?' · adresse perso':'')+'</em></span></div>'+
        (d.mot?'<p>'+esc(d.mot)+'</p>':'')+
        '<div class="fcbas">'+
          '<button class="ann" onclick="admDemande('+d.id+',\'refuser\',\''+esc(d.email||'')+'\')">Refuser</button>'+
          '<button class="pub" onclick="admDemande('+d.id+',\'approuver\',\''+esc(d.email||'')+'\')">Valider l’accès</button>'+
        '</div></div>';
    });
    h+='</div>';
  }

  /* --- QUI EST VENU : la même liste, mais rangée par dernière visite --- */
  const venus=mem.slice().sort(function(a,b){
    const va=new Date(a.derniere_connexion||a.dernier_login||0).getTime();
    const vb=new Date(b.derniere_connexion||b.dernier_login||0).getTime();
    return vb-va;
  });
  const recents=venus.filter(function(m){ return m.derniere_connexion||m.dernier_login; }).length;
  h+='<button class="acc'+(ADM_SECTION==='venus'?' open':'')+'" style="margin-top:12px" onclick="admSection(\'venus\')">'+
     '<b>Qui est venu</b><span class="n">'+recents+' sur '+mem.length+' déjà entrés</span>'+
     '<span class="sg">'+(ADM_SECTION==='venus'?'⌄':'›')+'</span></button>';
  if(ADM_SECTION==='venus'){
    h+='<div class="rlist">'+venus.map(function(m){
      const q=depuis(m.derniere_connexion)||depuis(m.dernier_login);
      const sess=!m.derniere_connexion&&m.dernier_login;
      return '<div class="role"'+(q?'':' style="opacity:.5"')+'>'+
        '<b>'+esc(m.nom||m.email)+'</b>'+
        '<span class="n">'+(q? esc(q)+(sess?' · session':'')+(m.visites?' · '+m.visites+' visites':'')
                             : 'jamais entré')+'</span></div>';
    }).join('')+'</div>'+
    '<div class="fsrc" style="text-align:left;padding:10px 0 0">« Session » veut dire : la dernière fois '+
    'que la personne a retapé son compte Google. Ça n’arrive qu’une fois de temps en temps — ce n’est pas '+
    'la dernière fois qu’elle a ouvert COUSIN.</div>';
  }

  /* --- L'équipe --- */
  h+='<button class="acc'+(ADM_SECTION==='eq'?' open':'')+'" style="margin-top:12px" onclick="admSection(\'eq\')">'+
     '<b>L’équipe</b><span class="n">'+mem.length+' inscrits · '+actifs+' actifs</span>'+
     '<span class="sg">'+(ADM_SECTION==='eq'?'⌄':'›')+'</span></button>';
  if(ADM_SECTION==='eq'){
    /* Rangée par MÉTIER : un bouton par métier avec son compte, qu'on déplie
       (Mag, 06/08/2026 : « mieux visualiser combien de personnes dans chaque équipe »). */

      (parMetier[k]||(parMetier[k]=[])).push(m); });
    const ordre=Object.keys(parMetier).sort(function(a,b){
      const ia=EQUIPES.indexOf(a), ib=EQUIPES.indexOf(b);
      return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
    });
    h+='<div class="rlist">';
    ordre.forEach(function(met){
      const gens=parMetier[met], vivants=gens.filter(x=>x.actif!==false).length;
      const ouvertM=ADM_METIER===met;
      h+='<button class="acc'+(ouvertM?' open':'')+'" onclick="admGroupe(\''+esc(met).replace(/'/g,"\\'")+'\')">'+
        '<b>'+esc(met)+'</b><span class="n">'+gens.length+(gens.length>1?' personnes':' personne')+
        (vivants!==gens.length?' · '+vivants+' actives':'')+'</span>'+
        '<span class="sg">'+(ouvertM?'⌄':'›')+'</span></button>';
      if(!ouvertM) return;
      h+='<div class="accin">';
      gens.forEach(function(m){
      const ouvert=ADM_OUVERT===m.email, off=m.actif===false;
      h+='<button class="role" onclick="admOuvrir(\''+esc(m.email)+'\')" style="'+(off?'opacity:.5':'')+'">'+
        '<b>'+esc(m.nom||m.email)+'</b>'+
        '<span class="n">'+esc(m.equipe||'—')+(m.pfo?' · PFO':'')+(m.admin?' · Admin':'')+(off?' · coupé':'')+'</span>'+
        '<span class="sg">'+(ouvert?'⌄':'›')+'</span></button>';
      if(ouvert){
        h+='<div class="accin">'+
          '<div class="fsrc" style="text-align:left;padding:0">'+esc(m.email)+'</div>'+
          '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
            '<span style="font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984">Métier</span>'+
            '<select onchange="admMetier(\''+esc(m.email)+'\',this.value,\''+esc(m.equipe||'')+'\')" style="font:inherit;font-size:14px;padding:8px;border:1px solid var(--ligne);background:#fdfdfc;border-radius:6px">'+
              '<option value="">—</option>'+
              EQUIPES.map(q=>'<option value="'+esc(q)+'"'+(q===m.equipe?' selected':'')+'>'+esc(q)+'</option>').join('')+
            '</select></div>'+
          '<div class="fchips">'+
            '<button class="fchip'+(m.pfo?' on':'')+'" onclick="admPfo(\''+esc(m.email)+'\','+(m.pfo?'false':'true')+')">PFO</button>'+
            '<button class="fchip'+(m.referent?' on':'')+'" onclick="admReferent(\''+esc(m.email)+'\','+(m.referent?'false':'true')+')">Référent·e</button>'+
            '<button class="fchip'+(off?'':' on')+'" onclick="admActif(\''+esc(m.email)+'\','+(off?'true':'false')+')">'+(off?'Coupé':'Actif')+'</button>'+
          '</div>'+
          /* Les infirmières font le même métier au rez et à l'étage, mais pas les mêmes
             tâches : chacune reçoit la liste de son poste (rapatrié de l'app d'avant). */
          (/infi/i.test(m.equipe||'')
            ? '<div style="font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:4px">Son poste</div>'+
              '<div class="fchips">'+
                '<button class="fchip'+(etageInfi(m)==='rez'?' on':'')+'" onclick="admEtageInfi(\''+esc(m.email)+'\',\'rez\')">Rez-de-chaussée</button>'+
                '<button class="fchip'+(etageInfi(m)==='2e'?' on':'')+'" onclick="admEtageInfi(\''+esc(m.email)+'\',\'2e\')">2e étage</button>'+
              '</div>'
            : '')+
          '<div style="font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:4px">Ses check-lists</div>'+
          '<div class="fchips">'+LISTE_ORDER.map(function(k){
              const on=Array.isArray(m.listes)&&m.listes.indexOf(k)>=0;
              return '<button class="fchip'+(on?' on':'')+'" onclick="admListe(\''+esc(m.email)+'\',\''+esc(k)+'\','+(on?'false':'true')+')">'+esc(LISTE_LABELS[k]||k)+'</button>';
            }).join('')+'</div>'+
          (m.derniere_connexion?'<div class="fsrc" style="text-align:left;padding:6px 0 0">Dernière ouverture : '+esc(quandFr(m.derniere_connexion))+(m.visites?' · '+m.visites+' visites':'')+'</div>':'')+
          (PROFILE.admin&&!m.admin?'<button class="ann" style="text-align:left;padding:8px 0 0;color:var(--rouge)" onclick="admRetirer(\''+esc(m.email)+'\')">Retirer de l’équipe</button>':'')+
        '</div>';
      }
      });          /* fin des personnes de ce métier */
      h+='</div>'; /* fin du volet du métier */
    });            /* fin des métiers */
    h+='</div>';
  }

  /* --- Ajouter quelqu'un --- */
  if(PROFILE.admin){
    h+='<button class="acc'+(ADM_SECTION==='add'?' open':'')+'" style="margin-top:12px" onclick="admSection(\'add\')">'+
       '<b>Ajouter quelqu’un</b><span class="n">par son adresse</span>'+
       '<span class="sg">'+(ADM_SECTION==='add'?'⌄':'›')+'</span></button>';
    if(ADM_SECTION==='add'){
      h+='<div class="accin">'+
        '<div class="chadd" style="flex-wrap:wrap">'+
          '<input id="admMail" type="email" placeholder="prenom.nom@samusocial.be" autocomplete="off" style="flex:1 1 100%">'+
          '<select id="admMetier" style="flex:1;font:inherit;font-size:14px;padding:11px;border:1px solid var(--ligne);background:#f4f3f0">'+
            '<option value="">Métier…</option>'+EQUIPES.map(q=>'<option value="'+esc(q)+'">'+esc(q)+'</option>').join('')+
          '</select>'+
          '<button class="chaddbtn" onclick="admAjouter()">Ajouter</button>'+
        '</div>'+
        /* La confirmation reste à l'écran tant qu'on ne relance pas un ajout. */
        (ADM_AJOUT?'<div class="admok'+(ADM_AJOUT.ok?'':' rate')+'">'+
          (ADM_AJOUT.ok
            ? '<b>✓ '+esc(ADM_AJOUT.email)+' fait maintenant partie de l’équipe'+
              (ADM_AJOUT.equipe?' comme <b>'+esc(ADM_AJOUT.equipe)+'</b>':'')+'.</b>'+
              '<span>Tu la retrouves dans « L’équipe » ci-dessus. Elle entrera dès sa prochaine connexion.</span>'
