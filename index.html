let PROFILE=null, profileLoaded=false;
let MES_LISTES=[], CHECKLISTS=[], DONE={};
const LISTE_LABELS={'pfo-jour':'PFO — Jour','pfo-nuit':'PFO — Nuit','médical':'Médical','polyvalent-jour':'Polyvalent — Jour','polyvalent-nuit':'Polyvalent — Nuit','médical-rez':'Médical — Rez','médical-2e':'Médical — 2e étage'};
const LISTE_ORDER=['pfo-jour','pfo-nuit','médical','médical-rez','médical-2e','polyvalent-jour','polyvalent-nuit'];
function listeRank(k){const i=LISTE_ORDER.indexOf(k);return i<0?99:i}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* Le métier suffit à deviner la liste quand personne ne l'a attribuée à la main. */
function deriveListes(equipe){
  const e=String(equipe||'').toLowerCase();
  if(e.indexOf('médical')>=0||e.indexOf('medical')>=0) return ['médical'];
  return [];   // les polyvalents ont une liste jour ET une liste nuit : c'est Mag qui tranche
}
let _visiteComptee=false, _derniereVisite=0;
/* Une app installée sur un téléphone ne se ferme pas : elle dort. On recompte donc
   une visite quand elle revient au premier plan après plus de quatre heures. */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  if(!sb||!PROFILE) return;
  if(Date.now()-_derniereVisite < 4*3600*1000) return;
  _derniereVisite=Date.now();
  envoiMuet(sb.rpc('touch_connexion'));
});

async function loadProfile(){
  profileLoaded=false;
  if(!sb) return;
  try{
    let email='',nom='',uid='';
    try{
      const ss=(await sb.auth.getSession()).data.session;
      if(ss&&ss.user){ email=ss.user.email||''; uid=ss.user.id||'';
        const mt=ss.user.user_metadata||{}; nom=mt.full_name||mt.name||mt.nom||''; }
    }catch(e){}
    let equipe='',pfo=false,admin=false,listes=[],pavesPerso=null;
    /* ⚠ NE JAMAIS PERDRE SON RÔLE À CAUSE D'UNE COLONNE MANQUANTE : une seule colonne
       absente faisait échouer toute la requête, et Mag se retrouvait sans badge et sans
       Admin. On redemande donc le strict nécessaire si la version enrichie échoue. */
    const lire=async function(champs){
      let qy=sb.from('allowed_emails').select(champs);
      if(email) qy=qy.ilike('email',email);
      const r=await qy.limit(1);
      if(r.error) throw r.error;
      return r.data;
    };
    let me=null;
    try{ me=await lire('email,equipe,pfo,admin,listes,paves'); }
    catch(e){ try{ me=await lire('email,equipe,pfo,admin,listes'); }
      catch(e2){ try{ me=await lire('email,equipe,pfo,admin'); }catch(e3){} } }
    if(me&&me[0]){
      equipe=me[0].equipe||''; pfo=!!me[0].pfo; admin=!!me[0].admin;
      listes=Array.isArray(me[0].listes)?me[0].listes:[];
      pavesPerso=Array.isArray(me[0].paves)?me[0].paves:null;
      if(me[0].email) email=me[0].email;
    }
    PROFILE={email,nom,equipe,pfo,admin,uid,listes,paves:pavesPerso};
    /* « Ma liste du jour » = MA liste, pas celle de tout le monde. La base laisse les PFO
       et l'administration voir toutes les listes (c'est utile ailleurs), mais ici on ne
       garde que les siennes : celles qu'on lui a attribuées, sinon celles que son métier
       implique. */
    MES_LISTES=(listes&&listes.length)?listes.slice():(pfo?['pfo-jour','pfo-nuit']:deriveListes(equipe));
    // Son prénom vient maintenant de son compte Google : plus besoin de le taper.
    const p1=(nom||'').trim().split(/\s+/)[0]||'';
    if(p1){ PRENOM=p1.slice(0,24); try{ localStorage.setItem(PKEY,PRENOM); }catch(e){} }
    // Une visite = une ouverture de l'app. On n'enregistre rien d'autre.
    if(!_visiteComptee){ _visiteComptee=true; _derniereVisite=Date.now(); envoiMuet(sb.rpc('touch_connexion')); }
    // Ses étoiles : elles vivent en base, elles la suivent d'un téléphone à l'autre.
    try{ await loadFavoris(); }catch(e){}
    // Les chambres en cours : chargées ici pour que le compte s'affiche sur l'accueil
    // et dans le Centre, sans avoir à ouvrir la page.
    try{ await loadChambres(); }catch(e){}
    // Ses check-lists du jour, et ce qui est déjà coché aujourd'hui.
    try{ await loadListes(); }catch(e){}
    // Ce qu'elle a lu dans les formations, et où elle en est dans les jeux.
    try{ await chargerReglages(); }catch(e){}
    // Le programme des assos : il nourrit le calendrier du mois.
    try{ await loadActivites(); }catch(e){}
    // Son chantier et sa boîte à idées : les comptes s'affichent sur la page Admin.
    if(admin){ try{ await loadChantier(); }catch(e){} }
  }catch(e){}
  profileLoaded=true;
}

/* ---------- CE QUI NE DOIT PLUS SE PERDRE ----------
   Règle posée par Mag le 30/07/2026 : « tout ce qui se perd et qui est intéressant de
   garder, tu le mets en base ». Les chapitres de formation lus et l'avancement des jeux
   ne vivaient que dans le téléphone. Table `reglages_perso` (chacun ne voit que la sienne).
   Le téléphone reste la copie de travail : on ne l'écrase que si la lecture a VRAIMENT
   réussi. */
/* ---------- LE PSEUDO ----------
   Le compte Google donne « Magali Contrino », parfois juste une adresse. Ce n'est pas
   le nom qu'on se donne entre collègues. Chacun choisit donc son pseudo depuis son
   profil ; il vit dans la base (reglages_perso), il suit la personne d'un téléphone à
   l'autre, et c'est lui qu'on lit sur le bonjour, dans le fil et sur les chambres.
   Les messages déjà écrits gardent le nom d'alors : on ne réécrit pas le passé. */
let PSEUDO; try{PSEUDO=localStorage.getItem('lux_pseudo')||''}catch(e){PSEUDO=''}
function nomAffiche(){
  if(PSEUDO) return PSEUDO;
  const g=((PROFILE&&PROFILE.nom)||'').trim().split(/\s+/)[0];
  return g||PRENOM||'';
}
function changerPseudo(){
  cousinDemande('Ton pseudo',
    'Comment veux-tu qu’on t’appelle dans COUSIN ? C’est ce nom qui apparaît sur le bonjour, dans le fil et sur les chambres.',
    nomAffiche(), function(v){
      PSEUDO=(v||'').trim().slice(0,24);
      try{ localStorage.setItem('lux_pseudo',PSEUDO); }catch(e){}
      if(typeof reglagePousser==='function') reglagePousser('pseudo',PSEUDO);
      render();
    });
}

const REG_MIGRE='lux_reglages_en_base';
let _regEnAttente={}, _regMinuteur=null;
function reglagePousser(cle,valeur){
  if(!sb||!PROFILE||!PROFILE.uid) return;
  _regEnAttente[cle]=valeur;
  /* On attend une seconde : cocher cinq chapitres à la suite ne doit pas déclencher
     cinq allers-retours vers la base. */
  clearTimeout(_regMinuteur);
  _regMinuteur=setTimeout(function(){
    const lot=_regEnAttente; _regEnAttente={};
    Object.keys(lot).forEach(function(k){
      envoiMuet(sb.from('reglages_perso').upsert(
        {user_id:PROFILE.uid, cle:k, valeur:lot[k], maj_le:new Date().toISOString()},
        {onConflict:'user_id,cle'}));
    });
  },1000);
}
/* Un record ne redescend jamais : si un appareil en connaît un meilleur, il gagne. */
function fusionnerRecords(a,b){
  const out=Object.assign({},b||{});
  Object.keys(a||{}).forEach(function(k){
    if(typeof a[k]==='number'&&(typeof out[k]!=='number'||a[k]>out[k])) out[k]=a[k];
  });
  return out;
}
async function chargerReglages(){
  if(!sb||!PROFILE||!PROFILE.uid) return false;
  let lignes;
  try{
    const {data:rows,error}=await sb.from('reglages_perso').select('cle,valeur');
    if(error) return false;
    lignes={}; (rows||[]).forEach(r=>{lignes[r.cle]=r.valeur});
  }catch(e){ return false; }
  let premiere=false;
  try{ premiere=!localStorage.getItem(REG_MIGRE); }catch(e){}
  /* FORMATIONS — la première fois on fait l'UNION : un chapitre lu ici ou là reste lu,
     on ne redemande à personne de relire ce qu'il a déjà lu. Ensuite la base fait foi,
     sinon décocher sur un téléphone ne servirait à rien. */
  const fBase=lignes.formations;
  if(fBase&&typeof fBase==='object'){
    if(premiere){
      Object.keys(fBase).forEach(function(sid){
        const ici=FLU[sid]||[], la=Array.isArray(fBase[sid])?fBase[sid]:[];
        const u=ici.slice(); la.forEach(i=>{ if(u.indexOf(i)<0) u.push(i); });
        FLU[sid]=u;
      });
    } else {
      Object.keys(FLU).forEach(k=>{delete FLU[k]});
      Object.keys(fBase).forEach(sid=>{FLU[sid]=fBase[sid]});
    }
    try{ localStorage.setItem('lux_formations',JSON.stringify(FLU)); }catch(e){}
  }
  // SES RAPPELS À ELLE : la base fait foi, ils la suivent d'un téléphone à l'autre.
  if(Array.isArray(lignes.ma_liste)){
    MESRAPPELS=lignes.ma_liste;
    try{ localStorage.setItem('lux_mes_rappels',JSON.stringify(MESRAPPELS)); }catch(e){}
  } else if(premiere && MESRAPPELS.length){
    reglagePousser('ma_liste',MESRAPPELS);
  }
  // SON PETIT NOM : la base fait foi, il la suit d'un téléphone à l'autre.
  if(typeof lignes.pseudo==='string'){
    PSEUDO=lignes.pseudo;
    try{ localStorage.setItem('lux_pseudo',PSEUDO); }catch(e){}
  } else if(premiere && PSEUDO){
    reglagePousser('pseudo',PSEUDO);   // celui posé sur ce téléphone monte en base
  }
  // JEUX — la base fait foi, sauf les records : on garde toujours le meilleur des deux.
  const jBase=lignes.jeux;
  if(jBase&&typeof jBase==='object'){
    const recs=fusionnerRecords(JXS.rec,jBase.rec);
    JXS.dom=jBase.dom||JXS.dom||{};
    JXS.jour=jBase.jour||JXS.jour||{};
    if(jBase.sem) JXS.sem=jBase.sem;
    JXS.rec=recs;
    try{ localStorage.setItem('lux_jeux',JSON.stringify(JXS)); }catch(e){}
  }
  // Premier passage sur cet appareil : ce qui n'existait QUE là monte en base.
  if(premiere){
    try{ localStorage.setItem(REG_MIGRE,'1'); }catch(e){}
    reglagePousser('formations',FLU);
    reglagePousser('jeux',JXS);
  }
  return true;
}

/* ---------- MA LISTE DU JOUR ----------
   Les modèles de listes sont dans `checklists` (une ligne par tâche, réglés par Mag) ;
   ce qui est coché AUJOURD'HUI est dans `checklist_faites` (une ligne par personne, par
   tâche et par jour). Demain, tout est décoché tout seul : c'est la date qui fait ça,
   personne n'a à remettre la liste à zéro le matin. */
let listesLoaded=false;
async function loadListes(){
  listesLoaded=false; CHECKLISTS=[]; DONE={};
  if(!sb) { listesLoaded=true; return; }
  let cl=[];
  try{ const {data}=await sb.from('checklists').select('id,liste,tache,ordre').order('ordre'); cl=data||[]; }catch(e){}
  const groups={},order=[];
  cl.forEach(t=>{ if(!groups[t.liste]){groups[t.liste]=[];order.push(t.liste);} groups[t.liste].push(t); });
  // On voit toutes les listes auxquelles la base donne accès, mais les siennes d'abord.
  CHECKLISTS=order.map(k=>({liste:k,taches:groups[k],mienne:MES_LISTES.indexOf(k)>=0}))
                  .sort((a,b)=>(b.mienne-a.mienne)||(listeRank(a.liste)-listeRank(b.liste)));
  try{
    const {data:done}=await sb.from('checklist_faites').select('tache_id').eq('jour',todayStr());
    (done||[]).forEach(d=>DONE[d.tache_id]=true);
  }catch(e){}
  listesLoaded=true;
}
async function toggleTache(id){
  const on=!DONE[id];
  if(on) DONE[id]=true; else delete DONE[id];
  render();                                    // la coche répond tout de suite
  if(!sb||!PROFILE||!PROFILE.uid) return;
  try{
    if(on) await sb.from('checklist_faites').upsert({user_id:PROFILE.uid,tache_id:id,jour:todayStr()},{onConflict:'user_id,tache_id,jour'});
    else   await sb.from('checklist_faites').delete().match({user_id:PROFILE.uid,tache_id:id,jour:todayStr()});
  }catch(e){ toast('Pas enregistré'); }
}
async function resetListe(nom){
  const g=CHECKLISTS.find(x=>x.liste===nom); if(!g) return;
  const ids=g.taches.filter(t=>DONE[t.id]).map(t=>t.id);
  if(!ids.length){ toast('Rien à décocher'); return; }
  cousinConfirme('Tout décocher ?','« '+(LISTE_LABELS[nom]||nom)+' » — '+ids.length+' tâche'+(ids.length>1?'s':'')+' cochée'+(ids.length>1?'s':'')+' aujourd’hui.',
    async function(){
      try{
        await sb.from('checklist_faites').delete().eq('user_id',PROFILE.uid).eq('jour',todayStr()).in('tache_id',ids);
        ids.forEach(i=>delete DONE[i]);
        render(); toast('Liste remise à zéro');
      }catch(e){ toast('Impossible de remettre à zéro'); }
    }, {ok:'Tout décocher', danger:true});
}
/* ══════════════════════════════════════════════════════════════════════════
   MES RAPPELS À MOI — la liste personnelle (Mag, 06/08/2026)
   Deux listes côte à côte, et c'est voulu :
   · LA LISTE DU TRAVAIL est IMPOSÉE — c'est Mag qui l'écrit, elle est la même
     pour tout un rôle. C'est elle qui fait que le relais se passe entre les
     équipes : si chacun écrivait la sienne, ce repère commun disparaîtrait.
   · MES RAPPELS sont à la personne. Elle les écrit, elle seule les voit.
   Où ça vit : dans son tiroir personnel (reglages_perso, clé « ma_liste »),
   celui qui garde déjà son pseudo. Pas de nouvelle table, pas de nouvelle
   autorisation à créer.
   ⚠ HONNÊTETÉ : c'est PRIVÉ vis-à-vis de l'équipe, pas anonyme — Mag est
   propriétaire de la base. Dit tel quel dans la page, pas de promesse en l'air.
   Les LIGNES restent d'un jour à l'autre ; ce sont les COCHES qui repartent à
   zéro à minuit, comme la liste du travail — une seule logique à comprendre. */
let MESRAPPELS;
try{ MESRAPPELS=JSON.parse(localStorage.getItem('lux_mes_rappels')||'[]'); }catch(e){ MESRAPPELS=[]; }
if(!Array.isArray(MESRAPPELS)) MESRAPPELS=[];
function rappelsSauver(){
  try{ localStorage.setItem('lux_mes_rappels',JSON.stringify(MESRAPPELS)); }catch(e){}
  if(typeof reglagePousser==='function') reglagePousser('ma_liste',MESRAPPELS);
}
function rappelFait(r){ return r && r.faitLe===todayStr(); }
function rappelAjouter(){
  const i=document.getElementById('rapTxt'); if(!i) return;
  const t=(i.value||'').trim(); if(!t){ i.focus(); return; }
  MESRAPPELS.push({id:'r'+Date.now(), texte:t.slice(0,120)});
  rappelsSauver(); i.value=''; render();
  setTimeout(function(){ const c=document.getElementById('rapTxt'); if(c) c.focus(); },30);
}
function rappelCocher(id){
  const r=MESRAPPELS.find(x=>x.id===id); if(!r) return;
  r.faitLe = rappelFait(r) ? null : todayStr();
  rappelsSauver(); render();
}
function rappelRetirer(id){
  const r=MESRAPPELS.find(x=>x.id===id); if(!r) return;
  cousinConfirme('Retirer ce rappel ?', r.texte, function(){
    MESRAPPELS=MESRAPPELS.filter(x=>x.id!==id); rappelsSauver(); render();
  }, {ok:'Retirer', danger:true});
}
function resteRappels(){ return MESRAPPELS.filter(function(r){ return !rappelFait(r); }).length; }
/* Le bloc « Mes rappels », affiché sous la liste du travail. */
function rappelsHTML(){
  const tot=MESRAPPELS.length, fait=MESRAPPELS.filter(rappelFait).length;
  let h='<div class="sect" style="margin-top:34px"><b>Mes rappels</b>'+
        '<em>'+(tot? fait+' / '+tot : 'rien pour l’instant')+'</em></div>';
  h+='<div class="fsrc" style="text-align:left;padding:10px 0 0">Ceux-là sont à toi : tu les écris, '+
     'et personne dans l’équipe ne les voit. Ils te suivent d’un téléphone à l’autre.</div>';
  if(tot){
    h+='<div style="display:flex;align-items:center;gap:14px;padding:14px 2px 4px">'+
       anneauProg(tot?fait/tot:0,'#5b8fd4')+
       '<span style="flex:1;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;'+
       'text-transform:uppercase;color:#8b8984">'+(tot-fait?(tot-fait)+' à faire':'Tout est fait ✓')+'</span></div>';
    h+='<div class="rlist">'+MESRAPPELS.map(function(r){
      const ok=rappelFait(r);
      return '<div class="tache'+(ok?' faite':'')+'">'+
        '<button class="cas" onclick="rappelCocher(\''+r.id+'\')" aria-label="Cocher">'+
          (ok?'<span class="ic">'+icon('check')+'</span>':'')+'</button>'+
        '<span class="tx" onclick="rappelCocher(\''+r.id+'\')" style="cursor:pointer"><b>'+esc(r.texte)+'</b></span>'+
        '<button class="fsup sup" onclick="rappelRetirer(\''+r.id+'\')">Retirer</button>'+
      '</div>';
    }).join('')+'</div>';
  }
  h+='<div class="chadd" style="margin-top:12px">'+
       '<input id="rapTxt" type="text" placeholder="Ce que tu ne veux pas oublier…" autocomplete="off" '+
       'onkeydown="if(event.key===\'Enter\'){event.preventDefault();rappelAjouter();}">'+
       '<button class="chaddbtn" onclick="rappelAjouter()">Ajouter</button>'+
     '</div>';
  return h;
}

/* Ce qui reste à cocher dans SES listes — c'est ce chiffre qui compte sur l'accueil. */
function resteAListe(){
  let n=0;
  CHECKLISTS.filter(g=>g.mienne).forEach(g=>g.taches.forEach(t=>{ if(!DONE[t.id]) n++; }));
  return n;
}

/* ---------- LES ÉTOILES SUIVENT LA PERSONNE, PAS LE TÉLÉPHONE ----------
   Le téléphone garde sa copie : c'est elle qui s'affiche hors ligne et pendant la
   seconde où la base répond. La base n'écrase le téléphone que si la lecture a
   VRAIMENT réussi — sinon on ne touche à rien : plutôt une étoile en trop qu'une
   étoile perdue. */
const FAV_MIGRE='lux_fav_en_base';
function favEcrire(sid,actif){
  if(!sb||!sid||!PROFILE||!PROFILE.uid) return;   // pas connecté : le téléphone suffit
  try{
    if(actif) envoiMuet(sb.from('favoris').insert({user_id:PROFILE.uid,sid:sid}));
    else      envoiMuet(sb.from('favoris').delete().eq('user_id',PROFILE.uid).eq('sid',sid));
  }catch(e){}
}
async function loadFavoris(){
  if(!sb||!PROFILE||!PROFILE.uid) return false;
  let enBase;
  try{
    const {data:rows,error}=await sb.from('favoris').select('sid');
    if(error) return false;                       // table absente ou hors ligne : on garde le téléphone
    enBase=new Set((rows||[]).map(r=>r.sid));
  }catch(e){ return false; }
  /* Première fois sur cet appareil : on REMONTE les étoiles déjà posées ici au lieu
     de les effacer. Une seule fois — ensuite c'est la base qui fait foi, sinon une
     étoile retirée sur le téléphone A reviendrait depuis le téléphone B. */
  let premiere=false;
  try{ premiere=!localStorage.getItem(FAV_MIGRE); }catch(e){}
  if(premiere){
    const aRemonter=[...FAVS].filter(s=>s&&!enBase.has(s));
    if(aRemonter.length){
      try{
        await sb.from('favoris').insert(aRemonter.map(s=>({user_id:PROFILE.uid,sid:s})));
        aRemonter.forEach(s=>enBase.add(s));
      }catch(e){}
    }
    try{ localStorage.setItem(FAV_MIGRE,'1'); }catch(e){}
  }
  const avant=[...FAVS].sort().join('|');
  FAVS=enBase; favSave();
  const change=avant!==[...FAVS].sort().join('|');
  if(change) render();
  return change;
}

async function initAuth(){
  if(!sb){
    // Hors ligne : un compte déjà connecté ici garde la porte ouverte.
    let dejaLa=false; try{ dejaLa=!!localStorage.getItem('cousin_auth_ok'); }catch(e){}
    if(dejaLa){ hideGate(); return; }
    showMessage("Connecte-toi à internet pour ouvrir COUSIN.");
    return;
  }
  /* ═══ RETOUR DE GOOGLE : on échange le code d'autorisation contre une session ═══
     ⚠ BUG RÉPARÉ LE 08/08/2026. Mag voyait souvent « PKCE code verifier not found in
     storage », puis ça marchait en recommençant — « une sensation d'échec ».

     La cause : l'adresse n'était nettoyée QU'APRÈS l'échange. Un code d'autorisation
     ne s'échange qu'UNE FOIS ; si la page se relançait entre-temps (rechargement,
     retour arrière, service worker qui réveille l'app), elle retrouvait le même
     `?code=` dans l'URL et le rejouait — le vérificateur avait déjà été consommé.

     Deux garde-fous maintenant :
     · on efface le code de l'adresse AVANT de l'échanger, pour qu'il ne puisse pas
       être rejoué ;
     · un verrou empêche deux échanges dans la même page.

     Et surtout : quand ça arrive quand même, on NE MONTRE PLUS le message technique
     anglais. Ce n'est pas un échec de sa part, c'est un aller-retour qui a traîné :
     on le dit en une phrase et on repropose le bouton. */
  try{
    const url=new URL(location.href);
    const code=url.searchParams.get('code');
    const errDesc=url.searchParams.get('error_description');
    if(errDesc){ showMessage("Google a refusé : "+errDesc+"\n\n(capture d'écran à envoyer)"); return; }
    if(code){
      if(window._codeEchange){ /* déjà fait dans cette page : on ne rejoue pas */ }
      else{
        window._codeEchange=true;
        // L'adresse est nettoyée D'ABORD : le code ne pourra plus être rejoué.
        history.replaceState(history.state,'',location.origin+location.pathname+(location.hash||''));
        const {error}=await sb.auth.exchangeCodeForSession(code);
        if(error){
          const m=String((error&&error.message)||'');
          if(/code verifier|code_verifier|pkce/i.test(m)){
            // Le lien de connexion a traîné, ou la page a été rouverte entre-temps.
            let dejaLa=null; try{ dejaLa=(await sb.auth.getSession()).data.session; }catch(e){}
            if(!dejaLa){
              showRetry("La connexion a expiré en chemin.\n\nAppuie encore une fois sur le bouton : ça repart, tu n'as rien fait de mal.");
              return;
            }
          } else {
            showMessage("Connexion échouée : "+m+"\n\n(fais une capture et envoie-la)"); return;
          }
        }
      }
    }
  }catch(e){ showMessage("Connexion échouée : "+(e&&e.message?e.message:e)+"\n\n(fais une capture et envoie-la)"); return; }

  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!session){ showLogin(); return; }
  const ok=await checkAllowed();
  if(!ok){
    // Une demande déjà envoyée ? On rassure plutôt que de reproposer le bouton.
    let dejaDemande=false;
    try{
      const {data:dq}=await sb.from('access_requests').select('statut')
        .ilike('email',session.user.email||'').eq('statut','en_attente').limit(1);
      dejaDemande=Array.isArray(dq)&&dq.length>0;
    }catch(e){}
    if(dejaDemande){
      showMessage("Ta demande est en cours.\n\nMag la validera bientôt. Reviens sur cette page dans quelques heures : dès qu'elle a validé, tu entres directement, sans rien faire de plus.");
      const rq=_g('authReq'); if(rq) rq.style.display='none';
      return;
    }
    const emailDem=(session.user.email||'');
    const pro=/@samusocial\.be$/i.test(emailDem);
    showMessage("Ton compte "+emailDem+" n'est pas encore autorisé.\n\nDemande l'accès ci-dessous : Mag reçoit ta demande et te débloque."
      +(pro?"":"\n\n⚠ C'est une adresse personnelle. Si tu as une adresse @samusocial.be, déconnecte-toi et reviens avec celle-là : c'est celle qu'on utilise dans l'équipe. Sinon, dis-nous qui tu es dans le mot ci-dessous."));
    window._reqEmail=session.user.email||'';
    try{ const mt=session.user.user_metadata||{}; window._reqNom=mt.full_name||mt.name||''; }catch(e){}
    const rq=_g('authReq'); if(rq) rq.style.display='inline-flex';
    const ch=_g('authMot'); if(ch) ch.style.display='block';
    return;
  }
  try{ localStorage.setItem('cousin_auth_ok',session.user.email||'1'); }catch(e){}
  markSeen(session.user);
  hideGate();
  // On connaît son nom avant d'afficher l'accueil : le bonjour ne clignote pas.
  loadProfile().then(function(){
    /* L'ONBOARDING À LA PREMIÈRE OUVERTURE (08/08/2026). Après la connexion, pas
       avant : sur l'écran de garde, on ne sait pas encore à qui on parle.
       Et JAMAIS quand on arrive par un lien direct vers une fiche — quelqu'un qui
       ouvre COUSIN pour un numéro est en train de chercher quelque chose, ce n'est
       pas le moment de lui présenter l'app. */
    try{
      const direct = location.hash && location.hash.length>2 && location.hash!=='#/';
      if(!ONB.vu && !direct){ ONB_ETAPE=0; go('#/bienvenue'); return; }
      /* La relance du raccourci : une fois tous les dix jours, trois fois au plus. */
      if(!direct && onbRelance()){ ONB_ETAPE=5; go('#/bienvenue'); return; }
    }catch(e){}
    render();
  });
}

/* ---------- démarrage ---------- */
current=parseRoute();
render();
initAuth();
</script>
</body>
</html>
