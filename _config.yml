# COUSIN est un site de fichiers statiques : rien à construire.
# .nojekyll désactive le constructeur — ce fichier ne sert qu'à alléger la
# publication en écartant ce qui n'a aucune raison d'être en ligne.
# Tout reste dans le dépôt : rien n'est effacé.
exclude:
  - "claudedesign lux"
  - "ecran lux"
  - "Font "
  - outils
  - vecteurs.json
