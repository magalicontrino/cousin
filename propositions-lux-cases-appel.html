<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cases d'appel — quatre designs</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 14px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;letter-spacing:.16em;text-transform:uppercase}

.catwrap{border:1px solid #d6d4d0}
.catbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-left:7px solid #fd8fd0;border-bottom:1px solid #d6d4d0;padding:13px 13px;background:transparent}
.cbleft{display:flex;align-items:center;gap:12px}
.cblab{font-weight:800;font-size:15px;text-transform:uppercase}
.cbn{font-family:ui-monospace,monospace;font-size:11.5px;color:#6b6965}
.moins{font-weight:800;font-size:17px}

.slider{display:flex;gap:9px;overflow:hidden;padding:12px 12px 14px}
.sq{flex:0 0 auto;width:124px;min-height:106px;display:flex;flex-direction:column;gap:8px;
  border:1px solid #1b1b1b;padding:12px 10px;text-align:left}
.sq b{font-size:13px;font-weight:800;line-height:1.12}
.sq em{font-style:normal;font-size:12.5px;font-weight:800;color:#e63329;line-height:1.12}

.sqN{background:#1b1b1b;border-color:#1b1b1b}
.sqN b{color:#f2eee6}
.sqN em{color:#fd8fd0}

.g2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #d6d4d0}
.g2 .c{border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;padding:13px 12px;min-height:96px;
  display:flex;flex-direction:column;gap:6px}
.g2 .c:nth-child(2n){border-right:0}
.g2 .c b{font-size:13.5px;font-weight:800;line-height:1.15}
.g2 .c em{font-style:normal;font-size:15px;font-weight:800;color:#e63329;margin-top:auto}

.reg{border-top:1px solid #d6d4d0}
.reg .r{display:flex;align-items:center;gap:12px;border-bottom:1px solid #d6d4d0;padding:12px 12px}
.reg .r b{flex:1;font-size:14px;font-weight:800;line-height:1.15}
.reg .r b small{display:block;font-size:11.5px;font-weight:400;color:#6b6965}
.reg .r em{font-style:normal;font-size:14px;font-weight:800;color:#e63329;white-space:nowrap}

.bars{padding:10px 12px 14px;display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;gap:12px;background:#fd8fd0;padding:13px 14px}
.bar b{flex:1;font-size:14px;font-weight:800;line-height:1.15;color:#1b1b1b}
.bar b small{display:block;font-size:11px;font-weight:400;color:rgba(27,27,27,.65)}
.bar em{font-style:normal;font-size:16px;font-weight:800;color:#1b1b1b;white-space:nowrap}
.ric{width:22px;height:22px;flex:none;color:#e63329}
.ricN{color:#1b1b1b}
</style>
</head>
<body>
<div class="wrap">
<h1>Les cases d'appel — quatre designs</h1>
<p class="intro">Exemple : la catégorie Violences · femmes, ouverte. Le registre à liséré et le bloc 101 · 112 ne bougent pas — ce qui change, c'est l'intérieur de l'accordéon. Réponds par un numéro (ou un mélange).</p>
<div id="zones"></div>
</div>
<script>
const tel='<svg viewBox="0 0 24 24" fill="currentColor" style="width:100%;height:100%"><path d="M6.6 3.1c.7-.4 1.6-.2 2.1.4l1.9 2.5c.4.6.4 1.4-.1 2l-1 1.2a.9.9 0 0 0-.1 1c.5 1 1.2 2 2.1 2.9.9.9 1.9 1.6 2.9 2.1.3.2.8.1 1-.1l1.2-1c.6-.5 1.4-.5 2-.1l2.5 1.9c.6.5.8 1.4.4 2.1l-.9 1.6c-.5.8-1.4 1.3-2.3 1.2C11.9 20 4 12.1 3.2 5.7c-.1-.9.4-1.8 1.2-2.3z"/></svg>';
const femme='<svg viewBox="0 0 24 24" fill="currentColor" style="width:22px;height:22px"><path fill-rule="evenodd" d="M12 2.4a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0 2.7a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/><rect x="10.7" y="13.2" width="2.6" height="8.4" rx="1.3"/><rect x="8" y="16.5" width="8" height="2.6" rx="1.3"/></svg>';
const L=[
 ['CPVS','24h/24','02 535 45 42'],
 ['Écoute Violences Conjugales','Violences conjugales','0800 30 030'],
 ['SOS Viol','','0800 98 100'],
 ['Violences sexuelles','','0800 98 100']
];
function cat(inner){
  return '<div class="catwrap"><div class="catbtn"><span class="cbleft">'+femme+
    '<span class="cblab">Violences · femmes</span></span>'+
    '<span style="display:flex;align-items:center;gap:11px"><span class="cbn">4</span><span class="moins">−</span></span></div>'+inner+'</div>';
}
const V=[
 ['1 · Le slider actuel — cases au trait',
  'Ce que tu as : des cases encadrées qui défilent sur le côté, picto rouge, numéro rouge. Rapide, mais on ne voit pas tout d\'un coup.',
  cat('<div class="slider">'+L.map(x=>'<span class="sq"><span class="ric">'+tel+'</span><b>'+x[0]+'</b><em>'+(x[1]||x[2])+'</em></span>').join('')+'</div>')],
 ['2 · Cases de nuit — le slider s\'inverse',
  'Le même slider, mais les cases passent en NOIR : nom crème, numéro à la couleur de la catégorie (rose ici). Écho des pavés de l\'accueil — on voit tout de suite que c\'est des boutons.',
  cat('<div class="slider">'+L.map(x=>'<span class="sq sqN"><span class="ric" style="color:#e63329">'+tel+'</span><b>'+x[0]+'</b><em>'+(x[1]||x[2])+'</em></span>').join('')+'</div>')],
 ['3 · La grille — tout visible, rien ne défile',
  'Deux colonnes qui descendent, comme la grille de l\'accueil : toutes les cases visibles d\'un coup, le numéro en gros en bas de case. En urgence, on ne cherche pas — on voit.',
  cat('<div class="g2">'+L.map(x=>'<span class="c"><span class="ric">'+tel+'</span><b>'+x[0]+(x[1]?' <small style="display:block;font-size:11px;font-weight:400;color:#6b6965">'+x[1]+'</small>':'')+'</b><em>'+x[2]+'</em></span>').join('')+'</div>')],
 ['4 · Barres pleines — le geste d\'urgence d\'abord',
  'Chaque service devient une grande barre à la couleur de la catégorie, pleine largeur, le numéro bien en évidence à droite. Le plus « panique » : une cible énorme, impossible de rater.',
  cat('<div class="bars">'+L.map(x=>'<span class="bar"><span class="ric ricN" style="width:20px;height:20px">'+tel+'</span><b>'+x[0]+(x[1]?'<small>'+x[1]+'</small>':'')+'</b><em>'+x[2]+'</em></span>').join('')+'</div>')]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone">'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
