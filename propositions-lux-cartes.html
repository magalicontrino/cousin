<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux — remplissage des cartes</title>
<style>
/* Page locale — rien en ligne. La page Centre, remplie de quatre façons
   différentes : le noir se fait plus rare, la lumière revient. */
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-medium.woff2') format('woff2');font-weight:500;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-demibold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman Grotesque';src:url('font/eastman-grotesque-heavy.woff2') format('woff2');font-weight:900;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#f2eee6;padding:18px 14px}
.hd{font-family:'Eastman Grotesque','Eastman';font-weight:900;text-transform:uppercase;font-size:24px;margin-bottom:12px}
.gh{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;color:#6b655a;margin:16px 0 9px}
.gh::after{content:'';flex:1;height:2px;background:rgba(27,27,27,.12)}

.tc{display:flex;align-items:center;gap:13px;border-radius:16px;padding:13px 14px;margin-bottom:10px}
.tc .tic{width:32px;height:32px;flex:none}
.tc .tic .pico,.tc .tic svg{width:100%;height:100%}
.tc b{display:block;font-size:13.5px;font-weight:800;text-transform:uppercase}
.tc em{display:block;font-style:normal;font-size:13.5px;margin-top:1px}
.tc .tx{flex:1;min-width:0}
.tc .ch{font-size:20px;font-weight:700;opacity:.5}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tl{border-radius:16px;padding:12px;min-height:104px;display:flex;flex-direction:column}
.tl b{font-size:12.5px;font-weight:800;text-transform:uppercase;line-height:1.2}
.tl small{font-size:11px;margin-top:2px}
.tl .pi{margin-top:auto;align-self:flex-end;width:28px;height:28px}
.tl .pi .pico,.tl .pi svg{width:100%;height:100%}

/* 1 — cerclé */
.v1 .tc,.v1 .tl{background:#fff;border:2px solid #1b1b1b}
.v1 .tc em{color:#555}.v1 .tl small{color:#6b655a}
/* 2 — couleurs douces */
.v2 .tc,.v2 .tl{border:0}
.v2 .tc em{color:rgba(27,27,27,.65)}.v2 .tl small{color:rgba(27,27,27,.55)}
/* 3 — pleines couleurs */
.v3 .tc,.v3 .tl{border:0}
.v3 .tc em{color:rgba(27,27,27,.7)}.v3 .tl small{color:rgba(27,27,27,.6)}
/* 4 — blanc + pastille */
.v4 .tc,.v4 .tl{background:#fff;box-shadow:0 2px 10px rgba(27,27,27,.08)}
.v4 .tc em{color:#555}.v4 .tl small{color:#6b655a}
.v4 .tic,.v4 .pi{border-radius:10px;display:flex;align-items:center;justify-content:center}
.v4 .tc .tic{width:40px;height:40px}
.v4 .tc .tic .pico,.v4 .tc .tic svg{width:22px!important;height:22px!important}
.v4 .tl .pi{width:36px;height:36px}
.v4 .tl .pi .pico,.v4 .tl .pi svg{width:20px!important;height:20px!important}
</style>
</head>
<body>
<div class="wrap">
<h1>La page Centre — quatre remplissages</h1>
<p class="intro">Le fond reste crème, le dock reste noir. Ce qui change : la matière des cartes. Dis-moi laquelle tu préfères — tu peux aussi mélanger (par exemple le quotidien d'une façon, les outils d'une autre).</p>
<div id="zones"></div>
</div>
<script>
const K={vert:'#6cb392',rose:'#fd8fd0',jaune:'#f5c542',orange:'#f8763f',brun:'#b28b7a',noir:'#1b1b1b'};
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
function pale(hex,p){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,m=x=>Math.round(x+(255-x)*p);return 'rgb('+m(r)+','+m(g)+','+m(b)+')'}

/* [picto, couleur, titre, sous-titre] */
const QUOT=[
 ['linge.svg',K.vert,'Linge — aujourd’hui','2e étage · chambres 201 → 222'],
 ['colis.svg',K.jaune,'Distribution des produits','Samedi 5 septembre']
];
const OUT=[['centre.svg',K.orange,'Gestion du centre','5 fiches'],
           ['conduite.svg',K.rose,'Protocole','6 fiches'],
           ['mails.svg',K.jaune,'Mail et note type','17 fiches'],
           ['formations.svg',K.vert,'Formations','10 fiches']];
const ADMIN=['roue.svg',K.orange,'Admin','Équipe, rôles et demandes d’accès'];

function screen(mode){
  function tc(it){
    let st='', pst='', pcol=it[1];
    if(mode==='v2'){st='style="background:'+pale(it[1],.78)+'"';}
    if(mode==='v3'){st='style="background:'+it[1]+'"'; pcol=K.noir;}
    if(mode==='v4'){pst='style="background:'+pale(it[1],.82)+'"';}
    return '<div class="tc" '+st+'><span class="tic" '+pst+'>'+pico(it[0],pcol,32)+'</span>'+
      '<span class="tx"><b>'+it[2]+'</b><em>'+it[3]+'</em></span><span class="ch">›</span></div>';
  }
  function tl(it){
    let st='', pst='', pcol=it[1];
    if(mode==='v2'){st='style="background:'+pale(it[1],.78)+'"';}
    if(mode==='v3'){st='style="background:'+it[1]+'"'; pcol=K.noir;}
    if(mode==='v4'){pst='style="background:'+pale(it[1],.82)+'"';}
    return '<div class="tl" '+st+'><b>'+it[2]+'</b><small>'+it[3]+'</small>'+
      '<span class="pi" '+pst+'>'+pico(it[0],pcol,28)+'</span></div>';
  }
  return '<div class="'+mode+'"><div class="hd">Le centre</div>'+
    '<div class="gh">Le quotidien</div>'+QUOT.map(tc).join('')+
    '<div class="gh">Les outils</div><div class="gr">'+OUT.map(tl).join('')+'</div>'+
    '<div class="gh">Réservé</div>'+tc(ADMIN)+'</div>';
}
const V=[
 ['v1','1 — Cerclé','Cartes blanches, bordure noire bien nette, picto couleur. Le côté « geek » de tes cartes du COUSIN principal, mais tout en lumière.'],
 ['v2','2 — Couleurs douces','Chaque carte prend le fond pâle de SA couleur, sans bordure. Doux, coloré, très clair.'],
 ['v3','3 — Pleines couleurs','Tes pavés du COUSIN principal, tels quels : la couleur franche en fond, picto et texte noirs. Le plus vivant.'],
 ['v4','4 — Blanc + pastille','Cartes blanches sans bordure, ombre légère, et le picto posé sur une pastille pâle de sa couleur. Le plus aéré.']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+screen(v[0])+'</div></div>').join('');
</script>
</body>
</html>
