<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux — 4 présentations, ton style</title>
<style>
/* Page de comparaison — LOCALE UNIQUEMENT, rien en ligne.
   Le ton, c'est le sien : crème, pavés pleins de couleur, pictos noirs posés
   en bas à droite, capitales bien grasses, dock de ronds en bas, petites
   formes (fleur, demi-disques, donut, arc-en-ciel) qui dansent autour.
   Moi je ne fais varier que l'organisation (UX). */
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-medium.woff2') format('woff2');font-weight:500;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-demibold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman Grotesque';src:url('font/eastman-grotesque-heavy.woff2') format('woff2');font-weight:900;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#f2eee6;position:relative}
.scr{padding:20px 14px 16px;position:relative;overflow:hidden}

/* ---- éléments communs, dans SON style ---- */
.disp{font-family:'Eastman Grotesque','Eastman';font-weight:900;text-transform:uppercase;line-height:.95;letter-spacing:-.01em}
.urg{display:flex;align-items:center;gap:12px;background:#e63329;border-radius:16px;padding:13px 16px;color:#f2eee6;margin-bottom:14px}
.urg .rond{width:44px;height:44px;background:#f2eee6;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.urg b{display:block;font-family:'Eastman Grotesque','Eastman';font-weight:900;font-size:17px;letter-spacing:.03em}
.urg small{font-size:12.5px;opacity:.92}
.urg .chev{margin-left:auto;font-weight:700}
.dock{display:flex;justify-content:center;gap:12px;padding:14px 0 6px}
.dock .db{width:52px;height:52px;border-radius:50%;background:#1b1b1b;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.dock .db .pico{width:22px;height:22px}
.dock .lbl{font-size:9px;font-weight:600;letter-spacing:.04em;color:#6b655a;text-align:center;margin-top:5px}
.dockcol{display:flex;flex-direction:column;align-items:center}

/* ============ 1 — Pavés rangés ============ */
.v1 .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.v1 .tile{border-radius:16px;padding:13px 13px 11px;min-height:118px;display:flex;flex-direction:column}
.v1 .tile b{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.v1 .tile small{font-size:11px;font-weight:500;color:rgba(27,27,27,.55)}
.v1 .tile .pi{margin-top:auto;align-self:flex-end}
.v1 .tile .pi .pico,.v1 .tile .pi svg{width:34px;height:34px;color:#1b1b1b}
.v1 .head{font-size:30px;margin:6px 2px 14px}

/* ============ 2 — Bandes éditoriales ============ */
.v2 .head{font-size:38px;margin:8px 2px 16px;position:relative}
.v2 .head .shape{position:absolute}
.v2 .bande{display:flex;align-items:center;gap:12px;border-radius:14px;padding:13px 16px;margin-bottom:9px}
.v2 .bande b{font-size:14.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;flex:1}
.v2 .bande small{font-size:11px;font-weight:600;color:rgba(27,27,27,.5);margin-right:8px}
.v2 .bande .pico,.v2 .bande svg{width:26px;height:26px;color:#1b1b1b;flex:none}
.v2 .pill{margin:14px auto 6px;display:flex;justify-content:center;gap:18px;background:#1b1b1b;border-radius:999px;padding:13px 22px;width:max-content}
.v2 .pill .pico,.v2 .pill svg{width:22px;height:22px}

/* ============ 3 — Nuit pop ============ */
.v3 .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.v3 .tile{background:#1b1b1b;border-radius:16px;padding:13px 13px 11px;min-height:118px;display:flex;flex-direction:column;color:#f2eee6}
.v3 .tile b{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.v3 .tile small{font-size:11px;color:rgba(242,238,230,.55)}
.v3 .tile .pi{margin-top:auto;align-self:flex-end}
.v3 .tile .pi .pico,.v3 .tile .pi svg{width:34px;height:34px}
.v3 .head{font-size:30px;margin:6px 2px 14px;position:relative}
.v3 .dock .db{background:transparent}
.v3 .dock .dbc{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.v3 .dock .dbc .pico,.v3 .dock .dbc svg{width:22px;height:22px;color:#1b1b1b}

/* ============ 4 — Mosaïque d'atelier ============ */
.v4 .head{font-size:34px;margin:6px 2px 16px;position:relative}
.v4 .mos{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:74px;gap:11px}
.v4 .tile{border-radius:16px;padding:12px;display:flex;flex-direction:column;position:relative}
.v4 .t2{grid-row:span 2}
.v4 .tile b{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.v4 .tile small{font-size:10.5px;font-weight:500;color:rgba(27,27,27,.55)}
.v4 .tile .pi{margin-top:auto;align-self:flex-end}
.v4 .t2 .pi .pico,.v4 .t2 .pi svg{width:34px;height:34px;color:#1b1b1b}
.v4 .t1 .pi .pico,.v4 .t1 .pi svg{width:24px;height:24px;color:#1b1b1b}
.v4 .rot1{transform:rotate(-1.2deg)}
.v4 .rot2{transform:rotate(1.1deg)}
.v4 .shape{position:absolute;z-index:2}
</style>
</head>
<body>
<div class="wrap">
<h1>Lux — quatre présentations, ton style</h1>
<p class="intro">Ton ton à toi partout : crème, tes couleurs, tes pictos noirs posés en bas à droite des pavés, tes formes qui dansent, ton dock de ronds. Moi je ne fais varier que l'organisation. Dis-moi laquelle te parle.</p>
<div id="zones"></div>
</div>
<script>
/* ses couleurs du main */
const K={reseau:'#f3c6da',demarches:'#b28b7a',formations:'#6cb392',mails:'#f5c542',methodes:'#fd8fd0',centre:'#f8763f',urg:'#e63329',creme:'#f2eee6',noir:'#1b1b1b'};
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgClip='<svg viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="2" width="9" height="9" rx="1.4"/><rect x="13" y="2" width="9" height="9" rx="1.4"/><rect x="2" y="13" width="9" height="9" rx="1.4"/><rect x="13" y="13" width="9" height="9" rx="1.4"/></svg>';
const svgHouse='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 21.4 11.6v9.4H2.6v-9.4z"/></svg>';
const arc='<img src="picto/lgbtqi.svg" alt="" style="height:22px">';

/* les 6 pavés : [couleur, nom, nb, picto(html ou fichier)] */
const P=[
 [K.reseau,'Réseau','182 fiches','ico-reseau.svg'],
 [K.demarches,'Démarches','15 fiches','ico-demarches.svg'],
 [K.formations,'Formations','10 fiches','formations.svg'],
 [K.mails,'Mail et note type','17 fiches','ico-guillemets.svg'],
 [K.methodes,'Protocole','6 fiches',svgClip],
 [K.centre,'Gestion du centre','5 fiches',svgHouse]
];
function pi(p,size){return p.endsWith&&p.endsWith('.svg')?pico(p,'#1b1b1b',size):p}
function urgband(){
 return '<div class="urg"><span class="rond">'+pico('urgences.svg',K.urg,24)+'</span>'+
   '<span><b>Urgences</b><small>101 · 112 · numéros d’écoute</small></span><span class="chev">›</span></div>';
}
function dock(mode){
 const items=[['ico-reseau.svg','Réseau',K.reseau],['',  'Centre',K.centre],['ico-etoile.svg','Favoris',K.mails],['urgences.svg','Urgences',K.urg]];
 if(mode==='v3'){ /* ronds pleins couleur, picto noir */
  return '<div class="dock">'+items.map(it=>'<span class="dockcol"><span class="dbc" style="background:'+it[2]+'">'+
    (it[0]?pico(it[0],'#1b1b1b',22):svgHouse.replace('<svg','<svg style="width:22px;height:22px;color:#1b1b1b"'))+
    '</span><span class="lbl">'+it[1]+'</span></span>').join('')+'</div>';
 }
 /* ronds noirs, picto couleur (comme son dock) */
 return '<div class="dock">'+items.map(it=>'<span class="dockcol"><span class="db">'+
   (it[0]?pico(it[0],it[2],22):svgHouse.replace('<svg','<svg style="width:22px;height:22px;color:'+it[2]+'"'))+
   '</span><span class="lbl">'+it[1]+'</span></span>').join('')+'</div>';
}

/* ---- 1 : pavés rangés ---- */
function v1(){
 return '<div class="v1"><div class="scr">'+
  '<div class="head disp">Vous cherchez<br>quoi&nbsp;?</div>'+urgband()+
  '<div class="grid">'+P.map(p=>'<div class="tile" style="background:'+p[0]+'"><b>'+p[1]+'</b><small>'+p[2]+'</small><span class="pi">'+pi(p[3],34)+'</span></div>').join('')+'</div>'+
  dock()+'</div></div>';
}
/* ---- 2 : bandes éditoriales ---- */
function v2(){
 return '<div class="v2"><div class="scr">'+
  '<div class="head disp">Vous<span class="shape" style="right:86px;top:2px">'+pico('ico-demidisques.svg',K.formations,26)+'</span><span class="shape" style="right:34px;top:0">'+arc+'</span><br>cherchez<span class="shape" style="right:6px;top:44px">'+pico('ico-fleur.svg',K.methodes,30)+'</span><br>qu<span style="display:inline-block;vertical-align:baseline">'+pico('ico-donut.svg',K.centre,30)+'</span>i&nbsp;?</div>'+
  urgband()+
  P.map(p=>'<div class="bande" style="background:'+p[0]+'">'+pi(p[3],26)+'<b>'+p[1]+'</b><small>'+p[2]+'</small></div>').join('')+
  '<div class="pill">'+[ ['ico-reseau.svg',K.reseau],['',K.centre],['ico-etoile.svg',K.mails],['urgences.svg',K.urg] ].map(it=>
     it[0]?pico(it[0],it[1],22):svgHouse.replace('<svg','<svg style="width:22px;height:22px;color:'+it[1]+'"')).join('')+'</div>'+
  '</div></div>';
}
/* ---- 3 : nuit pop ---- */
function v3(){
 return '<div class="v3"><div class="scr">'+
  '<div class="head disp">Vous cherchez quoi&nbsp;?<span style="position:absolute;right:2px;top:-4px">'+pico('ico-fleur.svg',K.reseau,26)+'</span></div>'+urgband()+
  '<div class="grid">'+P.map(p=>'<div class="tile"><b>'+p[1]+'</b><small>'+p[2]+'</small><span class="pi" style="color:'+p[0]+'">'+
     (p[3].endsWith&&p[3].endsWith('.svg')?pico(p[3],p[0],34):p[3])+'</span></div>').join('')+'</div>'+
  dock('v3')+'</div></div>';
}
/* ---- 4 : mosaïque d'atelier ---- */
function v4(){
 const spans=['t2 rot1','t1','t1 rot2','t2','t2 rot2','t1'];
 return '<div class="v4"><div class="scr">'+
  '<span class="shape" style="top:12px;right:14px">'+arc+'</span>'+
  '<span class="shape" style="top:150px;left:6px">'+pico('ico-demidisques.svg',K.formations,22)+'</span>'+
  '<span class="shape" style="bottom:120px;right:8px">'+pico('ico-fleur.svg',K.methodes,26)+'</span>'+
  '<div class="head disp">Vous cherchez<br>qu<span style="display:inline-block">'+pico('ico-donut.svg',K.centre,26)+'</span>i&nbsp;?</div>'+
  urgband()+
  '<div class="mos">'+P.map((p,i)=>'<div class="tile '+spans[i]+'" style="background:'+p[0]+'"><b>'+p[1]+'</b><small>'+p[2]+'</small><span class="pi">'+pi(p[3],spans[i].indexOf('t2')===0?34:24)+'</span></div>').join('')+'</div>'+
  dock()+'</div></div>';
}
const V=[
 ['1','1 — Pavés rangés','Ton accueil, remis au carré : le grand titre, le bandeau Urgences, tes six pavés à hauteur égale, ton dock en rappel. Le plus proche de ton app, en plus respirant.',v1],
 ['2','2 — Bandes éditoriales','Plus magazine : ton grand titre avec tes formes qui dansent, puis chaque domaine en pleine largeur — plus facile à balayer du pouce. Le dock devient une pilule noire flottante.',v2],
 ['3','3 — Nuit pop','L’inverse artistique : pavés noirs, pictos qui prennent la couleur. Le dock inverse aussi : ronds de couleur, pictos noirs. Chic, moderne, très lisible.',v3],
 ['4','4 — Mosaïque d’atelier','La plus artistique : pavés hauts et bas qui s’imbriquent, une pointe de rotation comme des cartes posées sur une table, tes formes éparpillées. Vivante, un peu espiègle.',v4]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="p'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
