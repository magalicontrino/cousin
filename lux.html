  // ===== Pratiques : conduite à tenir face à un risque suicidaire (généralisée, sans données internes) =====
  m("Risque suicidaire","Repères généraux face à un risque suicidaire ou une tentative.","RISQUE SUICIDAIRE IDENTIFIÉ\n• Proposer à la personne de voir un·e psy (du centre ou externe).\n• Prévenir l'équipe de la fragilité de la personne, sans entrer dans les détails, pour qu'une attention particulière soit portée.\n• Demander de transmettre toute observation particulière du comportement.\n• Si la personne refuse : contacter l'équipe mobile de crise de la zone.\n• Si un·e psy objective un risque élevé de passage à l'acte : proposer un accompagnement aux urgences psychiatriques et/ou une feuille de liaison, avec reprise de contact.\n\nTENTATIVE DE SUICIDE\n• Appeler le 112.\n• Contacter les urgences pour expliquer la situation et demander une évaluation par un·e psychiatre.\n• Si retour en rue : avertir le réseau de la personne.\n\nURGENCE VITALE : 112 · Prévention du suicide (gratuit, 24h/24) : 0800 32 123."),

  // ===== Formations : Violentomètre =====
  /* Écrite le 01/08/2026 à sa demande : « toutes ces informations qui, par la rigolette,
     amènent à l'apprentissage du sans-abrisme ». D'où le jeu au milieu — on retient un mot
     qu'on a cherché, pas un mot qu'on a lu. Les définitions sont celles du Syndicat des
     immenses, recopiées, pas reformulées : ce sont leurs mots. */
  formation("Les mots qu'on emploie",
    "SDF, sans-abri, immense : d'où viennent les mots, ce qu'ils font aux gens, et le vocabulaire inventé par les personnes concernées elles-mêmes.",[],
    `<div class="f-page">
  <div class="f-lead">${icon('petition')} <b>« Mal nommer les gens ajoute à leur malheur sur la terre. »</b> C'est le principe du Syndicat des immenses : ne pas savoir nommer une souffrance, c'est ne pas pouvoir la dénoncer. Ils ont donc fabriqué les mots qui manquaient — <b>200 à ce jour</b>.</div>

  <div class="f-h">1. Pourquoi les mots comptent</div>
  <div class="f-lead">« SDF » : sans domicile <b>fixe</b> — comme si le problème était la fixité. « Sans-abri » : comme si un abri suffisait. « Précaire », « exclu », « bénéficiaire » : chaque fois, la personne <b>disparaît derrière son problème</b>.</div>
  <div class="f-note">${icon('alert')} Le Syndicat rappelle qu'il n'est pas un groupe de parole mais un <b>groupe de pression</b>. La différence tient dans un mot : on ne les écoute pas, on négocie avec eux.</div>

  <div class="f-h">2. Immense — le mot qu'ils ont choisi</div>
  <div class="f-grid">
    <div class="f-card"><div class="fn">${icon('star')} Immense</div><div class="fw"><b>I</b>ndividu dans une <b>M</b>erde <b>M</b>atérielle <b>É</b>norme mais <b>N</b>on <b>S</b>ans <b>E</b>xigences.<br>Le problème est dit — <b>matériel</b> — sans que la personne y soit réduite. Et elle a des <b>exigences</b>, pas des besoins.</div></div>
    <div class="f-card"><div class="fn">${icon('user')} Escapé·e</div><div class="fw"><b>E</b>nclos·e dans le <b>S</b>ystème, mais <b>Cap</b>able <b>A</b>isément et <b>P</b>ériodiquement de s'en <b>É</b>chapper.<br>Celle qui a un logement et de quoi souffler : partir, se distraire, décompresser. <b>C'est nous.</b></div></div>
    <div class="f-card"><div class="fn">${icon('compass')} Immenscapé·e</div><div class="fw">Immense dans certaines dimensions de sa vie, escapé·e dans d'autres. La plupart des gens, en réalité — la frontière n'est pas un mur.</div></div>
    <div class="f-card"><div class="fn">${icon('home')} Sans-chez-soirisme</div><div class="fw">Le mot juste à la place de « sans-abrisme ». <b>Un abri n'est pas un chez-soi</b> : une place en dortoir ne fait pas un domicile.</div></div>
  </div>

  <div class="f-h">3. Pourquoi ça dure : les quatre piliers</div>
  <div class="f-lead">Quatre mots expliquent, selon eux, pourquoi le sans-chez-soirisme <b>explose en Belgique et implose en Finlande</b>.</div>
  <div class="f-steps">
    <div class="f-step"><div class="sn">1</div><div class="st"><b>Hiérarchisme</b><span>Croire que toutes les vies humaines n'ont pas la même valeur.</span></div></div>
    <div class="f-step"><div class="sn">2</div><div class="st"><b>Désuniversalisme</b><span>Deux poids, deux mesures : à situation égale, traitement différent.</span></div></div>
    <div class="f-step"><div class="sn">3</div><div class="st"><b>Allomorphisme</b><span>Tendance à croire qu'une situation impensable, inacceptable, insupportable ou invivable <b>pour soi</b> est gérable, acceptable, supportable ou vivable <b>pour d'autres</b>.</span></div></div>
    <div class="f-step"><div class="sn">4</div><div class="st"><b>Nécropolitique</b><span>Punir les personnes sans chez-soi d'être encore en vie, en leur rendant la vie impossible.</span></div></div>
  </div>
  <div class="f-note">${icon('bulb')} <b>Celui qui pique le plus, c'est l'allomorphisme.</b> C'est le mot qui décrit le moment où on se dit « bon, elle a une place, ça va » — pour une nuit qu'on ne passerait pas soi-même.</div>

  <div class="f-h">4. Comment ça s'arrête : deux mots</div>
  <div class="f-steps">
    <div class="f-step"><div class="sn">→</div><div class="st"><b>Udéskif</b><span>Acronyme approximatif d'« <b>Universalisation De Ce Qui Fonctionne</b> ». Ce qui marche déjà quelque part, pour quelques-uns, on le donne à tout le monde.</span></div></div>
    <div class="f-step"><div class="sn">→</div><div class="st"><b>Créalpolitik</b><span>Le contraire de la realpolitik : se méfier des contraintes présentées d'entrée de jeu comme insurmontables, refuser les faux dilemmes qui paralysent l'imagination, rejeter la logique des « enveloppes fermées ».</span></div></div>
    <div class="f-step"><div class="sn">→</div><div class="st"><b>Éluctable</b><span>« Ce qui n'est pas inéluctable est éluctable. » Le sans-chez-soirisme n'est pas une fatalité : c'est une décision collective, qui peut se décider autrement.</span></div></div>
    <div class="f-step"><div class="sn">→</div><div class="st"><b>Fatalâche</b><span>Celle ou celui qui préfère penser que c'est une fatalité, et décide de ne pas remettre sa conviction en question.</span></div></div>
  </div>
  <div class="f-note">${icon('stats')} <b>La Finlande.</b> Elle a fait chuter son nombre de personnes sans chez-soi à l'échelle nationale. C'est l'argument central du Syndicat : la preuve que c'est possible existe déjà, ailleurs.</div>

  <div class="f-h">5. Le petit jeu des mots</div>
  <div class="f-lead">Devinez d'abord, dépliez ensuite. Un mot qu'on a cherché reste ; un mot qu'on a lu, non.</div>
  <div class="f-jeu">
    <details><summary>Une personne qui a un logement et de quoi s'échapper de temps en temps</summary><p><b>Escapé·e.</b> Enclos·e dans le Système, mais Capable Aisément et Périodiquement de s'en Échapper.</p></details>
    <details><summary>Croire qu'une nuit qu'on ne supporterait pas soi-même est supportable pour un autre</summary><p><b>Allomorphisme.</b> Le pilier le plus discret, et le plus efficace.</p></details>
    <details><summary>Donner à tout le monde ce qui marche déjà pour quelques-uns</summary><p><b>Udéskif.</b> Universalisation De Ce Qui Fonctionne.</p></details>
    <details><summary>Le contraire d'inéluctable</summary><p><b>Éluctable.</b> Ce qui n'est pas inéluctable est éluctable — donc ça peut s'arrêter.</p></details>
    <details><summary>Quelqu'un qui trouve que c'est triste mais que c'est comme ça</summary><p><b>Fatalâche.</b> Fataliste, et un peu lâche.</p></details>
    <details><summary>Un abri n'est pas un chez-soi : comment dit-on, alors ?</summary><p><b>Sans-chez-soirisme.</b> Et pas sans-abrisme.</p></details>
  </div>
  <div class="f-note">${icon('note')} Le <b>Thésaurus de l'immensité</b> (Caroline Lamarche et Laurent d'Ursel, La Lettre volée, mars 2024) contient les 200 mots : <b>17</b> pour identifier et combattre le sans-chez-soirisme, <b>183</b> pour le décrire dans son quotidien. La brochure <b>« 17 mots pour en finir avec le sans-chez-soirisme »</b> (ARC) reprend les dix-sept, et se lit en une heure.</div>

  <div class="f-h">6. Le Syndicat des immenses</div>
  <div class="f-steps">
    <div class="f-step"><div class="sn">1</div><div class="st"><b>D'où il vient</b><span>Mars 2019, du groupe « Les précaires en colère », après la première assemblée ouverte de Droit à un toit / Recht op een dak. Fondé par <b>Laurent d'Ursel</b>, qui avait créé DoucheFLUX.</span></div></div>
    <div class="f-step"><div class="sn">2</div><div class="st"><b>Ce qu'il est</b><span>Un lobby citoyen, un groupe de pression et d'action — <b>pas</b> un groupe de parole. Trente-huit revendications à ce jour, une intervention publique par mois.</span></div></div>
    <div class="f-step"><div class="sn">3</div><div class="st"><b>Où on le trouve</b><span>Tous les <b>lundis de 11h à 13h30</b>, chez DoucheFLUX, rue des Vétérinaires 84 à Anderlecht. Les réunions sont ouvertes.</span></div></div>
    <div class="f-step"><div class="sn">4</div><div class="st"><b>Ce qu'il fabrique</b><span>L'Immense Festival, les universités d'été de l'immensité, des conférences gesticulées, des publications.</span></div></div>
  </div>

  <div class="f-h">7. DoucheFLUX, à quinze minutes d'ici</div>
  <div class="f-lead">Centre de jour ouvert en 2017 près de la gare du Midi, <b>dans notre commune</b> : 20 douches, une buanderie, 450 casiers. Douche 1 €, lessive 1 € les 3 kg, casier de 1 à 2 € la semaine. <b>Mercredi matin et début d'après-midi : réservé aux femmes.</b> 02 319 58 27.</div>
  <div class="f-note">${icon('chat')} <b>« Le rêve de la personne sans chez-soi n'est pas une douche, c'est un logement. »</b> — Laurent d'Ursel, RTBF, 2022. Le lieu qui donne des douches passe son temps à dire que la douche n'est pas la solution : être sans logement est un problème de <b>logement</b>, pas un problème social ou sanitaire. D'où leur projet Housing First, lancé en 2023.</div>

  <div class="f-h">8. Ce que ça change pour nous</div>
  <div class="f-do yes"><b>${icon('check')} À faire</b><ul>
    <li><b>Dire le nom des gens</b> avant leur catégorie. « Monsieur X », pas « le SDF de la 214 ».</li>
    <li><b>Se demander « et si c'était moi ? »</b> — c'est exactement le test que vise le mot allomorphisme.</li>
    <li><b>Y envoyer quelqu'un qui veut agir</b> plutôt que subir : le lundi, chez DoucheFLUX, c'est ouvert.</li>
    <li><b>Se servir des mots comme d'outils</b> en réunion et dans les rapports : ils rendent visible ce qu'on n'arrivait pas à formuler.</li>
  </ul></div>
  <div class="f-do no"><b>${icon('alert')} À ne pas faire</b><ul>
    <li><b>Ne pas imposer « immense » à quelqu'un</b> qui ne se reconnaît pas dedans. Un mot choisi par un groupe ne se colle pas de force sur une personne.</li>
    <li><b>Ne pas confondre le vocabulaire et l'action.</b> Ils le disent eux-mêmes : c'est un groupe de pression, pas un club de langue.</li>
    <li><b>Ne pas transformer ça en leçon de morale</b> entre collègues. Ce sont des outils, pas un examen de vertu.</li>
  </ul></div>

  <div class="f-note">${icon('note')} <b>Sources</b>, relevées le 01/08/2026 : syndicatdesimmenses.be (bienvenue, piliers du sans-chez-soirisme persistant, thésaurus de l'immensité, boîte à armes politiques, l'immense festival) · arc-culture.be — « 17 mots pour en finir avec le sans-chez-soirisme » · Caroline Lamarche et Laurent d'Ursel, <i>Le Thésaurus de l'immensité</i>, La Lettre volée, 2024 · maisonmedicale.org — « L'immense combat du Syndicat des immenses » · doucheflux.be et anderlecht.be · RTBF, 25/08/2022 et Immense Festival · moustique.be, 01/03/2024.<br><br>Les définitions sont <b>recopiées</b> du Syndicat, pas reformulées : ce sont leurs mots, pas les nôtres.</div>
</div>`, "Les mots"),

`<div class="f-page">
  <div class="f-lead">${icon('camera')} <b>Le TAM, c'est l'audition filmée d'un enfant victime ou témoin</b>, menée par un policier spécialement formé. Principe clé : <b>une seule audition, bien faite</b> — chaque fois qu'on refait raconter l'enfant, on abîme son témoignage.</div>

  <div class="f-h">En deux mots</div>
  <div class="f-grid">

    <div class="f-card"><div class="fn">${icon('compass')} La méthode</div><div class="fw">Protocole <b>NICHD</b>, la référence internationale : questions ouvertes, récit libre, zéro suggestion.</div></div>

  <div class="f-h">Ce que dit la loi</div>
  <div class="f-steps">

    <div class="f-step"><div class="sn">2</div><div class="st"><b>Pour quelles infractions</b><span>Les faits listés à l'article 91bis : essentiellement mœurs, maltraitance, traite des êtres humains, violences.</span></div></div>
    <div class="f-step"><div class="sn">3</div><div class="st"><b>L'accord de l'enfant</b><span>L'enregistrement se fait avec son consentement. <b>En dessous de 12 ans, il suffit de l'informer</b> — mais on lui explique toujours.</span></div></div>
    <div class="f-step"><div class="sn">4</div><div class="st"><b>Une audition qui compte</b><span>La vidéo peut remplacer une comparution : elle évite à l'enfant de répéter son récit devant le tribunal.</span></div></div>
  </div>

  <div class="f-h">Comment se passe l'audition (protocole NICHD)</div>
  <div class="f-steps">
    <div class="f-step"><div class="sn">1</div><div class="st"><b>Accueil et présentation</b><span>Local adapté, l'enfant comprend qui est en face de lui et pourquoi c'est filmé.</span></div></div>
    <div class="f-step"><div class="sn">2</div><div class="st"><b>Les règles du jeu</b><span>« Tu peux me dire je ne sais pas. » « Si je me trompe, corrige-moi. » « On ne dit que ce qui est vrai. »</span></div></div>
    <div class="f-step"><div class="sn">3</div><div class="st"><b>Entraînement au récit</b><span>On fait raconter un souvenir neutre et récent (une fête, une journée d'école). C'est l'étape la plus importante : l'enfant apprend à raconter longuement avant qu'on aborde les faits.</span></div></div>
    <div class="f-step"><div class="sn">4</div><div class="st"><b>Transition vers les faits</b><span>Amenée par des questions très ouvertes, sans jamais nommer une personne ni un acte à la place de l'enfant.</span></div></div>
    <div class="f-step"><div class="sn">5</div><div class="st"><b>Récit libre</b><span>« Raconte-moi tout ce qui s'est passé, du début jusqu'à la fin. » Puis on relance : « Et ensuite ? », « Parle-moi encore de ça. »</span></div></div>
    <div class="f-step"><div class="sn">6</div><div class="st"><b>Questions plus précises, en dernier</b><span>Seulement si nécessaire, et toujours après le récit libre — jamais avant.</span></div></div>
    <div class="f-step"><div class="sn">7</div><div class="st"><b>Clôture</b><span>Retour à un sujet neutre, remerciements, explication de la suite.</span></div></div>

  <div class="f-h">Notre rôle à nous</div>
  <div class="f-do yes"><b>${icon('check')} À faire</b><ul>
    <li><b>Accueillir la parole</b> si l'enfant se confie : écouter, ne pas couper, rester calme.</li>
    <li><b>Noter mot à mot</b> ce qu'il a dit spontanément, avec la date, l'heure et le contexte. Ses mots à lui, pas les nôtres.</li>
    <li><b>Signaler sans attendre</b> à la hiérarchie et à l'autorité compétente (parquet / police / SAJ-SPJ selon la situation).</li>
    <li><b>Le rassurer</b> : il a bien fait de parler, il n'est pas responsable, on va s'occuper de lui.</li>
  </ul></div>
  <div class="f-do no"><b>${icon('alert')} À ne pas faire</b><ul>
    <li><b>Ne pas mener l'enquête.</b> Ce n'est ni notre rôle ni notre formation.</li>
    <li><b>Ne pas faire répéter</b> le récit, et ne pas faire raconter à plusieurs collègues : chaque redite fragilise le témoignage.</li>
    <li><b>Aucune question fermée ou suggestive</b> (« C'est papa qui t'a fait ça ? », « Il t'a touchée ici ? ») — elles peuvent contaminer la mémoire de l'enfant et rendre son récit inutilisable au procès.</li>

    <li><b>Mineur suspect</b> → régime <b>Salduz</b> : droit à un avocat, cadre totalement différent.</li>

/* Elles rejoignent aussi « Tout mélangé » : la règle de droit croise les fiches du réseau,
   c'est comme ça qu'on la retient pour de bon. */
function quizEcrites(){
  return QUIZ_ECRIT.map(function(x){
    const opts=qShuffle(x.opts.slice());
    return { q:x.q, opts:opts, correct:opts.indexOf(x.opts[x.correct]), pourquoi:x.pourquoi };
  });
}
function quizGen(theme, doms, tout){
  if(theme==='droits'){ const q=qShuffle(quizEcrites()); return { qs:q, i:0, score:0, answered:false, picked:-1, theme:theme }; }
  const allReseau=data.filter(p=>p.nom && DOM[p.domaine] && DOM[p.domaine].reseau);
  // `doms` = une liste de domaines (un terrain « métier », par exemple) ; sinon un seul thème.
  const pool = doms ? allReseau.filter(p=>doms.includes(p.domaine))
                    : (theme==='all') ? allReseau : allReseau.filter(p=>p.domaine===theme);
  const descAll=allReseau.filter(p=>p.desc && p.desc.length>15);
  const pubAll =allReseau.filter(p=>p.public && p.public.length>4);
  // Un même texte peut décrire plusieurs services (« Habitants de la commune » vaut pour
  // tous les CPAS) : dans ce cas la question « quel service ? » n'a pas UNE bonne réponse,
  // on ne la pose donc pas.
  const compte=(liste,champ)=>{
    const c={}; liste.forEach(x=>{ const k=String(x[champ]||'').trim().toLowerCase(); c[k]=(c[k]||0)+1; }); return c;
  };
  const nbDesc=compte(descAll,'desc'), nbPub=compte(pubAll,'public');
  const unique=(c,v)=> c[String(v||'').trim().toLowerCase()]===1;
  const pick=(arr,n)=>qShuffle(arr).slice(0,n);
  // 3 mauvaises réponses distinctes entre elles ET différentes de la bonne
  const leurres=(arr,bonne)=>{
    const vus=new Set([bonne.toLowerCase()]), out=[];
    qShuffle(arr).forEach(v=>{ const k=v.toLowerCase(); if(out.length<3 && v && !vus.has(k)){ vus.add(k); out.push(v); } });
    return out;
  };
  const qs=[];
  pool.forEach(p=>{
    // Ce que fait le service
    if(p.desc && p.desc.length>15){
      const bonne=qTrim(p.desc,110);
      const l=leurres(descAll.filter(x=>x.nom!==p.nom).map(x=>qTrim(x.desc,110)),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"Que propose « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
      // Dans l'autre sens : reconnaître le service à partir de ce qu'il fait —
      // seulement si cette description n'appartient qu'à lui.
      if(unique(nbDesc,p.desc)){
        const ln=leurres(descAll.filter(x=>x.nom!==p.nom).map(x=>x.nom),p.nom);
        if(ln.length===3){ const opts=qShuffle([p.nom].concat(ln)); qs.push({q:"Quel service correspond à : « "+qTrim(p.desc,120)+" » ?",opts,correct:opts.indexOf(p.nom),src:p.id}); }
      }
    }
    // Le public visé
    if(p.public && p.public.length>4){
      const bonne=qTrim(p.public,90);
      const l=leurres(pubAll.filter(x=>x.nom!==p.nom).map(x=>qTrim(x.public,90)),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"À qui s'adresse « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
      if(unique(nbPub,p.public)){
        const ln=leurres(pubAll.filter(x=>x.nom!==p.nom).map(x=>x.nom),p.nom);
        if(ln.length===3){ const opts=qShuffle([p.nom].concat(ln)); qs.push({q:"Quel service s'adresse à : « "+bonne+" » ?",opts,correct:opts.indexOf(p.nom),src:p.id}); }
      }
    }
    // Le bon domaine (seulement en « tout mélangé » : dans un thème, la réponse serait évidente)
    if(theme==='all' || (doms && doms.length>1)){
      const bonne=DOM[p.domaine].label;
      const l=leurres(DOMAINES.filter(x=>x.reseau && x.key!==p.domaine).map(x=>x.label),bonne);
      if(l.length===3){ const opts=qShuffle([bonne].concat(l)); qs.push({q:"Dans quel domaine trouve-t-on « "+p.nom+" » ?",opts,correct:opts.indexOf(bonne),src:p.id}); }
    }
  });
  /* `tout` = on rend TOUTES les questions, sans tirage ni mélange : c'est ce qu'il faut
     pour que la question du jour soit la même pour tout le monde et ne bouge pas. */
  /* Les questions écrites rejoignent « Tout mélangé » sans toucher au tableau d'origine
     (il est en const : on en fabrique un nouveau). */
  const toutes = (theme==='all') ? qs.concat(quizEcrites()) : qs;
  if(tout) return { qs:toutes, i:0, score:0, answered:false, picked:-1, theme };
  return { qs:qShuffle(toutes).slice(0,60), i:0, score:0, answered:false, picked:-1, theme };
}

const POUB_COUL={noire:'#242424',jaune:'#f5c518',bleue:'#2f6fed'};
function prochaineCollecte(){
  const now=new Date(), d=now.getDay();
  if(POUBELLES[d] && now.getHours()<12) return {sacs:POUBELLES[d], quand:'ce matin', urgent:true};
  for(let i=1;i<=7;i++){
    const j=(d+i)%7;
    if(POUBELLES[j]){
      const quand = i===1 ? (now.getHours()>=16 ? 'ce soir ou demain matin' : 'demain matin')
                          : JOURS[j].toLowerCase()+' matin';
      return {sacs:POUBELLES[j], quand, urgent:i===1&&now.getHours()>=16};
    }
  }
}
function premierSamedi(a,m){const d=new Date(a,m,1);d.setDate(1+((6-d.getDay())+7)%7);return d}
function prochaineDistrib(){
  const now=new Date(), auj=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let x=premierSamedi(now.getFullYear(),now.getMonth());
  if(x<auj) x=premierSamedi(now.getFullYear(),now.getMonth()+1);
  return x;
}
/* Le picto poubelle prend la couleur du premier sac — mais un sac noir sur carte noire
   ne se verrait pas : dans ce cas, le picto passe en crème. */
function coulSac(sacs){const c=POUB_COUL[sacs[0].c];return c==='#242424'?'#f2eee6':c}
function sacsDots(sacs){
  return '<span class="sacs">'+sacs.map(x=>{
    const sombre=x.c==='noire'||x.c==='bleue';
    return '<i style="background:'+POUB_COUL[x.c]+';color:'+(sombre?'#f2eee6':'#1b1b1b')+'">'+x.n+'</i>';
  }).join('')+'</span>';
}
function sacsTexte(sacs){return sacs.map(x=>x.n+' '+x.l).join(' + ')}
function ficheDuCentre(rx){const f=DATA.find(p=>p.domaine==='centre'&&rx.test(p.nom));return f?f.sid:null}
function goFiche(rx){const sid=ficheDuCentre(rx); if(sid) go('#/f/'+sid); else go('#/centre');}
/* La bande « aujourd'hui » : le linge du jour, les poubelles, les produits — en un coup d'œil. */
function bandeAujourdhui(){
  const d=new Date().getDay();
  const l=LINGE[d], col=prochaineCollecte(), dist=prochaineDistrib();
  const dans=Math.round((dist-new Date(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/86400000);
  let h='<div class="tstrip">';
  if(l) h+='<button class="tpill" onclick="goFiche(/linge/i)">'+
    '<span class="ic" style="color:'+(LINGE_COUL[l.etage]||'#f2eee6')+'">'+icon('linge')+'</span>'+
    '<span><b>Linge</b><em>'+esc(l.etage+(l.chambres?' · '+l.chambres:''))+'</em></span></button>';
  if(col) h+='<button class="tpill'+(col.urgent?' hot':'')+'" onclick="goFiche(/poubelle/i)">'+
    '<span class="ic" style="color:'+coulSac(col.sacs)+'">'+icon('poubelle')+'</span>'+
    '<span><b>Poubelles · '+esc(col.quand)+'</b><em>'+esc(sacsTexte(col.sacs))+'</em></span>'+sacsDots(col.sacs)+'</button>';
  if(dans<=1) h+='<button class="tpill hot" onclick="goFiche(/produits/i)">'+
    '<span class="ic" style="color:#f5c542">'+icon('colis')+'</span>'+
    '<span><b>Produits</b><em>Distribution '+(dans===0?'aujourd’hui':'demain')+' à l’accueil</em></span></button>';
  return h+'</div>';
}

/* Tri de proximité — la règle de Mag, appliquée pour de vrai cette fois :
   Anderlecht d'abord, puis le régional, puis le reste par ordre alphabétique. */
function triProximite(arr){
  const rang=p=> p.commune==='Anderlecht'?0 : (!p.commune||p.commune==='Régional / Toutes communes')?1 : 2;
  return arr.slice().sort((a,b)=> rang(a)-rang(b) || a.nom.localeCompare(b.nom,'fr'));
}

/* ---------- navigation ---------- */
let current={view:'home'};
let scrollMem={};
function go(hash){location.hash=hash}
function parseRoute(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return {view:'home'};
  const seg=h.split('/');
  if(seg[0]==='d' && DOM[seg[1]]) return {view:'domaine',key:seg[1]};
  if(seg[0]==='f' && BYSID[seg[1]]) return {view:'fiche',sid:seg[1]};
  if(seg[0]==='centre') return {view:'centre'};
  if(seg[0]==='admin') return {view:'admin'};
  if(seg[0]==='quiz') return {view:'quiz'};
  if(seg[0]==='sorties') return {view:'sorties'};
  if(seg[0]==='favoris') return {view:'favoris'};
  if(seg[0]==='urgences') return {view:'urgences'};
  return {view:'home'};
}
window.addEventListener('hashchange',()=>{
  scrollMem[keyOf(current)]=window.scrollY;
  current=parseRoute(); render();
  window.scrollTo(0,scrollMem[keyOf(current)]||0);
});

function keyOf(r){return r.view+(r.key||r.sid||'')}

  document.body.classList.toggle('no-tabs',current.view==='fiche');

  if(current.view==='home') view.innerHTML=vHome();
  else if(current.view==='domaine') view.innerHTML=vDomaine(current.key);
  else if(current.view==='fiche') view.innerHTML=vFiche(BYSID[current.sid]);
  else if(current.view==='centre') view.innerHTML=vCentre();
  else if(current.view==='admin') view.innerHTML=vAdmin();
  else if(current.view==='quiz') view.innerHTML=vQuiz();
  else if(current.view==='sorties') view.innerHTML=vSorties();
  else if(current.view==='favoris') view.innerHTML=vFavoris();
  else if(current.view==='urgences') view.innerHTML=vUrgences();
  renderTabs();
}

/* ---------- rail de catégories ---------- */
function rail(active){
  const isTool=DOM[active]&&(DOM[active].method||DOM[active].isFormation||DOM[active].isMail);
  const list=DOMAINES.filter(d=>d.key!=='urgences'&&(isTool?(d.method||d.isFormation||d.isMail):(d.reseau||d.isDem)));
  return '<div class="rail">'+list.map(d=>
    '<button class="'+(d.key===active?'on':'')+'" onclick="go(\'#/d/'+d.key+'\')">'+
    '<span class="ic" style="color:'+dc(d.key)+'">'+icon(d.ic)+'</span>'+esc(d.short)+'</button>').join('')+'</div>';
}

/* ---------- vue domaine ---------- */
function chipRow(name,values,activeVal,allLabel){
  if(values.length<2) return '';
  return '<div class="chips">'+
    '<button class="chip'+(activeVal===allLabel?' on':'')+'" onclick="setFilt(\''+name+'\',\''+allLabel+'\')">'+allLabel+'</button>'+
    values.map(v=>'<button class="chip'+(activeVal===v?' on':'')+'" onclick="setFilt(\''+name+'\',\''+esc(v).replace(/'/g,"\\'")+'\')">'+esc(v)+'</button>').join('')+
  '</div>';
}
function fcard(p){
  const d=DOM[p.domaine]||{}, c=dc(p.domaine);
  const sub=[p.commune&&p.commune!=='Régional / Toutes communes'?p.commune:'',p.public].filter(Boolean).join(' · ')||p.desc.split('\n')[0];
  return '<div class="fcard" role="button" tabindex="0" onclick="go(\'#/f/'+p.sid+'\')">'+
    '<span class="fpi" style="color:'+c+'"><span class="ic">'+icon(fichePicto(p)||d.ic||'compass')+'</span></span>'+
    '<span class="tx">'+(p.urgent?'<span class="utag">Urgence</span>':'')+
      '<b>'+esc(p.nom)+'</b><small>'+esc(sub)+'</small></span>'+
    heartBtn(p.sid)+'</div>';
}
function vDomaine(key){
  const d=DOM[key];
  let items=DATA.filter(p=>p.domaine===key);
  let chips='';
  if(d.isDem && filt.dem==='Toutes'){
    /* Liste condensée : une ligne par démarche, puis le choix de l'organisme. */
    const dems=DEMARCHES.filter(t=>items.some(p=>p.demarche===t));
    const pp=DATA.find(p=>p.domaine==='formations' && /Premiers pas/i.test(p.nom));
    return '<div class="subtop"><button class="cbtn" onclick="history.back()" aria-label="Retour"><span class="ic">'+icon('chevron')+'</span></button>'+
      '<h1>'+esc(d.label)+'</h1><span class="count">'+dems.length+'</span></div>'+
      rail(key)+
      '<div class="cards" style="display:flex;flex-direction:column">'+dems.map(t=>{
        const n=items.filter(p=>p.demarche===t).length;
        return '<div class="fcard" role="button" tabindex="0" onclick="setFilt(\'dem\',\''+esc(t).replace(/'/g,"\\'")+'\')">'+
          '<span class="fpi" style="color:'+dc('demarches')+'"><span class="ic">'+icon('demarche')+'</span></span>'+
          '<span class="tx"><b>'+esc(t)+'</b><small>'+n+' organisme'+(n>1?'s':'')+'</small></span>'+
          '<span style="font-size:20px;font-weight:700;color:rgba(27,27,27,.4)">›</span></div>';
      }).join('')+
      (pp?'<div class="fcard" role="button" tabindex="0" onclick="go(\'#/f/'+pp.sid+'\')" style="background:#f5c542">'+
        '<span class="fpi" style="color:#1b1b1b"><span class="ic">'+icon('book')+'</span></span>'+
        '<span class="tx"><b>Nouveau ici ? Premiers pas</b><small>La formation qui explique comment tout se tient</small></span></div>':'')+
      '</div>';
  }
  if(d.isDem){
    const dems=DEMARCHES.filter(t=>DATA.some(p=>p.domaine===key&&p.demarche===t));
    chips+=chipRow('dem',dems,filt.dem,'Toutes');
    items=items.filter(p=>p.demarche===filt.dem);
  }
  if(d.isMail){
    chips+=chipRow('genre',['Mail','Note'],filt.genre,'Tous');
    if(filt.genre!=='Tous') items=items.filter(p=>p.genre===filt.genre);
    chips+=chipRow('famille',['Médical','Social'],filt.famille,'Toutes');
    if(filt.famille!=='Toutes') items=items.filter(p=>p.famille===filt.famille);
  }
  /* Règle d'or reprise de l'app principale : aucun bouton de tri ne mène à une page vide.
     Chaque rangée ne propose que ce qui existe compte tenu de l'autre. */
  const base=DATA.filter(p=>p.domaine===key && (!d.isDem||p.demarche===filt.dem));
  const parCommune=(filt.commune==='Toutes')?base:base.filter(p=>p.commune===filt.commune);
  const ordre=(TAGS_REGLES[key]||[]).map(r=>r[1]);
  let alltags=[...new Set(parCommune.flatMap(p=>p.tags))];
  alltags.sort((a,b)=>{const ia=ordre.indexOf(a),ib=ordre.indexOf(b);return ((ia<0?99:ia)-(ib<0?99:ib))||a.localeCompare(b,'fr')});
  if(alltags.length>1){
    chips+=chipRow('tag',alltags,filt.tag,'Tout');
    if(filt.tag!=='Tout') items=items.filter(p=>p.tags.includes(filt.tag));
  }
  if(d.byCommune){
    const parTag=(filt.tag==='Tout')?base:base.filter(p=>p.tags.includes(filt.tag));
    const coms=COMMUNES.filter(c=>parTag.some(p=>p.commune===c));
    if(coms.length>1) chips+=chipRow('commune',coms,filt.commune,'Toutes');
    if(filt.commune!=='Toutes') items=items.filter(p=>p.commune===filt.commune);
  }
  items=triProximite(items);
  /* Social : les 19 CPAS se replient derrière un seul bouton. */
  let grpHtml='';
  if(key==='social'){
    const cpas=items.filter(estCpas);
    if(cpas.length>3){ items=items.filter(p=>!estCpas(p)); grpHtml=grpCpas(cpas); }
  }
  return '<div class="subtop"><button class="cbtn" onclick="history.back()" aria-label="Retour"><span class="ic">'+icon('chevron')+'</span></button>'+
    '<h1>'+esc(d.label)+'</h1><span class="count">'+(items.length+ (grpHtml? '+' : ''))+' fiche'+(items.length>1?'s':'')+'</span></div>'+
    rail(key)+chips+
    '<div class="cards">'+(items.length||grpHtml?items.map(fcard).join('')+grpHtml:
      '<div class="empty"><span class="ic">'+icon('compass')+'</span><b>Rien avec ces filtres</b><p>Essaie d\'élargir la sélection.</p></div>')+
    '</div>';
}

let gPath=[];

  const g=GUIDES[gk];

  const n=g.nodes[id];
  let h='';
  if(n.q){

      n.opts.map(o=>'<button class="gopt" onclick="guideGo(\''+gk+'\',\''+o.go+'\')">'+esc(o.t)+'</button>').join('');

    h+='<div class="gres">'+esc(n.r)+'</div>';

}
function guideGo(gk,id){gPath.push(id);document.getElementById('gzone').innerHTML=guideNode(gk)}

/* ---------- urgences — les catégories de l'app principale : on sait où téléphoner ---------- */
let urgCat=null;
const URG_CATS=[
  {label:"Secours vital",     re:/112|^101|secours|police|pompier/i},
  {label:"Violences · femmes",re:/violence|viol|conjugal/i},
  {label:"Médical",           re:/garde m[ée]dicale|antipoison|1710|m[ée]dical|intoxication/i},
  {label:"Urgences hôpitaux", re:/h[oô]pital|urgences$/i},
  {label:"Hébergement d'urgence", re:/sans-abri|h[ée]bergement|asile de nuit|accueil d'urgence|orientation|maraude/i},
  {label:"Drogue & alcool",   re:/drogue|alcool|d[ée]pendance/i},
  {label:"Écoute & aide",     re:/[ée]coute|t[ée]l[ée]-accueil|107|soutien|suicide|enfant|jeune|103/i}
];
const URG_CATC={"Violences · femmes":"#fd8fd0","Médical":"#6cb392","Urgences hôpitaux":"#f3c6da","Hébergement d'urgence":"#b28b7a","Drogue & alcool":"#f5c542","Écoute & aide":"#f8763f","Autres":"#5b8fd4"};
const URG_CATK={"Écoute & aide":"coeur","Drogue & alcool":"addictions","Médical":"medical","Urgences hôpitaux":"medical","Hébergement d'urgence":"building","Autres":"phone"};
/* Le symbole femme (repris de l'app principale) pour Violences · femmes. */
const URG_FEMME='<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M12 2.4a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0 2.7a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/><rect x="10.7" y="13.2" width="2.6" height="8.4" rx="1.3"/><rect x="8" y="16.5" width="8" height="2.6" rx="1.3"/></svg>';
const URG_PLURIEL={"Hébergement d'urgence":"Hébergements d'urgence"};
function urgName(p){const n=p.nom.replace(/^\s*\d[\d\s]*[–—-]\s*/,'').replace(/\s*[–—-]\s*\d[\d\s]*$/,'').trim();return n||p.nom;}
function urgShort(p){let n=urgName(p).replace(/\s*\(.*?\)\s*/g,' ').replace(/\s*[–—-]\s.*$/,'');return n.trim()||urgName(p);}
function urgSub(p){const par=p.nom.match(/\(([^)]+)\)/);const t=par?par[1].trim():'';return t?t.charAt(0).toUpperCase()+t.slice(1):'';}
function urgSq(p){
  const tel=(p.tel||'').replace(/\s/g,'');
  const sub=urgSub(p)||esc(p.tel);
  const tx='<span class="urg-sq-tx"><b>'+esc(urgShort(p))+'</b>'+(sub?'<em>'+sub+'</em>':'')+'</span>';
  if(tel) return '<a class="urg-sq" href="tel:'+esc(tel)+'"><span class="ic">'+icon('phone')+'</span>'+tx+'</a>';
  if(p.site) return '<a class="urg-sq" href="'+esc(urlHref(p.site))+'" target="_blank" rel="noopener"><span class="ic">'+icon('lien')+'</span>'+tx+'</a>';
  return '<div class="urg-sq" role="button" onclick="go(\'#/f/'+p.sid+'\')"><span class="ic">'+icon('note')+'</span>'+tx+'</div>';
}
function urgencesListHTML(){
  const items=DATA.filter(p=>p.domaine==='urgences' || p.urgent);
  const buckets=URG_CATS.map(c=>({label:c.label,list:[]}));
  const used=new Set();
  items.forEach(p=>{
    const hay=p.nom+' '+(p.desc||'');
    for(let i=0;i<URG_CATS.length;i++){ if(URG_CATS[i].re.test(hay)){ buckets[i].list.push(p); used.add(p); break; } }
  });
  const autres=items.filter(p=>!used.has(p));
  if(autres.length) buckets.push({label:"Autres",list:autres});
  const nonEmpty=buckets.filter(b=>b.list.length);
  return nonEmpty.map((b,idx)=>{
    if(b.label==="Secours vital"){
      const halves=b.list.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(p=>{
        const tel=(p.tel||'').replace(/\s/g,'');
        return '<a class="urg-vhalf" href="tel:'+esc(tel)+'"><span class="ic">'+icon('phone')+'</span><b>'+esc(urgShort(p))+'</b><em>'+esc(p.tel)+'</em></a>';
      }).join('');
      return '<div class="urg-vital">'+halves+'</div>';
    }
    const open=urgCat===idx;
    const sqs='<div class="urg-slider">'+b.list.slice().sort((a,b)=>a.nom.localeCompare(b.nom,'fr')).map(urgSq).join('')+'</div>';
    const cc=URG_CATC[b.label]||'#f5c542';
    return '<button class="urg-catbtn '+(open?'open':'')+'" style="background:'+cc+'" onclick="toggleUrgCat(this,'+idx+')">'+
      '<span class="urg-cbleft"><span class="urg-cbic"><span class="ic">'+(b.label==='Violences · femmes'?URG_FEMME:icon(URG_CATK[b.label]||'phone'))+'</span></span>'+
      '<span class="urg-cblab">'+esc(b.list.length>1&&URG_PLURIEL[b.label]?URG_PLURIEL[b.label]:b.label)+'</span></span>'+
      '<span class="urg-cbright"><span class="urg-cbn">'+b.list.length+'</span><span class="urg-cbsign"></span></span>'+
    '</button><div class="urg-acc '+(open?'open':'')+'"><div class="urg-acc-inner">'+sqs+'</div></div>';
  }).join('');
}
function setAcc(acc,open){const inner=acc.querySelector('.urg-acc-inner');acc.style.height=open?inner.scrollHeight+'px':'0px';}
function toggleUrgCat(btn,i){
  const willOpen=urgCat!==i; urgCat=willOpen?i:null;
  const cur=document.querySelector('.urg-catbtn.open');
  if(cur&&cur!==btn){cur.classList.remove('open');const a=cur.nextElementSibling;if(a&&a.classList.contains('urg-acc')){a.classList.remove('open');setAcc(a,false);}}
  btn.classList.toggle('open',willOpen);
  const acc=btn.nextElementSibling;
  if(acc&&acc.classList.contains('urg-acc')){acc.classList.toggle('open',willOpen);setAcc(acc,willOpen);}
}
function vUrgences(){
  urgCat=null;
  return '<div class="subtop"><h1 style="font-size:23px;padding-top:6px;color:var(--danger)">Urgences</h1></div>'+
    '<p class="hint" style="margin-bottom:14px">Un doute ? On appelle. Personne ne reprochera un appel de trop.</p>'+

}

  if(!Q){
    return top+'<div class="gres" style="text-align:center"><b style="font-size:22px">'+QZ.score+' / '+QZ.qs.length+'</b><br>'+
      (QZ.score>=QZ.qs.length*0.8?'Impressionnant. Le réseau n\'a plus de secrets.':'Chaque question corrigée, c\'est une fiche de mieux dans la tête.')+'</div>'+
      '<button class="gopt" onclick="quizStart(\''+QZ.theme+'\')">Rejouer ce thème</button>'+
      '<button class="gopt" onclick="quizTheme()">Changer de thème</button><div style="height:20px"></div>';
  }
  let h=top+'<div class="gq" style="margin-top:10px">'+esc(Q.q)+'</div>';
  h+=Q.opts.map((o,i)=>{
    let cls='gopt'; let st='';
    if(QZ.answered){ if(i===Q.correct){cls+=' qok';} else if(i===QZ.picked){cls+=' qko';} }
    return '<button class="'+cls+'" '+st+' onclick="quizAnswer('+i+')">'+esc(o)+'</button>';
  }).join('');
  if(QZ.answered){
    const p=Q.src?DATA.find(x=>x.id===Q.src):null;
    h+='<div class="bloc" style="margin-top:14px"><b>'+(QZ.picked===Q.correct?'Bien vu !':'La bonne réponse')+'</b>'+
      '<p>'+esc(Q.opts[Q.correct])+(Q.exp?'\n\n'+esc(Q.exp):'')+'</p>'+
      (p?'<button class="glink" style="margin-top:8px" onclick="quizFiche(\''+Q.src+'\')">Voir la fiche →</button>':'')+'</div>'+
      '<button class="btn-main" style="background:#f5c542;width:100%;justify-content:center;margin-top:4px" onclick="quizNext()">Question suivante</button>';
  }
  return h+'<div style="height:30px"></div>';
}

/* ---------- Sorties & quartier — gratuit, Article 27, autour du centre, se mobiliser ---------- */
let A27=null;
function a27T(i){A27=(A27===i)?null:i;render();}
function vSorties(){
  const fmt=d=>JOURS_L[d.getDay()].charAt(0).toUpperCase()+JOURS_L[d.getDay()].slice(1)+' '+d.getDate()+' '+MOIS_L[d.getMonth()];
  const prochains=agendaProchains(15,function(){return true;}).slice(0,14);
  let h='<div class="subtop"><button class="cbtn" onclick="history.back()" aria-label="Retour"><span class="ic">'+icon('chevron')+'</span></button><h1>Sorties & quartier</h1></div>';
  h+='<div class="ghead" style="margin-top:6px">Gratuit, ces prochains jours</div>';
  h+=prochains.map(x=>'<div class="bloc" style="border-left:6px solid '+x.r.c+'">'+
    '<b style="text-transform:none;letter-spacing:0">'+esc(x.r.titre)+'</b>'+
    '<p>'+esc(fmt(x.d))+' · '+esc(x.r.lieu)+(x.r.sous?'\n'+esc(x.r.sous):'')+'</p>'+
    (x.r.adr?'<a class="glink" href="'+itiHref(x.r.adr)+'" target="_blank" rel="noopener">Itinéraire →</a>':'')+
  '</div>').join('');
  h+='<div class="ghead">Article 27 — spectacles à 1,25 €</div>'+
    '<p class="hint" style="margin-bottom:10px">Théâtre, cinéma, concerts avec un ticket Article 27. Commune par commune :</p>';
  h+=ART27_LIEUX.map((c,i)=>{
    const open=A27===i;
    return '<button class="gopt" style="display:flex;justify-content:space-between;align-items:center" onclick="a27T('+i+')"><span>'+esc(c.commune)+'</span><span style="opacity:.5">'+c.lieux.length+(open?' −':' +')+'</span></button>'+
      (open?'<div class="bloc">'+c.lieux.map(l=>'<p style="margin-bottom:6px"><b style="text-transform:none;letter-spacing:0">'+esc(l.n)+'</b>'+(l.tel?' · <a class="glink" href="tel:'+esc(l.tel.replace(/[^+0-9]/g,''))+'">'+esc(l.tel)+'</a>':'')+'</p>').join('')+'</div>':'');
  }).join('');
  h+='<div class="ghead">Autour d\'ici</div>'+
    '<p class="hint" style="margin-bottom:10px">Le quartier, depuis le centre (Bd Prince de Liège 38).</p>';
  h+=QUARTIER.map(g=>'<div class="bloc"><b>'+esc(g.grp)+'</b>'+
    g.lignes.map(l=>'<p style="margin-bottom:6px"><b style="text-transform:none;letter-spacing:0">'+esc(l.t)+'</b> — '+esc(l.d)+
      (l.adr?' <a class="glink" href="'+itiHref(l.adr)+'" target="_blank" rel="noopener">Itinéraire →</a>':'')+'</p>').join('')+'</div>').join('');
  h+='<div class="ghead">Se mobiliser</div>';
  h+=PETITIONS.map(pt=>'<div class="bloc"><b style="text-transform:none;letter-spacing:0">'+esc(pt.titre)+'</b>'+
    '<p>'+esc(pt.sous)+'\n'+esc(pt.desc)+'</p>'+
    '<a class="glink" href="'+esc(pt.url)+'" target="_blank" rel="noopener">Signer la pétition →</a></div>').join('');
  return h+'<div style="height:26px"></div>';
}

/* ---------- barre d'onglets ---------- */
function renderTabs(){
  const v=current.view;
  const isTool=v==='domaine'&&(DOM[current.key].method||DOM[current.key].isFormation||DOM[current.key].isMail);
  const T=[['#/','Réseau','compass','#f3c6da',(v==='home'||v==='quiz'||v==='sorties'||(v==='domaine'&&!isTool))],
           ['#/centre','Centre','centre','#f8763f',(v==='centre'||isTool||v==='admin')],
           ['#/favoris','Favoris','star','#f5c542',v==='favoris'],
           ['#/urgences','Urgences','siren','#e63329',v==='urgences']];
  document.getElementById('tabbar').innerHTML=T.map(t=>
    '<button class="'+(t[4]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+
    '<span class="db" style="'+(t[4]?('background:'+t[3]+';color:#1b1b1b'):('color:'+t[3]))+'">'+
    '<span class="ic">'+icon(t[2])+'</span></span>'+
    '<span class="lbl">'+t[1]+'</span></button>').join('');
}

/* ---------- démarrage ---------- */
current=parseRoute();
render();
</script>
