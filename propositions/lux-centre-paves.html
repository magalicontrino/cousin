<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les pavés du Centre — quatre mélanges</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 14px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.mono .n{color:rgba(27,27,27,.55);margin-left:6px;letter-spacing:.1em;font-weight:500}
.stitre{font-size:15px;font-weight:800;text-transform:uppercase;margin:0 0 8px}

.g{display:grid;grid-template-columns:1fr 1fr}
.w{grid-column:1/-1}
.c{min-height:96px;display:flex;flex-direction:column;text-align:left;padding:11px 12px}
.c .pi{margin:auto 0 0 auto;width:34px;height:34px}

.v1 .g{border:1px solid #c9c4b8;gap:0}
.v1 .c{border-right:1px solid #f0efed;border-bottom:1px solid #f0efed}
.v1 .c:nth-child(2n+1){border-right:0}
.v1 .c.w{border-right:0}

.v2 .g{gap:10px}
.v2 .c{border-radius:14px;min-height:104px}
.v2 .c b{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}

.v3 .g{border:1px solid #c9c4b8;gap:0;background:#f4f3f0}
.v3 .c{border-right:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8}
.v3 .c:nth-child(2n+1){border-right:0}
.v3 .c.w{border-right:0}
.v3 .bloc{margin:auto 0 0 auto;width:52px;height:52px;display:flex;align-items:center;justify-content:center}

.v4 .g{border:1px solid #c9c4b8;gap:0;background:#f4f3f0}
.v4 .c{padding:0;border-right:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8}
.v4 .c:nth-child(2n+1){border-right:0}
.v4 .c.w{border-right:0}
.v4 .haut{padding:9px 12px}
.v4 .bas{flex:1;display:flex;align-items:center;justify-content:center;padding:14px 0 16px}
.v4 .bas .pi{margin:0;width:36px;height:36px}
</style>
</head>
<body>
<div class="wrap">
<h1>Les pavés du Centre — quatre mélanges</h1>
<p class="intro">Le mélange demandé : les grandes couleurs de la première app + la grille et l'écriture machine du Lux. Réponds par un numéro.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||34)+'px;height:'+(s||34)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const T=[
 ['DÉMARCHES','','#b28b7a','ico-demarches.svg',1],
 ['CENTRE','5','#f8763f','centre.svg',0],
 ['PROTOCOLE','6','#fd8fd0','ico-cartes.svg',0],
 ['MAILS ET NOTES','17','#f5c542','ico-guillemets.svg',0],
 ['FORMATIONS','10','#6cb392','formations.svg',0]
];
function grille(caseHtml,cls){
  return '<div class="'+cls+'"><div class="stitre">Les outils</div><div class="g">'+T.map(caseHtml).join('')+'</div></div>';
}
const V=[
 ['1 · La couleur coule dans la grille',
  'Ta grille exacte — collée, angles droits, libellé machine + compte — mais chaque case est REMPLIE de sa couleur, et le picto noir descend en bas à droite comme dans la première app.',
  grille(t=>'<span class="c'+(t[4]?' w':'')+'" style="background:'+t[2]+'"><span class="mono" style="font-size:10.5px">'+t[0]+(t[1]?' <span class="n">'+t[1]+'</span>':'')+'</span><span class="pi">'+pico(t[3],'#1b1b1b',34)+'</span></span>','v1')],
 ['2 · Les cartes de la première app, rangées',
  'Le plus proche de la première app : cartes arrondies, couleurs pleines, nom en GRAS (pas machine), picto noir en bas à droite — mais rangées à la façon Lux, avec la carte Démarches en pleine largeur.',
  grille(t=>'<span class="c'+(t[4]?' w':'')+'" style="background:'+t[2]+'"><b>'+t[0]+'</b><span class="pi">'+pico(t[3],'#1b1b1b',34)+'</span></span>','v2')],
 ['3 · Le pavé de couleur dans la case',
  'La case reste crème au trait, sobre — mais le picto vit sur un GRAND carré de sa couleur, en bas à droite. La couleur de la première app, dosée façon grille.',
  grille(t=>'<span class="c'+(t[4]?' w':'')+'"><span class="mono" style="font-size:10.5px">'+t[0]+(t[1]?' <span class="n">'+t[1]+'</span>':'')+'</span><span class="bloc" style="background:'+t[2]+'">'+pico(t[3],'#1b1b1b',30)+'</span></span>','v3')],
 ['4 · Le bandeau coloré',
  'Chaque case garde son corps crème, mais son EN-TÊTE est une bande pleine de sa couleur qui porte le libellé machine + le compte. Le picto noir respire au centre, en dessous.',
  grille(t=>'<span class="c'+(t[4]?' w':'')+'"><span class="haut" style="background:'+t[2]+'"><span class="mono" style="font-size:10.5px">'+t[0]+(t[1]?' <span class="n">'+t[1]+'</span>':'')+'</span></span><span class="bas"><span class="pi">'+pico(t[3],'#1b1b1b',36)+'</span></span></span>','v4')]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone">'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
