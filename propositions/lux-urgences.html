<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urgences — quatre designs</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:18px 16px 20px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase}
.ht{font-size:24px;font-weight:800;text-transform:uppercase;color:#e63329;margin-bottom:12px}
.vital{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e63329;margin-bottom:12px}
.vhalf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:15px 8px;color:#f4f3f1;background:#e63329}
.vhalf:first-child{border-right:1px solid rgba(244,243,241,.4)}
.vhalf b{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em}
.vhalf em{font-style:normal;font-size:22px;font-weight:800}
.sq{width:38px;height:38px;background:#1b1b1b;color:#f4f3f1;display:flex;align-items:center;justify-content:center;flex:none}
.sq .pico,.sq svg{width:20px;height:20px}
.plus{width:30px;height:30px;background:#1b1b1b;color:#f4f3f1;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.cnt{min-width:24px;height:24px;padding:0 7px;background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Urgences — quatre designs</h1>
<p class="intro">Le bloc 101 · 112 reste partout. Ce qui change : la forme des six catégories. Réponds par un numéro (ou un mélange).</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgFemme=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||20)+'px;height:'+(s||20)+'px" fill="'+c+'"><path fill-rule="evenodd" d="M12 2.4a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zm0 2.7a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6z"/><rect x="10.7" y="13.2" width="2.6" height="8.4" rx="1.3"/><rect x="8" y="16.5" width="8" height="2.6" rx="1.3"/></svg>';
const svgCroix=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||20)+'px;height:'+(s||20)+'px" fill="'+c+'"><rect x="9.3" y="4" width="5.4" height="16" rx="2.4"/><rect x="4" y="9.3" width="16" height="5.4" rx="2.4"/></svg>';
const svgLit=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||20)+'px;height:'+(s||20)+'px" fill="'+c+'"><path d="M3 10.6V7.2a1.1 1.1 0 0 1 2.2 0v3.4h4.6V9.2a1.5 1.5 0 0 1 1.5-1.5h6.1A3.6 3.6 0 0 1 21 11.3v6a1.1 1.1 0 0 1-2.2 0V16H5.2v1.3a1.1 1.1 0 0 1-2.2 0z"/></svg>';
const CATS=[
 ['Violences · femmes','4','#fd8fd0',c=>svgFemme(c)],
 ['Médical','2','#6cb392',c=>svgCroix(c)],
 ['Urgences hôpitaux','7','#f3c6da',c=>svgCroix(c)],
 ['Hébergements d\'urgence','8','#b28b7a',c=>svgLit(c)],
 ['Drogue & alcool','2','#f5c542',c=>pico('addictions.svg',c,20)],
 ['Écoute & aide','4','#f8763f',c=>pico('coeur.svg',c,20)]
];
function vital(){return '<div class="vital"><span class="vhalf"><b>POLICE</b><em>101</em></span><span class="vhalf"><b>SECOURS</b><em>112</em></span></div>'}
function head(){return '<div class="ht">Urgences</div>'}

const V=[
 ['u1','1 — Les pavés, collés en pile','Tes pavés colorés actuels, mais collés les uns aux autres comme une grille (un trait crème entre eux), moins hauts. Plus compact, plus « bloc ».',
  ()=>head()+vital()+'<div style="display:flex;flex-direction:column;gap:2px">'+CATS.map(c=>
   '<div style="background:'+c[2]+';display:flex;align-items:center;gap:12px;padding:11px 13px">'+
   '<span class="sq">'+c[3]('#f4f3f1')+'</span>'+
   '<b style="flex:1;font-size:14.5px;text-transform:uppercase">'+c[0]+'</b>'+
   '<span class="cnt">'+c[1]+'</span><span class="plus">+</span></div>').join('')+'</div>'],
 ['u2','2 — La couleur en liséré','Fond clair encadré, mais un GROS liséré de couleur à gauche et le picto en couleur. Plus calme, la couleur reste le guide.',
  ()=>head()+vital()+'<div style="border:1px solid #d6d4d0;border-bottom:0">'+CATS.map(c=>
   '<div style="display:flex;align-items:center;gap:12px;padding:13px 13px;border-bottom:1px solid #d6d4d0;border-left:7px solid '+c[2]+'">'+
   c[3](c[2])+
   '<b style="flex:1;font-size:14.5px;text-transform:uppercase">'+c[0]+'</b>'+
   '<span class="mono" style="color:#6b6965">'+c[1]+'</span><span style="font-weight:800;font-size:17px">+</span></div>').join('')+'</div>'],
 ['u3','3 — Le damier','Les catégories en grille deux par deux, chaque case pleine de SA couleur, picto dans son carré noir, compte dans le coin. Très visuel, tout tient sans défiler.',
  ()=>head()+vital()+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px">'+CATS.map(c=>
   '<div style="background:'+c[2]+';min-height:104px;padding:11px;display:flex;flex-direction:column">'+
   '<div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="sq">'+c[3]('#f4f3f1')+'</span><span class="cnt">'+c[1]+'</span></div>'+
   '<b style="margin-top:auto;font-size:12.5px;text-transform:uppercase;line-height:1.2">'+c[0]+'</b></div>').join('')+'</div>'],
 ['u4','4 — Noir, picto en couleur','L\'inverse : les pavés en NOIR, le picto et le compte prennent la couleur de la catégorie. Sobre, très contrasté, la couleur guide sans crier.',
  ()=>head()+vital()+'<div style="display:flex;flex-direction:column;gap:9px">'+CATS.map(c=>
   '<div style="background:#1b1b1b;color:#f4f3f1;display:flex;align-items:center;gap:12px;padding:13px 14px">'+
   c[3](c[2])+
   '<b style="flex:1;font-size:14.5px;text-transform:uppercase">'+c[0]+'</b>'+
   '<span class="cnt" style="background:rgba(244,243,241,.18);color:'+c[2]+'">'+c[1]+'</span>'+
   '<span style="font-weight:800;font-size:17px;color:'+c[2]+'">+</span></div>').join('')+'</div>']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
