<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page domaine — quatre mises en page</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 16px 8px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:500;letter-spacing:.16em;text-transform:uppercase}

.cbtn{width:38px;height:38px;flex:none;background:transparent;border:1.5px solid #1b1b1b;
  display:flex;align-items:center;justify-content:center}
.cbtn.cr{border-color:#f2eee6;color:#f2eee6}
.ht{display:flex;align-items:center;gap:12px;padding:2px 0 10px}
.ht h2{font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.cnt{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:#6f6d68}

.rail{display:flex;gap:4px;overflow:hidden;border-bottom:1px solid #c9c4b8;margin:0 -16px;padding:0 12px}
.rail .it{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 12px 11px;color:#6f6d68;border-bottom:3px solid transparent;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.rail .it.on{color:#1b1b1b;border-bottom-color:#1b1b1b}

.railc{display:flex;overflow:hidden;margin:0 -16px;padding:0 12px 14px;gap:0;border:0}
.railc .it{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:11px 13px 12px;background:#f4f3f0;border:1px solid #c9c4b8;border-right:0;color:#1b1b1b;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.railc .it:last-child{border-right:1px solid #c9c4b8}
.railc .it.on{background:#1b1b1b;color:#f2eee6}

.noirband{background:#1b1b1b;color:#f2eee6;margin:-16px -16px 0;padding:14px 16px}
.noirband .ht{padding-bottom:0}
.noirband h2{color:#f2eee6}
.pastille{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;font-weight:600;
  padding:4px 9px;background:#5b8fd4;color:#1b1b1b}
.railp{display:flex;gap:6px;overflow:hidden;margin:0 -16px;padding:12px 12px 12px;border-bottom:1px solid #c9c4b8}
.railp .it{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.railp .it.on{background:#5b8fd4}

.bigpi{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center}

.rows{border-top:1px solid #c9c4b8;margin-top:0}
.row{display:flex;align-items:center;gap:14px;border-bottom:1px solid #c9c4b8;padding:14px 2px}
.row .rpi{width:26px;height:26px;flex:none;color:#1b1b1b}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.row .tx small{display:block;font-size:12.5px;color:#6f6d68;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{width:20px;height:20px;color:#b5b3ae;flex:none}
</style>
</head>
<body>
<div class="wrap">
<h1>La page d'un domaine — quatre mises en page</h1>
<p class="intro">Exemple : Accompagnement. Ce qui change : l'en-tête et le rail des domaines. La liste en registre reste la même. Réponds par un numéro (ou un mélange, genre « le 2 avec l'en-tête du 3 »).</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgCroix=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+c+'"><rect x="9.3" y="4" width="5.4" height="16" rx="2.4"/><rect x="4" y="9.3" width="16" height="5.4" rx="2.4"/></svg>';
const svgChev='<svg viewBox="0 0 24 24" style="width:14px;height:14px" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';
const svgStar='<svg viewBox="0 0 24 24" style="width:20px;height:20px" fill="currentColor"><path d="M12 2l2.4 5.9 6.3.4-4.9 4.1 1.6 6.2L12 15.2l-5.4 3.4 1.6-6.2-4.9-4.1 6.3-.4z"/></svg>';
const DOMS=[
 ['Démarches','demarches.svg','#b28b7a'],
 ['Médical','CROIX','#6cb392'],
 ['Social','social.svg','#f3c6da'],
 ['Accompagnement','accompagnement.svg','#5b8fd4'],
 ['Enfants','educatif.svg','#b28b7a'],
 ['Culture','fete.svg','#6cb392']
];
function dpic(d,c,s){return d[1]==='CROIX'?svgCroix(c||d[2],s):pico(d[1],c||d[2],s)}
function rail(cls,labels){
  return '<div class="'+cls+'">'+DOMS.map(d=>{
    const on=d[0]==='Accompagnement';
    return '<span class="it'+(on?' on':'')+'">'+dpic(d,(cls==='railc'&&on)?'#f2eee6':d[2])+(labels?'<span>'+d[0]+'</span>':'')+'</span>';
  }).join('')+'</div>';
}
function railPictos(){
  return '<div class="railp">'+DOMS.map(d=>{
    const on=d[0]==='Accompagnement';
    return '<span class="it'+(on?' on':'')+'">'+dpic(d,on?'#1b1b1b':d[2],26)+'</span>';
  }).join('')+'</div>';
}
function fiche(){
  return '<div class="rows"><div class="row"><span class="rpi">'+pico('accompagnement.svg','#1b1b1b',26)+'</span>'+
    '<span class="tx"><b>Les Amis d\'Accompagner (ASBL)</b><small>Koekelberg · Personnes en difficulté ; travaille au…</small></span>'+
    '<span class="star">'+svgStar+'</span></div></div>';
}
const V=[
 ['1 · Souligné — l\'actuelle, resserrée',
  'Ce que tu as, avec la règle de la grille : le compte suit le titre sur la même ligne, comme « MÉDICAL 15 ». Le rail garde ses pictos couleur et son trait noir sous l\'actif.',
  '<div class="ht"><span class="cbtn">'+svgChev+'</span><h2>Accompagnement <span class="cnt" style="font-size:11px;margin-left:4px">1</span></h2></div>'+
  rail('rail',true)+fiche()],
 ['2 · Cases — le rail devient la grille',
  'Les domaines dans des petites cases au trait collées, comme la grille de l\'accueil. La case active s\'inverse en noir, picto crème. Le langage le plus cohérent avec le reste.',
  '<div class="ht"><span class="cbtn">'+svgChev+'</span><h2>Accompagnement <span class="cnt" style="font-size:11px;margin-left:4px">1</span></h2></div>'+
  rail('railc',true)+fiche()],
 ['3 · Bandeau noir — l\'en-tête s\'inverse',
  'Une bande noire pleine largeur : flèche crème, titre crème, compte dans une pastille à la couleur du domaine. Dessous, le rail en pictos seuls — l\'actif dans un rond de sa couleur, comme le dock.',
  '<div class="noirband"><div class="ht"><span class="cbtn cr">'+svgChev+'</span><h2 style="flex:1">Accompagnement</h2><span class="pastille">1 FICHE</span></div></div>'+
  railPictos()+fiche()],
 ['4 · Sans rail — toute la place à la liste',
  'On enlève le rail : quand on est dans un domaine, on y est. Grand picto du domaine à sa couleur, titre, compte. Pour changer de domaine : la flèche ou le bouton 9 points en haut. Les fiches respirent.',
  '<div class="ht" style="padding-bottom:14px"><span class="cbtn">'+svgChev+'</span><span class="bigpi">'+pico('accompagnement.svg','#5b8fd4',54)+'</span>'+
  '<span><h2>Accompagnement</h2><span class="cnt">1 FICHE</span></span></div>'+fiche()]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone">'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
