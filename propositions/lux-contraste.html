<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux — le contraste, trois nuances</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:460px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f2efe9;padding:18px 16px 20px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:#5a564e;line-height:1.5}

.home-title{font-family:'Eastman',sans-serif;font-size:40px;font-weight:800;text-transform:uppercase;
  color:#1b1b1b;letter-spacing:-.04em;line-height:.803em;margin:2px 0 18px;display:flex;flex-direction:column;gap:1px}
.home-title .tl{display:block}
.home-title .pico,.home-title .deco,.home-title .tdo{display:inline-block;vertical-align:baseline}
.tdo{position:relative;width:.66em;height:.66em;margin:0 .02em .025em .07em;display:inline-block}
.tdo::before{content:'';position:absolute;inset:0;background:#f8763f;
  -webkit-mask:url('picto/ico-donut.svg') center/contain no-repeat;mask:url('picto/ico-donut.svg') center/contain no-repeat}
.tdo::after{content:'';position:absolute;left:50%;top:50%;width:12%;height:12%;
  transform:translate(-50%,-50%);border-radius:50%;background:#1b1b1b}
.deco-disq{width:.55em;height:.55em;margin-left:.09em;margin-bottom:.10em;color:#6cb392}
.deco-arc{width:1.06em;height:.55em;margin-left:.11em;margin-bottom:.08em}
.deco-fleur{width:.82em;height:.82em;margin-left:.09em;margin-bottom:-.12em;color:#fd8fd0}
.sqbtn{display:inline-flex;align-items:center;justify-content:center;width:.9em;height:.9em;
  border:1.5px solid #1b1b1b;vertical-align:.02em;margin-left:.14em}
.sqbtn .pico,.sqbtn svg{width:.44em;height:.44em}

.urgbar{background:#1b1b1b;display:flex;align-items:center;gap:14px;padding:17px 18px;margin-bottom:16px}
.urgbar b{color:#f2eee6;font-size:17px;font-weight:800;letter-spacing:.02em;display:block}
.urgbar small{color:rgba(242,238,230,.85);font-size:13px}
.urgbar .chev{margin-left:auto;color:#f2eee6}

.g3{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #b9b3a6;border-left:1px solid #b9b3a6}
.c{border-right:1px solid #b9b3a6;border-bottom:1px solid #b9b3a6;min-height:150px;
  padding:13px 12px 15px;display:flex;flex-direction:column}
.c .pi{margin:auto auto 0;width:44px;height:44px}
.c .pi .pico,.c .pi svg{width:100%;height:100%}
.c.inv{background:#1b1b1b}
.c.inv .mono{color:#f2eee6}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
<h1>Le contraste — trois nuances</h1>
<p class="intro">Ta composition gardée : titre + petits carrés au trait, bandeau noir, grille encadrée à trois colonnes, gros pictos noirs. À chaque version, un seul léger changement.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgHouse=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+(c||'#1b1b1b')+'"><path d="M12 3 21.4 11.6v9.4H2.6v-9.4z"/></svg>';
const svgClip=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+(c||'#1b1b1b')+'"><rect x="2" y="2" width="9" height="9" rx="1.4"/><rect x="13" y="2" width="9" height="9" rx="1.4"/><rect x="2" y="13" width="9" height="9" rx="1.4"/><rect x="13" y="13" width="9" height="9" rx="1.4"/></svg>';
const svgFeed=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||18)+'px;height:'+(s||18)+'px" fill="'+(c||'#1b1b1b')+'"><path d="M3.4 9.5 17.4 4.1a1.1 1.1 0 0 1 1.5 1v13.8a1.1 1.1 0 0 1-1.5 1L3.4 14.5a1.1 1.1 0 0 1-.7-1v-3a1.1 1.1 0 0 1 .7-1z"/><path d="M6.6 15.5h3.7l.9 4.3a1.4 1.4 0 0 1-1.4 1.7H8.4a1.4 1.4 0 0 1-1.4-1.1z"/></svg>';
const arcSvg='<svg class="deco deco-arc" viewBox="0 0 60 31" fill="none"><path d="M2 30 A28 28 0 0 1 58 30" stroke="#e63329" stroke-width="4.6"/><path d="M6.6 30 A23.4 23.4 0 0 1 53.4 30" stroke="#f8763f" stroke-width="4.6"/><path d="M11.2 30 A18.8 18.8 0 0 1 48.8 30" stroke="#f5c542" stroke-width="4.6"/><path d="M15.8 30 A14.2 14.2 0 0 1 44.2 30" stroke="#6cb392" stroke-width="4.6"/><path d="M20.4 30 A9.6 9.6 0 0 1 39.6 30" stroke="#2f6fd0" stroke-width="4.6"/><path d="M25 30 A5 5 0 0 1 35 30" stroke="#a05fd0" stroke-width="4.6"/></svg>';
function titre(){
  return '<div class="home-title">'+
   '<span class="tl">Vous<span class="pico deco-disq" style="-webkit-mask-image:url(picto/ico-demidisques.svg);mask-image:url(picto/ico-demidisques.svg)"></span>'+arcSvg+'</span>'+
   '<span class="tl">Cherchez<span class="pico deco-fleur" style="-webkit-mask-image:url(picto/ico-fleur.svg);mask-image:url(picto/ico-fleur.svg)"></span></span>'+
   '<span class="tl">Qu<span class="tdo"></span>i&nbsp;?'+
     '<span class="sqbtn">'+svgFeed('#1b1b1b','.44em')+'</span>'+
     '<span class="sqbtn">'+pico('petition.svg','#1b1b1b','.42em')+'</span></span>'+
  '</div>';
}
function urgbar(){
  return '<div class="urgbar">'+pico('urgences.svg','#e63329',28)+
    '<span><b>URGENCES</b><small>101 · 112 · numéros d\'écoute</small></span><span class="chev">⌄</span></div>';
}
const T=[['ico-reseau.svg','Réseau','#f3c6da'],['ico-demarches.svg','Démarches','#b28b7a'],['formations.svg','Formations','#6cb392'],
         ['ico-guillemets.svg','Mail et note type','#f5c542'],['CLIP','Protocole','#fd8fd0'],['HOUSE','Gestion du centre','#f8763f']];
function ic(t,col,s){return t[0]==='HOUSE'?svgHouse(col,s):t[0]==='CLIP'?svgClip(col,s):pico(t[0],col,s)}
function grille(mode){
  return '<div class="g3">'+T.map((t,i)=>{
    if(mode==='inv' && i===0) return '<div class="c inv"><span class="mono">'+t[1]+'</span><span class="pi">'+ic(t,'#f2eee6',44)+'</span></div>';
    const lab = mode==='dot' ? '<span class="mono"><span class="dot" style="background:'+t[2]+'"></span>'+t[1]+'</span>'
                             : '<span class="mono">'+t[1]+'</span>';
    return '<div class="c">'+lab+'<span class="pi">'+ic(t,'#1b1b1b',44)+'</span></div>';
  }).join('')+'</div>';
}
const V=[
 ['c1','1 — Telle quelle, pictos centrés','Ta composition exacte : trois colonnes, gros pictos noirs posés au centre-bas, bandeau noir, carrés au trait à côté du titre.',
  ()=>titre()+urgbar()+grille('pur')],
 ['c2','2 — La pastille de couleur','Le seul changement : une petite pastille de la couleur du domaine devant chaque libellé. Le noir garde toute sa force, la couleur revient à petite dose.',
  ()=>titre()+urgbar()+grille('dot')],
 ['c3','3 — La case pressée s\'inverse','Le seul changement : quand on touche une case, elle s\'inverse — fond noir, picto crème (ici Réseau, figé pour montrer). Le contraste devient le geste.',
  ()=>titre()+urgbar()+grille('inv')]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
