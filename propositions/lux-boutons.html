<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuit pop — les 4 boutons principaux</title>
<style>
/* Page locale — rien en ligne. Base : Nuit pop (pavés noirs, pictos couleur).
   Quatre façons de traiter le dock Réseau · Centre · Favoris · Urgences.
   Sur chaque essai, « Réseau » est l'onglet ACTIF : c'est ça que je fais varier —
   comment on voit où on est, d'un seul coup d'œil. */
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-medium.woff2') format('woff2');font-weight:500;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-demibold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman Grotesque';src:url('font/eastman-grotesque-heavy.woff2') format('woff2');font-weight:900;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#f2eee6}
.scr{padding:18px 14px 0}
.head{font-family:'Eastman Grotesque','Eastman';font-weight:900;text-transform:uppercase;line-height:.95;font-size:26px;margin:2px 2px 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:#1b1b1b;border-radius:16px;padding:13px 13px 11px;min-height:104px;display:flex;flex-direction:column;color:#f2eee6}
.tile b{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1.15}
.tile small{font-size:11px;color:rgba(242,238,230,.55)}
.tile .pi{margin-top:auto;align-self:flex-end}

/* A — ronds de couleur, l'actif seul est allumé */
.da{display:flex;justify-content:space-around;padding:14px 8px 12px}
.da .it{display:flex;flex-direction:column;align-items:center;gap:5px}
.da .c{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:transparent;border:2px solid #1b1b1b;color:#1b1b1b}
.da .it.on .c{border:none}
.da .lbl{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#8a8378}
.da .it.on .lbl{color:#1b1b1b}

/* B — pilule noire flottante, l'actif a sa pastille */
.db2{display:flex;justify-content:center;padding:12px 0 14px}
.db2 .pill{display:flex;align-items:center;gap:10px;background:#1b1b1b;border-radius:999px;padding:10px 14px}
.db2 .s{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* C — barre noire pleine largeur */
.dc{background:#1b1b1b;display:flex;justify-content:space-around;padding:11px 8px 13px;margin:14px -14px 0}
.dc .it{display:flex;flex-direction:column;align-items:center;gap:4px}
.dc .s{width:40px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.dc .lbl{font-size:9.5px;font-weight:600;letter-spacing:.04em;color:rgba(242,238,230,.55)}
.dc .it.on .lbl{color:#f2eee6;font-weight:700}

/* D — ton dock : ronds noirs, l'actif s'inverse */
.dd{display:flex;justify-content:center;gap:12px;padding:14px 0 12px}
.dd .it{display:flex;flex-direction:column;align-items:center;gap:5px}
.dd .c{width:52px;height:52px;border-radius:50%;background:#1b1b1b;display:flex;align-items:center;justify-content:center}
.dd .lbl{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#8a8378}
.dd .it.on .lbl{color:#1b1b1b}
</style>
</head>
<body>
<div class="wrap">
<h1>Nuit pop — le dock : les deux finalistes</h1>
<p class="intro">Le mélange et ton dock D, côte à côte. <b>Réseau est l'écran actif</b> sur les deux aperçus.</p>
<div id="zones"></div>
</div>
<script>
const K={reseau:'#f3c6da',mails:'#f5c542',centre:'#f8763f',urg:'#e63329',creme:'#f2eee6',noir:'#1b1b1b'};
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgHouse=c=>'<svg viewBox="0 0 24 24" style="width:22px;height:22px" fill="'+c+'"><path d="M12 3 21.4 11.6v9.4H2.6v-9.4z"/></svg>';
const IT=[['ico-reseau.svg','Réseau',K.reseau],['HOUSE','Centre',K.centre],['ico-etoile.svg','Favoris',K.mails],['urgences.svg','Urgences',K.urg]];
function ic(it,color){return it[0]==='HOUSE'?svgHouse(color):pico(it[0],color,22)}

function screenTop(){
 return '<div class="head">Vous cherchez quoi&nbsp;?</div><div class="grid">'+
  '<div class="tile"><b>Réseau</b><small>182 fiches</small><span class="pi">'+pico('ico-reseau.svg',K.reseau,30)+'</span></div>'+
  '<div class="tile"><b>Démarches</b><small>15 fiches</small><span class="pi">'+pico('ico-demarches.svg','#b28b7a',30)+'</span></div>'+
 '</div>';
}
/* A : cercles cerclés, l'actif se remplit de SA couleur */
function dA(){
 return '<div class="da">'+IT.map((it,i)=>{
  const on=i===0, urgent=it[1]==='Urgences';
  const bg=on?('style="background:'+it[2]+'"'):(urgent?'style="border-color:'+K.urg+';color:'+K.urg+'"':'');
  return '<span class="it'+(on?' on':'')+'"><span class="c" '+bg+'>'+ic(it,on?'#1b1b1b':(urgent?K.urg:'#1b1b1b'))+'</span><span class="lbl">'+it[1]+'</span></span>';
 }).join('')+'</div>';
}
/* B : pilule flottante, l'actif a sa pastille de couleur */
function dB(){
 return '<div class="db2"><span class="pill">'+IT.map((it,i)=>{
  const on=i===0;
  return '<span class="s" style="background:'+(on?it[2]:'transparent')+'">'+ic(it,on?'#1b1b1b':it[2])+'</span>';
 }).join('')+'</span></div>';
}
/* C : barre noire pleine, l'actif = petite pilule de couleur + libellé net */
function dC(){
 return '<div class="dc">'+IT.map((it,i)=>{
  const on=i===0;
  return '<span class="it'+(on?' on':'')+'"><span class="s" style="background:'+(on?it[2]:'transparent')+'">'+ic(it,on?'#1b1b1b':it[2])+'</span><span class="lbl">'+it[1]+'</span></span>';
 }).join('')+'</div>';
}
/* D : ton dock (ronds noirs, picto couleur), l'actif s'inverse */
function dD(){
 return '<div class="dd">'+IT.map((it,i)=>{
  const on=i===0;
  return '<span class="it'+(on?' on':'')+'"><span class="c" style="background:'+(on?it[2]:'#1b1b1b')+'">'+ic(it,on?'#1b1b1b':it[2])+'</span><span class="lbl">'+it[1]+'</span></span>';
 }).join('')+'</div>';
}
/* E : le mélange A + D — cercles au trait, pictos couleur, l'actif se remplit */
function dE(){
 return '<div class="da">'+IT.map((it,i)=>{
  const on=i===0;
  return '<span class="it'+(on?' on':'')+'"><span class="c" style="'+(on?('background:'+it[2]+';border:none'):('border-color:#1b1b1b'))+'">'+
    ic(it,on?'#1b1b1b':it[2])+'</span><span class="lbl">'+it[1]+'</span></span>';
 }).join('')+'</div>';
}
const V=[
 ['E','Le mélange A + D','Cercles au trait, pictos en couleur au repos ; l’écran actif se remplit de sa couleur, picto noir. Plus léger face aux pavés noirs.',dE],
 ['D','D — Ton dock','Tes ronds noirs à pictos couleur, tels quels. L’écran actif s’inverse : fond de sa couleur, picto noir. Le plus fidèle à ton app.',dD]
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="b'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone"><div class="scr">'+screenTop()+'</div>'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
