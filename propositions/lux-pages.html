<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lux grille — toutes les pages</title>
<style>
/* Page locale — rien en ligne. Le style « grille noire » (choix 1) décliné sur toutes
   les pages. Le titre reste l'original exact. */
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-medium.woff2') format('woff2');font-weight:500;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-demibold.woff2') format('woff2');font-weight:600;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f2efe9;padding-top:16px}
.pad{padding:0 16px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;color:#5a564e}
.monoS{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#8a857a}
.secth{display:flex;align-items:center;gap:9px;font-weight:800;font-size:14px;letter-spacing:.05em;
  text-transform:uppercase;padding:16px 16px 10px}
.secth .pico,.secth svg{flex:none}
.dayh{padding:12px 16px 6px;font-weight:800;font-size:14px;text-transform:uppercase}
.dayh.auj{color:#e63329}

/* le titre : l'original exact */
.home-title{font-family:'Eastman',sans-serif;font-size:min(11.8vw,44px);font-weight:800;text-transform:uppercase;
  text-align:left;color:#1b1b1b;letter-spacing:-.04em;line-height:.803em;margin:2px 2px 18px;
  display:flex;flex-direction:column;gap:1px}
.home-title .tl{display:block}
.home-title .pico,.home-title .deco,.home-title .tdo{display:inline-block;vertical-align:baseline}
.tdo{position:relative;width:.66em;height:.66em;margin:0 .02em .025em .07em;display:inline-block}
.tdo::before{content:'';position:absolute;inset:0;background:#f8763f;
  -webkit-mask:url('picto/ico-donut.svg') center/contain no-repeat;mask:url('picto/ico-donut.svg') center/contain no-repeat}
.tdo::after{content:'';position:absolute;left:50%;top:50%;width:12%;height:12%;
  transform:translate(-50%,-50%);border-radius:50%;background:#1b1b1b}
.deco-disq{width:.55em;height:.55em;margin-left:.09em;margin-bottom:.10em;color:#6cb392}
.deco-arc{width:1.06em;height:.55em;margin-left:.11em;margin-bottom:.08em}
.deco-fleur{width:.82em;height:.82em;margin-left:.09em;margin-bottom:-.12em;color:#fd8fd0}

/* la grille */
.tgrid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #c9c4b8;border-left:1px solid #c9c4b8;margin:0 16px 16px}
.cell{border-bottom:1px solid #c9c4b8;border-right:1px solid #c9c4b8;
  min-height:118px;padding:13px 13px 11px;display:flex;flex-direction:column}
.cell .pi{margin-top:auto;align-self:flex-end;width:38px;height:38px}
.cell .pi .pico,.cell .pi svg{width:100%;height:100%}
.cellw{grid-column:1 / -1}
.rowfull{border-bottom:1px solid #c9c4b8;border-right:1px solid #c9c4b8;padding:14px 16px;display:flex;align-items:center;gap:13px}
.rowfull .pico,.rowfull svg{flex:none}
.urgband{background:#e63329;border-bottom:0}
.urgband .mono{color:#f2eee6}

/* rangées de liste (fiches) */
.lrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid #c9c4b8}
.lrow .lpi{width:26px;height:26px;flex:none}
.lrow .lpi .pico{width:100%;height:100%}
.lrow .tx{flex:1;min-width:0}
.lrow .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.lrow .tx small{display:block;font-size:12.5px;color:#6b655a;margin-top:1px}
.lrow .st{width:18px;height:18px;color:#b7b1a4;flex:none}

/* chips au trait */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:8px 13px;border:1px solid #1b1b1b;color:#1b1b1b;background:transparent}
.chip.on{background:#1b1b1b;color:#f2eee6}

/* dock : les ronds noirs gardés */
.dock{display:flex;justify-content:center;gap:14px;padding:14px 0 16px}
.dock .db{width:50px;height:50px;border-radius:50%;background:#1b1b1b;display:flex;align-items:center;justify-content:center;position:relative}
.dock .db .pico,.dock .db svg{width:21px;height:21px}
.dock .db.on{background:#f3c6da}
.dock .db.on .pico,.dock .db.on svg{color:#1b1b1b!important}

/* barre haute des sous-pages */
.stop{display:flex;align-items:center;gap:12px;padding:4px 16px 12px}
.stop .back{width:36px;height:36px;border:1px solid #1b1b1b;display:flex;align-items:center;justify-content:center}
.stop .back .pico{width:13px;height:13px}
.stop h2{font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;flex:1}
.stop .n{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.15em;color:#6b655a}

/* fiche */
.fhead{border-top:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8;padding:18px 16px;display:flex;gap:14px;align-items:flex-start}
.fhead .tx{flex:1;min-width:0}
.fhead h3{font-size:21px;font-weight:800;line-height:1.15;margin-bottom:8px}
.fhead .pi{width:54px;height:54px;flex:none}
.fhead .pi .pico{width:100%;height:100%}
.frow{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid #c9c4b8;align-items:flex-start}
.frow .pico{flex:none;margin-top:2px}
.frow b{display:block;font-size:14px;font-weight:700}
.frow span{display:block;font-size:14px;color:#6b655a}
.fcta{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid #1b1b1b;background:#f2efe9}
.fcta .info{flex:1}
.fcta .info b{font-size:15px;font-weight:800}
.fcta .info small{display:block;font-size:12px;color:#6b655a}
.fcta .btn{background:#1b1b1b;color:#f2eee6;font-weight:800;font-size:14px;padding:13px 22px;text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div class="wrap">
<h1>La grille noire — toutes les pages</h1>
<p class="intro">Le choix 1 décliné partout. Ton titre est l'original exact. Regarde page par page et dis-moi ce qui cloche ou ce qui te plaît.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgHouse=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+(c||'#1b1b1b')+'"><path d="M12 3 21.4 11.6v9.4H2.6v-9.4z"/></svg>';
const svgClip=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+(c||'#1b1b1b')+'"><rect x="2" y="2" width="9" height="9" rx="1.4"/><rect x="13" y="2" width="9" height="9" rx="1.4"/><rect x="2" y="13" width="9" height="9" rx="1.4"/><rect x="13" y="13" width="9" height="9" rx="1.4"/></svg>';
const svgFeed=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||21)+'px;height:'+(s||21)+'px" fill="'+(c||'#1b1b1b')+'"><path d="M3.4 9.5 17.4 4.1a1.1 1.1 0 0 1 1.5 1v13.8a1.1 1.1 0 0 1-1.5 1L3.4 14.5a1.1 1.1 0 0 1-.7-1v-3a1.1 1.1 0 0 1 .7-1z"/><path d="M6.6 15.5h3.7l.9 4.3a1.4 1.4 0 0 1-1.4 1.7H8.4a1.4 1.4 0 0 1-1.4-1.1z"/></svg>';
const arcSvg='<svg class="deco deco-arc" viewBox="0 0 60 31" fill="none"><path d="M2 30 A28 28 0 0 1 58 30" stroke="#e63329" stroke-width="4.6"/><path d="M6.6 30 A23.4 23.4 0 0 1 53.4 30" stroke="#f8763f" stroke-width="4.6"/><path d="M11.2 30 A18.8 18.8 0 0 1 48.8 30" stroke="#f5c542" stroke-width="4.6"/><path d="M15.8 30 A14.2 14.2 0 0 1 44.2 30" stroke="#6cb392" stroke-width="4.6"/><path d="M20.4 30 A9.6 9.6 0 0 1 39.6 30" stroke="#2f6fd0" stroke-width="4.6"/><path d="M25 30 A5 5 0 0 1 35 30" stroke="#a05fd0" stroke-width="4.6"/></svg>';
function titre(){
  return '<div class="pad"><div style="font-family:Eastman;font-weight:800;font-size:15px;letter-spacing:.02em;margin-bottom:12px">COUSIN</div>'+
  '<div class="home-title">'+
   '<span class="tl">Vous<span class="pico deco-disq" style="-webkit-mask-image:url(picto/ico-demidisques.svg);mask-image:url(picto/ico-demidisques.svg)"></span>'+arcSvg+'</span>'+
   '<span class="tl">Cherchez<span class="pico deco-fleur" style="-webkit-mask-image:url(picto/ico-fleur.svg);mask-image:url(picto/ico-fleur.svg)"></span></span>'+
   '<span class="tl">Qu<span class="tdo"></span>i&nbsp;?</span>'+
  '</div></div>';
}
function dock(actif){
  const items=[[pico('ico-reseau.svg','#f3c6da',21),'r'],[svgHouse('#f8763f',21),'c'],[svgFeed('#f5c542',21),'n'],[pico('urgences.svg','#e63329',21),'u']];
  return '<div class="dock">'+items.map(x=>'<span class="db'+(x[1]===actif?' on':'')+'">'+x[0]+'</span>').join('')+'</div>';
}
const V=[];

/* ---- 1. ACCUEIL ---- */
V.push(['p1','Accueil',
 'Ton titre intact. Puis tout en grille : les urgences en rouge, le quotidien en rangées fines, la grande case Démarches, le réseau en cases. L\'étoile des favoris en case au trait, en haut à droite.',
 ()=>titre()+
 '<div class="tgrid">'+
  '<div class="cell cellw" style="min-height:0;background:#1b1b1b;flex-direction:row;align-items:center;gap:13px;padding:15px 16px">'+pico('urgences.svg','#e63329',26)+'<span style="flex:1"><b style="color:#f2eee6;font-size:16px;font-weight:800;letter-spacing:.02em">URGENCES</b><br><span style="color:rgba(242,238,230,.8);font-size:12.5px">101 · 112 · numéros d\'écoute</span></span><span style="color:#f2eee6;opacity:.7">⌄</span></div>'+
  '<div class="rowfull">'+pico('linge.svg','#1b1b1b',22)+'<span class="monoS">Linge — 2e étage · 201 → 222</span></div>'+
  '<div class="rowfull">'+pico('notif-poubelle.svg','#1b1b1b',22)+'<span class="monoS" style="color:#e63329">Poubelles — vendredi · 3 noires</span></div>'+
  '<div class="cell cellw" style="min-height:96px"><span class="mono">Démarches</span><span class="pi" style="width:34px;height:34px">'+pico('ico-demarches.svg','#1b1b1b',34)+'</span></div>'+
  '<div class="cell"><span class="mono">Médical</span><span class="pi">'+pico('medical.svg','#1b1b1b',38)+'</span></div>'+
  '<div class="cell"><span class="mono">Social</span><span class="pi">'+pico('social.svg','#1b1b1b',38)+'</span></div>'+
  '<div class="cell"><span class="mono">Hébergement</span><span class="pi">'+pico('hebergement.svg','#1b1b1b',38)+'</span></div>'+
  '<div class="cell"><span class="mono">Addictions</span><span class="pi">'+pico('addictions.svg','#1b1b1b',38)+'</span></div>'+
 '</div>'+dock('r')]);

/* ---- 2. UN DOMAINE (liste de fiches) ---- */
V.push(['p2','Un domaine — Hébergement',
 'Fini les cartes : des rangées fines, comme un registre. Les étiquettes deviennent des cases au trait (la choisie s\'inverse). L\'étoile de chaque fiche au bout de la ligne.',
 ()=>'<div class="stop"><span class="back">'+pico('chevron.svg','#1b1b1b',13)+'</span><h2>Hébergement</h2><span class="n">27 fiches</span></div>'+
 '<div class="chips"><span class="chip on">Tout</span><span class="chip">Places libres</span><span class="chip">Femmes</span><span class="chip">Couples</span></div>'+
 '<div style="border-top:1px solid #c9c4b8">'+
 [['Centre Ariane','Forest · Mixte · adultes'],['Pierre d\'Angle','Bruxelles-Ville · Mixte'],['Le Foyer — Armée du Salut','Bruxelles-Ville · Mixte'],['CAW Archipel','Adultes vulnérables'],['Albatros','Hommes · Femmes · Familles']].map(x=>
  '<div class="lrow"><span class="lpi">'+pico('hebergement.svg','#1b1b1b',26)+'</span><span class="tx"><b>'+x[0]+'</b><small>'+x[1]+'</small></span><span class="st">'+pico('favoris.svg','#b7b1a4',18)+'</span></div>').join('')+
 '</div>'+dock('r')]);

/* ---- 3. UNE FICHE ---- */
V.push(['p3','Une fiche — avec couleur',
 'Le picto passe à la couleur du domaine, les liens aussi, et le bouton d\'appel prend la couleur — le reste garde le calme du registre.',
 ()=>'<div class="stop"><span class="back">'+pico('chevron.svg','#1b1b1b',13)+'</span><span style="flex:1"></span><span class="back">'+pico('favoris.svg','#1b1b1b',15)+'</span></div>'+
 '<div class="fhead"><span class="tx"><h3>Médecins du Monde — CASO Bruxelles</h3>'+
  '<span class="monoS">Bruxelles-Ville · Sans mutuelle / sans-papiers</span></span>'+
  '<span class="pi">'+pico('medical.svg','#6cb392',54)+'</span></div>'+
 '<div style="padding:14px 16px;font-size:14.5px;border-bottom:1px solid #c9c4b8">Consultations pour personnes sans couverture santé.</div>'+
 '<div class="frow">'+pico('telephone.svg','#6cb392',20)+'<span style="flex:1"><b>Téléphone</b><span>02 225 43 00</span></span></div>'+
 '<div class="frow">'+pico('adresse.svg','#6cb392',20)+'<span style="flex:1"><b>Adresse</b><span>Rue Botanique 75, 1210</span></span><span class="monoS" style="margin-top:6px;text-decoration:underline;color:#3e7d68">Itinéraire</span></div>'+
 '<div class="frow">'+pico('horaires.svg','#6cb392',20)+'<span style="flex:1"><b>Horaires</b><span>Lun–ven, 9 h – 17 h</span></span></div>'+
 '<div class="fcta"><span class="info"><b>02 225 43 00</b><small>Appeler maintenant</small></span><span class="btn" style="background:#6cb392;color:#1b1b1b">Appeler</span></div>']);

/* ---- 4. LE CENTRE ---- */
V.push(['p4','Le centre — plus clair',
 'Moins de concept : des titres de section francs, le quotidien en vraies phrases avec pictos couleur, l\'écriture machine gardée seulement pour les cases.',
 ()=>'<div class="stop"><h2>Le centre</h2></div>'+
 '<div class="secth">'+pico('linge.svg','#1b1b1b',17)+'Le quotidien</div>'+
 '<div style="border-top:1px solid #c9c4b8">'+
  '<div class="rowfull" style="padding:15px 16px">'+pico('linge.svg','#6cb392',26)+'<span style="flex:1"><b style="font-size:15px">Linge — aujourd\'hui le 2e étage</b><br><span style="color:#6b655a;font-size:13.5px">chambres 201 → 222 · demain : 4e et 5e étage</span></span><span style="opacity:.4">›</span></div>'+
  '<div class="rowfull" style="padding:15px 16px">'+pico('notif-poubelle.svg','#1b1b1b',26)+'<span style="flex:1"><b style="font-size:15px">Poubelles — vendredi matin</b><br><span style="color:#6b655a;font-size:13.5px">3 sacs noirs, devant la porte</span></span><span style="opacity:.4">›</span></div>'+
  '<div class="rowfull" style="padding:15px 16px">'+pico('colis.svg','#f5c542',26)+'<span style="flex:1"><b style="font-size:15px">Produits — samedi 5 septembre</b><br><span style="color:#6b655a;font-size:13.5px">tous les premiers samedis, à l\'accueil</span></span><span style="opacity:.4">›</span></div>'+
 '</div>'+
 '<div class="secth">'+svgClip('#1b1b1b',17)+'Les outils</div>'+
 '<div class="tgrid">'+
  '<div class="cell cellw" style="min-height:80px"><span class="mono">Démarches</span><span class="pi" style="width:32px;height:32px">'+pico('ico-demarches.svg','#1b1b1b',32)+'</span></div>'+
  '<div class="cell" style="min-height:96px"><span class="mono">Gestion du centre</span><span class="pi" style="width:32px;height:32px">'+svgHouse('#1b1b1b',32)+'</span></div>'+
  '<div class="cell" style="min-height:96px"><span class="mono">Protocole</span><span class="pi" style="width:32px;height:32px">'+svgClip('#1b1b1b',32)+'</span></div>'+
  '<div class="cell" style="min-height:96px"><span class="mono">Mail et note type</span><span class="pi" style="width:32px;height:32px">'+pico('ico-guillemets.svg','#1b1b1b',32)+'</span></div>'+
  '<div class="cell" style="min-height:96px"><span class="mono">Formations</span><span class="pi" style="width:32px;height:32px">'+pico('formations.svg','#1b1b1b',32)+'</span></div>'+
 '</div>'+
 '<div style="border-bottom:1px solid #c9c4b8" class="rowfull">'+pico('adresse.svg','#1b1b1b',20)+'<span style="flex:1"><b style="font-size:14.5px">Autour d\'ici</b><br><span style="color:#6b655a;font-size:13px">le quartier — la feuille à donner</span></span><span style="opacity:.4">›</span></div>'+
 '<div class="rowfull" style="border-bottom:1px solid #c9c4b8">'+pico('roue.svg','#1b1b1b',20)+'<span style="flex:1"><b style="font-size:14.5px">Admin</b></span><span class="monoS">Réservé</span></div>'+
 dock('c')]);

/* ---- 5. QUOI DE NEUF ---- */
const svgTicket=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||18)+'px;height:'+(s||18)+'px" fill="'+(c||'#1b1b1b')+'"><path fill-rule="evenodd" d="M3 5.4h18a1.4 1.4 0 0 1 1.4 1.4v3.1a2.5 2.5 0 0 0 0 5v3.1a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4v-3.1a2.5 2.5 0 0 0 0-5V6.8A1.4 1.4 0 0 1 3 5.4zm12.4 2.4v1.8h1.9V7.8zm0 3.3v1.8h1.9v-1.8zm0 3.3v1.8h1.9v-1.8z"/></svg>';
V.push(['p5','Quoi de neuf — plus lisible',
 'Le sigle ticket remplace le mot. Les jours deviennent de vrais titres (aujourd\'hui en rouge), chaque sortie une ligne propre. Article 27 garde ses rangées par commune.',
 ()=>'<div class="stop"><h2>Quoi de neuf</h2></div>'+
 '<div class="secth">'+svgTicket('#6cb392',19)+'Ces prochains jours</div>'+
 '<div style="border-top:1px solid #c9c4b8">'+
  '<div class="dayh auj">Aujourd\'hui — mercredi 5 août</div>'+
  '<div class="lrow" style="padding-top:8px"><span class="tx"><b>Cultureghem — jeux libres</b><small>Anderlecht · 12 h → 16 h · entrée libre</small></span><span class="monoS" style="text-decoration:underline">Itinéraire</span></div>'+
  '<div class="lrow"><span class="tx"><b>Musée BELvue — gratuit</b><small>Bruxelles-Ville · dès 14 h</small></span><span class="monoS" style="text-decoration:underline">Itinéraire</span></div>'+
  '<div class="dayh">Dimanche 9 août</div>'+
  '<div class="lrow" style="padding-top:8px"><span class="tx"><b>Musées gratuits — 1er dimanche</b><small>partout · sans ticket ni réservation</small></span></div>'+
 '</div>'+
 '<div class="secth">'+svgTicket('#f8763f',19)+'Article 27 — 1,25 €</div>'+
 '<div style="border-top:1px solid #c9c4b8">'+
  '<div class="rowfull"><span style="flex:1;font-size:14.5px;font-weight:700">1070 · Anderlecht</span><span class="monoS">4 lieux +</span></div>'+
  '<div class="rowfull"><span style="flex:1;font-size:14.5px;font-weight:700">1000 · Bruxelles</span><span class="monoS">32 lieux +</span></div>'+
 '</div>'+
