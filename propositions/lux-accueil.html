<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'accueil — quatre designs</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.variant{margin-bottom:34px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 16px 18px}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.monoS{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8b8984}
.ht{font-weight:800;text-transform:uppercase;letter-spacing:-.04em;line-height:.85;font-size:30px;margin-bottom:12px}
.tdo{display:inline-block;position:relative;width:.62em;height:.62em;margin:0 .02em 0 .05em;vertical-align:-.02em}
.tdo::before{content:'';position:absolute;inset:0;background:#f8763f;
  -webkit-mask:url('picto/ico-donut.svg') center/contain no-repeat;mask:url('picto/ico-donut.svg') center/contain no-repeat}
.tdo::after{content:'';position:absolute;left:50%;top:50%;width:12%;height:12%;transform:translate(-50%,-50%);border-radius:50%;background:#1b1b1b}
.urgb{background:#1b1b1b;display:flex;align-items:center;gap:12px;padding:14px 15px;margin-bottom:12px;color:#f4f3f1}
.urgb b{font-size:15px;font-weight:800;text-transform:uppercase;display:block}
.urgb small{font-size:12px;color:rgba(244,243,241,.85)}
.tdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
</style>
</head>
<body>
<div class="wrap">
<h1>L'accueil — quatre designs</h1>
<p class="intro">Même contenu (urgences, linge/poubelles, le ticket, ma liste, démarches) — quatre façons de lui donner une vraie tête de porte d'entrée.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgTicket=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+c+'"><path fill-rule="evenodd" d="M3 5.4h18a1.4 1.4 0 0 1 1.4 1.4v3.1a2.5 2.5 0 0 0 0 5v3.1a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4v-3.1a2.5 2.5 0 0 0 0-5V6.8A1.4 1.4 0 0 1 3 5.4z"/></svg>';
const svgListe=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||24)+'px;height:'+(s||24)+'px" fill="'+c+'"><circle cx="4.6" cy="6" r="2.4"/><circle cx="4.6" cy="12" r="2.4"/><circle cx="4.6" cy="18" r="2.4"/><rect x="9.4" y="4.4" width="12.2" height="3.2" rx="1.6"/><rect x="9.4" y="10.4" width="12.2" height="3.2" rx="1.6"/><rect x="9.4" y="16.4" width="12.2" height="3.2" rx="1.6"/></svg>';
function titre(){return '<div class="ht">Vous cherchez<br>qu<span class="tdo"></span>i ?</div>'}
function urg(){return '<div class="urgb">'+pico('urgences.svg','#e63329',24)+'<span style="flex:1"><b>Urgences</b><small>101 · 112 · les bons réflexes</small></span><span style="opacity:.7">›</span></div>'}

const V=[
 ['a1','1 — Les pavés du jour','Le ticket, ma liste et les démarches deviennent de VRAIS pavés carrés avec leur gros picto, comme la grille du réseau. L\'accueil ressemble aux pavés de ton app : une place, pas un couloir.',
  ()=>titre()+urg()+
  '<div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid #d6d4d0;margin-bottom:0">'+
   '<div style="border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;padding:10px 11px;display:flex;gap:8px;align-items:center">'+pico('linge.svg','#6cb392',20)+'<span class="monoS">Linge · 2e ét.</span></div>'+
   '<div style="border-bottom:1px solid #d6d4d0;padding:10px 11px;display:flex;gap:8px;align-items:center">'+pico('notif-poubelle.svg','#1b1b1b',20)+'<span class="monoS" style="color:#e63329">Poub. · vendredi</span></div>'+
   '<div style="border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;min-height:120px;padding:12px;display:flex;flex-direction:column"><span class="mono"><span class="tdot" style="background:#6cb392"></span>Le ticket</span><span style="margin:auto auto 0">'+svgTicket('#1b1b1b',40)+'</span></div>'+
   '<div style="border-bottom:1px solid #d6d4d0;min-height:120px;padding:12px;display:flex;flex-direction:column"><span class="mono"><span class="tdot" style="background:#5b8fd4"></span>Ma liste</span><span style="margin:auto auto 0">'+svgListe('#1b1b1b',40)+'</span></div>'+
   '<div style="grid-column:1/-1;min-height:96px;padding:12px;display:flex;flex-direction:column"><span class="mono"><span class="tdot" style="background:#b28b7a"></span>Démarches</span><span style="margin:auto auto 0;align-self:flex-end">'+pico('ico-demarches.svg','#1b1b1b',38)+'</span></div>'+
  '</div>'],
 ['a2','2 — Le bulletin du jour','Une seule GRANDE carte noire « Aujourd\'hui » qui parle : le linge, les poubelles, les sorties — comme un tableau d\'affichage. Puis deux pavés clairs, ticket/liste, et démarches en bande.',
  ()=>titre()+urg()+
  '<div style="background:#1b1b1b;color:#f4f3f1;padding:14px 15px;margin-bottom:12px">'+
   '<div class="mono" style="color:#f5c542;margin-bottom:8px">Aujourd\'hui — mercredi 5 août</div>'+
   '<div style="display:flex;gap:9px;align-items:center;margin-bottom:6px">'+pico('linge.svg','#6cb392',18)+'<span style="font-size:13.5px">Linge : 2e étage · 201 → 222</span></div>'+
   '<div style="display:flex;gap:9px;align-items:center;margin-bottom:6px">'+pico('notif-poubelle.svg','#f4f3f1',18)+'<span style="font-size:13.5px">Poubelles : vendredi matin, 3 noires</span></div>'+
   '<div style="display:flex;gap:9px;align-items:center">'+svgTicket('#6cb392',18)+'<span style="font-size:13.5px">Gratuit : Cultureghem · BELvue · Ludobox</span></div>'+
  '</div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'+
   '<div style="border:1px solid #d6d4d0;min-height:100px;padding:12px;display:flex;flex-direction:column;background:#f4f3f0"><span class="mono"><span class="tdot" style="background:#6cb392"></span>Le ticket</span><span style="margin:auto auto 0">'+svgTicket('#1b1b1b',36)+'</span></div>'+
   '<div style="border:1px solid #d6d4d0;min-height:100px;padding:12px;display:flex;flex-direction:column;background:#f4f3f0"><span class="mono"><span class="tdot" style="background:#5b8fd4"></span>Ma liste</span><span style="margin:auto auto 0">'+svgListe('#1b1b1b',36)+'</span></div>'+
  '</div>'+
  '<div style="border:1px solid #d6d4d0;background:#f4f3f0;padding:13px 14px;display:flex;align-items:center;gap:12px"><span class="mono"><span class="tdot" style="background:#b28b7a"></span>Démarches</span><span style="flex:1"></span>'+pico('ico-demarches.svg','#1b1b1b',30)+'</div>'],
 ['a3','3 — Les couleurs d\'accueil','Les rangées restent, mais chacune prend le fond DOUX de sa couleur : le ticket en vert d\'eau, ma liste en bleu pâle, les démarches en beige. Seul l\'accueil est coloré — les sous-pages restent au trait : on sait toujours où on est.',
  ()=>titre()+urg()+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
   '<div style="background:#e7f3ef;padding:11px 12px;display:flex;gap:8px;align-items:center">'+pico('linge.svg','#2f7d68',20)+'<span class="monoS" style="color:#2f7d68">Linge · 2e ét.</span></div>'+
   '<div style="background:#fdf0ec;padding:11px 12px;display:flex;gap:8px;align-items:center">'+pico('notif-poubelle.svg','#c13515',20)+'<span class="monoS" style="color:#c13515">Poub. · vendredi</span></div>'+
  '</div>'+
  '<div style="background:#e0efe6;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><span style="flex:1"><span class="mono">Le ticket</span><br><span style="font-size:13px;color:#3c6b52">Aujourd\'hui : Cultureghem · BELvue…</span></span>'+svgTicket('#1b1b1b',30)+'</div>'+
  '<div style="background:#e3ecf7;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px"><span style="flex:1"><span class="mono">Ma liste du jour</span><br><span style="font-size:13px;color:#44618d">Ta check-list — avec la connexion</span></span>'+svgListe('#1b1b1b',30)+'</div>'+
  '<div style="background:#efe6dd;padding:14px;display:flex;align-items:center;gap:12px"><span style="flex:1"><span class="mono">Démarches</span><br><span style="font-size:13px;color:#7a5c48">Réquisitoire · AMU · RIS · Mutuelle…</span></span>'+pico('ico-demarches.svg','#1b1b1b',30)+'</div>'],
 ['a4','4 — Le grand damier','Tout l\'accueil en un seul damier serré façon ta maquette d\'ordinateur : les cases se partagent les traits, tailles variées, gros pictos. Dense, graphique, très « couverture ».',
  ()=>titre()+urg()+
  '<div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid #d6d4d0">'+
   '<div style="border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;min-height:130px;padding:12px;display:flex;flex-direction:column"><span class="mono"><span class="tdot" style="background:#6cb392"></span>Le ticket</span><span class="monoS" style="margin-top:2px">3 sorties aujourd\'hui</span><span style="margin:auto auto 0;align-self:flex-end">'+svgTicket('#1b1b1b',42)+'</span></div>'+
   '<div style="border-bottom:1px solid #d6d4d0;min-height:130px;padding:12px;display:flex;flex-direction:column"><span class="mono"><span class="tdot" style="background:#b28b7a"></span>Démarches</span><span class="monoS" style="margin-top:2px">AMU · RIS · Mutuelle…</span><span style="margin:auto auto 0;align-self:flex-end">'+pico('ico-demarches.svg','#1b1b1b',42)+'</span></div>'+
   '<div style="border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;padding:11px 12px;display:flex;gap:8px;align-items:center">'+pico('linge.svg','#6cb392',20)+'<span class="monoS">2e étage</span></div>'+
   '<div style="border-bottom:1px solid #d6d4d0;padding:11px 12px;display:flex;gap:8px;align-items:center">'+pico('notif-poubelle.svg','#1b1b1b',20)+'<span class="monoS" style="color:#e63329">Vendredi · 3 noires</span></div>'+
   '<div style="grid-column:1/-1;padding:12px;min-height:78px;display:flex;align-items:center;gap:12px"><span class="mono"><span class="tdot" style="background:#5b8fd4"></span>Ma liste du jour</span><span style="flex:1"></span>'+svgListe('#1b1b1b',34)+'</div>'+
  '</div>']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant" id="'+v[0]+'"><span class="vtag">'+v[1]+'</span><p class="vdesc">'+v[2]+'</p>'+
 '<div class="phone">'+v[3]()+'</div></div>').join('');
</script>
</body>
</html>
