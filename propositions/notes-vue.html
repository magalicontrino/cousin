<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes — maquette</title>
<link rel="stylesheet" href="_app.css">
<style>
/* Le strict nécessaire pour que la maquette tienne toute seule, hors de l'app. */
body{background:var(--creme);margin:0;padding:0 16px 30px}
.mq{max-width:760px;margin:0 auto}
.mic{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  background:var(--noir);color:#f2eee6;border:1.5px solid var(--trait-fort);border-radius:13px;
  padding:16px;font-family:inherit;font-size:16px;font-weight:600;margin-top:14px;cursor:pointer}
.mic.gros{padding:26px 16px;font-size:18px}
.mic .rond{width:26px;height:26px;border-radius:50%;background:#f2eee6;display:inline-flex;
  align-items:center;justify-content:center;color:var(--noir);font-size:14px;flex:none}
.mic.ecoute{background:#c8553d;border-color:#c8553d}
.formes{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.forme{background:#fdfdfc;border:1.5px solid var(--trait);border-radius:22px;padding:9px 15px;
  font-family:inherit;font-size:14px;color:var(--noir);cursor:pointer}
.forme.on{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.rub{margin-top:12px}
.rub-t{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--enc2);margin-bottom:4px}
.rub-v{background:#fdfdfc;border:1px solid var(--ligne);border-radius:9px;padding:10px 12px;
  font-size:15px;line-height:1.45;margin-bottom:9px}
.rub-v.vide{color:var(--enc2);font-style:italic;border-style:dashed}
.nq{font-size:13px;color:var(--enc2);margin:14px 0 5px}
.brut{background:#f6f4f1;border:1px dashed var(--trait);border-radius:9px;padding:10px 12px;
  font-size:13.5px;color:var(--enc2);line-height:1.45;margin-top:10px}
.etiq-l{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.etq{border:1px solid var(--trait);border-radius:20px;padding:3px 10px;font-size:12px;
  background:#fdfdfc;cursor:pointer}
.etq.on{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)}
.mini-b{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.mini-b button{background:#fdfdfc;border:1.5px solid var(--trait);border-radius:9px;
  padding:9px 15px;font-family:inherit;font-size:14px;cursor:pointer}
.mini-b button.plein{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort);font-weight:600}
</style></head><body><div class="mq" id="mq"></div>
<script>
const P=new URLSearchParams(location.search).get('p')||'A';
const hero=(t,s,c)=>'<div class="hero"><span class="htx">'+
  (s?'<span class="hsur" style="color:'+c+'">'+s+'</span>':'')+'<h1>'+t+'</h1></span></div>';
const micro=(txt,gros)=>'<button class="mic'+(gros?' gros':'')+'"><span class="rond">●</span>'+txt+'</button>';

let h='';
if(P==='A'){
  h=hero('Mes notes','Samedi 5 septembre','#2e8f8a')+
    micro('Dicter une note',true)+
    '<div class="nq">Aujourd’hui — 3 notes</div>'+
    '<div class="pcarte">'+
      note('14 h 10','Monsieur X, ch. 214','Pied droit avec une coupure. Points de suture. Envoyé aux urgences Saint-Pierre.')+
      note('11 h 40','Madame Y','Demande CPAS Anderlecht faite en juin, sans nouvelle. Rappeler l’assistante sociale.')+
      note('9 h 05','Monsieur Z, ch. 108','Ne se présente pas au petit-déjeuner depuis trois jours.')+
    '</div>';
}
if(P==='B'){
  h=hero('Une note','Monsieur X · ch. 214','#2e8f8a')+
    '<div class="formes">'+
      '<button class="forme on">Médical</button><button class="forme">Social</button>'+
      '<button class="forme">Arrivée</button><button class="forme">Incident</button>'+
    '</div>'+
    micro('Dicter')+
    '<div class="brut">« pied droit coupure assez profonde, points de suture, on l’a envoyé aux urgences saint-pierre, il revient demain »</div>'+
    '<div class="rub">'+
      rub('Ce qui a été vu','Pied droit : coupure assez profonde.')+
      rub('Ce qui a été fait','Points de suture.')+
      rub('Où on l’a envoyé','Urgences Saint-Pierre.')+
      rub('À suivre','Revient demain.')+
      rub('Traitement','',true)+
    '</div>'+
    '<div class="mini-b"><button class="plein">Copier</button><button>Garder</button>'+
      '<button>Revenir au vrac</button></div>';
}
if(P==='C'){
  h=hero('Dicter','Tout, dans l’ordre où ça vient','#2e8f8a')+
    micro('Parler',true)+
    '<div class="brut">« alors monsieur X chambre 214 le pied la coupure les points de suture envoyé aux urgences… et puis madame Y son cpas d’anderlecht toujours rien depuis juin… ah et le 108 il descend plus manger »</div>'+
    '<div class="nq">J’ai coupé en 3 notes. Change l’étiquette si je me trompe.</div>'+
    '<div class="pcarte">'+
      coupe('Monsieur X, ch. 214','Pied droit avec une coupure. Points de suture. Envoyé aux urgences.','Médical')+
      coupe('Madame Y','Demande CPAS Anderlecht faite en juin, toujours sans réponse.','Social')+
      coupe('Chambre 108','Ne descend plus manger.','Incident')+
    '</div>';
}
function note(h_,qui,txt){
  return '<div class="pl2"><div class="pl2-h">'+
    '<button class="cas"></button><span class="pl2-sep"></span>'+
    '<button class="ib">✎</button><button class="ib">⧉</button><button class="ib">🗑</button>'+
    '<span style="margin-left:auto;font-size:12px;color:var(--enc2)">'+h_+'</span></div>'+
    '<div class="pl2-t"><b>'+qui+'</b><em>'+txt+'</em></div></div>';
}
function rub(t,v,vide){
  return '<div class="rub-t">'+t+'</div><div class="rub-v'+(vide?' vide':'')+'">'+
    (vide?'rien n’a été dit là-dessus':v)+'</div>';
}
function coupe(qui,txt,et){
  const l=['Médical','Social','Arrivée','Incident'];
  return '<div class="pl2"><div class="pl2-h"><button class="cas"></button>'+
    '<span class="pl2-sep"></span><button class="ib">✎</button><button class="ib">⧉</button></div>'+
    '<div class="pl2-t"><b>'+qui+'</b><em>'+txt+'</em>'+
    '<div class="etiq-l">'+l.map(x=>'<span class="etq'+(x===et?' on':'')+'">'+x+'</span>').join('')+'</div>'+
    '</div></div>';
}
document.getElementById('mq').innerHTML=h;
</script></body></html>
