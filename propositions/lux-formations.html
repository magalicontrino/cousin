<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formations — quatre habillages</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 14px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;letter-spacing:.14em;text-transform:uppercase}

.fc{border:1px solid #c9c4b8;background:#f4f3f0;margin-bottom:12px;padding:13px 13px 12px}
.fc.blanc{background:#fff;border:2px solid #1b1b1b}
.tete{display:flex;gap:11px;align-items:flex-start}
.rond{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.tete b{font-size:14.5px;font-weight:800;line-height:1.2;display:block}
.tete em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#73716b;margin-top:3px}
.etapes{margin:11px 0 0;border-top:1px solid #d6d4d0}
.et{display:flex;gap:10px;align-items:center;border-bottom:1px solid #d6d4d0;padding:8px 2px;font-size:13px}
.et i{font-style:normal;width:20px;height:20px;flex:none;border:1.5px solid #1b1b1b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.et.faite i{background:#6cb392;border-color:#6cb392;color:#1b1b1b}
.et.faite span{color:#73716b;text-decoration:line-through}
.tester{display:inline-flex;align-items:center;gap:8px;margin-top:11px;border:1px solid #1b1b1b;padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.anneau{margin-left:auto;flex:none}

.noirfc{background:#1b1b1b;color:#f2eee6;margin-bottom:12px;padding:13px}
.noirfc .tete em{color:rgba(242,238,230,.55)}
.noirfc .et{border-color:rgba(242,238,230,.18)}
.noirfc .et i{border-color:#f2eee6}
.noirfc .et.faite i{background:#6cb392;border-color:#6cb392;color:#1b1b1b}
.noirfc .tester{border-color:#f2eee6}

.reg{border:1px solid #c9c4b8}
.reg .r{display:flex;align-items:center;gap:11px;border-bottom:1px solid #c9c4b8;padding:12px;background:#f4f3f0}
.reg .r:last-child{border-bottom:0}
.reg .r .tx{flex:1}
.reg .r .tx b{font-size:14px;font-weight:800;display:block;line-height:1.2}
.reg .r .tx em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#73716b}
.badge{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;font-weight:600;padding:3px 7px;flex:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Formations — quatre habillages</h1>
<p class="intro">Les ingrédients de la première app reviennent partout : le rond de couleur du thème, la durée, les chapitres qu'on coche (✓), et « Se tester sur ce sujet » qui lance le quiz. Ce qui change entre les 4 : l'habit. Réponds par un numéro.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||18)+'px;height:'+(s||18)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
function anneau(pct,c){const r=13,circ=2*Math.PI*r;return '<svg viewBox="0 0 32 32" style="width:30px;height:30px" class="anneau"><circle cx="16" cy="16" r="'+r+'" fill="none" stroke="#d6d4d0" stroke-width="4"/><circle cx="16" cy="16" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="4" stroke-dasharray="'+(circ*pct)+' '+circ+'" stroke-linecap="round" transform="rotate(-90 16 16)"/></svg>'}
function etapes(cls){
  return '<div class="etapes">'+
   '<div class="et faite"><i>✓</i><span>Ce que c\'est, en deux mots</span></div>'+
   '<div class="et faite"><i>✓</i><span>Comment ça marche, pas à pas</span></div>'+
   '<div class="et"><i>3</i><span>Les pièges à éviter</span></div>'+
   '<div class="et"><i>4</i><span>À qui le proposer</span></div>'+
  '</div>';
}
function tete(rondBg,rondFg,titre,sous){
  return '<div class="tete"><span class="rond" style="background:'+rondBg+'">'+pico('formations.svg',rondFg||'#1b1b1b')+'</span>'+
    '<span style="flex:1;min-width:0"><b>'+titre+'</b><em>'+sous+'</em></span>'+anneau(0.5,'#6cb392')+'</div>';
}
const V=[
 ['1 · La carte de la première app, en habit grille',
  'La recette complète qui te plaisait : rond de couleur, durée, chapitres cochables, « Se tester ». Posée dans une case au trait, écriture machine — parfaitement raccord avec le reste du Lux.',
  '<div class="fc">'+tete('#6cb392',null,'Premiers pas dans le réseau bruxellois','Réseau · Tous métiers · 12 min')+etapes()+'<span class="tester">'+pico('astuce.svg','#1b1b1b',14)+'Se tester sur ce sujet</span></div>'+
  '<div class="fc">'+tete('#f5c542',null,'Article 27 — le ticket culture','Culture · Éducs · 8 min')+'</div>'],
 ['2 · Cerclée de noir sur blanc',
  'La même carte, mais BLANCHE cerclée de noir 2 px — comme tes cartes de listes. Elle claque plus sur le fond crème ; l\'anneau vert dit où tu en es.',
  '<div class="fc blanc">'+tete('#6cb392',null,'Premiers pas dans le réseau bruxellois','Réseau · Tous métiers · 12 min')+etapes()+'<span class="tester">'+pico('astuce.svg','#1b1b1b',14)+'Se tester sur ce sujet</span></div>'+
  '<div class="fc blanc">'+tete('#f5c542',null,'Article 27 — le ticket culture','Culture · Éducs · 8 min')+'</div>'],
 ['3 · Le pavé noir qui s\'ouvre',
  'Chaque formation est un pavé NOIR (comme les pavés de l\'accueil) : picto couleur, titre crème, durée. On touche : les chapitres se déplient dessous, cochables. Le plus spectaculaire.',
  '<div class="noirfc">'+tete('#6cb392',null,'Premiers pas dans le réseau bruxellois','Réseau · Tous métiers · 12 min')+etapes('n')+'<span class="tester">'+pico('astuce.svg','#f2eee6',14)+'Se tester sur ce sujet</span></div>'+
  '<div class="noirfc">'+tete('#f5c542',null,'Article 27 — le ticket culture','Culture · Éducs · 8 min')+'</div>'],
 ['4 · Le registre + la page de cours',
  'La liste reste FINE (registre à rond de couleur, durée, badge d\'avancement « 2/4 ») — et c\'est en OUVRANT la formation qu\'on trouve la grande page : chapitres en grandes étapes numérotées, quiz à la fin. La liste respire, le contenu a de la place.',
  '<div class="reg">'+
   '<div class="r"><span class="rond" style="background:#6cb392;width:30px;height:30px">'+pico('formations.svg','#1b1b1b',16)+'</span><span class="tx"><b>Premiers pas dans le réseau bruxellois</b><em>12 min</em></span><span class="badge" style="border:1px solid #6cb392;color:#1b1b1b">2/4</span></div>'+
   '<div class="r"><span class="rond" style="background:#f5c542;width:30px;height:30px">'+pico('formations.svg','#1b1b1b',16)+'</span><span class="tx"><b>Article 27 — le ticket culture</b><em>8 min</em></span><span class="badge" style="background:#6cb392;color:#1b1b1b">✓</span></div>'+
   '<div class="r"><span class="rond" style="background:#fd8fd0;width:30px;height:30px">'+pico('formations.svg','#1b1b1b',16)+'</span><span class="tx"><b>Adresse de référence, CPAS et agrément</b><em>10 min</em></span><span class="badge" style="border:1px solid #c9c4b8;color:#73716b">0/5</span></div>'+
  '</div>']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone">'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
