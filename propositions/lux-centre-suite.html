<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Centre, après les pavés — quatre idées</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 14px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;letter-spacing:.18em;text-transform:uppercase}

.stitre{font-size:15px;font-weight:800;text-transform:uppercase;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d6d4d0;margin-bottom:14px}
.tile{background:#f4f3f0;border-right:1px solid #d6d4d0;border-bottom:1px solid #d6d4d0;padding:10px 11px;
  min-height:74px;display:flex;flex-direction:column;text-align:left}
.tile:nth-child(2n){border-right:0}
.tile:last-child,.tile:nth-last-child(2):nth-child(odd){border-bottom:0}
.tile .lab{font-size:10px}
.tile .lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.tile .lab .n{color:#73716b;margin-left:6px;letter-spacing:.1em}
.tile .pi{margin:auto auto 0;width:26px;height:26px}
.fondu{opacity:.45}

.reg{border:1px solid #d6d4d0}
.reg .r{display:flex;align-items:center;gap:12px;border-bottom:1px solid #d6d4d0;padding:12px 12px;background:#f4f3f0}
.reg .r:last-child{border-bottom:0}
.reg .r .lab{font-size:10.5px;flex:1}
.reg .r .lab small{display:block;font-family:'Eastman';font-size:12px;color:#73716b;letter-spacing:0;text-transform:none;font-weight:400;margin-top:3px}
.reg .r .chev{font-size:18px;font-weight:800;color:rgba(27,27,27,.4)}

.noirb{background:#1b1b1b;color:#f2eee6;padding:14px 14px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.noirb .lab{font-size:11px}
.noirb .lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6cb392;margin-right:7px}
.noirb .lab small{display:block;font-family:'Eastman';font-size:12.5px;color:rgba(242,238,230,.65);letter-spacing:0;text-transform:none;font-weight:400;margin-top:3px}

.sheetzone{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(27,27,27,.45);display:flex;align-items:flex-end}
.sheet{background:#f0efed;width:100%;border-top:1.5px solid #1b1b1b;padding:10px 16px 18px}
.poignee{width:44px;height:5px;border-radius:99px;background:#c9c4b8;margin:0 auto 12px}
.sheet h3{font-size:16px;font-weight:800;text-transform:uppercase;margin-bottom:10px}
.sheet .li{display:flex;gap:10px;align-items:baseline;border-top:1px solid #d6d4d0;padding:9px 0;font-size:13.5px}
.sheet .li b{font-weight:800}
.sheet .li em{font-style:normal;color:#73716b;font-size:12px;margin-left:auto;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
<h1>Le Centre, après les pavés — quatre idées</h1>
<p class="intro">Les pavés du haut ne bougent pas (tu les aimes, moi aussi). Ce qui change : Activités (ex-« ticket ») et Autour d'ici, juste en dessous. Réponds par un numéro (ou un mélange).</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||24)+'px;height:'+(s||24)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgTicket=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||22)+'px;height:'+(s||22)+'px;flex:none" fill="'+c+'"><path fill-rule="evenodd" d="M3 5.4h18a1.4 1.4 0 0 1 1.4 1.4v3.1a2.5 2.5 0 0 0 0 5v3.1a1.4 1.4 0 0 1-1.4 1.4H3a1.4 1.4 0 0 1-1.4-1.4v-3.1a2.5 2.5 0 0 0 0-5V6.8A1.4 1.4 0 0 1 3 5.4zm12.4 2.4v1.8h1.9V7.8zm0 3.3v1.8h1.9v-1.8zm0 3.3v1.8h1.9v-1.8z"/></svg>';
const svgPin=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||22)+'px;height:'+(s||22)+'px;flex:none" fill="'+c+'"><path fill-rule="evenodd" d="M12 2a7.3 7.3 0 0 1 7.3 7.3c0 3-2 6.2-5.9 9.8a2 2 0 0 1-2.8 0C6.7 15.5 4.7 12.3 4.7 9.3A7.3 7.3 0 0 1 12 2zm0 4.6a2.7 2.7 0 1 0 0 5.4 2.7 2.7 0 0 0 0-5.4z"/></svg>';
function paves(){
  return '<div class="stitre">Les outils</div>'+
    '<div class="grid fondu">'+
    '<span class="tile" style="grid-column:1/-1"><span class="lab mono"><span class="dot" style="background:#b28b7a"></span>DÉMARCHES</span></span>'+
    '<span class="tile"><span class="lab mono"><span class="dot" style="background:#f8763f"></span>CENTRE <span class="n">5</span></span>'+pico('centre.svg','#1b1b1b',26)+'</span>'+
    '<span class="tile"><span class="lab mono"><span class="dot" style="background:#fd8fd0"></span>PROTOCOLE <span class="n">6</span></span>'+pico('ico-cartes.svg','#1b1b1b',26)+'</span>'+
    '</div>';
}
const V=[
 ['1 · Le registre cadré — même famille que la grille',
  'Activités (ex-« ticket ») et Autour d\'ici gardent leur forme de liste, mais rangés dans un CADRE au trait, libellés en écriture machine avec pastille de couleur — exactement le langage des pavés. Le « brouillon » vient de l\'absence de cadre : on le remet.',
  paves()+'<div class="reg">'+
   '<div class="r">'+svgTicket('#6cb392')+'<span class="lab mono"><span style="color:#1b1b1b">ACTIVITÉS</span> <span style="color:#73716b">9 AUJOURD\'HUI</span><small>Sorties gratuites · Article 27 — l\'outil des éducs</small></span><span class="chev">›</span></div>'+
   '<div class="r">'+svgPin('#6cb392')+'<span class="lab mono"><span style="color:#1b1b1b">AUTOUR D\'ICI</span><small>Le quartier, depuis le centre — la feuille à donner</small></span><span class="chev">›</span></div>'+
  '</div>'],
 ['2 · Tout en pavés — une seule grille',
  'Activités (ex-« ticket ») et Autour d\'ici deviennent deux cases de PLUS dans la grille des outils. Plus aucune rupture de style : la page Centre, c\'est UNE grille et c\'est tout.',
  '<div class="stitre">Les outils</div>'+
  '<div class="grid">'+
   '<span class="tile" style="grid-column:1/-1;opacity:.45"><span class="lab mono"><span class="dot" style="background:#b28b7a"></span>DÉMARCHES</span></span>'+
   '<span class="tile fondu"><span class="lab mono"><span class="dot" style="background:#f8763f"></span>CENTRE <span class="n">5</span></span>'+pico('centre.svg','#1b1b1b',26)+'</span>'+
   '<span class="tile fondu"><span class="lab mono"><span class="dot" style="background:#fd8fd0"></span>PROTOCOLE <span class="n">6</span></span>'+pico('ico-cartes.svg','#1b1b1b',26)+'</span>'+
   '<span class="tile"><span class="lab mono"><span class="dot" style="background:#6cb392"></span>ACTIVITÉS <span class="n">9</span></span>'+svgTicket('#1b1b1b',26)+'</span>'+
   '<span class="tile"><span class="lab mono"><span class="dot" style="background:#6cb392"></span>AUTOUR D\'ICI</span>'+svgPin('#1b1b1b',26)+'</span>'+
  '</div>'],
 ['3 · Activités en bandeau noir — comme sur l\'accueil',
  'Activités est VIVANT (il change tous les jours) : il mérite un bandeau noir plein, comme son pavé de l\'accueil, avec le compte du jour. Autour d\'ici, plus calme, reste une case au trait en dessous.',
  paves()+
  '<div class="noirb">'+svgTicket('#6cb392')+'<span class="lab mono"><span class="dot"></span>ACTIVITÉS · 9 SORTIES AUJOURD\'HUI<small>Sorties gratuites · Article 27 — l\'outil des éducs</small></span></div>'+
  '<div class="reg"><div class="r">'+svgPin('#6cb392')+'<span class="lab mono"><span style="color:#1b1b1b">AUTOUR D\'ICI</span><small>Le quartier, depuis le centre — la feuille à donner</small></span><span class="chev">›</span></div></div>'],
 ['4 · Ton idée — la fenêtre qui monte du bas',
  'Un seul petit bouton « ACTIVITÉS » dans la grille ; on le touche, et une fenêtre monte du bas de l\'écran avec les sorties du jour et l\'Article 27 — sans quitter la page. Ici, la fenêtre est dessinée OUVERTE.',
  paves()+
  '<div class="sheetzone"><div class="sheet">'+
   '<div class="poignee"></div>'+
   '<h3>'+'Activités — aujourd\'hui</h3>'+
   '<div class="li"><b>Musées royaux des Beaux-Arts</b><em>gratuit 1er mercredi</em></div>'+
   '<div class="li"><b>Bozar — expo</b><em>Article 27</em></div>'+
   '<div class="li"><b>Cinéma Palace</b><em>Article 27</em></div>'+
   '<div class="li" style="border-bottom:1px solid #d6d4d0"><b>Théâtre National</b><em>Article 27</em></div>'+
   '<div style="text-align:center;margin-top:12px"><span class="mono" style="font-size:10px;border:1px solid #1b1b1b;padding:8px 14px">VOIR LES 15 PROCHAINS JOURS</span></div>'+
  '</div></div>']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone"'+(v[0].startsWith('4')?' style="min-height:430px"':'')+'>'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
