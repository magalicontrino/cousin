<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Désencoder — 3 façons</title>
<style>
@font-face{font-family:'Eastman';src:url('../font/eastman-regular.woff2') format('woff2');font-weight:400;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('../font/eastman-demibold.woff2') format('woff2');font-weight:600;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('../font/eastman-extrabold.woff2') format('woff2');font-weight:700;unicode-range:U+0-2F, U+3A-10FFFF}
body{margin:0;background:#8a8885;font-family:'Eastman',system-ui,sans-serif;color:#2b2a28;padding:24px 16px}
.grille{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start}
.col{width:340px;max-width:100%}
.lettre{color:#fdfdfc;font-weight:700;font-size:22px;margin:0 0 8px 4px}
.card{background:#f0eeeb;border:1.5px solid #6b6862;border-radius:18px;padding:20px;box-sizing:border-box}
.pt{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;margin-bottom:12px}
.pi{width:34px;height:34px;border-radius:50%;background:#a9c8e8;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.in{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1px solid #c9c5be;border-radius:10px;padding:9px 11px;margin:0 0 8px;background:#fdfdfc;color:#2b2a28}
.f{display:flex;gap:8px}.f .in{flex:1}.f .ch{max-width:90px}
textarea.in{resize:none}
.b{display:flex;align-items:center;margin-top:12px}.b span{flex:1}
.ref{font:inherit;font-size:14px;font-weight:600;background:#fdfdfc;border:1.5px solid #b28b7a;border-radius:10px;padding:8px 16px}
.val{font:inherit;font-size:14px;font-weight:600;background:#2b2a28;color:#fff;border:0;border-radius:10px;padding:9px 18px}

/* A — en escalier */
.ligne{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;font-weight:600;cursor:pointer;user-select:none}
.bx{width:20px;height:20px;border:1.75px solid #9b9892;border-radius:5px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:transparent;font-size:13px}
.on .bx{color:#fdfdfc}
.rd{border-radius:50%}
.on .bx{background:#2b2a28;border-color:#2b2a28}
.sous{margin-left:30px;border-left:2px solid #c9c5be;padding-left:12px}
.eteint{opacity:.5;pointer-events:none}

/* B — une seule liste */
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid #c9c5be;border-radius:12px;background:#fdfdfc;padding:11px 12px;margin-bottom:8px;font-size:15px;font-weight:600;cursor:pointer}
.opt.on{border-color:#2b2a28}
.opt .bx{margin:0}
.opt .le{font-weight:400;color:#6b6862}

/* C — trois pastilles */
.lab{font-size:13px;font-weight:600;color:#6b6862;margin:6px 0 6px}
.seg{display:flex;border:2px solid #2b2a28;border-radius:999px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;font:inherit;font-weight:600;font-size:14px;background:#fdfdfc;color:#2b2a28;border:0;padding:10px 4px;cursor:pointer}
.seg button+button{border-left:2px solid #2b2a28}
.seg button.on{background:#2b2a28;color:#fdfdfc}
</style></head><body>
<div class="grille">

<!-- A -->
<div class="col"><p class="lettre">A</p><div class="card" id="A">
  <div class="pt"><span class="pi">🔑</span>Désencoder</div>
  <div class="f"><input class="in" value="Jean D."><input class="in ch" value="214"></div>
  <input class="in" type="date" value="2026-10-14">
  <div class="ligne" data-k="vider"><span class="bx">✓</span>À vider</div>
  <div class="sous" id="Asous">
    <div class="ligne" data-r="moins1"><span class="bx rd"></span>−1</div>
    <div class="ligne" data-r="transport"><span class="bx rd"></span>Transport</div>
    <textarea class="in" id="Acom" rows="2" placeholder="Commentaire"></textarea>
  </div>
  <div class="b"><button class="ref">Fermer</button><span></span><button class="val">Désencoder</button></div>
</div></div>

<!-- B -->
<div class="col"><p class="lettre">B</p><div class="card" id="B">
  <div class="pt"><span class="pi">🔑</span>Désencoder</div>
  <div class="f"><input class="in" value="Jean D."><input class="in ch" value="214"></div>
  <input class="in" type="date" value="2026-10-14">
  <div class="opt on" data-r="vide"><span class="bx rd"></span>Chambre vide</div>
  <div class="opt" data-r="moins1"><span class="bx rd"></span>À vider <span class="le">· −1</span></div>
  <div class="opt" data-r="transport"><span class="bx rd"></span>À vider <span class="le">· Transport</span></div>
  <textarea class="in eteint" id="Bcom" rows="2" placeholder="Commentaire"></textarea>
  <div class="b"><button class="ref">Fermer</button><span></span><button class="val">Désencoder</button></div>
</div></div>

<!-- C -->
<div class="col"><p class="lettre">C</p><div class="card" id="C">
  <div class="pt"><span class="pi">🔑</span>Désencoder</div>
  <div class="f"><input class="in" value="Jean D."><input class="in ch" value="214"></div>
  <input class="in" type="date" value="2026-10-14">
  <div class="lab">Affaires</div>
  <div class="seg"><button class="on" data-r="vide">Aucune</button><button data-r="moins1">−1</button><button data-r="transport">Transport</button></div>
  <textarea class="in eteint" id="Ccom" rows="2" placeholder="Commentaire"></textarea>
  <div class="b"><button class="ref">Fermer</button><span></span><button class="val">Désencoder</button></div>
</div></div>

</div>
<script>
/* A */
(function(){
  var A=document.getElementById('A'), vider=A.querySelector('[data-k]'), sous=document.getElementById('Asous'), com=document.getElementById('Acom');
  function maj(){ var on=vider.classList.contains('on'); sous.classList.toggle('eteint',!on);
    var t=A.querySelector('[data-r="transport"]').classList.contains('on'); com.classList.toggle('eteint',!on||!t); }
  vider.onclick=function(){ vider.classList.toggle('on'); maj(); };
  A.querySelectorAll('[data-r]').forEach(function(l){ l.onclick=function(){ A.querySelectorAll('[data-r]').forEach(function(x){x.classList.remove('on');}); l.classList.add('on'); maj(); }; });
  maj();
})();
/* B et C */
['B','C'].forEach(function(id){
  var c=document.getElementById(id), com=document.getElementById(id+'com');
  c.querySelectorAll('[data-r]').forEach(function(l){ l.onclick=function(){
    c.querySelectorAll('[data-r]').forEach(function(x){x.classList.remove('on');}); l.classList.add('on');
    com.classList.toggle('eteint', l.dataset.r!=='transport'); }; });
});
</script>
</body></html>
