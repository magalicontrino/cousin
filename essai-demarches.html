<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COUSIN — essai : ranger les Démarches</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{background:#f2eee6;color:#1b1b1b;font-family:'Outfit',system-ui,sans-serif;margin:0 auto;padding:18px 16px 70px;max-width:460px;line-height:1.5}
.essai{background:#1b1b1b;color:#f2eee6;border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:800;margin-bottom:16px}
h1{font-size:23px;font-weight:900;margin:0 0 6px;letter-spacing:-.3px}

.bascule button{flex:1;border:0;border-radius:9px;padding:9px 8px;font-family:inherit;font-size:12.5px;font-weight:900;background:transparent;color:#6b675f;cursor:pointer}
.bascule button.on{background:#1b1b1b;color:#f2eee6}
.ecran{background:#fff;border-radius:18px;padding:14px 13px 16px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.ecran h2{font-size:19px;font-weight:900;margin:2px 0 12px;display:flex;align-items:center;gap:9px}

.rang{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;margin-bottom:3px;scrollbar-width:none}

.chip{flex:0 0 auto;border:1px solid #e0dbd0;background:#faf8f4;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:#54514b;cursor:pointer;white-space:nowrap}
.chip.on{background:#1b1b1b;border-color:#1b1b1b;color:#f2eee6}

.fiche b{display:block;font-size:13.5px;font-weight:800;line-height:1.3}
.fiche span{font-size:11.5px;color:#8a857c;font-weight:700}
.moe{background:#1b1b1b;border-color:#1b1b1b;color:#f2eee6}
.moe b{color:#f2eee6}
.moe span{color:#c3bcae}

.pour b{display:block;font-weight:900;margin-bottom:2px}

<div class="essai">ESSAI — rien n'est changé dans l'app. Regarde, puis dis oui ou non.</div>

<h1>Ranger les Démarches</h1>
<p class="lead">Il y a <b>11 fiches</b> : 3 modes d'emploi et 8 guichets CPAS. Bascule d'un écran à l'autre pour comparer.</p>

<div class="bascule">
  <button id="b1" class="on" onclick="voir(1)">Aujourd'hui</button>
  <button id="b2" onclick="voir(2)">Ma proposition</button>
</div>

<div id="ecran" class="ecran"></div>

<div id="apres"></div>

<script>
const GUICHETS = {
  'Réquisitoire': ['Anderlecht','Bruxelles-Ville','Molenbeek-Saint-Jean'],
  'Aide Médicale Urgente (AMU)': ['Anderlecht','Bruxelles-Ville','Molenbeek-Saint-Jean'],
  'Carte médicale': ['Toutes communes — trame générale'],
  "RIS (revenu d'intégration)": ['Toutes communes — trame générale']
};
const MODES = {
  'Aide Médicale Urgente (AMU)': {nom:"Aide Médicale Urgente (AMU)", sous:"Repère pour les personnes sans séjour légal — information générale, non juridique."},
  "RIS (revenu d'intégration)": {nom:"Ouverture d'un dossier CPAS", sous:"Étapes types — vérifier selon la commune de résidence.", propose:true}
};
const TYPES = Object.keys(GUICHETS);
let typeActif = 'Réquisitoire', genre = 'Tout';

function fiche(nom, sous, cl){
  return '<div class="fiche '+(cl||'')+'">'+(cl==='moe'?'<span class="bad">MODE D\'EMPLOI</span><br>':'')+
         '<b>'+nom+'</b>'+(sous?'<span>'+sous+'</span>':'')+'</div>';
}

function ecranAujourdhui(){
  let h = '<h2><i></i>Démarches</h2>';
  h += '<div class="rang">'+['Tout',"Mode d'emploi",'Par CPAS'].map(g=>
       '<div class="chip '+(g===genre?'on':'')+'" onclick="setGenre(\''+g+'\')">'+g+'</div>').join('')+'</div>';
  let types = genre==="Mode d'emploi" ? [] : TYPES;
  h += '<div class="rang">'+['Toutes',...types].map(t=>'<div class="chip">'+t+'</div>').join('')+'</div>';
  if(genre!=="Mode d'emploi")
    h += '<div class="rang">'+['Toutes','Anderlecht','Bruxelles-Ville','Molenbeek-Saint-Jean','Toutes communes'].map(c=>'<div class="chip">'+c+'</div>').join('')+'</div>';

  h += '<div class="etiq">'+(genre==='Tout'?'les 11 fiches, mélangées':genre==="Mode d'emploi"?'3 fiches':'8 fiches')+'</div>';
  if(genre!=="Par CPAS"){
    h += fiche("Ouverture d'un dossier CPAS","Étapes types",'moe');
    h += fiche("Aide Médicale Urgente (AMU)","Repère séjour illégal",'moe');
    h += fiche("Orientation « droit des étrangers »","Quand et vers qui rediriger",'moe');
  }
  if(genre!=="Mode d'emploi"){
    for(const t of TYPES) for(const c of GUICHETS[t]) h += fiche(t+' — '+c, c);
  }
  if(genre==="Mode d'emploi")
    h += '<div class="note">La rangée des types s\'est vidée : aucun mode d\'emploi n\'a de type de démarche. Le filtre ne filtre plus rien.</div>';
  return h;
}

function ecranPropose(){
  let h = '<h2><i></i>Démarches</h2>';
  h += '<div class="rang">'+TYPES.map(t=>
       '<div class="chip '+(t===typeActif?'on':'')+'" onclick="setType(\''+t.replace(/'/g,"\\'")+'\')">'+t+'</div>').join('')+'</div>';
  const m = MODES[typeActif];
  h += '<div class="etiq">comment ça marche</div>';
  h += m ? fiche(m.nom + (m.propose?' *':''), m.sous, 'moe')
         : '<div class="fiche trou"><b>Mode d\'emploi à écrire</b><span>Personne n\'a encore écrit la marche à suivre pour cette démarche.</span></div>';
  h += '<div class="etiq">où s\'adresser</div>';
  h += GUICHETS[typeActif].map(c=>fiche(typeActif+' — '+c, c)).join('');
  if(m && m.propose)
    h += '<div class="note">* « Ouverture d\'un dossier CPAS » n\'a pas de type aujourd\'hui. Je propose de le ranger ici — c\'est par là qu\'on commence un RIS.</div>';
  return h;
}

function setGenre(g){ genre=g; rendre(); }
function setType(t){ typeActif=t; rendre(); }
let vue = 1;
function voir(n){ vue=n; b1.className = n===1?'on':''; b2.className = n===2?'on':''; rendre(); }
function rendre(){
  document.getElementById('ecran').innerHTML = vue===1 ? ecranAujourdhui() : ecranPropose();
  document.getElementById('apres').innerHTML = vue===1 ? '' : APRES;
}

const APRES = `
<h3>Ce que ça change</h3>
<div class="pour"><b>Une rangée de filtres au lieu de trois</b>On garde les démarches, on enlève « Tout / Mode d'emploi / Par CPAS », et la commune devient juste le nom de la fiche — il n'y en a que trois.</div>
<div class="pour"><b>On ne perd plus le fil</b>La marche à suivre et le guichet sont sur le même écran : on lit, on appelle, sans changer d'onglet.</div>
<div class="pour"><b>Les trous se voient</b>Réquisitoire n'a aucun mode d'emploi — aujourd'hui ça ne se remarque pas, là c'est écrit en rouge. C'est une liste de ce qui reste à écrire.</div>
<div class="pour"><b>Ça tient quand ça grandira</b>Quand il y aura 19 CPAS et 7 démarches, la même page marchera : une démarche, sa marche à suivre, ses guichets.</div>

<h3>Ce que je ne sais pas ranger</h3>
<div class="pour"><b>« Orientation droit des étrangers »</b>Ce n'est pas une démarche CPAS, c'est un guide : quand et vers qui rediriger. Sa place serait dans Protocole, ou dans le futur guide de questions. Dis-moi.</div>

<div class="fin"><b>Si tu dis oui</b>, je le fais dans l'app et tu revois avant que l'équipe l'ait. Rien ne se perd : les 11 fiches restent les mêmes, c'est seulement l'ordre qui change.</div>`;

rendre();
</script>
