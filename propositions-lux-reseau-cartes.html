<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les cartes du Réseau — quatre visuels</title>
<style>
@font-face{font-family:'Eastman';src:url('font/eastman-regular.woff2') format('woff2');font-weight:400;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-bold.woff2') format('woff2');font-weight:700;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
@font-face{font-family:'Eastman';src:url('font/eastman-extrabold.woff2') format('woff2');font-weight:800;font-display:swap;unicode-range:U+0-2F, U+3A-10FFFF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Eastman',-apple-system,sans-serif;background:#dcd8d0;color:#1b1b1b;font-size:16px;line-height:1.4;padding:22px 14px 60px}
.wrap{max-width:440px;margin:0 auto}
h1{font-size:21px;margin-bottom:4px}
.intro{font-size:13.5px;color:#555;margin-bottom:22px}
.variant{margin-bottom:36px}
.vtag{display:inline-flex;font-size:13px;font-weight:700;letter-spacing:.06em;
  background:#1b1b1b;color:#f2eee6;border-radius:999px;padding:6px 14px;margin-bottom:6px}
.vdesc{font-size:13px;color:#444;margin-bottom:12px}
.phone{border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f0efed;padding:16px 14px}
.pico{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.lab{font-size:10.5px}
.lab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.lab .n{color:#73716b;margin-left:6px;letter-spacing:.1em}
.pi{margin:auto auto 0;width:38px;height:38px}

.g{display:grid;grid-template-columns:1fr 1fr}
.t{min-height:118px;display:flex;flex-direction:column;text-align:left;padding:12px 12px 14px}

.v1 .g{gap:10px}
.v1 .t{background:#fff;border:2px solid #1b1b1b}

.v2 .g{gap:12px;padding:2px 4px 6px}
.v2 .t{background:#fff;border:1.5px solid #1b1b1b;box-shadow:4px 4px 0 #1b1b1b}

.v3 .g{gap:0;border:1px solid #c9c4b8}
.v3 .t{background:#f4f3f0;border-right:1px solid #c9c4b8;border-bottom:1px solid #c9c4b8;position:relative}
.v3 .t:nth-child(2n){border-right:0}
.v3 .t:nth-child(n+3){border-bottom:0}
.v3 .chev{position:absolute;right:10px;bottom:8px;font-size:18px;font-weight:800;color:rgba(27,27,27,.45)}

.v4 .g{gap:10px}
.v4 .t{background:#1b1b1b;color:#f2eee6}
.v4 .lab .n{color:rgba(242,238,230,.55)}
</style>
</head>
<body>
<div class="wrap">
<h1>Les cartes du Réseau — quatre visuels</h1>
<p class="intro">Ce que tu gardes : le petit point de couleur, l'écriture machine, le compte, le gros picto. Ce qui change : la case elle-même, pour qu'on ait ENVIE d'appuyer dessus. Réponds par un numéro.</p>
<div id="zones"></div>
</div>
<script>
function pico(f,color,s){return '<span class="pico" style="color:'+(color||'#1b1b1b')+';width:'+(s||38)+'px;height:'+(s||38)+'px;-webkit-mask-image:url(picto/'+f+');mask-image:url(picto/'+f+')"></span>'}
const svgCroix=(c,s)=>'<svg viewBox="0 0 24 24" style="width:'+(s||38)+'px;height:'+(s||38)+'px" fill="'+c+'"><rect x="9.3" y="4" width="5.4" height="16" rx="2.4"/><rect x="4" y="9.3" width="16" height="5.4" rx="2.4"/></svg>';
const D=[
 ['MÉDICAL','15','#6cb392','CROIX'],
 ['SOCIAL','28','#f3c6da','social.svg'],
 ['ACCOMPAGNEMENT','1','#5b8fd4','accompagnement.svg'],
 ['ENFANTS','12','#b28b7a','educatif.svg']
];
function tuiles(pic,chev){
  return '<div class="g">'+D.map(d=>{
    const ic=d[3]==='CROIX'?svgCroix(pic||'#1b1b1b'):pico(d[3],pic||'#1b1b1b');
    return '<span class="t"><span class="lab mono"><span class="dot" style="background:'+d[2]+'"></span>'+d[0]+' <span class="n">'+d[1]+'</span></span>'+
      '<span class="pi">'+ic+'</span>'+(chev?'<span class="chev">›</span>':'')+'</span>';
  }).join('')+'</div>';
}
const V=[
 ['1 · Cerclées de noir — comme tes cartes de listes',
  'Chaque domaine devient une carte BLANCHE cerclée de noir 2 px, détachée des autres — le même langage que les cartes cerclées que tu as choisies pour les listes. Blanc sur crème + trait fort = on voit le bouton.',
  '<div class="v1">'+tuiles()+'</div>'],
 ['2 · L\'ombre décalée — effet autocollant',
  'Carte blanche, trait noir, et une OMBRE PLEINE décalée en bas à droite, comme un autocollant posé sur la page. C\'est graphique, très « affiche », et ça donne clairement envie d\'appuyer. Quand on appuie, la carte s\'enfonce.',
  '<div class="v2">'+tuiles()+'</div>'],
 ['3 · La grille + le petit chevron',
  'Ta grille actuelle ne bouge presque pas : on ajoute juste un petit « › » dans le coin de chaque case, le signe universel « ça s\'ouvre ». Le plus discret des quatre.',
  '<div class="v3">'+tuiles(null,true)+'</div>'],
 ['4 · Les pavés noirs — comme l\'accueil',
  'Les cases passent en NOIR à picto couleur, comme les pavés du haut de l\'accueil que tu trouves très jolis. Le Réseau devient un grand damier de boutons — impossible de croire que ça ne se touche pas.',
  '<div class="v4"><div class="g">'+D.map(d=>{
    const ic=d[3]==='CROIX'?svgCroix(d[2]):pico(d[3],d[2]);
    return '<span class="t"><span class="lab mono"><span class="dot" style="background:'+d[2]+'"></span>'+d[0]+' <span class="n">'+d[1]+'</span></span><span class="pi">'+ic+'</span></span>';
  }).join('')+'</div></div>']
];
document.getElementById('zones').innerHTML=V.map(v=>
 '<div class="variant"><span class="vtag">'+v[0]+'</span><p class="vdesc">'+v[1]+'</p><div class="phone">'+v[2]+'</div></div>').join('');
</script>
</body>
</html>
