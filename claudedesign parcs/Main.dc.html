:root{
  color-scheme:light only;
  --creme:#f0efed; --noir:#1b1b1b; --enc2:#73716b; --ligne:#d6d4d0;
  /* ═══ LES CONTOURS, ADOUCIS (Mag, 20/08/2026) ═══
     « Je n'aime pas le contraste de ces boutons. Trop noir, trop gras les contours. »
     « Et ceci en règle générale. »

     Le noir plein autour de CHAQUE bouton et de CHAQUE carte fabriquait une grille
     de traits durs : sur une page de filtres, on voyait les boîtes avant de lire les
     mots. Le trait passe donc à un noir DÉTEINT et s'affine — le contraste continue
     de venir du texte, qui reste noir plein, et des aplats de couleur.

     ⚠ DEUX VALEURS ET PAS UNE : `--trait` pour l'ordinaire (les boutons, les
     cartes), `--trait-fort` pour ce qui doit encore se détacher (les feuilles qui
     montent, les grandes cartes du jour). Sans ce second cran, tout s'aplatit et
     plus rien ne dit ce qui compte.
     ⚠ CE SONT DES RÉGLAGES : si c'est encore trop, ou pas assez, ces deux lignes
     suffisent — on ne repasse pas sur les 140 endroits. */
  --trait:rgba(27,27,27,.44); --trait-fort:rgba(27,27,27,.62);
  --rouge:#e63329; --danger:#e63329; --jaune:#f5c542;
  --pad:16px;
  --tab-h:calc(88px + env(safe-area-inset-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* LA MAIN SUR TOUT CE QUI SE CLIQUE (Mag, 08/08/2026 : « je veux qu'il y ait la
   main sur tous les boutons de ce site, j'aime pas quand il y a que le pointeur »).
   Les boutons du navigateur n'ont PAS la main par défaut — chaque bloc de l'app
   devait la redemander, et un oubli suffisait à la perdre. Posée une fois pour
   toutes ici, y compris sur les fausses cartes cliquables (role="button") et les
   cases à cocher. Sauf ce qui est désactivé : là, la flèche est la bonne réponse. */
button,summary,label,select,[role="button"],[onclick],a[href],input[type=checkbox],input[type=radio]{cursor:pointer}
button:disabled,[aria-disabled="true"],.dort,.disabled{cursor:default}
body{font-family:'Eastman',-apple-system,'Segoe UI',sans-serif;background:var(--creme);color:var(--noir);
  font-size:16px;line-height:1.45;padding-bottom:var(--tab-h);
  padding-top:calc(68px + env(safe-area-inset-top))}
body.no-tabs{padding-bottom:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ---------- L'ÉCRAN DE CONNEXION (réservé à l'équipe) ----------
   Repris tel quel de l'app actuelle — son arc-en-ciel, son « BIENVENUE SUR », son
   logo — recalé sur le langage « grille » (crème, noir, angles de 6px). */
.auth-gate{position:fixed;inset:0;z-index:9999;background:var(--creme);color:var(--noir);
  display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.auth-gate.off{display:none}
.auth-box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center}
.auth-arc{width:67%;height:auto;display:block;margin:0 auto}
/* « BIENVENUE » débordait largement de l'arc-en-ciel (Mag, 08/08/2026). Il est calé
   sur sa largeur : l'arc fait 67 % de la boîte, le mot doit tenir dans le même geste. */
.auth-bienvenue{font-family:'Eastman',sans-serif;font-size:min(11.2vw,45px);font-weight:700;
  line-height:.86;letter-spacing:-.035em;text-transform:uppercase;margin:14px 0 0;white-space:nowrap}
.auth-logo-img{width:27%;max-width:100px;height:auto;margin-top:16px}
.auth-loading{color:var(--enc2);font-size:14px;margin-top:40px}
.auth-google{margin-top:46px;width:100%;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  background:var(--noir);color:var(--creme);border:0;border-radius:6px;padding:17px 22px;font-size:15.5px;
  font-weight:500;transition:transform .16s cubic-bezier(.22,1,.36,1)}
.auth-google:active{transform:scale(.97)}
.auth-msg{margin-top:26px;color:#4a4844;font-size:14px;line-height:1.55;max-width:320px;white-space:pre-line}
.auth-mot{width:100%;margin-top:16px;border:1.25px solid var(--trait);border-radius:6px;padding:12px 14px;
  font:inherit;font-size:14px;background:#fdfdfc;color:var(--noir);resize:none}
.auth-mot:focus{outline:none}
.auth-switch{margin-top:18px;background:none;border:0;font-size:14px;font-weight:500;text-decoration:underline}
h1,h2,h3{font-weight:700;line-height:1.2}
.monoS{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8b8984}
::selection{background:#f3c6da}

/* ═══════════════════════════════════════════════════════════════════════
   LA FEUILLE IMPRIMÉE (08/08/2026). Une page de COUSIN doit pouvoir sortir sur
   papier : une liste de fiches qu'on emporte en visite, la liste du jour qu'on
   coche au stylo, le programme du mois qu'on affiche au mur.

   Le principe : tout ce qui sert à NAVIGUER disparaît (la barre, le dock, l'étoile,
   les flèches, les boutons), tout ce qui sert à LIRE reste. Et la feuille porte son
   titre et sa date — sans quoi, trois semaines plus tard, on ne sait plus si elle
   est à jour.
   ═══════════════════════════════════════════════════════════════════════ */
#printHead{display:none}
@media print{
  @page{ margin:15mm 18mm; }
  /* Les aplats de couleur sont gardés : ils PORTENT l'information (le bloc rouge d'un
     cours, la couleur d'un domaine). Sans ça le navigateur les efface tous. */
  *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  html,body{ background:#fff !important; padding:0 !important; margin:0 !important; height:auto !important }
  /* Ce qui sert à naviguer s'en va. */
  #topbar,#tabbar,#starbtn,#filbtn,#listebtn,.bascule,.imprbtn,.jxpied,.jxback,.cbtn,.hero .cbtn,
  .quiz-next,.acform,.cal-fl,.cal-sup,.fboutons,.fbtn,.chv,.sg,#popBg,#toast,
  .jrat,.jgrille,.pgn,.rail2{ display:none !important }
  #printHead{ display:flex !important; align-items:baseline; gap:14px;
    border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:16px }
  #printHead .ph-t{ font-size:19px; font-weight:700; text-transform:uppercase; letter-spacing:-.01em }
  #printHead .ph-d{ margin-left:auto; font-family:ui-monospace,monospace; font-size:10px; color:#444 }
  #view{ width:100% !important; max-width:100% !important; padding:0 !important }
  /* Rien ne se coupe au milieu d'une fiche, d'une tâche ou d'un cas. */
  .frow2,.fmod,.tache,.cal-e,.cc-cas,.cc-err,.rc,.fcarte{ break-inside:avoid; page-break-inside:avoid }
  /* Les listes de fiches : on serre, on garde le trait de gauche. */
  .frow2{ border:0 !important; border-bottom:1px solid #ccc !important; border-radius:0 !important;
    padding:6px 0 !important; background:none !important }
  .flist{ padding:0 !important }
  /* Une case à cocher imprimée est une case VIDE : c'est au stylo qu'on la remplit. */
  .tache .box,.pf-box,.ch-box{ border:1.5px solid #000 !important; background:none !important; border-radius:2px !important }
  .tache .box svg,.tache .box .pico,.pf-box svg,.pf-box .pico{ display:none !important }
  /* Le détail d'un cours s'imprime en entier, même replié à l'écran. */
  .cdet[open],.cdet{ border-top:1px solid #000 !important }
  .cdet .rich{ display:block !important }
  details>div{ display:block !important }
  /* Le calendrier tient sur la page. */
  #view .cal{ max-width:100% !important }
  .cal-c{ border-color:#bbb !important }
}
/* Le bouton, à l'écran seulement. */
.imprbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ligne);border-radius:5px;
  padding:8px 12px;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:#73716b;background:#fdfdfc}
.imprbtn svg,.imprbtn .pico{width:13px;height:13px}
@media (hover:hover){ .imprbtn:hover{border-color:var(--trait-fort);color:var(--noir)} }
.imprligne{display:flex;justify-content:flex-end;margin:14px 0 2px;max-width:620px}
/* ⚠ TOUT RÉTRÉCIT (Mag, 11/08/2026 : « mets en plus petit les boutons, le QR-code
   et le margin QR-code »). Sur un grand écran, le cadre du QR prenait toute la
   largeur et les deux boutons s'étiraient d'un bord à l'autre : une page qui ne
   sert qu'à montrer une adresse avait l'air d'un panneau d'affichage.
   ⚠ LE `max-width` FAIT LE GROS DU TRAVAIL. Rapetisser le QR sans borner le bloc
   n'aurait donné qu'un petit carré perdu au milieu d'un très grand cadre. */
/* ⚠ ET IL RESPIRE, ET IL EST CENTRÉ (Mag, 11/08/2026 : « pas assez d'espace,
   centre à la vertical le QR code »). Le bloc était collé sous le bandeau noir,
   avec tout le vide rejeté en dessous : ça donnait une page qui commence trop haut
   et qui s'arrête trop tôt. Maintenant il se pose AU MILIEU de la hauteur qui
   reste, et le vide se partage en haut et en bas.
   ⚠ `min-height` en `vh` plutôt qu'une hauteur fixe : la page doit tenir aussi bien
   sur un téléphone que sur l'écran du bureau. */
.pt{max-width:360px;margin:0 auto;padding:8px 0;
  min-height:56vh;display:flex;flex-direction:column;justify-content:center}
.pt-qr{background:#fdfdfc;border:1.25px solid var(--trait);border-radius:12px;padding:11px;
  display:flex;justify-content:center}
.pt-url{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.04em;text-align:center;
  margin-top:10px;word-break:break-all}
.pt-b{display:flex;gap:7px;margin-top:12px}
.pt-c{flex:1;background:var(--noir);color:#f0efed;border-radius:8px;padding:10px 8px;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.pt-c.clair{background:none;border:1.25px solid var(--trait);color:var(--noir)}
@media (hover:hover){ .pt-c:hover{filter:brightness(1.3)} .pt-c.clair:hover{background:var(--noir);color:#f0efed} }

/* ── LE DICTIONNAIRE (08/08/2026) ── */
#view .lex{max-width:620px;padding-top:14px}
.lx{border-bottom:1px solid var(--ligne);padding:12px 0}
.lx summary{cursor:pointer;list-style:none;display:block}
.lx summary::-webkit-details-marker{display:none}
.lx summary b{display:block;font-size:16px;font-weight:700;line-height:1.2}
.lx summary span{display:block;font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:3px}
.lx summary::after{content:'▾';float:right;margin-top:-38px;color:#8b8984;font-size:13px}
.lx[open] summary::after{content:'▴'}
.lx p{font-size:13px;color:#73716b;line-height:1.55;margin-top:9px;padding-left:11px;
  border-left:2px solid var(--ligne)}

/* ── ÉDUC (08/08/2026) ── */
#view .ed-g{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:14px;max-width:620px}
.ed-c{background:#fdfdfc;border:1.25px solid var(--trait);border-radius:9px;padding:13px;text-align:left;
  display:flex;flex-direction:column;min-height:96px}
.ed-c .ic{width:26px;height:26px}
.ed-c b{display:block;font-size:15px;font-weight:600;margin-top:auto;line-height:1.2}
.ed-c em{font-style:normal;display:block;font-size:12px;color:#73716b;line-height:1.35;margin-top:3px}
.ed-p{border:1px solid var(--ligne);border-left:5px solid var(--ligne);background:#fdfdfc;
  border-radius:0 8px 8px 0;padding:14px;margin-bottom:11px;max-width:620px}
.ed-p>b{display:block;font-size:16.5px;font-weight:700;line-height:1.2;margin-bottom:10px}
.ed-l{font-size:13.5px;color:#3c3a36;line-height:1.5;margin-top:9px}
.ed-l i{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-bottom:2px}
.ed-l.ev{background:#f6f5f3;border-radius:6px;padding:9px 11px}
@media (hover:hover){ .ed-c:hover{background:var(--noir);color:#f0efed} .ed-c:hover em{color:rgba(240,239,237,.7)} }

/* ── LES SCHÉMAS À DONNER (08/08/2026) ── */
#view .sch{max-width:620px}
.sch-q{margin-top:20px}
.sch-q.fait{opacity:.65}
.sch-qt{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:500}
.sch-qt i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--noir);
  color:#f0efed;display:flex;align-items:center;justify-content:center;font-size:12px}
.sch-o{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;padding-left:34px}
.sch-b{border:1.25px solid var(--trait);border-radius:20px;padding:8px 14px;font-size:13.5px;background:#fdfdfc}
.sch-b.on{background:var(--noir);color:#f0efed}
.sch-lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px}
.sch-lg button{border:1px solid var(--ligne);border-radius:18px;padding:7px 13px;font-size:12.5px;background:#fdfdfc}
.sch-lg button.on{background:var(--noir);color:#f0efed;border-color:var(--trait-fort)}
/* LA FEUILLE — identique à l'écran et sur le papier, pour qu'il n'y ait pas de surprise. */
.sch-f{border:1px solid var(--ligne);background:#fdfdfc;border-radius:8px;padding:16px;margin-top:14px}
.sch-f.rtl{direction:rtl;text-align:right}
.sch-ft{border-bottom:3px solid;padding-bottom:9px;margin-bottom:14px}
.sch-ft b{display:block;font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sch-ft em{font-style:normal;display:block;font-size:13px;color:#73716b;margin-top:3px}
.sch-e{display:flex;gap:11px;margin-bottom:12px}
.sch-f.rtl .sch-e{flex-direction:row-reverse}
.sch-e i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;color:#1b1b1b;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700}
.sch-e b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.sch-e em{font-style:normal;display:block;font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:3px}
.sch-mt{border:1px solid var(--ligne);background:#f6f5f3;border-radius:6px;padding:11px 13px;margin-top:14px}
.sch-mt b{display:block;font-size:14.5px;font-weight:700}
.sch-mt em{font-style:normal;display:block;font-size:13px;color:#3c3a36;line-height:1.45;margin-top:4px}
.sch-a{border-left:4px solid var(--rouge);background:#fdf4f3;padding:10px 12px;margin-top:12px;
  font-size:13px;color:#3c3a36;line-height:1.45}
.sch-f.rtl .sch-a{border-left:0;border-right:4px solid var(--rouge)}
.sch-tr{font-size:11.5px;color:#8b8984;line-height:1.45;margin-top:11px;padding-top:9px;border-top:1px solid var(--ligne)}
.sch-act{display:flex;gap:8px;margin-top:16px}
.sch-impr{flex:2;background:var(--noir);color:#f0efed;border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.sch-rel{flex:1;border:1.25px solid var(--trait);border-radius:8px;padding:14px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.sch-rec{flex:1;border:1.5px solid var(--ligne);border-radius:8px;padding:14px;color:#73716b;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
/* Sur le papier : pas de cadre ni de fond, la feuille EST la page. */
.sch-f.papier{border:0;background:none;border-radius:0;padding:0;margin:0}
.sch-f.papier .sch-ft b{font-size:25px}
.sch-f.papier .sch-e{margin-bottom:15px}

/* ── LA CARTE DE QUESTION (08/08/2026) ── */
/* La carte s'ajuste au contenu. Avant elle s'étirait sur toute la hauteur de l'écran
   et laissait un trou entre la question et les réponses. Elle garde un minimum pour
   ne pas sauter d'une question à l'autre, mais elle ne se force plus. */
.qz{background:#1b1b1b;border-radius:12px;padding:20px 18px 18px;color:#f0efed;
  min-height:340px;max-width:620px;display:flex;flex-direction:column}
.qz-tete{display:flex;align-items:center}
.qz-dots{display:flex;gap:6px;align-items:center}
.qz-dots i{width:9px;height:9px;border-radius:50%;background:#3d3d3d;flex:none}
.qz-dots i.ok{background:#6FC7D9}
.qz-dots i.ko{background:#E8308A}
.qz-dots i.ici{width:11px;height:11px;background:#f0efed}
/* La barre de progression : ce qui est juste en bleu, ce qui est raté en fuchsia,
   le reste en creux. On lit sa partie d'un coup d'œil sans compter des ronds. */
.qz-barre{flex:1;height:5px;border-radius:3px;background:#3d3d3d;overflow:hidden;display:flex;max-width:180px}
.qz-barre i{display:block;height:100%}
.qz-barre i.ok{background:#6FC7D9}
.qz-barre i.ko{background:#E8308A}
.qz-sc{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:#9a9894;margin-left:10px}
.qz-n{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:#F5D34F}
.qz-sur{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#9a9894;margin-top:14px}
.qz-q{font-size:25px;font-weight:500;line-height:1.2;letter-spacing:-.02em;margin-top:12px}
.qz-q.petite{font-size:20px}
/* Les réponses sont ANCRÉES EN BAS : la question grandit vers le haut, le pouce les
   retrouve toujours au même endroit. */
.qz-opts{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:9px}
/* ═══ LES RÉPONSES SONT DES CARTONS PLEINS — piste C, choisie par Mag le 08/08/2026 ═══
   « J'ai l'impression que c'est un message d'erreur. Et c'est pas une erreur, en fait. »
   Le coupable n'était PAS le fond noir : elle y tient (« j'aimais bien le noir, le vrai,
   pas ton noir et gris »). C'étaient les quatre rectangles CREUX, cerclés de #4a4a4a,
   qui ne pesaient rien — un cadre vide sur du noir, c'est un formulaire en panne.
   Un carton blanc posé sur du noir, c'est une carte à jouer.

   Et la pastille de la lettre est PLEINE ET COLORÉE, une couleur par position : la page
   a de la couleur AVANT qu'on ait répondu, ce qui manquait le plus. Ces couleurs ne
   veulent rien dire — ce ne sont pas des indices. Elles sont toujours dans le même ordre
   pour qu'on ne cherche pas un sens qui n'existe pas. */
.qz-opt{display:flex;align-items:center;gap:12px;background:#fdfdfc;border:1.5px solid #fdfdfc;
  border-radius:10px;padding:13px 14px;color:#1b1b1b;text-align:left;width:100%}
.qz-l{flex:none;width:24px;height:24px;border-radius:50%;
  background:#1b1b1b;color:#fdfdfc;border:1.5px solid #1b1b1b;
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:10px}
.qz-t{font-size:15px;font-weight:500;line-height:1.3}
/* ⚠ `:not(.bon):not(.rate)` : après la réponse, les deux lignes qui restent ont leurs
   propres couleurs (bleu / rose) et ne doivent PAS reprendre la couleur de position —
   sinon la bonne réponse hériterait de la pastille jaune du premier rang.
   ⚠ Le bleu de la 2e pastille est #5b8fd4, PAS le #6FC7D9 de la bonne réponse : avec le
   même bleu, on aurait cru que B était la bonne avant même de répondre. */
.qz-opt:not(.bon):not(.rate):nth-child(1) .qz-l{background:#F5D34F;color:#1b1b1b;border-color:#F5D34F}
.qz-opt:not(.bon):not(.rate):nth-child(2) .qz-l{background:#5b8fd4;color:#1b1b1b;border-color:#5b8fd4}
.qz-opt:not(.bon):not(.rate):nth-child(3) .qz-l{background:#E8308A;color:#fdfdfc;border-color:#E8308A}
.qz-opt:not(.bon):not(.rate):nth-child(4) .qz-l{background:#6cb392;color:#1b1b1b;border-color:#6cb392}
.qz-opt:not(.bon):not(.rate):nth-child(5) .qz-l{background:#b28b7a;color:#fdfdfc;border-color:#b28b7a}
.qz-opt:not(.bon):not(.rate):nth-child(6) .qz-l{background:#A9C8E8;color:#1b1b1b;border-color:#A9C8E8}
.qz-opt.bon{background:#6FC7D9;border-color:#6FC7D9;color:#1b1b1b}
.qz-opt.bon .qz-l{background:#1b1b1b;color:#6FC7D9;border-color:#1b1b1b}
/* LA RATÉE EST PLEINE ELLE AUSSI. En filet rose sur fond noir, elle redevenait le seul
   objet creux de l'écran — donc la seule chose qui ait encore l'air d'une panne, et
   justement à l'endroit où on vient de se tromper. */
.qz-opt.rate{background:#E8308A;border-color:#E8308A;color:#fdfdfc}
.qz-opt.rate .qz-l{background:#fdfdfc;color:#E8308A;border-color:#fdfdfc}
/* « Rajouter un peu de blanc dedans » (Mag) : le bloc Pourquoi passe du gris #262626
   au blanc, avec son texte en noir. Le filet jaune reste, c'est lui qui le rattache
   au compteur du haut. */
.qz-pq{border-left:5px solid #F5D34F;background:#fdfdfc;border-radius:0 8px 8px 0;
  padding:12px 13px;margin-top:16px;color:#1b1b1b}
.qz-pql{font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#8a857c}
.qz-pqt{font-size:13.5px;color:#1b1b1b;line-height:1.5;margin-top:5px}
.qz-fiche{margin-top:11px;width:100%;border:1.5px solid #1b1b1b;border-radius:7px;padding:9px;
  color:#1b1b1b;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
/* Le chevron de Mag, retourné, pour les boutons qui AVANCENT. On ne dessine pas un
   second chevron : c'est le même trait, à l'envers — sinon les deux finiraient par
   ne plus se ressembler. */
.ic.rot180{transform:rotate(180deg)}
.qz-suite{width:100%;background:#F5D34F;color:#1b1b1b;border:0;border-radius:10px;padding:14px;
  margin-top:12px;font-size:15px;font-weight:500}
@media (hover:hover){ .qz-opt:hover{border-color:#F5D34F} .qz-fiche:hover{background:#1b1b1b;color:#fdfdfc} }

/* ── L'ACCUEIL DU 08/08/2026 : météo réduite, rail du réseau, bande noire des jeux ── */
/* La météo devient la seconde pastille. Elle passe en ROUGE quand il y a une alerte
   — gel, forte pluie, forte chaleur : c'est une alerte, pas une information de plus. */
.meteoL{display:inline-flex;align-items:center;gap:5px;flex:none;
  border:1px solid var(--ligne);border-radius:999px;background:#fdfdfc;padding:4px 9px;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.06em;color:#73716b}
.meteoL.alerte{border-color:var(--rouge);color:var(--rouge)}
.meteoL.alerte b{color:var(--rouge)}
/* Le picto météo porte un width:100% en style en ligne : sans !important il gonfle
   et fait 170 px de haut dans la ligne de date. */
/* ═══ L'EN-TÊTE, IDÉE 3 : DEUX PASTILLES À DROITE (Mag, 08/08/2026) ═══
   Elle a choisi la 3 parmi les quatre de propositions/entete.html.

   ⚠ LE DÉFAUT D'AVANT ÉTAIT UNE RÈGLE EN TROP, pas un mauvais dessin : le bus ET la
   météo demandaient tous les deux `margin-left:auto`. Le premier avalait toute la
   place libre, le second réclamait la même, et à 414 px la ligne se cassait en deux.
   Un seul `auto` maintenant, sur le groupe des deux pastilles.

   La date peut être rognée si la place manque ; les pastilles, jamais — c'est le bus
   qui fait sortir maintenant, et la chaleur qui change la journée. */
.hdate .hbadges{display:inline-flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.busL{display:inline-flex;align-items:center;gap:5px;flex:none;
  border:1px solid var(--ligne);border-radius:999px;background:#fdfdfc;padding:3px 9px 3px 3px;
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.06em;color:var(--enc2)}
.busL b{font-family:'Eastman',system-ui,sans-serif;font-size:9.5px;font-weight:700;letter-spacing:0;
  background:var(--noir);color:#f2eee6;border-radius:999px;padding:2px 6px}
.busL em{font-style:normal;color:#a8a5a0}
/* La date se laisse rogner, elle seule : elle est la moins urgente des trois. */
.hdate .hjour{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meteoL svg,.meteoL .pico{width:14px!important;height:14px!important;flex:none}
.meteoL b{font-weight:600;color:var(--noir)}
.meteoL em{font-style:normal}
.meteoL.alerte b,.meteoL.alerte em{color:var(--rouge)}
.hdate{display:flex;align-items:center;gap:10px}

/* Le cadre « En tête de ton réseau » (.rres-boite, .rres-t, .rres, .rpast) est parti
   le 08/08/2026 avec le bloc lui-même : plus rien ne portait ces classes. */

/* LES JEUX DANS LEUR CARTE. On avait d'abord fait une bande pleine largeur pour bien
   séparer — Mag préfère un cadre avec de l'air autour, plus aéré. La séparation tient
   alors au fond noir et à la marge, pas au débord. */
.zjeux{background:#161616;color:#f0efed;margin:26px 0 0;padding:17px 16px 20px;border-radius:12px;max-width:620px}
/* Les blocs de l'accueil gardent une largeur de lecture sur grand écran : étirés sur
   1200 px, ils étaient à moitié vides et illisibles (Mag, 08/08/2026). */
/* ⚠ LE HAUT DE L'ACCUEIL RESTE EN LARGE (Mag, 08/08/2026 : « ça sur l'écran, tu
   peux le laisser en large »). Le bonjour, la date, la météo et le filet
   « À faire aujourd'hui » prennent toute la largeur — c'est un titre de page, il
   n'a pas besoin d'une largeur de lecture. Seuls les BLOCS de contenu sont bridés,
   parce qu'eux deviennent illisibles étirés sur 1200 px. */
#view .boules{max-width:620px}
/* ── ET ILS SE CENTRENT (Mag, 08/08/2026 : « sur écran refais le responsive, recentre »).
   On leur avait donné une largeur de lecture sans jamais leur dire où se mettre : ils
   restaient donc collés à GAUCHE d'une vue de 1200 px, avec un demi-écran de vide à
   droite. Les grilles du Réseau et du Centre, elles, se servent vraiment de toute la
   largeur — on ne touche donc qu'à ce qui est bridé à 620 px. */
/* ══ L'ACCUEIL EN DEUX COLONNES SUR GRAND ÉCRAN (Mag, 08/08/2026 : « la mise en
   page de l'accueil, ça pète tout le responsive, t'as affaire de colonnes ») ══
   Le tort était de garder une seule colonne de 620 px collée à gauche : sur 1500 px,
   ça laissait la moitié de l'écran vide. Le bandeau reste en large, comme elle l'a
   demandé, et le contenu se répartit en dessous — le travail du jour et les listes à
   gauche, la bande noire des jeux à droite, qui tient toute la hauteur.
   `align-items:start` : sans lui, chaque bloc s'étirerait pour remplir sa rangée. */
/* ═══ SUR GRAND ÉCRAN, LES JEUX SONT UN PANNEAU FIXE AU BORD DROIT ═══
   (Mag, 08/08/2026 : « mets-le à 100 % de hauteur et colle-le au bord droit de
   l'écran, en fixe — parce que ce sticky, c'est pas joli ».)

   Avant : la bande vivait dans la colonne de droite d'une grille, en `sticky`.
   Elle décollait du haut de sa colonne dès qu'on descendait, se recollait plus
   bas, et laissait un vide crème au-dessus d'elle — un bloc noir qui flotte au
   milieu de rien.

   Maintenant elle sort de la grille : plaquée en haut, en bas et à droite de la
   fenêtre, sans arrondi, comme le rail noir de gauche. L'accueil se retrouve
   donc pris entre deux panneaux noirs, le rail et les jeux, et le travail est
   au milieu.

   ⚠ `screen and` : sans ça, un panneau POSITION:FIXED partirait aussi à
   l'impression, où il se collerait sur toutes les pages.
   ⚠ `padding-right` sur le body, sinon le contenu passerait dessous — mais
   SEULEMENT sur l'accueil (`body.at-home`), sinon toutes les autres pages
   garderaient une bande vide de 360 px à droite, sans rien dedans. */
@media screen and (min-width:1000px){
  /* ⚠ LA RÉSERVE DE 360 PX EST PARTIE AVEC LA BANDE DES JEUX (piste B, 20/08/2026).
     Le panneau noir n'est plus rendu sur l'accueil : garder `padding-right` laissait
     une bande crème vide au bord droit. Les règles du panneau restent juste en
     dessous, elles ne matchent plus rien — elles reviennent d'un coup si elle
     redemande la bande. */
  /* Plus de deux colonnes : la colonne de droite est devenue le panneau. */
  #view .home-top{display:block}
  #view .home-top > .zjeux{
    position:fixed;top:0;right:0;bottom:0;width:360px;
    margin:0;max-width:none;border-radius:0;
    display:flex;flex-direction:column;justify-content:center;
    padding:26px 24px;overflow-y:auto;z-index:20}
  /* La pile est plus compacte dans le panneau : elle doit tenir en entier sans
     qu'on ait à faire défiler quoi que ce soit. */
  #view .home-top > .zjeux .pile{max-width:250px;margin:24px auto 0}
  #view .home-top > .zjeux .pilenav{margin-top:8px}
  #view .boules{max-width:none}
}
@media (min-width:900px){
  #view .zjeux,
  #view .grosses, #view .dormeuses, #view .tuiles,
  #view .lienbas, #view .pt, #view .lex, #view .ed-g, #view .sch, #view .qneuf,
  #view .cal, #view .acform, #view .cc, #view .cdet, #view .rich,
  #view .imprligne, #view .f-page, #view .quiz-card
  { margin-left:auto; margin-right:auto; }
}
/* L'espace laissé par le titre retiré. Même hauteur que lui : la bande garde son
   équilibre, les cartes ne remontent pas contre le bord. */
.zj-air{height:14px}
.zj-t{font-size:22px;font-weight:500;letter-spacing:-.02em}
.zj-chif{display:flex;gap:8px;margin-top:14px}
.zj-chif span{flex:1;background:#262626;border-radius:8px;padding:10px 11px}
.zj-chif b{display:block;font-size:21px;font-weight:500;line-height:1;color:#F5D34F}
.zj-chif span:nth-child(2) b{color:#6FC7D9}
.zj-chif span:nth-child(3) b{color:#E8308A}
.zj-chif em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;color:#9a9894;margin-top:4px}
/* Une carte de jeu NOIRE sur la bande NOIRE disparaît. Dans la bande, les cartes
   sombres reçoivent donc un filet clair — la couleur reste la leur, on les voit. */
/* Les cartes penchées mordent vers le haut : il leur faut plus d'air que d'habitude,
   sinon la première recouvre les chiffres. */
.zjeux .pile{margin:34px auto 0}
/* Filet plus épais et plus franc : sur la bande noire, un liseré de 1,5 px se
   perdait (Mag : « il faut mettre un plus gros bord blanc »). */
.zjeux .pcarte{box-shadow:0 0 0 3.5px #f0efed}
/* ⚠ LES CARTES QUI DÉPASSENT DISPARAISSAIENT (Mag, 08/08/2026 : « les dernières
   cartes, ça déconne encore »). Deux jeux sont NOIRS — Chrono 60 s et L'équipe cette
   semaine — et le bloc des jeux est noir aussi. Leur filet était un noir à 8 % : sur
   du noir, invisible. Quand l'un des deux passait derrière, la pile perdait une carte
   d'un côté et paraissait de travers. Et comme ce sont les deux DERNIERS jeux, ça
   n'arrivait qu'en fin de pile — d'où « les dernières ».
   Le filet passe en crème, et seulement dans le bloc noir : sur la page des jeux, qui
   est claire, l'ancien filet sombre reste le bon. */
.zjeux .pile .p1,.zjeux .pile .p2{box-shadow:0 0 0 1.5px rgba(242,238,230,.38)}
.zjeux .p1,.zjeux .p2{box-shadow:0 0 0 2px rgba(240,239,237,.6)}
/* Le dé « au hasard » sur fond noir : cercle et picto bien clairs, sinon il disparaît. */
.zjeux .pile .tirer .rd{border-color:rgba(240,239,237,.75)}
.zjeux .pile .tirer .rd .ic{color:#f0efed}
.zjeux .pile .tirer span{color:rgba(240,239,237,.75)}
.zj-pied{display:flex;gap:8px;margin-top:16px}
.zj-b{flex:1;border:1px solid #4a4a4a;border-radius:8px;padding:11px;color:#f0efed;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.zj-b.plein{background:#E8308A;border-color:#E8308A;color:#fff;font-weight:600}
@media (hover:hover){ .zj-b:hover{border-color:#f0efed} }

/* LE CALENDRIER DU MOIS. Une grille se lit d'un coup d'œil : c'est sa raison d'être,
   donc les cases restent carrées et les points de couleur disent ce qui tombe ce jour-là. */
/* La carte qui presse : filet jaune à gauche, rien de plus — c'est un rappel, pas
   une alerte. Le rouge reste aux urgences. */
.qcarte.urgent{border-left:5px solid #f5c542}
#view .qneuf{max-width:620px;padding-top:16px}
#view .qneuf .sectl{margin-top:22px}
#view .qneuf .msg{margin-bottom:9px;font-size:14.5px;line-height:1.5}
#view .cal{max-width:620px;margin:16px 0 6px}
.cal-tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-tete span{flex:1;text-align:center;font-size:16px;font-weight:600;text-transform:capitalize}
.cal-fl{width:36px;height:36px;flex:none;border:1.25px solid var(--trait);border-radius:6px;
  display:flex;align-items:center;justify-content:center}
.cal-fl .ic,.cal-fl svg,.cal-fl .pico{width:13px;height:13px}
.cal-fl.droite{transform:rotate(180deg)}
.cal-j{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-j span{text-align:center;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;color:#8b8984}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-c{aspect-ratio:1;border:1px solid var(--ligne);border-radius:5px;background:#fdfdfc;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal-c.hors{border-color:transparent;background:transparent}
.cal-n{font-size:13.5px;font-weight:500;line-height:1}
.cal-c.hors .cal-n{opacity:0}
.cal-c.auj{border:1.5px solid var(--trait-fort)}
.cal-c.choisi{background:var(--noir);color:#f0efed;border-color:var(--trait-fort)}
.cal-pts{display:flex;gap:2px;height:5px}
.cal-pts i{width:5px;height:5px;border-radius:50%}
/* ══ L'AGENDA COLORÉ — IDÉE 6, « le mélange » (Mag, 08/08/2026) ══
   Trois choses reprises du calendrier de congés qu'elle a envoyé :
   ① LES JOURS VIDES ONT UNE MATIÈRE. Gris pâle et non blanc : le mois devient un
     objet plein où les jours occupés se détachent, au lieu d'une grille où l'on
     cherche des points.
   ② LES JOURS QUI SE SUIVENT FORMENT UNE SEULE BARRE. Trois points identiques
     côte à côte ne disent pas « du 21 au 23 » — une barre, si.
   ③ LA LÉGENDE NOMME. Elle ne classe pas des couleurs, elle écrit ce qu'il y a et
     quand. On n'a plus besoin de cliquer chaque jour pour connaître le mois.
   Et la couleur, elle, dit LE PUBLIC — parce que la question qu'on se pose devant
   un agenda n'est pas « quelle asbl ? », c'est « puis-je y envoyer cette
   personne ? ». */
/* Le jour vide : gris plein, sans filet. C'est le fond du mois, pas une case à
   remplir — et c'est lui qui fait ressortir les autres. */
.cal-c.gris{background:#eceae4;border-color:transparent;color:#8b8984}
/* Le jour occupé : un aplat plein, sa couleur posée à l'écriture du calendrier.
   Le filet disparaît — c'est le bloc de couleur qui dessine le jour, pas son cadre. */
.cal-c.occupe{border-color:transparent}
.cal-c.occupe .cal-n{color:inherit;font-weight:600}
/* Les publics en plus, quand un jour en porte plusieurs : de petites pastilles
   cerclées de blanc, pour rester lisibles sur n'importe quel aplat. */
.cal-pts i.autre{width:7px;height:7px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
/* La plage : plus de gouttière entre les cases, et l'aplat ne s'arrondit qu'à ses
   deux bouts. Les jours qui se suivent forment alors un seul bloc.
   (Le fond d'une case déborde sous sa bordure — c'est ce qui fait que deux cases
   voisines se touchent vraiment, sans liseré au milieu.) */
.cal-g.aplages{column-gap:0}
.cal-c.plage{border-radius:0}
.cal-c.plage.g{border-radius:5px 0 0 5px}
.cal-c.plage.d{border-radius:0 5px 5px 0}
/* LE JOUR CHOISI PASSE EN NOIR (Mag, 08/08/2026 : « j'aime bien que quand on clique
   ce soit noir, comme ça il y a les couleurs qui ressortent »).
   ⚠ LE `!important` EST NÉCESSAIRE, et c'est tout le bug qu'elle avait vu : la
   couleur d'un jour occupé est posée en style d'élément, à l'écriture du calendrier
   — un style d'élément gagne toujours contre une feuille de style. Sans lui, le
   fond restait clair pendant que le chiffre, lui, passait en clair : « on voit plus
   le numéro quand je clique dessus ». */
.cal-c.choisi{background:var(--noir)!important;color:#f0efed!important;border-color:var(--trait-fort)}
.cal-c.choisi .cal-n{color:#f0efed}
.cal-c.auj{border:1.5px solid var(--trait-fort)}
.legn{margin-top:14px;border-top:1px solid var(--ligne);padding-top:12px}
.legn-t{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--enc2);margin-bottom:10px}
.legn-l{display:grid;grid-template-columns:11px 1fr;gap:9px;align-items:baseline;margin-bottom:10px}
.legn-l i{width:11px;height:11px;border-radius:50%;align-self:center}
.legn-l b{font-size:14px;font-weight:600;line-height:1.3}
.legn-l span{grid-column:2;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--enc2);margin-top:2px;display:block;line-height:1.6}
/* Le public, dit en toutes lettres sous le jour choisi — c'est ce qu'elle a
   demandé : « en dessous on voit sortie pour femmes, sortie mixte ». */
.cal-qui{display:inline-block;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#1b1b1b;padding:2px 7px;margin-top:6px}
.cal-jour{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  margin:16px 0 9px;padding-bottom:7px;border-bottom:2px solid var(--noir)}
.cal-e{border:1px solid var(--ligne);border-left:5px solid var(--ligne);background:#fdfdfc;
  border-radius:0 6px 6px 0;padding:11px 13px;margin-bottom:8px}
.cal-e b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.cal-e em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.cal-e p{font-size:13.5px;color:#3c3a36;line-height:1.45;margin-top:5px}
.cal-e p.insc{color:#73716b;font-size:12.5px}
.cal-sup{margin-top:9px;border:1px solid var(--ligne);border-radius:4px;padding:6px 10px;
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#73716b}
.cal-vide{font-size:13.5px;color:#73716b;padding:2px 2px 6px}
/* Le formulaire : replié, parce qu'on lit le programme cent fois pour l'écrire une. */
#view .acform{max-width:620px;margin-top:16px;border:1px solid var(--ligne);border-radius:6px;background:#f6f5f3;padding:12px 13px}
.acform summary{cursor:pointer;list-style:none;font-family:ui-monospace,monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center}
.acform summary::-webkit-details-marker{display:none}
/* ── LA PASSATION : le haut en couleur, le réveil en rouge (Mag, 08/08/2026) ──
   « Mets le haut en couleur et les réveils en rouge. » Le bandeau bleu dit qu'on
   passe la main ; le rouge est réservé au réveil, parce qu'un réveil raté ne se
   rate pas à moitié — quelqu'un ne se lève pas à l'heure. */
#view .acform.pass{border-color:#A9C8E8}
.acform.pass summary{background:#A9C8E8;color:var(--noir);margin:-12px -13px 12px;
  padding:11px 13px;border-radius:5px 5px 0 0}
/* Le commentaire d'un réveil : en clair sous le texte, pas en petites capitales —
   c'est une phrase qu'on lit à 5 h du matin. */
.tache .tx em.passcom{font-family:'Eastman',system-ui,sans-serif;font-size:12.5px;
  letter-spacing:0;text-transform:none;color:var(--enc2);line-height:1.4;margin-top:4px}
.acform.pass .chdep-b.rev{border-color:var(--rouge)}
.acform.pass .chdep-b.rev b{color:var(--rouge)}
.acform.pass .chdep-b.rev.on{background:var(--rouge);border-color:var(--rouge)}
.acform.pass .chdep-b.rev.on b,.acform.pass .chdep-b.rev.on em{color:#fff}
.acform summary::after{content:'+';margin-left:auto;font-size:17px;line-height:1}
.acform[open] summary::after{content:'–'}
.acg{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.acg input{border:1px solid var(--ligne);border-radius:5px;padding:11px 12px;font-size:14.5px;
  background:#fdfdfc;color:var(--noir);font-family:inherit;width:100%}
.acduo{display:flex;gap:8px}
.acok{background:var(--noir);color:#f0efed;border-radius:6px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500}
.achint{font-size:12.5px;color:#73716b;line-height:1.5}
@media (hover:hover){ .cal-c:not(.hors):hover{border-color:var(--trait-fort)} .cal-sup:hover{border-color:var(--rouge);color:var(--rouge)} }

/* LE SCHÉMA EN TÊTE DE COURS. Bridé en largeur : Mag a trouvé la pleine largeur
   « beaucoup trop large » sur écran — un texte qui court sur 1200 px ne se lit pas. */
#view .cc{max-width:620px;margin:0 0 4px}
.cc-sur{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;color:#8b8984}
.cc-t{font-size:23px;font-weight:700;letter-spacing:-.028em;line-height:1.08;margin:6px 0 4px}
.cc-s{font-size:14px;color:#73716b;line-height:1.5;margin-bottom:15px}
.cc-q{background:var(--noir);color:#f0efed;border-radius:6px;padding:12px 14px;
  font-size:15px;font-weight:500;margin-bottom:11px}
.cc-cas{display:flex;gap:10px;margin-bottom:9px}
.cc-bar{flex:none;width:9px;border-radius:5px;display:flex;align-items:flex-start;justify-content:center}
.cc-bar i{font-style:normal;position:absolute;margin-left:-1px}
.cc-tx{flex:1;background:#fdfdfc;border:1px solid var(--ligne);border-radius:6px;padding:11px 13px;min-width:0}
/* > : seul le TITRE du cas passe en bloc. Sans ça, chaque gras du texte
   partait à la ligne tout seul. */
.cc-tx>b{display:block;font-size:15px;font-weight:500;line-height:1.25}
.cc-tx>span{display:block;font-size:13.5px;color:#3c3a36;line-height:1.5;margin-top:3px}
/* LE SEUL BLOC ROUGE DU COURS. Il est rare, c'est ce qui lui donne sa force. */
.cc-err{background:var(--rouge);color:#fff;border-radius:6px;padding:13px 14px;margin-top:15px;
  font-size:14px;line-height:1.5}
.cc-err .l{display:block;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.85;margin-bottom:5px}
.cc-err b{font-weight:600}
.cc-n{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:#8b8984;margin-top:14px}
/* Le détail : présent, mais replié — il ne disparaît pas. */
#view .cdet{max-width:620px;margin-top:16px;border-top:2px solid var(--noir);padding-top:12px}
.cdet summary{cursor:pointer;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:8px}
.cdet summary::-webkit-details-marker{display:none}
.cdet summary::after{content:'▾';margin-left:auto;font-size:13px;color:#8b8984}
.cdet[open] summary::after{content:'▴'}
.cdet .rich{margin-top:14px}
@media (min-width:900px){ .rich{max-width:620px} }

/* DANS LE CORPS D'UNE FORMATION (.rich), le texte est écrit à la main : un picto y
   arrive parfois sans sa boîte `.ic`, et un <svg> sans dimension prend alors TOUTE la
   largeur disponible — d'où les pictos géants (Mag, 07/08/2026). On leur impose la
   taille d'un mot, quel que soit l'endroit où ils sont posés. */
.rich svg,.rich .pico,.rich img.picoc{width:22px!important;height:22px!important;flex:none;vertical-align:-4px}
.rich .ic{width:22px;height:22px}
.pico{display:inline-block;width:24px;height:24px;background:currentColor;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;vertical-align:middle}
img.picoc{width:24px;height:24px;object-fit:contain;background:none}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px}
.ic svg,.ic .pico,.ic img{width:100%!important;height:100%!important}

#view{max-width:1080px;margin:0 auto;padding:0 var(--pad);animation:vin .22s ease}
/* ═══ L'ANIMATION D'ENTRÉE CASSAIT L'APERÇU TÉLÉPHONE (10/08/2026) ═══
   `vin` anime un `transform` sur #view. Or UN ANCÊTRE TRANSFORMÉ TRANSFORME AUSSI
   LE SENS DE `position:fixed` : l'enfant fixe cesse d'être calé sur la fenêtre et
   se cale sur cet ancêtre. Le calque de l'aperçu, censé faire 1024 × 880, mesurait
   donc 428 × 156 — la taille de son propre contenu — et le téléphone se dessinait
   minuscule en haut de l'écran. Rien n'était faux dans le calcul : c'est la
   référence qui avait changé sous ses pieds.
   ⚠ Le piège est invisible en test : l'animation dure 0,22 s, après quoi le
   transform revient à `none` et tout redevient normal. On ne le voit donc QUE si on
   mesure pendant l'animation — c'est-à-dire exactement au moment où l'app le fait.
   Quand l'aperçu est ouvert, #view ne s'anime plus. */
body.en-apercu #view{animation:none;transform:none}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- accueil : logo + titre original ---- */
.home-top{padding-top:14px}
.lgo{height:26px;display:block;margin-bottom:14px}
.home-title{font-family:'Eastman',sans-serif;font-size:min(11.8vw,47px);font-weight:700;text-transform:uppercase;
  text-align:left;color:var(--noir);letter-spacing:-.04em;line-height:.803em;margin:0 2px 18px;
  display:flex;flex-direction:column;gap:1px}
.home-title .tl{display:block}
.home-title .pico,.home-title .deco,.home-title .tdo{display:inline-block;vertical-align:baseline}

.deco-disq{width:.55em;height:.55em;margin-left:.09em;margin-bottom:.10em;color:#6cb392}
.deco-arc{width:1.06em;height:.55em;margin-left:.11em;margin-bottom:.08em}
.deco-fleur{width:.82em;height:.82em;margin-left:.09em;margin-bottom:-.12em;color:#fd8fd0}
.home-title .tl.last{display:flex;align-items:center}
.home-title .tl-txt{flex:0 0 auto}

/* ---- bandeau Urgences : noir, sirène rouge ---- */
.urg-banner{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--noir);padding:15px 16px;color:#f4f3f1;margin-bottom:14px;transition:transform .1s ease}
.hint{font-size:13.5px;color:var(--enc2)}
/* L'accueil : on garde l'inversion (fond noir + texte crème), elle est cohérente
   ici puisque les pictos y sont déjà en couleur vive. */
.hc:active{background:var(--noir)}
@media (hover:hover){}
.sacs{display:inline-flex;gap:4px;margin-left:4px}
.sacs i{font-style:normal;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center}

/* ---- la grille des domaines ---- */
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0;
  border:1px solid var(--ligne);border-top:0;margin-bottom:16px}
.tile{background:#f4f3f0;color:var(--noir);border-right:1px solid var(--ligne);border-bottom:1px solid var(--ligne);
  border-radius:0;padding:13px 12px 15px;min-height:132px;display:flex;flex-direction:column;text-align:left;
  transition:background .12s ease}
.tile:nth-child(2n){border-right:0}
.tile:active{background:var(--noir);color:#f4f3f1}
.tile:active small{color:rgba(242,238,230,.6)}
/* Au survol (souris) : la case s'inverse en noir — « sinon, on ne voit rien » (Mag). */
@media (hover:hover){
  .tile:hover{background:var(--noir);color:#f4f3f1}
  .tile:hover b{color:#f4f3f1!important}
  .tile:hover .tn,.tile:hover .tn2{color:rgba(242,238,230,.6)}
}
.tile:active b{color:#f4f3f1!important}
.tile:active .tn,.tile:active .tn2{color:rgba(242,238,230,.6)}
.tile b{font-family:ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;
  text-transform:uppercase;line-height:1.4}
.tile .tn{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.1em;color:var(--enc2);margin-left:7px;font-weight:500}
.tile .pi{margin:auto auto 0;width:42px;height:42px}
.tile .pi .ic{width:100%;height:100%}
/* Réseau : la grille fine au trait (l'autocollant essayé puis écarté par Mag le 05/08/2026),
   avec un CARRÉ de couleur devant le nom — plus gros que la police — et le compte dessous. */
.tsq{display:inline-block;width:15px;height:15px;margin-right:9px;vertical-align:-3px;flex:none}

/* ---- accueil personnalisé : blocs à gros filet de couleur (choix « 2 » de Mag, 05/08/2026) ---- */
/* « BONJOUR MAG » : la fonte EXACTE du grand titre du Réseau (.home-title), en NOIR. */
.hello{font-family:'Eastman',sans-serif;font-size:min(11.8vw,47px);font-weight:700;text-transform:uppercase;
  line-height:.92;letter-spacing:-.015em;color:var(--noir);flex:1;min-width:0}

/* ---- ACCUEIL redessiné (handoff Claude Design, 06/08/2026) ---- */
.hdate{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#8b8984}
/* La météo d'Anderlecht, sous le bonjour. */
.meteo{display:flex;align-items:center;gap:14px;border:1px solid var(--ligne);background:#f6f5f3;
  border-radius:6px;padding:13px 14px;margin-top:14px}
.meteo.alerte{border-color:var(--trait-fort);border-width:1.5px;background:#fdfdfc}
.meteo .mic{width:38px;height:38px;flex:none;color:var(--noir)}
.meteo .mtx{flex:1;min-width:0}
.meteo .mtx b{display:flex;align-items:baseline;gap:9px;font-size:24px;font-weight:700;line-height:1}
.meteo .mmot{font-family:ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--noir)}
.meteo .mtx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8b8984;margin-top:5px}
.meteo .malerte{display:block;font-size:13px;font-weight:500;color:var(--noir);margin-top:7px}
.hbonj{font-size:42px;font-weight:700;text-transform:uppercase;letter-spacing:-.035em;line-height:.84;
  margin-top:8px;display:flex;flex-direction:column;gap:1px;color:var(--noir)}
.hbonj span{display:block}
.hbonj i{display:inline-block;background:currentColor;-webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* Les formes du jour : même taille pour les deux, elles se répondent. */
.hbonj .bp{width:.72em;height:.72em;margin-left:.12em;margin-bottom:.04em}
/* En-tête de section : libellé machine souligné d'un trait noir de 2px */
/* ⚠ `gap` : sans lui, un titre long et son sous-titre se TOUCHAIENT — « SANS RIEN
   RÉSERVERGRATUIT, ON POUSSE LA PORTE » se lisait comme un seul mot (11/08/2026). */
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding-bottom:8px;
  border-bottom:2px solid var(--noir);margin-top:34px}
.sect b{font-family:ui-monospace,monospace;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.sect em{font-style:normal;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:#8b8984}
/* Variante « côte à côte » : le sous-texte suit le titre au lieu d'aller au bout. */
.sect.cote{justify-content:flex-start;gap:9px;margin-bottom:16px}
.sect.cote em{font-size:10.5px;letter-spacing:.2em;font-weight:500}

   pleine et colorée. Pas une couleur décorative — celle que la section porte DÉJÀ
   ailleurs dans l'app : le jaune de l'étoile, le vert du ticket. Le texte est
   toujours noir dessus, ces deux teintes sont trop claires pour porter du crème. */
/* `align-self:center` : la barre aligne ses enfants sur la LIGNE DE BASE du texte —
   une pastille alignée là-dessus pend sous le filet. */
.sectp{margin-left:auto;align-self:center;flex:none;display:inline-flex;align-items:center;gap:7px;
  border:1.25px solid var(--trait);border-radius:999px;padding:5px 12px;color:var(--noir);
  font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.sectp i{font-style:normal;font-size:12px;line-height:1}
/* ═══ LE BAS DE L'ACCUEIL, D'APRÈS LA MAQUETTE DE MAG (08/08/2026) ═══ */

/* La barre des étoiles : rose, cerclée de noir, l'étoile dorée à gauche et l'aperçu
   des fiches en jetons qui se chevauchent. */
.etbar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#f3cde5;border:1.25px solid var(--trait);border-radius:10px;padding:13px 15px;
  margin-top:26px;color:var(--noir)}
.etbar .et{width:22px;height:22px;flex:none}
.etbar b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.etbar .ap{margin-left:auto;display:flex;align-items:center;flex:none}
/* Le filet clair sépare les jetons qui se chevauchent ; le filet sombre à l'intérieur
   les fait exister même quand leur couleur est proche du rose de la barre — sinon un
   favori rangé dans un domaine rose devenait invisible. */
.etbar .ap i{width:22px;height:22px;border-radius:50%;border:2px solid #f3cde5;display:block;position:relative;
  box-shadow:inset 0 0 0 1.5px rgba(27,27,27,.22)}
.etbar .n{flex:none;font-family:ui-monospace,monospace;font-size:11px;color:#8b6f7c}
.etbar .ch{flex:none;font-size:18px;line-height:1;color:var(--noir)}

/* Les sorties en LISTE : la date à gauche dans sa colonne, le titre à droite.
   La première est pleine — c'est la prochaine qui arrive. */
.sortl{padding-top:14px}
/* ═══ LE MENU DES TROIS POINTS (Mag, 11/08/2026) ═══
   Il tombe sous le bouton, aligné à droite. Chaque ligne porte SON NOM : c'est tout
   l'intérêt de l'avoir sorti de la rangée de pictos.
   ⚠ Le voile derrière n'est pas décoratif : sans lui, un clic à côté ne referme pas
   le menu, et il reste ouvert par-dessus la page qu'on essaie de lire. */
/* Le voile FLOUTE la page au lieu de rester transparent : le menu est au milieu de
   l'écran, il faut que le reste s'efface derrière lui, sinon on lit deux choses à
   la fois. Le fondu est court — on ne fait pas attendre pour un menu.
   ⚠ `-webkit-` en plus : Safari sur iPhone ne connaît toujours que celui-là, et
   c'est le navigateur de la moitié de l'équipe. */
.mh-bg{position:fixed;inset:0;z-index:78;display:none;background:rgba(27,27,27,.28);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px)}
.mh-bg.on{display:block;animation:mhVoile .19s ease}
@keyframes mhVoile{ from{opacity:0} to{opacity:1} }
/* ═══ LE MENU AU CENTRE, SUR UN FOND FLOUTÉ (Mag, 11/08/2026) ═══
   « Tu peux écrire plus petit, c'est juste que je voulais qu'il y ait plus d'espace.
   Mets-le au centre de la page, et floute le cadre. »

   ⚠ CE QU'ELLE CORRIGE : j'avais lu « plus grand » comme « plus gros caractères ».
   Elle demandait de l'AIR, pas de la taille — ce n'est pas la même chose. Le texte
   redescend à 15,5 px, et c'est l'espace autour qui augmente : des lignes hautes,
   respirées, qu'on vise sans effort.

   ⚠ ET IL VIENT AU MILIEU. Collé en haut à droite, il pendait du bouton et se
   battait avec la page qui continuait de vivre derrière. Au centre, sur un fond
   flouté, il n'y a plus qu'une chose à regarder — c'est ce qu'on attend d'un menu
   qu'on vient d'ouvrir exprès. */
.mh{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:79;display:none;
  flex-direction:column;width:min(310px,calc(100vw - 48px));padding:14px;border-radius:18px;
  background:#fdfdfc;border:1.25px solid var(--trait);box-shadow:0 24px 60px rgba(27,27,27,.3)}
.mh.on{display:flex;animation:mhOuvre .19s cubic-bezier(.22,1,.36,1)}
@keyframes mhOuvre{
  from{opacity:0;transform:translate(-50%,-50%) scale(.94)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.mh button{display:flex;align-items:center;gap:15px;width:100%;text-align:left;
  padding:16px 14px;border:0;border-radius:11px;background:transparent;color:var(--noir);
  font-family:inherit;font-size:15.5px;font-weight:500;cursor:pointer}
.mh button .ic{width:20px;height:20px;flex:none}
/* Chaque ligne arrive avec un cheveu de retard : le menu se déroule au lieu de se
   poser en bloc. */
.mh.on button{animation:mhLigne .22s both cubic-bezier(.22,1,.36,1)}
.mh.on button:nth-child(1){animation-delay:.03s}
.mh.on button:nth-child(2){animation-delay:.06s}
.mh.on button:nth-child(3){animation-delay:.09s}
.mh.on button:nth-child(4){animation-delay:.12s}
.mh.on button:nth-child(5){animation-delay:.15s}
@keyframes mhLigne{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
/* Un filet TRÈS pâle : à cette hauteur de ligne, il sépare sans découper. */
.mh button + button{border-top:1px solid #ece9e4}
/* ⚠ L'EFFET DE SURVOL (Mag, 11/08/2026 : « mets un effet sur les boutons quand tu
   passes dessus, un petit effet »). Trois choses infimes qui, ensemble, donnent
   l'impression que la ligne vient à toi : elle glisse de 3 px vers la droite, le
   picto grossit un peu, et le fond noir arrive en fondu. Rien qui saute — un menu
   n'est pas un jeu, il doit juste répondre.
   ⚠ La transition est sur le BOUTON, pas seulement au survol : sans ça l'effet
   partirait d'un coup sec quand la souris s'en va. */
.mh button{transition:background .15s ease,color .15s ease,transform .15s cubic-bezier(.22,1,.36,1)}
.mh button .ic{transition:transform .15s cubic-bezier(.22,1,.36,1)}
@media (hover:hover){
  /* Le fond noir suffit à désigner — plus de glissement (18/08/2026). Le picto,
     lui, peut grossir : il grandit SOUS le curseur, il ne s'y dérobe pas. */
  .mh button:hover{background:var(--noir);color:#f2eee6}
  .mh button:hover .ic{transform:scale(1.14)}
}
/* Au doigt, il n'y a pas de survol : on répond à l'appui, en enfonçant la ligne. */
.mh button:active{background:var(--noir);color:#f2eee6;transform:scale(.98)}
@media (prefers-reduced-motion:reduce){
  .mh.on,.mh.on button{animation:none}
}
/* Sur grand écran, le rail de gauche porte déjà ces quatre entrées, écrites :
   le menu ferait doublon. */
@media (min-width:900px){ #menubtn{display:none} .mh,.mh-bg{display:none!important} }
/* ═══ LE SLIDE DES SORTIES — DES CARTES DE MENU (Mag, 11/08/2026) ═══
   Son modèle : une carte de menu. Une vignette en haut, le nom dessous, et la
   mention en bas là où un menu met le PRIX — parce que c'est bien un prix : un coup
   de fil, ou rien.
   ⚠ LA CARTE EST ÉTROITE EXPRÈS (168 px) : on en voit deux et un bout, donc on sait
   qu'il y en a d'autres à droite. Une carte pleine largeur cacherait le rail. */
/* ⚠ SANS `scroll-padding`, LE RAIL NE PEUT PAS REVENIR AU DÉBUT (Mag, 11/08/2026 :
   « il y a un mouvement qui repart à gauche, ressort de la fenêtre »).

   Le rail déborde exprès des deux côtés (marges négatives) et se redonne sa marge
   en `padding`. Mais l'accroche `scroll-snap-align:start` ne connaît pas ce
   padding : elle veut coller le bord de la première carte au bord du CADRE, pas au
   bord de la marge. Résultat, le rail refusait de se poser à 0 et repartait tout
   seul à 16 px — on le remettait au début, il glissait vers la gauche et la
   première carte sortait du cadre en perdant sa marge.

   `scroll-padding` dit à l'accroche où est vraiment le début. Le rail se pose à 0,
   la première carte garde sa marge, et plus rien ne bouge tout seul. */
.scrail{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:14px var(--pad) 6px;
  scroll-snap-type:x proximity;
  scroll-padding-left:var(--pad);scroll-padding-right:var(--pad)}
.scrail::-webkit-scrollbar{display:none}
.sc{flex:0 0 168px;scroll-snap-align:start;display:flex;flex-direction:column;
  align-items:stretch;text-align:left;padding:0;overflow:hidden;
  border-radius:14px;border:1.25px solid var(--trait);background:#fdfdfc;color:var(--noir)}
/* La vignette tient lieu de photo : la couleur, le picto, le nom de l'asso.
   ⚠ PAS DE FAUSSE PHOTO — on n'en a pas, et une image d'illustration ferait croire
   à une vraie photo du lieu. */
.sc-v{position:relative;height:108px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:8px}
/* ⚠ AGRANDIS (Mag, 13/08/2026 : « plus grand les pictos »). À 30 px le dessin se
   perdait dans la vignette ; à 46 px il devient ce qu'on lit en premier — c'est lui
   qui dit boxe ou tricot avant même le titre. Et l'opacité passe à 1 : à cette
   taille, un picto atténué a l'air délavé. */
.sc-v .ic{width:46px;height:46px;color:var(--noir);opacity:1}
.sc-v em{font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--noir);text-align:center;line-height:1.2}
/* Le public, en pastille dans le coin — seulement si la base le dit. */
.sc-v i{position:absolute;top:6px;right:6px;font-style:normal;font-family:ui-monospace,monospace;
  font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--noir);color:#f2eee6;border-radius:999px;padding:3px 7px}
.sc-j{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--enc2);padding:10px 12px 0}
.sc-t{font-size:14.5px;font-weight:600;line-height:1.22;padding:3px 12px 0;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* La ligne du bas : c'est la place du prix dans une carte de menu. */
.sc-p{margin-top:auto;font-family:ui-monospace,monospace;font-size:9px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:10px 12px 12px}
.sc-p.insc{color:#c41f1f}
.sc-p.libre{color:#2f8f5b}
/* Plus de soulèvement au survol (18/08/2026) : l'ombre portée suffit. */
@media (hover:hover){ .sc{transition:box-shadow .14s ease}
                      .sc:hover{box-shadow:0 0 0 1.5px var(--noir),0 8px 0 -3px rgba(27,27,27,.18)} }
/* Le rappel d'inscription, sous le rail à réserver : plus court que celui de la
   page Activités — ici on vient de voir les cartes, on n'a pas besoin du contexte. */
/* ⚠ PLUS UN PANNEAU D'INTERDICTION, UNE INVITATION (Mag : « mais un truc plus
   chouette »). Le rouge disait « attention danger » pour une chose qui est en fait
   une bonne nouvelle : un coup de fil et la place est prise. On garde le doré des
   choses à faire, une pastille ronde avec la bulle de parole — c'est un APPEL qu'on
   demande — et le refus n'arrive qu'en seconde ligne, comme conséquence. */
.sortnote{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  border:1.5px solid #c9940c;background:#fdf6e3;border-radius:10px;
  padding:12px 13px;margin-top:4px}
.sortnote .pic{width:32px;height:32px;flex:none;border-radius:50%;background:#c9940c;
  color:#fff;display:flex;align-items:center;justify-content:center}
.sortnote .pic svg{width:17px;height:17px}
.sortnote b{flex:1;font-size:14.5px;font-weight:700;line-height:1.25;color:#7a5a06}
.sortnote .tx{flex:1 1 100%;font-size:13px;line-height:1.4;color:var(--noir)}
.sort-i{display:flex;align-items:stretch;gap:0;width:100%;text-align:left;
  background:#fdfdfc;border:1.25px solid var(--trait);border-radius:8px;
  margin-bottom:9px;overflow:hidden;color:var(--noir)}
.sort-i.on{background:#f5c542}
.sort-i .d{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:11px 6px;border-right:1.5px solid rgba(27,27,27,.18)}
.sort-i .d em{font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#73716b}
.sort-i.on .d em{color:rgba(27,27,27,.62)}
.sort-i .d b{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.03em}
.sort-i .tx{flex:1;min-width:0;padding:11px 13px}
.sort-i .tx b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.sort-i .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:4px}
.sort-i.on .tx em{color:rgba(27,27,27,.62)}
/* Le bouton noir pleine largeur qui ferme chaque bloc. */
.lienbas.plein{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort);
  justify-content:center;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500}
.lienbas.plein .ic{color:#f2eee6}

/* La barre d'avancement : le turquoise clair qu'elle a choisi (#6FC7D9). Texte noir
   dessus — cette teinte est trop claire pour porter du crème. */
.avance{display:flex;align-items:center;gap:12px;background:#6FC7D9;border:1.25px solid var(--trait);
  border-radius:8px;padding:13px 15px;margin-top:14px}
.avance b{font-size:17px;font-weight:600;color:#0a3a44}
.avance .pts{margin-left:auto;display:flex;gap:7px;flex:none}
.avance .pts i{width:11px;height:11px;border-radius:50%;background:#cdecf3;display:block}
.avance .pts i.on{background:#0a3a44}

/* Les tâches se cochent depuis l'accueil. Faite : barrée, sur fond vert pâle. */
.tachfini{border:1.5px solid #6cb392;border-radius:12px;background:#f2faf6;padding:14px 15px;text-align:center}
.tachfini b{display:block;font-size:16px}
.tachfini em{font-style:normal;font-size:13px;color:#57554f}
.tachl{padding-top:10px}
.tach-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fdfdfc;border:1.25px solid var(--trait);border-radius:8px;padding:12px 14px;
  margin-bottom:9px;color:var(--noir)}
.tach-i .cx{flex:none;width:24px;height:24px;border:1.25px solid var(--trait);border-radius:5px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.tach-i .tx{min-width:0}
.tach-i .tx b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.tach-i .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:8.5px;
  letter-spacing:.12em;text-transform:uppercase;color:#8b8984;margin-top:3px}
.tach-i.ok{background:#eef7f1;border-color:#2f8f5b}
.tach-i.ok .cx{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
.tach-i.ok .tx b{text-decoration:line-through;color:#73716b}

/* ── QUOI DE NEUF : une famille par nouvelle, sa couleur en filet ── */
.qn-j{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--noir);padding-bottom:8px;border-bottom:2px solid var(--noir);margin:26px 0 14px}
.qn-j.un{margin-top:18px}
.qn-c{border:1px solid var(--ligne);border-left:6px solid var(--noir);background:#fdfdfc;
  padding:13px 15px;margin-bottom:10px;max-width:620px}
.qn-f{display:block;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:500;margin-bottom:5px}
.qn-c p{margin:0;font-size:14.5px;line-height:1.5;color:var(--noir)}

/* ── Les nouveautés, en bas de l'accueil (08/08/2026) ── */
.neufl{padding-top:14px}
.neuf-i{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:transparent;
  border:0;border-top:1px solid #e2e0db;border-radius:0;padding:11px 0;
  font-size:14px;line-height:1.45;color:var(--noir)}
.neuf-i:first-child{border-top:0;padding-top:2px}
/* Une pastille jaune, la couleur de l'ampoule qui vient de quitter la barre du haut :
   la section garde la couleur qu'on lui connaissait. */
.neuf-i .pt{flex:none;width:9px;height:9px;border-radius:50%;background:#f5c542;margin-top:6px}
@media (hover:hover){ .sectp:hover{background:var(--noir);color:#f2eee6;border-color:var(--trait-fort)} }
/* Carrousels : cartes 158px, la dernière volontairement coupée pour annoncer la suite */
.rail2{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1 * var(--pad));padding:14px var(--pad) 6px}
.rail2::-webkit-scrollbar{display:none}
/* Les boules « à faire aujourd'hui » */
/* Serrées, pas éparpillées d'un bout à l'autre de l'écran (Mag, 06/08/2026). */
.boules{display:flex;gap:6px;padding:16px 0 4px;justify-content:flex-start}
.boule{flex:1 1 0;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;background:transparent;border:0;padding:0}
.boule .rond{width:64px;height:64px;border-radius:50%;background:var(--noir);display:flex;align-items:center;justify-content:center}
.boule .rond .ic{width:30px;height:30px}
/* Ce qui n'a rien à faire aujourd'hui : plus de rond noir, un trait fin et un picto
   gris. Ça reste cliquable et lisible, mais ça ne réclame plus le regard
   (idée de Mag, 08/08/2026 : « griser un peu ceux qui sont inactifs »). */
.boule.dort .rond{background:transparent;border:1.5px solid var(--ligne)}
/* ── L'ANNEAU FUCHSIA DES POUBELLES (Mag, 08/08/2026) ──
   C'est la seule boule qui garde sa couleur même au repos, parce que c'est la seule
   dont la couleur EST l'information : le sac du jour a une couleur, et c'est elle
   qu'on cherche.

   ⚠ LE DÉGRADÉ A ÉTÉ RETIRÉ le 08/08/2026, l'après-midi même où il avait été posé.
   « Retire le dégradé et mets du fuchsia autour. Il faut vraiment que ce soit
   visible. » Un dégradé fuchsia → couleur du sac passe la moitié de son tour à
   ressembler au sac : sur un sac noir, la moitié de l'anneau disparaissait dans le
   rond noir. Un aplat de fuchsia ne peut pas se confondre avec quoi que ce soit.

   ⚠ ET LA DIFFÉRENCE ALLUMÉ / ÉTEINT DOIT SE VOIR. Elle passe par TROIS choses en
   même temps, pas une seule — l'épaisseur (6 px contre 2,5), l'éclat du fuchsia
   (plein contre atténué) et le halo, qui n'existe que le jour de la collecte. */
/* ⚠ ÉPAISSI LE 10/08/2026 (Mag : « le contour du picto poubelle pas assez gros
   quand il est actif »). 6 px se perdaient à côté de l'anneau du linge ; le halo
   passe de 3 à 4 px et le trait à 8 — le jour de la collecte, c'est la boule qui
   doit se voir de plus loin, c'est la seule qui a une heure limite. */
.boule .rond.deg{border:8px solid #E8308A;background:var(--noir);
  box-shadow:0 0 0 4px rgba(232,48,138,.28)}
/* Au repos : le fuchsia reste — on le voit toujours — mais plus fin, plus sourd, et
   sans halo. À côté d'une boule allumée, il n'y a pas d'hésitation possible.
   ⚠ ÉPAISSI À SON TOUR LE 12/08/2026 (Mag : « il n'y a pas assez de rose autour des
   poubelles »). 2,5 px à moitié transparents disparaissaient : depuis que la boule
   endormie remonte en deuxième position, elle est très visible, et son anneau ne
   suivait plus. Il passe à 5 px et le fuchsia se rapproche du plein.
   ⚠ ON NE VA PAS PLUS LOIN : l'écart avec l'allumée (8 px + halo) est ce qui dit
   « c'est ce soir ». Les égaliser ferait perdre la seule information qui presse. */
.boule.dort .rond.deg{border:5px solid rgba(232,48,138,.78);background:var(--noir);
  box-shadow:none}
.boule.dort .rond .ic,.boule.dort .rond svg{color:#b4b2a9!important}
.boule.dort b{color:#8b8984;font-weight:600}
.boule.dort em{color:#b4b2a9}
/* L'anneau a besoin d'air pour ne pas toucher la boule voisine. */
.boules{gap:12px}
/* ═══ LE CADRE AUTOUR DES BOULES (Mag, 08/08/2026 — idée 3 sur 4) ═══
   « Encadre ceci avec un léger trait. » Elle a choisi la 3 : le cadre n'entoure QUE
   les boules. Le titre garde sa place au-dessus, avec son trait noir — c'est la
   seule des quatre qui ne touche à rien de ce qui existait.

   ⚠ LE CADRE MANGE DE LA LARGEUR, et les boules sont déjà serrées à quatre sur un
   téléphone étroit. D'où un rembourrage horizontal volontairement chiche (10 px) :
   le trait doit se voir, pas repousser « samedi 5 septembre » sur trois lignes.
   Les boules, elles, savent rétrécir (flex:1 1 0) — c'est le texte dessous qui
   souffre en premier, et c'est lui qu'on protège ici. */
/* Le fond un peu plus blanc que la page (Mag, 08/08/2026 : « le cadre fait là un peu
   plus blanc, le fond », puis « un tout petit peu » de plus).
   Le papier de COUSIN est à #f0efed. Le cadre est monté à #f7f6f4, puis #faf9f7,
   puis #fcfbf9 — trois fois, à sa demande à chaque fois.
   ⚠ ON EST MAINTENANT À UN POINT DES CARTES DE L'APP (#fdfdfc). Autrement dit, le
   bloc EST devenu une carte claire ; c'est son choix, pris en connaissance de cause
   après que je lui ai signalé deux fois où menait le chemin. Si un jour l'accueil
   paraît chargé, c'est ici qu'il faut regarder : ce bloc et la carte noire des jeux
   se suivent, et c'est ce qui avait fait écarter l'idée 4.

   L'AIR AU-DESSUS DES PICTOS (« un peu de padding en haut des pictos ») : 16 px →
   24 px. Les ronds touchaient presque le trait du haut ; ils respirent, et le bloc
   ne grandit que de huit pixels. */
.boules{border:1px solid var(--ligne);border-radius:10px;padding:24px 10px 12px;margin-top:12px;
  background:#fcfbf9}
/* Le bac de Mag est noir avec le recyclage en blanc : sur le rond noir, on le retourne
   pour qu'il se voie — bac clair, recyclage sombre. Son dessin reste le sien. */
.boule .rond img.picoc{width:30px;height:30px;filter:invert(1)}
.boule b{font-family:ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:var(--noir)}
/* ⚠ 8,5 px EN CAPITALES ESPACÉES, C'ÉTAIT ILLISIBLE (Mag : « pas assez voyant, les
   fonts je pense »). Cette ligne porte l'information qui décide de la journée —
   l'étage et les chambres du linge, la couleur des sacs. On monte à 10 px, on serre
   l'interlettrage et on fonce le gris : c'est une consigne, pas une légende. */
.boule em{font-style:normal;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;
  line-height:1.35;text-transform:uppercase;color:#5f5e59;text-align:center;
  /* ⚠ `balance` répartit les mots également entre les deux lignes au lieu de remplir
     la première et de laisser un orphelin en dessous. C'est ce qui fait la différence
     entre « 2E ÉTAGE · 201 → / 222 » et deux lignes qui se regardent. */
  text-wrap:balance}
/* Le retour à la ligne posé à la place du « · ». Un span vide qui force la coupure :
   on garde ainsi le texte intact pour la recherche et la lecture à voix haute. */
.boule em .br{display:block;height:0}

/* ═══ LA PISTE B — CE QUI RÉCLAME PASSE EN GRAND (Mag, 20/08/2026) ═══
   « L'accueil n'est pas clair. On va refaire le design dans Claude Design. »
   Quatre écrans posés côte à côte sur un canvas (« Accueil COUSIN — on reprend ») :
   l'accueil tel qu'il était, puis trois pistes. Elle a répondu « B ».

   LE TORT DES QUATRE BOULES : elles disaient toutes la même chose avec la même
   force. Le linge à faire ce matin et les produits de samedi prochain avaient le
   même rond de 64 px, la même place, le même poids. Il fallait LIRE les quatre
   sous-titres pour savoir lequel pressait — c'est-à-dire chercher, sur la page
   faite pour ne pas chercher.

   MAINTENANT : ce qui est allumé passe en GRANDE CARTE, une par ligne, qu'on lit
   sans s'arrêter. Ce qui dort descend dans une ligne grise : présent, à portée de
   doigt, mais muet. Et le bas de l'accueil devient quatre portes.

   ⚠ C'est BIEN ELLE qui a rouvert ce bloc : le 08/08 elle avait dit « ça, tu ne
   touches pas » des quatre boules. Ne pas y revenir sans elle non plus.
   ⚠ Le CSS des boules et de la bande des jeux reste juste au-dessus, intact : si
   elle demande de remettre l'un ou l'autre, il n'y a que le rendu à rebrancher. */
.grosses{padding-top:16px;max-width:620px}
.grosse{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fdfdfc;border:1.5px solid var(--trait-fort);border-radius:14px;padding:16px;
  margin-bottom:10px;color:var(--noir);transition:transform .12s ease}
.grosse:active{transform:scale(.99)}
/* La poubelle garde son fuchsia ici aussi : c'est la seule qui annonce un JOUR. */
.grosse.poub{border-color:#E8308A}
.grosse .rd{width:62px;height:62px;border-radius:50%;background:var(--noir);flex:none;
  display:flex;align-items:center;justify-content:center}
.grosse .rd .ic{width:30px;height:30px}
.grosse .tx{flex:1;min-width:0}
.grosse .tx b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.grosse .tx em{font-style:normal;display:block;font-family:ui-monospace,monospace;font-size:9.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--enc2);margin-top:5px;line-height:1.35}
.grosse .chv{flex:none;font-size:22px;color:var(--noir)}
@media (hover:hover){ .grosse:hover{box-shadow:0 0 0 1.5px var(--noir)} }

/* Ce qui ne demande rien aujourd'hui. Les lignes gardent 40 px de haut : c'est
   silencieux, ça ne doit pas devenir impossible à viser au doigt. */
.dormeuses{display:flex;flex-direction:column;max-width:620px;
  border:1px solid var(--ligne);border-radius:8px;padding:4px 11px;background:#f6f5f3;margin-top:12px}
.dormeuses .dz{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:12px 0;min-height:40px;color:var(--enc2);
  font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.dormeuses .dz + .dz{border-top:1px solid #e4e2de}
.dormeuses .dz .ic{width:17px;height:17px;flex:none;color:#b4b2a9}

/* Les quatre portes du bas. Le nom d'abord, le compte dessous, le dessin en bas à
   droite — le même ordre que les tuiles du Centre, pour qu'on n'apprenne rien de neuf. */
.tuiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;max-width:620px}
.tuile{display:flex;flex-direction:column;justify-content:space-between;min-height:96px;
  border:1.25px solid var(--trait);border-radius:10px;padding:12px;background:#fdfdfc;
  color:var(--noir);text-align:left}
.tuile b{font-family:ui-monospace,monospace;font-size:9.5px;font-weight:500;letter-spacing:.18em;
  text-transform:uppercase;line-height:1.4}
.tuile b span{display:block;color:var(--enc2)}
.tuile .ic{width:34px;height:34px;margin:auto 0 0 auto}
.tuile:active{background:var(--noir);color:#f4f3f1}
.tuile:active b span{color:rgba(242,238,230,.6)}
@media (hover:hover){
  .tuile:hover{background:var(--noir);color:#f4f3f1}
  .tuile:hover b span{color:rgba(242,238,230,.6)}
}

/* Sur la boule ALLUMÉE, la ligne passe en noir et en gras : c'est celle qu'on lit. */
.boule:not(.dort) em{color:var(--noir);font-weight:600}
/* La pile de cartes du quiz */
/* Les proportions du design (carte 200 sur 358 de large) tenues en pourcentages :
   la pile garde le même équilibre sur un petit comme sur un grand téléphone.
   La carte du dessus peut grandir si la question est longue — pas les autres. */
/* LA CARTE RESTE CARRÉE (aspect-ratio 1) quelle que soit la largeur de l'écran —
   c'est une carte à jouer, pas une bannière (Mag, 06/08/2026). Les deux cartes du
   dessous suivent la même règle, décalées et tournées comme sur la planche. */
/* La pile est bornée : sans ça, les deux cartes du dessous (en %) s'étirent sur
   les écrans larges pendant que la carte noire, elle, reste bornée. */
/* De l'air au-dessus : l'éventail des cartes de derrière monte plus haut que la carte
   de devant, il ne doit pas venir buter dans le trait de la section. */
.pile{position:relative;margin:34px auto 26px;max-width:380px;touch-action:pan-y}
/* On fait défiler la pile au doigt pour changer de jeu (Mag, 06/08/2026). */
/* ═══ LE GLISSEMENT VERS LA DROITE FAISAIT DESCENDRE LE MENU DU NAVIGATEUR
   (Mag, 13/08/2026 : « quand tu fais un téléphone, il y a le menu qui descend à
   chaque fois, qui saute… quand tu glisses à gauche ça ne fait pas ça ») ═══

   Ce n'était pas un défaut de notre code : les deux flèches sont identiques. C'est
   le NAVIGATEUR qui s'emparait du geste. Nos écouteurs tactiles sont `passive:true`
   — ils ne peuvent donc pas dire « ce geste est à moi » — et sur un téléphone,
   tirer vers la DROITE veut dire « page précédente » (le retour arrière par
   glissement), pendant que la moindre dérive verticale fait ressortir la barre
   d'adresse. Vers la gauche, aucun geste système ne correspond : d'où l'asymétrie.

   `touch-action:pan-y` règle ça d'une ligne : le navigateur garde le défilement
   VERTICAL (on doit pouvoir faire défiler la page en partant de la carte), et nous
   laisse tout l'horizontal. Plus de retour arrière, plus de barre qui saute.
   ⚠ Ne pas mettre `none` : ça bloquerait aussi le défilement de la page. */
.pile .pcarte{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.pile .pcarte.glisse{transition:transform .28s cubic-bezier(.22,1,.36,1),opacity .28s ease}
/* La copie de la carte qui s'en va : posée au même endroit, par-dessus. */
.pile .pcarte.fantome{position:absolute;left:50%;top:0;transform:translateX(-50%);margin:0;z-index:3}
.pile .pcarte:active{cursor:grabbing}
/* La navigation suit la pile : tout au centre, les deux flèches serrées autour des
   points au lieu d'être poussées aux extrémités (Mag, 08/08/2026). */
.pilenav{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px auto 0;max-width:380px}
.pilenav .pgn{padding:0;flex:none;justify-content:center}
.pilenav .fl{width:34px;height:34px;border-radius:50%;border:1.25px solid var(--trait);
  display:flex;align-items:center;justify-content:center;background:transparent;flex:none}
.pilenav .fl .ic{width:13px;height:13px}
.pilenav .fl.droite .ic{transform:rotate(180deg)}
/* La carte du dessous laisse voir, dans son coin, le picto du jeu qui vient. */
/* Le picto du jeu suivant se met dans le BAS de la bande qui dépasse : c'est le seul
   endroit de la carte de derrière qu'on voit vraiment (Mag, 06/08/2026). */
.pile .p1.apercu{display:flex;align-items:flex-end;justify-content:flex-start;padding:11px;
  border:0;cursor:pointer;transition:transform .16s ease}
@media (hover:hover){.pile .p1.apercu:hover{transform:translateX(-50%) translateX(18px) rotate(4deg) scale(1.03)}}
.pile .p1.apercu .ic{width:25px;height:25px}
/* Les points de position, un par jeu. */
.pilenav .pilepts{flex:none}
.pilenav .pilepts i{width:5px;height:5px;border-radius:3px;background:#c2c0bb}
.pilenav .pilepts i.on{width:18px;background:var(--noir)}
/* L'invitation à glisser : sur TÉLÉPHONE, à la place des flèches. */
.glissez{flex:1;text-align:center;font-family:ui-monospace,monospace;font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--enc2)}
@media (min-width:900px){
  .glissez{display:none}
  .pilenav .pilepts{flex:1;justify-content:center}
}
/* Sur téléphone, rien sous la pile : on glisse, ou on touche la carte du dessous. */
@media (max-width:899px){ .pilenav{display:none} .pile{margin-bottom:34px} }
/* LA PILE : un vrai jeu de cartes, d'après l'image que Mag a envoyée (06/08/2026).
